<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="https://cdn.shopify.com/s/files/1/1451/3756/files/favicon_black_512x512_9c6dd2c0-fdcd-4575-887e-bf65538803af.png?v=1631720337">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4Cats Access</title>
<!-- access.html (Nov 11 2026): who can do what, as a tree. Each person: roles (presets) with a studio
     scope, then every area as level buttons and every switch as a tickbox. A setting made here is
     final for that area/switch (raises or lowers what roles give); "reset" goes back to the roles.
     Uses only the perm_* functions (4-1, 4-2, 4-3 SQL); only access.grant (owners) can change things. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f0; color: #1a1a1a; min-height: 100vh; font-size: 13px; }
button, select, input { font: inherit; }
#login-screen { display: none; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
.login-card { background: white; border-radius: 12px; border: 0.5px solid #e0e0d8; padding: 2rem; width: 100%; max-width: 380px; }
.login-card h1 { font-size: 20px; font-weight: 600; margin-bottom: 0.25rem; text-align: center; }
.login-card p { font-size: 13px; color: #888; margin-bottom: 1.5rem; text-align: center; }
.login-card input { width: 100%; padding: 10px 12px; border: 0.5px solid #d0d0c8; border-radius: 8px; font-size: 14px; margin-bottom: 10px; outline: none; display: block; }
.login-card button { width: 100%; padding: 10px; background: #1a1a1a; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
.error-msg { color: #c0392b; font-size: 12px; margin-top: 8px; }

#app { display: none; }
header { display: flex; align-items: center; gap: 14px; padding: 14px 20px; background: white; border-bottom: 0.5px solid #e0e0d8; position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 16px; font-weight: 600; }
header .who { margin-left: auto; color: #888; font-size: 12px; }
header a, header button.link { color: #1a1a1a; font-size: 12px; background: none; border: none; cursor: pointer; text-decoration: underline; }
.readonly-note { background: #fef3d6; color: #8a5a00; padding: 8px 20px; font-size: 12px; display: none; }

.layout { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 52px); }
.list { border-right: 0.5px solid #e0e0d8; background: white; display: flex; flex-direction: column; }
.list .tools { padding: 12px; border-bottom: 0.5px solid #eee; display: flex; flex-direction: column; gap: 8px; }
.list input[type=search] { width: 100%; padding: 8px 10px; border: 0.5px solid #d0d0c8; border-radius: 8px; }
.tabs { display: flex; gap: 4px; }
.tabs button { flex: 1; padding: 6px; border: 0.5px solid #d0d0c8; background: white; border-radius: 6px; cursor: pointer; font-size: 12px; }
.tabs button.on { background: #1a1a1a; color: white; border-color: #1a1a1a; }
.people { overflow-y: auto; flex: 1; }
.person { padding: 10px 12px; border-bottom: 0.5px solid #f0f0ea; cursor: pointer; }
.person:hover { background: #fafaf6; }
.person.on { background: #f0efe8; }
.person .n { font-weight: 600; }
.person .s { color: #888; font-size: 11px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: #eeede6; font-size: 11px; margin: 4px 4px 0 0; }
.chip.owner { background: #1a1a1a; color: white; }
.chip button { border: none; background: none; cursor: pointer; color: inherit; opacity: .6; font-size: 13px; line-height: 1; }

.detail { padding: 20px 24px 80px; max-width: 1040px; }
.empty { color: #888; padding: 40px 0; }

/* top: the person and their roles */
.top { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.top h2 { font-size: 20px; font-weight: 600; }
.top .sub { color: #888; margin-top: 2px; }
.roles { background: white; border: 0.5px solid #e0e0d8; border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; }
.roles .lbl { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: .04em; margin-right: 6px; }
.roles .chip { font-size: 12px; padding: 4px 10px; background: #f0efe8; }
.roles .chip.owner { background: #1a1a1a; }
.roles .chip .sc { color: #888; }
.roles .chip.owner .sc { color: #bbb; }
.addrole { display: inline-flex; gap: 6px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
.addrole select { padding: 4px 6px; border: 0.5px solid #d0d0c8; border-radius: 6px; background: white; font-size: 12px; }
.btn { padding: 5px 11px; border-radius: 7px; border: 0.5px solid #d0d0c8; background: white; cursor: pointer; font-size: 12px; }
.btn.dark { background: #1a1a1a; color: white; border-color: #1a1a1a; }
.applies { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #555; margin: 4px 0 14px; flex-wrap: wrap; }
.applies select { padding: 4px 6px; border: 0.5px solid #d0d0c8; border-radius: 6px; background: white; font-size: 12px; }
.legend { display: flex; gap: 14px; font-size: 11px; color: #777; margin-left: auto; flex-wrap: wrap; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }

/* the tree */
.tree { position: relative; padding-left: 18px; }
.tree::before { content: ''; position: absolute; left: 6px; top: 0; bottom: 18px; border-left: 2px solid #d9d7cc; }
.root { position: relative; display: inline-block; background: #1a1a1a; color: white; border-radius: 8px; padding: 7px 14px; font-weight: 600; margin: 0 0 12px -18px; }
.group { position: relative; margin-bottom: 12px; }
.group > .gname { position: relative; display: inline-flex; align-items: center; gap: 8px; background: #e8f0e2; border: 1px solid #c9dcbd; color: #2d4a22; border-radius: 8px; padding: 6px 12px; font-weight: 600; cursor: pointer; user-select: none; }
.group > .gname::before { content: ''; position: absolute; left: -13px; top: 50%; width: 12px; border-top: 2px solid #d9d7cc; }
.group > .gname .count { font-weight: 400; color: #5b7a4f; font-size: 11px; }
.group > .gname .car { font-size: 10px; color: #5b7a4f; }
.group.closed > .areas { display: none; }
.areas { position: relative; margin: 8px 0 0 26px; padding-left: 18px; }
.areas::before { content: ''; position: absolute; left: 0; top: -8px; bottom: 20px; border-left: 2px solid #e4e2d8; }
.area { position: relative; background: white; border: 0.5px solid #e0e0d8; border-radius: 8px; padding: 8px 12px; margin-bottom: 6px; }
.area::before { content: ''; position: absolute; left: -18px; top: 20px; width: 17px; border-top: 2px solid #e4e2d8; }
.area .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.area .name { font-weight: 600; min-width: 170px; }
.area .why { color: #888; font-size: 11px; margin-left: auto; text-align: right; }
.area .why a { color: #a02828; cursor: pointer; text-decoration: underline; margin-left: 6px; }
.seg { display: inline-flex; border: 0.5px solid #d0d0c8; border-radius: 7px; overflow: hidden; }
.seg button { border: none; background: white; padding: 4px 10px; font-size: 12px; cursor: pointer; border-left: 0.5px solid #e0e0d8; position: relative; color: #555; }
.seg button:first-child { border-left: none; }
.seg button.on { background: #1a1a1a; color: white; }
.seg button.on.none { background: #8a8a80; }
.seg button.base::after { content: ''; position: absolute; left: 50%; bottom: 2px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: #3f8f47; }
.seg button.on.base::after { background: #9fe0a6; }
.seg button:disabled { cursor: default; }
.switches { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 7px; padding-top: 7px; border-top: 0.5px dashed #ecebe3; }
.sw { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #333; cursor: pointer; }
.sw input { width: 15px; height: 15px; cursor: pointer; accent-color: #1a1a1a; }
.sw .k { color: #aaa; font-size: 10px; }
.sw .set { color: #2a5d8f; font-size: 10px; }
.sw .reset { color: #a02828; font-size: 10px; text-decoration: underline; cursor: pointer; }
.pin { font-size: 10px; background: #fef3d6; color: #8a5a00; border-radius: 4px; padding: 1px 5px; }
.manual .name::after { content: 'set here'; font-size: 10px; font-weight: 500; color: #2a5d8f; background: #e7f1fb; border-radius: 4px; padding: 1px 5px; margin-left: 6px; }

details.hist { margin-top: 18px; background: white; border: 0.5px solid #e0e0d8; border-radius: 10px; padding: 10px 14px; }
details.hist summary { cursor: pointer; font-weight: 600; }
.hrow { padding: 6px 0; border-top: 0.5px solid #f0f0ea; font-size: 12px; }
.hrow .meta { color: #888; font-size: 11px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: white; padding: 10px 16px; border-radius: 8px; display: none; z-index: 20; }
.toast.err { background: #a02828; }
@media (max-width: 800px) { .layout { grid-template-columns: 1fr; } .list { max-height: 40vh; } .area .why { margin-left: 0; text-align: left; width: 100%; } }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h1>4Cats Access</h1>
    <p>Sign in with your home office login</p>
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button onclick="signIn()">Sign in</button>
    <div class="error-msg" id="login-err"></div>
  </div>
</div>

<div id="app">
  <header>
    <h1>Access</h1>
    <span class="who" id="who"></span>
    <select id="as-studio" style="display:none" onchange="if (this.value) { signInAs({ studio_id: this.value }); this.value = ''; }"><option value="">👁 Sign in as a studio…</option></select>
    <a href="admin.html">Home office</a>
    <a href="hub.html">Hub</a>
    <button class="link" onclick="signOut()">Sign out</button>
  </header>
  <div class="readonly-note" id="ro-note">You can look, but only owners can change access.</div>
  <div class="layout">
    <div class="list">
      <div class="tools">
        <input type="search" id="q" placeholder="Search people" oninput="renderList()">
        <div class="tabs" id="tabs">
          <button data-k="login" class="on" onclick="setTab('login')">Home office</button>
          <button data-k="staff" onclick="setTab('staff')">Staff &amp; coordinators</button>
        </div>
      </div>
      <div class="people" id="people"></div>
    </div>
    <div class="detail" id="detail"><div class="empty">Pick a person to see and change what they can do.</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
var SUPABASE_URL = 'https://snxibhbhhchjthfmjtaj.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNueGliaGJoaGNoanRoZm1qdGFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTk2ODAsImV4cCI6MjA5MjYzNTY4MH0.K-89Mx4SxU6N1hMmtK6Q79rWAtk6VTN9b5wemQxcZVA';
var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

var STUDIO_NAMES = { 'BC-RICH-GC': 'Richmond Garden City', 'BC-RICH-STV': 'Richmond Steveston', 'BC-SUR-SSR': 'Surrey South', 'BC-YVR-KIT': 'Vancouver Kitsilano',
  'BC-YVR-MS': 'Vancouver Main Street', 'BC-YVR-UBC': 'Vancouver UBC', 'BC-YYJ-CSV': 'Victoria Cook Street Village', 'BC-YYJ-ESQ': 'Victoria Esquimalt', 'BC-YYJ-OB': 'Victoria Oak Bay',
  'BC-YYJ-VIC': 'Victoria Uptown', 'AB-YYC-ING': 'Calgary Inglewood', 'AB-STA-STA': 'St Albert', 'ON-BRL-BRL': 'Burlington South', 'ON-CMB-GLT': 'Cambridge Galt', 'ON-ERN-ERN': 'Erin',
  'ON-HAM-OS': 'Hamilton Ottawa Street', 'ON-HAM-WD': 'Hamilton Waterdown', 'ON-HAM-WH': 'Hamilton West Harbour', 'ON-KGN-AP': 'Kingston Arlington Park', 'ON-LDN-BYR': 'London Byron',
  'ON-LDN-WVG': 'London Wortley Village', 'ON-MIS-PC': 'Mississauga Port Credit', 'ON-OAK-OAK': 'Oakville North', 'ON-OAK-WST': 'Oakville West', 'ON-YOW-GLB': 'Ottawa The Glebe',
  'ON-STC-STC': 'St Catharines', 'ON-YYZ-AVE': 'Toronto Avenue Road', 'ON-YYZ-BP': 'Toronto Baby Point', 'ON-YYZ-LEA': 'Toronto Leaside', 'ON-YYZ-BEA': 'Toronto The Beaches', 'ON-WTR-WTR': 'Waterloo Uptown' };
var RANK = { none: 0, view: 1, own: 1, edit: 2, manage: 3 };
var LEVEL_NAME = { none: 'None', view: 'View', own: 'Own', edit: 'Edit', manage: 'Manage' };
var OWN_AREAS = { staff_profiles: 1, staff_scheduling: 1, timesheets: 1, hr_policies: 1 };

var CAT = null, PEOPLE = [], TAB = 'login', SEL = null, PERSON = null, busy = false;
var CLOSED = {};   // groups folded shut (remembered while the page is open)

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function $(id) { return document.getElementById(id); }
// 👁 (Nov 12 2026) Owners: sign in as someone (admin-sign-in-as): a one-time link to open in a private window
async function signInAs(who) {
  var s = await sb.auth.getSession(), tk = s && s.data && s.data.session && s.data.session.access_token;
  if (!tk) { toast('Please sign in again.', true); return; }
  toast('Making a sign-in link…');
  var r = await fetch(SUPABASE_URL + '/functions/v1/admin-sign-in-as', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + tk }, body: JSON.stringify(who) })
    .then(function (x) { return x.json(); }).catch(function () { return null; });
  if (!r || !r.ok) { toast((r && r.error) || 'That didn\u2019t work. Please try again.', true); return; }
  var copied = false; try { await navigator.clipboard.writeText(r.link); copied = true; } catch (e) {}
  var d = document.createElement('div');
  d.setAttribute('style', 'position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9999');
  d.innerHTML = '<div style="background:#fff;border-radius:14px;padding:20px 22px;max-width:520px;font:15px/1.5 system-ui,sans-serif">' +
    '<h3 style="margin:0 0 8px">👁 Sign in as ' + esc(r.name) + '</h3>' +
    '<p style="margin:0 0 10px">' + (copied ? 'The link is <b>copied</b>.' : 'Copy the link below.') + ' Open a <b>private / incognito window</b> and paste it there, so you stay signed in as yourself here. It works <b>once</b>, for a few minutes.</p>' +
    '<input readonly value="' + esc(r.link) + '" style="width:100%;font-size:12px;padding:6px;margin-bottom:12px" onclick="this.select()">' +
    '<p style="margin:0 0 12px;color:#777;font-size:13px">Anything you do there is done as ' + esc(r.name) + ', and this is noted in the Activity log. Close that window when you\u2019re done.</p>' +
    '<div style="text-align:right"><button class="btn" onclick="this.closest(\'div[style*=fixed]\').remove()">Done</button></div></div>';
  document.body.appendChild(d);
  toast(copied ? 'Link copied: paste it into a private window.' : 'Copy the link into a private window.');
}
function toast(msg, err) {
  var t = $('toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, err ? 6000 : 1800);
}
function errText(e) { return (e && (e.message || e.details)) || 'Something went wrong'; }
function byKey(list, key) { for (var i = 0; i < (list || []).length; i++) if (list[i].key === key) return list[i]; return null; }
function presetName(k) { var p = byKey(CAT.presets, k); return p ? p.name : k; }
function areaName(k) { var a = byKey(CAT.areas, k); return a ? a.name : k; }
function actionName(k) { var a = byKey(CAT.actions, k); return a ? a.name : k; }
function regionName(k) { var r = byKey(CAT.regions, k); return r ? r.name : k; }
function scopeText(x) {
  if (x.scope === 'own') return STUDIO_NAMES[x.studio_id] || x.studio_id || 'one studio';
  if (x.scope === 'region') return regionName(x.region_key);
  return 'all studios';
}
function isCopied(x) { return /^copied:/.test(x.source || ''); }
function copiedFrom(x) {
  if (/admin_access|admin_owners/.test(x.source)) return 'old Access page';
  if (/finance_access/.test(x.source)) return 'Finance list';
  if (/wage_entry/.test(x.source)) return 'wage entry list';
  if (/can_fix_memberships/.test(x.source)) return 'fix-memberships tick';
  if (/can_adjust_spaces/.test(x.source)) return 'adjust-spaces tick';
  if (/studio_coordinators/.test(x.source)) return 'Coordinators list';
  return 'today’s setup';
}
function when(t) { return t ? new Date(t).toLocaleDateString('en-CA', { month: 'short', day: 'numeric', year: 'numeric' }) : ''; }

// ---------- sign-in ----------
async function signIn() {
  $('login-err').textContent = '';
  var r = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
  if (r.error) { $('login-err').textContent = "That email and password didn't match."; return; }
  start();
}
async function signOut() { await sb.auth.signOut(); location.reload(); }
document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && $('login-screen').style.display === 'flex') signIn(); });

async function start() {
  var s = await sb.auth.getSession(), session = s.data && s.data.session;
  if (!session) { $('login-screen').style.display = 'flex'; return; }
  var c = await sb.rpc('perm_catalog');
  if (c.error) { $('login-screen').style.display = 'flex'; $('login-err').textContent = 'This login can’t see access. Ask an owner.'; return; }
  CAT = c.data;
  $('login-screen').style.display = 'none'; $('app').style.display = 'block';
  $('who').textContent = session.user.email;
  $('ro-note').style.display = CAT.can_grant ? 'none' : 'block';
  if (CAT.can_grant) { var ss = $('as-studio'); ss.style.display = ''; ss.innerHTML += Object.keys(STUDIO_NAMES).sort(function (a, b) { return STUDIO_NAMES[a].localeCompare(STUDIO_NAMES[b]); }).map(function (k) { return '<option value="' + k + '">' + esc(STUDIO_NAMES[k]) + '</option>'; }).join(''); }
  await loadPeople();
}
async function loadPeople() {
  var r = await sb.rpc('perm_people');
  if (r.error) { toast(errText(r.error), true); return; }
  PEOPLE = r.data || [];
  renderList();
}
function setTab(k) {
  TAB = k;
  var bs = $('tabs').querySelectorAll('button');
  for (var i = 0; i < bs.length; i++) bs[i].className = bs[i].getAttribute('data-k') === k ? 'on' : '';
  renderList();
}
function personId(p) { return p.kind === 'login' ? 'u:' + p.user_id : 's:' + p.staff_profile_id; }

function renderList() {
  var q = $('q').value.trim().toLowerCase();
  var rows = PEOPLE.filter(function (p) {
    return p.kind === TAB && (!q || ((p.name || '') + ' ' + (p.email || '')).toLowerCase().indexOf(q) >= 0);
  });
  if (!rows.length) { $('people').innerHTML = '<div class="empty" style="padding:16px">No one found.</div>'; return; }
  $('people').innerHTML = rows.map(function (p) {
    var chips = (p.roles || []).map(function (k) { return '<span class="chip' + (k === 'owner' ? ' owner' : '') + '">' + esc(presetName(k)) + '</span>'; }).join('');
    var sub = p.kind === 'login' ? (p.email || '') : ((p.studio_ids || []).map(function (s) { return STUDIO_NAMES[s] || s; }).join(', ') || 'All studios / floater');
    return '<div class="person' + (SEL && personId(SEL) === personId(p) ? ' on' : '') + '" onclick="pick(\'' + esc(personId(p)) + '\')"><div class="n">' +
      esc(p.name || '(no name)') + '</div><div class="s">' + esc(sub) + '</div>' + chips + '</div>';
  }).join('');
}

async function pick(pid) {
  SEL = null;
  for (var i = 0; i < PEOPLE.length; i++) if (personId(PEOPLE[i]) === pid) SEL = PEOPLE[i];
  renderList();
  if (!SEL) return;
  $('detail').innerHTML = '<div class="empty">Loading…</div>';
  await loadPerson();
}
async function loadPerson() {
  var r = await sb.rpc('perm_person', subject());
  if (r.error) { $('detail').innerHTML = '<div class="empty">' + esc(errText(r.error)) + '</div>'; return; }
  PERSON = r.data;
  renderDetail();
}
function subject() { return { p_user: SEL.kind === 'login' ? SEL.user_id : null, p_staff: SEL.kind === 'staff' ? SEL.staff_profile_id : null }; }

// ---------- what roles + copied access give (the "base"), and settings made here ----------
function model() {
  var base = {}, baseAct = {}, manual = {}, manualAct = {};
  function raise(ak, lv, why, pin) {
    var cur = base[ak];
    if (!cur || RANK[lv] > RANK[cur.level]) base[ak] = { level: lv, why: why, pin: !!pin };
  }
  (PERSON.roles || []).forEach(function (r) {
    var p = byKey(CAT.presets, r.preset_key); if (!p) return;
    var why = presetName(r.preset_key) + ' (' + scopeText(r) + ')';
    Object.keys(p.areas || {}).forEach(function (ak) { var raw = p.areas[ak]; raise(ak, raw.replace('+pin', ''), why, /\+pin$/.test(raw)); });
    (p.actions || []).forEach(function (a) { if (!baseAct[a.key]) baseAct[a.key] = { why: why, cap: a.cap, cap_pending: a.cap_pending }; });
  });
  (PERSON.addons || []).forEach(function (g) {
    if (isCopied(g)) {
      if (!g.allow) return;
      var why = 'from ' + copiedFrom(g) + (g.scope !== 'all' ? ' (' + scopeText(g) + ')' : '');
      if (g.area_key) raise(g.area_key, g.level, why);
      else if (g.action_key && !baseAct[g.action_key]) baseAct[g.action_key] = { why: why, cap: g.cap_amount };
    } else {
      if (g.area_key) manual[g.area_key] = { level: g.allow ? g.level : 'none', g: g };
      if (g.action_key) manualAct[g.action_key] = { on: g.allow, g: g };
    }
  });
  return { base: base, baseAct: baseAct, manual: manual, manualAct: manualAct };
}

function renderDetail() {
  var p = SEL, can = CAT.can_grant, m = model();
  var html = '<div class="top"><div><h2>' + esc(p.name) + '</h2><div class="sub">' +
    (p.kind === 'login' ? 'Home office login · ' + esc(p.email || '') : 'Staff profile (PIN)' + (p.role ? ' · ' + esc(p.role) : '')) + '</div></div>' +
    (can && (p.roles || []).indexOf('owner') < 0 ? '<button class="btn" title="A one-time sign-in link, to see exactly what they see" onclick="signInAs(' + esc(JSON.stringify(p.kind === 'login' ? { user_id: p.user_id } : { staff_profile_id: p.staff_profile_id })) + ')">👁 Sign in as ' + esc(p.name || 'them') + '</button>' : '') + '</div>';

  // Roles
  html += '<div class="roles"><span class="lbl">Roles</span>';
  if (!(PERSON.roles || []).length) html += '<span style="color:#888">none yet</span>';
  (PERSON.roles || []).forEach(function (r) {
    html += '<span class="chip' + (r.preset_key === 'owner' ? ' owner' : '') + '" title="' + esc(isCopied(r) ? 'From the ' + copiedFrom(r) : (r.note || '')) + '">' +
      esc(presetName(r.preset_key)) + ' <span class="sc">· ' + esc(scopeText(r)) + '</span>' +
      (can && !isCopied(r) ? '<button title="Remove role" onclick="removeRole(\'' + r.id + '\')">×</button>' : '') + '</span>';
  });
  if (can) {
    html += '<div class="addrole"><select id="r-preset">' + CAT.presets.filter(function (x) { return p.kind === 'login' || x.key !== 'owner'; })
      .map(function (x) { return '<option value="' + x.key + '">' + esc(x.name) + '</option>'; }).join('') + '</select>' +
      scopeSelect('r', '') + '<button class="btn dark" onclick="addRole()">+ Add role</button></div>';
  }
  html += '</div>';

  if (can) html += '<div class="applies">Changes below apply to ' + scopeSelect('s', defaultScope()) +
    '<span class="legend"><span><i style="background:#3f8f47"></i>what their roles give</span><span><i style="background:#1a1a1a"></i>what they have now</span></span></div>';

  // The tree
  html += '<div class="tree"><div class="root">' + esc(p.name) + '</div>';
  var groups = [], byGrp = {};
  CAT.areas.forEach(function (a) { if (!byGrp[a.grp]) { byGrp[a.grp] = []; groups.push(a.grp); } byGrp[a.grp].push(a); });
  groups.forEach(function (gname) {
    var areas = byGrp[gname], on = 0;
    areas.forEach(function (a) { var lv = m.manual[a.key] ? m.manual[a.key].level : (m.base[a.key] ? m.base[a.key].level : 'none'); if (RANK[lv] > 0) on++; });
    html += '<div class="group' + (CLOSED[gname] ? ' closed' : '') + '"><div class="gname" onclick="toggleGroup(\'' + esc(gname) + '\')"><span class="car">' + (CLOSED[gname] ? '▸' : '▾') + '</span>' +
      esc(gname) + ' <span class="count">' + on + ' of ' + areas.length + '</span></div><div class="areas">';
    areas.forEach(function (a) { html += areaRow(a, m, can); });
    html += '</div></div>';
  });
  html += '</div>';

  // History
  html += '<details class="hist"><summary>History (' + (PERSON.history || []).length + ')</summary>';
  (PERSON.history || []).forEach(function (h) {
    var d = h.details || {}, x = d['new'] || d['old'] || {};
    var what = x.preset_key ? 'Role: ' + presetName(x.preset_key) :
      x.area_key ? areaName(x.area_key) + ' → ' + (x.allow === false ? 'None' : (LEVEL_NAME[x.level] || x.level)) :
      x.action_key ? actionName(x.action_key) + ' → ' + (x.allow === false ? 'off' : 'on') : '';
    html += '<div class="hrow">' + esc(h.action) + (what ? ' · ' + esc(what) : '') +
      '<div class="meta">' + when(h.at) + ' · ' + esc(h.by || 'copied at set-up') + (x.scope && x.scope !== 'all' ? ' · ' + esc(scopeText(x)) : '') + '</div></div>';
  });
  html += '</details>';
  $('detail').innerHTML = html;
}

function areaRow(a, m, can) {
  var base = m.base[a.key], man = m.manual[a.key];
  var baseLv = base ? base.level : 'none', cur = man ? man.level : baseLv;
  var levels = OWN_AREAS[a.key] ? ['none', 'own', 'view', 'edit', 'manage'] : ['none', 'view', 'edit', 'manage'];
  var seg = '<span class="seg">' + levels.map(function (lv) {
    var cls = (lv === cur ? 'on ' : '') + (lv === baseLv ? 'base ' : '') + (lv === 'none' ? 'none' : '');
    return '<button class="' + cls + '"' + (can ? ' onclick="setArea(\'' + a.key + '\',\'' + lv + '\')"' : ' disabled') +
      ' title="' + (lv === baseLv ? 'What their roles give' : '') + '">' + LEVEL_NAME[lv] + '</button>';
  }).join('') + '</span>';
  var why = man ? 'set here' + (man.g.scope !== 'all' ? ' for ' + esc(scopeText(man.g)) : '') + (base ? ' · roles give ' + LEVEL_NAME[baseLv] : '') +
                  (can ? '<a onclick="setArea(\'' + a.key + '\',null)">reset</a>' : '')
              : (base ? esc(base.why) : '');
  var html = '<div class="area' + (man ? ' manual' : '') + '"><div class="head"><span class="name">' + esc(a.name) + '</span>' + seg +
    (base && base.pin && !man ? ' <span class="pin">needs PIN</span>' : '') + '<span class="why">' + why + '</span></div>';

  var acts = CAT.actions.filter(function (x) { return x.area_key === a.key; });
  if (acts.length) {
    html += '<div class="switches">';
    acts.forEach(function (x) {
      var b = m.baseAct[x.key], mm = m.manualAct[x.key];
      var on = mm ? mm.on : !!b;
      var cap = b && b.cap != null ? ' · up to $' + b.cap : (b && b.cap_pending ? ' · cap TBD' : '');
      var title = mm ? 'Set here' + (b ? ' (roles: on)' : ' (roles: off)') : (b ? b.why : 'Not given by their roles');
      html += '<label class="sw" title="' + esc(title) + '"><input type="checkbox"' + (on ? ' checked' : '') + (can ? ' onchange="setAction(\'' + x.key + '\', this.checked)"' : ' disabled') + '>' +
        esc(x.name) + (on ? esc(cap) : '') + ' <span class="k">' + esc(x.key) + '</span>' +
        (mm ? ' <span class="set">set here</span>' + (can ? ' <span class="reset" onclick="event.preventDefault();setAction(\'' + x.key + '\', null)">reset</span>' : '') : '') + '</label>';
    });
    html += '</div>';
  }
  return html + '</div>';
}

function toggleGroup(g) { CLOSED[g] = !CLOSED[g]; renderDetail(); }

function defaultScope() {
  var r = (PERSON.roles || [])[0];
  if (SEL.kind === 'staff' && r && r.scope === 'own') return 'own:' + r.studio_id;
  return 'all';
}
function scopeSelect(pre, chosen) {
  var opts = '<option value="all">All studios</option>' +
    '<optgroup label="Region">' + CAT.regions.map(function (r) { return '<option value="region:' + r.key + '">' + esc(r.name) + '</option>'; }).join('') + '</optgroup>' +
    '<optgroup label="One studio">' + Object.keys(STUDIO_NAMES).sort(function (a, b) { return STUDIO_NAMES[a] < STUDIO_NAMES[b] ? -1 : 1; })
      .map(function (k) { return '<option value="own:' + k + '">' + esc(STUDIO_NAMES[k]) + '</option>'; }).join('') + '</optgroup>';
  if (chosen) opts = opts.replace('value="' + chosen + '"', 'value="' + chosen + '" selected');
  return '<select id="' + pre + '-where">' + opts + '</select>';
}
function scopeArgs(pre) {
  var el = $(pre + '-where'), v = el ? el.value : 'all', parts = v.split(':');
  return { p_scope: parts[0], p_studio: parts[0] === 'own' ? parts[1] : null, p_region: parts[0] === 'region' ? parts[1] : null };
}

async function run(name, args, okMsg) {
  if (busy) return; busy = true;
  var r = await sb.rpc(name, args);
  busy = false;
  if (r.error) { toast(errText(r.error), true); await loadPerson(); return; }
  toast(okMsg);
  await loadPerson(); loadPeople();
}

async function setArea(areaKey, level) {
  var m = model(), base = m.base[areaKey], baseLv = base ? base.level : 'none';
  // picking what their roles already give = clear the setting
  var value = level === null || level === baseLv ? null : level;
  var s = scopeArgs('s'), a = subject();
  await run('perm_set_area', { p_user: a.p_user, p_staff: a.p_staff, p_area: areaKey, p_level: value,
    p_scope: s.p_scope, p_studio: s.p_studio, p_region: s.p_region }, value === null ? 'Back to what their roles give' : areaName(areaKey) + ': ' + LEVEL_NAME[level]);
}
async function setAction(actionKey, on) {
  var m = model(), baseOn = !!m.baseAct[actionKey];
  var value = on === null || on === baseOn ? null : on;
  var s = scopeArgs('s'), a = subject();
  await run('perm_set_action', { p_user: a.p_user, p_staff: a.p_staff, p_action: actionKey, p_on: value, p_cap: null,
    p_scope: s.p_scope, p_studio: s.p_studio, p_region: s.p_region }, value === null ? 'Back to what their roles give' : actionName(actionKey) + (value ? ': on' : ': off'));
}
async function addRole() {
  var a = subject(), s = scopeArgs('r');
  await run('perm_role_add', { p_user: a.p_user, p_staff: a.p_staff, p_preset: $('r-preset').value, p_scope: s.p_scope,
    p_studio: s.p_studio, p_region: s.p_region, p_note: null }, 'Role added');
}
async function removeRole(id) {
  if (!confirm('Remove this role? What it gave goes away unless another role or a setting here gives it.')) return;
  await run('perm_role_remove', { p_id: id }, 'Role removed');
}

start();
</script>
</body>
</html>
