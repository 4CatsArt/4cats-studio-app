<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="https://cdn.shopify.com/s/files/1/1451/3756/files/favicon_black_512x512_9c6dd2c0-fdcd-4575-887e-bf65538803af.png?v=1631720337">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4Cats Access</title>
<!-- access.html (Nov 11 2026): who can do what. Roles (presets) with a studio scope, per-person
     add-ons and removals, all logged. Reads and writes only through the perm_* functions
     (4-1_access_page_functions.sql); only access.grant (owners) can change anything. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f0; color: #1a1a1a; min-height: 100vh; font-size: 13px; }
button, select, input, textarea { font: inherit; }
#login-screen { display: none; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
.login-card { background: white; border-radius: 12px; border: 0.5px solid #e0e0d8; padding: 2rem; width: 100%; max-width: 380px; }
.login-card h1 { font-size: 20px; font-weight: 600; margin-bottom: 0.25rem; text-align: center; }
.login-card p { font-size: 13px; color: #888; margin-bottom: 1.5rem; text-align: center; }
.login-card input { width: 100%; padding: 10px 12px; border: 0.5px solid #d0d0c8; border-radius: 8px; font-size: 14px; margin-bottom: 10px; outline: none; display: block; }
.login-card button { width: 100%; padding: 10px; background: #1a1a1a; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
.error-msg { color: #c0392b; font-size: 12px; margin-top: 8px; }

#app { display: none; }
header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: white; border-bottom: 0.5px solid #e0e0d8; position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 16px; font-weight: 600; }
header .who { margin-left: auto; color: #888; font-size: 12px; }
header a, header button.link { color: #1a1a1a; font-size: 12px; background: none; border: none; cursor: pointer; text-decoration: underline; }
.readonly-note { background: #fef3d6; color: #8a5a00; padding: 8px 20px; font-size: 12px; display: none; }

.layout { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 52px); }
.list { border-right: 0.5px solid #e0e0d8; background: white; display: flex; flex-direction: column; }
.list .tools { padding: 12px; border-bottom: 0.5px solid #eee; display: flex; flex-direction: column; gap: 8px; }
.list input[type=search] { width: 100%; padding: 8px 10px; border: 0.5px solid #d0d0c8; border-radius: 8px; }
.tabs { display: flex; gap: 4px; }
.tabs button { flex: 1; padding: 6px; border: 0.5px solid #d0d0c8; background: white; border-radius: 6px; cursor: pointer; font-size: 12px; }
.tabs button.on { background: #1a1a1a; color: white; border-color: #1a1a1a; }
.people { overflow-y: auto; flex: 1; }
.person { padding: 10px 12px; border-bottom: 0.5px solid #f0f0ea; cursor: pointer; }
.person:hover { background: #fafaf6; }
.person.on { background: #f0efe8; }
.person .n { font-weight: 600; }
.person .s { color: #888; font-size: 11px; margin-top: 2px; }
.chip { display: inline-block; padding: 1px 7px; border-radius: 999px; background: #eeede6; font-size: 11px; margin: 3px 3px 0 0; }
.chip.owner { background: #1a1a1a; color: white; }

.detail { padding: 20px 24px 60px; max-width: 980px; }
.empty { color: #888; padding: 40px 0; }
.detail h2 { font-size: 18px; font-weight: 600; }
.detail .sub { color: #888; margin: 2px 0 16px; }
.card { background: white; border: 0.5px solid #e0e0d8; border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
.card h3 { font-size: 13px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.card h3 .hint { font-weight: 400; color: #888; font-size: 12px; }
.row { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; border-top: 0.5px solid #f0f0ea; }
.row:first-of-type { border-top: none; }
.row .main { flex: 1; }
.row .meta { color: #888; font-size: 11px; margin-top: 2px; }
.tag { font-size: 10px; padding: 1px 6px; border-radius: 4px; background: #eeede6; color: #555; margin-left: 6px; }
.tag.old { background: #e7f1fb; color: #2a5d8f; }
.tag.minus { background: #fbebeb; color: #a02828; }
.btn { padding: 6px 12px; border-radius: 7px; border: 0.5px solid #d0d0c8; background: white; cursor: pointer; font-size: 12px; }
.btn.dark { background: #1a1a1a; color: white; border-color: #1a1a1a; }
.btn.x { border: none; color: #a02828; background: none; padding: 2px 6px; }
.btn:disabled { opacity: .5; cursor: default; }
.form { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin-top: 10px; padding-top: 10px; border-top: 0.5px dashed #e0e0d8; }
.form label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: #666; }
.form select, .form input { padding: 6px 8px; border: 0.5px solid #d0d0c8; border-radius: 6px; background: white; min-width: 120px; }
.form input.wide { min-width: 240px; }

table.eff { width: 100%; border-collapse: collapse; }
table.eff th { text-align: left; font-size: 11px; color: #888; font-weight: 500; padding: 4px 6px; border-bottom: 0.5px solid #e0e0d8; }
table.eff td { padding: 5px 6px; border-bottom: 0.5px solid #f3f3ee; vertical-align: top; }
table.eff tr.grp td { font-weight: 600; color: #555; background: #fafaf6; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
.lv { display: inline-block; min-width: 56px; text-align: center; padding: 1px 6px; border-radius: 5px; font-size: 11px; }
.lv.manage { background: #1a1a1a; color: white; }
.lv.edit { background: #d9e8d5; color: #24502b; }
.lv.view { background: #eeede6; color: #555; }
.lv.own { background: #f3ecdb; color: #6b5420; }
.lv.none { color: #bbb; }
.from { color: #888; font-size: 11px; }
.hist .row .main { font-size: 12px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: white; padding: 10px 16px; border-radius: 8px; display: none; z-index: 20; }
.toast.err { background: #a02828; }
@media (max-width: 760px) { .layout { grid-template-columns: 1fr; } .list { max-height: 45vh; } }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h1>4Cats Access</h1>
    <p>Sign in with your home office login</p>
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button onclick="signIn()">Sign in</button>
    <div class="error-msg" id="login-err"></div>
  </div>
</div>

<div id="app">
  <header>
    <h1>Access</h1>
    <span class="who" id="who"></span>
    <a href="admin.html">Home office</a>
    <a href="hub.html">Hub</a>
    <button class="link" onclick="signOut()">Sign out</button>
  </header>
  <div class="readonly-note" id="ro-note">You can look, but only owners can change access.</div>
  <div class="layout">
    <div class="list">
      <div class="tools">
        <input type="search" id="q" placeholder="Search people" oninput="renderList()">
        <div class="tabs" id="tabs">
          <button data-k="login" class="on" onclick="setTab('login')">Home office</button>
          <button data-k="staff" onclick="setTab('staff')">Staff &amp; coordinators</button>
        </div>
      </div>
      <div class="people" id="people"></div>
    </div>
    <div class="detail" id="detail"><div class="empty">Pick a person to see and change what they can do.</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
var SUPABASE_URL = 'https://snxibhbhhchjthfmjtaj.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNueGliaGJoaGNoanRoZm1qdGFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTk2ODAsImV4cCI6MjA5MjYzNTY4MH0.K-89Mx4SxU6N1hMmtK6Q79rWAtk6VTN9b5wemQxcZVA';
var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

var STUDIO_NAMES = { 'BC-RICH-GC': 'Richmond Garden City', 'BC-RICH-STV': 'Richmond Steveston', 'BC-SUR-SSR': 'Surrey South', 'BC-YVR-KIT': 'Vancouver Kitsilano',
  'BC-YVR-MS': 'Vancouver Main Street', 'BC-YVR-UBC': 'Vancouver UBC', 'BC-YYJ-CSV': 'Victoria Cook Street Village', 'BC-YYJ-ESQ': 'Victoria Esquimalt', 'BC-YYJ-OB': 'Victoria Oak Bay',
  'BC-YYJ-VIC': 'Victoria Uptown', 'AB-YYC-ING': 'Calgary Inglewood', 'AB-STA-STA': 'St Albert', 'ON-BRL-BRL': 'Burlington South', 'ON-CMB-GLT': 'Cambridge Galt', 'ON-ERN-ERN': 'Erin',
  'ON-HAM-OS': 'Hamilton Ottawa Street', 'ON-HAM-WD': 'Hamilton Waterdown', 'ON-HAM-WH': 'Hamilton West Harbour', 'ON-KGN-AP': 'Kingston Arlington Park', 'ON-LDN-BYR': 'London Byron',
  'ON-LDN-WVG': 'London Wortley Village', 'ON-MIS-PC': 'Mississauga Port Credit', 'ON-OAK-OAK': 'Oakville North', 'ON-OAK-WST': 'Oakville West', 'ON-YOW-GLB': 'Ottawa The Glebe',
  'ON-STC-STC': 'St Catharines', 'ON-YYZ-AVE': 'Toronto Avenue Road', 'ON-YYZ-BP': 'Toronto Baby Point', 'ON-YYZ-LEA': 'Toronto Leaside', 'ON-YYZ-BEA': 'Toronto The Beaches', 'ON-WTR-WTR': 'Waterloo Uptown' };
var LEVEL_RANK = { view: 1, own: 1, edit: 2, manage: 3 };
var LEVEL_NAME = { view: 'View', own: 'Own records', edit: 'Edit', manage: 'Manage' };

var CAT = null;        // perm_catalog()
var PEOPLE = [];       // perm_people()
var TAB = 'login';
var SEL = null;        // the chosen person from PEOPLE
var PERSON = null;     // perm_person() for SEL
var busy = false;

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function $(id) { return document.getElementById(id); }
function toast(msg, err) {
  var t = $('toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, err ? 6000 : 2500);
}
function errText(e) { return (e && (e.message || e.details)) || 'Something went wrong'; }
function byKey(list, key) { for (var i = 0; i < (list || []).length; i++) if (list[i].key === key) return list[i]; return null; }
function presetName(k) { var p = byKey(CAT.presets, k); return p ? p.name : k; }
function areaName(k) { var a = byKey(CAT.areas, k); return a ? a.name : k; }
function actionName(k) { var a = byKey(CAT.actions, k); return a ? a.name : k; }
function regionName(k) { var r = byKey(CAT.regions, k); return r ? r.name : k; }
function scopeText(x) {
  if (x.scope === 'own') return STUDIO_NAMES[x.studio_id] || x.studio_id || 'one studio';
  if (x.scope === 'region') return regionName(x.region_key);
  return 'All studios';
}
function isCopied(x) { return /^copied:/.test(x.source || ''); }
function fromText(x) {
  if (!isCopied(x)) return '';
  if (/admin_access|admin_owners/.test(x.source)) return 'from the old Access page';
  if (/finance_access/.test(x.source)) return 'from the Finance list';
  if (/wage_entry/.test(x.source)) return 'from the wage entry list';
  if (/can_fix_memberships/.test(x.source)) return 'from the fix-memberships tick';
  if (/can_adjust_spaces/.test(x.source)) return 'from the adjust-spaces tick';
  if (/studio_coordinators/.test(x.source)) return 'from Community Points → Coordinators';
  return 'copied from today’s setup';
}
function when(t) { if (!t) return ''; var d = new Date(t); return d.toLocaleDateString('en-CA', { month: 'short', day: 'numeric', year: 'numeric' }); }

// ---------- sign-in ----------
async function signIn() {
  var email = $('email').value.trim(), password = $('password').value;
  $('login-err').textContent = '';
  var r = await sb.auth.signInWithPassword({ email: email, password: password });
  if (r.error) { $('login-err').textContent = "That email and password didn't match."; return; }
  start();
}
async function signOut() { await sb.auth.signOut(); location.reload(); }
document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && $('login-screen').style.display === 'flex') signIn(); });

async function start() {
  var s = await sb.auth.getSession();
  var session = s.data && s.data.session;
  if (!session) { $('login-screen').style.display = 'flex'; $('app').style.display = 'none'; return; }
  var c = await sb.rpc('perm_catalog');
  if (c.error) {
    $('login-screen').style.display = 'flex'; $('app').style.display = 'none';
    $('login-err').textContent = 'This login can’t see access. Ask an owner.';
    return;
  }
  CAT = c.data;
  $('login-screen').style.display = 'none'; $('app').style.display = 'block';
  $('who').textContent = session.user.email;
  $('ro-note').style.display = CAT.can_grant ? 'none' : 'block';
  await loadPeople();
}

async function loadPeople() {
  var r = await sb.rpc('perm_people');
  if (r.error) { toast(errText(r.error), true); return; }
  PEOPLE = r.data || [];
  renderList();
}

function setTab(k) {
  TAB = k;
  var bs = $('tabs').querySelectorAll('button');
  for (var i = 0; i < bs.length; i++) bs[i].className = bs[i].getAttribute('data-k') === k ? 'on' : '';
  renderList();
}

function personId(p) { return p.kind === 'login' ? 'u:' + p.user_id : 's:' + p.staff_profile_id; }

function renderList() {
  var q = $('q').value.trim().toLowerCase();
  var rows = PEOPLE.filter(function (p) {
    if (p.kind !== TAB) return false;
    if (!q) return true;
    return ((p.name || '') + ' ' + (p.email || '')).toLowerCase().indexOf(q) >= 0;
  });
  if (!rows.length) { $('people').innerHTML = '<div class="empty" style="padding:16px">No one found.</div>'; return; }
  $('people').innerHTML = rows.map(function (p) {
    var chips = (p.roles || []).map(function (k) { return '<span class="chip' + (k === 'owner' ? ' owner' : '') + '">' + esc(presetName(k)) + '</span>'; }).join('');
    var sub = p.kind === 'login' ? (p.email || '') :
      ((p.studio_ids || []).map(function (s) { return STUDIO_NAMES[s] || s; }).join(', ') || 'All studios / floater');
    var on = SEL && personId(SEL) === personId(p) ? ' on' : '';
    return '<div class="person' + on + '" onclick="pick(\'' + esc(personId(p)) + '\')"><div class="n">' + esc(p.name || '(no name)') +
      '</div><div class="s">' + esc(sub) + (p.addons ? ' · ' + p.addons + ' add-on' + (p.addons === 1 ? '' : 's') : '') + '</div>' + chips + '</div>';
  }).join('');
}

async function pick(pid) {
  SEL = null;
  for (var i = 0; i < PEOPLE.length; i++) if (personId(PEOPLE[i]) === pid) SEL = PEOPLE[i];
  renderList();
  if (!SEL) return;
  $('detail').innerHTML = '<div class="empty">Loading…</div>';
  await loadPerson();
}

async function loadPerson() {
  var r = await sb.rpc('perm_person', { p_user: SEL.kind === 'login' ? SEL.user_id : null, p_staff: SEL.kind === 'staff' ? SEL.staff_profile_id : null });
  if (r.error) { $('detail').innerHTML = '<div class="empty">' + esc(errText(r.error)) + '</div>'; return; }
  PERSON = r.data;
  renderDetail();
}

// ---------- what they can do (roles + add-ons) ----------
function effective() {
  var areas = {}, actions = {};
  (PERSON.roles || []).forEach(function (r) {
    var p = byKey(CAT.presets, r.preset_key); if (!p) return;
    Object.keys(p.areas || {}).forEach(function (ak) {
      var raw = p.areas[ak], pin = /\+pin$/.test(raw), lv = raw.replace('+pin', '');
      var cur = areas[ak];
      if (!cur || LEVEL_RANK[lv] > LEVEL_RANK[cur.level]) areas[ak] = { level: lv, pin: pin, from: presetName(r.preset_key) + ' · ' + scopeText(r) };
    });
    (p.actions || []).forEach(function (a) {
      if (!actions[a.key]) actions[a.key] = { cap: a.cap, cap_pending: a.cap_pending, from: presetName(r.preset_key) + ' · ' + scopeText(r) };
    });
  });
  (PERSON.addons || []).forEach(function (g) {
    if (!g.allow) return;
    var from = (isCopied(g) ? fromText(g) : 'add-on') + ' · ' + scopeText(g);
    if (g.area_key) {
      var cur = areas[g.area_key];
      if (!cur || LEVEL_RANK[g.level] > LEVEL_RANK[cur.level]) areas[g.area_key] = { level: g.level, from: from };
    } else if (g.action_key && !actions[g.action_key]) actions[g.action_key] = { cap: g.cap_amount, from: from };
  });
  (PERSON.addons || []).forEach(function (g) {
    if (g.allow) return;
    if (g.area_key) areas[g.area_key] = { level: null, from: 'removed: ' + (g.reason || '') };
    if (g.action_key) actions[g.action_key] = { removed: true, from: 'removed: ' + (g.reason || '') };
  });
  return { areas: areas, actions: actions };
}

function renderDetail() {
  var p = SEL, can = CAT.can_grant, eff = effective();
  var html = '<h2>' + esc(p.name) + '</h2><div class="sub">' +
    (p.kind === 'login' ? 'Home office login · ' + esc(p.email || '') : 'Staff profile (PIN)' + (p.role ? ' · ' + esc(p.role) : '')) + '</div>';

  // Roles
  html += '<div class="card"><h3>Roles <span class="hint">Starting points; everyone on a role changes together</span></h3>';
  if (!(PERSON.roles || []).length) html += '<div class="meta" style="color:#888">No role yet.</div>';
  (PERSON.roles || []).forEach(function (r) {
    html += '<div class="row"><div class="main"><b>' + esc(presetName(r.preset_key)) + '</b> · ' + esc(scopeText(r)) +
      (isCopied(r) ? '<span class="tag old">' + esc(fromText(r)) + '</span>' : '') +
      '<div class="meta">' + (r.note ? esc(r.note) + ' · ' : '') + 'since ' + when(r.created_at) + '</div></div>' +
      (can && !isCopied(r) ? '<button class="btn x" onclick="removeRole(\'' + r.id + '\')">Remove</button>' : '') + '</div>';
  });
  if (can) {
    var presets = CAT.presets.filter(function (x) { return p.kind === 'login' || x.key !== 'owner'; });
    html += '<div class="form">' +
      '<label>Role<select id="r-preset">' + presets.map(function (x) { return '<option value="' + x.key + '">' + esc(x.name) + '</option>'; }).join('') + '</select></label>' +
      scopeFields('r') +
      '<label>Note (optional)<input id="r-note" class="wide" placeholder="e.g. starts Dec 1"></label>' +
      '<button class="btn dark" onclick="addRole()">Add role</button></div>';
  }
  html += '</div>';

  // Add-ons
  html += '<div class="card"><h3>Add-ons and removals <span class="hint">Extra trust on top of a role, or something taken away</span></h3>';
  if (!(PERSON.addons || []).length) html += '<div class="meta" style="color:#888">None.</div>';
  (PERSON.addons || []).forEach(function (g) {
    var what = g.area_key ? areaName(g.area_key) + ': ' + (g.allow ? (LEVEL_NAME[g.level] || g.level) : 'no access')
                          : actionName(g.action_key) + ' (' + g.action_key + ')' + (g.cap_amount != null ? ' · up to $' + g.cap_amount : '');
    html += '<div class="row"><div class="main">' + esc(what) + ' · ' + esc(scopeText(g)) +
      (!g.allow ? '<span class="tag minus">removal</span>' : '') +
      (isCopied(g) ? '<span class="tag old">' + esc(fromText(g)) + '</span>' : '') +
      '<div class="meta">' + (g.reason ? esc(g.reason) + ' · ' : '') + (g.by_email ? esc(g.by_email) + ' · ' : '') + when(g.created_at) + '</div></div>' +
      (can && !isCopied(g) ? '<button class="btn x" onclick="removeAddon(\'' + g.id + '\')">Remove</button>' : '') + '</div>';
  });
  if (can) {
    html += '<div class="form">' +
      '<label>Kind<select id="a-kind" onchange="addonKind()"><option value="area">Area level</option><option value="action">Switch</option></select></label>' +
      '<label id="a-area-l">Area<select id="a-area">' + CAT.areas.map(function (a) { return '<option value="' + a.key + '">' + esc(a.grp + ' · ' + a.name) + '</option>'; }).join('') + '</select></label>' +
      '<label id="a-level-l">Level<select id="a-level"><option value="view">View</option><option value="edit">Edit</option><option value="manage">Manage</option><option value="own">Own records</option></select></label>' +
      '<label id="a-action-l" style="display:none">Switch<select id="a-action">' + CAT.actions.filter(function (a) { return p.kind === 'login' || a.key !== 'access.grant'; }).map(function (a) { return '<option value="' + a.key + '">' + esc(a.name) + '</option>'; }).join('') + '</select></label>' +
      '<label id="a-cap-l" style="display:none">Dollar cap (optional)<input id="a-cap" type="number" min="0" step="1" style="min-width:90px"></label>' +
      '<label>Give or take<select id="a-allow"><option value="1">Give</option><option value="0">Take away</option></select></label>' +
      scopeFields('a') +
      '<label>Reason (required)<input id="a-reason" class="wide" placeholder="e.g. schedule training done Nov 2026"></label>' +
      '<button class="btn dark" onclick="addAddon()">Add</button></div>';
  }
  html += '</div>';

  // What they can do
  html += '<div class="card"><h3>What they can do <span class="hint">Roles and add-ons together; highest level wins</span></h3><table class="eff"><tr><th>Area</th><th>Level</th><th>From</th></tr>';
  var lastGrp = '';
  CAT.areas.forEach(function (a) {
    if (a.grp !== lastGrp) { html += '<tr class="grp"><td colspan="3">' + esc(a.grp) + '</td></tr>'; lastGrp = a.grp; }
    var e = eff.areas[a.key];
    var lv = e && e.level ? '<span class="lv ' + e.level + '">' + LEVEL_NAME[e.level] + (e.pin ? ' (PIN)' : '') + '</span>' : '<span class="lv none">—</span>';
    html += '<tr><td>' + esc(a.name) + '</td><td>' + lv + '</td><td class="from">' + esc(e ? e.from : '') + '</td></tr>';
  });
  html += '<tr class="grp"><td colspan="3">Switches</td></tr>';
  var any = false;
  CAT.actions.forEach(function (a) {
    var e = eff.actions[a.key]; if (!e) return; any = true;
    html += '<tr><td>' + esc(a.name) + ' <span class="from">' + esc(a.key) + '</span></td><td>' +
      (e.removed ? '<span class="lv none">removed</span>' : '<span class="lv edit">On' + (e.cap != null ? ' · $' + e.cap : e.cap_pending ? ' · cap TBD' : '') + '</span>') +
      '</td><td class="from">' + esc(e.from) + '</td></tr>';
  });
  if (!any) html += '<tr><td colspan="3" class="from">No switches.</td></tr>';
  html += '</table></div>';

  // History
  html += '<div class="card hist"><h3>History</h3>';
  if (!(PERSON.history || []).length) html += '<div class="meta" style="color:#888">No changes yet.</div>';
  (PERSON.history || []).forEach(function (h) {
    var d = h.details || {}, x = d['new'] || d['old'] || {};
    var what = x.preset_key ? 'Role: ' + presetName(x.preset_key) : x.area_key ? areaName(x.area_key) + (x.level ? ' ' + (LEVEL_NAME[x.level] || x.level) : '') : x.action_key ? actionName(x.action_key) : '';
    html += '<div class="row"><div class="main">' + esc(h.action) + (what ? ' · ' + esc(what) : '') +
      '<div class="meta">' + when(h.at) + (h.by ? ' · ' + esc(h.by) : ' · set up') + (x.reason ? ' · ' + esc(x.reason) : '') + '</div></div></div>';
  });
  html += '</div>';

  $('detail').innerHTML = html;
}

function scopeFields(pre) {
  return '<label>Where<select id="' + pre + '-scope" onchange="scopeChange(\'' + pre + '\')"><option value="all">All studios</option><option value="region">A region</option><option value="own">One studio</option></select></label>' +
    '<label id="' + pre + '-region-l" style="display:none">Region<select id="' + pre + '-region">' + CAT.regions.map(function (r) { return '<option value="' + r.key + '">' + esc(r.name) + '</option>'; }).join('') + '</select></label>' +
    '<label id="' + pre + '-studio-l" style="display:none">Studio<select id="' + pre + '-studio">' + Object.keys(STUDIO_NAMES).sort(function (a, b) { return STUDIO_NAMES[a] < STUDIO_NAMES[b] ? -1 : 1; }).map(function (k) { return '<option value="' + k + '">' + esc(STUDIO_NAMES[k]) + '</option>'; }).join('') + '</select></label>';
}
function scopeChange(pre) {
  var v = $(pre + '-scope').value;
  $(pre + '-region-l').style.display = v === 'region' ? '' : 'none';
  $(pre + '-studio-l').style.display = v === 'own' ? '' : 'none';
}
function addonKind() {
  var area = $('a-kind').value === 'area';
  $('a-area-l').style.display = area ? '' : 'none';
  $('a-level-l').style.display = area ? '' : 'none';
  $('a-action-l').style.display = area ? 'none' : '';
  $('a-cap-l').style.display = area ? 'none' : '';
}
function subject() { return { p_user: SEL.kind === 'login' ? SEL.user_id : null, p_staff: SEL.kind === 'staff' ? SEL.staff_profile_id : null }; }
function scopeArgs(pre) { var s = $(pre + '-scope').value; return { p_scope: s, p_studio: s === 'own' ? $(pre + '-studio').value : null, p_region: s === 'region' ? $(pre + '-region').value : null }; }

async function run(name, args, okMsg) {
  if (busy) return; busy = true;
  var r = await sb.rpc(name, args);
  busy = false;
  if (r.error) { toast(errText(r.error), true); return false; }
  toast(okMsg);
  await loadPerson(); await loadPeople();
  return true;
}

async function addRole() {
  var a = subject(), s = scopeArgs('r');
  await run('perm_role_add', { p_user: a.p_user, p_staff: a.p_staff, p_preset: $('r-preset').value, p_scope: s.p_scope,
    p_studio: s.p_studio, p_region: s.p_region, p_note: $('r-note').value }, 'Role added');
}
async function removeRole(id) {
  if (!confirm('Remove this role? Anything it gave goes away unless another role or add-on gives it.')) return;
  await run('perm_role_remove', { p_id: id }, 'Role removed');
}
async function addAddon() {
  var reason = $('a-reason').value.trim();
  if (!reason) { toast('Add a reason first', true); return; }
  var a = subject(), s = scopeArgs('a'), area = $('a-kind').value === 'area', cap = $('a-cap').value;
  await run('perm_addon_add', { p_user: a.p_user, p_staff: a.p_staff,
    p_area: area ? $('a-area').value : null, p_action: area ? null : $('a-action').value,
    p_level: area ? $('a-level').value : null, p_allow: $('a-allow').value === '1',
    p_cap: !area && cap !== '' ? Number(cap) : null,
    p_scope: s.p_scope, p_studio: s.p_studio, p_region: s.p_region, p_reason: reason }, 'Saved');
}
async function removeAddon(id) {
  if (!confirm('Remove this add-on?')) return;
  await run('perm_addon_remove', { p_id: id }, 'Removed');
}

start();
</script>
</body>
</html>
