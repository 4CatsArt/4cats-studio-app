<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>4Cats Camp Check-In</title>
<link rel="icon" type="image/svg+xml" href="https://cdn.shopify.com/s/files/1/1451/3756/files/favicon.png?v=1613591354">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:#f5f5f0;color:#1a1a1a;min-height:100vh;-webkit-text-size-adjust:100%}

/* LOGIN */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
.login-card{background:white;border-radius:16px;border:0.5px solid #e0e0d8;padding:2rem;width:100%;max-width:380px}
.login-card h1{font-size:22px;font-weight:500;margin-bottom:4px;text-align:center}
.login-card p{font-size:14px;color:#888;margin-bottom:1.5rem;text-align:center}
.login-card input{width:100%;padding:12px 14px;border:0.5px solid #d0d0c8;border-radius:10px;font-size:16px;margin-bottom:12px;outline:none;display:block;-webkit-appearance:none}
.login-card input:focus{border-color:#888}
.login-card button{width:100%;padding:13px;background:#1a1a1a;color:white;border:none;border-radius:10px;font-size:16px;cursor:pointer}
.error-msg{color:#c0392b;font-size:13px;margin-top:8px;display:none}

/* APP HEADER */
#app-screen{display:none}
.app-header{background:white;border-bottom:0.5px solid #e0e0d8;padding:10px 16px;position:sticky;top:0;z-index:100}
.header-row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.header-title{font-size:17px;font-weight:600;color:#1a1a1a}
.header-sub{font-size:12px;color:#888}
.date-nav{display:flex;align-items:center;gap:8px}
.date-nav button{background:white;border:0.5px solid #d0d0c8;border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer;color:#1a1a1a}
.date-nav button:active{background:#f5f5f0}
.date-nav input[type=date]{border:0.5px solid #d0d0c8;border-radius:8px;padding:6px 10px;font-size:14px;background:white;color:#1a1a1a;-webkit-appearance:none}
.today-btn{font-size:12px;padding:5px 10px;background:#f5f5f0}

/* TABS */
.tabs{display:flex;background:white;border-bottom:0.5px solid #e0e0d8;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab-btn{flex:1;min-width:120px;padding:11px 8px;font-size:13px;font-weight:500;border:none;background:none;cursor:pointer;color:#888;border-bottom:2px solid transparent;white-space:nowrap}
.tab-btn.active{color:#1a1a1a;border-bottom-color:#1a1a1a}

/* CONTENT */
.tab-content{display:none;padding:14px 14px 80px}
.tab-content.active{display:block}

/* SESSION SELECTOR */
.session-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.session-pill{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:500;border:1.5px solid #d0d0c8;background:white;cursor:pointer;color:#555}
.session-pill.active{background:#1a1a1a;color:white;border-color:#1a1a1a}
.session-pill.am{border-color:#0F6E56}
.session-pill.am.active{background:#0F6E56;border-color:#0F6E56}
.session-pill.pm{border-color:#3C3489}
.session-pill.pm.active{background:#3C3489;border-color:#3C3489}

/* STATS BAR */
.stats-bar{display:flex;gap:10px;margin-bottom:14px}
.stat-card{background:white;border:0.5px solid #e0e0d8;border-radius:10px;padding:8px 14px;flex:1;text-align:center}
.stat-num{font-size:22px;font-weight:500}
.stat-label{font-size:11px;color:#888;margin-top:1px}

/* DAY PLAN BANNER */
.day-plan-banner{background:white;border:0.5px solid #e0e0d8;border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.day-plan-label{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.day-plan-text{font-size:14px;font-weight:500;color:#1a1a1a}
.day-plan-link{font-size:12px;color:#5b4fcf;text-decoration:none;margin-left:6px}

/* SEARCH + SORT */
.controls-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.search-input{flex:1;min-width:180px;padding:9px 12px;border:0.5px solid #d0d0c8;border-radius:10px;font-size:16px;background:white;color:#1a1a1a;-webkit-appearance:none;outline:none}
.sort-group{display:flex;gap:4px}
.sort-btn{padding:8px 12px;font-size:13px;border:0.5px solid #d0d0c8;border-radius:8px;background:white;color:#888;cursor:pointer;white-space:nowrap}
.sort-btn.active{background:#1a1a1a;color:white;border-color:#1a1a1a}

/* ROSTER CARDS — iPad-friendly big tap targets */
.roster-list{display:flex;flex-direction:column;gap:8px}
.roster-card{background:white;border:0.5px solid #e0e0d8;border-radius:12px;overflow:hidden;transition:box-shadow .1s}
.roster-card.checked-in{border-left:4px solid #3B6D11}

.roster-card-header{display:flex;align-items:center;gap:12px;padding:12px 14px}
.check-btn{width:38px;height:38px;border-radius:8px;border:2px solid #d0d0c8;background:white;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;transition:all .15s;-webkit-tap-highlight-color:transparent}
.check-btn.checked{background:#3B6D11;border-color:#3B6D11;color:white}
.check-btn:not(.checked){color:transparent}
.child-info{flex:1;min-width:0}
.child-name{font-size:16px;font-weight:500;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.child-meta{font-size:12px;color:#888;margin-top:1px}
.card-badges{display:flex;gap:6px;align-items:center;flex-shrink:0}
.session-tag{font-size:11px;font-weight:500;padding:3px 8px;border-radius:12px}
.session-tag.am{background:#E1F5EE;color:#0F6E56}
.session-tag.pm{background:#EEEDFE;color:#3C3489}
.session-tag.fd{background:#E6F1FB;color:#185FA5}
.aftercare-tag{font-size:11px;padding:3px 7px;border-radius:12px;background:#FEF3C7;color:#92400E;font-weight:500}
.walkhome-tag{font-size:11px;padding:3px 7px;border-radius:12px;background:#FEE2E2;color:#991B1B;font-weight:500}
.medical-icon{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:#c0392b;border-radius:6px;padding:2px 6px;cursor:pointer;-webkit-tap-highlight-color:transparent;letter-spacing:0.5px}

/* CARD BODY — expandable fields */
.roster-card-body{padding:0 14px 12px;display:flex;gap:10px;flex-wrap:wrap}
.field-group{display:flex;flex-direction:column;gap:3px}
.field-label{font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:.05em}
.field-input{padding:7px 10px;border:0.5px solid #e0e0d8;border-radius:8px;font-size:15px;background:#fafaf8;color:#1a1a1a;width:100%;outline:none;-webkit-appearance:none}
.field-input:focus{border-color:#888;background:white}
.table-input{width:70px}
.badge-select{min-width:160px;font-size:14px}
.badge-select option.previously-awarded{color:#bbb}
.save-row-btn{padding:7px 16px;background:#1a1a1a;color:white;border:none;border-radius:8px;font-size:13px;cursor:pointer;align-self:flex-end;white-space:nowrap}
.save-row-btn.saved{background:#3B6D11}
.card-details{padding:0 14px 10px;border-top:0.5px solid #f0f0ea;margin-top:2px}
.details-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-bottom:8px}
.details-grid-wide{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:8px}
.field-input-text{padding:7px 10px;border:0.5px solid #e0e0d8;border-radius:8px;font-size:14px;background:#fafaf8;color:#1a1a1a;width:100%;outline:none;-webkit-appearance:none}
.field-input-text:focus{border-color:#888;background:white}
.checkbox-row{display:flex;align-items:center;gap:8px;padding:8px 0}
.checkbox-row label{font-size:14px;color:#1a1a1a;cursor:pointer}
.field-checkbox{width:22px;height:22px;cursor:pointer;flex-shrink:0}

/* MEDICAL MODAL */
.modal-overlay{display:none;position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.45);z-index:500;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;padding:20px}
.modal-overlay.open{display:-webkit-flex;display:flex}
.modal-card{background:white;border-radius:16px;padding:20px;max-width:400px;width:100%;max-height:80vh;overflow-y:auto}
.modal-card h3{font-size:17px;font-weight:600;margin-bottom:12px}
.modal-row{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.modal-label{font-size:11px;color:#aaa;text-transform:uppercase;letter-spacing:.05em}
.modal-value{font-size:14px;color:#1a1a1a}
.modal-close{width:100%;padding:12px;background:#f5f5f0;border:none;border-radius:10px;font-size:15px;cursor:pointer;margin-top:8px}

/* CEREMONY TAB */
.ceremony-wrap{display:flex;flex-direction:column;align-items:center;padding:10px 0 40px;width:100%}
.mode-switcher{display:flex;gap:8px;margin-bottom:16px}
.mode-btn{padding:8px 20px;border-radius:20px;border:1.5px solid #d0d0c8;background:white;color:#888;font-size:14px;font-weight:500;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mode-btn.active{background:#1a1a1a;color:white;border-color:#1a1a1a}
.bubble-wrap{position:relative;width:100%;margin:0 auto 16px;aspect-ratio:1;background:linear-gradient(160deg,#0a0a2e 0%,#1a0533 50%,#0a1a3e 100%);border-radius:16px}
.bubble-canvas{display:block;width:100%;height:100%}
.bubble-action-btn{display:block;width:100%;margin:0 auto 12px;padding:16px;font-size:18px;font-weight:500;border:none;border-radius:12px;background:#1a1a1a;color:white;cursor:pointer;-webkit-tap-highlight-color:transparent}
.bubble-action-btn:disabled{background:#e0e0d8;color:#888;cursor:default}
.ceremony-group{width:100%;margin-bottom:32px}
.ceremony-group-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.ceremony-group-time{font-size:12px;color:#888;font-weight:400}
.wheel-wrap{position:relative;width:100%;margin:0 auto 16px;aspect-ratio:1}
canvas{border-radius:50%;display:block}
.wheel-pointer{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:28px solid #D85A30}
.spin-btn{display:block;width:100%;margin:0 auto 12px;padding:16px;font-size:18px;font-weight:500;border:none;border-radius:12px;background:#1a1a1a;color:white;cursor:pointer;-webkit-tap-highlight-color:transparent}
.spin-btn:disabled{background:#e0e0d8;color:#888;cursor:default}
.winner-box{text-align:center;min-height:56px;margin-bottom:16px}
.winner-name{font-size:24px;font-weight:600;color:#533AB7;animation:popIn .3s ease}
.winner-badge-name{font-size:13px;color:#888;margin-top:2px}
@keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.ceremony-roster{display:flex;flex-direction:column;gap:6px;width:100%}
.ceremony-kid{display:flex;align-items:center;gap:10px;padding:9px 12px;background:white;border:0.5px solid #e0e0d8;border-radius:10px;font-size:14px}
.ceremony-kid.done{background:#E1F5EE;border-color:#9FE1CB}
.ceremony-kid.greyed{opacity:.45}
.ceremony-kid-name{font-weight:500;flex:1}
.ceremony-kid-badge{font-size:12px;color:#888}
.ceremony-reset{font-size:12px;color:#888;text-align:center;margin-top:8px;cursor:pointer;text-decoration:underline}

/* QUICK CHECKIN TABLE */
.quick-table{width:100%;border-collapse:collapse;background:white;border-radius:12px;overflow:hidden;border:0.5px solid #e0e0d8}
.quick-table th{background:#f5f5f0;padding:9px 10px;font-size:11px;font-weight:500;color:#888;text-transform:uppercase;letter-spacing:.04em;text-align:left;border-bottom:0.5px solid #e0e0d8}
.quick-table td{padding:10px 10px;border-bottom:0.5px solid #f0f0ea;vertical-align:middle;font-size:14px}
.quick-table tr:last-child td{border-bottom:none}
.quick-table tr.checked-in{background:#EAF3DE}
.quick-table tr.checked-in:active{background:#d8eccc}
.quick-check-btn{width:34px;height:34px;border-radius:7px;border:2px solid #d0d0c8;background:white;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;flex-shrink:0}
.quick-check-btn.checked{background:#3B6D11;border-color:#3B6D11;color:white}
.child-name-main{font-weight:500;color:#1a1a1a;font-size:15px}
.child-age{font-size:12px;color:#aaa}
.parent-info{font-size:13px;color:#555}
.parent-phone{font-size:13px;color:#185FA5;font-weight:500}
.quick-icons{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.icon-pill{font-size:11px;padding:2px 6px;border-radius:10px;font-weight:500;white-space:nowrap}
.icon-pill.ac{background:#FEF3C7;color:#92400E}
.icon-pill.wh{background:#FEE2E2;color:#991B1B}
.notes-icon{display:inline-block;font-size:11px;font-weight:700;color:#533AB7;background:#EEEDFE;border:none;border-radius:6px;padding:2px 6px;cursor:pointer;-webkit-tap-highlight-color:transparent;letter-spacing:0.5px}
.notes-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#BA7517;margin-left:2px;vertical-align:middle}
.quick-name-input{padding:6px 8px;border:1.5px dashed #BA7517;border-radius:8px;font-size:14px;font-weight:500;color:#1a1a1a;background:#FFFBF5;width:100%;outline:none;-webkit-appearance:none}
.quick-name-input.has-name{border:none;border-bottom:1.5px solid transparent;background:transparent;padding:2px 4px;border-radius:0}
.quick-name-input.has-name:focus{border-bottom-color:#888;background:#f5f5f0;border-radius:6px}
.quick-name-input:focus{border-color:#888;background:white}

/* ADD CHILD MODAL */
.add-child-overlay{display:none;position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.45);z-index:600;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;padding:20px}
.add-child-overlay.open{display:-webkit-flex;display:flex}
.add-child-popup{background:white;border-radius:16px;padding:20px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto}
.add-child-popup h3{font-size:17px;font-weight:600;margin-bottom:4px}
.add-child-popup .sub{font-size:13px;color:#888;margin-bottom:16px}
.add-child-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.add-child-grid-wide{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:10px}
.add-child-field label{font-size:11px;color:#aaa;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px}
.add-child-field input,.add-child-field select{width:100%;padding:9px 12px;border:0.5px solid #d0d0c8;border-radius:10px;font-size:15px;background:white;color:#1a1a1a;outline:none;-webkit-appearance:none}
.add-child-field input:focus,.add-child-field select:focus{border-color:#888}
.add-child-btns{display:flex;gap:8px;margin-top:14px}
.add-child-submit{flex:1;padding:13px;background:#1a1a1a;color:white;border:none;border-radius:10px;font-size:15px;cursor:pointer}
.add-child-cancel{padding:13px 20px;background:#f5f5f0;border:none;border-radius:10px;font-size:15px;cursor:pointer;color:#555}
.lookup-btn{padding:9px 14px;background:#f5f5f0;border:0.5px solid #d0d0c8;border-radius:10px;font-size:13px;cursor:pointer;white-space:nowrap;color:#555}
.lookup-btn:active{background:#e8e8e0}
.add-child-btn{display:flex;align-items:center;gap:6px;padding:10px 16px;background:white;border:1.5px dashed #d0d0c8;border-radius:10px;font-size:14px;color:#888;cursor:pointer;margin-top:10px;width:100%;-webkit-tap-highlight-color:transparent}
.add-child-btn:active{background:#f5f5f0}

/* NOTES POPUP */
.notes-popup-overlay{display:none;position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.45);z-index:600;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;padding:20px}
.notes-popup-overlay.open{display:-webkit-flex;display:flex}
.notes-popup{background:white;border-radius:16px;padding:20px;width:100%;max-width:420px;max-height:85vh;overflow-y:auto}
.notes-popup h3{font-size:17px;font-weight:600;margin-bottom:4px}
.notes-popup .notes-sub{font-size:13px;color:#888;margin-bottom:14px}
.notes-popup textarea{width:100%;padding:10px 12px;border:0.5px solid #d0d0c8;border-radius:10px;font-size:15px;min-height:80px;resize:none;outline:none;font-family:-apple-system,BlinkMacSystemFont,sans-serif;-webkit-appearance:none}
.notes-popup textarea:focus{border-color:#888}
.pickup-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.pickup-item{display:flex;align-items:center;gap:8px;background:#f5f5f0;border-radius:10px;padding:8px 10px}
.pickup-item-text{flex:1;font-size:14px;color:#1a1a1a}
.pickup-remove{background:none;border:none;color:#c0392b;font-size:18px;cursor:pointer;padding:2px 6px;-webkit-tap-highlight-color:transparent;flex-shrink:0;line-height:1}
.pickup-add-row{display:flex;gap:8px;margin-bottom:10px}
.pickup-add-input{flex:1;padding:9px 12px;border:0.5px solid #d0d0c8;border-radius:10px;font-size:15px;outline:none;-webkit-appearance:none}
.pickup-add-input:focus{border-color:#888}
.pickup-add-btn{padding:9px 16px;background:#1a1a1a;color:white;border:none;border-radius:10px;font-size:14px;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.pickup-section-label{font-size:11px;color:#aaa;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.notes-popup-btns{display:flex;gap:8px;margin-top:12px}
.notes-save-btn{flex:1;padding:12px;background:#1a1a1a;color:white;border:none;border-radius:10px;font-size:15px;cursor:pointer}
.notes-cancel-btn{padding:12px 20px;background:#f5f5f0;border:none;border-radius:10px;font-size:15px;cursor:pointer;color:#555}

/* FINALE */
.finale-overlay{display:none;position:fixed;top:0;right:0;bottom:0;left:0;z-index:950;background:linear-gradient(135deg,#1a0533 0%,#0a1a3e 50%,#0d2b00 100%);-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;-webkit-flex-direction:column;flex-direction:column;text-align:center;padding:30px}
.finale-overlay.open{display:-webkit-flex;display:flex}
.finale-stars{font-size:60px;margin-bottom:16px;animation:spin3d 3s linear infinite}
.finale-title{font-size:52px;font-weight:700;color:white;margin-bottom:12px;animation:revealPop .5s ease}
.finale-sub{font-size:22px;color:rgba(255,255,255,.7);margin-bottom:40px}
.finale-btn{padding:22px 60px;background:white;color:#1a0533;border:none;border-radius:40px;font-size:22px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;animation:pulse 1.5s ease-in-out infinite}
.finale-close{margin-top:24px;font-size:14px;color:rgba(255,255,255,.4);cursor:pointer;text-decoration:underline}
@keyframes spin3d{0%{transform:rotateY(0deg)}100%{transform:rotateY(360deg)}}

/* BADGE REVEAL OVERLAY */
.reveal-overlay{display:none;position:fixed;top:0;right:0;bottom:0;left:0;z-index:900;background:#1a0533;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;-webkit-flex-direction:column;flex-direction:column;text-align:center;padding:20px;cursor:pointer}
.reveal-overlay.open{display:-webkit-flex;display:flex}
.reveal-overlay.open.tapped{cursor:default}
.reveal-pre{color:white}
.reveal-pre-name{font-size:52px;font-weight:700;color:white;margin-bottom:8px;animation:revealPop .4s ease}
.reveal-pre-tap{font-size:22px;color:rgba(255,255,255,.7);animation:pulse 1.2s ease-in-out infinite}
.reveal-badge-wrap{display:none;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;-webkit-flex-direction:column;flex-direction:column}
.reveal-badge-wrap.show{display:-webkit-flex;display:flex;animation:revealPop .5s cubic-bezier(.175,.885,.32,1.275)}
.reveal-badge-circle{width:220px;height:220px;border-radius:50%;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;margin-bottom:24px;position:relative}
.reveal-badge-emoji{font-size:90px;line-height:1}
.reveal-badge-name{font-size:38px;font-weight:700;color:white;margin-bottom:8px;text-shadow:0 2px 20px rgba(0,0,0,.3)}
.reveal-badge-sub{font-size:20px;color:rgba(255,255,255,.75)}
.reveal-next-btn{margin-top:32px;padding:16px 48px;background:rgba(255,255,255,.15);color:white;border:2px solid rgba(255,255,255,.4);border-radius:40px;font-size:18px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.reveal-next-btn:active{background:rgba(255,255,255,.25)}

// -- FETCH HELPERS ------------------------------------------------
function authHeaders() {
  return {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + (accessToken || SUPABASE_KEY),
    'Content-Type': 'application/json'
  }
}

function sbGet(path) {
  return fetch(SUPABASE_URL + '/rest/v1/' + path, {
    method: 'GET',
    headers: authHeaders()
  }).then(function(r) { return r.json() })
}

function sbPost(path, body) {
  return fetch(SUPABASE_URL + '/rest/v1/' + path, {
    method: 'POST',
    headers: Object.assign({}, authHeaders(), { 'Prefer': 'return=representation' }),
    body: JSON.stringify(body)
  }).then(function(r) { return r.json() })
}

function sbPatch(path, body) {
  return fetch(SUPABASE_URL + '/rest/v1/' + path, {
    method: 'PATCH',
    headers: Object.assign({}, authHeaders(), { 'Prefer': 'return=representation' }),
    body: JSON.stringify(body)
  }).then(function(r) { return r.json() })
}

function sbUpsert(table, body, onConflict) {
  var qs = onConflict ? '?on_conflict=' + onConflict : ''
  return fetch(SUPABASE_URL + '/rest/v1/' + table + qs, {
    method: 'POST',
    headers: Object.assign({}, authHeaders(), { 'Prefer': 'resolution=merge-duplicates,return=representation' }),
    body: JSON.stringify(body)
  }).then(function(r) { return r.json() })
}

// -- AUTH ----------------------------------------------------------
function doLogin() {
  if (loginBusy) return
  var email = document.getElementById('login-email').value.trim()
  var pass  = document.getElementById('login-password').value
  var errEl = document.getElementById('login-error')
  var btn   = document.querySelector('.login-card button')
  errEl.style.display = 'none'
  if (!email || !pass) {
    errEl.textContent = 'Please enter email and password.'
    errEl.style.display = 'block'
    return
  }
  loginBusy = true
  btn.textContent = 'Signing in...'

  fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, password: pass })
  }).then(function(r) {
    return r.json()
  }).then(function(data) {
    if (data.error || data.error_description || !data.access_token) {
      loginBusy = false
      btn.textContent = 'Sign In'
      errEl.textContent = data.error_description || data.error || 'Login failed. Please try again.'
      errEl.style.display = 'block'
      return
    }
    accessToken = data.access_token
    currentUserId = data.user && data.user.id
    // Save session to localStorage for reload persistence
    try {
      localStorage.setItem('cc_token', data.access_token)
      localStorage.setItem('cc_uid', currentUserId)
      if (data.refresh_token) localStorage.setItem('cc_refresh', data.refresh_token)
    } catch(e) {}
    initApp()
  }).catch(function(e) {
    loginBusy = false
    btn.textContent = 'Sign In'
    errEl.textContent = 'Network error. Please check your connection.'
    errEl.style.display = 'block'
  })
}

function openCeremony() {

function doSignOut() {
  fetch(SUPABASE_URL + '/auth/v1/logout', {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + accessToken }
  })
  accessToken = null; currentUserId = null; currentStudioId = null; allChildren = []
  try { localStorage.removeItem('cc_token'); localStorage.removeItem('cc_uid') } catch(e) {}
  document.getElementById('login-screen').style.display = 'flex'
  document.getElementById('app-screen').style.display = 'none'
}

function refreshToken() {
  try {
    var refresh = localStorage.getItem('cc_refresh')
    if (!refresh) return
    fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: refresh })
    }).then(function(r) { return r.json() }).then(function(data) {
      if (data && data.access_token) {
        accessToken = data.access_token
        try {
          localStorage.setItem('cc_token', data.access_token)
          if (data.refresh_token) localStorage.setItem('cc_refresh', data.refresh_token)
        } catch(e) {}
      }
    }).catch(function() {})
  } catch(e) {}
}

function tryRestoreSession() {
  try {
    var token = localStorage.getItem('cc_token')
    var uid   = localStorage.getItem('cc_uid')
    if (!token || !uid) return
    // Verify token is still valid
    fetch(SUPABASE_URL + '/auth/v1/user', {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + token }
    }).then(function(r) { return r.json() }).then(function(data) {
      if (data && data.id) {
        accessToken = token
        currentUserId = data.id
        initApp()
      } else {
        try { localStorage.removeItem('cc_token'); localStorage.removeItem('cc_uid') } catch(e) {}
      }
    }).catch(function() {})
  } catch(e) {}
}

    if (!rows || !rows.length || rows.error) {
      loginBusy = false
      if (btn) btn.textContent = 'Sign In'
      var errEl = document.getElementById('login-error')
      errEl.textContent = rows && rows.message ? rows.message : 'No studio linked to this account. Contact home office.'
      errEl.style.display = 'block'
      return
    }
    currentStudioId = rows[0].studio_id
    sbGet('studios?select=name,city,province&id=eq.' + currentStudioId + '&limit=1').then(function(studios) {
      var studio = (studios && studios.length) ? studios[0] : {}
      var label = (studio.name || '') + (studio.city ? ' - ' + studio.city : '')
      document.getElementById('studio-label').textContent = label
      document.getElementById('login-screen').style.display = 'none'
      document.getElementById('app-screen').style.display = 'block'
      loginBusy = false
      if (btn) btn.textContent = 'Sign In'
      loadCurriculumData()
      syncDatePicker()
      loadDay()
      // Refresh token every 45 minutes to prevent expiry during long sessions
      setInterval(refreshToken, 45 * 60 * 1000)
    }).catch(function(e) {
      loginBusy = false
      if (btn) btn.textContent = 'Sign In'
      document.getElementById('login-error').textContent = 'Could not load studio info. Try again.'
      document.getElementById('login-error').style.display = 'block'
    })
  }).catch(function(e) {
    loginBusy = false
    if (btn) btn.textContent = 'Sign In'
    document.getElementById('login-error').textContent = 'Login error. Please try again.'
    document.getElementById('login-error').style.display = 'block'
  })
}

// Run on page load
document.addEventListener('DOMContentLoaded', function() {
  // Event delegation for medical icon taps
  document.addEventListener('click', function(e) {
    // Walk up the DOM to handle taps on child elements (e.g. notes-dot inside button)
    var el = e.target
    var found = null
    while (el && el !== document.body) {
      var cls = (el.className && typeof el.className === 'string') ? el.className : ''
      if (cls.indexOf('medical-icon') >= 0) { found = 'medical'; break }
      if (cls.indexOf('notes-icon') >= 0) { found = 'notes'; break }
      el = el.parentNode
    }
    if (!found || !el) return
    var uid = el.getAttribute('data-uid')
    if (!uid) return
    if (found === 'medical') showMedical(uid)
    if (found === 'notes') openNotes(uid)
  })
  document.getElementById('login-password').addEventListener('keydown', function(e) {
    if (e.keyCode === 13) doLogin()
  })
  document.getElementById('login-email').addEventListener('keydown', function(e) {
    if (e.keyCode === 13) doLogin()
  })
  tryRestoreSession()
  // Pre-warm AudioContext on first tap - iOS requires user gesture
  document.addEventListener('touchstart', function warmAudio() {
    var ctx = getAudioCtx()
    if (ctx && ctx.state === 'suspended') ctx.resume()
    document.removeEventListener('touchstart', warmAudio)
  }, { once: true })
})

// -- DATE NAV -----------------------------------------------------
function dateStr(d) { return d.toLocaleDateString('en-CA') }
function addDays(d, n) { var r = new Date(d); r.setDate(r.getDate() + n); return r }
function shiftDate(n) { currentDate = addDays(currentDate, n); syncDatePicker(); loadDay() }
function pickDate(v) { currentDate = new Date(v + 'T12:00:00'); syncDatePicker(); loadDay() }
function goToday() { currentDate = new Date(); syncDatePicker(); loadDay() }
function syncDatePicker() { document.getElementById('date-picker').value = dateStr(currentDate) }

// -- SESSION GROUP -------------------------------------------------
function sessionGroup(title) {
  var t = (title || '').toLowerCase()
  if (t.indexOf('half day morning') >= 0 || t.indexOf('half-day morning') >= 0) return 'am'
  if (t.indexOf('half day afternoon') >= 0 || t.indexOf('half-day afternoon') >= 0) return 'pm'
  return 'fd'
}

// -- CURRICULUM ----------------------------------------------------
function loadCurriculumData() {
  sbGet('curriculum_weeks?select=*').then(function(data) {
    curriculumData = (data && !data.error) ? data : []
  }).catch(function() { curriculumData = [] })
}

function getCurriculumLinks(sessionTitle, sessionDate) {
  var titleLower = (sessionTitle || '').toLowerCase()
  for (var i = 0; i < curriculumData.length; i++) {
    var r = curriculumData[i]
    if (r.session_type_key && !r.week_start && titleLower.indexOf(r.session_type_key.toLowerCase()) >= 0) {
      if (r.curriculum_url) return r
    }
  }
  for (var j = 0; j < curriculumData.length; j++) {
    var w = curriculumData[j]
    if (w.week_start && w.week_end && sessionDate >= w.week_start && sessionDate <= w.week_end) return w
  }
  return null
}

// -- LOAD DAY ------------------------------------------------------
function startAttendancePoll() {
  stopAttendancePoll()
  pollInterval = setInterval(function() {
    refreshAttendance()
  }, 20000)  // every 20 seconds
}

function stopAttendancePoll() {
  if (pollInterval) { clearInterval(pollInterval); pollInterval = null }
}

function refreshAttendance() {
  if (!currentStudioId || !allChildren.length) return
  var today = dateStr(currentDate)
  // Get session IDs from current children
  var sessionIds = []
  allChildren.forEach(function(c) {
    if (c.sessionId && sessionIds.indexOf(c.sessionId) < 0) sessionIds.push(c.sessionId)
  })
  if (!sessionIds.length) return

  // Get order names for tally lookup
  var orderNames = []
  allChildren.forEach(function(c) { if (c.orderName && orderNames.indexOf(c.orderName) < 0) orderNames.push(c.orderName) })

  var attPromise = sbGet('attendance?select=session_id,shopify_order_name,camper_name,attended,table_number,checked_out_by,alternate_pickup&session_id=in.(' + sessionIds.join(',') + ')&attended_date=eq.' + today)
  Promise.all([attPromise]).then(function(results) {
    var attRows = Array.isArray(results[0]) ? results[0] : []
    var changed = false

    attRows.forEach(function(a) {
      var key = a.shopify_order_name + '|' + (a.camper_name || '').toLowerCase().trim()
      allChildren.forEach(function(c) {
        var cKey = c.orderName + '|' + c.name.toLowerCase().trim()
        if (cKey !== key) return
        // Check-in status
        if (c.attendanceChecked !== a.attended) { c.attendanceChecked = a.attended; changed = true }
        // Table number
        if (a.table_number !== undefined && c.table !== String(a.table_number || '')) {
          c.table = a.table_number ? String(a.table_number) : ''; changed = true
        }
        // Checkout
        if ((a.checked_out_by || '') !== (c.checkedOutBy || '')) {
          c.checkedOutBy = a.checked_out_by || ''; changed = true
        }
        // Alternate pickup
        if ((a.alternate_pickup || '') !== (c.alternatePick || '')) {
          c.alternatePick = a.alternate_pickup || ''; changed = true
        }
      })
    })

    if (changed) {
      updateStatsBar()
      renderQuickRows()
      // Also refresh checkout tab if visible
      var coActive = document.getElementById('tab-checkout') && document.getElementById('tab-checkout').classList.contains('active')
      if (coActive) renderCheckoutTab()
      showToast('Updated!')
    }
  }).catch(function() {})
}

function loadDay() {
  stopAttendancePoll()
  document.getElementById('checkin-content').innerHTML = '<div class="loading">Loading...</div>'
  allChildren = []
  var today = dateStr(currentDate)

  var sessionsUrl = 'sessions?select=id,title,session_time&studio_id=eq.' + currentStudioId + '&session_date=eq.' + today + '&order=session_time'
  sbGet(sessionsUrl).then(function(sessions) {
    if (!sessions || sessions.code || sessions.error) {
      document.getElementById('checkin-content').textContent = 'Load error: ' + JSON.stringify(sessions)
      return
    }
    sessions = sessions || []
    var campSessions = sessions.filter(function(s) {
      var t = (s.title || '').toLowerCase()
      return t.indexOf('camp') >= 0 || t.indexOf('pa day') >= 0 || t.indexOf('pd day') >= 0 || t.indexOf('no school') >= 0
    })
    if (!campSessions.length) {
      document.getElementById('checkin-content').innerHTML = '<div class="empty">No camp sessions found for this date.<br><small style="color:#bbb">Looking for: ' + today + ' - Studio: ' + currentStudioId + '</small></div>'
      renderWheels()
      return
    }
    var sessionIds = campSessions.map(function(s) { return s.id })
    var sessionIdFilter = 'session_id=in.(' + sessionIds.join(',') + ')'
    var staffPromise = sbGet('session_staff?select=session_id,camp_day&' + sessionIdFilter)

    var bookingsPromise = sbGet('bookings?select=id,session_id,customer_name,customer_email,customer_phone,shopify_order_name,qty,raw_payload,event_date,order_note,aftercare,returned_at&' + sessionIdFilter)

    bookingsPromise.then(function(bookings) {
      if (!bookings || bookings.code) { document.getElementById('checkin-content').textContent = 'Bookings error: ' + JSON.stringify(bookings); return }
      bookings = bookings || []
      var activeBookings = bookings.filter(function(b) {
        return !(b.returned_at && (b.qty || 0) === 0)
      })
      var orderNames = []
      activeBookings.forEach(function(b) {
        if (b.shopify_order_name && orderNames.indexOf(b.shopify_order_name) < 0) orderNames.push(b.shopify_order_name)
      })

      var tallyPromise = orderNames.length
        ? sbGet('tally_registrations?select=*&shopify_order_name=in.(' + orderNames.map(function(n){ return encodeURIComponent(n) }).join(',') + ')')
        : Promise.resolve([])

      var attPromise = sbGet('attendance?select=session_id,shopify_order_name,camper_name,attended,table_number,alternate_pickup,checked_out_by,aftercare&attended_date=eq.' + today + '&' + sessionIdFilter)

      var badgePromise = orderNames.length
        ? sbGet('camp_daily_badges?select=order_name,camper_name,badge_name,session_date&order_name=in.(' + orderNames.map(function(n){ return encodeURIComponent(n) }).join(',') + ')')
        : Promise.resolve([])

      Promise.all([tallyPromise, attPromise, badgePromise, staffPromise]).then(function(results) {
        if (!results) { document.getElementById('checkin-content').textContent = 'Promise.all failed'; return }
        var tallyRows  = Array.isArray(results[0]) ? results[0] : []
        var attRows    = Array.isArray(results[1]) ? results[1] : []
        var badgeRows  = Array.isArray(results[2]) ? results[2] : []

        var tallyMap = {}
        tallyRows.forEach(function(t) {
          if (!tallyMap[t.shopify_order_name]) tallyMap[t.shopify_order_name] = []
          tallyMap[t.shopify_order_name].push(t)
        })

        var attendanceMap = {}
        attRows.forEach(function(a) {
          var k = a.shopify_order_name + '|' + (a.camper_name || '').toLowerCase().trim()
          attendanceMap[k] = a
        })

        badgeHistory = {}
        badgeRows.forEach(function(b) {
          var k = b.order_name + '|' + (b.camper_name || '').toLowerCase().trim()
          if (!badgeHistory[k]) badgeHistory[k] = []
          badgeHistory[k].push({ badge: b.badge_name, date: b.session_date })
        })

        campSessions.forEach(function(session) {
          var group = sessionGroup(session.title)
          var sessionBookings = activeBookings.filter(function(b) { return b.session_id === session.id })
          sessionBookings.forEach(function(b) {
            var matchingItems = getMatchingLineItems(b.raw_payload, b.event_date)
            var participants = []
            matchingItems.forEach(function(item) {
              var itemProps = (item.properties || [])
                .filter(function(p) { return p.name && p.name.toLowerCase().indexOf('participant') === 0 })
                .map(function(p) {
                  var name = p.value.split('|')[0].trim() || p.value
                  var dob = null
                  var dobIdx = p.value.indexOf('DOB:')
                  if (dobIdx >= 0) { var dobStr = p.value.substring(dobIdx + 4).trim(); if (dobStr.length >= 10) dob = dobStr.substring(0, 10) }
                  var tRows = tallyMap[b.shopify_order_name] || []
                  var tally = null
                  for (var ti = 0; ti < tRows.length; ti++) {
                    if ((tRows[ti].camper_name || '').toLowerCase().trim() === name.toLowerCase().trim()) { tally = tRows[ti]; break }
                  }
                  return { name: name, dob: dob, tally: tally }
                })
              itemProps.forEach(function(p) { participants.push(p) })
            })

            if (!participants.length) {
              var tRows2 = tallyMap[b.shopify_order_name] || []
              var seen2 = []
              tRows2.forEach(function(t) {
                var n = (t.camper_name || '').toLowerCase().trim()
                if (seen2.indexOf(n) < 0) { seen2.push(n); participants.push({ name: t.camper_name, dob: null, tally: t }) }
              })
            }
            if (!participants.length) participants = [{ name: '', dob: null, tally: null }]

            participants.forEach(function(p) {
              var t = p.tally || {}
              var camperName = p.name || ''
              var attKey = b.shopify_order_name + '|' + camperName.toLowerCase().trim()
              var att = attendanceMap[attKey] || null
              var badgeKey = b.shopify_order_name + '|' + camperName.toLowerCase().trim()
              var bHist = badgeHistory[badgeKey] || []
              var todayBadge = null
              for (var bi = 0; bi < bHist.length; bi++) { if (bHist[bi].date === today) { todayBadge = bHist[bi]; break } }
              var uid = makeUid(b.shopify_order_name + '-' + camperName)
              allChildren.push({
                _uid: uid,
                name: camperName,
                dob: p.dob || null,
                age: t.camper_age || null,
                sessionId: session.id,
                sessionTitle: session.title,
                sessionGroup: group,
                sessionNotes: '',
                orderName: b.shopify_order_name,
                registeredBy: b.customer_name || '',
                phone: t.parent_phone || b.customer_phone || getPayloadPhone(b.raw_payload) || '',
                emergency: (t.emergency_contact_name || '') + (t.emergency_contact_phone ? ' ' + t.emergency_contact_phone : ''),
                walkHome: t.walk_home || false,
                medical: t.medical_notes || '',
                aftercare: t.aftercare || b.aftercare || false,
                tallyId: t.id || null,
                attendanceChecked: att ? att.attended : false,
                table: (att && att.table_number) ? String(att.table_number) : '',
                badge: todayBadge ? todayBadge.badge : '',
                notes: t.notes || b.order_note || '',
                alternatePick: (att && att.alternate_pickup) ? att.alternate_pickup : '',
                checkedOutBy: (att && att.checked_out_by) ? att.checked_out_by : '',
                    awardedBadges: bHist.map(function(bh) { return bh.badge })
              })
            })
          })
        })

        // Deduplicate
        var seen = []
        allChildren = allChildren.filter(function(c) {
          var k = c.orderName + '|' + c.name.toLowerCase().trim()
          if (seen.indexOf(k) >= 0) return false
          seen.push(k); return true
        })

        // Build day plan from session_staff camp_day
        var staffRows = Array.isArray(results[3]) ? results[3] : []
        var staffMap = {}
        staffRows.forEach(function(r) { if (r.session_id) staffMap[r.session_id] = r })
        // Get unique camp days across all camp sessions for today
        var campDays = []
        campSessions.forEach(function(s) {
          var sr = staffMap[s.id]
          if (sr && sr.camp_day && campDays.indexOf(sr.camp_day) < 0) campDays.push(sr.camp_day)
        })
        var dayPlanText = campDays.join(' / ')
        renderQuickCheckin(dayPlanText, campSessions)
        renderWheels()
        startAttendancePoll()
      }).catch(function(e) {
        document.getElementById('checkin-content').textContent = 'Inner error: ' + (e.message || String(e))
      })
    }).catch(function(e) {
      document.getElementById('checkin-content').textContent = 'Bookings error: ' + (e.message || String(e))
    })
  }).catch(function(e) {
    document.getElementById('checkin-content').textContent = 'Error: ' + (e.message || String(e))
  })
}

// -- RENDER CHECK-IN -----------------------------------------------
function getSorted() {
  var searchEl = document.getElementById('search-input')
  var q = searchEl ? searchEl.value.toLowerCase() : ''
  var list = allChildren.filter(function(c) {
    return !q || c.name.toLowerCase().indexOf(q) >= 0 || c.registeredBy.toLowerCase().indexOf(q) >= 0
  })
  list.sort(function(a, b) {
    var av = sortKey === 'name' ? a.name : sortKey === 'parent' ? a.registeredBy : (parseInt(a.table) || 999)
    var bv = sortKey === 'name' ? b.name : sortKey === 'parent' ? b.registeredBy : (parseInt(b.table) || 999)
    if (av < bv) return -1 * sortDir
    if (av > bv) return 1 * sortDir
    return 0
  })
  return list
}

function setSort(key) {
  if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1 }
  renderQuickRows()
}

function renderCheckin(dayPlanText, campSessions) {
  var checkedIn = allChildren.filter(function(c) { return c.attendanceChecked }).length
  var total = allChildren.length
  var aftercareCount = allChildren.filter(function(c) { return c.aftercare }).length
  var badgedCount = allChildren.filter(function(c) { return c.badge }).length
  var today = dateStr(currentDate)

  var html = '<div class="stats-bar">'
  html += '<div class="stat-card"><div class="stat-num">' + total + '</div><div class="stat-label">Registered</div></div>'
  html += '<div class="stat-card"><div class="stat-num" style="color:#3B6D11">' + checkedIn + '</div><div class="stat-label">Checked In</div></div>'
  html += '<div class="stat-card"><div class="stat-num" style="color:#92400E">' + aftercareCount + '</div><div class="stat-label">Aftercare</div></div>'
  html += '<div class="stat-card"><div class="stat-num" style="color:#533AB7">' + badgedCount + '</div><div class="stat-label">Badged</div></div>'
  html += '</div>'

  var links = []
  campSessions.forEach(function(s) {
    var cl = getCurriculumLinks(s.title, today)
    if (cl && cl.curriculum_url) {
      var dup = false; links.forEach(function(l) { if (l.url === cl.curriculum_url) dup = true })
      if (!dup) links.push({ url: cl.curriculum_url, label: 'Curriculum' })
    }
  })
  if (dayPlanText || campSessions.length) {
    var linkHtml = links.map(function(l) {
      return '<a href="' + l.url + '" target="_blank" style="font-size:13px;color:#2e7d32;text-decoration:none;padding:5px 12px;border:0.5px solid #a5d6a7;border-radius:8px;background:#e8f5e9;white-space:nowrap">' + l.label + '</a>'
    }).join(' ')
    html += '<div class="day-plan-banner"><div style="flex:1"><div class="day-plan-label">Today&#39;s Plan</div><div class="day-plan-text">' + (dayPlanText || 'Camp day') + '</div></div>'
    if (linkHtml) html += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">' + linkHtml + '</div>'
    html += '</div>'
  }

  html += '<div class="controls-row">'
  html += '<input class="search-input" id="search-input" type="search" placeholder="Search child or parent..." oninput="renderCheckinList()">'
  html += '<div class="sort-group">'
  html += '<button class="sort-btn' + (sortKey==='name'?' active':'') + '" onclick="setSort(&quot;name&quot;)">Name</button>'
  html += '<button class="sort-btn' + (sortKey==='parent'?' active':'') + '" onclick="setSort(&quot;parent&quot;)">Parent</button>'
  html += '<button class="sort-btn' + (sortKey==='table'?' active':'') + '" onclick="setSort(&quot;table&quot;)">Table</button>'
  html += '</div></div>'
  html += '<div class="roster-list" id="roster-list"></div>'

  document.getElementById('checkin-content').innerHTML = html
  renderCheckinList()
}

function saveRow(uid) {
  var c = null
  allChildren.forEach(function(x) { if (x._uid === uid) c = x })
  if (!c) return
  var btn = document.getElementById('savebtn-' + uid)
  if (btn) { btn.textContent = 'Saving...'; btn.disabled = true }
  var today = dateStr(currentDate)

  var promises = []

  if (c.badge && c.name) {
    var badgeKey = c.orderName + '|' + c.name.toLowerCase().trim()
    var bHist = badgeHistory[badgeKey] || []
    var todayEntry = null
    bHist.forEach(function(bh) { if (bh.date === today) todayEntry = bh })

    if (todayEntry && todayEntry.badge !== c.badge) {
      promises.push(sbPatch('camp_daily_badges?order_name=eq.' + encodeURIComponent(c.orderName) + '&camper_name=eq.' + encodeURIComponent(c.name) + '&session_date=eq.' + today, { badge_name: c.badge }))
    } else if (!todayEntry) {
      promises.push(sbPost('camp_daily_badges', { session_date: today, studio_id: currentStudioId, camper_name: c.name, order_name: c.orderName, badge_name: c.badge }))
    }

    if (!badgeHistory[badgeKey]) badgeHistory[badgeKey] = []
    var idx = -1
    badgeHistory[badgeKey].forEach(function(bh, i) { if (bh.date === today) idx = i })
    if (idx >= 0) badgeHistory[badgeKey][idx].badge = c.badge
    else badgeHistory[badgeKey].push({ badge: c.badge, date: today })
    if (c.awardedBadges.indexOf(c.badge) < 0) c.awardedBadges.push(c.badge)
  }

  if (c.name) {
    var payload = { shopify_order_name: c.orderName, camper_name: c.name, walk_home: c.walkHome, medical_notes: c.medical || null, aftercare: c.aftercare, parent_phone: c.phone || null }
    if (c.tallyId) {
      promises.push(sbPatch('tally_registrations?id=eq.' + c.tallyId, payload))
    } else {
      promises.push(sbPost('tally_registrations', payload).then(function(rows) {
        if (rows && rows.length && rows[0].id) c.tallyId = rows[0].id
      }))
    }
  }

  Promise.all(promises).then(function() {
    showToast('Saved!')
    if (btn) {
      btn.textContent = 'Saved!'
      setTimeout(function() { btn.textContent = 'Save'; btn.disabled = false }, 2000)
    }
    updateStatsBar()
    renderWheels()
  }).catch(function() {
    showToast('Error saving')
    if (btn) { btn.textContent = 'Save'; btn.disabled = false }
  })
}

function lookupOrder() {
  var raw = document.getElementById('ac-order').value.trim()
  if (!raw) return
  var orderName = raw.indexOf('#') < 0 ? '#' + raw : raw
  var resultEl = document.getElementById('ac-lookup-result')
  resultEl.textContent = 'Looking up...'
  sbGet('bookings?select=customer_name,customer_phone,raw_payload&shopify_order_name=eq.' + encodeURIComponent(orderName) + '&limit=1').then(function(rows) {
    if (!rows || !rows.length || rows.error) {
      resultEl.textContent = 'Order not found.'
      resultEl.style.color = '#c0392b'
      return
    }
    var b = rows[0]
    var phone = b.customer_phone || getPayloadPhone(b.raw_payload) || ''
    if (b.customer_name) document.getElementById('ac-parent').value = b.customer_name
    if (phone) document.getElementById('ac-phone').value = phone
    resultEl.textContent = 'Found: ' + (b.customer_name || 'Unknown') + (phone ? '  |  ' + phone : '')
    resultEl.style.color = '#3B6D11'
    // Also check tally for this order to pre-fill child name
    sbGet('tally_registrations?select=camper_name,medical_notes,walk_home,aftercare,parent_phone&shopify_order_name=eq.' + encodeURIComponent(orderName) + '&limit=1').then(function(trows) {
      if (trows && trows.length && trows[0].camper_name) {
        document.getElementById('ac-name').value = trows[0].camper_name
        if (trows[0].medical_notes) document.getElementById('ac-medical').value = trows[0].medical_notes
        if (trows[0].walk_home) document.getElementById('ac-walkhome').checked = true
        if (trows[0].aftercare) document.getElementById('ac-aftercare').checked = true
        if (trows[0].parent_phone) document.getElementById('ac-phone').value = trows[0].parent_phone
        resultEl.textContent += '  |  Child: ' + trows[0].camper_name
      }
    })
  }).catch(function() {
    resultEl.textContent = 'Lookup failed. Check connection.'
    resultEl.style.color = '#c0392b'
  })
}

function submitAddChild() {
  var name = (document.getElementById('ac-name').value || '').trim()
  if (!name) { showToast('Please enter a child name'); return }

  var orderRaw = (document.getElementById('ac-order').value || '').trim()
  var orderName = orderRaw ? (orderRaw.indexOf('#') < 0 ? '#' + orderRaw : orderRaw) : ('WALKIN-' + currentStudioId + '-' + dateStr(currentDate) + '-' + Date.now())
  var sessionGroup = document.getElementById('ac-session').value
  var parentName = (document.getElementById('ac-parent').value || '').trim()
  var phone = (document.getElementById('ac-phone').value || '').trim()
  var medical = (document.getElementById('ac-medical').value || '').trim()
  var notes = (document.getElementById('ac-notes').value || '').trim()
  var walkHome = document.getElementById('ac-walkhome').checked
  var aftercare = document.getElementById('ac-aftercare').checked

  // Find the matching session id for this group
  var targetSession = null
  allChildren.forEach(function(c) {
    if (c.sessionGroup === sessionGroup && !targetSession) targetSession = { id: c.sessionId, title: c.sessionTitle }
  })
  // Fallback to first camp session if no match
  if (!targetSession && allChildren.length) targetSession = { id: allChildren[0].sessionId, title: allChildren[0].sessionTitle }

  var uid = makeUid('MANUAL-' + orderName + '-' + name)
  var newChild = {
    _uid: uid,
    name: name,
    dob: null,
    age: null,
    sessionId: targetSession ? targetSession.id : null,
    sessionTitle: targetSession ? targetSession.title : 'Manual Entry',
    sessionGroup: sessionGroup,
    sessionNotes: '',
    orderName: orderName,
    registeredBy: parentName,
    phone: phone,
    emergency: '',
    walkHome: walkHome,
    medical: medical,
    aftercare: aftercare,
    notes: notes,
    tallyId: null,
    attendanceChecked: false,
    table: '',
    badge: '',
    awardedBadges: [],
    isManual: true
  }

  // Save to tally_registrations
  var payload = {
    shopify_order_name: orderName,
    camper_name: name,
    walk_home: walkHome,
    medical_notes: medical || null,
    aftercare: aftercare,
    parent_phone: phone || null,
    notes: notes || null
  }
  sbPost('tally_registrations', payload).then(function(rows) {
    if (rows && rows.length && rows[0].id) newChild.tallyId = rows[0].id
  })

  allChildren.push(newChild)
  closeAddChild()
  renderQuickRows()
  updateStatsBar()

  showToast(name + ' added!')
}

function saveAllBadges() {
  var btn = document.getElementById('save-all-badges-btn')
  if (btn) { btn.textContent = 'Saving...'; btn.disabled = true }
  var today = dateStr(currentDate)
  var badgedKids = allChildren.filter(function(c) { return c.badge && c.name })
  if (!badgedKids.length) {
    showToast('No badges assigned yet!')
    if (btn) { btn.textContent = 'Save All Badges'; btn.disabled = false }
    return
  }

  // Save one at a time sequentially so we can catch errors
  var promises = []
  badgedKids.forEach(function(c) {
    var body = { session_date: today, studio_id: currentStudioId, camper_name: c.name, order_name: c.orderName, badge_name: c.badge }
    var p = fetch(SUPABASE_URL + '/rest/v1/camp_daily_badges?on_conflict=order_name,camper_name,session_date', {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + (accessToken || SUPABASE_KEY),
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify(body)
    }).then(function(r) {
      if (!r.ok) {
        return r.text().then(function(txt) {
          showToast('Error ' + r.status + ': ' + txt.substring(0, 80))
          return null
        })
      }
      var badgeKey = c.orderName + '|' + c.name.toLowerCase().trim()
      if (!badgeHistory[badgeKey]) badgeHistory[badgeKey] = []
      var idx = -1
      badgeHistory[badgeKey].forEach(function(bh, i) { if (bh.date === today) idx = i })
      if (idx >= 0) badgeHistory[badgeKey][idx].badge = c.badge
      else badgeHistory[badgeKey].push({ badge: c.badge, date: today })
      if (c.awardedBadges.indexOf(c.badge) < 0) c.awardedBadges.push(c.badge)
      return true
    })
    promises.push(p)
  })

  // dummy forEach to satisfy original structure
  allChildren.forEach(function(c) {
    if (!c.badge || !c.name) return
    var badgeKey = c.orderName + '|' + c.name.toLowerCase().trim()
    var bHist = badgeHistory[badgeKey] || []
    var todayEntry = null
    bHist.forEach(function(bh) { if (bh.date === today) todayEntry = bh })

    // Use upsert - always write, let Supabase handle insert vs update
  })

  if (!promises.length) {
    if (btn) { btn.textContent = 'Save All Badges'; btn.disabled = false }
    showToast('No new badges to save')
    return
  }

  Promise.all(promises).then(function(results) {
    // Check for errors in results
    var errors = []
    results.forEach(function(r) {
      if (r && r.code) errors.push(r.message || r.code)
      if (Array.isArray(r) && r[0] && r[0].code) errors.push(r[0].message || r[0].code)
    })
    if (errors.length) {
      showToast('Error: ' + errors[0])
      if (btn) { btn.textContent = 'Save All Badges'; btn.style.background = '#1a1a1a'; btn.disabled = false }
      return
    }
    if (btn) {
      btn.textContent = 'All Saved! ✓'
      btn.style.background = '#3B6D11'
      setTimeout(function() {
        btn.textContent = 'Save All Badges'
        btn.style.background = '#1a1a1a'
        btn.disabled = false
      }, 2500)
    }
    showToast('All badges saved!')
    updateCeremonyWarnings()
    renderCeremonyRosters()
  }).catch(function(e) {
    if (btn) { btn.textContent = 'Save All Badges'; btn.style.background = '#1a1a1a'; btn.disabled = false }
    showToast('Error: ' + (e.message || 'unknown'))
  })
}

function saveBadge(uid) {
  var c = null
  allChildren.forEach(function(x) { if (x._uid === uid) c = x })
  if (!c || !c.badge) return
  var btn = document.getElementById('bsave-' + uid)
  if (btn) { btn.textContent = 'Saving...'; btn.disabled = true }
  var today = dateStr(currentDate)
  var badgeKey = c.orderName + '|' + c.name.toLowerCase().trim()
  var bHist = badgeHistory[badgeKey] || []
  var todayEntry = null
  bHist.forEach(function(bh) { if (bh.date === today) todayEntry = bh })
  var p
  if (todayEntry && todayEntry.badge !== c.badge) {
    p = sbPatch('camp_daily_badges?order_name=eq.' + encodeURIComponent(c.orderName) + '&camper_name=eq.' + encodeURIComponent(c.name) + '&session_date=eq.' + today, { badge_name: c.badge })
  } else if (!todayEntry) {
    p = sbPost('camp_daily_badges', { session_date: today, studio_id: currentStudioId, camper_name: c.name, order_name: c.orderName, badge_name: c.badge })
  } else {
    p = Promise.resolve()
  }
  if (!badgeHistory[badgeKey]) badgeHistory[badgeKey] = []
  var idx = -1; badgeHistory[badgeKey].forEach(function(bh,i){ if(bh.date===today) idx=i })
  if (idx >= 0) badgeHistory[badgeKey][idx].badge = c.badge
  else badgeHistory[badgeKey].push({ badge: c.badge, date: today })
  if (c.awardedBadges.indexOf(c.badge) < 0) c.awardedBadges.push(c.badge)
  p.then(function() {
    if (btn) { btn.textContent = 'Saved!'; btn.classList.add('saved'); setTimeout(function(){ btn.textContent='Save'; btn.classList.remove('saved'); btn.disabled=false },2000) }
    showToast('Badge saved!')
  })
}

// -- WHEEL ---------------------------------------------------------
function wheelKids(group) {
  return allChildren.filter(function(c) {
    if (!c.attendanceChecked || !c.name) return false
    if (group === 'am') return c.sessionGroup === 'am'
    return c.sessionGroup === 'fd' || c.sessionGroup === 'pm'
  })
}

function drawWheel(group, highlightIdx, angle) {
  if (highlightIdx === undefined) highlightIdx = -1
  if (angle === undefined) angle = spinAngles[group] || 0
  var canvas = document.getElementById('canvas-' + group)
  if (!canvas) return
  var ctx = canvas.getContext('2d')
  var kids = wheelKids(group)
  var done = ceremonyDone[group]
  ctx.clearRect(0, 0, 900, 900)
  var cx = 450, cy = 450, r = 430

  if (!kids.length) {
    ctx.fillStyle = '#bbb'
    ctx.font = '13px -apple-system, sans-serif'
    ctx.textAlign = 'center'
    ctx.fillText('Check in kids to', cx, cy - 8)
    ctx.fillText('populate the wheel', cx, cy + 12)
    return
  }

  var n = kids.length
  var arc = (2 * Math.PI) / n
  for (var i = 0; i < kids.length; i++) {
    var k = kids[i]
    var isGreyed = done.indexOf(k._uid) >= 0
    var start = angle + i * arc - Math.PI / 2
    var end = start + arc
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, start, end); ctx.closePath()
    ctx.fillStyle = isGreyed ? '#e8e8e2' : (highlightIdx === i ? WHEEL_STROKES[i % WHEEL_STROKES.length] : WHEEL_FILLS[i % WHEEL_FILLS.length])
    ctx.fill()
    ctx.strokeStyle = isGreyed ? '#ccc' : WHEEL_STROKES[i % WHEEL_STROKES.length]
    ctx.lineWidth = 1.5; ctx.stroke()
    ctx.save()
    ctx.translate(cx, cy)
    ctx.rotate(start + arc / 2)
    ctx.textAlign = 'right'
    var firstName = (k.name || '?').split(' ')[0]
    ctx.fillStyle = isGreyed ? '#aaa' : (highlightIdx === i ? 'white' : '#2C2C2A')
    ctx.font = (highlightIdx === i ? '600 ' : '') + '26px -apple-system, sans-serif'
    ctx.fillText(firstName, r - 18, 7)
    ctx.restore()
  }
  ctx.beginPath(); ctx.arc(cx, cy, 36, 0, 2 * Math.PI)
  ctx.fillStyle = 'white'; ctx.fill()
  ctx.strokeStyle = '#e0e0d8'; ctx.lineWidth = 1; ctx.stroke()
}

function renderWheels() {
  renderCeremonyRosters()
}

function renderCeremonyRosters() {
  var groups = ['am', 'pm']
  for (var g = 0; g < groups.length; g++) {
    var group = groups[g]
    var el = document.getElementById('roster-' + group)
    if (!el) continue
    var kids = wheelKids(group)
    var done = ceremonyDone[group]
    if (!kids.length) { el.innerHTML = '<div class="empty" style="font-size:13px">No checked-in kids yet.</div>'; continue }
    var rows = []
    for (var i = 0; i < kids.length; i++) {
      var k = kids[i]
      var isDone = done.indexOf(k._uid) >= 0
      var todayBadge = k.badge ? '<span style="font-size:11px;color:#533AB7">' + k.badge + '</span>' : ''
      rows.push('<div class="ceremony-kid' + (isDone ? ' done' : '') + '">' +
        '<span style="font-size:18px">' + (isDone ? '&#x2705;' : '&#x2B55;') + '</span>' +
        '<div class="ceremony-kid-name">' + k.name + '</div>' +
        (isDone ? todayBadge : '<span class="ceremony-kid-badge">Waiting...</span>') +
        (isDone ? '<span class="ceremony-reset" style="font-size:11px;margin-top:0" onclick="undoCeremony(&quot;' + group + '&quot;,&quot;' + k._uid + '&quot;)">undo</span>' : '') +
        '</div>')
    }
    el.innerHTML = rows.join('')
  }
}

// Shared AudioContext - reuse to avoid iOS suspension
var sharedAudioCtx = null
function getAudioCtx() {
  try {
    if (!sharedAudioCtx || sharedAudioCtx.state === 'closed') {
      sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)()
    }
    if (sharedAudioCtx.state === 'suspended') {
      sharedAudioCtx.resume()
    }
    return sharedAudioCtx
  } catch(e) { return null }
}

function playApplause() {
  var btn = document.getElementById('finale-applause-btn')
  if (btn) { btn.textContent = '👏👏👏'; btn.disabled = true }
  // Launch massive confetti
  launchFinaleConfetti()
  // Synthesize applause using noise bursts
  try {
    var actx = getAudioCtx()
    if (!actx) return
    var duration = 4.0
    var sampleRate = actx.sampleRate
    var bufferSize = sampleRate * duration
    var buffer = actx.createBuffer(2, bufferSize, sampleRate)
    for (var ch = 0; ch < 2; ch++) {
      var data = buffer.getChannelData(ch)
      for (var i = 0; i < bufferSize; i++) {
        // Applause = filtered noise with rhythmic amplitude modulation
        var t = i / sampleRate
        // Multiple clappers at slightly different rates
        var clap1 = Math.pow(Math.max(0, Math.sin(t * 6.2 * Math.PI)), 8)
        var clap2 = Math.pow(Math.max(0, Math.sin(t * 5.8 * Math.PI + 0.3)), 8)
        var clap3 = Math.pow(Math.max(0, Math.sin(t * 6.7 * Math.PI + 0.7)), 8)
        var clap4 = Math.pow(Math.max(0, Math.sin(t * 5.5 * Math.PI + 1.1)), 8)
        var envelope = (clap1 + clap2 + clap3 + clap4) * 0.25
        // Fade in and out
        var fade = Math.min(t / 0.3, 1) * Math.min((duration - t) / 0.5, 1)
        data[i] = (Math.random() * 2 - 1) * envelope * fade * 0.6
      }
    }
    var source = actx.createBufferSource()
    source.buffer = buffer
    // High-pass filter to make it sound more like clapping
    var filter = actx.createBiquadFilter()
    filter.type = 'highpass'
    filter.frequency.value = 1200
    // Add some reverb via convolver approximation with delay
    var delay = actx.createDelay(0.1)
    delay.delayTime.value = 0.03
    var delayGain = actx.createGain()
    delayGain.gain.value = 0.3
    var masterGain = actx.createGain()
    masterGain.gain.value = 1.0
    source.connect(filter)
    filter.connect(masterGain)
    filter.connect(delay)
    delay.connect(delayGain)
    delayGain.connect(masterGain)
    masterGain.connect(actx.destination)
    source.start()
    source.stop(actx.currentTime + duration)
    // Reset button after applause
    setTimeout(function() {
      if (btn) { btn.textContent = '👏 Thanks Everyone!'; btn.disabled = false }
    }, (duration + 0.5) * 1000)
  } catch(e) {
    if (btn) { btn.textContent = '👏 Thanks Everyone!'; btn.disabled = false }
  }
}

function launchFinaleConfetti() {
  var canvas = document.getElementById('confetti-canvas')
  if (!canvas) return
  canvas.width = window.innerWidth
  canvas.height = window.innerHeight
  var ctx = canvas.getContext('2d')
  var particles = []
  // Much more confetti for the finale
  for (var i = 0; i < 300; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * 200,
      w: 8 + Math.random() * 14,
      h: 4 + Math.random() * 8,
      color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
      rot: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 10,
      vy: 2 + Math.random() * 6,
      vx: (Math.random() - 0.5) * 5,
      opacity: 1,
      shape: Math.random() > 0.5 ? 'rect' : 'circle'
    })
  }
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height)
    var alive = false
    particles.forEach(function(p) {
      p.y += p.vy; p.x += p.vx; p.rot += p.rotSpeed
      if (p.y > canvas.height) p.opacity -= 0.03
      if (p.opacity > 0) {
        alive = true
        ctx.save()
        ctx.globalAlpha = p.opacity
        ctx.translate(p.x, p.y)
        ctx.rotate(p.rot * Math.PI / 180)
        ctx.fillStyle = p.color
        if (p.shape === 'circle') {
          ctx.beginPath(); ctx.arc(0, 0, p.w/2, 0, 2*Math.PI); ctx.fill()
        } else {
          ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h)
        }
        ctx.restore()
      }
    })
    if (alive) requestAnimationFrame(draw)
    else ctx.clearRect(0, 0, canvas.width, canvas.height)
  }
  requestAnimationFrame(draw)
}

function showFinale(group) {
  var kids = wheelKids(group)
  document.getElementById('finale-sub').textContent = 'All ' + kids.length + ' badges have been awarded!'
  document.getElementById('finale-overlay').className = 'finale-overlay open'
  // Auto-launch confetti
  launchFinaleConfetti()
}

function closeFinale() {
