}

// lightning state
var lightningAnimId = { am: null, pm: null }
var lightningState = { am: null, pm: null }

function initLightning(group) {
  var canvas = document.getElementById('lightning-canvas-' + group)
  if (!canvas) return
  var parent = canvas.parentElement || canvas
  var W = canvas.offsetWidth || parent.offsetWidth || window.innerWidth - 28
  var H = W
  canvas.width = W
  canvas.height = H
  canvas.style.width = W + 'px'
  canvas.style.height = H + 'px'

  var kids = wheelKids(group)
  var done = ceremonyDone[group]
  var available = kids.filter(function(k) { return done.indexOf(k._uid) < 0 })
  if (!available.length) return

  // Lay out clouds in a grid
  var cols = Math.ceil(Math.sqrt(available.length))
  var rows = Math.ceil(available.length / cols)
  var padX = W * 0.06, padY = H * 0.08
  var cellW = (W - padX * 2) / cols
  var cellH = (H - padY * 2) / rows
  var cloudW = cellW * 0.82
  var cloudH = cellH * 0.58

  var clouds = available.map(function(k, i) {
    var col = i % cols
    var row = Math.floor(i / cols)
    var cx = padX + col * cellW + cellW / 2
    var cy = padY + row * cellH + cellH / 2
    return {
      uid: k._uid,
      name: k.name,
      cx: cx, cy: cy,
      w: cloudW, h: cloudH,
      done: done.indexOf(k._uid) >= 0,
      flash: 0,        // 0-1 flash intensity
      rumble: 0,       // shake offset
      revealed: false, // name shown
      revealAlpha: 0
    }
  })

  lightningState[group] = { clouds: clouds, W: W, H: H, strikingUid: null, bgFlash: 0 }

  // tap/click handler
  canvas.ontouchstart = function(e) {
    e.preventDefault()
    var rect = canvas.getBoundingClientRect()
    var scaleX = canvas.width / rect.width
    var scaleY = canvas.height / rect.height
    var touch = e.touches[0]
    checkCloudTap(group, (touch.clientX - rect.left) * scaleX, (touch.clientY - rect.top) * scaleY)
  }
  canvas.onclick = function(e) {
    var rect = canvas.getBoundingClientRect()
    checkCloudTap(group, (e.clientX - rect.left) * canvas.width / rect.width, (e.clientY - rect.top) * canvas.height / rect.height)
  }

  if (lightningAnimId[group]) cancelAnimationFrame(lightningAnimId[group])
  // Ambient rumble loop
  ambientRumble(group)
  animateLightning(group)
}

function ambientRumble(group) {
  var state = lightningState[group]
  if (!state || ceremonyMode[group] !== 'lightning') return
  // Random cloud gets a little flash
  var available = state.clouds.filter(function(c) { return !c.done && !c.revealed })
  if (available.length) {
    var target = available[Math.floor(Math.random() * available.length)]
    target.flash = 0.3 + Math.random() * 0.4
    target.rumble = (Math.random() - 0.5) * 8
  }
  setTimeout(function() { ambientRumble(group) }, 600 + Math.random() * 1400)
}

function animateLightning(group) {
  var state = lightningState[group]
  if (!state || ceremonyMode[group] !== 'lightning') return
  var canvas = document.getElementById('lightning-canvas-' + group)
  if (!canvas) return
  var ctx = canvas.getContext('2d')
  var W = state.W, H = state.H

  // Stormy background
  ctx.fillStyle = 'rgb(' + Math.floor(15 + state.bgFlash * 60) + ',' + Math.floor(15 + state.bgFlash * 60) + ',' + Math.floor(30 + state.bgFlash * 80) + ')'
  ctx.fillRect(0, 0, W, H)

  // Fade background flash
  state.bgFlash = Math.max(0, state.bgFlash - 0.04)

  // Draw rain streaks
  ctx.strokeStyle = 'rgba(150,180,255,0.15)'
  ctx.lineWidth = 1
  for (var r = 0; r < 20; r++) {
    var rx = ((r * 173 + Date.now() * 0.05) % W)
    var ry = ((r * 97 + Date.now() * 0.12) % H)
    ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx - 4, ry + 18); ctx.stroke()
  }

  // Draw each cloud
  state.clouds.forEach(function(cloud) {
    if (cloud.flash > 0) { cloud.flash = Math.max(0, cloud.flash - 0.035) }
    if (cloud.rumble !== 0) { cloud.rumble *= 0.85 }

    var ox = cloud.rumble, oy = 0
    var alpha = cloud.done ? 0.25 : 1
    ctx.save()
    ctx.globalAlpha = alpha
    ctx.translate(cloud.cx + ox, cloud.cy + oy)
    drawCloud(ctx, 0, 0, cloud.w, cloud.h, cloud.flash, cloud.revealed)

    // Show ? or revealed name
    if (!cloud.revealed && !cloud.done) {
      ctx.fillStyle = 'rgba(180,200,255,' + (0.5 + cloud.flash * 0.5) + ')'
      var fs = Math.max(20, Math.floor(cloud.h * 0.45))
      ctx.font = '700 ' + fs + 'px -apple-system, sans-serif'
      ctx.textAlign = 'center'
      ctx.textBaseline = 'middle'
      ctx.fillText('?', 0, 0)
    }

    if (cloud.revealed) {
      cloud.revealAlpha = Math.min(1, cloud.revealAlpha + 0.06)
      ctx.globalAlpha = cloud.revealAlpha * alpha
      ctx.fillStyle = '#1A0533'
      ctx.shadowColor = 'rgba(255,255,255,0.8)'
      ctx.shadowBlur = 8
      var fs2 = Math.max(16, Math.min(32, Math.floor(cloud.w * 0.18)))
      ctx.font = '700 ' + fs2 + 'px -apple-system, sans-serif'
      ctx.textAlign = 'center'
      ctx.textBaseline = 'middle'
      // Wrap name if needed
      var firstName = cloud.name.split(' ')[0]
      ctx.fillText(firstName, 0, 0)
    }

    ctx.restore()
  })

  lightningAnimId[group] = requestAnimationFrame(function() { animateLightning(group) })
}

function drawCloud(ctx, x, y, w, h, flash, revealed) {
  var color1 = revealed ? '#8B6000' : (flash > 0.3 ? 'rgb(' + Math.floor(180 + flash*60) + ',' + Math.floor(180 + flash*60) + ',255)' : '#3a3a5c')
  var color2 = revealed ? '#FFD700' : (flash > 0.3 ? 'rgba(255,255,255,0.95)' : '#4a4a70')

  ctx.save()
  ctx.translate(x, y)

  // Cloud shape using overlapping circles
  var grad = ctx.createRadialGradient(0, -h*0.1, h*0.1, 0, 0, h*0.8)
  grad.addColorStop(0, color2)
  grad.addColorStop(1, color1)

  ctx.beginPath()
  // Main body
  ctx.ellipse(0, h*0.1, w*0.42, h*0.38, 0, 0, 2*Math.PI)
  ctx.fillStyle = grad
  ctx.fill()
  // Left bump
  ctx.beginPath()
  ctx.ellipse(-w*0.22, -h*0.05, w*0.26, h*0.30, 0, 0, 2*Math.PI)
  ctx.fill()
  // Right bump
  ctx.beginPath()
  ctx.ellipse(w*0.22, -h*0.05, w*0.26, h*0.30, 0, 0, 2*Math.PI)
  ctx.fill()
  // Top bump
  ctx.beginPath()
  ctx.ellipse(0, -h*0.22, w*0.22, h*0.28, 0, 0, 2*Math.PI)
  ctx.fill()

  // Glow when flashing
  if (flash > 0.2) {
    ctx.shadowColor = 'rgba(200,220,255,' + flash + ')'
    ctx.shadowBlur = 30 * flash
    ctx.beginPath()
    ctx.ellipse(0, 0, w*0.42, h*0.38, 0, 0, 2*Math.PI)
    ctx.fillStyle = 'rgba(255,255,255,' + flash*0.4 + ')'
    ctx.fill()
    ctx.shadowBlur = 0
  }
  ctx.restore()
}

function drawLightningBolt(ctx, x1, y1, x2, y2, branches, alpha) {
  ctx.save()
  ctx.globalAlpha = alpha
  ctx.strokeStyle = '#FFFFFF'
  ctx.lineWidth = 3
  ctx.shadowColor = '#8888FF'
  ctx.shadowBlur = 12

  function bolt(ax, ay, bx, by, depth) {
    if (depth <= 0) {
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke()
      return
    }
    var mx = (ax + bx) / 2 + (Math.random() - 0.5) * (bx - ax) * 0.5
    var my = (ay + by) / 2 + (Math.random() - 0.5) * (by - ay) * 0.5
    bolt(ax, ay, mx, my, depth - 1)
    bolt(mx, my, bx, by, depth - 1)
    if (branches && depth === 2 && Math.random() > 0.5) {
      var bx2 = mx + (Math.random() - 0.5) * 60
      var by2 = my + Math.random() * 40
      ctx.lineWidth = 1.5
      bolt(mx, my, bx2, by2, depth - 2)
      ctx.lineWidth = 3
    }
  }
  bolt(x1, y1, x2, y2, 4)
  ctx.restore()
}

function strikeLightning(group) {
  var state = lightningState[group]
  if (!state) return
  var done = ceremonyDone[group]
  var available = state.clouds.filter(function(c) { return !c.done && !c.revealed })
  if (!available.length) return

  // Pick random available cloud
  var target = available[Math.floor(Math.random() * available.length)]
  strikeCloud(group, target.uid)
}

function checkCloudTap(group, x, y) {
  var state = lightningState[group]
  if (!state) return
  var tapped = null
  state.clouds.forEach(function(c) {
    if (c.done || c.revealed) return
    var dx = x - c.cx, dy = y - c.cy
    if (Math.abs(dx) < c.w * 0.55 && Math.abs(dy) < c.h * 0.6) tapped = c
  })
  if (tapped) strikeCloud(group, tapped.uid)
}

function strikeCloud(group, uid) {
  var state = lightningState[group]
  if (!state || state.strikingUid) return
  state.strikingUid = uid

  var cloud = null
  state.clouds.forEach(function(c) { if (c.uid === uid) cloud = c })
  if (!cloud) return

  // Play thunder
  playThunder()

  // Flash effect - rapid sequence
  var flashes = [1, 0.3, 0.9, 0.2, 1]
  var delay = 0
  flashes.forEach(function(f, i) {
    setTimeout(function() {
      if (cloud) { cloud.flash = f; state.bgFlash = f * 0.6 }
      // Draw lightning bolt on canvas
      var canvas = document.getElementById('lightning-canvas-' + group)
      if (canvas) {
        var ctx = canvas.getContext('2d')
        var boltX = cloud.cx + (Math.random() - 0.5) * cloud.w * 0.3
        drawLightningBolt(ctx, cloud.cx, 0, boltX, cloud.cy - cloud.h * 0.3, true, f)
      }
    }, delay)
    delay += 80 + i * 40
  })

  // After strikes - reveal name
  setTimeout(function() {
    cloud.revealed = true
    cloud.flash = 0.8
    state.strikingUid = null
    // Find winner
    var winner = null
    allChildren.forEach(function(c) { if (c._uid === uid) winner = c })
    if (winner) {
      if (ceremonyDone[group].indexOf(uid) < 0) ceremonyDone[group].push(uid)
      cloud.done = false // keep visible but revealed
      renderCeremonyRosters()
      var remaining = wheelKids(group).filter(function(k) { return ceremonyDone[group].indexOf(k._uid) < 0 })
      setTimeout(function() {
        showReveal(group, winner)
        revealIsLast = remaining.length === 0
        revealLastGroup = group
      }, 600)
    }
  }, delay + 200)
}

function playThunder() {
  try {
    var actx = getAudioCtx()
    if (!actx) return
    var duration = 2.5
    var bufferSize = actx.sampleRate * duration
    var buffer = actx.createBuffer(1, bufferSize, actx.sampleRate)
    var data = buffer.getChannelData(0)
    for (var i = 0; i < bufferSize; i++) {
      var t = i / actx.sampleRate
      var crack = t < 0.05 ? Math.random() * (1 - t/0.05) : 0
      var rumble = Math.random() * Math.exp(-t * 1.8) * 0.6
      data[i] = (crack + rumble) * (Math.random() * 2 - 1)
    }
    var source = actx.createBufferSource()
    source.buffer = buffer
    var filter = actx.createBiquadFilter()
    filter.type = 'lowpass'
    filter.frequency.value = 400
    var gain = actx.createGain()
    gain.gain.value = 1.2
    source.connect(filter)
    filter.connect(gain)
    gain.connect(actx.destination)
    source.start()
  } catch(e) {}
}

function resetCeremonyLightning(group) {
  if (lightningAnimId[group]) { cancelAnimationFrame(lightningAnimId[group]); lightningAnimId[group] = null }
  lightningState[group] = null
  if (ceremonyMode[group] === 'lightning') initLightning(group)
}

// ceremony mode state
var ceremonyMode = { am: 'wheel', pm: 'wheel' }
var bubbleState = { am: null, pm: null }  // holds bubble animation state per group
var bubbleAnimId = { am: null, pm: null }

function setMode(group, mode) {
  ceremonyMode[group] = mode
  // update buttons
  document.getElementById('mode-wheel-' + group).className = 'mode-btn' + (mode === 'wheel' ? ' active' : '')
  document.getElementById('mode-bubble-' + group).className = 'mode-btn' + (mode === 'bubble' ? ' active' : '')
  var lbtn = document.getElementById('mode-lightning-' + group)
  if (lbtn) lbtn.className = 'mode-btn' + (mode === 'lightning' ? ' active' : '')
  // show/hide sections
  document.getElementById('wheel-section-' + group).style.display = mode === 'wheel' ? 'block' : 'none'
  document.getElementById('bubble-section-' + group).style.display = mode === 'bubble' ? 'block' : 'none'
  var ls = document.getElementById('lightning-section-' + group)
  if (ls) ls.style.display = mode === 'lightning' ? 'block' : 'none'
  var cs = document.getElementById('cats-section-' + group)
  if (cs) cs.style.display = mode === 'cats' ? 'block' : 'none'
  // update spin button label
  var btn = document.getElementById('spin-' + group)
  if (btn) btn.textContent = mode === 'wheel' ? 'Spin the Wheel!' : mode === 'bubble' ? 'Release the Bubbles!' : mode === 'lightning' ? 'Call the Storm!' : 'Find Your Cat!'
  // stop other anim loops
  if (mode !== 'bubble' && bubbleAnimId[group]) { cancelAnimationFrame(bubbleAnimId[group]); bubbleAnimId[group] = null }
  if (mode !== 'lightning' && lightningAnimId[group]) { cancelAnimationFrame(lightningAnimId[group]); lightningAnimId[group] = null }
  if (mode !== 'cats' && catsAnimId[group]) { cancelAnimationFrame(catsAnimId[group]); catsAnimId[group] = null }
  // Init AFTER section is visible so offsetWidth is correct
  setTimeout(function() {
    if (mode === 'bubble') initBubbles(group)
    if (mode === 'lightning') initLightning(group)
    if (mode === 'cats') initCats(group)
  }, 50)
}

function activatePicker(group) {
  if (ceremonyMode[group] === 'bubble') popBubble(group)
  else if (ceremonyMode[group] === 'lightning') strikeLightning(group)
  else if (ceremonyMode[group] === 'cats') randomCatMeow(group)
  else spin(group)
}


// ── CATS PICKER ──────────────────────────────────────────────────
var catsAnimId = { am: null, pm: null }
var catsState = { am: null, pm: null }

var CAT_COLORS = [
  { body:'#F4A460', stripe:'#C8783A', nose:'#FF9999', eye:'#3D2B1F' },
  { body:'#808080', stripe:'#555555', nose:'#FF9999', eye:'#2E4B1F' },
  { body:'#F5F5F0', stripe:'#DDDDCC', nose:'#FFB6C1', eye:'#4A3F6B' },
  { body:'#C4773B', stripe:'#8B4513', nose:'#FF9999', eye:'#1F3D2B' },
  { body:'#2C2C2C', stripe:'#111111', nose:'#FF6699', eye:'#556B2F' },
  { body:'#E8C99A', stripe:'#C4A26A', nose:'#FFB6C1', eye:'#1F2D3D' },
  { body:'#9B7BB5', stripe:'#7B5B95', nose:'#FF9999', eye:'#2B1F3D' },
  { body:'#6B9E6B', stripe:'#4B7E4B', nose:'#FFB6C1', eye:'#3D2B1F' }
]

function initCats(group) {
  var canvas = document.getElementById('cats-canvas-' + group)
  if (!canvas) return
  var parent = canvas.parentElement || canvas
  var W = canvas.offsetWidth || parent.offsetWidth || window.innerWidth - 28
  var H = W
  canvas.width = W
  canvas.height = H
  canvas.style.width = W + 'px'
  canvas.style.height = H + 'px'

  var kids = wheelKids(group)
  var done = ceremonyDone[group]
  var available = kids.filter(function(k) { return done.indexOf(k._uid) < 0 })
  if (!available.length) return

  // Layout cats in rows
  var cols = Math.min(available.length, Math.ceil(Math.sqrt(available.length * 1.4)))
  var rows = Math.ceil(available.length / cols)
  var catSize = Math.min(Math.floor(W / (cols + 1)), Math.floor(H / (rows + 1) * 1.2))
  catSize = Math.max(80, Math.min(catSize, 180))

  var cats = available.map(function(k, i) {
    var col = i % cols
    var row = Math.floor(i / cols)
    var totalRowCats = (row === rows - 1) ? (available.length - row * cols) : cols
    var rowOffset = ((cols - totalRowCats) * (W / (cols + 0.5))) / 2
    var colors = CAT_COLORS[i % CAT_COLORS.length]
    return {
      uid: k._uid,
      name: k.name,
      x: rowOffset + (col + 0.5) * W / (cols + 0.5),
      y: (row + 0.8) * H / (rows + 0.5),
      size: catSize,
      colors: colors,
      done: done.indexOf(k._uid) >= 0,
      // Animation state
      wobble: Math.random() * Math.PI * 2,
      wobbleSpeed: 0.02 + Math.random() * 0.015,
      tailAngle: 0,
      tailDir: 1,
      blinkTimer: Math.floor(Math.random() * 120),
      blinking: false,
      // Meow state
      meowing: false,
      meowProgress: 0,  // 0-1 for mouth open
      meowBubble: 0,    // 0-1 for chat bubble
      // Center stage
      staging: false,
      stageX: 0, stageY: 0,
      origX: 0, origY: 0,
      stageProgress: 0
    }
  })

  catsState[group] = { cats: cats, W: W, H: H, stagingUid: null }

  canvas.ontouchstart = function(e) {
    e.preventDefault()
    var rect = canvas.getBoundingClientRect()
    var scaleX = canvas.width / rect.width
    var scaleY = canvas.height / rect.height
    var touch = e.touches[0]
    checkCatTap(group, (touch.clientX - rect.left) * scaleX, (touch.clientY - rect.top) * scaleY)
  }
  canvas.onclick = function(e) {
    var rect = canvas.getBoundingClientRect()
    checkCatTap(group, (e.clientX - rect.left) * canvas.width / rect.width, (e.clientY - rect.top) * canvas.height / rect.height)
  }

  if (catsAnimId[group]) cancelAnimationFrame(catsAnimId[group])
  animateCats(group)
}

function animateCats(group) {
  var state = catsState[group]
  if (!state || ceremonyMode[group] !== 'cats') return
  var canvas = document.getElementById('cats-canvas-' + group)
  if (!canvas) return
  var ctx = canvas.getContext('2d')
  var W = state.W, H = state.H

  // Cute pastel background with grass
  var skyGrad = ctx.createLinearGradient(0, 0, 0, H)
  skyGrad.addColorStop(0, '#B3E5FC')
  skyGrad.addColorStop(0.7, '#E1F5FE')
  skyGrad.addColorStop(1, '#C8E6C9')
  ctx.fillStyle = skyGrad
  ctx.fillRect(0, 0, W, H)

  // Grass strip at bottom
  ctx.fillStyle = '#66BB6A'
  ctx.fillRect(0, H * 0.88, W, H * 0.12)
  ctx.fillStyle = '#81C784'
  ctx.fillRect(0, H * 0.88, W, H * 0.04)

  // Little clouds in background
  drawBgCloud(ctx, W * 0.15, H * 0.12, 80)
  drawBgCloud(ctx, W * 0.7, H * 0.08, 60)
  drawBgCloud(ctx, W * 0.45, H * 0.18, 50)

  // Sort cats - staging cat draws last (on top)
  var sorted = state.cats.slice().sort(function(a, b) {
    if (a.staging) return 1
    if (b.staging) return -1
    return 0
  })

  sorted.forEach(function(cat) {
    if (cat.done && !cat.staging) {
      // Done cats sit small and greyed to the side
      ctx.save()
      ctx.globalAlpha = 0.3
      drawCat(ctx, cat, cat.size * 0.7, false)
      ctx.restore()
      return
    }

    // Idle wobble
    cat.wobble += cat.wobbleSpeed
    cat.tailAngle += 0.04 * cat.tailDir
    if (Math.abs(cat.tailAngle) > 0.5) cat.tailDir *= -1

    // Blink logic
    cat.blinkTimer--
    if (cat.blinkTimer <= 0) {
      cat.blinking = !cat.blinking
      cat.blinkTimer = cat.blinking ? 6 : (80 + Math.floor(Math.random() * 80))
    }

    // Stage animation
    if (cat.staging) {
      cat.stageProgress = Math.min(1, cat.stageProgress + 0.05)
      var ease = 1 - Math.pow(1 - cat.stageProgress, 3)
      cat.x = cat.origX + (cat.stageX - cat.origX) * ease
      cat.y = cat.origY + (cat.stageY - cat.origY) * ease
    }

    // Meow animation
    if (cat.meowing) {
      if (cat.meowProgress < 1) cat.meowProgress += 0.08
      if (cat.meowProgress >= 0.3) cat.meowBubble = Math.min(1, cat.meowBubble + 0.06)
    }

    var drawSize = cat.staging ? cat.size * (1 + cat.stageProgress * 0.7) : cat.size
    var bodyY = cat.y + Math.sin(cat.wobble) * (cat.staging ? 0 : 4)
    ctx.save()
    ctx.translate(cat.x, bodyY)
    drawCat(ctx, cat, drawSize, true)
    // Chat bubble with name
    if (cat.meowBubble > 0) {
      drawMeowBubble(ctx, cat, drawSize)
    }
    ctx.restore()
  })

  catsAnimId[group] = requestAnimationFrame(function() { animateCats(group) })
}

function drawBgCloud(ctx, x, y, size) {
  ctx.save()
  ctx.globalAlpha = 0.7
  ctx.fillStyle = 'white'
  ctx.beginPath(); ctx.ellipse(x, y, size, size*0.5, 0, 0, 2*Math.PI); ctx.fill()
  ctx.beginPath(); ctx.ellipse(x-size*0.4, y+size*0.1, size*0.5, size*0.4, 0, 0, 2*Math.PI); ctx.fill()
  ctx.beginPath(); ctx.ellipse(x+size*0.4, y+size*0.1, size*0.5, size*0.4, 0, 0, 2*Math.PI); ctx.fill()
  ctx.restore()
}

function drawCat(ctx, cat, size, animated) {
  var c = cat.colors
  var s = size / 100  // scale factor (design at 100px)
  var blinking = animated && cat.blinking

  // Shadow
  ctx.save()
  ctx.globalAlpha = 0.15
  ctx.fillStyle = '#000'
  ctx.beginPath(); ctx.ellipse(0, size*0.52, size*0.38, size*0.08, 0, 0, 2*Math.PI); ctx.fill()
  ctx.restore()

  // Tail
  var ta = animated ? cat.tailAngle : 0
  ctx.save()
  ctx.strokeStyle = c.body
  ctx.lineWidth = size * 0.13
  ctx.lineCap = 'round'
  ctx.beginPath()
  ctx.moveTo(size*0.2, size*0.3)
  ctx.quadraticCurveTo(size*0.55 + Math.sin(ta)*size*0.2, size*0.6, size*0.1 + Math.sin(ta)*size*0.3, size*0.0)
  ctx.stroke()
  // Tail tip
  ctx.strokeStyle = c.stripe
  ctx.lineWidth = size * 0.09
  ctx.beginPath()
  ctx.moveTo(size*0.05 + Math.sin(ta)*size*0.28, size*0.04)
  ctx.lineTo(size*0.02 + Math.sin(ta)*size*0.3, size*0.0 - size*0.04)
  ctx.stroke()
  ctx.restore()

  // Body
  ctx.fillStyle = c.body
  ctx.beginPath(); ctx.ellipse(0, size*0.18, size*0.33, size*0.40, 0, 0, 2*Math.PI); ctx.fill()

  // Belly
  ctx.fillStyle = '#FFF5EE'
  ctx.beginPath(); ctx.ellipse(0, size*0.22, size*0.18, size*0.26, 0, 0, 2*Math.PI); ctx.fill()

  // Body stripes
  ctx.strokeStyle = c.stripe; ctx.lineWidth = size*0.04; ctx.lineCap = 'round'
  ctx.globalAlpha = 0.4
  ctx.beginPath(); ctx.moveTo(-size*0.15, size*0.05); ctx.lineTo(-size*0.28, size*0.18); ctx.stroke()
  ctx.beginPath(); ctx.moveTo(-size*0.1, size*0.16); ctx.lineTo(-size*0.25, size*0.28); ctx.stroke()
  ctx.beginPath(); ctx.moveTo(size*0.15, size*0.05); ctx.lineTo(size*0.28, size*0.18); ctx.stroke()
  ctx.beginPath(); ctx.moveTo(size*0.1, size*0.16); ctx.lineTo(size*0.25, size*0.28); ctx.stroke()
  ctx.globalAlpha = 1

  // Head
  ctx.fillStyle = c.body
  ctx.beginPath(); ctx.arc(0, -size*0.22, size*0.28, 0, 2*Math.PI); ctx.fill()

  // Ears
  ctx.fillStyle = c.body
  // Left ear
  ctx.beginPath(); ctx.moveTo(-size*0.28, -size*0.38); ctx.lineTo(-size*0.12, -size*0.48); ctx.lineTo(-size*0.06, -size*0.30); ctx.closePath(); ctx.fill()
  // Right ear
  ctx.beginPath(); ctx.moveTo(size*0.28, -size*0.38); ctx.lineTo(size*0.12, -size*0.48); ctx.lineTo(size*0.06, -size*0.30); ctx.closePath(); ctx.fill()
  // Inner ears
  ctx.fillStyle = '#FFB6C1'
  ctx.globalAlpha = 0.7
  ctx.beginPath(); ctx.moveTo(-size*0.24, -size*0.38); ctx.lineTo(-size*0.13, -size*0.45); ctx.lineTo(-size*0.09, -size*0.32); ctx.closePath(); ctx.fill()
  ctx.beginPath(); ctx.moveTo(size*0.24, -size*0.38); ctx.lineTo(size*0.13, -size*0.45); ctx.lineTo(size*0.09, -size*0.32); ctx.closePath(); ctx.fill()
  ctx.globalAlpha = 1

  // Head stripes
  ctx.strokeStyle = c.stripe; ctx.lineWidth = size*0.035; ctx.globalAlpha = 0.45
  ctx.beginPath(); ctx.moveTo(-size*0.12, -size*0.46); ctx.lineTo(-size*0.08, -size*0.32); ctx.stroke()
  ctx.beginPath(); ctx.moveTo(0, -size*0.50); ctx.lineTo(0, -size*0.36); ctx.stroke()
  ctx.beginPath(); ctx.moveTo(size*0.12, -size*0.46); ctx.lineTo(size*0.08, -size*0.32); ctx.stroke()
  ctx.globalAlpha = 1

  // Eyes
  if (blinking) {
    ctx.strokeStyle = c.eye; ctx.lineWidth = size*0.045; ctx.lineCap = 'round'
    ctx.beginPath(); ctx.moveTo(-size*0.11, -size*0.25); ctx.lineTo(-size*0.05, -size*0.23); ctx.stroke()
    ctx.beginPath(); ctx.moveTo(size*0.11, -size*0.25); ctx.lineTo(size*0.05, -size*0.23); ctx.stroke()
  } else {
    // Whites
    ctx.fillStyle = 'white'
    ctx.beginPath(); ctx.ellipse(-size*0.09, -size*0.25, size*0.075, size*0.075, 0, 0, 2*Math.PI); ctx.fill()
    ctx.beginPath(); ctx.ellipse(size*0.09, -size*0.25, size*0.075, size*0.075, 0, 0, 2*Math.PI); ctx.fill()
    // Pupils
    ctx.fillStyle = c.eye
    ctx.beginPath(); ctx.ellipse(-size*0.09, -size*0.25, size*0.042, size*0.058, 0, 0, 2*Math.PI); ctx.fill()
    ctx.beginPath(); ctx.ellipse(size*0.09, -size*0.25, size*0.042, size*0.058, 0, 0, 2*Math.PI); ctx.fill()
    // Catchlights
    ctx.fillStyle = 'white'
    ctx.beginPath(); ctx.arc(-size*0.075, -size*0.27, size*0.018, 0, 2*Math.PI); ctx.fill()
    ctx.beginPath(); ctx.arc(size*0.105, -size*0.27, size*0.018, 0, 2*Math.PI); ctx.fill()
  }

  // Nose
  ctx.fillStyle = c.nose
  ctx.beginPath(); ctx.moveTo(0, -size*0.155); ctx.lineTo(-size*0.04, -size*0.19); ctx.lineTo(size*0.04, -size*0.19); ctx.closePath(); ctx.fill()

  // Mouth - open when meowing
  var mouthOpen = animated ? cat.meowProgress : 0
  ctx.strokeStyle = c.eye; ctx.lineWidth = size*0.03; ctx.lineCap = 'round'
  if (mouthOpen > 0.3) {
    // Open mouth with teeth
    ctx.fillStyle = '#CC3333'
    ctx.beginPath()
    ctx.ellipse(0, -size*0.11 + mouthOpen*size*0.04, size*0.09, size*0.06 * mouthOpen, 0, 0, Math.PI)
    ctx.fill()
    // Tongue
    ctx.fillStyle = '#FF6699'
    ctx.beginPath(); ctx.ellipse(0, -size*0.07 + mouthOpen*size*0.04, size*0.05, size*0.04*mouthOpen, 0, 0, Math.PI); ctx.fill()
  } else {
    ctx.beginPath(); ctx.moveTo(0, -size*0.155); ctx.lineTo(-size*0.035, -size*0.12); ctx.stroke()
    ctx.beginPath(); ctx.moveTo(0, -size*0.155); ctx.lineTo(size*0.035, -size*0.12); ctx.stroke()
  }

  // Whiskers
  ctx.strokeStyle = 'rgba(100,100,100,0.6)'; ctx.lineWidth = size*0.02
  ctx.beginPath(); ctx.moveTo(-size*0.04, -size*0.16); ctx.lineTo(-size*0.32, -size*0.20); ctx.stroke()
  ctx.beginPath(); ctx.moveTo(-size*0.04, -size*0.14); ctx.lineTo(-size*0.32, -size*0.12); ctx.stroke()
  ctx.beginPath(); ctx.moveTo(-size*0.04, -size*0.12); ctx.lineTo(-size*0.30, -size*0.06); ctx.stroke()
  ctx.beginPath(); ctx.moveTo(size*0.04, -size*0.16); ctx.lineTo(size*0.32, -size*0.20); ctx.stroke()
  ctx.beginPath(); ctx.moveTo(size*0.04, -size*0.14); ctx.lineTo(size*0.32, -size*0.12); ctx.stroke()
  ctx.beginPath(); ctx.moveTo(size*0.04, -size*0.12); ctx.lineTo(size*0.30, -size*0.06); ctx.stroke()

  // Paws at bottom
  ctx.fillStyle = c.body
  ctx.beginPath(); ctx.ellipse(-size*0.14, size*0.50, size*0.12, size*0.07, 0, 0, 2*Math.PI); ctx.fill()
  ctx.beginPath(); ctx.ellipse(size*0.14, size*0.50, size*0.12, size*0.07, 0, 0, 2*Math.PI); ctx.fill()
  // Toe beans
  ctx.fillStyle = c.nose; ctx.globalAlpha = 0.6
  ctx.beginPath(); ctx.arc(-size*0.18, size*0.53, size*0.025, 0, 2*Math.PI); ctx.fill()
  ctx.beginPath(); ctx.arc(-size*0.12, size*0.54, size*0.025, 0, 2*Math.PI); ctx.fill()
  ctx.beginPath(); ctx.arc(-size*0.06, size*0.53, size*0.025, 0, 2*Math.PI); ctx.fill()
  ctx.beginPath(); ctx.arc(size*0.06, size*0.53, size*0.025, 0, 2*Math.PI); ctx.fill()
  ctx.beginPath(); ctx.arc(size*0.12, size*0.54, size*0.025, 0, 2*Math.PI); ctx.fill()
  ctx.beginPath(); ctx.arc(size*0.18, size*0.53, size*0.025, 0, 2*Math.PI); ctx.fill()
  ctx.globalAlpha = 1
}

function drawMeowBubble(ctx, cat, size) {
  var alpha = cat.meowBubble
  var bw = size * 1.5
  var bh = size * 0.7
  var bx = size * 0.3
  var by = -size * 0.9

  ctx.save()
  ctx.globalAlpha = alpha

  // Bubble background
  ctx.fillStyle = 'white'
  ctx.strokeStyle = '#DDDDDD'
  ctx.lineWidth = 3
  ctx.beginPath()
  ctx.roundRect(bx, by, bw, bh, [bh*0.45])
  ctx.fill(); ctx.stroke()

  // Bubble tail pointing to cat mouth
  ctx.fillStyle = 'white'
  ctx.beginPath()
  ctx.moveTo(bx + bw*0.15, by + bh*0.85)
  ctx.lineTo(bx - size*0.05, by + bh*1.15)
  ctx.lineTo(bx + bw*0.35, by + bh*0.85)
  ctx.closePath(); ctx.fill()
  ctx.strokeStyle = '#DDDDDD'; ctx.lineWidth = 2
  ctx.beginPath()
  ctx.moveTo(bx + bw*0.14, by + bh*0.88)
  ctx.lineTo(bx - size*0.05, by + bh*1.15)
  ctx.lineTo(bx + bw*0.36, by + bh*0.88)
  ctx.stroke()

  // MEOW text
  ctx.fillStyle = '#FF6699'
  ctx.font = '700 ' + Math.floor(size*0.28) + 'px -apple-system, sans-serif'
  ctx.textAlign = 'center'
  ctx.textBaseline = 'middle'
  ctx.fillText('Meow!', bx + bw/2, by + bh*0.38)

  // Name text
  ctx.fillStyle = '#333'
  var nameFontSize = Math.min(Math.floor(size*0.22), Math.floor(bw * 0.6 / Math.max(1, cat.name.length * 0.6)))
  ctx.font = '600 ' + nameFontSize + 'px -apple-system, sans-serif'
  ctx.fillText(cat.name.split(' ')[0], bx + bw/2, by + bh*0.70)

  ctx.restore()
}

function checkCatTap(group, x, y) {
  var state = catsState[group]
  if (!state || state.stagingUid) return
  var tapped = null
  state.cats.forEach(function(c) {
    if (c.done || c.staging) return
    var dx = x - c.x, dy = y - c.y
    var hitR = c.size * 0.6
    if (Math.sqrt(dx*dx + dy*dy) < hitR) tapped = c
  })
  if (tapped) meowCat(group, tapped.uid)
}

function randomCatMeow(group) {
  var state = catsState[group]
  if (!state || state.stagingUid) return
  var done = ceremonyDone[group]
  var available = state.cats.filter(function(c) { return !c.done && !c.meowing && !c.staging })
  if (!available.length) return
  var pick = available[Math.floor(Math.random() * available.length)]
  meowCat(group, pick.uid)
}

function meowCat(group, uid) {
  var state = catsState[group]
  if (!state || state.stagingUid) return
  state.stagingUid = uid

  var cat = null
  state.cats.forEach(function(c) { if (c.uid === uid) cat = c })
  if (!cat) return

  // Save original position, move to center stage
  cat.origX = cat.x; cat.origY = cat.y
  cat.stageX = state.W / 2; cat.stageY = state.H * 0.45
  cat.staging = true; cat.stageProgress = 0

  // Play meow sound immediately (iOS needs sound in direct tap handler)
  playMeow()
  // Start mouth animation after cat arrives centre stage
  setTimeout(function() {
    cat.meowing = true
  }, 400)

  // Find winner and show reveal after meow
  setTimeout(function() {
    var winner = null
    allChildren.forEach(function(c) { if (c._uid === uid) winner = c })
    if (winner) {
      if (ceremonyDone[group].indexOf(uid) < 0) ceremonyDone[group].push(uid)
      cat.done = true; cat.staging = false
      cat.x = cat.origX; cat.y = cat.origY
      state.stagingUid = null
      renderCeremonyRosters()
      var remaining = wheelKids(group).filter(function(k) { return ceremonyDone[group].indexOf(k._uid) < 0 })
      showReveal(group, winner)
      revealIsLast = remaining.length === 0
      revealLastGroup = group
    }
  }, 2200)
}

function playMeow() {
  try {
    var actx = getAudioCtx()
    if (!actx) return
    // Synthesize a cute meow using FM synthesis
    var osc = actx.createOscillator()
    var modOsc = actx.createOscillator()
    var modGain = actx.createGain()
    var mainGain = actx.createGain()
    var filter = actx.createBiquadFilter()

    modOsc.type = 'sine'
    modOsc.frequency.setValueAtTime(8, actx.currentTime)
    modGain.gain.setValueAtTime(200, actx.currentTime)
    modGain.gain.exponentialRampToValueAtTime(20, actx.currentTime + 0.6)

    osc.type = 'sawtooth'
    osc.frequency.setValueAtTime(400, actx.currentTime)
    osc.frequency.exponentialRampToValueAtTime(700, actx.currentTime + 0.15)
    osc.frequency.exponentialRampToValueAtTime(350, actx.currentTime + 0.55)

    filter.type = 'bandpass'
    filter.frequency.setValueAtTime(900, actx.currentTime)
    filter.frequency.exponentialRampToValueAtTime(400, actx.currentTime + 0.55)
    filter.Q.value = 3

    mainGain.gain.setValueAtTime(0, actx.currentTime)
    mainGain.gain.linearRampToValueAtTime(0.35, actx.currentTime + 0.05)
    mainGain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.65)

    modOsc.connect(modGain)
    modGain.connect(osc.frequency)
    osc.connect(filter)
    filter.connect(mainGain)
    mainGain.connect(actx.destination)

    modOsc.start(); modOsc.stop(actx.currentTime + 0.7)
    osc.start(); osc.stop(actx.currentTime + 0.7)
  } catch(e) {}
}

function resetCeremonyCats(group) {
  if (catsAnimId[group]) { cancelAnimationFrame(catsAnimId[group]); catsAnimId[group] = null }
  catsState[group] = null
  if (ceremonyMode[group] === 'cats') initCats(group)
}


// ── BUBBLE PICKER ────────────────────────────────────────────────

var BUBBLE_COLORS = [
  ['#FF6B9D','#FF8FAB'],['#FF9F43','#FFBE76'],['#54A0FF','#74B9FF'],
  ['#5F27CD','#9B59B6'],['#00D2D3','#48DBFB'],['#FF6B6B','#FF9F9F'],
  ['#1DD1A1','#55EFC4'],['#FECA57','#FFE082'],['#C77DFF','#E0AAFF'],
  ['#F368E0','#FF9FF3']
]

function initBubbles(group) {
  var canvas = document.getElementById('bubble-canvas-' + group)
  if (!canvas) return
  // Use parent width as fallback when canvas is hidden (offsetWidth = 0)
  var parent = canvas.parentElement || canvas
  var W = canvas.offsetWidth || parent.offsetWidth || window.innerWidth - 28
  var H = W  // square
  canvas.width = W
  canvas.height = H
  canvas.style.width = W + 'px'
  canvas.style.height = H + 'px'

  var kids = wheelKids(group)
  var done = ceremonyDone[group]
  var available = kids.filter(function(k) { return done.indexOf(k._uid) < 0 })

  if (!available.length) return

  // Create bubble objects
  var minR = Math.max(28, Math.min(52, Math.floor(W / (available.length + 2))))
  var maxR = minR + 14

  var bubbles = available.map(function(k, i) {
    var r = minR + Math.random() * (maxR - minR)
    var colors = BUBBLE_COLORS[i % BUBBLE_COLORS.length]
    return {
      uid: k._uid,
      name: k.name.split(' ')[0],
      fullName: k.name,
      x: r + Math.random() * (W - r * 2),
      y: r + Math.random() * (H - r * 2),
      r: r,
      vx: (Math.random() - 0.5) * 1.8,
      vy: (Math.random() - 0.5) * 1.8,
      color1: colors[0],
      color2: colors[1],
      alpha: 1,
      popping: false,
      popProgress: 0,
      wobble: Math.random() * Math.PI * 2,
      wobbleSpeed: 0.03 + Math.random() * 0.02
    }
  })

  bubbleState[group] = bubbles

  // Add tap handler
  canvas.ontouchstart = function(e) {
    e.preventDefault()
    var rect = canvas.getBoundingClientRect()
    var scaleX = canvas.width / rect.width
    var scaleY = canvas.height / rect.height
    var touch = e.touches[0]
    var x = (touch.clientX - rect.left) * scaleX
    var y = (touch.clientY - rect.top) * scaleY
    checkBubbleTap(group, x, y)
  }
  canvas.onclick = function(e) {
    var rect = canvas.getBoundingClientRect()
    var scaleX = canvas.width / rect.width
    var scaleY = canvas.height / rect.height
    var x = (e.clientX - rect.left) * scaleX
    var y = (e.clientY - rect.top) * scaleY
    checkBubbleTap(group, x, y)
  }

  if (bubbleAnimId[group]) cancelAnimationFrame(bubbleAnimId[group])
  animateBubbles(group)
}

function animateBubbles(group) {
  var canvas = document.getElementById('bubble-canvas-' + group)
  if (!canvas || ceremonyMode[group] !== 'bubble') return
  var ctx = canvas.getContext('2d')
  var W = canvas.width, H = canvas.height
  var bubbles = bubbleState[group]
  if (!bubbles) return

  ctx.clearRect(0, 0, W, H)

  // Draw twinkling stars background
  ctx.fillStyle = 'rgba(255,255,255,0.04)'
  for (var s = 0; s < 30; s++) {
    var sx = (s * 137 + 50) % W
    var sy = (s * 97 + 30) % H
    ctx.beginPath()
    ctx.arc(sx, sy, 1, 0, 2 * Math.PI)
    ctx.fill()
  }

  var allGone = true
  bubbles.forEach(function(b) {
    if (b.alpha <= 0) return
    allGone = false

    if (b.popping) {
      b.popProgress += 0.06
      b.alpha = Math.max(0, 1 - b.popProgress * 1.5)
      b.r = b.r * (1 + b.popProgress * 0.3)
    } else {
      // Float movement with gentle wobble
      b.wobble += b.wobbleSpeed
      b.x += b.vx + Math.sin(b.wobble) * 0.3
      b.y += b.vy + Math.cos(b.wobble * 0.7) * 0.2

      // Bounce off walls
      if (b.x - b.r < 0) { b.x = b.r; b.vx = Math.abs(b.vx) }
      if (b.x + b.r > W) { b.x = W - b.r; b.vx = -Math.abs(b.vx) }
      if (b.y - b.r < 0) { b.y = b.r; b.vy = Math.abs(b.vy) }
      if (b.y + b.r > H) { b.y = H - b.r; b.vy = -Math.abs(b.vy) }
    }

    // Draw bubble
    ctx.save()
    ctx.globalAlpha = b.alpha

    // Gradient fill
    var grad = ctx.createRadialGradient(b.x - b.r*0.3, b.y - b.r*0.3, b.r*0.1, b.x, b.y, b.r)
    grad.addColorStop(0, b.color2)
    grad.addColorStop(1, b.color1)
    ctx.beginPath()
    ctx.arc(b.x, b.y, b.r, 0, 2 * Math.PI)
    ctx.fillStyle = grad
    ctx.fill()

    // Shiny highlight
    var hi = ctx.createRadialGradient(b.x - b.r*0.35, b.y - b.r*0.35, 0, b.x - b.r*0.35, b.y - b.r*0.35, b.r * 0.5)
    hi.addColorStop(0, 'rgba(255,255,255,0.55)')
    hi.addColorStop(1, 'rgba(255,255,255,0)')
    ctx.beginPath()
    ctx.arc(b.x, b.y, b.r, 0, 2 * Math.PI)
    ctx.fillStyle = hi
    ctx.fill()

    // Border glow
    ctx.beginPath()
    ctx.arc(b.x, b.y, b.r, 0, 2 * Math.PI)
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'
    ctx.lineWidth = 2
    ctx.stroke()

    // Question mark on unpopped bubbles
    if (!b.popping) {
      var fontSize = Math.max(14, Math.floor(b.r * 0.55))
      ctx.fillStyle = 'rgba(255,255,255,0.7)'
      ctx.font = '600 ' + fontSize + 'px -apple-system, sans-serif'
      ctx.textAlign = 'center'
      ctx.textBaseline = 'middle'
      ctx.fillText('?', b.x, b.y)
    }
    ctx.restore()
  })

  bubbleAnimId[group] = requestAnimationFrame(function() { animateBubbles(group) })
}

function checkBubbleTap(group, x, y) {
  var bubbles = bubbleState[group]
  if (!bubbles) return
  var done = ceremonyDone[group]
  var tapped = null
  // Find which bubble was tapped (closest centre to tap point, within radius)
  var bestDist = Infinity
  bubbles.forEach(function(b) {
    if (b.popping || b.alpha <= 0) return
    if (done.indexOf(b.uid) >= 0) return
    var dist = Math.sqrt((b.x - x) * (b.x - x) + (b.y - y) * (b.y - y))
    if (dist < b.r && dist < bestDist) {
      bestDist = dist
      tapped = b
    }
  })
  if (!tapped) return
  popBubbleByUid(group, tapped.uid)
}

function popBubble(group) {
  // Random pop — pick a random available bubble
  var bubbles = bubbleState[group]
  if (!bubbles) return
  var done = ceremonyDone[group]
  var available = bubbles.filter(function(b) { return !b.popping && b.alpha > 0 && done.indexOf(b.uid) < 0 })
  if (!available.length) return
  var pick = available[Math.floor(Math.random() * available.length)]
  popBubbleByUid(group, pick.uid)
}

function popBubbleByUid(group, uid) {
  var bubbles = bubbleState[group]
  if (!bubbles) return
  var bubble = null
  bubbles.forEach(function(b) { if (b.uid === uid) bubble = b })
  if (!bubble || bubble.popping) return

  // Play pop sound
  try {
    var actx = getAudioCtx()
    if (!actx) return
    var osc = actx.createOscillator()
    var gain = actx.createGain()
    osc.connect(gain); gain.connect(actx.destination)
    osc.type = 'sine'
    osc.frequency.setValueAtTime(800, actx.currentTime)
    osc.frequency.exponentialRampToValueAtTime(200, actx.currentTime + 0.15)
    gain.gain.setValueAtTime(0.4, actx.currentTime)
    gain.gain.linearRampToValueAtTime(0, actx.currentTime + 0.15)
    osc.start(); osc.stop(actx.currentTime + 0.2)
  } catch(e) {}

  bubble.popping = true

  // Find the winner in allChildren
  var winner = null
  allChildren.forEach(function(c) { if (c._uid === uid) winner = c })
  if (!winner) return

  if (ceremonyDone[group].indexOf(uid) < 0) ceremonyDone[group].push(uid)
  renderCeremonyRosters()

  // Check if last kid
  var remaining = wheelKids(group).filter(function(k) { return ceremonyDone[group].indexOf(k._uid) < 0 })
  var isLast = remaining.length === 0

  setTimeout(function() {
    showReveal(group, winner)
    revealIsLast = isLast
    revealLastGroup = group
  }, 400)
}

function resetCeremonyBubbles(group) {
  if (bubbleAnimId[group]) { cancelAnimationFrame(bubbleAnimId[group]); bubbleAnimId[group] = null }
  bubbleState[group] = null
  if (ceremonyMode[group] === 'bubble') initBubbles(group)
}

// reveal state
var revealGroup = null
var revealWinner = null
var revealIsLast = false
var revealLastGroup = null
var confettiAnimId = null
var confettiParticles = []

var CONFETTI_COLORS = ['#FF6B6B','#FFD93D','#6BCB77','#4D96FF','#C77DFF','#FF9A3C','#FF6FC8','#00C9A7']

function launchConfetti() {
  var canvas = document.getElementById('confetti-canvas')
  if (!canvas) return
  canvas.width = window.innerWidth
  canvas.height = window.innerHeight
  var ctx = canvas.getContext('2d')
  confettiParticles = []
  for (var i = 0; i < 120; i++) {
    confettiParticles.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * 100,
      w: 8 + Math.random() * 10,
      h: 4 + Math.random() * 6,
      color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
      rot: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 8,
      vy: 3 + Math.random() * 5,
      vx: (Math.random() - 0.5) * 4,
      opacity: 1
    })
  }
  function drawConfetti() {
    ctx.clearRect(0, 0, canvas.width, canvas.height)
    var alive = false
    confettiParticles.forEach(function(p) {
      p.y += p.vy
      p.x += p.vx
      p.rot += p.rotSpeed
      if (p.y > canvas.height + 20) { p.opacity -= 0.05 }
      if (p.opacity > 0) {
        alive = true
        ctx.save()
        ctx.globalAlpha = p.opacity
        ctx.translate(p.x, p.y)
        ctx.rotate(p.rot * Math.PI / 180)
        ctx.fillStyle = p.color
        ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h)
        ctx.restore()
      }
    })
    if (alive) confettiAnimId = requestAnimationFrame(drawConfetti)
    else ctx.clearRect(0, 0, canvas.width, canvas.height)
  }
  if (confettiAnimId) cancelAnimationFrame(confettiAnimId)
  confettiAnimId = requestAnimationFrame(drawConfetti)
}

function playFanfare() {
  try {
    var ctx = getAudioCtx()
    if (!ctx) return
    var notes = [523, 659, 784, 1047]
    notes.forEach(function(freq, i) {
      var osc = ctx.createOscillator()
      var gain = ctx.createGain()
      osc.connect(gain)
      gain.connect(ctx.destination)
      osc.frequency.value = freq
      osc.type = 'sine'
      gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.12)
      gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + i * 0.12 + 0.05)
      gain.gain.linearRampToValueAtTime(0, ctx.currentTime + i * 0.12 + 0.25)
      osc.start(ctx.currentTime + i * 0.12)
      osc.stop(ctx.currentTime + i * 0.12 + 0.3)
    })
  } catch(e) {}
}

function playWhoosh() {
  try {
    var ctx = getAudioCtx()
    if (!ctx) return
    var bufferSize = ctx.sampleRate * 0.3
    var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate)
    var data = buffer.getChannelData(0)
    for (var i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize)
    var source = ctx.createBufferSource()
    source.buffer = buffer
    var filter = ctx.createBiquadFilter()
    filter.type = 'bandpass'
    filter.frequency.value = 800
    source.connect(filter)
    filter.connect(ctx.destination)
    source.start()
  } catch(e) {}
}

function showReveal(group, winner) {
  revealGroup = group
  revealWinner = winner
  // Reset state
  document.getElementById('reveal-pre').style.display = 'block'
  document.getElementById('reveal-badge-wrap').className = 'reveal-badge-wrap'
  document.getElementById('reveal-overlay').className = 'reveal-overlay open'
  document.getElementById('reveal-name').textContent = winner.name
  playWhoosh()
}

function onRevealTap() {
  // Keep AudioContext alive on each tap
  var actx = getAudioCtx()
  if (actx && actx.state === 'suspended') actx.resume()
  var pre = document.getElementById('reveal-pre')
  var badgeWrap = document.getElementById('reveal-badge-wrap')
  if (badgeWrap.className.indexOf('show') >= 0) return // already revealed
  pre.style.display = 'none'
  var badge = revealWinner ? revealWinner.badge : ''
  var style = badge && BADGE_STYLES[badge] ? BADGE_STYLES[badge] : { emoji: '🏅', bg: '#EEF', ring: '#533AB7' }
  var circle = document.getElementById('reveal-badge-circle')
  circle.style.background = style.bg
  circle.style.boxShadow = '0 0 0 8px ' + style.ring + ', 0 0 60px ' + style.ring + '88'
  document.getElementById('reveal-badge-emoji').textContent = style.emoji
  document.getElementById('reveal-badge-label').textContent = badge || 'Amazing work!'
  document.getElementById('reveal-badge-sub').textContent = revealWinner ? revealWinner.name : ''
  badgeWrap.className = 'reveal-badge-wrap show'
  document.getElementById('reveal-overlay').className = 'reveal-overlay open tapped'
  playFanfare()
  launchConfetti()
}

function closeReveal(e) {
  if (e) { e.stopPropagation() }
  document.getElementById('reveal-overlay').className = 'reveal-overlay'
  if (confettiAnimId) {
    cancelAnimationFrame(confettiAnimId)
    var canvas = document.getElementById('confetti-canvas')
    if (canvas) canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height)
  }
  var wasLast = revealIsLast
  var lastGroup = revealLastGroup
  revealGroup = null
  revealWinner = null
  revealIsLast = false
  revealLastGroup = null
  if (wasLast) {
    setTimeout(function() { showFinale(lastGroup) }, 200)
  }
}

function updateCeremonyWarnings() {
  var groups = ['am', 'pm']
  groups.forEach(function(group) {
    var kids = wheelKids(group)
    var missing = kids.filter(function(k) { return !k.badge })
    var warn = document.getElementById('warn-' + group)
    if (warn) warn.className = 'ceremony-warning' + (missing.length > 0 ? ' show' : '')
  })
}

function spin(group) {
  var actx = getAudioCtx()
  if (actx && actx.state === 'suspended') actx.resume()
  var kids = wheelKids(group)
  var remaining = kids.filter(function(k) { return ceremonyDone[group].indexOf(k._uid) < 0 })
  if (!kids.length || spinning[group]) return
  if (!remaining.length) {
    document.getElementById('winner-' + group).innerHTML = '<div style="font-size:14px;color:#888">Everyone has been celebrated!</div>'
    return
  }
  spinning[group] = true
  document.getElementById('spin-' + group).disabled = true

  var totalSpin = 6 * 2 * Math.PI + Math.random() * 2 * Math.PI
  var duration = 3500
  var start = performance.now()
  var startAngle = spinAngles[group]

  function animate(now) {
    var t = Math.min((now - start) / duration, 1)
    var ease = 1 - Math.pow(1 - t, 4)
    spinAngles[group] = startAngle + totalSpin * ease
    var n = kids.length
    var arc = (2 * Math.PI) / n
    var normalized = ((-spinAngles[group] % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI)
    var idx = Math.floor(normalized / arc)
    drawWheel(group, idx, spinAngles[group])
    if (t < 1) {
      requestAnimationFrame(animate)
    } else {
      spinning[group] = false
      document.getElementById('spin-' + group).disabled = false

      // If landed on a greyed-out (already done) slot, find nearest available slot
      var done = ceremonyDone[group]
      if (done.indexOf(kids[idx]._uid) >= 0) {
        // Search outward from idx for nearest non-done slot
        var found = -1
        for (var offset = 1; offset < kids.length; offset++) {
          var left = (idx - offset + kids.length) % kids.length
          var right = (idx + offset) % kids.length
          if (done.indexOf(kids[right]._uid) < 0) { found = right; break }
          if (done.indexOf(kids[left]._uid) < 0) { found = left; break }
        }
        if (found >= 0) {
          // Nudge the wheel angle to land on the found slot
          idx = found
          spinAngles[group] = -((found + 0.5) * arc) + 2 * Math.PI * Math.round(spinAngles[group] / (2 * Math.PI))
          drawWheel(group, idx, spinAngles[group])
        }
      }

      var winner = kids[idx]
      if (winner) {
        if (ceremonyDone[group].indexOf(winner._uid) < 0) ceremonyDone[group].push(winner._uid)
        renderCeremonyRosters()
        drawWheel(group, -1, spinAngles[group])
        // Check if this was the last kid
        var remaining = wheelKids(group).filter(function(k) { return ceremonyDone[group].indexOf(k._uid) < 0 })
        if (remaining.length === 0) {
          // Last kid - show reveal then finale
          showReveal(group, winner)
          // Finale will show after reveal is closed - set flag
          revealIsLast = true
          revealLastGroup = group
        } else {
          showReveal(group, winner)
          revealIsLast = false
        }
      } else {
        renderCeremonyRosters()
        drawWheel(group, -1, spinAngles[group])
      }
    }
  }
  requestAnimationFrame(animate)
}

function undoCeremony(group, uid) {
  ceremonyDone[group] = ceremonyDone[group].filter(function(x) { return x !== uid })
  renderCeremonyRosters()
  drawWheel(group, -1, spinAngles[group])
}

function resetCeremony(group) {
  if (!confirm('Reset ceremony?')) return
  ceremonyDone[group] = []
  spinAngles[group] = 0
  document.getElementById('winner-' + group).innerHTML = ''
  renderCeremonyRosters()
  drawWheel(group, -1, 0)
  resetCeremonyBubbles(group)
  resetCeremonyLightning(group)
  resetCeremonyCats(group)
}

// -- HELPERS -
function makeUid(str) {
  var result = ''
  for (var i = 0; i < str.length; i++) {
    var c = str[i]
    var code = str.charCodeAt(i)
    if ((code >= 48 && code <= 57) || (code >= 65 && code <= 90) || (code >= 97 && code <= 122) || c === '-' || c === '_') {
      result += c
    } else {
      result += '_'
    }
  }
  return result
}

// ------------------------------------------------------
function getMatchingLineItems(rawPayload, sessionDate) {
  try {
    var payload = typeof rawPayload === 'string' ? JSON.parse(rawPayload) : rawPayload
    if (!payload || !payload.line_items) return []
    var items = payload.line_items
    if (!sessionDate) return items
    var d = new Date(sessionDate + 'T12:00:00')
    var monthDay = d.toLocaleDateString('en-CA', { month: 'short', day: 'numeric' }).replace('.', '').toLowerCase()
    var day = d.getDate()
    var suffix = (day===1||day===21||day===31)?'st':(day===2||day===22)?'nd':(day===3||day===23)?'rd':'th'
    var matches = items.filter(function(item) {
      var t = (item.title || item.name || '').toLowerCase()
      return t.indexOf(monthDay) >= 0 || t.indexOf(monthDay + suffix) >= 0
    })
    return matches.length ? matches : [items[0]]
  } catch(e) { return [] }
}

function parseLineItemProps(rawPayload, sessionDate) {
  try {
    var payload = typeof rawPayload === 'string' ? JSON.parse(rawPayload) : rawPayload
    if (!payload || !payload.line_items) return []
    var items = payload.line_items
    var match = null
    if (sessionDate) {
      var d = new Date(sessionDate + 'T12:00:00')
      var monthDay = d.toLocaleDateString('en-CA', { month: 'short', day: 'numeric' }).replace('.', '').toLowerCase()
      var day = d.getDate()
      var suffix = (day===1||day===21||day===31)?'st':(day===2||day===22)?'nd':(day===3||day===23)?'rd':'th'
      for (var i = 0; i < items.length; i++) {
        var t = (items[i].title || items[i].name || '').toLowerCase()
        if (t.indexOf(monthDay) >= 0 || t.indexOf(monthDay + suffix) >= 0) { match = items[i]; break }
      }
    }
    if (!match) match = items[0]
    return (match && match.properties) ? match.properties : []
  } catch(e) { return [] }
}

function formatDOB(dobStr, refDateStr) {
  try {
    var dob = new Date(dobStr + 'T12:00:00')
    var ref = refDateStr ? new Date(refDateStr + 'T12:00:00') : new Date()
    var age = ref.getFullYear() - dob.getFullYear()
    var m = ref.getMonth() - dob.getMonth()
    if (m < 0 || (m === 0 && ref.getDate() < dob.getDate())) age--
    var formatted = dob.toLocaleDateString('en-CA', { year: 'numeric', month: 'short', day: 'numeric' })
    return 'Age ' + age + ' - b. ' + formatted
  } catch(e) { return dobStr }
}

function getPayloadPhone(rawPayload) {
  try {
    var p = typeof rawPayload === 'string' ? JSON.parse(rawPayload) : rawPayload
    if (!p) return ''
    return (p.billing_address && p.billing_address.phone) || (p.shipping_address && p.shipping_address.phone) || (p.customer && p.customer.phone) || p.phone || ''
  } catch(e) { return '' }
}


function showCoOther(uid, val) {
  var o = document.getElementById('coother-' + uid)
  if (o) o.style.display = val === '__other__' ? 'block' : 'none'
}

function renderCheckoutTab() {
  var el = document.getElementById('checkout-content')
  if (!el) return
  var today = dateStr(currentDate)
  var list = allChildren.filter(function(c) { return c.attendanceChecked })
  list.sort(function(a,b) { return (a.name||'').localeCompare(b.name||'') })
  if (!list.length) { el.innerHTML = '<div class="empty">No checked-in children yet.</div>'; return }
  var rows = list.map(function(child) {
    var uid = child._uid
    var opts = ''
    if (child.registeredBy) opts += '<option value="' + child.registeredBy + '">' + child.registeredBy + ' (Parent)</option>'
    if (child.emergency) opts += '<option value="' + child.emergency + '">' + child.emergency + ' (Emergency)</option>'
    if (child.alternatePick) opts += '<option value="' + child.alternatePick + '">' + child.alternatePick + ' (Alt Pickup)</option>'
    if (child.walkHome) opts += '<option value="__walkhome__">Walk Home</option>'
    opts += '<option value="__other__">Other...</option>'
    var checkedOut = child.checkedOutBy ? true : false
    return '<div class="checkout-row" id="corow-' + uid + '" style="' + (checkedOut ? 'background:#f0fdf4' : '') + '">' +
      '<div class="checkout-info">' +
        '<div class="checkout-name">' + (child.name || '') + '</div>' +
        '<div class="checkout-meta">' + (child.sessionGroup === 'am' ? 'AM' : child.sessionGroup === 'fd' ? 'Full Day' : 'PM') + (child.aftercare ? ' - Aftercare' : '') + '</div>' +
      '</div>' +
      '<div class="checkout-right">' +
        (checkedOut
          ? '<div class="checkout-done"><span style="color:#3B6D11;font-weight:600">&#x2713; ' + child.checkedOutBy + '</span><button class="checkout-undo-btn" onclick="undoCheckout(&quot;' + uid + '&quot;)">Undo</button></div>'
          : '<select class="checkout-select" id="cosel-' + uid + '" onchange="showCoOther(&quot;' + uid + '&quot;,this.value)">' +
              '<option value="">-- Select --</option>' + opts +
            '</select>' +
            '<div id="coother-' + uid + '" style="display:none;margin-top:6px">' +
              '<input type="text" class="checkout-other-input" id="coinput-' + uid + '" placeholder="Enter name...">' +
            '</div>' +
            '<button class="checkout-confirm-btn" onclick="doCheckout(&quot;' + uid + '&quot;)">Check Out</button>'
        ) +
      '</div>' +
    '</div>'
  }).join('')
  el.innerHTML = '<div class="checkout-list">' + rows + '</div>'
}

function doCheckout(uid) {
  var child = null
  allChildren.forEach(function(x) { if (x._uid === uid) child = x })
  if (!child) return
  var sel = document.getElementById('cosel-' + uid)
  var val = sel ? sel.value : ''
  if (val === '__other__') { var inp = document.getElementById('coinput-' + uid); val = inp ? inp.value.trim() : '' }
  if (val === '__walkhome__') val = 'Walk Home'
  if (!val) { showToast('Please select who picked up'); return }
  child.checkedOutBy = val
  var today = dateStr(currentDate)
  var now = new Date().toISOString()
  sbGet('attendance?shopify_order_name=eq.' + encodeURIComponent(child.orderName) + '&camper_name=eq.' + encodeURIComponent(child.name) + '&attended_date=eq.' + today + '&select=id&limit=1').then(function(rows) {
    var payload = { checked_out_at: now, checked_out_by: val }
    if (rows && rows.length) { sbPatch('attendance?id=eq.' + rows[0].id, payload) }
    else { sbPost('attendance', { session_id: child.sessionId, shopify_order_name: child.orderName, camper_name: child.name, attended: true, attended_date: today, checked_out_at: now, checked_out_by: val }) }
  })
  var row = document.getElementById('corow-' + uid)
  if (row) {
    row.style.background = '#f0fdf4'
    row.querySelector('.checkout-right').innerHTML = '<div class="checkout-done"><span style="color:#3B6D11;font-weight:600">&#x2713; ' + val + '</span><button class="checkout-undo-btn" onclick="undoCheckout(&quot;' + uid + '&quot;)">Undo</button></div>'
  }
  showToast(child.name + ' checked out!')
}

function undoCheckout(uid) {
  var child = null
  allChildren.forEach(function(x) { if (x._uid === uid) child = x })
  if (!child) return
  child.checkedOutBy = ''
  var today = dateStr(currentDate)
  sbGet('attendance?shopify_order_name=eq.' + encodeURIComponent(child.orderName) + '&camper_name=eq.' + encodeURIComponent(child.name) + '&attended_date=eq.' + today + '&select=id&limit=1').then(function(rows) {
    if (rows && rows.length) sbPatch('attendance?id=eq.' + rows[0].id, { checked_out_at: null, checked_out_by: null })
  })
  renderCheckoutTab()
  showToast('Checkout undone')
}

function renderPickupTag(uid, pickup) {
  var el = document.getElementById('pickuptag-' + uid)
  if (el) el.textContent = pickup || ''
}

function showToast(msg) {
  var t = document.getElementById('toast')
  t.textContent = msg; t.className = 'toast show'
  setTimeout(function() { t.className = 'toast' }, 2000)
}
