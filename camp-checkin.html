<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>4Cats Camp Check-In</title>
<link rel="icon" type="image/svg+xml" href="https://cdn.shopify.com/s/files/1/1451/3756/files/favicon.png?v=1613591354">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:#f5f5f0;color:#1a1a1a;min-height:100vh;-webkit-text-size-adjust:100%}

/* LOGIN */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
.login-card{background:white;border-radius:16px;border:0.5px solid #e0e0d8;padding:2rem;width:100%;max-width:380px}
.login-card h1{font-size:22px;font-weight:500;margin-bottom:4px;text-align:center}
.login-card p{font-size:14px;color:#888;margin-bottom:1.5rem;text-align:center}
.login-card input{width:100%;padding:12px 14px;border:0.5px solid #d0d0c8;border-radius:10px;font-size:16px;margin-bottom:12px;outline:none;display:block;-webkit-appearance:none}
.login-card input:focus{border-color:#888}
.login-card button{width:100%;padding:13px;background:#1a1a1a;color:white;border:none;border-radius:10px;font-size:16px;cursor:pointer}
.error-msg{color:#c0392b;font-size:13px;margin-top:8px;display:none}

/* APP HEADER */
#app-screen{display:none}
.app-header{background:white;border-bottom:0.5px solid #e0e0d8;padding:10px 16px;position:sticky;top:0;z-index:100}
.header-row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.header-title{font-size:17px;font-weight:600;color:#1a1a1a}
.header-sub{font-size:12px;color:#888}
.date-nav{display:flex;align-items:center;gap:8px}
.date-nav button{background:white;border:0.5px solid #d0d0c8;border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer;color:#1a1a1a}
.date-nav button:active{background:#f5f5f0}
.date-nav input[type=date]{border:0.5px solid #d0d0c8;border-radius:8px;padding:6px 10px;font-size:14px;background:white;color:#1a1a1a;-webkit-appearance:none}
.today-btn{font-size:12px;padding:5px 10px;background:#f5f5f0}

/* TABS */
.tabs{display:flex;background:white;border-bottom:0.5px solid #e0e0d8;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab-btn{flex:1;min-width:120px;padding:11px 8px;font-size:13px;font-weight:500;border:none;background:none;cursor:pointer;color:#888;border-bottom:2px solid transparent;white-space:nowrap}
.tab-btn.active{color:#1a1a1a;border-bottom-color:#1a1a1a}

/* CONTENT */
.tab-content{display:none;padding:14px 14px 80px}
.tab-content.active{display:block}

/* SESSION SELECTOR */
.session-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.session-pill{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:500;border:1.5px solid #d0d0c8;background:white;cursor:pointer;color:#555}
.session-pill.active{background:#1a1a1a;color:white;border-color:#1a1a1a}
.session-pill.am{border-color:#0F6E56}
.session-pill.am.active{background:#0F6E56;border-color:#0F6E56}
.session-pill.pm{border-color:#3C3489}
.session-pill.pm.active{background:#3C3489;border-color:#3C3489}

/* STATS BAR */
.stats-bar{display:flex;gap:10px;margin-bottom:14px}
.stat-card{background:white;border:0.5px solid #e0e0d8;border-radius:10px;padding:8px 14px;flex:1;text-align:center}
.stat-num{font-size:22px;font-weight:500}
.stat-label{font-size:11px;color:#888;margin-top:1px}

/* DAY PLAN BANNER */
.day-plan-banner{background:white;border:0.5px solid #e0e0d8;border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.day-plan-label{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.day-plan-text{font-size:14px;font-weight:500;color:#1a1a1a}
.day-plan-link{font-size:12px;color:#5b4fcf;text-decoration:none;margin-left:6px}

/* SEARCH + SORT */
.controls-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.search-input{flex:1;min-width:180px;padding:9px 12px;border:0.5px solid #d0d0c8;border-radius:10px;font-size:16px;background:white;color:#1a1a1a;-webkit-appearance:none;outline:none}
.sort-group{display:flex;gap:4px}
.sort-btn{padding:8px 12px;font-size:13px;border:0.5px solid #d0d0c8;border-radius:8px;background:white;color:#888;cursor:pointer;white-space:nowrap}
.sort-btn.active{background:#1a1a1a;color:white;border-color:#1a1a1a}

/* ROSTER CARDS — iPad-friendly big tap targets */
.roster-list{display:flex;flex-direction:column;gap:8px}
.roster-card{background:white;border:0.5px solid #e0e0d8;border-radius:12px;overflow:hidden;transition:box-shadow .1s}
.roster-card.checked-in{border-left:4px solid #3B6D11}
.roster-card.has-medical{border-right:4px solid #BA7517}
.roster-card-header{display:flex;align-items:center;gap:12px;padding:12px 14px}
.check-btn{width:38px;height:38px;border-radius:8px;border:2px solid #d0d0c8;background:white;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;transition:all .15s;-webkit-tap-highlight-color:transparent}
.check-btn.checked{background:#3B6D11;border-color:#3B6D11;color:white}
.check-btn:not(.checked){color:transparent}
.child-info{flex:1;min-width:0}
.child-name{font-size:16px;font-weight:500;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.child-meta{font-size:12px;color:#888;margin-top:1px}
.card-badges{display:flex;gap:6px;align-items:center;flex-shrink:0}
.session-tag{font-size:11px;font-weight:500;padding:3px 8px;border-radius:12px}
.session-tag.am{background:#E1F5EE;color:#0F6E56}
.session-tag.pm{background:#EEEDFE;color:#3C3489}
.session-tag.fd{background:#E6F1FB;color:#185FA5}
.aftercare-tag{font-size:11px;padding:3px 7px;border-radius:12px;background:#FEF3C7;color:#92400E;font-weight:500}
.walkhome-tag{font-size:11px;padding:3px 7px;border-radius:12px;background:#FEE2E2;color:#991B1B;font-weight:500}
.medical-icon{font-size:18px;cursor:pointer;-webkit-tap-highlight-color:transparent}

/* CARD BODY — expandable fields */
.roster-card-body{padding:0 14px 12px;display:flex;gap:10px;flex-wrap:wrap}
.field-group{display:flex;flex-direction:column;gap:3px}
.field-label{font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:.05em}
.field-input{padding:7px 10px;border:0.5px solid #e0e0d8;border-radius:8px;font-size:15px;background:#fafaf8;color:#1a1a1a;width:100%;outline:none;-webkit-appearance:none}
.field-input:focus{border-color:#888;background:white}
.table-input{width:70px}
.badge-select{min-width:160px;font-size:14px}
.badge-select option.previously-awarded{color:#bbb}
.save-row-btn{padding:7px 16px;background:#1a1a1a;color:white;border:none;border-radius:8px;font-size:13px;cursor:pointer;align-self:flex-end;white-space:nowrap}
.save-row-btn.saved{background:#3B6D11}

/* MEDICAL MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal-card{background:white;border-radius:16px;padding:20px;max-width:400px;width:100%;max-height:80vh;overflow-y:auto}
.modal-card h3{font-size:17px;font-weight:600;margin-bottom:12px}
.modal-row{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.modal-label{font-size:11px;color:#aaa;text-transform:uppercase;letter-spacing:.05em}
.modal-value{font-size:14px;color:#1a1a1a}
.modal-close{width:100%;padding:12px;background:#f5f5f0;border:none;border-radius:10px;font-size:15px;cursor:pointer;margin-top:8px}

/* CEREMONY TAB */
.ceremony-wrap{display:flex;flex-direction:column;align-items:center;padding:10px 0 40px}
.ceremony-group{width:100%;max-width:480px;margin-bottom:32px}
.ceremony-group-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.ceremony-group-time{font-size:12px;color:#888;font-weight:400}
.wheel-wrap{position:relative;width:320px;height:320px;margin:0 auto 16px}
canvas{border-radius:50%;display:block}
.wheel-pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:22px solid #D85A30}
.spin-btn{display:block;width:200px;margin:0 auto 12px;padding:14px;font-size:16px;font-weight:500;border:none;border-radius:12px;background:#1a1a1a;color:white;cursor:pointer;-webkit-tap-highlight-color:transparent}
.spin-btn:disabled{background:#e0e0d8;color:#888;cursor:default}
.winner-box{text-align:center;min-height:56px;margin-bottom:16px}
.winner-name{font-size:24px;font-weight:600;color:#533AB7;animation:popIn .3s ease}
.winner-badge-name{font-size:13px;color:#888;margin-top:2px}
@keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.ceremony-roster{display:flex;flex-direction:column;gap:6px;width:100%}
.ceremony-kid{display:flex;align-items:center;gap:10px;padding:9px 12px;background:white;border:0.5px solid #e0e0d8;border-radius:10px;font-size:14px}
.ceremony-kid.done{background:#E1F5EE;border-color:#9FE1CB}
.ceremony-kid.greyed{opacity:.45}
.ceremony-kid-name{font-weight:500;flex:1}
.ceremony-kid-badge{font-size:12px;color:#888}
.ceremony-reset{font-size:12px;color:#888;text-align:center;margin-top:8px;cursor:pointer;text-decoration:underline}

/* LOADING */
.loading{text-align:center;padding:40px 20px;color:#888;font-size:14px}
.empty{text-align:center;padding:40px 20px;color:#bbb;font-size:14px}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:white;padding:10px 20px;border-radius:20px;font-size:14px;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <img src="https://cdn.shopify.com/s/files/1/1451/3756/files/favicon.png?v=1613591354" style="width:52px;display:block;margin:0 auto 12px;border-radius:10px">
    <h1>Camp Check-In</h1>
    <p>Sign in with your 4Cats studio account</p>
    <input type="email" id="login-email" placeholder="Email" autocomplete="email">
    <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
    <button onclick="doLogin()">Sign In</button>
    <div class="error-msg" id="login-error"></div>
  </div>
</div>

<!-- APP -->
<div id="app-screen">
  <div class="app-header">
    <div class="header-row1">
      <div>
        <div class="header-title">🎨 Camp Check-In</div>
        <div class="header-sub" id="studio-label">Loading…</div>
      </div>
      <button onclick="doSignOut()" style="background:none;border:0.5px solid #d0d0c8;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;color:#888">Sign out</button>
    </div>
    <div class="date-nav">
      <button onclick="shiftDate(-1)">‹</button>
      <input type="date" id="date-picker" onchange="pickDate(this.value)">
      <button onclick="goToday()" class="today-btn">Today</button>
      <button onclick="shiftDate(1)">›</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('checkin',this)">✓ Check-In</button>
    <button class="tab-btn" onclick="switchTab('ceremony-am',this)">🌅 AM Ceremony</button>
    <button class="tab-btn" onclick="switchTab('ceremony-pm',this)">🌇 PM Ceremony</button>
  </div>

  <!-- CHECK-IN TAB -->
  <div id="tab-checkin" class="tab-content active">
    <div id="checkin-content"><div class="loading">Loading…</div></div>
  </div>

  <!-- AM CEREMONY TAB -->
  <div id="tab-ceremony-am" class="tab-content">
    <div class="ceremony-wrap">
      <div class="ceremony-group" id="am-ceremony-wrap">
        <div class="ceremony-group-title">🌅 Morning Ceremony <span class="ceremony-group-time">11:30 am · Half Day MORNING</span></div>
        <div class="wheel-wrap">
          <div class="wheel-pointer"></div>
          <canvas id="canvas-am" width="320" height="320"></canvas>
        </div>
        <button class="spin-btn" id="spin-am" onclick="spin('am')">Spin the Wheel!</button>
        <div class="winner-box" id="winner-am"></div>
        <div class="ceremony-roster" id="roster-am"></div>
        <div class="ceremony-reset" onclick="resetCeremony('am')">Reset wheel</div>
      </div>
    </div>
  </div>

  <!-- PM CEREMONY TAB -->
  <div id="tab-ceremony-pm" class="tab-content">
    <div class="ceremony-wrap">
      <div class="ceremony-group" id="pm-ceremony-wrap">
        <div class="ceremony-group-title">🌇 Afternoon Ceremony <span class="ceremony-group-time">2:30 pm · Full Day + Half Day AFTERNOON</span></div>
        <div class="wheel-wrap">
          <div class="wheel-pointer"></div>
          <canvas id="canvas-pm" width="320" height="320"></canvas>
        </div>
        <button class="spin-btn" id="spin-pm" onclick="spin('pm')">Spin the Wheel!</button>
        <div class="winner-box" id="winner-pm"></div>
        <div class="ceremony-roster" id="roster-pm"></div>
        <div class="ceremony-reset" onclick="resetCeremony('pm')">Reset wheel</div>
      </div>
    </div>
  </div>
</div>

<!-- MEDICAL MODAL -->
<div class="modal-overlay" id="medical-modal" onclick="if(event.target===this)closeMedical()">
  <div class="modal-card">
    <h3 id="modal-child-name">Child Info</h3>
    <div id="modal-body"></div>
    <button class="modal-close" onclick="closeMedical()">Close</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var SUPABASE_URL = 'https://snxibhbhhchjthfmjtaj.supabase.co'
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNueGliaGJoaGNoanRoZm1qdGFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTk2ODAsImV4cCI6MjA5MjYzNTY4MH0.K-89Mx4SxU6N1hMmtK6Q79rWAtk6VTN9b5wemQxcZVA'

var BADGES = [
  'Artist Eyes','Ball of Energy','Best Friend Tip','Brave','Caring',
  'Colour Master','Concentration','Curiosity','Drawing Champ','Etiquette',
  'Friendship','Happiness','Helping Hand','Historian','Imagination',
  'Inspiration','Junior Instructor','Leadership','Listening','Make Magic',
  'Patience','Purr-fect','Safety','Squeaky Clean','Storyteller',
  'Superstar','The Thinker','Zen'
]
var WHEEL_FILLS   = ['#EEEDFE','#E1F5EE','#FAECE7','#E6F1FB','#EAF3DE','#FAEEDA','#FBEAF0','#EDF8FF','#FEF3C7','#FCE7F3']
var WHEEL_STROKES = ['#7F77DD','#1D9E75','#D85A30','#378ADD','#639922','#BA7517','#D4537E','#185FA5','#D97706','#DB2777']

var accessToken = null
var currentUserId = null
var currentStudioId = null
var currentDate = new Date()
var curriculumData = []
var allChildren = []
var badgeHistory = {}
var spinAngles = { am: 0, pm: 0 }
var spinning = { am: false, pm: false }
var ceremonyDone = { am: [], pm: [] }
var sortKey = 'name', sortDir = 1
var loginBusy = false

// ── FETCH HELPERS ────────────────────────────────────────────────
function authHeaders() {
  return {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + (accessToken || SUPABASE_KEY),
    'Content-Type': 'application/json'
  }
}

function sbGet(path) {
  return fetch(SUPABASE_URL + '/rest/v1/' + path, {
    method: 'GET',
    headers: authHeaders()
  }).then(function(r) { return r.json() })
}

function sbPost(path, body) {
  return fetch(SUPABASE_URL + '/rest/v1/' + path, {
    method: 'POST',
    headers: Object.assign({}, authHeaders(), { 'Prefer': 'return=representation' }),
    body: JSON.stringify(body)
  }).then(function(r) { return r.json() })
}

function sbPatch(path, body) {
  return fetch(SUPABASE_URL + '/rest/v1/' + path, {
    method: 'PATCH',
    headers: Object.assign({}, authHeaders(), { 'Prefer': 'return=representation' }),
    body: JSON.stringify(body)
  }).then(function(r) { return r.json() })
}

function sbUpsert(table, body, onConflict) {
  var qs = onConflict ? '?on_conflict=' + onConflict : ''
  return fetch(SUPABASE_URL + '/rest/v1/' + table + qs, {
    method: 'POST',
    headers: Object.assign({}, authHeaders(), { 'Prefer': 'resolution=merge-duplicates,return=representation' }),
    body: JSON.stringify(body)
  }).then(function(r) { return r.json() })
}

// ── AUTH ──────────────────────────────────────────────────────────
function doLogin() {
  if (loginBusy) return
  var email = document.getElementById('login-email').value.trim()
  var pass  = document.getElementById('login-password').value
  var errEl = document.getElementById('login-error')
  var btn   = document.querySelector('.login-card button')
  errEl.style.display = 'none'
  if (!email || !pass) {
    errEl.textContent = 'Please enter email and password.'
    errEl.style.display = 'block'
    return
  }
  loginBusy = true
  btn.textContent = 'Signing in…'

  fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, password: pass })
  }).then(function(r) {
    return r.json()
  }).then(function(data) {
    if (data.error || data.error_description || !data.access_token) {
      loginBusy = false
      btn.textContent = 'Sign In'
      errEl.textContent = data.error_description || data.error || 'Login failed. Please try again.'
      errEl.style.display = 'block'
      return
    }
    accessToken = data.access_token
    currentUserId = data.user && data.user.id
    // Save session to localStorage for reload persistence
    try { localStorage.setItem('cc_token', data.access_token); localStorage.setItem('cc_uid', currentUserId) } catch(e) {}
    initApp()
  }).catch(function(e) {
    loginBusy = false
    btn.textContent = 'Sign In'
    errEl.textContent = 'Network error. Please check your connection.'
    errEl.style.display = 'block'
  })
}

function doSignOut() {
  fetch(SUPABASE_URL + '/auth/v1/logout', {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + accessToken }
  })
  accessToken = null; currentUserId = null; currentStudioId = null; allChildren = []
  try { localStorage.removeItem('cc_token'); localStorage.removeItem('cc_uid') } catch(e) {}
  document.getElementById('login-screen').style.display = 'flex'
  document.getElementById('app-screen').style.display = 'none'
}

function tryRestoreSession() {
  try {
    var token = localStorage.getItem('cc_token')
    var uid   = localStorage.getItem('cc_uid')
    if (!token || !uid) return
    // Verify token is still valid
    fetch(SUPABASE_URL + '/auth/v1/user', {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + token }
    }).then(function(r) { return r.json() }).then(function(data) {
      if (data && data.id) {
        accessToken = token
        currentUserId = data.id
        initApp()
      }
    }).catch(function() {})
  } catch(e) {}
}

function initApp() {
  var btn = document.querySelector('.login-card button')
  sbGet('studio_users?select=studio_id&user_id=eq.' + currentUserId + '&limit=1').then(function(rows) {
    if (!rows || !rows.length || rows.error) {
      loginBusy = false
      if (btn) btn.textContent = 'Sign In'
      var errEl = document.getElementById('login-error')
      errEl.textContent = rows && rows.message ? rows.message : 'No studio linked to this account. Contact home office.'
      errEl.style.display = 'block'
      return
    }
    currentStudioId = rows[0].studio_id
    sbGet('studios?select=name,city,province&id=eq.' + currentStudioId + '&limit=1').then(function(studios) {
      var studio = (studios && studios.length) ? studios[0] : {}
      var label = (studio.name || '') + (studio.city ? ' · ' + studio.city : '')
      document.getElementById('studio-label').textContent = label
      document.getElementById('login-screen').style.display = 'none'
      document.getElementById('app-screen').style.display = 'block'
      loginBusy = false
      if (btn) btn.textContent = 'Sign In'
      loadCurriculumData()
      syncDatePicker()
      loadDay()
    }).catch(function(e) {
      loginBusy = false
      if (btn) btn.textContent = 'Sign In'
      document.getElementById('login-error').textContent = 'Could not load studio info. Try again.'
      document.getElementById('login-error').style.display = 'block'
    })
  }).catch(function(e) {
    loginBusy = false
    if (btn) btn.textContent = 'Sign In'
    document.getElementById('login-error').textContent = 'Login error. Please try again.'
    document.getElementById('login-error').style.display = 'block'
  })
}

// Run on page load
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('login-password').addEventListener('keydown', function(e) {
    if (e.keyCode === 13) doLogin()
  })
  document.getElementById('login-email').addEventListener('keydown', function(e) {
    if (e.keyCode === 13) doLogin()
  })
  tryRestoreSession()
})

// ── DATE NAV ─────────────────────────────────────────────────────
function dateStr(d) { return d.toLocaleDateString('en-CA') }
function addDays(d, n) { var r = new Date(d); r.setDate(r.getDate() + n); return r }
function shiftDate(n) { currentDate = addDays(currentDate, n); syncDatePicker(); loadDay() }
function pickDate(v) { currentDate = new Date(v + 'T12:00:00'); syncDatePicker(); loadDay() }
function goToday() { currentDate = new Date(); syncDatePicker(); loadDay() }
function syncDatePicker() { document.getElementById('date-picker').value = dateStr(currentDate) }

// ── SESSION GROUP ─────────────────────────────────────────────────
function sessionGroup(title) {
  var t = (title || '').toLowerCase()
  if (t.indexOf('half day morning') >= 0 || t.indexOf('half-day morning') >= 0) return 'am'
  if (t.indexOf('half day afternoon') >= 0 || t.indexOf('half-day afternoon') >= 0) return 'pm'
  return 'fd'
}

// ── CURRICULUM ────────────────────────────────────────────────────
function loadCurriculumData() {
  sbGet('curriculum_weeks?select=*').then(function(data) {
    curriculumData = (data && !data.error) ? data : []
  }).catch(function() { curriculumData = [] })
}

function getCurriculumLinks(sessionTitle, sessionDate) {
  var titleLower = (sessionTitle || '').toLowerCase()
  for (var i = 0; i < curriculumData.length; i++) {
    var r = curriculumData[i]
    if (r.session_type_key && !r.week_start && titleLower.indexOf(r.session_type_key.toLowerCase()) >= 0) {
      if (r.website_url || r.curriculum_url) return r
    }
  }
  for (var j = 0; j < curriculumData.length; j++) {
    var w = curriculumData[j]
    if (w.week_start && w.week_end && sessionDate >= w.week_start && sessionDate <= w.week_end) return w
  }
  return null
}

// ── LOAD DAY ──────────────────────────────────────────────────────
function loadDay() {
  document.getElementById('checkin-content').innerHTML = '<div class="loading">Loading…</div>'
  allChildren = []
  var today = dateStr(currentDate)

  var sessionsUrl = 'sessions?select=id,title,session_time&studio_id=eq.' + currentStudioId + '&session_date=eq.' + today + '&order=session_time'
  sbGet(sessionsUrl).then(function(sessions) {
    if (!sessions || sessions.code || sessions.error) {
      document.getElementById('checkin-content').innerHTML = '<div class="empty" style="color:#c0392b;font-size:13px">Load error: ' + JSON.stringify(sessions) + '</div>'
      return
    }
    sessions = sessions || []
    var campSessions = sessions.filter(function(s) {
      var t = (s.title || '').toLowerCase()
      return t.indexOf('camp') >= 0 || t.indexOf('pa day') >= 0 || t.indexOf('pd day') >= 0 || t.indexOf('no school') >= 0
    })
    if (!campSessions.length) {
      document.getElementById('checkin-content').innerHTML = '<div class="empty">No camp sessions found for this date.<br><small style="color:#bbb">Looking for: ' + today + ' · Studio: ' + currentStudioId + '</small></div>'
      renderWheels()
      return
    }
    var sessionIds = campSessions.map(function(s) { return s.id })
    var sessionIdFilter = 'session_id=in.(' + sessionIds.join(',') + ')'

    var bookingsPromise = sbGet('bookings?select=id,session_id,customer_name,customer_email,customer_phone,shopify_order_name,qty,raw_payload,event_date,order_note,aftercare,early_arrival,returned_at&' + sessionIdFilter)

    bookingsPromise.then(function(bookings) {
      bookings = bookings || []
      var activeBookings = bookings.filter(function(b) {
        return !(b.returned_at && (b.qty || 0) === 0)
      })
      var orderNames = []
      activeBookings.forEach(function(b) {
        if (b.shopify_order_name && orderNames.indexOf(b.shopify_order_name) < 0) orderNames.push(b.shopify_order_name)
      })

      var tallyPromise = orderNames.length
        ? sbGet('tally_registrations?select=*&shopify_order_name=in.(' + orderNames.map(function(n){ return encodeURIComponent(n) }).join(',') + ')')
        : Promise.resolve([])

      var attPromise = sbGet('attendance?select=session_id,shopify_order_name,camper_name,attended&' + sessionIdFilter)

      var badgePromise = orderNames.length
        ? sbGet('camp_daily_badges?select=order_name,camper_name,badge_name,session_date&order_name=in.(' + orderNames.map(function(n){ return encodeURIComponent(n) }).join(',') + ')')
        : Promise.resolve([])

      Promise.all([tallyPromise, attPromise, badgePromise]).then(function(results) {
        var tallyRows  = (results[0] && !results[0].error) ? results[0] : []
        var attRows    = (results[1] && !results[1].error) ? results[1] : []
        var badgeRows  = (results[2] && !results[2].error) ? results[2] : []

        var tallyMap = {}
        tallyRows.forEach(function(t) {
          if (!tallyMap[t.shopify_order_name]) tallyMap[t.shopify_order_name] = []
          tallyMap[t.shopify_order_name].push(t)
        })

        var attendanceMap = {}
        attRows.forEach(function(a) {
          var k = a.shopify_order_name + '|' + (a.camper_name || '').toLowerCase().trim()
          attendanceMap[k] = a
        })

        badgeHistory = {}
        badgeRows.forEach(function(b) {
          var k = b.order_name + '|' + (b.camper_name || '').toLowerCase().trim()
          if (!badgeHistory[k]) badgeHistory[k] = []
          badgeHistory[k].push({ badge: b.badge_name, date: b.session_date })
        })

        campSessions.forEach(function(session) {
          var group = sessionGroup(session.title)
          var sessionBookings = activeBookings.filter(function(b) { return b.session_id === session.id })
          sessionBookings.forEach(function(b) {
            var props = parseLineItemProps(b.raw_payload, b.event_date)
            var participants = props
              .filter(function(p) { return p.name && p.name.toLowerCase().indexOf('participant') === 0 })
              .sort(function(a, z) { return a.name.localeCompare(z.name) })
              .map(function(p) {
                var name = p.value.split('|')[0].trim() || p.value
                var dobMatch = p.value.match(/DOB:\s*(\d{4}-\d{2}-\d{2})/)
                var dob = dobMatch ? dobMatch[1] : null
                var tRows = tallyMap[b.shopify_order_name] || []
                var tally = null
                for (var ti = 0; ti < tRows.length; ti++) {
                  if ((tRows[ti].camper_name || '').toLowerCase().trim() === name.toLowerCase().trim()) { tally = tRows[ti]; break }
                }
                return { name: name, dob: dob, tally: tally }
              })

            if (!participants.length) {
              var tRows2 = tallyMap[b.shopify_order_name] || []
              var seen2 = []
              tRows2.forEach(function(t) {
                var n = (t.camper_name || '').toLowerCase().trim()
                if (seen2.indexOf(n) < 0) { seen2.push(n); participants.push({ name: t.camper_name, dob: null, tally: t }) }
              })
            }
            if (!participants.length) participants = [{ name: '', dob: null, tally: null }]

            participants.forEach(function(p) {
              var t = p.tally || {}
              var camperName = p.name || ''
              var attKey = b.shopify_order_name + '|' + camperName.toLowerCase().trim()
              var att = attendanceMap[attKey] || null
              var badgeKey = b.shopify_order_name + '|' + camperName.toLowerCase().trim()
              var bHist = badgeHistory[badgeKey] || []
              var todayBadge = null
              for (var bi = 0; bi < bHist.length; bi++) { if (bHist[bi].date === today) { todayBadge = bHist[bi]; break } }
              var uid = (b.shopify_order_name + '-' + camperName).replace(/[^a-zA-Z0-9\-_]/g, '_')
              allChildren.push({
                _uid: uid,
                name: camperName,
                dob: p.dob || null,
                age: t.camper_age || null,
                sessionId: session.id,
                sessionTitle: session.title,
                sessionGroup: group,
                sessionNotes: '',
                orderName: b.shopify_order_name,
                registeredBy: b.customer_name || '',
                phone: t.parent_phone || b.customer_phone || getPayloadPhone(b.raw_payload) || '',
                emergency: (t.emergency_contact_name || '') + (t.emergency_contact_phone ? ' ' + t.emergency_contact_phone : ''),
                walkHome: t.walk_home || false,
                medical: t.medical_notes || '',
                aftercare: t.aftercare || b.aftercare || false,
                earlyArrival: b.early_arrival || false,
                tallyId: t.id || null,
                attendanceChecked: att ? att.attended : false,
                table: '',
                badge: todayBadge ? todayBadge.badge : '',
                awardedBadges: bHist.map(function(bh) { return bh.badge })
              })
            })
          })
        })

        // Deduplicate
        var seen = []
        allChildren = allChildren.filter(function(c) {
          var k = c.orderName + '|' + c.name.toLowerCase().trim()
          if (seen.indexOf(k) >= 0) return false
          seen.push(k); return true
        })

        var dayPlanText = ''
        renderCheckin(dayPlanText, campSessions)
        renderWheels()
      })
    })
  }).catch(function(e) {
    document.getElementById('checkin-content').innerHTML = '<div class="empty" style="color:#c0392b;font-size:13px">Network error: ' + (e.message || e) + '<br>URL: ' + SUPABASE_URL + '<br>Studio: ' + currentStudioId + '</div>'
  })
}

// ── RENDER CHECK-IN ───────────────────────────────────────────────
function getSorted() {
  var searchEl = document.getElementById('search-input')
  var q = searchEl ? searchEl.value.toLowerCase() : ''
  var list = allChildren.filter(function(c) {
    return !q || c.name.toLowerCase().indexOf(q) >= 0 || c.registeredBy.toLowerCase().indexOf(q) >= 0
  })
  list.sort(function(a, b) {
    var av = sortKey === 'name' ? a.name : sortKey === 'parent' ? a.registeredBy : (parseInt(a.table) || 999)
    var bv = sortKey === 'name' ? b.name : sortKey === 'parent' ? b.registeredBy : (parseInt(b.table) || 999)
    if (av < bv) return -1 * sortDir
    if (av > bv) return 1 * sortDir
    return 0
  })
  return list
}

function setSort(key) {
  if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1 }
  renderCheckinList()
}

function renderCheckin(dayPlanText, campSessions) {
  var checkedIn = allChildren.filter(function(c) { return c.attendanceChecked }).length
  var total = allChildren.length
  var aftercareCount = allChildren.filter(function(c) { return c.aftercare }).length
  var badgedCount = allChildren.filter(function(c) { return c.badge }).length
  var today = dateStr(currentDate)

  var html = '<div class="stats-bar">'
  html += '<div class="stat-card"><div class="stat-num">' + total + '</div><div class="stat-label">Registered</div></div>'
  html += '<div class="stat-card"><div class="stat-num" style="color:#3B6D11">' + checkedIn + '</div><div class="stat-label">Checked In</div></div>'
  html += '<div class="stat-card"><div class="stat-num" style="color:#92400E">' + aftercareCount + '</div><div class="stat-label">Aftercare</div></div>'
  html += '<div class="stat-card"><div class="stat-num" style="color:#533AB7">' + badgedCount + '</div><div class="stat-label">Badged</div></div>'
  html += '</div>'

  var links = []
  campSessions.forEach(function(s) {
    var cl = getCurriculumLinks(s.title, today)
    if (cl && cl.curriculum_url) {
      var dup = false; links.forEach(function(l) { if (l.url === cl.curriculum_url) dup = true })
      if (!dup) links.push({ url: cl.curriculum_url, label: 'Curriculum' })
    }
    if (cl && cl.website_url) {
      var dup2 = false; links.forEach(function(l) { if (l.url === cl.website_url) dup2 = true })
      if (!dup2) links.push({ url: cl.website_url, label: 'Website' })
    }
  })
  if (dayPlanText || campSessions.length) {
    var linkHtml = links.map(function(l) {
      return '<a href="' + l.url + '" target="_blank" style="font-size:13px;color:#2e7d32;text-decoration:none;padding:5px 12px;border:0.5px solid #a5d6a7;border-radius:8px;background:#e8f5e9;white-space:nowrap">' + l.label + '</a>'
    }).join(' ')
    html += '<div class="day-plan-banner"><div style="flex:1"><div class="day-plan-label">Today&#39;s Plan</div><div class="day-plan-text">' + (dayPlanText || 'Camp day') + '</div></div>'
    if (linkHtml) html += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">' + linkHtml + '</div>'
    html += '</div>'
  }

  html += '<div class="controls-row">'
  html += '<input class="search-input" id="search-input" type="search" placeholder="Search child or parent…" oninput="renderCheckinList()">'
  html += '<div class="sort-group">'
  html += '<button class="sort-btn' + (sortKey==='name'?' active':'') + '" onclick="setSort(&quot;name&quot;)">Name</button>'
  html += '<button class="sort-btn' + (sortKey==='parent'?' active':'') + '" onclick="setSort(&quot;parent&quot;)">Parent</button>'
  html += '<button class="sort-btn' + (sortKey==='table'?' active':'') + '" onclick="setSort(&quot;table&quot;)">Table</button>'
  html += '</div></div>'
  html += '<div class="roster-list" id="roster-list"></div>'

  document.getElementById('checkin-content').innerHTML = html
  renderCheckinList()
}

function renderCheckinList() {
  var list = getSorted()
  var el = document.getElementById('roster-list')
  if (!el) return
  if (!list.length) { el.innerHTML = '<div class="empty">No children found.</div>'; return }

  var rows = list.map(function(c) {
    var uid = c._uid
    var groupTag = c.sessionGroup === 'am'
      ? '<span class="session-tag am">AM</span>'
      : c.sessionGroup === 'fd' ? '<span class="session-tag fd">Full Day</span>'
      : '<span class="session-tag pm">PM</span>'
    var aftercareTag = c.aftercare ? '<span class="aftercare-tag">Aftercare</span>' : ''
    var walkTag = c.walkHome ? '<span class="walkhome-tag">Walk Home</span>' : ''
    var medIcon = c.medical ? '<span class="medical-icon" onclick="showMedical(&quot;' + uid + '&quot;)">&#x2695;&#xFE0F;</span>' : ''
    var ageDisplay = c.dob ? formatDOB(c.dob, dateStr(currentDate)) : (c.age ? 'Age ' + c.age : '')
    var metaParts = []
    if (ageDisplay) metaParts.push(ageDisplay)
    if (c.registeredBy) metaParts.push(c.registeredBy)

    var badgeOpts = '<option value="">-- No badge yet --</option>'
    BADGES.forEach(function(b) {
      var prev = c.awardedBadges.indexOf(b) >= 0
      var sel = c.badge === b ? ' selected' : ''
      var cls = (prev && c.badge !== b) ? ' class="previously-awarded"' : ''
      var label = (prev && c.badge !== b) ? b + ' (prev)' : b
      badgeOpts += '<option value="' + b + '"' + sel + cls + '>' + label + '</option>'
    })

    return '<div class="roster-card' + (c.attendanceChecked ? ' checked-in' : '') + (c.medical ? ' has-medical' : '') + '" id="card-' + uid + '">' +
      '<div class="roster-card-header">' +
        '<button class="check-btn' + (c.attendanceChecked ? ' checked' : '') + '" onclick="toggleCheck(&quot;' + uid + '&quot;)">' + (c.attendanceChecked ? '&#x2713;' : '') + '</button>' +
        '<div class="child-info">' +
          '<div class="child-name">' + (c.name || '<em style="color:#bbb">No name yet</em>') + '</div>' +
          '<div class="child-meta">' + metaParts.join(' &middot; ') + '</div>' +
        '</div>' +
        '<div class="card-badges">' + groupTag + aftercareTag + walkTag + medIcon + '</div>' +
      '</div>' +
      '<div class="roster-card-body">' +
        '<div class="field-group">' +
          '<div class="field-label">Table #</div>' +
          '<input class="field-input table-input" id="table-' + uid + '" type="number" min="1" max="30" value="' + (c.table || '') + '" placeholder="-" onchange="updateTable(&quot;' + uid + '&quot;,this.value)">' +
        '</div>' +
        '<div class="field-group" style="flex:1;min-width:150px">' +
          '<div class="field-label">Today&#39;s Badge</div>' +
          '<select class="field-input badge-select" id="badge-' + uid + '" onchange="updateBadge(&quot;' + uid + '&quot;,this.value)">' + badgeOpts + '</select>' +
        '</div>' +
        '<div class="field-group" style="align-self:flex-end">' +
          '<button class="save-row-btn" id="savebtn-' + uid + '" onclick="saveRow(&quot;' + uid + '&quot;)">Save</button>' +
        '</div>' +
      '</div>' +
    '</div>'
  })
  el.innerHTML = rows.join('')
}

function updateStatsBar() {
  var checkedIn = allChildren.filter(function(c) { return c.attendanceChecked }).length
  var total = allChildren.length
  var aftercareCount = allChildren.filter(function(c) { return c.aftercare }).length
  var badgedCount = allChildren.filter(function(c) { return c.badge }).length
  var nums = document.querySelectorAll('.stats-bar .stat-num')
  if (nums[0]) nums[0].textContent = total
  if (nums[1]) nums[1].textContent = checkedIn
  if (nums[2]) nums[2].textContent = aftercareCount
  if (nums[3]) nums[3].textContent = badgedCount
}

// ── INTERACTIONS ──────────────────────────────────────────────────
function toggleCheck(uid) {
  var c = null
  allChildren.forEach(function(x) { if (x._uid === uid) c = x })
  if (!c) return
  c.attendanceChecked = !c.attendanceChecked
  var card = document.getElementById('card-' + uid)
  var btn = card ? card.querySelector('.check-btn') : null
  if (card) card.className = 'roster-card' + (c.attendanceChecked ? ' checked-in' : '') + (c.medical ? ' has-medical' : '')
  if (btn) { btn.className = 'check-btn' + (c.attendanceChecked ? ' checked' : ''); btn.innerHTML = c.attendanceChecked ? '&#x2713;' : '' }
  updateStatsBar()
  renderWheels()
  var today = dateStr(currentDate)
  // Check for existing attendance row then upsert
  sbGet('attendance?select=id&session_id=eq.' + c.sessionId + '&shopify_order_name=eq.' + encodeURIComponent(c.orderName) + '&camper_name=eq.' + encodeURIComponent(c.name) + '&limit=1').then(function(rows) {
    if (rows && rows.length && rows[0].id) {
      sbPatch('attendance?id=eq.' + rows[0].id, { attended: c.attendanceChecked, attended_date: today })
    } else {
      sbPost('attendance', { session_id: c.sessionId, shopify_order_name: c.orderName, camper_name: c.name, attended: c.attendanceChecked, attended_date: today })
    }
  })
}

function updateTable(uid, val) {
  allChildren.forEach(function(c) { if (c._uid === uid) c.table = val })
}

function updateBadge(uid, val) {
  allChildren.forEach(function(c) { if (c._uid === uid) c.badge = val })
}

function saveRow(uid) {
  var c = null
  allChildren.forEach(function(x) { if (x._uid === uid) c = x })
  if (!c) return
  var btn = document.getElementById('savebtn-' + uid)
  if (btn) { btn.textContent = 'Saving…'; btn.disabled = true }
  var today = dateStr(currentDate)

  var promises = []

  if (c.badge && c.name) {
    var badgeKey = c.orderName + '|' + c.name.toLowerCase().trim()
    var bHist = badgeHistory[badgeKey] || []
    var todayEntry = null
    bHist.forEach(function(bh) { if (bh.date === today) todayEntry = bh })

    if (todayEntry && todayEntry.badge !== c.badge) {
      promises.push(sbPatch('camp_daily_badges?order_name=eq.' + encodeURIComponent(c.orderName) + '&camper_name=eq.' + encodeURIComponent(c.name) + '&session_date=eq.' + today, { badge_name: c.badge }))
    } else if (!todayEntry) {
      promises.push(sbPost('camp_daily_badges', { session_date: today, studio_id: currentStudioId, camper_name: c.name, order_name: c.orderName, badge_name: c.badge }))
    }

    if (!badgeHistory[badgeKey]) badgeHistory[badgeKey] = []
    var idx = -1
    badgeHistory[badgeKey].forEach(function(bh, i) { if (bh.date === today) idx = i })
    if (idx >= 0) badgeHistory[badgeKey][idx].badge = c.badge
    else badgeHistory[badgeKey].push({ badge: c.badge, date: today })
    if (c.awardedBadges.indexOf(c.badge) < 0) c.awardedBadges.push(c.badge)
  }

  if (c.name) {
    var payload = { shopify_order_name: c.orderName, camper_name: c.name, walk_home: c.walkHome, medical_notes: c.medical || null, aftercare: c.aftercare, parent_phone: c.phone || null }
    if (c.tallyId) {
      promises.push(sbPatch('tally_registrations?id=eq.' + c.tallyId, payload))
    } else {
      promises.push(sbPost('tally_registrations', payload).then(function(rows) {
        if (rows && rows.length && rows[0].id) c.tallyId = rows[0].id
      }))
    }
  }

  Promise.all(promises).then(function() {
    showToast('Saved!')
    if (btn) {
      btn.textContent = 'Saved!'
      setTimeout(function() { btn.textContent = 'Save'; btn.disabled = false }, 2000)
    }
    updateStatsBar()
    renderWheels()
  }).catch(function() {
    showToast('Error saving')
    if (btn) { btn.textContent = 'Save'; btn.disabled = false }
  })
}

// ── MEDICAL MODAL ─────────────────────────────────────────────────
function showMedical(uid) {
  var c = null
  allChildren.forEach(function(x) { if (x._uid === uid) c = x })
  if (!c) return
  document.getElementById('modal-child-name').textContent = c.name || 'Child'
  var ageDisplay = c.dob ? formatDOB(c.dob, dateStr(currentDate)) : (c.age ? 'Age ' + c.age : '')
  var body = ''
  if (c.medical) body += '<div class="modal-row"><div class="modal-label">Medical / Allergies</div><div class="modal-value" style="color:#c0392b;font-weight:500">' + c.medical + '</div></div>'
  if (ageDisplay) body += '<div class="modal-row"><div class="modal-label">Age / DOB</div><div class="modal-value">' + ageDisplay + '</div></div>'
  if (c.phone) body += '<div class="modal-row"><div class="modal-label">Parent Phone</div><div class="modal-value">' + c.phone + '</div></div>'
  if (c.emergency) body += '<div class="modal-row"><div class="modal-label">Emergency Contact</div><div class="modal-value">' + c.emergency + '</div></div>'
  if (c.walkHome) body += '<div class="modal-row"><div class="modal-value" style="color:#991B1B;font-weight:500">Authorized to walk home</div></div>'
  if (c.aftercare) body += '<div class="modal-row"><div class="modal-value" style="color:#92400E;font-weight:500">Registered for aftercare</div></div>'
  if (c.earlyArrival) body += '<div class="modal-row"><div class="modal-value" style="color:#1D4ED8;font-weight:500">Early arrival</div></div>'
  if (c.registeredBy) body += '<div class="modal-row"><div class="modal-label">Registered By</div><div class="modal-value">' + c.registeredBy + '</div></div>'
  if (c.orderName) body += '<div class="modal-row"><div class="modal-label">Order</div><div class="modal-value">' + c.orderName + '</div></div>'
  document.getElementById('modal-body').innerHTML = body
  document.getElementById('medical-modal').className = 'modal-overlay open'
}
function closeMedical() { document.getElementById('medical-modal').className = 'modal-overlay' }

// ── TAB SWITCHING ─────────────────────────────────────────────────
function switchTab(tab, btn) {
  var contents = document.querySelectorAll('.tab-content')
  for (var i = 0; i < contents.length; i++) contents[i].classList.remove('active')
  var btns = document.querySelectorAll('.tab-btn')
  for (var j = 0; j < btns.length; j++) btns[j].classList.remove('active')
  document.getElementById('tab-' + tab).classList.add('active')
  if (btn) btn.classList.add('active')
  if (tab === 'ceremony-am') drawWheel('am')
  if (tab === 'ceremony-pm') drawWheel('pm')
}

// ── WHEEL ─────────────────────────────────────────────────────────
function wheelKids(group) {
  return allChildren.filter(function(c) {
    if (!c.attendanceChecked || !c.name) return false
    if (group === 'am') return c.sessionGroup === 'am'
    return c.sessionGroup === 'fd' || c.sessionGroup === 'pm'
  })
}

function drawWheel(group, highlightIdx, angle) {
  if (highlightIdx === undefined) highlightIdx = -1
  if (angle === undefined) angle = spinAngles[group] || 0
  var canvas = document.getElementById('canvas-' + group)
  if (!canvas) return
  var ctx = canvas.getContext('2d')
  var kids = wheelKids(group)
  var done = ceremonyDone[group]
  ctx.clearRect(0, 0, 320, 320)
  var cx = 160, cy = 160, r = 150

  if (!kids.length) {
    ctx.fillStyle = '#bbb'
    ctx.font = '13px -apple-system, sans-serif'
    ctx.textAlign = 'center'
    ctx.fillText('Check in kids to', cx, cy - 8)
    ctx.fillText('populate the wheel', cx, cy + 12)
    return
  }

  var n = kids.length
  var arc = (2 * Math.PI) / n
  for (var i = 0; i < kids.length; i++) {
    var k = kids[i]
    var isGreyed = done.indexOf(k._uid) >= 0
    var start = angle + i * arc - Math.PI / 2
    var end = start + arc
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, start, end); ctx.closePath()
    ctx.fillStyle = isGreyed ? '#e8e8e2' : (highlightIdx === i ? WHEEL_STROKES[i % WHEEL_STROKES.length] : WHEEL_FILLS[i % WHEEL_FILLS.length])
    ctx.fill()
    ctx.strokeStyle = isGreyed ? '#ccc' : WHEEL_STROKES[i % WHEEL_STROKES.length]
    ctx.lineWidth = 1.5; ctx.stroke()
    ctx.save()
    ctx.translate(cx, cy)
    ctx.rotate(start + arc / 2)
    ctx.textAlign = 'right'
    var firstName = (k.name || '?').split(' ')[0]
    ctx.fillStyle = isGreyed ? '#aaa' : (highlightIdx === i ? 'white' : '#2C2C2A')
    ctx.font = (highlightIdx === i ? '600 ' : '') + '13px -apple-system, sans-serif'
    ctx.fillText(firstName, r - 10, 5)
    ctx.restore()
  }
  ctx.beginPath(); ctx.arc(cx, cy, 16, 0, 2 * Math.PI)
  ctx.fillStyle = 'white'; ctx.fill()
  ctx.strokeStyle = '#e0e0d8'; ctx.lineWidth = 1; ctx.stroke()
}

function renderWheels() {
  drawWheel('am', -1, spinAngles.am)
  drawWheel('pm', -1, spinAngles.pm)
  renderCeremonyRosters()
}

function renderCeremonyRosters() {
  var groups = ['am', 'pm']
  for (var g = 0; g < groups.length; g++) {
    var group = groups[g]
    var el = document.getElementById('roster-' + group)
    if (!el) continue
    var kids = wheelKids(group)
    var done = ceremonyDone[group]
    if (!kids.length) { el.innerHTML = '<div class="empty" style="font-size:13px">No checked-in kids yet.</div>'; continue }
    var rows = []
    for (var i = 0; i < kids.length; i++) {
      var k = kids[i]
      var isDone = done.indexOf(k._uid) >= 0
      var todayBadge = k.badge ? '<span style="font-size:11px;color:#533AB7">' + k.badge + '</span>' : ''
      rows.push('<div class="ceremony-kid' + (isDone ? ' done' : '') + '">' +
        '<span style="font-size:18px">' + (isDone ? '&#x2705;' : '&#x2B55;') + '</span>' +
        '<div class="ceremony-kid-name">' + k.name + '</div>' +
        (isDone ? todayBadge : '<span class="ceremony-kid-badge">Waiting...</span>') +
        (isDone ? '<span class="ceremony-reset" style="font-size:11px;margin-top:0" onclick="undoCeremony(&quot;' + group + '&quot;,&quot;' + k._uid + '&quot;)">undo</span>' : '') +
        '</div>')
    }
    el.innerHTML = rows.join('')
  }
}

function spin(group) {
  var kids = wheelKids(group)
  var remaining = kids.filter(function(k) { return ceremonyDone[group].indexOf(k._uid) < 0 })
  if (!kids.length || spinning[group]) return
  if (!remaining.length) {
    document.getElementById('winner-' + group).innerHTML = '<div style="font-size:14px;color:#888">Everyone has been celebrated!</div>'
    return
  }
  spinning[group] = true
  document.getElementById('spin-' + group).disabled = true

  var totalSpin = 6 * 2 * Math.PI + Math.random() * 2 * Math.PI
  var duration = 3500
  var start = performance.now()
  var startAngle = spinAngles[group]

  function animate(now) {
    var t = Math.min((now - start) / duration, 1)
    var ease = 1 - Math.pow(1 - t, 4)
    spinAngles[group] = startAngle + totalSpin * ease
    var n = kids.length
    var arc = (2 * Math.PI) / n
    var normalized = ((-spinAngles[group] % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI)
    var idx = Math.floor(normalized / arc)
    drawWheel(group, idx, spinAngles[group])
    if (t < 1) {
      requestAnimationFrame(animate)
    } else {
      spinning[group] = false
      document.getElementById('spin-' + group).disabled = false
      var winner = kids[idx]
      if (winner) {
        if (ceremonyDone[group].indexOf(winner._uid) < 0) ceremonyDone[group].push(winner._uid)
        var badgeDisplay = winner.badge ? '<div class="winner-badge-name">' + winner.badge + '</div>' : '<div class="winner-badge-name">Amazing work today!</div>'
        document.getElementById('winner-' + group).innerHTML = '<div class="winner-name">' + winner.name + '</div>' + badgeDisplay
      }
      renderCeremonyRosters()
      drawWheel(group, -1, spinAngles[group])
    }
  }
  requestAnimationFrame(animate)
}

function undoCeremony(group, uid) {
  ceremonyDone[group] = ceremonyDone[group].filter(function(x) { return x !== uid })
  renderCeremonyRosters()
  drawWheel(group, -1, spinAngles[group])
}

function resetCeremony(group) {
  if (!confirm('Reset this wheel?')) return
  ceremonyDone[group] = []
  spinAngles[group] = 0
  document.getElementById('winner-' + group).innerHTML = ''
  renderCeremonyRosters()
  drawWheel(group, -1, 0)
}

// ── HELPERS ───────────────────────────────────────────────────────
function parseLineItemProps(rawPayload, sessionDate) {
  try {
    var payload = typeof rawPayload === 'string' ? JSON.parse(rawPayload) : rawPayload
    if (!payload || !payload.line_items) return []
    var items = payload.line_items
    var match = null
    if (sessionDate) {
      var d = new Date(sessionDate + 'T12:00:00')
      var monthDay = d.toLocaleDateString('en-CA', { month: 'short', day: 'numeric' }).replace('.', '').toLowerCase()
      var day = d.getDate()
      var suffix = (day===1||day===21||day===31)?'st':(day===2||day===22)?'nd':(day===3||day===23)?'rd':'th'
      for (var i = 0; i < items.length; i++) {
        var t = (items[i].title || items[i].name || '').toLowerCase()
        if (t.indexOf(monthDay) >= 0 || t.indexOf(monthDay + suffix) >= 0) { match = items[i]; break }
      }
    }
    if (!match) match = items[0]
    return (match && match.properties) ? match.properties : []
  } catch(e) { return [] }
}

function formatDOB(dobStr, refDateStr) {
  try {
    var dob = new Date(dobStr + 'T12:00:00')
    var ref = refDateStr ? new Date(refDateStr + 'T12:00:00') : new Date()
    var age = ref.getFullYear() - dob.getFullYear()
    var m = ref.getMonth() - dob.getMonth()
    if (m < 0 || (m === 0 && ref.getDate() < dob.getDate())) age--
    var formatted = dob.toLocaleDateString('en-CA', { year: 'numeric', month: 'short', day: 'numeric' })
    return 'Age ' + age + ' - b. ' + formatted
  } catch(e) { return dobStr }
}

function getPayloadPhone(rawPayload) {
  try {
    var p = typeof rawPayload === 'string' ? JSON.parse(rawPayload) : rawPayload
    if (!p) return ''
    return (p.billing_address && p.billing_address.phone) || (p.shipping_address && p.shipping_address.phone) || (p.customer && p.customer.phone) || p.phone || ''
  } catch(e) { return '' }
}

function showToast(msg) {
  var t = document.getElementById('toast')
  t.textContent = msg; t.className = 'toast show'
  setTimeout(function() { t.className = 'toast' }, 2000)
}
