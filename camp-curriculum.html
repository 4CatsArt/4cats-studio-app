<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Camp Curriculum</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, sans-serif;
    background: #fdf8ee;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .screen { display: none; min-height: 100vh; }
  .screen.active { display: block; }

  /* ── HEADER ── */
  .header {
    background: #f5c800;
    color: #3a2e00;
    padding: 18px 20px 16px;
    display: -webkit-flex;
    display: flex;
    -webkit-align-items: center;
    align-items: center;
    gap: 14px;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  }
  .header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; color: #3a2e00; }
  .back-btn {
    background: rgba(0,0,0,0.1);
    border: none;
    color: #3a2e00;
    font-size: 20px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    cursor: pointer;
    display: -webkit-flex;
    display: flex;
    -webkit-align-items: center;
    align-items: center;
    -webkit-justify-content: center;
    justify-content: center;
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
  }
  .back-btn:active { background: rgba(0,0,0,0.2); }

  /* ── DAY GRID ── */
  .day-grid-wrap { padding: 20px 16px 32px; }
  .day-grid-title {
    font-size: 13px;
    font-weight: 600;
    color: #aaa;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .day-grid {
    display: -webkit-flex;
    display: flex;
    -webkit-flex-wrap: wrap;
    flex-wrap: wrap;
    gap: 12px;
  }
  .day-card {
    background: white;
    border-radius: 16px;
    width: calc(25% - 9px);
    padding-top: 22px;
    padding-bottom: 22px;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
    -webkit-align-items: center;
    align-items: center;
    -webkit-justify-content: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    border: 2px solid transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  .day-card:active { border-color: #f5c800; transform: scale(0.95); }
  .day-card .day-num {
    font-size: 30px;
    font-weight: 800;
    color: #f5c800;
    line-height: 1;
  }
  .day-card .day-label {
    font-size: 11px;
    font-weight: 600;
    color: #bbb;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 4px;
  }

  /* ── PROJECT BOXES ── */
  .project-wrap { padding: 20px 16px 32px; }
  .project-grid {
    display: -webkit-flex;
    display: flex;
    -webkit-flex-wrap: wrap;
    flex-wrap: wrap;
    gap: 16px;
  }
  .project-col {
    width: calc(50% - 8px);
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
    -webkit-align-items: center;
    align-items: center;
    gap: 8px;
  }
  .mystery-box {
    width: 100%;
    padding-bottom: 100%;
    position: relative;
    background: white;
    border-radius: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.09);
    cursor: pointer;
    overflow: hidden;
    border: 3px solid #ede8dc;
    -webkit-user-select: none;
    user-select: none;
  }
  .mystery-box.revealed { border-color: #f5c800; }
  .mystery-box:active { transform: scale(0.95); }
  .mystery-box-inner {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: -webkit-flex;
    display: flex;
    -webkit-align-items: center;
    align-items: center;
    -webkit-justify-content: center;
    justify-content: center;
    -webkit-flex-direction: column;
    flex-direction: column;
    gap: 6px;
    background: white;
  }
  .mystery-qmark {
    font-size: 58px;
    line-height: 1;
    color: #f5c800;
  }
  .mystery-hint {
    font-size: 11px;
    font-weight: 600;
    color: #ccc;
    letter-spacing: 0.3px;
  }
  .mystery-box img {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 17px;
  }
  .project-label {
    font-size: 14px;
    font-weight: 700;
    color: #555;
    text-align: center;
  }

  /* ── LIGHTBOX ── */
  #lightbox {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.93);
    z-index: 100;
    -webkit-flex-direction: column;
    flex-direction: column;
    -webkit-align-items: center;
    align-items: center;
    -webkit-justify-content: center;
    justify-content: center;
  }
  #lightbox.open { display: -webkit-flex; display: flex; }

  .lb-close {
    position: absolute;
    top: 16px; right: 16px;
    background: rgba(255,255,255,0.15);
    border: none;
    color: white;
    font-size: 22px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    cursor: pointer;
    display: -webkit-flex;
    display: flex;
    -webkit-align-items: center;
    align-items: center;
    -webkit-justify-content: center;
    justify-content: center;
    z-index: 10;
  }
  .lb-close:active { background: rgba(255,255,255,0.3); }

  .lb-track-wrap { width: 100%; overflow: hidden; position: relative; }
  .lb-track {
    display: -webkit-flex;
    display: flex;
    transition: transform 0.3s ease;
  }
  .lb-slide {
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
    width: 100vw;
    display: -webkit-flex;
    display: flex;
    -webkit-align-items: center;
    align-items: center;
    -webkit-justify-content: center;
    justify-content: center;
    padding: 60px 16px 80px;
  }
  .lb-slide img {
    max-width: 100%;
    max-height: 70vh;
    border-radius: 12px;
    object-fit: contain;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  .lb-caption {
    position: absolute;
    bottom: 24px;
    left: 0; right: 0;
    text-align: center;
    color: white;
  }
  .lb-caption-title { font-size: 16px; font-weight: 700; }
  .lb-dots {
    display: -webkit-flex;
    display: flex;
    gap: 7px;
    -webkit-justify-content: center;
    justify-content: center;
    margin-top: 8px;
  }
  .lb-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    cursor: pointer;
  }
  .lb-dot.active { background: #f5c800; }

  .lb-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.12);
    border: none;
    color: white;
    font-size: 26px;
    width: 44px;
    height: 64px;
    border-radius: 8px;
    cursor: pointer;
    display: -webkit-flex;
    display: flex;
    -webkit-align-items: center;
    align-items: center;
    -webkit-justify-content: center;
    justify-content: center;
  }
  .lb-arrow:active { background: rgba(255,255,255,0.25); }
  .lb-arrow.left { left: 8px; }
  .lb-arrow.right { right: 8px; }
  .lb-arrow.hidden { display: none; }

  /* ── LOGIN GATE ── */
  #login-screen {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #fdf8ee;
    z-index: 200;
    display: -webkit-flex;
    display: flex;
    -webkit-align-items: center;
    align-items: center;
    -webkit-justify-content: center;
    justify-content: center;
  }
  #login-screen.hidden { display: none; }
  .login-card {
    background: white;
    border-radius: 20px;
    padding: 36px 28px 32px;
    width: 88%;
    max-width: 360px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.1);
    text-align: center;
  }
  .login-logo {
    font-size: 44px;
    margin-bottom: 8px;
  }
  .login-title {
    font-size: 20px;
    font-weight: 800;
    color: #3a2e00;
    margin-bottom: 4px;
  }
  .login-subtitle {
    font-size: 13px;
    color: #aaa;
    margin-bottom: 28px;
  }
  .login-field {
    width: 100%;
    padding: 13px 14px;
    border: 2px solid #ede8dc;
    border-radius: 10px;
    font-size: 16px;
    color: #333;
    background: white;
    margin-bottom: 12px;
    outline: none;
    -webkit-appearance: none;
  }
  .login-field:focus { border-color: #f5c800; }
  .login-btn {
    width: 100%;
    padding: 14px;
    background: #f5c800;
    color: #3a2e00;
    font-size: 16px;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 4px;
  }
  .login-btn:active { background: #e0b800; }
  .login-error {
    color: #c0392b;
    font-size: 13px;
    margin-top: 12px;
    min-height: 18px;
  }
</style>
</head>
<body>

<!-- ═══════════════════════════════════════
     LOGIN GATE
════════════════════════════════════════ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🎨</div>
    <div class="login-title">Camp Curriculum</div>
    <div class="login-subtitle">Sign in with your studio email</div>
    <input class="login-field" id="login-email" type="email" placeholder="Email" autocomplete="email" readonly onfocus="this.removeAttribute('readonly')">
    <input class="login-field" id="login-password" type="password" placeholder="Password" autocomplete="current-password" readonly onfocus="this.removeAttribute('readonly')">
    <button class="login-btn" onclick="doLogin()">Sign In</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div id="screen-days" class="screen">
  <div class="header">
    <h1>🎨 Camp Curriculum</h1>
  </div>
  <div class="day-grid-wrap">
    <div class="day-grid-title">Choose a Day</div>
    <div class="day-grid" id="day-grid"></div>
  </div>
</div>

<div id="screen-projects" class="screen">
  <div class="header">
    <button class="back-btn" onclick="showDays()">&#8592;</button>
    <h1 id="day-heading">Day 1</h1>
  </div>
  <div class="project-wrap">
    <div class="project-grid" id="project-grid"></div>
  </div>
</div>

<div id="lightbox">
  <button class="lb-close" onclick="closeLightbox()">&#10005;</button>
  <button class="lb-arrow left hidden" id="lb-prev" onclick="lbPrev()">&#8249;</button>
  <div class="lb-track-wrap">
    <div class="lb-track" id="lb-track"></div>
  </div>
  <button class="lb-arrow right hidden" id="lb-next" onclick="lbNext()">&#8250;</button>
  <div class="lb-caption">
    <div class="lb-caption-title" id="lb-title"></div>
    <div class="lb-dots" id="lb-dots"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════════════
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNueGliaGJoaGNoanRoZm1qdGFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTk2ODAsImV4cCI6MjA5MjYzNTY4MH0.K-89Mx4SxU6N1hMmtK6Q79rWAtk6VTN9b5wemQxcZVA';
var SESSION_KEY = '4cats_camp_session';

function unlockApp() {
  document.getElementById('login-screen').className = 'hidden';
  document.getElementById('screen-days').className = 'screen active';
}

function refreshSession(refreshToken) {
  var xhr = new XMLHttpRequest();
  xhr.open('POST', SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.setRequestHeader('apikey', SUPABASE_ANON_KEY);
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    if (xhr.status === 200) {
      try {
        var data = JSON.parse(xhr.responseText);
        localStorage.setItem(SESSION_KEY, JSON.stringify({
          access_token: data.access_token,
          refresh_token: data.refresh_token,
          expires_at: Math.floor(Date.now() / 1000) + data.expires_in
        }));
        unlockApp();
      } catch(e) {
        localStorage.removeItem(SESSION_KEY);
      }
    } else {
      localStorage.removeItem(SESSION_KEY);
    }
  };
  xhr.send(JSON.stringify({ refresh_token: refreshToken }));
}

// On load: check for saved session
(function checkSavedSession() {
  try {
    var saved = localStorage.getItem(SESSION_KEY);
    if (!saved) return;
    var session = JSON.parse(saved);
    var now = Math.floor(Date.now() / 1000);
    if (session.expires_at && session.expires_at > now + 60) {
      // Token still valid
      unlockApp();
    } else if (session.refresh_token) {
      // Token expired — try to refresh silently
      refreshSession(session.refresh_token);
    }
  } catch(e) {
    localStorage.removeItem(SESSION_KEY);
  }
}());

function doLogin() {
  var email = document.getElementById('login-email').value.trim();
  var password = document.getElementById('login-password').value;
  var errEl = document.getElementById('login-error');
  var btn = document.querySelector('.login-btn');

  if (!email || !password) {
    errEl.textContent = 'Please enter your email and password.';
    return;
  }

  btn.textContent = 'Signing in…';
  btn.disabled = true;
  errEl.textContent = '';

  var xhr = new XMLHttpRequest();
  xhr.open('POST', SUPABASE_URL + '/auth/v1/token?grant_type=password', true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.setRequestHeader('apikey', SUPABASE_ANON_KEY);
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    btn.textContent = 'Sign In';
    btn.disabled = false;
    if (xhr.status === 200) {
      try {
        var data = JSON.parse(xhr.responseText);
        localStorage.setItem(SESSION_KEY, JSON.stringify({
          access_token: data.access_token,
          refresh_token: data.refresh_token,
          expires_at: Math.floor(Date.now() / 1000) + data.expires_in
        }));
      } catch(e) {}
      unlockApp();
    } else {
      var msg = 'Incorrect email or password.';
      try {
        var res = JSON.parse(xhr.responseText);
        if (res.error_description) { msg = res.error_description; }
      } catch(e) {}
      errEl.textContent = msg;
    }
  };
  xhr.send(JSON.stringify({ email: email, password: password }));
}

// Allow Enter key to submit
document.addEventListener('keydown', function(e) {
  var ls = document.getElementById('login-screen');
  if (ls.className === 'hidden') return;
  if (e.keyCode === 13) { doLogin(); }
});


// Photos must be named: day1-p1.jpg, day1-p2.jpg ... day20-p4.jpg
// Upload to Supabase bucket: camp-curriculum (set to public)
// ═══════════════════════════════════════════════════════
var SUPABASE_URL = 'https://snxibhbhhchjthfmjtaj.supabase.co';
var BUCKET = 'qr-codes/camp-curriculum';
var TOTAL_DAYS = 20;
var PROJECTS_PER_DAY = 4;

function imgUrl(day, proj) {
  return SUPABASE_URL + '/storage/v1/object/public/' + BUCKET + '/day' + day + '-p' + proj + '.jpg';
}

// placeholder used until real photos are uploaded
function placeholder(day, proj) {
  return 'https://placehold.co/600x600/f5c800/3a2e00?text=' + encodeURIComponent('Day ' + day + ' · Project ' + proj);
}

// ─── State ───────────────────────────────
var lbPhotos = [];
var lbIndex = 0;
var lbDayIndex = 0;
var lbProjIndex = 0;
var touchStartX = 0;
var touchStartY = 0;

// ─── Build day grid ──────────────────────
(function buildDayGrid() {
  var grid = document.getElementById('day-grid');
  var html = '';
  for (var d = 1; d <= TOTAL_DAYS; d++) {
    html += '<div class="day-card" onclick="showDay(' + d + ')">' +
              '<span class="day-num">' + d + '</span>' +
              '<span class="day-label">Day</span>' +
            '</div>';
  }
  grid.innerHTML = html;
}());

// ─── Show day ────────────────────────────
function showDay(day) {
  document.getElementById('day-heading').textContent = 'Day ' + day;
  var grid = document.getElementById('project-grid');
  var html = '';
  for (var p = 1; p <= PROJECTS_PER_DAY; p++) {
    html += '<div class="project-col">' +
              '<div class="mystery-box" id="box-' + day + '-' + p + '" onclick="openLightbox(' + day + ',' + p + ')">' +
                '<div class="mystery-box-inner" id="inner-' + day + '-' + p + '">' +
                  '<span class="mystery-qmark">?</span>' +
                  '<span class="mystery-hint">Tap to reveal</span>' +
                '</div>' +
              '</div>' +
              '<div class="project-label">Project ' + p + '</div>' +
            '</div>';
  }
  grid.innerHTML = html;
  document.getElementById('screen-days').className = 'screen';
  document.getElementById('screen-projects').className = 'screen active';
  window.scrollTo(0, 0);
}

function showDays() {
  document.getElementById('screen-projects').className = 'screen';
  document.getElementById('screen-days').className = 'screen active';
  window.scrollTo(0, 0);
}

// ─── Lightbox ────────────────────────────
function openLightbox(day, proj) {
  lbDayIndex = day;
  lbProjIndex = proj;

  // For now: one photo per project. Add more URLs to this array per project if needed.
  lbPhotos = [ imgUrl(day, proj) ];
  lbIndex = 0;

  // Reveal the box
  var box = document.getElementById('box-' + day + '-' + proj);
  var inner = document.getElementById('inner-' + day + '-' + proj);
  if (box && inner) {
    box.className = 'mystery-box revealed';
    inner.style.display = 'none';
    var img = document.createElement('img');
    img.src = lbPhotos[0];
    box.appendChild(img);
  }

  // Build slides
  var track = document.getElementById('lb-track');
  var dots = document.getElementById('lb-dots');
  var slidesHtml = '';
  var dotsHtml = '';
  for (var i = 0; i < lbPhotos.length; i++) {
    slidesHtml += '<div class="lb-slide"><img src="' + lbPhotos[i] + '" alt="Project photo"></div>';
    dotsHtml += '<div class="lb-dot" onclick="lbGoTo(' + i + ')"></div>';
  }
  track.innerHTML = slidesHtml;
  dots.innerHTML = dotsHtml;
  dots.style.display = lbPhotos.length > 1 ? '-webkit-flex' : 'none';
  dots.style.display = lbPhotos.length > 1 ? 'flex' : 'none';

  document.getElementById('lb-title').textContent = 'Day ' + day + ' · Project ' + proj;
  document.getElementById('lightbox').className = 'open';
  updateLbState();
}

function updateLbState() {
  var track = document.getElementById('lb-track');
  track.style.transform = 'translateX(-' + (lbIndex * 100) + 'vw)';
  var dots = document.getElementById('lb-dots').children;
  for (var i = 0; i < dots.length; i++) {
    dots[i].className = (i === lbIndex) ? 'lb-dot active' : 'lb-dot';
  }
  var prev = document.getElementById('lb-prev');
  var next = document.getElementById('lb-next');
  prev.className = 'lb-arrow left' + (lbIndex === 0 ? ' hidden' : '');
  next.className = 'lb-arrow right' + (lbIndex === lbPhotos.length - 1 ? ' hidden' : '');
}

function lbGoTo(i) { lbIndex = i; updateLbState(); }
function lbPrev() { if (lbIndex > 0) { lbIndex--; updateLbState(); } }
function lbNext() { if (lbIndex < lbPhotos.length - 1) { lbIndex++; updateLbState(); } }
function closeLightbox() {
  document.getElementById('lightbox').className = '';
  // Reset the box back to mystery state
  var box = document.getElementById('box-' + lbDayIndex + '-' + lbProjIndex);
  var inner = document.getElementById('inner-' + lbDayIndex + '-' + lbProjIndex);
  if (box && inner) {
    box.className = 'mystery-box';
    inner.style.display = '-webkit-flex';
    inner.style.display = 'flex';
    var img = box.querySelector('img');
    if (img) { box.removeChild(img); }
  }
}

// ─── Swipe support ───────────────────────
var lb = document.getElementById('lightbox');
lb.addEventListener('touchstart', function(e) {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, false);
lb.addEventListener('touchend', function(e) {
  var dx = e.changedTouches[0].clientX - touchStartX;
  var dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
    if (dx < 0) { lbNext(); } else { lbPrev(); }
  }
}, false);

// ─── Keyboard (desktop preview) ──────────
document.addEventListener('keydown', function(e) {
  if (document.getElementById('lightbox').className !== 'open') return;
  if (e.keyCode === 27) { closeLightbox(); }
  if (e.keyCode === 37) { lbPrev(); }
  if (e.keyCode === 39) { lbNext(); }
});
</script>
</body>
</html>
