<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camps manager · 4Cats</title>
<link rel="icon" href="https://cdn.shopify.com/s/files/1/1451/3756/files/soup_can_logo_500x814_83667c43-de3b-4690-891e-dfd527e947ca.png?v=1767622073">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&family=Work+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"></script>
<style>
:root {
  --pine: #123d2c; --pine-2: #1d5640; --berry: #c8232c; --berry-dark: #a31b23;
  --snow: #fbf6ec; --paper: #fff; --ink: #1f2a24; --soft: #5b6660; --line: #e8dfcd; --gold: #e8a93a;
  --live: #15803d; --live-bg: #e3f6ea; --soon: #9a5b00; --soon-bg: #fdf0d6; --off-bg: #efede6;
  --display: "DM Sans", system-ui, sans-serif; --body: "Work Sans", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--body); color: var(--ink); background: var(--snow); font-size: 15px; line-height: 1.45; }
button, input, select, textarea { font: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.top { background: var(--pine); color: #f3efe4; padding: 14px 24px; display: flex; align-items: center; gap: 14px; }
.top img { width: 26px; height: auto; }
.top h1 { font-family: var(--display); font-size: 22px; margin: 0; flex: 1; }
.top a { color: var(--gold); font-weight: 700; }
.top .who { font-size: 13px; opacity: .8; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 20px 24px 60px; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; margin-bottom: 20px; }
.panel h2 { font-family: var(--display); font-size: 22px; margin: 0 0 4px; }
.sub { color: var(--soft); margin: 0 0 12px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
.grow { flex: 1; min-width: 200px; }
.btn { border: 1px solid transparent; border-radius: 999px; padding: 0 18px; min-height: 40px; font-weight: 800; cursor: pointer; }
.btn-berry { background: var(--berry); color: #fff; } .btn-berry:hover { background: var(--berry-dark); }
.btn-plain { background: #fff; border-color: var(--line); color: var(--ink); }
.btn-danger { background: none; color: var(--berry); padding: 0 8px; }
.btn:disabled { opacity: .5; cursor: default; }
.link { background: none; border: 0; color: var(--berry); font-weight: 800; cursor: pointer; padding: 0 4px; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.field label { font-weight: 700; font-size: 14px; }
.field input, .field select, .field textarea { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: #fff; }
.help { font-size: 13px; color: var(--soft); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 14px; }
@media (max-width: 760px) { .two, .three { grid-template-columns: 1fr; } }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--soft); padding: 6px 8px; border-bottom: 1px solid var(--line); }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.pill { display: inline-block; font-size: 12px; font-weight: 800; border-radius: 999px; padding: 2px 9px; background: var(--off-bg); }
.pill.ok { background: var(--live-bg); color: var(--live); } .pill.shop { background: #eef0ff; color: #3b3fb6; }
.shop-row td { color: var(--soft); }
.day-head td { background: var(--snow); border-top: 2px solid var(--line); }
.day-sp { margin-left: 10px; font-size: 14px; color: var(--soft); }
.day-sp .spaces-in { width: 64px; }
.shop-adj td { background: #f7f8ff; }
.shop-adj-box { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 4px 0; }
.shop-adj-box .spaces-in { width: 80px; margin-left: 6px; } .pill.full { background: #fde2e2; color: #b91c1c; } .pill.closed { background: var(--off-bg); color: var(--soft); }
.msg { border-radius: 12px; padding: 10px 14px; margin: 0 0 14px; } .msg.ok { background: var(--live-bg); color: var(--live); } .msg.err { background: #fde2e2; color: #b91c1c; }
.check { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; cursor: pointer; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips label { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; background: #fff; font-weight: 600; font-size: 14px; }
.chips input { margin-right: 6px; }
.studio-groups { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 760px) { .studio-groups { grid-template-columns: 1fr; } }
.studio-groups fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; margin: 0; }
.studio-groups legend { font-weight: 800; font-size: 14px; padding: 0 4px; }
.studio-groups label { display: block; font-size: 14px; padding: 2px 0; }
.preview { background: var(--snow); border-radius: 12px; padding: 10px 14px; margin: 8px 0 12px; font-weight: 700; }
.spaces-in { width: 70px; border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; }
.prog-row td:first-child { font-weight: 800; }
dialog.editor { border: 0; border-radius: 18px; padding: 0; width: min(760px, 96vw); max-height: 92vh; }
dialog.editor::backdrop { background: rgba(0,0,0,.4); }
.ed-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; z-index: 2; }
.ed-head h2 { flex: 1; margin: 0; font-family: var(--display); }
.ed-body { padding: 16px 18px; }
.pics { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 8px; }
.pics figure { margin: 0; width: 96px; text-align: center; font-size: 12px; }
.pics img { width: 96px; height: 72px; object-fit: cover; border-radius: 8px; display: block; }
</style>
</head>
<body>
<header class="top">
  <img src="https://cdn.shopify.com/s/files/1/1451/3756/files/soup_can_logo_500x814_83667c43-de3b-4690-891e-dfd527e947ca.png?v=1767622073" alt="">
  <h1>Camps manager</h1>
  <span class="who" id="who"></span>
  <button class="btn btn-plain" type="button" id="signOutBtn" hidden>Sign out</button>
</header>
<main class="wrap" id="app"><p class="sub">Loading…</p></main>

<dialog class="editor" id="progEditor" aria-labelledby="peTitle">
  <div class="ed-head"><h2 id="peTitle">Camp program</h2>
    <button class="btn btn-plain" type="button" id="peCancel">Cancel</button>
    <button class="btn btn-berry" type="button" id="peSave">Save program</button></div>
  <div class="ed-body">
    <p class="msg err" id="peErr" hidden></p>
    <div class="field"><label for="pe_name">Name (shown to families, and on every camp day)</label><input id="pe_name" maxlength="80" placeholder="Spring Camp Full Day"></div>
    <div class="three">
      <div class="field"><label for="pe_kind">Kind</label><select id="pe_kind"><option value="full">Full day</option><option value="half">Half day</option><option value="pa">PA/PD day</option></select><span class="help">Sets the price (Camp pricing) and the age rule.</span></div>
      <div class="field"><label for="pe_season">Season</label><select id="pe_season"><option value="winter">Winter</option><option value="spring">Spring</option><option value="summer">Summer</option><option value="fall">Fall</option><option value="pa">PA/PD days</option></select><span class="help">Sales can target a season.</span></div>
      <div class="field"><label>Ages</label><span style="display:flex;gap:6px;align-items:center"><input id="pe_amin" type="number" min="3" max="18" style="width:70px"> to <input id="pe_amax" type="number" min="3" max="18" style="width:70px"></span></div>
    </div>
    <div class="field"><label for="pe_times">Times (one per line, like 09:00-15:00). Half days: one line for the morning and one for the afternoon.</label><textarea id="pe_times" rows="2"></textarea></div>
    <div class="field"><label for="pe_tag">Tagline</label><input id="pe_tag" maxlength="140"></div>
    <div class="field"><label for="pe_over">Description</label><textarea id="pe_over" rows="4" maxlength="2000"></textarea></div>
    <div class="field"><label for="pe_pack">What to pack (one per line)</label><textarea id="pe_pack" rows="4"></textarea></div>
    <div class="field"><label for="pe_note">Good to know (optional)</label><input id="pe_note" maxlength="300"></div>
    <div class="two">
      <label class="check"><input type="checkbox" id="pe_after"> Aftercare can be added</label>
      <label class="check"><input type="checkbox" id="pe_active" checked> Switched on</label>
    </div>
    <div class="field" style="margin-top:12px"><label>Photos (the first is the main one)</label><div class="pics" id="pe_pics"></div>
      <input type="file" id="pe_pic" accept="image/*" multiple><span class="help" id="pe_picmsg"></span></div>
  </div>
</dialog>

<script>
(function () {
  'use strict';
  var SUPABASE_URL = 'https://snxibhbhhchjthfmjtaj.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNueGliaGJoaGNoanRoZm1qdGFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTk2ODAsImV4cCI6MjA5MjYzNTY4MH0.K-89Mx4SxU6N1hMmtK6Q79rWAtk6VTN9b5wemQxcZVA';
  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  var app = document.getElementById('app');
  var STUDIOS = [
    { group: 'British Columbia', list: [['BC-RICH-GC','Richmond Garden City'],['BC-RICH-STV','Richmond Steveston'],['BC-SUR-SSR','Surrey South'],['BC-YVR-KIT','Vancouver Kitsilano'],['BC-YVR-MS','Vancouver Main Street'],['BC-YVR-UBC','Vancouver UBC'],['BC-YYJ-CSV','Victoria Cook Street Village'],['BC-YYJ-ESQ','Victoria Esquimalt'],['BC-YYJ-OB','Victoria Oak Bay'],['BC-YYJ-VIC','Victoria Uptown']] },
    { group: 'Alberta', list: [['AB-YYC-ING','Calgary Inglewood'],['AB-STA-STA','St Albert']] },
    { group: 'Ontario', list: [['ON-BRL-BRL','Burlington South'],['ON-CMB-GLT','Cambridge Galt'],['ON-ERN-ERN','Erin'],['ON-HAM-OS','Hamilton Ottawa Street'],['ON-HAM-WD','Hamilton Waterdown'],['ON-HAM-WH','Hamilton West Harbour'],['ON-KGN-AP','Kingston Arlington Park'],['ON-LDN-BYR','London Byron'],['ON-LDN-WVG','London Wortley Village'],['ON-MIS-PC','Mississauga Port Credit'],['ON-OAK-OAK','Oakville North'],['ON-OAK-WST','Oakville West'],['ON-YOW-GLB','Ottawa The Glebe'],['ON-STC-STC','St Catharines'],['ON-YYZ-AVE','Toronto Avenue Road'],['ON-YYZ-BP','Toronto Baby Point'],['ON-YYZ-LEA','Toronto Leaside'],['ON-YYZ-BEA','Toronto The Beaches'],['ON-WTR-WTR','Waterloo Uptown']] }
  ];
  var nameById = {}; STUDIOS.forEach(function (g) { g.list.forEach(function (s) { nameById[s[0]] = s[1]; }); });
  var KINDS = { full: 'Full day', half: 'Half day', pa: 'PA/PD day' };
  var SEASON = { winter: 'Winter', spring: 'Spring', summer: 'Summer', fall: 'Fall', pa: 'PA/PD days' };
  var canEdit = false, programs = [], days = [], flash = null, studioSpaces = {};
  var filt = { from: todayStr(), to: addDays(todayStr(), 120), studio: '', program: '', empty: false };

  function $(id) { return document.getElementById(id); }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function todayStr() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function addDays(s, n) { var d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
  function niceDate(d) { return new Date(d + 'T12:00:00').toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }); }
  function timeLabel(t) { var p = String(t || '').split(':').map(Number); return (p[0] % 12 || 12) + (p[1] ? ':' + String(p[1]).padStart(2, '0') : '') + (p[0] >= 12 ? 'pm' : 'am'); }

  // ---- Sign in (home office admin login, Studio Ops access) ----
  async function start() {
    var s = await sb.auth.getSession();
    if (!s.data.session) { renderSignIn(); return; }
    $('who').textContent = s.data.session.user.email || ''; $('signOutBtn').hidden = false;
    var view = await sb.rpc('admin_can', { p_section: 'ops', p_level: 'view' });
    var edit = await sb.rpc('admin_can', { p_section: 'ops', p_level: 'edit' });
    if (!view.data) { app.innerHTML = '<div class="panel"><h2>No access</h2><p class="sub">This login doesn\u2019t have Studio Ops access. Ask an owner to turn it on in admin.</p></div>'; return; }
    canEdit = !!edit.data;
    await loadAll();
  }
  function renderSignIn(err) {
    app.innerHTML = '<form class="panel" id="signinForm" style="max-width:420px;margin:40px auto"><h2>Sign in</h2><p class="sub">Use your home office admin login.</p>' +
      (err ? '<p class="msg err">' + esc(err) + '</p>' : '') +
      '<div class="field"><label for="em">Email</label><input type="email" id="em" autocomplete="username" required></div>' +
      '<div class="field"><label for="pw">Password</label><input type="password" id="pw" autocomplete="current-password" required></div>' +
      '<button class="btn btn-berry" type="submit">Sign in</button></form>';
    $('signinForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var r = await sb.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
      if (r.error) { renderSignIn('That email and password didn\u2019t match.'); return; }
      start();
    });
  }
  $('signOutBtn').addEventListener('click', async function () { await sb.auth.signOut(); location.reload(); });

  async function loadAll() {
    var p = await sb.rpc('camp_programs_list');
    if (p.error) { app.innerHTML = '<div class="panel"><h2>Not set up yet</h2><p class="sub">Run camps_manager.sql in Supabase first. (' + esc(p.error.message) + ')</p></div>'; return; }
    programs = p.data || [];
    var sp = await sb.rpc('camp_studio_spaces_list');
    studioSpaces = {}; (sp.data || []).forEach(function (x) { studioSpaces[x.studio_id] = x.spaces; });
    if (sp.error) flash = ['err', 'Studio spaces aren\u2019t set up yet: run camp_shared_spaces.sql in Supabase.'];
    await loadDays();
  }
  async function loadDays() {
    var r = await sb.rpc('camp_days_list', { p_from: filt.from, p_to: filt.to, p_studio: filt.studio || null, p_program: filt.program || null });
    days = r.error ? [] : (r.data || []);
    if (r.error) flash = ['err', 'Camp days didn\u2019t load: ' + r.error.message];
    render();
  }

  // ---- Page ----
  function render() {
    var h = '';
    if (flash) { h += '<p class="msg ' + flash[0] + '">' + esc(flash[1]) + '</p>'; flash = null; }
    h += programsHtml() + spacesHtml() + addHtml() + daysHtml();
    app.innerHTML = h;
    bind();
  }
  function programsHtml() {
    return '<section class="panel"><div class="toolbar"><div class="grow"><h2>Camp programs</h2><p class="sub" style="margin:0">Each camp written once: what it is, ages, times and what to pack. Families see this on World.</p></div>' +
      (canEdit ? '<button class="btn btn-berry" type="button" id="progNew">Add a program</button>' : '') + '</div>' +
      '<table><thead><tr><th>Program</th><th>Kind</th><th>Season</th><th>Ages</th><th>Times</th><th></th></tr></thead><tbody>' + programs.map(function (p, i) {
        return '<tr class="prog-row"><td>' + esc(p.name) + (p.active ? '' : ' <span class="pill closed">Off</span>') + '</td><td>' + esc(KINDS[p.kind] || p.kind) + '</td><td>' + esc(SEASON[p.season] || p.season) + '</td>' +
          '<td>' + p.ages_min + '\u2013' + p.ages_max + '</td><td>' + esc((p.times || []).map(function (t) { var x = t.split('-'); return timeLabel(x[0]) + '\u2013' + timeLabel(x[1]); }).join(', ')) + '</td>' +
          '<td>' + (canEdit ? '<button class="btn btn-plain" type="button" data-progedit="' + i + '">Edit</button>' : '') + '</td></tr>';
      }).join('') + '</tbody></table></section>';
  }
  function spacesHtml() {
    return '<section class="panel"><h2>Camp spaces per studio</h2><p class="sub">How many kids each studio can take at camp. Every camp at a studio on a day shares these: a full-day or PA/PD child uses a morning and an afternoon spot; a half-day child uses just their half. Single days can be changed below.</p>' +
      '<div class="studio-groups">' + STUDIOS.map(function (g) {
        return '<fieldset><legend>' + esc(g.group) + '</legend>' + g.list.map(function (s) {
          var v = studioSpaces[s[0]];
          return '<label style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0"><span>' + esc(s[1]) + '</span>' +
            (canEdit ? '<input class="spaces-in" type="number" min="0" max="300" data-stsp="' + s[0] + '" value="' + (v == null ? '' : v) + '" placeholder="\u2014">' : '<b>' + (v == null ? '\u2014' : v) + '</b>') + '</label>';
        }).join('') + '</fieldset>';
      }).join('') + '</div>' +
      (canEdit ? '<div style="margin-top:10px;display:flex;gap:8px;align-items:center"><button class="btn btn-berry" type="button" id="spSave">Save studio spaces</button><span class="help" id="spMsg">Upcoming camp days follow a studio\u2019s new number (except days changed one by one).</span></div>' : '') + '</section>';
  }
  function addHtml() {
    if (!canEdit) return '';
    var act = programs.filter(function (p) { return p.active; });
    return '<section class="panel"><h2>Add camp days</h2><p class="sub">Makes a camp day for every studio, date and time you choose. Any studio, date and time that already has a camp (made here, or already on Shopify) is skipped, so nothing doubles up.</p>' +
      '<div class="field"><label for="ad_prog">Program</label><select id="ad_prog">' + act.map(function (p) { return '<option value="' + esc(p.id) + '">' + esc(p.name) + '</option>'; }).join('') + '</select><span class="help">Spaces come from each studio\u2019s camp spaces (above), shared with the other camps that day.</span></div>' +
      '<div class="field"><label>Studios <button class="link" type="button" data-allst="1">All</button><button class="link" type="button" data-allst="0">None</button></label><div class="studio-groups">' +
      STUDIOS.map(function (g) {
        return '<fieldset><legend><label class="check"><input type="checkbox" data-grp="' + esc(g.group) + '"> ' + esc(g.group) + '</label></legend>' +
          g.list.map(function (s) { return '<label><input type="checkbox" data-st="' + s[0] + '" data-g="' + esc(g.group) + '"> ' + esc(s[1]) + '</label>'; }).join('') + '</fieldset>';
      }).join('') + '</div></div>' +
      '<div class="three"><div class="field"><label for="ad_from">From</label><input id="ad_from" type="date"></div><div class="field"><label for="ad_to">To</label><input id="ad_to" type="date"></div>' +
      '<div class="field"><label>Days of the week</label><div class="chips">' + ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(function (d, i) {
        var n = (i + 1) % 7; return '<label><input type="checkbox" data-wd="' + n + '"' + (n >= 1 && n <= 5 ? ' checked' : '') + '>' + d + '</label>'; }).join('') + '</div></div></div>' +
      '<div class="field"><label for="ad_skip">Dates to skip (one per line, or separated by commas), e.g. holidays</label><textarea id="ad_skip" rows="2" placeholder="2027-04-02, 2027-04-05"></textarea></div>' +
      '<div class="preview" id="adPreview">Choose a program, studios and dates.</div>' +
      '<button class="btn btn-berry" type="button" id="adGo" disabled>Create camp days</button></section>';
  }
  function daysHtml() {
    var progOpts = '<option value="">All programs</option>' + programs.map(function (p) { return '<option value="' + esc(p.id) + '"' + (filt.program === p.id ? ' selected' : '') + '>' + esc(p.name) + '</option>'; }).join('');
    var stOpts = '<option value="">All studios</option>' + STUDIOS.map(function (g) { return '<optgroup label="' + esc(g.group) + '">' + g.list.map(function (s) { return '<option value="' + s[0] + '"' + (filt.studio === s[0] ? ' selected' : '') + '>' + esc(s[1]) + '</option>'; }).join('') + '</optgroup>'; }).join('');
    var tot = days.reduce(function (a, d) { a.cap += d.capacity || 0; a.bk += d.booked; return a; }, { cap: 0, bk: 0 });
    var h = '<section class="panel"><h2>Camp days</h2><p class="sub">Spaces, booked and left for each camp day. Change spaces any time; families mid-payment keep their spots.</p>' +
      '<div class="toolbar"><div class="field" style="margin:0"><label for="f_from">From</label><input id="f_from" type="date" value="' + filt.from + '"></div>' +
      '<div class="field" style="margin:0"><label for="f_to">To</label><input id="f_to" type="date" value="' + filt.to + '"></div>' +
      '<div class="field" style="margin:0"><label for="f_studio">Studio</label><select id="f_studio">' + stOpts + '</select></div>' +
      '<div class="field" style="margin:0"><label for="f_prog">Program</label><select id="f_prog">' + progOpts + '</select></div>' +
      '<button class="btn btn-plain" type="button" id="fGo" style="align-self:flex-end">Show</button>' +
      '<label class="check" style="align-self:flex-end;padding-bottom:10px"><input type="checkbox" id="fEmpty"' + (filt.empty ? ' checked' : '') + '> Show 0-space days</label></div>';
    // Days with no spaces and nobody booked (e.g. a studio not running that PA/PD day) are hidden unless asked for.
    var hidden = 0;
    var all = days;
    var shown = filt.empty ? all : all.filter(function (d) { var empty = !d.capacity && !d.booked; if (empty) hidden++; return !empty; });
    if (!shown.length) return h + '<p class="sub">No camp days in those dates' + (hidden ? ' (' + hidden + ' with 0 spaces hidden)' : ' yet') + '.</p></section>';
    days = shown;
    var nShop = days.filter(function (d) { return d.source === 'shopify'; }).length;
    if (hidden) h += '<p class="help">' + hidden + (hidden === 1 ? ' camp day with 0 spaces and nobody booked is hidden.' : ' camp days with 0 spaces and nobody booked are hidden.') + '</p>';

  // ---- Adjust spaces left on Shopify camp days (live Shopify inventory) ----
  // Same title matching and shopify-inventory function as the Hub's spaces adjuster.
function buildShopifyTitle(sessionDate, sessionTime, sessionTitle) {
  const d = new Date(sessionDate + 'T12:00:00')
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
  const day = days[d.getDay()], month = months[d.getMonth()], date = d.getDate()
  const suffix = date===1||date===21||date===31?'st':date===2||date===22?'nd':date===3||date===23?'rd':'th'
  const [h, m] = sessionTime.split(':').map(Number)
  const hour = h===0?12:h>12?h-12:h
  const ampm = h<12?'am':'pm'
  const timeStr = m===0?`${hour}${ampm}`:`${hour}:${String(m).padStart(2,'0')}${ampm}`
  const starPrefix = (h===9&&m===0)?'*':''
  const titleLower = sessionTitle.toLowerCase().trim()
  const TITLE_MAP = {
    // New clean titles (Supabase = Shopify)
    'kids party':'Kids Party','splatter party':'Splatter Party','field trip':'Field Trip',
    'thursday clay night':'Thursday Clay Night',
    // Legacy mappings for backward compatibility
    'party time slot':null,'splatter party time slot':null,'field trip time slot':null,
    'adult get-together time slot':'Adult Get Togethers, Parties & Group Booking',
    'wheel workshop (adult & teen)':'Wheel Workshop','wheel workshop':'Wheel Workshop',
    'friday night mixer':'Friday Night Mixer','friday night mixer (ages 16+)':'Friday Night Mixer',
    'sunday morning family time mixer':'Sunday Morning Family Time Mixer',
    'sunday early bird workshop':'Sunday Early Bird Workshop',
    'mixed media class for kids ($10 for members)':'Mixed Media Class',
    'thursdays: clay night':'Thursday Clay Night','natureware mugs':'Natureware Mug',
    'summer camp half day morning':'Summer Camp Half Day','summer camp half day afternoon':'Summer Camp Half Day',
    'no school day camp (ages 6-12)':'PA/PD Day','pd day':'PA/PD Day','pa day':'PA/PD Day','pa/pd day':'PA/PD Day',
    "mother's day celebration":"Mother's Day",'afternoon art meetup':'Afternoon Art Meetup',
    'saturday early bird workshop':'Saturday Early Bird Workshop',
    'dragons session (ages 5-12) class 1 of 5':'Dragons 5 Week Kids Session',
    'early drop off (mixed media class)':null,
  }
  if (/\b(class|week|session|part)\s+([2-9]|\d{2,})\s+of\s+\d+/i.test(sessionTitle)) return null
  if (titleLower in TITLE_MAP && TITLE_MAP[titleLower] === null) return null
  if (titleLower === 'weekend workshop') return null
  if (/^weekend workshop:\s*/i.test(sessionTitle)) return `${starPrefix}${timeStr} ${day} ${month} ${date}${suffix} | ${sessionTitle.replace(/^weekend workshop:\s*/i,'').trim()}`
  if (titleLower.includes('wednesday paint night')) return `${starPrefix}${timeStr} ${day} ${month} ${date}${suffix} | Wednesday Paint Night`
  if (TITLE_MAP[titleLower]) return `${starPrefix}${timeStr} ${day} ${month} ${date}${suffix} | ${TITLE_MAP[titleLower]}`
  const seriesMatch = sessionTitle.match(/(\|\s*\d+\s+Week\s+Session.*)/i)
  const seriesSuffix = seriesMatch ? ` ${seriesMatch[1].trim()}` : ''
  let cleanTitle = sessionTitle.replace(/\s*\|.*$/, '').trim()
  return `${starPrefix}${timeStr} ${day} ${month} ${date}${suffix} | ${cleanTitle}${seriesSuffix}`
}

  function shrink(file, maxW) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () {
        var sc = Math.min(1, maxW / img.naturalWidth), c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
        var ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(img.src);
        c.toBlob(function (b) { b ? resolve(b) : reject(new Error('Could not read that picture')); }, 'image/jpeg', 0.86);
      };
      img.onerror = function () { reject(new Error('Could not open that picture')); };
      img.src = URL.createObjectURL(file);
    });
  }

      });
      if (!changes.length) { $('spMsg').textContent = 'Nothing changed.'; return; }
      sps.disabled = true; $('spMsg').textContent = 'Saving ' + changes.length + '\u2026';
      for (var i = 0; i < changes.length; i++) {
        var r = await sb.rpc('camp_studio_spaces_set', { p_studio: changes[i][0], p_spaces: changes[i][1] });
        if (r.error) { sps.disabled = false; $('spMsg').textContent = 'Not saved for ' + nameById[changes[i][0]] + ': ' + r.error.message; return; }
        studioSpaces[changes[i][0]] = changes[i][1];
      }
      flash = ['ok', 'Saved camp spaces for ' + changes.length + ' studio' + (changes.length === 1 ? '' : 's') + '.'];
      await loadDays();
    });
    app.querySelectorAll('[data-open]').forEach(function (b) { b.addEventListener('click', async function () {
      var d = days[+b.dataset.open];
      var r = await sb.rpc('camp_day_set_open', { p_session: d.id, p_open: d.closed });
      flash = r.error ? ['err', r.error.message] : ['ok', (d.closed ? 'Reopened ' : 'Closed ') + nameById[d.studio_id] + ', ' + niceDate(d.session_date) + '.'];
      await loadDays();
    }); });
    app.querySelectorAll('[data-del]').forEach(function (b) { b.addEventListener('click', async function () {
      var d = days[+b.dataset.del];
      if (!confirm('Delete this camp day (' + nameById[d.studio_id] + ', ' + niceDate(d.session_date) + ')?')) return;
      var r = await sb.rpc('camp_day_delete', { p_session: d.id });
      flash = r.error ? ['err', r.error.message] : ['ok', 'Deleted.'];
      await loadDays();
    }); });
  }

  start();
})();
</script>
</body>
</html>
