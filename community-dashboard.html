// Top 3 studios (today or this month). The logged-in studio is highlighted
// if it's in the top 3; otherwise its own rank is shown underneath.
const LB_MEDALS = ['🥇', '🥈', '🥉'];

function leaderboardRowHtml(rank, studioId, pct, isYou) {
  const name = STUDIO_NAMES[studioId] || studioId;
  const width = Math.max(0, Math.min(pct, 100));
  const rankHtml = rank <= 3
    ? `<div class="sglb-rank">${LB_MEDALS[rank - 1]}</div>`
    : `<div class="sglb-rank num">#${rank}</div>`;
  return `
    <div class="sglb-row${isYou ? ' you' : ''}">
      ${rankHtml}
      <div class="sglb-name">${esc(name)}${isYou ? '<span class="sglb-you-tag">YOU</span>' : ''}</div>
      <div class="sglb-bar"><div class="${pct >= 100 ? 'hit' : ''}" style="width:${width}%"></div></div>
      <div class="sglb-pct">${pct}%</div>
    </div>`;
}

// Two leaderboards from community-goal-progress: today's % of daily goal
// and this month's % of monthly goal. A toggle switches between them; the
// choice sticks while the page is open (resets to This month on reload).
let lbMode = 'month';
let lastGoalData = null;

function setLeaderboardMode(mode) {
  lbMode = mode;
  if (lastGoalData) renderGoalCard(lastGoalData);
}

function leaderboardHtml(data) {
  if (!data) return '';
  const monthLb = data.leaderboard;
  const todayLb = data.todayLeaderboard;
  const hasToday = !!(todayLb && todayLb.top && todayLb.top.length);
  const hasMonth = !!(monthLb && monthLb.top && monthLb.top.length);
  if (!hasToday && !hasMonth) return '';

  // Fall back to whichever list exists (e.g. an older function deploy
  // without todayLeaderboard just shows the monthly list, no toggle).
  const mode = lbMode === 'today' && hasToday ? 'today' : (hasMonth ? 'month' : 'today'); // month unless Today is picked (or month is missing)
  const isToday = mode === 'today';
  const lb = isToday ? todayLb : monthLb;
  const pctOf = r => isToday ? r.pct : r.monthPct;

  const rows = lb.top.map(r => leaderboardRowHtml(r.rank, r.studioId, pctOf(r), r.isYou)).join('');
  const youRow = lb.you
    ? `<div class="sglb-gap">···</div>` + leaderboardRowHtml(lb.you.rank, data.studioId, pctOf(lb.you), true)
    : '';

  const basis = isToday ? "% of today's goal (each studio's local day)" : '% of monthly goal';
  const missing = lb.notRanked
    ? ` · ${lb.notRanked} without a goal set${isToday ? '' : ' this month'}`
    : '';
  const foot = `<div class="sglb-foot">Ranked by ${basis} · ${lb.totalRanked} studio${lb.totalRanked === 1 ? '' : 's'} ranked${missing}</div>`;

  const toggle = hasToday && hasMonth
    ? `<div class="sglb-toggle">
         <button class="${isToday ? '' : 'on'}" onclick="setLeaderboardMode('month')">This month</button>
         <button class="${isToday ? 'on' : ''}" onclick="setLeaderboardMode('today')">Today</button>
       </div>`
    : '';
  const title = isToday ? '🏆 Top Studios — Today' : `🏆 Top Studios — ${esc(monthLabel(data.month))}`;

  return `
    <div class="sglb">
      <div class="sglb-head"><div class="sglb-title">${title}</div>${toggle}</div>
      ${rows}${youRow}
      ${foot}
    </div>`;
}

async function fetchInstagramWithPin(pin, studioId) {
  const res = await fetch(`${SUPABASE_URL}/functions/v1/community-instagram-data`, {

    headers: await fnHeaders(),

  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function igNum(n) {
  return n == null ? '—' : Number(n).toLocaleString('en-US');
}

function renderInstagramCard(data) {
  const container = document.getElementById('card-instagram');
  if (!container) return;
  if (!data || data.error || !data.studioId) { container.innerHTML = ''; return; }

  const studioName = STUDIO_NAMES[data.studioId] || data.studioId;
  const head = `<div class="card-head"><div class="title">📷 Instagram — ${esc(studioName)}</div>${data.username ? `<div class="ig-handle">@${esc(String(data.username).replace(/^@/, ''))}</div>` : ''}</div>`;

  if (data.state === 'not_connected') {
    container.innerHTML = head + `<div class="goal-note">Instagram isn't connected for this studio yet.</div>`;
    return;
  }
  if (data.state === 'no_snapshot_yet') {
    container.innerHTML = head + `<div class="goal-note">Connected — waiting for the first sync.</div>`;
    return;
  }

  let changeHtml = '';
  if (data.followerChange != null) {
    const c = data.followerChange;
    const cls = c > 0 ? 'up' : c < 0 ? 'down' : 'flat';
    const arrow = c > 0 ? '↑' : c < 0 ? '↓' : '→';
    changeHtml = `<div class="ig-change ${cls}">${arrow} ${igNum(Math.abs(c))} in ${data.changeSinceDays} day${data.changeSinceDays === 1 ? '' : 's'}</div>`;
  }

  const tile = (label, value, extra) => `
    <div class="friday-tile">
      <div class="eyebrow">${esc(label)}</div>
      <div class="pct">${igNum(value)}</div>
      ${extra || ''}
    </div>`;

  container.innerHTML = head
    + (data.state === 'stale' ? `<div class="ig-warn">⚠ The last update failed — showing the most recent good numbers.</div>` : '')
    + `<div class="ig-grid">
        ${tile('Followers', data.followers, changeHtml)}
        ${tile('Reach', data.reach)}
        ${tile('Profile Views', data.profileViews)}
        ${tile('Engagements', data.engagements)}
      </div>`
    + `<div class="ig-foot">${data.asOf ? 'As of ' + esc(data.asOf) : 'As of — (studio timezone unavailable)'}</div>`;
}

  try {

  } catch (e) {
    console.error('Instagram load failed:', e);
    const c = document.getElementById('card-instagram');
    if (c) c.innerHTML = `<div class="card-head"><div class="title">📷 Instagram</div></div><div class="goal-note">Couldn't load Instagram right now. Try refreshing the page.</div>`;

async function submitCoordinatorPin() {
  if (_pinSubmitting) return;
  const input = document.getElementById('coordinator-pin-input');
  const pin = input ? input.value.trim() : '';
  if (!pin) return;
  _pinSubmitting = true;
  let data;
  try {
    data = await fetchFridayFillRateWithPin(pin, _sessionStudioId);
  } catch (e) {
    _pinSubmitting = false;
    openPinModal(e.message || 'Invalid PIN or not authorized for this view.');
    return;
  }
  _pinSubmitting = false;
  closePinModal();

  _sessionPin = pin;
  _viewLevel = data.level === 'admin' ? 'admin' : 'sc';
  document.body.classList.add('sc-mode');
  document.body.classList.toggle('preview-mode', _viewLevel === 'admin');

  // An SC PIN always shows that SC's studio (an admin studio login may have
  // been looking at a different one).
  const studioChanged = data.studioId !== _sessionStudioId;
  _sessionStudioId = data.studioId;
  renderViewBar();
  renderAdminStudioSwitcher(data); // admin PIN → all studios; SC PIN → no switcher
  renderFridayFillRateBody(data); // Friday numbers only come back with a PIN
  if (studioChanged) {
    await renderWeatherCard(data.studioId);
    loadStudioCards(data.studioId);
  } else {
    loadDailyHero(_sessionPin, data.studioId); // greeting switches to their name
  }
  loadCoordinatorCards(data.studioId);
  resetInactivityTimer();
}

function endCoordinatorView(reload = true) {
  const wasUnlocked = !!_sessionPin;
  _sessionPin = null;
  if (_studioViewStarted) _viewLevel = 'studio';
  document.body.classList.remove('sc-mode', 'preview-mode');
  if (_inactivityTimer) { clearTimeout(_inactivityTimer); _inactivityTimer = null; }
  ['card-points', 'card-marketing-suggestions', 'card-checkins', 'card-instagram', 'card-studio-sales',
   'card-friday-fillrate', 'card-sales-goals', 'card-kids-parties', 'card-team-building',
   'card-studio-space'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = '';
  });
  if (paneVisible('points-pane') || paneVisible('instagram-pane')) showDashboardPane(); // coordinator-only pages
  // Supplies is admin preview only until INVENTORY_LIVE, so locking closes it too.
  // Once live, locking just reloads it so the Counts tab locks again.
  if (!INVENTORY_LIVE) {
    if (paneVisible('inventory-pane')) showDashboardPane();
    setInvBadge(0);
  } else if (reload && paneVisible('inventory-pane')) {
    loadInventory();
  }
  ['points-bar', 'instagram-bar'].forEach(id => { const b = document.getElementById(id); if (b) b.innerHTML = ''; });
  _lastPointsData = null;
  if (!_studioViewStarted) return;
  if (!wasUnlocked || !reload) { renderViewBar(); return; }

  // A non-admin studio login always returns to its own studio.
  if (!_studioData.isAdmin && _sessionStudioId !== _studioData.studioId) {
    changeAdminStudio(_studioData.studioId);
  } else {
    loadDailyHero(null, _sessionStudioId); // greeting back to "team"

  renderViewBar();
  renderAdminStudioSwitcher(Object.assign({}, _studioData, { studioId: _sessionStudioId }));
}

// ---------- Seasonal Theme (banner image + accent colors) ----------
// Public/decorative, no PIN needed — loads immediately, before login even.
// Falls back to the default purple gradient if no theme is active yet or
// the fetch fails, so this can never block/break the rest of the page.

async function loadDashboardTheme() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/dashboard_themes?is_active=eq.true&select=*&limit=1`,
      { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } }
    );
    const rows = await res.json();
    const theme = rows && rows[0];
    if (!theme) return; // no active season theme — keep the default gradient

    document.documentElement.style.setProperty('--accent', theme.accent_color);
    document.documentElement.style.setProperty('--accent-deep', theme.accent_color_deep);
    document.documentElement.style.setProperty('--sidebar-bg', theme.sidebar_color);
    document.documentElement.style.setProperty('--sidebar-bg-2', theme.sidebar_color_deep);

    // Per-week-theme banner AND colors take priority over the season-level
    // ones — only fall back per-field if that specific week's theme hasn't
    // set its own (so a theme can set just a banner, just colors, or both).
    let bannerUrl = theme.banner_image_url;
    try {
      const weekStyleRes = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_active_theme_banner`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
        body: JSON.stringify({ p_date: localDateStr(new Date()) })
      });
      const weekStyleRows = await weekStyleRes.json();
      const weekStyle = weekStyleRows && weekStyleRows[0];
      if (weekStyle) {
        if (weekStyle.banner_image_url) bannerUrl = weekStyle.banner_image_url;
        if (weekStyle.accent_color) document.documentElement.style.setProperty('--accent', weekStyle.accent_color);
        if (weekStyle.accent_color_deep) document.documentElement.style.setProperty('--accent-deep', weekStyle.accent_color_deep);
        if (weekStyle.sidebar_color) document.documentElement.style.setProperty('--sidebar-bg', weekStyle.sidebar_color);
        if (weekStyle.sidebar_color_deep) document.documentElement.style.setProperty('--sidebar-bg-2', weekStyle.sidebar_color_deep);
      }
    } catch (e) {
      console.error('Weekly theme style load failed, using season theme instead:', e);
    }

    if (bannerUrl) {
      const applyBanner = () => {
        const hero = document.getElementById('card-daily-hero');
        if (hero) {
          hero.style.backgroundImage =
            `linear-gradient(135deg, rgba(0,0,0,0.35), rgba(0,0,0,0.15)), url('${bannerUrl}')`;
        }
      };
      applyBanner();
      const heroObserver = new MutationObserver(applyBanner);
      const heroEl = document.getElementById('card-daily-hero');
      if (heroEl) heroObserver.observe(heroEl, { childList: true });
    }
  } catch (e) {
    console.error('Dashboard theme load failed:', e);
    // Fail silently — default styling still works fine.
  }
}

  document.getElementById('dashboard-gate').style.display = 'none';
  document.getElementById('dashboard-shell').style.display = 'flex';
  showOnlyPane('schedule-pane');
  const pane = document.getElementById('schedule-pane');
  if (!_scheduleLoaded || (_sessionStudioId && _scheduleStudioId !== _sessionStudioId)) {
    const params = new URLSearchParams();
    if (_sessionStudioId) params.set('studio', _sessionStudioId);
    if (view === 'week') params.set('view', 'week');
    const qs = params.toString();
    pane.innerHTML = `<iframe src="schedule.html${qs ? '?' + qs : ''}" title="Studio schedule"></iframe>`;
    _scheduleLoaded = true;
    _scheduleStudioId = _sessionStudioId;
  }
  setActiveNav('nav-schedule');
}
async function goToDashboard() {
  if (_studioViewStarted) { showDashboardPane(); return; }
  // Came from the Schedule button on the sign-in screen — the schedule may
  // have signed this device in, in which case the dashboard opens directly.
  const { data } = await sb.auth.getSession();
  if (data && data.session) startStudioView();
  else renderLoginGate();
}
function showDashboardPane() {
  showOnlyPane('dashboard-main');
  setActiveNav('nav-dashboard');
}
function setActiveNav(id) {
  document.querySelectorAll('.sidebar .nav-item').forEach(b => b.classList.toggle('active', b.id === id));
}

// ---------- Coordinator view auto-lock ----------
// After 60 seconds idle the coordinator view locks back to the studio view.
// The studio login itself stays signed in.
const INACTIVITY_LOCK_MS = 60 * 1000;
let _inactivityTimer = null;
function resetInactivityTimer() {
  if (!_sessionPin) return; // studio view only — nothing to lock
  if (_inactivityTimer) clearTimeout(_inactivityTimer);
  _inactivityTimer = setTimeout(() => endCoordinatorView(), INACTIVITY_LOCK_MS);
}
['mousemove', 'mousedown', 'keydown', 'touchstart', 'scroll'].forEach(evt => {
  document.addEventListener(evt, resetInactivityTimer, { passive: true });
});

// Signed out anywhere on this device (here, or in the schedule frame) →
// back to the sign-in screen.
sb.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_OUT' && (_studioViewStarted || _scheduleLoaded)) resetToSignedOut();
});

// ==========================================================================
// SUPPLIES (inventory): Supply Store, blind counts, studio-to-studio transfers
// Served by the community-inventory Edge Function. The studio login is
// enough; the server decides which studio this device is (a coordinator or
// admin PIN also works, and an admin can follow the studio switcher).
// The server never sends stock levels or expected counts. Counts are blind
// by design, so there is nothing on this page to hide.
//
// INVENTORY_LIVE = true: every studio login gets the tab (Store + Transfers).
// Set it back to false to hide the tab behind admin preview (admin PIN).
// Counts need a coordinator or admin PIN (enforced in community-inventory);
// without one, the Counts tab offers the usual PIN prompt. The bubble still
// shows due counts to everyone, so staff know to get a manager.
// ==========================================================================
const INVENTORY_LIVE = true;

let _inv = null;          // last 'init' response
let _invStudioId = null;  // studio the cart belongs to
let _invStaff = '';       // "who's using the store", kept until sign-out
let _invTab = 'store';    // 'store' | 'counts' | 'transfers'
let _invMode = 'open';    // store mode: 'open' | 'return'
let _invCart = {};        // `${action}:${sku}` → { sku, name, qty, action }
let _invFlash = null;     // { type: 'ok'|'err'|'warn', text }
let _invBusy = false;

// Tile colours for the store. Matched on the item name, so a new colour just
// gets a neutral tile until it's added here.
const INV_SWATCHES = {
  'azure': '#2b8fd6', 'beige': '#e6d5b8', 'black': '#222222', 'glow': '#d9f99d',
  'gold': '#d4af37', 'granny': '#8dc63f', 'green': '#2e9e4f', 'lemon': '#fff15c',
  'marble grey': '#a3a6ad', 'orange': '#f97316', 'peach': '#ffc8a2', 'pink': '#ec4899',
  'purple': '#7e22ce', 'raw umber': '#826644', 'red': '#dc2626', 'silver': '#c0c0c0',
  'sky blue': '#7dd3fc', 'sparkle blue': '#3b6cf6', 'ultramarine': '#1e3a8a',
  'van dyke brown': '#4b3621', 'violet': '#8b5cf6', 'white': '#f7f7f5', 'yellow': '#facc15',
  'brown clay': '#8b5e3c', 'low fire white clay': '#ece4d6'
};

function invDisplayName(name) {
  const n = String(name || '').replace(/^ditto\s*-\s*/i, '');
  return n.charAt(0).toUpperCase() + n.slice(1);
}
function invSwatch(name) {
  const key = String(name || '').toLowerCase().replace(/^ditto\s*-\s*/, '');
  return INV_SWATCHES[key] || '#e5e7eb';
}
function invSizeNote(note) {
  return String(note || '').replace(/\s*\(single colou?r\)\s*/i, '');
}
function invStudioName(id) { return STUDIO_NAMES[id] || id; }
function invShortDate(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleDateString('en-CA', { month: 'short', day: 'numeric' });
}

function invEnabled() {
  return INVENTORY_LIVE || document.body.classList.contains('preview-mode');
}

async function invCall(action, extra) {
  const res = await fetch(`${SUPABASE_URL}/functions/v1/community-inventory`, {
    method: 'POST',
    headers: await fnHeaders(),
    body: JSON.stringify(Object.assign({ action, pin: _sessionPin, studioId: _sessionStudioId }, extra || {}))
  });
  let data = {};
  try { data = await res.json(); } catch (e) { /* non-JSON error page */ }
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

// Things waiting on this studio: due counts, plus transfers it needs to act on.
function invActionCounts(d) {
  if (!d) return { counts: 0, transfers: 0 };
  const transfers = (d.transfers || []).filter(t =>
    (t.direction === 'outgoing' && t.status === 'requested') ||
    (t.direction === 'incoming' && t.status === 'sent')
  ).length;
  return { counts: d.dueCountTotal || 0, transfers };
}

function setInvBadge(n) {
  const b = document.getElementById('inv-badge');
  if (!b) return;
  b.textContent = n > 9 ? '9+' : String(n);
  b.style.display = n > 0 ? '' : 'none';
}

// Called whenever the studio cards load (sign-in, studio switch, PIN unlock).
async function refreshInventory() {
  if (!invEnabled() || !_studioViewStarted) { setInvBadge(0); return; }
  if (paneVisible('inventory-pane')) { loadInventory(); return; }
  try {
    _inv = await invCall('init');
    const a = invActionCounts(_inv);
    setInvBadge(a.counts + a.transfers);
  } catch (e) {
    console.error('Supplies badge refresh failed:', e);
  }
}

// Sidebar → 📦 Supplies
function openInventory() {
  showOnlyPane('inventory-pane');
  setActiveNav('nav-inventory');
  const body = document.getElementById('inv-body');
  if (body && !_inv) body.innerHTML = `<div class="card"><div class="inv-empty">Loading supplies…</div></div>`;
  loadInventory();
}

async function loadInventory() {
  try {
    _inv = await invCall('init');
  } catch (e) {
    _inv = null;
    document.getElementById('inv-body').innerHTML =
      `<div class="inv-flash err">Couldn't load supplies: ${esc(e.message)}</div>`;
    return;
  }
  // A different studio (admin switcher) gets a fresh cart and name.
  if (_invStudioId && _invStudioId !== _inv.studioId) {
    _invCart = {};
    _invStaff = '';
  }
  _invStudioId = _inv.studioId;
  if (_invStaff && (_inv.staff || []).length && !_inv.staff.includes(_invStaff)) _invStaff = '';
  const a = invActionCounts(_inv);
  setInvBadge(a.counts + a.transfers);
  renderInventory();
}

function invReset() {
  _inv = null; _invStudioId = null; _invStaff = ''; _invCart = {};
  _invFlash = null; _invTab = 'store'; _invMode = 'open';
  setInvBadge(0);
  const bar = document.getElementById('inventory-bar');
  if (bar) bar.innerHTML = '';
  const body = document.getElementById('inv-body');
  if (body) body.innerHTML = '';
}

// ---------- rendering ----------
function renderInventory() {
  if (!_inv) return;
  const bar = document.getElementById('inventory-bar');
  bar.innerHTML = `<span>📦 Supplies · <span class="who">${esc(invStudioName(_inv.studioId))}</span></span>
    <span class="spacer"></span><button onclick="goToDashboard()">← Dashboard</button>`;

  const a = invActionCounts(_inv);
  const badge = n => n > 0 ? `<span class="nav-badge">${n}</span>` : '';
  const staff = _inv.staff || [];
  const whoInput = staff.length
    ? `<select onchange="_invStaff = this.value; renderInventory()">
         <option value="">Choose your name</option>
         ${staff.map(n => `<option value="${escAttr(n)}" ${n === _invStaff ? 'selected' : ''}>${esc(n)}</option>`).join('')}
       </select>`
    : `<input type="text" placeholder="Your name" value="${escAttr(_invStaff)}"
         onchange="_invStaff = this.value.trim(); renderInventory()" />`;

  const flash = _invFlash ? `<div class="inv-flash ${_invFlash.type}">${esc(_invFlash.text)}</div>` : '';

  let tabBody = '';
  if (_invTab === 'store') tabBody = renderInvStore();
  else if (_invTab === 'counts') tabBody = renderInvCounts();
  else tabBody = renderInvTransfers();

  document.getElementById('inv-body').innerHTML = `
    <div class="inv-top">
      <label class="inv-who ${_invStaff ? '' : 'missing'}">Who's here? ${whoInput}</label>
    </div>
    <div class="inv-tabs">
      <button class="inv-tab ${_invTab === 'store' ? 'on' : ''}" onclick="invSetTab('store')">🛒 Store</button>
      <button class="inv-tab ${_invTab === 'counts' ? 'on' : ''}" onclick="invSetTab('counts')">📋 Counts${_inv.canCount ? '' : ' 🔒'} ${badge(a.counts)}</button>
      <button class="inv-tab ${_invTab === 'transfers' ? 'on' : ''}" onclick="invSetTab('transfers')">🔁 Transfers ${badge(a.transfers)}</button>
    </div>
    ${flash}
    ${tabBody}`;
}

function invSetTab(tab) { _invTab = tab; _invFlash = null; renderInventory(); }
function invSetMode(mode) { _invMode = mode; renderInventory(); }

// Store: tap a tile to add a box to the cart, then record the cart.
function renderInvStore() {
  const items = _inv.items || [];
  const groups = ['Clay', 'Ditto', 'Other'];
  const inCart = sku => {
    const c = _invCart[`${_invMode}:${sku}`];
    return c ? c.qty : 0;
  };
  const tilesHtml = groups.map(g => {
    const list = items.filter(i => i.group === g);
    if (!list.length) return '';
    return `<div class="inv-group-title">${esc(g)}</div>
      <div class="inv-tiles">${list.map(i => {
        const q = inCart(i.sku);
        return `<button class="inv-tile ${_invMode === 'return' ? 'return' : ''}" onclick="invAdd('${escAttr(i.sku)}')">
          ${q ? `<span class="inv-tile-qty">${q}</span>` : ''}
          <span class="inv-swatch" style="background:${invSwatch(i.name)}"></span>
          <span class="inv-tile-name">${esc(invDisplayName(i.name))}</span>
          <span class="inv-tile-sub">${esc(invSizeNote(i.sizeNote))}</span>
        </button>`;
      }).join('')}</div>`;
  }).join('');

  const lines = Object.entries(_invCart);
  const total = lines.reduce((s, [, c]) => s + c.qty, 0);
  const cartHtml = lines.length
    ? lines.map(([key, c]) => `
        <div class="inv-line">
          <span class="inv-swatch" style="width:22px;height:22px;border-radius:6px;background:${invSwatch(c.name)}"></span>
          <span class="nm">${esc(invDisplayName(c.name))}<br>
            <span class="inv-tag ${c.action === 'return' ? 'return' : ''}">${c.action === 'return' ? '↩ Returning' : '📦 Opening'}</span></span>
          <button class="inv-step" onclick="invStep('${escAttr(key)}', -1)">−</button>
          <strong>${c.qty}</strong>
          <button class="inv-step" onclick="invStep('${escAttr(key)}', 1)">+</button>
        </div>`).join('')
    : `<div class="inv-empty">Tap a box to add it.</div>`;

  return `
    <div class="inv-modes">
      <button class="${_invMode === 'open' ? 'on' : ''}" onclick="invSetMode('open')">📦 Opening a new box</button>
      <button class="${_invMode === 'return' ? 'on' : ''}" onclick="invSetMode('return')">↩ Returning an unopened box</button>
    </div>
    <p class="inv-note">${_invMode === 'open'
      ? 'Before you open a new box of clay or Ditto, "buy" it here.'
      : 'Put a box back unopened? Record it here so it goes back on the shelf count.'}</p>
    <div class="inv-store">
      <div>${tilesHtml || '<div class="inv-empty">No items in the store yet.</div>'}</div>
      <div class="card inv-cart">
        <h3>🛒 Cart</h3>
        ${cartHtml}
        <button class="inv-primary" onclick="invCheckout()" ${!total || _invBusy ? 'disabled' : ''}>
          ${_invBusy ? 'Saving…' : total ? `Record ${total} box${total === 1 ? '' : 'es'}` : 'Record'}
        </button>
        ${total && !_invStaff ? `<div class="inv-note" style="margin:8px 0 0">Choose your name above first.</div>` : ''}
      </div>
    </div>`;
}

function invAdd(sku) {
  const item = (_inv.items || []).find(i => i.sku === sku);
  if (!item) return;
  const key = `${_invMode}:${sku}`;
  if (!_invCart[key]) _invCart[key] = { sku, name: item.name, qty: 0, action: _invMode };
  if (_invCart[key].qty < 20) _invCart[key].qty += 1;
  _invFlash = null;
  renderInventory();
}

function invStep(key, delta) {
  const c = _invCart[key];
  if (!c) return;
  c.qty += delta;
  if (c.qty <= 0) delete _invCart[key];
  else if (c.qty > 20) c.qty = 20;
  renderInventory();
}

async function invCheckout() {
  if (_invBusy) return;
  const lines = Object.values(_invCart);
  if (!lines.length) return;
  if (!_invStaff) { _invFlash = { type: 'warn', text: 'Choose your name at the top first.' }; renderInventory(); return; }
  const summary = lines.map(c => `${c.action === 'return' ? 'Return' : 'Open'} ${c.qty} × ${invDisplayName(c.name)}`).join('\n');
  if (!confirm(`Record this for ${invStudioName(_inv.studioId)}?\n\n${summary}`)) return;

  _invBusy = true; renderInventory();
  try {
    await invCall('buy', {
      staffName: _invStaff,
      items: lines.map(c => ({ sku: c.sku, qty: c.qty, action: c.action }))
    });
    const n = lines.reduce((s, c) => s + c.qty, 0);
    _invCart = {};
    _invMode = 'open';
    _invFlash = { type: 'ok', text: `✅ Recorded ${n} box${n === 1 ? '' : 'es'}. Thanks, ${_invStaff}!` };
  } catch (e) {
    _invFlash = { type: 'err', text: e.message };
  }
  _invBusy = false;
  renderInventory();
}

// Counts: names only. The server answers 'done' or 'recount', never a number.
function renderInvCounts() {
  if (!_inv.canCount) {
    const n = _inv.dueCountTotal || 0;
    return `<div class="card">
      <p class="inv-note">${n
        ? `<strong>${n} count${n === 1 ? ' is' : 's are'} due.</strong> Counts are done by a coordinator or manager.`
        : 'No counts due right now. Counts are done by a coordinator or manager.'}</p>
      <button class="inv-btn go" onclick="openPinModal()">🔓 Unlock with coordinator PIN</button>
    </div>`;
  }
  const due = _inv.dueCounts || [];
  if (!due.length) {
    return `<div class="card"><div class="inv-empty">🎉 No counts due right now. When one is due, a red bubble shows on 📦 Supplies.</div></div>`;
  }
  return `<div class="card">
    <p class="inv-note">Count <strong>sealed, unopened boxes only</strong>: check the shelf and the back room.
      Don't include a box that's already open.</p>
    ${due.map(c => `
      <div class="inv-count-row">
        <span class="inv-swatch" style="background:${invSwatch(c.name)}"></span>
        <span class="nm">${esc(invDisplayName(c.name))}
          ${c.recount ? `<span class="inv-recount">🔁 Please count this one again carefully.</span>` : ''}</span>
        <input type="number" inputmode="numeric" min="0" step="1" placeholder="Boxes" id="inv-count-${escAttr(c.id)}"
               onkeydown="if(event.key==='Enter') invSubmitCount('${escAttr(c.id)}')" />
        <button class="inv-btn go" onclick="invSubmitCount('${escAttr(c.id)}')" ${_invBusy ? 'disabled' : ''}>Submit</button>
      </div>`).join('')}
  </div>`;
}

async function invSubmitCount(countId) {
  if (_invBusy) return;
  if (!_invStaff) { _invFlash = { type: 'warn', text: 'Choose your name at the top first.' }; renderInventory(); return; }
  const input = document.getElementById(`inv-count-${countId}`);
  const raw = input ? input.value.trim() : '';
  const qty = Number(raw);
  if (raw === '' || !Number.isInteger(qty) || qty < 0) {
    _invFlash = { type: 'warn', text: 'Enter the number of sealed boxes (0 or more).' };
    renderInventory();
    return;
  }
  const item = (_inv.dueCounts || []).find(c => c.id === countId);
  const name = item ? invDisplayName(item.name) : 'that item';

  _invBusy = true;
  try {
    const r = await invCall('count', { countId, qty, staffName: _invStaff });
    _invFlash = r.result === 'recount'
      ? { type: 'warn', text: `🔁 Please recount ${name}. Check the shelf and the back room, then enter it again.` }
      : { type: 'ok', text: `✅ ${name} count saved. Thanks!` };
  } catch (e) {
    _invFlash = { type: 'err', text: e.message };
  }
  _invBusy = false;
  await loadInventory();
}

// Transfers: emergency boxes from another studio.
function renderInvTransfers() {
  const t = _inv.transfers || [];
  const items = _inv.items || [];
  const other = id => esc(invStudioName(id));
  const what = x => `${x.qty} × ${esc(invDisplayName(x.name))}`;

  const needsUs = t.filter(x => (x.direction === 'outgoing' && x.status === 'requested') ||
                                (x.direction === 'incoming' && x.status === 'sent'));
  const waiting = t.filter(x => !needsUs.includes(x));

  const needsUsHtml = needsUs.length ? needsUs.map(x => x.direction === 'outgoing'
    ? `<div class="inv-xfer"><span class="txt"><strong>${other(x.otherStudioId)}</strong> is asking for ${what(x)}
         <span class="when">Requested ${invShortDate(x.requestedAt)}${x.requestedBy ? ` by ${esc(x.requestedBy)}` : ''}</span></span>
         <button class="inv-btn go" onclick="invTransfer('${escAttr(x.id)}', 'send')">Send</button>
         <button class="inv-btn warn" onclick="invTransfer('${escAttr(x.id)}', 'decline')">Can't spare it</button></div>`
    : `<div class="inv-xfer"><span class="txt"><strong>${other(x.otherStudioId)}</strong> sent you ${what(x)}
         <span class="when">Sent ${invShortDate(x.respondedAt)}${x.respondedBy ? ` by ${esc(x.respondedBy)}` : ''}</span></span>
         <button class="inv-btn go" onclick="invTransfer('${escAttr(x.id)}', 'receive')">It arrived</button></div>`
  ).join('') : `<div class="inv-empty">Nothing waiting on you.</div>`;

  const waitingHtml = waiting.length ? waiting.map(x => x.direction === 'incoming'
    ? `<div class="inv-xfer"><span class="txt">You asked <strong>${other(x.otherStudioId)}</strong> for ${what(x)}
         <span class="when">Requested ${invShortDate(x.requestedAt)} · waiting for them to send</span></span>
         <button class="inv-btn warn" onclick="invTransfer('${escAttr(x.id)}', 'cancel')">Cancel</button></div>`
    : `<div class="inv-xfer"><span class="txt">You sent <strong>${other(x.otherStudioId)}</strong> ${what(x)}
         <span class="when">Sent ${invShortDate(x.respondedAt)} · waiting for them to confirm it arrived</span></span></div>`
  ).join('') : `<div class="inv-empty">Nothing in progress.</div>`;

  const studioOpts = (_inv.studios || [])
    .map(id => ({ id, name: invStudioName(id) }))
    .sort((a, b) => a.name.localeCompare(b.name))
    .map(s => `<option value="${escAttr(s.id)}">${esc(s.name)}</option>`).join('');
  const itemOpts = items.map(i => `<option value="${escAttr(i.sku)}">${esc(invDisplayName(i.name))}${i.group === 'Ditto' ? ' (Ditto)' : ''}</option>`).join('');

  return `
    <div class="section-head first">Waiting on you</div>
    <div class="card">${needsUsHtml}</div>

    <div class="section-head">In progress</div>
    <div class="card">${waitingHtml}</div>

    <div class="section-head">Need boxes urgently?</div>
    <div class="card">
      <p class="inv-note">For emergencies only: ask a nearby studio to send you sealed boxes.
        Their stock goes down when they send, and yours goes up when you confirm it arrived.</p>
      <div class="inv-form">
        <select id="inv-x-studio"><option value="">From which studio?</option>${studioOpts}</select>
        <select id="inv-x-sku"><option value="">Which item?</option>${itemOpts}</select>
        <input type="number" id="inv-x-qty" inputmode="numeric" min="1" max="20" step="1" value="1" />
        <button class="inv-btn go" onclick="invRequestTransfer()" ${_invBusy ? 'disabled' : ''}>Request</button>
      </div>
    </div>`;
}

async function invRequestTransfer() {
  if (_invBusy) return;
  if (!_invStaff) { _invFlash = { type: 'warn', text: 'Choose your name at the top first.' }; renderInventory(); return; }
  const fromStudioId = document.getElementById('inv-x-studio').value;
  const sku = document.getElementById('inv-x-sku').value;
  const qty = Number(document.getElementById('inv-x-qty').value);
  if (!fromStudioId || !sku || !Number.isInteger(qty) || qty < 1 || qty > 20) {
    _invFlash = { type: 'warn', text: 'Pick a studio, an item, and a number of boxes (1–20).' };
    renderInventory();
    return;
  }
  const item = (_inv.items || []).find(i => i.sku === sku);
  if (!confirm(`Ask ${invStudioName(fromStudioId)} for ${qty} × ${invDisplayName(item ? item.name : sku)}?`)) return;

  _invBusy = true;
  try {
    await invCall('transfer_request', { fromStudioId, sku, qty, staffName: _invStaff });
    _invFlash = { type: 'ok', text: `✅ Request sent to ${invStudioName(fromStudioId)}. It'll show here when they send it.` };
  } catch (e) {
    _invFlash = { type: 'err', text: e.message };
  }
  _invBusy = false;
  await loadInventory();
}

async function invTransfer(transferId, transferAction) {
  if (_invBusy) return;
  if (!_invStaff) { _invFlash = { type: 'warn', text: 'Choose your name at the top first.' }; renderInventory(); return; }
  const x = (_inv.transfers || []).find(t => t.id === transferId);
  const desc = x ? `${x.qty} × ${invDisplayName(x.name)}` : 'this transfer';
  const other = x ? invStudioName(x.otherStudioId) : 'the other studio';
  const prompts = {
    send: `Send ${desc} to ${other}? Only confirm once the boxes are on their way.`,
    decline: `Tell ${other} you can't spare ${desc}?`,
    cancel: `Cancel your request for ${desc}?`,
    receive: `Confirm ${desc} arrived from ${other}?`
  };
  if (!confirm(prompts[transferAction])) return;

  _invBusy = true;
  try {
    await invCall('transfer_update', { transferId, transferAction, staffName: _invStaff });
    const done = { send: 'Marked as sent.', decline: 'Request declined.', cancel: 'Request cancelled.', receive: 'Marked as received. Thanks!' };
    _invFlash = { type: 'ok', text: `✅ ${done[transferAction]}` };
  } catch (e) {
    _invFlash = { type: 'err', text: e.message };
  }
  _invBusy = false;
  await loadInventory();
}

if (INVENTORY_LIVE) {
  const navInv = document.getElementById('nav-inventory');
  if (navInv) navInv.classList.remove('dev-only');
}
