<!DOCTYPE html>
<!-- curriculum-present.html: 4Cats class curriculum, present mode (the kids gather round; the teacher taps through). iPad-safe (ES5). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>4Cats Class</title>
<link rel="icon" href="https://cdn.shopify.com/s/files/1/1451/3756/files/favicon_black_512x512_9c6dd2c0-fdcd-4575-887e-bf65538803af.png?v=1631720337">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: #111; color: #1a1a1a; -webkit-text-size-adjust: 100%; }
button { font: inherit; cursor: pointer; }
#top { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center;
  padding: 8px 12px; padding-top: calc(8px + env(safe-area-inset-top, 0px)); background: rgba(17,17,17,.92); color: #fff; font-size: 14px; }
#top .t { -webkit-flex: 1; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
#top .t b { font-size: 15px; }
#top button { background: rgba(255,255,255,.14); color: #fff; border: 0; border-radius: 999px; padding: 7px 14px; margin-left: 6px; font-size: 13px; }
#top button.on { background: #ffd166; color: #111; }
#stage { position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-top: 52px; padding-bottom: 86px; }
.blk { padding: 6vh 6vw; background-size: cover; background-position: center; position: relative; }
.blk.hasbg { min-height: 60vh; }
.blk.hasbg .inner { background: rgba(255,255,255,.86); border-radius: 18px; padding: 18px 22px; display: inline-block; max-width: 100%; }
.inner { max-width: 1100px; margin: 0 auto; }
.blk h1 { font-size: 46px; line-height: 1.08; margin: 0 0 16px; text-align: center; }
.blk h2 { font-size: 34px; line-height: 1.15; margin: 0 0 14px; text-align: center; }
.blk h3 { font-size: 28px; line-height: 1.3; margin: 0 0 14px; text-align: center; font-weight: 600; white-space: pre-line; }
.blk p { font-size: 24px; line-height: 1.45; margin: 0 auto 14px; max-width: 900px; white-space: pre-line; }
.blk img.pic { display: block; max-width: 100%; max-height: 70vh; margin: 0 auto 18px; border-radius: 16px; }
.gal { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; -webkit-justify-content: center; justify-content: center; margin: 0 -6px 14px; }
.gal figure { margin: 6px; width: 30%; min-width: 180px; }
.gal img { width: 100%; height: 26vh; object-fit: cover; border-radius: 12px; display: block; }
.gal figcaption { text-align: center; font-size: 18px; margin-top: 6px; }
.vid { position: relative; width: 100%; max-width: 900px; margin: 0 auto 18px; padding-top: 56.25%; }
.vid iframe, .vid video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; border-radius: 14px; background: #000; }
.vlink { display: block; margin: 0 auto 18px; background: #111; color: #fff; border: 0; border-radius: 14px; padding: 18px 26px; font-size: 22px; }
.qa { max-width: 900px; margin: 0 auto 10px; }
.qa button { display: block; width: 100%; text-align: left; background: #fff; border: 3px solid #1a1a1a; border-radius: 16px; padding: 14px 18px; font-size: 24px; font-weight: 700; }
.qa .ans { display: none; background: #fff7d6; border-radius: 0 0 16px 16px; margin: -8px 6px 0; padding: 18px 18px 14px; font-size: 24px; white-space: pre-line; }
.qa.open .ans { display: block; }
.qa.open button { background: #ffd166; }
.qz { text-align: center; font-size: 40px; font-weight: 900; margin: 0 0 14px; }
.facts { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; -webkit-justify-content: center; justify-content: center; margin: 0 -6px 14px; }
.facts div { margin: 6px; background: #fff; border-radius: 14px; padding: 12px 16px; width: 30%; min-width: 200px; text-align: center; }
.facts small { display: block; color: #666; font-size: 14px; text-transform: uppercase; letter-spacing: .05em; }
.facts b { display: block; font-size: 22px; margin-top: 4px; }
.slot { border: 3px dashed rgba(0,0,0,.25); border-radius: 14px; padding: 20px; text-align: center; color: rgba(0,0,0,.55); font-size: 16px; margin: 0 auto 14px; max-width: 700px; }
.todo { outline: 3px solid #f59e0b; outline-offset: 4px; border-radius: 6px; }
.tnote { display: none; background: #fff3cd; color: #6b4b00; border-radius: 10px; padding: 8px 12px; font-size: 15px; margin: 0 auto 12px; max-width: 900px; }
body.teacher .tnote { display: block; }
body:not(.teacher) .slot, body:not(.teacher) .tonly { display: none; }
#nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center;
  padding: 10px 12px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); background: rgba(17,17,17,.92); color: #fff; }
#nav button { background: #ffd166; color: #111; border: 0; border-radius: 999px; padding: 14px 26px; font-size: 20px; font-weight: 800; }
#nav button[disabled] { opacity: .3; }
#nav .mid { -webkit-flex: 1; flex: 1; text-align: center; font-size: 15px; }
#nav .dots i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.3); margin: 0 3px; }
#nav .dots i.on { background: #ffd166; }
#pick { background: #fbf6ec; min-height: 100%; padding: 70px 6vw 40px; }
#pick h1 { margin: 0 0 6px; font-size: 32px; }
#pick .card { display: block; width: 100%; text-align: left; background: #fff; border: 1px solid #e8dfcd; border-radius: 16px; padding: 16px 18px; margin: 0 0 10px; font-size: 20px; }
#pick .card small { display: block; color: #666; font-size: 14px; margin-top: 2px; }
#pick .weeks button { display: inline-block; margin: 0 8px 8px 0; background: #fff; border: 2px solid #1a1a1a; border-radius: 14px; padding: 12px 18px; font-size: 18px; }
#msg { padding: 80px 24px; color: #fff; text-align: center; font-size: 18px; }
@media (max-width: 700px) { .blk h1 { font-size: 34px; } .blk h2 { font-size: 26px; } .blk h3 { font-size: 22px; } .blk p, .qa button, .qa .ans { font-size: 19px; } .gal figure { width: 45%; min-width: 0; } }
</style>
</head>
<body>
<div id="top"><span class="t" id="title"><b>4Cats</b></span><button id="tbtn" title="Teacher view: notes, empty picture slots and what still needs checking">👩‍🏫 Teacher</button><button id="lbtn">☰ Classes</button></div>
<div id="stage"><div id="msg">Loading…</div></div>
<div id="nav" style="display:none"><button id="prev">‹ Back</button><span class="mid"><span id="ptitle"></span><br><span class="dots" id="dots"></span></span><button id="next">Next ›</button></div>
<script>
var SUPABASE_URL = 'https://snxibhbhhchjthfmjtaj.supabase.co';
var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNueGliaGJoaGNoanRoZm1qdGFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTk2ODAsImV4cCI6MjA5MjYzNTY4MH0.K-89Mx4SxU6N1hMmtK6Q79rWAtk6VTN9b5wemQxcZVA';
var TONES = { darkest1: ['#1f2a44', '#fff'], darkest2: ['#2b2f5c', '#fff'], light1: ['#e8eef9', '#1a1a1a'], light2: ['#f3e9f7', '#1a1a1a'],
  lightest1: ['#fffdf7', '#1a1a1a'], bright1: ['#ffd166', '#1a1a1a'], bright2: ['#ef476f', '#fff'] };
var FACT_LABELS = { landscape: 'Landscape', pastime: 'Sport or pastime', traditional_art: 'Traditional art', speech: 'They say…', landscape2: 'Landscape',
  passport: 'Passport', sweet: 'Sweet treat', clothing: 'Traditional clothing', savoury: 'Savoury treat', compare: 'Other artists', transport: 'Getting around' };
var S = { cls: null, lesson: null, bank: {}, pages: [], i: 0 };

function $(id) { return document.getElementById(id); }
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function q(name) { var m = new RegExp('[?&]' + name + '=([^&#]*)').exec(location.search); return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : ''; }
// signed in (an editor, from the same site's sign-in): drafts too; otherwise Active classes only
function token() { try { var t = JSON.parse(localStorage.getItem('sb-snxibhbhhchjthfmjtaj-auth-token') || 'null'); return t && t.access_token && (!t.expires_at || t.expires_at * 1000 > Date.now()) ? t.access_token : null; } catch (e) { return null; } }
function get(path, cb) {
  var x = new XMLHttpRequest(), tk = token();
  x.open('GET', SUPABASE_URL + '/rest/v1/' + path, true);
  x.setRequestHeader('apikey', ANON); x.setRequestHeader('Authorization', 'Bearer ' + (tk || ANON));
  x.onload = function () { var d = null; try { d = JSON.parse(x.responseText); } catch (e) {} cb(x.status >= 200 && x.status < 300 ? d : null, x.status); };
  x.onerror = function () { cb(null, 0); }; x.send();
}
// {{artist}} and the rest, from the class's artist profile
function fill(t) {
  var p = (S.cls && S.cls.profile) || {};
  return String(t == null ? '' : t).replace(/\{\{\s*([a-z_0-9]+)\s*\}\}/g, function (m, k) { return p[k] != null && p[k] !== '' ? p[k] : m; });
}
function ytId(u) { var m = String(u || '').match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/); return m ? m[1] : null; }

function showMsg(t) { $('stage').innerHTML = '<div id="msg">' + t + '</div>'; $('nav').style.display = 'none'; }

// ---- choose a class and week (no link given) ----
function pickClass() {
  $('title').innerHTML = '<b>4Cats classes</b>'; $('nav').style.display = 'none';
  get('curr_classes?select=id,name,weeks,status,is_template&is_template=eq.false&order=name', function (d) {
    if (!d) { showMsg('Classes didn’t load. Check the internet and try again.'); return; }
    var list = d.filter(function (c) { return c.status === 'active' || token(); });
    if (!list.length) { showMsg('No classes ready yet.'); return; }
    var h = '<div id="pick"><h1>Choose a class</h1>';
    list.forEach(function (c) { h += '<button class="card" data-c="' + esc(c.id) + '">' + esc(c.name) + '<small>' + c.weeks + ' classes' + (c.status !== 'active' ? ' · ' + esc(c.status) : '') + '</small></button>'; });
    $('stage').innerHTML = h + '</div>';
    var b = $('stage').querySelectorAll('[data-c]');
    for (var i = 0; i < b.length; i++) b[i].onclick = function () { pickWeek(this.getAttribute('data-c')); };
  });
}
function pickWeek(cid) {
  get('curr_classes?select=id,name,weeks&id=eq.' + cid, function (d) {
    var c = d && d[0]; if (!c) { showMsg('That class isn’t available.'); return; }
    var h = '<div id="pick"><h1>' + esc(c.name) + '</h1><p>Which class is today?</p><div class="weeks">';
    for (var n = 1; n <= c.weeks; n++) h += '<button data-w="' + n + '">Class ' + n + ' of ' + c.weeks + '</button>';
    $('stage').innerHTML = h + '</div></div>';
    var b = $('stage').querySelectorAll('[data-w]');
    for (var i = 0; i < b.length; i++) b[i].onclick = function () { location.search = '?class=' + cid + '&week=' + this.getAttribute('data-w'); };
  });
}

// ---- load a lesson ----
function load(cid, week, start) {
  get('curr_classes?select=*&id=eq.' + cid, function (d) {
    var c = d && d[0]; if (!c) { showMsg('This class isn’t available' + (token() ? '' : ' (it may not be Active yet)') + '.'); return; }
    S.cls = c;
    get('curr_lessons?select=*&class_id=eq.' + cid + '&week_no=eq.' + week, function (l) {
      var les = l && l[0]; if (!les) { showMsg('Class ' + week + ' isn’t written yet.'); return; }
      S.lesson = les;
      get('curr_bank?select=*', function (bk) {
        S.bank = {}; (bk || []).forEach(function (b) { S.bank[b.id] = b; });
        S.pages = resolve(les.pages || [], week, c);
        S.i = Math.max(0, Math.min(S.pages.length - 1, (+start || 1) - 1));
        draw();
      });
    });
  });
}
// a block from the bank (a linked block) becomes the bank's block
function blocksOf(list) {
  var out = [];
  (list || []).forEach(function (b) {
    if (b && b.bank_block) { var bb = S.bank[b.bank_block]; if (bb && bb.blocks) bb.blocks.forEach(function (x) { out.push(x); }); }
    else if (b) out.push(b);
  });
  return out;
}
// pages as shown: the welcome becomes the full or short one (or none), bank pages their shared content
function resolve(pages, week, c) {
  var out = resolveRaw(pages, week, c);
  out.forEach(function (p) { p.blocks = blocksOf(p.blocks); });
  return out;
}
function resolveRaw(pages, week, c) {
  var out = [];
  pages.forEach(function (p) {
    if (p.kind === 'welcome') {
      if (c.skip_welcome_from && week >= c.skip_welcome_from) return;
      var kind = week >= (c.short_welcome_from || 2) ? 'welcome_short' : 'welcome_full', b = null;
      for (var k in S.bank) if (S.bank[k].kind === kind) { b = S.bank[k]; break; }
      if (b) out.push({ title: b.title.replace(/\s*\(.*\)$/, ''), blocks: b.blocks || [], note: b.notes });
      return;
    }
    if (p.kind === 'bank') { var bb = S.bank[p.bank_id]; if (bb) out.push({ title: bb.title, blocks: bb.blocks || [], note: p.note, bank: true }); return; }
    out.push({ title: p.title, blocks: p.blocks || [], note: p.note });
  });
  return out;
}
function earlierQa(upto) {
  var seen = {}, list = [];
  for (var i = 0; i < upto; i++) (S.pages[i].blocks || []).forEach(function (b) { (b.items || []).forEach(function (it) {
    if (it.t !== 'qa') return; var k = fill(it.text).toLowerCase().replace(/\W+/g, ''); if (seen[k]) return; seen[k] = 1; list.push(it); }); });
  return list;
}
function qaHtml(it) {
  return '<div class="qa' + (it.todo ? ' todo' : '') + '"><button>' + esc(fill(it.text)) + '</button><div class="ans">' + esc(fill(it.answer || '…')) + '</div></div>';
}
function itemHtml(it) {
  var t = it.t, todo = it.todo ? ' todo' : '', h = '';
  if (it.todo) h += '<div class="tnote">⚠ Still to check or rewrite</div>';
  if (t === 'h1' || t === 'h2' || t === 'h3') return h + '<' + t + ' class="' + todo + '">' + esc(fill(it.text)) + '</' + t + '>';
  if (t === 'p') return h + '<p class="' + todo + '">' + esc(fill(it.text)) + '</p>';
  if (t === 'img') { if (it.bg) return ''; return it.url ? '<img class="pic" src="' + esc(it.url) + '" alt="">' : '<div class="slot">🖼️ Picture still needed: ' + esc(fill(it.hint || '')) + '</div>'; }
  if (t === 'gallery') {
    return '<div class="gal">' + (it.slots || []).map(function (s) {
      return s.url ? '<figure><img src="' + esc(s.url) + '" alt="">' + (s.caption ? '<figcaption>' + esc(fill(s.caption)) + '</figcaption>' : '') + '</figure>'
        : '<figure class="tonly"><div class="slot">🖼️ ' + esc(fill(s.hint || 'Picture')) + '</div></figure>';
    }).join('') + '</div>';
  }
  if (t === 'video') {
    var y = ytId(it.url);
    if (y) return '<div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/' + y + '?rel=0&playsinline=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe></div>';
    if (/\.(mp4|webm|mov)(\?|$)/i.test(it.url || '')) return '<div class="vid"><video src="' + esc(it.url) + '" controls playsinline preload="metadata"></video></div>';
    if (it.url) return '<button class="vlink" data-open="' + esc(it.url) + '">▶ ' + esc(fill(it.hint || 'Play the video')) + '</button>';
    return '<div class="slot">🎬 Video still needed: ' + esc(fill(it.hint || '')) + '</div>';
  }
  if (t === 'qa') return qaHtml(it);
  if (t === 'quiz') { var e = earlierQa(S.i); return '<div class="qz">⭐ POP QUIZ! ⭐</div>' + e.map(qaHtml).join(''); }
  if (t === 'facts') {
    var f = ((S.cls && S.cls.profile) || {}).facts || {}, keys = Object.keys(FACT_LABELS).filter(function (k) { return f[k]; });
    if (!keys.length) return '<div class="slot">🌍 Add the country facts in the class’s Artist profile</div>';
    return '<div class="facts">' + keys.map(function (k) { return '<div><small>' + esc(FACT_LABELS[k]) + '</small><b>' + esc(fill(f[k])) + '</b></div>'; }).join('') + '</div>';
  }
  return '';
}
function draw() {
  var p = S.pages[S.i]; if (!p) { showMsg('This class has no pages yet.'); return; }
  var c = S.cls, wk = S.lesson.week_no;
  $('title').innerHTML = '<b>' + esc(c.name) + '</b> · Class ' + wk + ' of ' + c.weeks + (c.status !== 'active' ? ' · ' + esc(c.status) : '');
  var pal = c.palette || {}, h = '';
  if (p.note) h += '<div class="blk"><div class="inner"><div class="tnote">📝 ' + esc(p.note) + '</div></div></div>';
  (p.blocks || []).forEach(function (b) {
    var tone = TONES[b.tone] || ['#fffdf7', '#1a1a1a'], bgc = pal[b.tone] || tone[0], bgImg = null;
    (b.items || []).forEach(function (it) { if (it.t === 'img' && it.bg && it.url) bgImg = it.url; });
    h += '<div class="blk' + (bgImg ? ' hasbg' : '') + '" style="background-color:' + esc(bgc) + ';color:' + tone[1] + (bgImg ? ';background-image:url(\'' + esc(bgImg).replace(/'/g, '') + '\')' : '') + '"><div class="inner">' +
      (b.items || []).map(itemHtml).join('') + '</div></div>';
  });
  if (S.i === 0 && S.lesson.notes) h = '<div class="blk"><div class="inner"><div class="tnote">📝 Teacher notes: ' + esc(S.lesson.notes) + '</div></div></div>' + h;
  $('stage').innerHTML = h; $('stage').scrollTop = 0;
  $('nav').style.display = '';
  $('ptitle').textContent = fill(p.title || '') + ' (' + (S.i + 1) + ' of ' + S.pages.length + ')';
  var dots = ''; for (var i = 0; i < S.pages.length; i++) dots += '<i class="' + (i === S.i ? 'on' : '') + '"></i>';
  $('dots').innerHTML = dots;
  $('prev').disabled = S.i === 0; $('next').disabled = S.i >= S.pages.length - 1;
  var qa = $('stage').querySelectorAll('.qa button');
  for (var j = 0; j < qa.length; j++) qa[j].onclick = function () { var el = this.parentNode; el.className = /open/.test(el.className) ? el.className.replace(' open', '') : el.className + ' open'; };
  var vl = $('stage').querySelectorAll('[data-open]');
  for (var k = 0; k < vl.length; k++) vl[k].onclick = function () { window.open(this.getAttribute('data-open'), '_blank'); };
  try { history.replaceState(null, '', '?class=' + c.id + '&week=' + wk + '&page=' + (S.i + 1)); } catch (e) {}
}
function go(d) { var n = S.i + d; if (n < 0 || n >= S.pages.length) return; S.i = n; draw(); }
$('prev').onclick = function () { go(-1); };
$('next').onclick = function () { go(1); };
document.onkeydown = function (e) { if (!S.pages.length) return; if (e.keyCode === 39 || e.keyCode === 34) go(1); if (e.keyCode === 37 || e.keyCode === 33) go(-1); };
// swipe left/right (when not scrolling)
(function () { var x0 = null, y0 = null; var st = $('stage');
  st.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, false);
  st.addEventListener('touchend', function (e) { if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy) * 2) go(dx < 0 ? 1 : -1); }, false); })();
$('tbtn').onclick = function () { var on = !/teacher/.test(document.body.className); document.body.className = on ? 'teacher' : ''; this.className = on ? 'on' : ''; try { localStorage.setItem('curr_teacher', on ? '1' : ''); } catch (e) {} };
$('lbtn').onclick = function () { location.search = ''; };
try { if (localStorage.getItem('curr_teacher')) { document.body.className = 'teacher'; $('tbtn').className = 'on'; } } catch (e) {}
if (q('class') && q('week')) load(q('class'), +q('week'), q('page')); else if (q('class')) pickWeek(q('class')); else pickClass();
</script>
</body>
</html>
