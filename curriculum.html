<!DOCTYPE html>
<!-- curriculum.html: 4Cats kids class curriculum planner (library, class folders, lessons, the shared bank, one-pagers). Home office. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4Cats Curriculum</title>
<link rel="icon" href="https://cdn.shopify.com/s/files/1/1451/3756/files/favicon_black_512x512_9c6dd2c0-fdcd-4575-887e-bf65538803af.png?v=1631720337">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"></script>
<style>
:root { --bg: #f5f5f0; --panel: #fff; --ink: #1a1a1a; --muted: #777; --line: #e0e0d8; --soft: #fafaf8; --accent: #c8232c; --ok: #2e7d32; --warn: #b45309; }
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); font-size: 14px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.btn { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; }
.btn:hover { border-color: #b8b8ae; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.small { padding: 3px 8px; font-size: 12.5px; }
.btn[disabled] { opacity: .45; cursor: default; }
input[type=text], input[type=number], input[type=email], select, textarea { border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; background: #fff; width: 100%; }
textarea { min-height: 60px; resize: vertical; }
label.f { display: block; font-size: 12.5px; color: var(--muted); margin: 0 0 10px; }
label.f > input, label.f > select, label.f > textarea { margin-top: 3px; color: var(--ink); }
.muted { color: var(--muted); }
#login { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
#login .card { width: 360px; }
#app { display: none; }
.top { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: #1a1a1a; color: #fff; position: sticky; top: 0; z-index: 10; }
.top b { font-size: 16px; letter-spacing: .03em; }
.top .tab { background: none; border: 0; color: #bbb; padding: 6px 10px; border-radius: 6px; }
.top .tab.on { color: #fff; background: rgba(255,255,255,.12); }
.top .sp { flex: 1; }
.wrap { display: grid; grid-template-columns: 290px 1fr; gap: 14px; padding: 14px; align-items: start; }
.lib .chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
.chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; }
.chip.on { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
.cl { display: block; width: 100%; text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; margin: 0 0 6px; }
.cl.on { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(200,35,44,.12); }
.cl small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.st { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 8px; vertical-align: 1px; }
.st.draft { background: #fff3e0; color: var(--warn); } .st.review { background: #e6f0fb; color: #1f4e8a; } .st.active { background: #e8f5e9; color: var(--ok); } .st.retired { background: #eee; color: #666; } .st.tpl { background: #f3e8fb; color: #6b3a8f; }
.ftabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin: 0 0 12px; }
.ftabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 12px; color: var(--muted); }
.ftabs button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 14px; }
.wks { display: flex; gap: 4px; flex-wrap: wrap; margin: 0 0 10px; }
.wks button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 12px; }
.wks button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.pg { border: 1px solid var(--line); border-radius: 10px; background: #fff; margin: 0 0 8px; }
.pg > .h { display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer; }
.pg > .h .t { flex: 1; font-weight: 600; }
.pg > .h .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.pg.open > .h { border-bottom: 1px solid var(--line); background: var(--soft); border-radius: 10px 10px 0 0; }
.pg .b { padding: 10px; }
.tag { font-size: 11px; border-radius: 999px; padding: 1px 7px; background: #eef; color: #335; }
.tag.bank { background: #e8f5e9; color: var(--ok); } .tag.todo { background: #fff3e0; color: var(--warn); } .tag.wel { background: #e6f0fb; color: #1f4e8a; }
.blkE { border: 1px dashed #cfcfc5; border-radius: 10px; padding: 8px; margin: 0 0 8px; }
.blkE .bh { display: flex; gap: 6px; align-items: center; margin: 0 0 6px; }
.it { display: grid; grid-template-columns: 92px 1fr auto; gap: 8px; align-items: start; padding: 6px 0; border-top: 1px solid #f0f0ea; }
.it:first-of-type { border-top: 0; }
.it .lab { font-size: 12px; color: var(--muted); padding-top: 6px; }
.it .acts { display: flex; gap: 2px; }
.it .acts button { border: 0; background: none; padding: 2px 5px; color: #999; }
.it .acts button:hover { color: var(--ink); }
.it.todo { background: #fffaf0; }
.slots { display: flex; flex-wrap: wrap; gap: 8px; }
.slotE { width: 150px; border: 1px solid var(--line); border-radius: 8px; padding: 6px; font-size: 12px; }
.slotE img, .thumb { width: 100%; height: 90px; object-fit: cover; border-radius: 6px; display: block; background: #eee; }
.thumb.ph { display: flex; align-items: center; justify-content: center; color: #999; font-size: 11px; text-align: center; padding: 4px; }
.addbar { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.tone { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; border: 1px solid rgba(0,0,0,.15); }
.save { font-size: 12.5px; color: var(--muted); }
.op { max-width: 820px; }
.op h2 { margin: 0 0 4px; } .op h3 { margin: 16px 0 6px; }
.op .wk { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 0 0 6px; display: flex; gap: 10px; align-items: center; }
.op .wk img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; }
.todoL li { margin: 0 0 4px; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 50; }
.modal .card { width: min(520px, 94vw); max-height: 90vh; overflow: auto; }
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #fff; padding: 9px 16px; border-radius: 10px; display: none; z-index: 60; }
@media print { .top, .lib, .ftabs, .noprint { display: none !important; } .wrap { display: block; padding: 0; } body { background: #fff; } .card { border: 0; } }
@media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="login"><div class="card">
  <h2 style="margin:0 0 4px">4Cats Curriculum</h2><p class="muted" style="margin:0 0 14px">Sign in with your home office account</p>
  <label class="f">Email<input type="email" id="em" autocomplete="username"></label>
  <label class="f">Password<input type="password" id="pw" autocomplete="current-password" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 9px"></label>
  <button class="btn primary" id="go">Sign in</button> <span class="muted" id="lerr"></span>
</div></div>

<div id="app">
  <div class="top"><b>4CATS</b> <span class="muted" style="color:#bbb">Curriculum</span>
    <button class="tab on" data-v="lib">📚 Classes</button><button class="tab" data-v="bank">🏦 Shared bank</button><button class="tab" data-v="ed">👥 Editors</button>
    <span class="sp"></span><a class="btn small" href="curriculum-present.html" target="_blank" style="text-decoration:none;color:#1a1a1a">▶ Present mode</a>
    <span id="who" class="muted" style="color:#bbb;font-size:12.5px"></span></div>
  <div class="wrap" id="main"></div>
</div>
<div id="toast"></div>

<script>
const SUPABASE_URL = 'https://snxibhbhhchjthfmjtaj.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNueGliaGJoaGNoanRoZm1qdGFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTk2ODAsImV4cCI6MjA5MjYzNTY4MH0.K-89Mx4SxU6N1hMmtK6Q79rWAtk6VTN9b5wemQxcZVA'
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

const STATUS = [['draft', 'Draft'], ['review', 'In review'], ['active', 'Active'], ['retired', 'Not active']]
const STRUCT = [['artist', 'Artist Focus (Exploratory)'], ['project', 'Project-based'], ['custom', 'Other']]
const PTYPES = [['hook', 'Hook ("Do you like…")'], ['intro', 'Project intro'], ['place', 'Place (getting there)'], ['language', 'Language'], ['technique', 'Technique'],
  ['prep', 'Prep'], ['steps', 'Project steps'], ['culture', 'Culture / story'], ['quiz', 'Quiz'], ['show', 'Show & tell'], ['other', 'Other']]
const TONES = { darkest1: '#1f2a44', darkest2: '#2b2f5c', light1: '#e8eef9', light2: '#f3e9f7', lightest1: '#fffdf7', bright1: '#ffd166', bright2: '#ef476f' }
const TONE_NAMES = { '': 'Plain', darkest1: 'Darkest 1', darkest2: 'Darkest 2', light1: 'Light 1', light2: 'Light 2', lightest1: 'Lightest', bright1: 'Bright 1', bright2: 'Bright 2' }
const ITEMS = [['h1', 'Heading'], ['h2', 'Heading 2'], ['h3', 'Big text'], ['p', 'Paragraph'], ['img', 'Picture'], ['gallery', 'Gallery'], ['video', 'Video'],
  ['qa', 'Question (tap for answer)'], ['quiz', 'Pop quiz (earlier questions)'], ['facts', 'Country facts']]
const FACTS = [['landscape', 'A · Landscape feature'], ['pastime', 'B · Sport or pastime'], ['traditional_art', 'C · Traditional art'], ['speech', 'D · Artist speech bubble'],
  ['landscape2', 'E · Another landscape feature'], ['passport', 'F · Passport (name, birthplace, birthdate)'], ['sweet', 'G · Sweet treat'], ['clothing', 'H · Traditional clothing'],
  ['savoury', 'I · Savoury treat'], ['compare', 'J · Other artists to compare'], ['transport', 'K · Transportation']]
const PROFILE = [['artist', 'Artist ({{artist}})'], ['artist_short', 'Short name ({{artist_short}})'], ['artist_full', 'Full name ({{artist_full}})'], ['born', 'Born (when and where)'],
  ['country', 'Country ({{country}})'], ['flag', 'Flag emoji ({{flag}})'], ['language', 'Language ({{language}})'], ['people', 'People, e.g. Japanese ({{people}})'],
  ['theme1', 'Art theme 1 ({{theme1}})'], ['theme2', 'Art theme 2 ({{theme2}})'], ['theme3', 'Favourite theme ({{theme3}})']]

let ME = null, V = 'lib', C = { list: [], sel: null, cls: null, lessons: [], tab: 'lessons', week: 1, open: {}, filter: 'all', q: '' }, BANK = [], PROJ = [], CPAGES = [], saveT = null

const $ = id => document.getElementById(id)
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'x' + Math.random().toString(36).slice(2) + Date.now())
const clone = o => JSON.parse(JSON.stringify(o))
function toast(t) { const e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(e._t); e._t = setTimeout(() => e.style.display = 'none', 2600) }
function fill(t, prof) { const p = prof || (C.cls && C.cls.profile) || {}; return String(t || '').replace(/\{\{\s*([a-z_0-9]+)\s*\}\}/g, (m, k) => p[k] ? p[k] : m) }

// ---- sign in ----
$('go').onclick = async () => { const { error } = await sb.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value }); if (error) $('lerr').textContent = 'That didn’t work.'; else start() }
$('pw').onkeydown = e => { if (e.key === 'Enter') $('go').click() }
sb.auth.getSession().then(({ data }) => { if (data.session) start() })
async function start() {
  const { data } = await sb.auth.getUser(); ME = data.user
  const { data: ok } = await sb.rpc('curr_can_edit')
  $('login').style.display = 'none'; $('app').style.display = 'block'
  $('who').textContent = (ME && ME.email || '') + (ok ? '' : ' · view only')
  if (!ok) toast('You can look, but not edit. Ask Renée to add you as an editor.')
  document.querySelectorAll('.top .tab').forEach(b => b.onclick = () => { V = b.dataset.v; document.querySelectorAll('.top .tab').forEach(x => x.classList.toggle('on', x === b)); draw() })
  const [b, p, cp] = await Promise.all([sb.from('curr_bank').select('*').order('kind').order('title'),
    sb.from('project_library').select('id, name, world_images, image_url').order('name'), sb.from('world_class_pages').select('id, name').order('name')])
  BANK = b.data || []; PROJ = p.data || []; CPAGES = cp.data || []
  await loadList(); draw()
}
async function loadList() { const { data, error } = await sb.from('curr_classes').select('id, name, structure, is_template, status, weeks, profile, updated_at').order('is_template', { ascending: false }).order('name'); if (error) toast(error.message); C.list = data || [] }

function draw() {
  if (V === 'bank') return drawBank()
  if (V === 'ed') return drawEditors()
  const f = C.filter, q = C.q.toLowerCase()
  const list = C.list.filter(c => (f === 'all' ? !c.is_template : f === 'tpl' ? c.is_template : !c.is_template && c.status === f) && (!q || c.name.toLowerCase().includes(q) || String((c.profile || {}).artist || '').toLowerCase().includes(q)))
  const stHtml = c => c.is_template ? '<span class="st tpl">Template</span>' : `<span class="st ${c.status}">${esc((STATUS.find(s => s[0] === c.status) || [])[1])}</span>`
  $('main').innerHTML = `<div class="lib card"><div style="display:flex;gap:6px"><input type="text" id="lq" placeholder="Search classes" value="${esc(C.q)}"><button class="btn primary" id="nw">＋ New</button></div>
    <div class="chips">${[['all', 'All'], ['draft', 'Draft'], ['review', 'In review'], ['active', 'Active'], ['retired', 'Not active'], ['tpl', 'Templates']].map(x => `<button class="chip${f === x[0] ? ' on' : ''}" data-f="${x[0]}">${x[1]}</button>`).join('')}</div>
    ${list.map(c => `<button class="cl${C.sel === c.id ? ' on' : ''}" data-c="${c.id}">${esc(c.name)} ${stHtml(c)}<small>${esc((STRUCT.find(s => s[0] === c.structure) || [])[1] || '')} · ${c.weeks} classes</small></button>`).join('') || '<p class="muted">Nothing here yet.</p>'}</div>
    <div class="card" id="folder">${C.cls ? '' : '<p class="muted">Choose a class, or ＋ New to start one from a template.</p>'}</div>`
  $('lq').oninput = e => { C.q = e.target.value; const pos = e.target.selectionStart; draw(); $('lq').focus(); $('lq').setSelectionRange(pos, pos) }
  $('nw').onclick = newClass
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { C.filter = b.dataset.f; draw() })
  document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => openClass(b.dataset.c))
  if (C.cls) drawFolder()
}
async function openClass(id) {
  const [c, l] = await Promise.all([sb.from('curr_classes').select('*').eq('id', id).single(), sb.from('curr_lessons').select('*').eq('class_id', id).order('week_no')])
  if (c.error) { toast(c.error.message); return }
  C.sel = id; C.cls = c.data; C.lessons = l.data || []; C.week = Math.min(C.week, C.cls.weeks) || 1; C.open = {}; draw()
}

// ---- a class folder ----
function drawFolder() {
  const c = C.cls, el = $('folder')
  const tabs = [['lessons', '📖 Lessons'], ['overview', '⚙️ Settings'], ...(c.structure !== 'project' ? [['profile', '🎨 Artist profile']] : []), ['onepager', '📄 One-pager'], ['todo', '⚠ Still to do']]
  el.innerHTML = `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h2 style="margin:0;flex:1">${esc(c.name)}</h2><span class="save" id="sv"></span>
      <button class="btn small" id="dup">⧉ Duplicate</button>${c.is_template ? '' : '<button class="btn small" id="mkt">Save as a template</button>'}<button class="btn small" id="del">Delete</button></div>
    <div class="ftabs">${tabs.map(t => `<button data-t="${t[0]}" class="${C.tab === t[0] ? 'on' : ''}">${t[1]}</button>`).join('')}</div><div id="fbody"></div>`
  el.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { C.tab = b.dataset.t; drawFolder() })
  $('dup').onclick = () => copyClass(c, false); $('del').onclick = delClass; if ($('mkt')) $('mkt').onclick = () => copyClass(c, true)
  if (!tabs.some(t => t[0] === C.tab)) C.tab = 'lessons'
  ;({ lessons: drawLessons, overview: drawOverview, profile: drawProfile, onepager: drawOnePager, todo: drawTodo })[C.tab]()
}
function saved(t) { const e = $('sv'); if (e) e.textContent = t }
async function saveClass(patch) {
  Object.assign(C.cls, patch); saved('Saving…')
  const { error } = await sb.from('curr_classes').update(patch).eq('id', C.cls.id)
  if (error) { saved('Not saved: ' + error.message); return false }
  saved('Saved ✓'); const li = C.list.find(x => x.id === C.cls.id); if (li) Object.assign(li, patch); return true
}
function drawOverview() {
  const c = C.cls
  $('fbody').innerHTML = `<div class="grid2"><label class="f">Name<input type="text" id="o-name" value="${esc(c.name)}"></label>
      <label class="f">Status<select id="o-status">${STATUS.map(s => `<option value="${s[0]}"${c.status === s[0] ? ' selected' : ''}>${s[1]}</option>`).join('')}</select></label>
      <label class="f">Structure<select id="o-struct">${STRUCT.map(s => `<option value="${s[0]}"${c.structure === s[0] ? ' selected' : ''}>${s[1]}</option>`).join('')}</select></label>
      <label class="f">Ages<input type="text" id="o-ages" value="${esc(c.ages || '')}" placeholder="e.g. 6-12"></label>
      <label class="f">Number of classes<input type="number" id="o-weeks" min="1" max="20" value="${c.weeks}"></label>
      <label class="f">Short welcome from class<input type="number" id="o-sw" min="1" max="20" value="${c.short_welcome_from || 2}"></label>
      <label class="f">Skip the welcome from class <span class="muted">(empty: never)</span><input type="number" id="o-skip" min="2" max="20" value="${c.skip_welcome_from || ''}"></label>
      <label class="f">Taught in these World class pages<select id="o-pages" multiple size="5">${CPAGES.map(p => `<option value="${p.id}"${(c.class_page_ids || []).includes(p.id) ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}</select>
        <span class="muted">Links it to the staff schedule (Cmd/Ctrl-click for more than one).</span></label></div>
    <label class="f">Notes for editors<textarea id="o-notes">${esc(c.notes || '')}</textarea></label>
    <h3 style="margin:14px 0 6px">Colour tones</h3><p class="muted" style="margin:0 0 8px">Each block on a page uses one of these. Change them to match the artist.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap">${Object.keys(TONES).map(k => `<label class="f" style="width:110px">${TONE_NAMES[k]}<input type="color" data-tone="${k}" value="${esc((c.palette || {})[k] || TONES[k])}" style="width:100%;height:34px;border:1px solid var(--line);border-radius:8px"></label>`).join('')}</div>
    ${c.status === 'active' ? '<p class="muted">Active: studios see changes as soon as they’re saved.</p>' : ''}`
  const on = (id, f) => $(id).onchange = f
  on('o-name', e => saveClass({ name: e.target.value.trim() || c.name }))
  on('o-status', e => saveClass({ status: e.target.value }))
  on('o-struct', e => saveClass({ structure: e.target.value }).then(drawFolder))
  on('o-ages', e => saveClass({ ages: e.target.value.trim() || null }))
  on('o-sw', e => saveClass({ short_welcome_from: Math.max(1, +e.target.value || 2) }))
  on('o-skip', e => saveClass({ skip_welcome_from: +e.target.value || null }))
  on('o-notes', e => saveClass({ notes: e.target.value }))
  on('o-pages', e => saveClass({ class_page_ids: [...e.target.selectedOptions].map(o => o.value) }))
  on('o-weeks', e => setWeeks(Math.max(1, Math.min(20, +e.target.value || c.weeks))))
  document.querySelectorAll('[data-tone]').forEach(i => i.onchange = () => saveClass({ palette: Object.assign({}, c.palette || {}, { [i.dataset.tone]: i.value }) }))
}
async function setWeeks(n) {
  const c = C.cls, have = C.lessons.map(l => l.week_no), extra = C.lessons.filter(l => l.week_no > n)
  if (extra.length && !confirm(`Remove ${extra.map(l => 'Class ' + l.week_no).join(', ')}? Their pages are deleted.`)) { drawFolder(); return }
  if (extra.length) await sb.from('curr_lessons').delete().eq('class_id', c.id).gt('week_no', n)
  const add = []; for (let w = 1; w <= n; w++) if (!have.includes(w)) add.push({ class_id: c.id, week_no: w, title: 'Class ' + w, pages: defaultPages(c.structure, w) })
  if (add.length) { const { error } = await sb.from('curr_lessons').insert(add); if (error) toast(error.message) }
  await saveClass({ weeks: n }); await openClass(c.id)
}
// The outline a new lesson starts with, by structure
function blankPage(title, ptype, hint) { return { id: uid(), kind: 'page', ptype, title, blocks: [{ tone: '', items: [{ t: 'h1', text: title }, { t: 'p', text: hint, todo: true }] }] } }
function bankRef(kind) { const b = BANK.find(x => x.kind === kind); return b ? { id: uid(), kind: 'bank', bank_id: b.id, title: b.title } : null }
function defaultPages(structure, w) {
  const wel = { id: uid(), kind: 'welcome', title: 'Welcome' }, clean = bankRef('cleanup')
  if (structure === 'project') return [wel, blankPage('Today’s project', 'intro', 'What we’re making, and a finished example.'), blankPage('Steps', 'steps', 'The steps, with a picture for each.'), clean, blankPage('Show & tell', 'show', 'Everyone shares one thing they love about their piece.')].filter(Boolean)
  return [wel, blankPage(w === 1 ? 'Do you like…' : 'Last week…', 'hook', 'A hook to start.'), blankPage(`Project ${w} intro`, 'intro', 'What we’re making today, and why.'),
    blankPage('Technique', 'technique', 'Add a technique from the bank, or write one.'), blankPage(`Project ${w} steps`, 'steps', 'The steps, with a picture for each.'),
    blankPage('Did you know?', 'culture', 'A story or fact about the artist.'), clean, { id: uid(), kind: 'page', ptype: 'quiz', title: 'Quiz', blocks: [{ tone: 'lightest1', items: [{ t: 'quiz' }] }] }].filter(Boolean)
}

  $('fbody').innerHTML = `<p class="muted" style="margin:0 0 10px">Filled in once: anywhere a page says {{artist}}, {{country}}, {{theme1}}… it shows these. It also makes the staff one-pager.</p>
    <div class="grid3">${PROFILE.map(x => `<label class="f">${esc(x[1])}<input type="text" data-p="${x[0]}" value="${esc(p[x[0]] || '')}"></label>`).join('')}</div>
    <label class="f">Who the artist is (3–4 sentences, for staff and parents)<textarea data-p="bio">${esc(p.bio || '')}</textarea></label>
    <label class="f">Why we chose them<textarea data-p="why">${esc(p.why || '')}</textarea></label>
    <label class="f">Talking points for parents<textarea data-p="parent_notes">${esc(p.parent_notes || '')}</textarea></label>
    <h3 style="margin:14px 0 6px">Country facts (A–K, the "Getting there" poster)</h3><div class="grid2">${FACTS.map(x => `<label class="f">${esc(x[1])}<input type="text" data-fact="${x[0]}" value="${esc(f[x[0]] || '')}"></label>`).join('')}</div>`
  const save = () => { const np = Object.assign({}, C.cls.profile || {}); document.querySelectorAll('[data-p]').forEach(i => np[i.dataset.p] = i.value.trim())

// ---- lessons ----
function lesson() { return C.lessons.find(l => l.week_no === C.week) }
function drawLessons() {
  const c = C.cls, L = lesson()
  let h = `<div class="wks">${Array.from({ length: c.weeks }, (_, i) => i + 1).map(w => `<button data-w="${w}" class="${w === C.week ? 'on' : ''}">Class ${w} of ${c.weeks}</button>`).join('')}</div>`
  if (!L) { $('fbody').innerHTML = h + '<p class="muted">This class has no plan yet.</p><button class="btn primary" id="mkL">Start Class ' + C.week + '</button>'; wireW(); $('mkL').onclick = () => setWeeks(c.weeks); return }
  const proj = PROJ.find(p => p.id === L.project_id)
  h += `<div class="grid2"><label class="f">Title<input type="text" id="l-title" value="${esc(L.title || '')}"></label>
      <label class="f">The project made${proj ? '' : ''}<select id="l-proj"><option value="">(none linked)</option>${PROJ.map(p => `<option value="${p.id}"${p.id === L.project_id ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label></div>
    <label class="f">Teacher notes for the whole class (never on the kids’ screen)<textarea id="l-notes">${esc(L.notes || '')}</textarea></label>
    <div style="display:flex;gap:8px;align-items:center;margin:4px 0 10px"><b style="flex:1">Pages (${(L.pages || []).length})</b>
      <a class="btn small" style="text-decoration:none;color:inherit" target="_blank" href="curriculum-present.html?class=${c.id}&week=${C.week}">▶ Present Class ${C.week}</a>
      <button class="btn small" id="cpL">Copy pages from…</button></div>
    <div id="pages">${(L.pages || []).map((p, i) => pageHtml(p, i)).join('')}</div>
    <div class="addbar"><select id="addT" style="width:auto"><option value="">＋ Add a page…</option>${PTYPES.map(t => `<option value="${t[0]}">${t[1]}</option>`).join('')}<option value="welcome">Welcome (full/short, automatic)</option></select>
      <select id="addB" style="width:auto"><option value="">＋ Add from the bank…</option>${BANK.map(b => `<option value="${b.id}">${esc(b.title)}</option>`).join('')}</select></div>`
  $('fbody').innerHTML = h; wireW()
  $('l-title').onchange = e => saveLesson({ title: e.target.value })
  $('l-proj').onchange = e => saveLesson({ project_id: e.target.value || null })
  $('l-notes').onchange = e => saveLesson({ notes: e.target.value })
  $('cpL').onclick = copyPagesFrom
  $('addT').onchange = e => { const v = e.target.value; if (!v) return; const pg = v === 'welcome' ? { id: uid(), kind: 'welcome', title: 'Welcome' } : blankPage((PTYPES.find(t => t[0] === v) || [])[1], v, 'Write this page.')
    if (v === 'quiz') pg.blocks = [{ tone: 'lightest1', items: [{ t: 'quiz' }] }]
    L.pages.push(pg); C.open[pg.id] = true; savePages(); drawLessons() }
  $('addB').onchange = e => { const b = BANK.find(x => x.id === e.target.value); if (!b) return; L.pages.push({ id: uid(), kind: 'bank', bank_id: b.id, title: b.title }); savePages(); drawLessons() }
  wirePages($('pages'), L.pages, savePages, drawLessons)
}
function wireW() { document.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { C.week = +b.dataset.w; drawLessons() }) }
function pageHtml(p, i) {
  const open = !!C.open[p.id], todo = countTodo(p)
  let kind = p.kind === 'welcome' ? '<span class="tag wel">Welcome: full or short, automatic</span>' : p.kind === 'bank' ? '<span class="tag bank">Shared bank</span>' : ''
  if (todo) kind += ` <span class="tag todo">⚠ ${todo}</span>`
  const body = !open ? '' : p.kind === 'welcome' ? `<div class="b muted">Class ${C.week}: ${welcomeNote()}. Change when it switches in ⚙️ Settings; edit the pages themselves in 🏦 Shared bank.</div>`
    : p.kind === 'bank' ? `<div class="b"><p class="muted" style="margin:0 0 6px">Shared with every class using it: changes are made in 🏦 Shared bank.</p>
        <button class="btn small" data-copy="${i}">Make a copy just for this class</button> <button class="btn small" data-editbank="${p.bank_id}">Edit in the bank</button></div>`
    : `<div class="b">${pageEditor(p, i)}</div>`
  return `<div class="pg${open ? ' open' : ''}" data-pg="${i}"><div class="h" data-tog="${p.id}"><span class="k">${esc((PTYPES.find(t => t[0] === p.ptype) || [p.kind === 'bank' ? 'bank' : p.kind])[0])}</span><span class="t">${i + 1}. ${esc(fill(pageTitle(p)))}</span>${kind}
    <span class="noprint" onclick="event.stopPropagation()"><button class="btn small" data-mv="${i}|-1">▲</button><button class="btn small" data-mv="${i}|1">▼</button><button class="btn small" data-rm="${i}">✕</button></span></div>${body}</div>`
}
function pageTitle(p) { if (p.kind === 'bank') { const b = BANK.find(x => x.id === p.bank_id); return b ? b.title : '(missing bank page)' } return p.title || '(untitled)' }
function welcomeNote() { const c = C.cls; if (c.skip_welcome_from && C.week >= c.skip_welcome_from) return 'skipped (from Class ' + c.skip_welcome_from + ' on)'; return C.week >= (c.short_welcome_from || 2) ? 'the short welcome' : 'the full welcome & rules' }
function countTodo(p) {
  if (!p.blocks) return 0; let n = 0
  p.blocks.forEach(b => (b.items || []).forEach(it => { if (it.todo) n++; if (it.t === 'img' && !it.url) n++; if (it.t === 'gallery') n += (it.slots || []).filter(s => !s.url).length; if (it.t === 'video' && !it.url) n++ }))
  return n
}
function pageEditor(p, i) {
  return `<div class="grid2"><label class="f">Page title<input type="text" data-ptitle="${i}" value="${esc(p.title || '')}"></label>
      <label class="f">Kind of page<select data-ptype="${i}">${PTYPES.map(t => `<option value="${t[0]}"${p.ptype === t[0] ? ' selected' : ''}>${t[1]}</option>`).join('')}</select></label></div>
    <label class="f">Teacher note for this page (never on the kids’ screen)<input type="text" data-pnote="${i}" value="${esc(p.note || '')}"></label>
    ${(p.blocks || []).map((b, bi) => blockEditor(b, i, bi)).join('')}
    <button class="btn small" data-addblk="${i}">＋ Add a block</button>`
}
function blockEditor(b, i, bi) {
  return `<div class="blkE"><div class="bh"><b style="font-size:12.5px">Block ${bi + 1}</b><span class="tone" style="background:${(C.cls && (C.cls.palette || {})[b.tone]) || TONES[b.tone] || '#fff'}"></span>
      <select data-tonesel="${i}|${bi}" style="width:auto">${Object.keys(TONE_NAMES).map(k => `<option value="${k}"${(b.tone || '') === k ? ' selected' : ''}>${TONE_NAMES[k]}</option>`).join('')}</select>
      <span style="flex:1"></span><button class="btn small" data-bmv="${i}|${bi}|-1">▲</button><button class="btn small" data-bmv="${i}|${bi}|1">▼</button><button class="btn small" data-brm="${i}|${bi}">✕</button></div>
    ${(b.items || []).map((it, ii) => itemEditor(it, i, bi, ii)).join('')}
    <div class="addbar">${ITEMS.map(x => `<button class="btn small" data-additem="${i}|${bi}|${x[0]}">＋ ${x[1]}</button>`).join('')}</div></div>`
}
function itemEditor(it, i, bi, ii) {
  const k = `${i}|${bi}|${ii}`, lab = (ITEMS.find(x => x[0] === it.t) || [it.t, it.t])[1]
  let f = ''
  if (['h1', 'h2', 'h3', 'p'].includes(it.t)) f = `<textarea data-f="${k}|text" rows="${it.t === 'p' ? 3 : 1}" style="min-height:${it.t === 'p' ? 60 : 34}px">${esc(it.text || '')}</textarea>`
  else if (it.t === 'qa') f = `<input type="text" data-f="${k}|text" value="${esc(it.text || '')}" placeholder="Question"><input type="text" data-f="${k}|answer" value="${esc(it.answer || '')}" placeholder="Answer (shows when tapped)" style="margin-top:4px">`
  else if (it.t === 'img') f = `<div style="display:flex;gap:8px;align-items:flex-start"><div style="width:150px">${it.url ? `<img class="thumb" src="${esc(it.url)}">` : `<div class="thumb ph">${esc(fill(it.hint || 'No picture yet'))}</div>`}</div>
      <div style="flex:1"><input type="text" data-f="${k}|hint" value="${esc(it.hint || '')}" placeholder="What picture goes here"><div style="display:flex;gap:4px;margin-top:4px">
        <button class="btn small" data-up="${k}">⬆ Upload</button><input type="text" data-f="${k}|url" value="${esc(it.url || '')}" placeholder="or paste a picture link"></div>
        <label style="font-size:12.5px;display:block;margin-top:4px"><input type="checkbox" data-fb="${k}|bg"${it.bg ? ' checked' : ''}> Background of this block</label>
        ${it.source ? `<div class="muted" style="font-size:12px;margin-top:3px">From the sheet: <a href="${esc(it.source)}" target="_blank">${esc(it.source.slice(0, 60))}…</a> (download it and upload here)</div>` : ''}</div></div>`
  else if (it.t === 'gallery') f = `<div class="slots">${(it.slots || []).map((s, si) => `<div class="slotE">${s.url ? `<img src="${esc(s.url)}">` : `<div class="thumb ph">${esc(fill(s.hint || 'Picture'))}</div>`}
      <button class="btn small" data-up="${k}|${si}" style="margin-top:4px;width:100%">⬆ Upload</button>
      <input type="text" data-gs="${k}|${si}|caption" value="${esc(s.caption || '')}" placeholder="Caption" style="margin-top:4px;font-size:12px">
      <div style="display:flex;justify-content:space-between;margin-top:3px"><span class="muted" title="${esc(s.hint || '')}" style="font-size:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:100px">${esc(s.hint || '')}</span><button class="btn small" data-gsrm="${k}|${si}">✕</button></div>
      ${s.source ? `<a href="${esc(s.source.split(/\s/)[0])}" target="_blank" style="font-size:11px">source</a>` : ''}</div>`).join('')}
      <button class="btn small" data-gsadd="${k}">＋ Picture</button></div>`
  else if (it.t === 'video') f = `<input type="text" data-f="${k}|url" value="${esc(it.url || '')}" placeholder="YouTube link, or a video file link"><input type="text" data-f="${k}|hint" value="${esc(it.hint || '')}" placeholder="What the video is (button label if it’s not YouTube)" style="margin-top:4px">
      <button class="btn small" data-up="${k}" style="margin-top:4px">⬆ Upload a video file</button>${it.source ? `<div class="muted" style="font-size:12px">From the sheet: ${esc(it.source.slice(0, 80))}</div>` : ''}`
  else if (it.t === 'quiz') f = '<span class="muted">Shows every question asked on the pages before this one. Add new questions after it.</span>'
  else if (it.t === 'facts') f = '<span class="muted">Shows the country facts (A–K) from the 🎨 Artist profile.</span>'
  return `<div class="it${it.todo ? ' todo' : ''}"><span class="lab">${esc(lab)}${it.todo ? '<br><b style="color:var(--warn)">⚠ to check</b>' : ''}</span><div>${f}
      ${['h1', 'h2', 'h3', 'p', 'qa'].includes(it.t) ? `<label style="font-size:12px;color:var(--muted)"><input type="checkbox" data-fb="${k}|todo"${it.todo ? ' checked' : ''}> Still to check</label>` : ''}</div>
    <span class="acts"><button data-imv="${k}|-1" title="Up">▲</button><button data-imv="${k}|1" title="Down">▼</button><button data-irm="${k}" title="Remove">✕</button></span></div>`
}
// all the page / block / item buttons and fields (used for lessons and for bank pages)
function wirePages(root, pages, save, redraw) {
  const P = i => pages[+i], B = (i, bi) => P(i).blocks[+bi], I = (i, bi, ii) => B(i, bi).items[+ii]
  const sp = s => s.split('|')
  root.querySelectorAll('[data-tog]').forEach(h => h.onclick = () => { C.open[h.dataset.tog] = !C.open[h.dataset.tog]; redraw() })
  root.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => { const [i, d] = sp(b.dataset.mv).map(Number), j = i + d; if (j < 0 || j >= pages.length) return; [pages[i], pages[j]] = [pages[j], pages[i]]; save(); redraw() })
  root.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { if (!confirm('Remove this page?')) return; pages.splice(+b.dataset.rm, 1); save(); redraw() })
  root.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => { const p = pages[+b.dataset.copy], bk = BANK.find(x => x.id === p.bank_id); if (!bk) return
    pages[+b.dataset.copy] = { id: uid(), kind: 'page', ptype: bk.kind === 'technique' ? 'technique' : 'other', title: bk.title, blocks: clone(bk.blocks || []) }; save(); redraw(); toast('Copied: this class now has its own version.') })
  root.querySelectorAll('[data-editbank]').forEach(b => b.onclick = () => { V = 'bank'; BANKSEL = b.dataset.editbank; document.querySelectorAll('.top .tab').forEach(x => x.classList.toggle('on', x.dataset.v === 'bank')); draw() })
  root.querySelectorAll('[data-ptitle]').forEach(e => e.onchange = () => { P(e.dataset.ptitle).title = e.value; save() })
  root.querySelectorAll('[data-ptype]').forEach(e => e.onchange = () => { P(e.dataset.ptype).ptype = e.value; save(); redraw() })
  root.querySelectorAll('[data-pnote]').forEach(e => e.onchange = () => { P(e.dataset.pnote).note = e.value; save() })
  root.querySelectorAll('[data-addblk]').forEach(b => b.onclick = () => { const p = P(b.dataset.addblk); (p.blocks = p.blocks || []).push({ tone: '', items: [] }); save(); redraw() })
  root.querySelectorAll('[data-tonesel]').forEach(e => e.onchange = () => { const [i, bi] = sp(e.dataset.tonesel); B(i, bi).tone = e.value; save(); redraw() })
  root.querySelectorAll('[data-bmv]').forEach(b => b.onclick = () => { const [i, bi, d] = sp(b.dataset.bmv).map(Number), bl = P(i).blocks, j = bi + d; if (j < 0 || j >= bl.length) return; [bl[bi], bl[j]] = [bl[j], bl[bi]]; save(); redraw() })
  root.querySelectorAll('[data-brm]').forEach(b => b.onclick = () => { if (!confirm('Remove this block and everything in it?')) return; const [i, bi] = sp(b.dataset.brm).map(Number); P(i).blocks.splice(bi, 1); save(); redraw() })
  root.querySelectorAll('[data-additem]').forEach(b => b.onclick = () => { const [i, bi, t] = sp(b.dataset.additem); const it = { t }; if (t === 'gallery') it.slots = [{ hint: '', url: '' }, { hint: '', url: '' }, { hint: '', url: '' }]; if (t === 'qa') { it.text = ''; it.answer = '' }
    B(i, bi).items.push(it); save(); redraw() })
  root.querySelectorAll('[data-imv]').forEach(b => b.onclick = () => { const [i, bi, ii, d] = sp(b.dataset.imv).map(Number), it = B(i, bi).items, j = ii + d; if (j < 0 || j >= it.length) return; [it[ii], it[j]] = [it[j], it[ii]]; save(); redraw() })
  root.querySelectorAll('[data-irm]').forEach(b => b.onclick = () => { const [i, bi, ii] = sp(b.dataset.irm).map(Number); B(i, bi).items.splice(ii, 1); save(); redraw() })
  root.querySelectorAll('[data-f]').forEach(e => e.onchange = () => { const [i, bi, ii, key] = sp(e.dataset.f); I(i, bi, ii)[key] = e.value; save(); if (key === 'url') redraw() })
  root.querySelectorAll('[data-fb]').forEach(e => e.onchange = () => { const [i, bi, ii, key] = sp(e.dataset.fb); const it = I(i, bi, ii); if (e.checked) it[key] = true; else delete it[key]; save(); redraw() })
  root.querySelectorAll('[data-gs]').forEach(e => e.onchange = () => { const [i, bi, ii, si, key] = sp(e.dataset.gs); I(i, bi, ii).slots[+si][key] = e.value; save() })
  root.querySelectorAll('[data-gsrm]').forEach(b => b.onclick = () => { const [i, bi, ii, si] = sp(b.dataset.gsrm); I(i, bi, ii).slots.splice(+si, 1); save(); redraw() })
  root.querySelectorAll('[data-gsadd]').forEach(b => b.onclick = () => { const [i, bi, ii] = sp(b.dataset.gsadd); I(i, bi, ii).slots.push({ hint: '', url: '' }); save(); redraw() })
  root.querySelectorAll('[data-up]').forEach(b => b.onclick = () => { const [i, bi, ii, si] = sp(b.dataset.up); upload(I(i, bi, ii), si, () => { save(); redraw() }) })
}
// pictures and videos: into the public "curriculum" bucket
function upload(it, si, done) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = it.t === 'video' ? 'video/*' : 'image/*'
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return
    if (f.size > 50 * 1024 * 1024) { toast('That file is over 50 MB.'); return }
    toast('Uploading…')
    const path = `${(C.cls && C.cls.id) || 'bank'}/${Date.now()}-${f.name.replace(/[^\w.\-]+/g, '_')}`
    const { error } = await sb.storage.from('curriculum').upload(path, f, { cacheControl: '31536000', upsert: false })
    if (error) { toast('Not uploaded: ' + error.message); return }
    const url = sb.storage.from('curriculum').getPublicUrl(path).data.publicUrl
    if (si !== undefined && it.slots) it.slots[+si].url = url; else it.url = url
    toast('Uploaded ✓'); done()
  }
  inp.click()
}
async function saveLesson(patch) {
  const L = lesson(); Object.assign(L, patch); saved('Saving…')
  const { error } = await sb.from('curr_lessons').update(patch).eq('id', L.id)
  saved(error ? 'Not saved: ' + error.message : 'Saved ✓')
}
function savePages() { saved('Saving…'); clearTimeout(saveT); saveT = setTimeout(() => saveLesson({ pages: lesson().pages }), 700) }
async function copyPagesFrom() {
  const src = prompt('Copy the pages from which class number? (They replace this class’s pages.)', String(Math.max(1, C.week - 1)))
  const L0 = C.lessons.find(l => l.week_no === +src); if (!L0) return
  if (!confirm(`Replace Class ${C.week}'s pages with a copy of Class ${src}'s?`)) return
  lesson().pages = clone(L0.pages).map(p => Object.assign(p, { id: uid() })); savePages(); drawLessons()
}

async function makeFrom(srcId, o) {
  let src = null, lessons = []
  if (srcId) { const [c, l] = await Promise.all([sb.from('curr_classes').select('*').eq('id', srcId).single(), sb.from('curr_lessons').select('*').eq('class_id', srcId).order('week_no')]); src = c.data; lessons = l.data || [] }
  const fromTpl = src && src.is_template
  const profile = src ? clone(src.profile || {}) : {}
  if (fromTpl || o.artist) { Object.keys(profile).forEach(k => { if (k !== 'facts') profile[k] = '' }); profile.facts = {} }   // (a template's example artist isn't copied)
  if (o.artist) { profile.artist = o.artist; profile.artist_full = o.artist; profile.artist_short = o.artist.split(' ').slice(-1)[0] }
  const row = { name: o.name, structure: src ? src.structure : 'artist', is_template: !!o.template, status: o.template ? 'active' : 'draft', weeks: o.weeks, ages: src ? src.ages : null,
    profile, palette: src ? src.palette || {} : {}, short_welcome_from: src ? src.short_welcome_from : 2, skip_welcome_from: src ? src.skip_welcome_from : 3, template_id: src ? (src.is_template ? src.id : src.template_id) : null,
    notes: src && src.is_template ? null : src ? 'Copied from ' + src.name + '.' : null }
  const { data: nc, error } = await sb.from('curr_classes').insert(row).select('id').single()
  if (error) { toast(error.message); return }
  const rows = []
  for (let w = 1; w <= o.weeks; w++) {
    const s = lessons.find(l => l.week_no === w)
    rows.push({ class_id: nc.id, week_no: w, title: s ? s.title : 'Class ' + w, project_id: s && !fromTpl ? s.project_id : null, notes: s ? s.notes : null,
      pages: s ? clone(s.pages).map(p => Object.assign(p, { id: uid() })) : defaultPages(row.structure, w) })
  }
  const { error: e2 } = await sb.from('curr_lessons').insert(rows); if (e2) toast(e2.message)
  await loadList(); C.filter = o.template ? 'tpl' : 'draft'; C.tab = 'lessons'; C.week = 1; await openClass(nc.id); toast(o.template ? 'Template made ✓' : 'Class made ✓ (a draft)')
}
function copyClass(c, asTemplate) {
  const name = prompt(asTemplate ? 'Name of the new template:' : 'Name of the copy:', asTemplate ? c.name + ' (template)' : c.name + ' (copy)'); if (!name) return
  makeFrom(c.id, { name, weeks: c.weeks, template: asTemplate, artist: '' })
}
async function delClass() {
  if (!confirm(`Delete ${C.cls.name} and all its lessons? This can’t be undone. (To keep it, set it to Not active instead.)`)) return
  const { error } = await sb.from('curr_classes').delete().eq('id', C.cls.id); if (error) { toast(error.message); return }
  C.cls = null; C.sel = null; await loadList(); draw()
}

// ---- one-pager (for staff to talk to parents) ----
function drawOnePager() {
  const c = C.cls, p = c.profile || {}, f = p.facts || {}
  const wk = C.lessons.map(L => {
    const pr = PROJ.find(x => x.id === L.project_id), pic = pr && ((pr.world_images || [])[0] || pr.image_url)
    const tech = (L.pages || []).filter(x => x.ptype === 'technique' || (x.kind === 'bank' && (BANK.find(b => b.id === x.bank_id) || {}).kind === 'technique')).map(x => fill(pageTitle(x)))
    return `<div class="wk">${pic ? `<img src="${esc(pic)}">` : ''}<div><b>Class ${L.week_no}: ${esc(fill(L.title || ''))}</b><br>${pr ? '🎨 ' + esc(pr.name) : '<span class="muted">Project not linked yet</span>'}${tech.length ? '<br>✏️ ' + esc(tech.join(', ')) : ''}</div></div>`
  }).join('')
  const facts = FACTS.filter(x => f[x[0]]).map(x => `<li><b>${esc(x[1].replace(/^[A-K] · /, ''))}:</b> ${esc(f[x[0]])}</li>`).join('')
  $('fbody').innerHTML = `<div class="noprint" style="margin:0 0 10px"><button class="btn" onclick="window.print()">🖨 Print</button> <span class="muted">Built from the Artist profile and the lessons.</span></div>
    <div class="op"><h2>${esc(c.name)}</h2><p class="muted" style="margin:0">${c.weeks} classes${c.ages ? ' · ages ' + esc(c.ages) : ''}</p>
    ${c.structure !== 'project' ? `<h3>Who is ${esc(p.artist || 'the artist')}?</h3><p>${esc(p.bio || '') || '<span class="muted">Add who the artist is in 🎨 Artist profile.</span>'}</p>
      ${p.born || p.country ? `<p>${p.born ? 'Born ' + esc(p.born) + '. ' : ''}${p.country ? 'From ' + esc(p.country) + ' ' + esc(p.flag || '') : ''}</p>` : ''}
      ${p.theme1 ? `<p>Loved ${esc([p.theme1, p.theme2].filter(Boolean).join(' and '))}${p.theme3 ? ', and especially ' + esc(p.theme3) : ''}.</p>` : ''}
      ${p.why ? `<h3>Why we chose them</h3><p>${esc(p.why)}</p>` : ''}` : ''}
    <h3>Week by week</h3>${wk}
    ${facts ? `<h3>${esc(p.country || 'The country')}</h3><ul>${facts}</ul>` : ''}
    ${p.parent_notes ? `<h3>Talking to parents</h3><p style="white-space:pre-line">${esc(p.parent_notes)}</p>` : ''}
    <h3>What comes home when</h3><p>Paintings and prints are usually ready about 14 days after each class; clay takes a little longer.</p></div>`
}
function drawTodo() {
  const items = []
  C.lessons.forEach(L => (L.pages || []).forEach((p, i) => { const n = countTodo(p); if (n) items.push(`<li>Class ${L.week_no} · page ${i + 1} <b>${esc(fill(pageTitle(p)))}</b>: ${n} to do <button class="btn small" data-go="${L.week_no}|${p.id}">Open</button></li>`) }))
  const p = C.cls.profile || {}, miss = C.cls.structure === 'project' ? [] : ['artist', 'country', 'bio', 'theme1'].filter(k => !p[k])
  $('fbody').innerHTML = `<p class="muted" style="margin:0 0 8px">Text still marked "to check", and pictures or videos still to add.</p>
    ${miss.length ? `<p>🎨 Artist profile: still to fill in ${miss.join(', ')}.</p>` : ''}${items.length ? `<ul class="todoL">${items.join('')}</ul>` : '<p>Nothing left to do ✓</p>'}`
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { const [w, id] = b.dataset.go.split('|'); C.week = +w; C.tab = 'lessons'; C.open = { [id]: true }; drawFolder() })
}

// ---- the shared bank ----
let BANKSEL = null
const BKINDS = [['welcome_full', 'Welcome & rules (full)'], ['welcome_short', 'Welcome (short)'], ['cleanup', 'Clean up & gallery'], ['technique', 'Technique'], ['page', 'Other page']]
function drawBank() {
  const b = BANK.find(x => x.id === BANKSEL)
  $('main').innerHTML = `<div class="lib card"><div style="display:flex;gap:6px;margin:0 0 8px"><b style="flex:1">Shared bank</b><button class="btn primary" id="bnew">＋ New</button></div>
      ${BKINDS.map(k => { const l = BANK.filter(x => x.kind === k[0]); return l.length ? `<div class="muted" style="font-size:12px;margin:8px 0 4px">${k[1]}</div>` + l.map(x => `<button class="cl${x.id === BANKSEL ? ' on' : ''}" data-b="${x.id}">${esc(x.title)}</button>`).join('') : '' }).join('')}</div>
    <div class="card" id="bk">${b ? '' : '<p class="muted">Pages used by many classes: the welcome (full and short), clean up & gallery, and techniques. Change one here and every class using it updates.</p>'}</div>`
  document.querySelectorAll('[data-b]').forEach(x => x.onclick = () => { BANKSEL = x.dataset.b; C.open = {}; drawBank() })
  $('bnew').onclick = async () => { const t = prompt('Name of the new bank page (e.g. Woodblock printing):'); if (!t) return
    const { data, error } = await sb.from('curr_bank').insert({ kind: 'technique', title: t, blocks: [{ tone: '', items: [{ t: 'h1', text: t }] }] }).select('*').single()
    if (error) { toast(error.message); return } BANK.push(data); BANKSEL = data.id; drawBank() }
  if (!b) return
  const pages = [{ id: b.id, kind: 'page', ptype: 'technique', title: b.title, blocks: b.blocks || [], note: b.notes }]
  C.open[b.id] = true
  const usedIn = 'Checking where it’s used…'
  $('bk').innerHTML = `<div style="display:flex;gap:8px;align-items:center;margin:0 0 10px"><h2 style="margin:0;flex:1">${esc(b.title)}</h2><span class="save" id="sv"></span>
      <select id="bkind" style="width:auto">${BKINDS.map(k => `<option value="${k[0]}"${b.kind === k[0] ? ' selected' : ''}>${k[1]}</option>`).join('')}</select><button class="btn small" id="bdel">Delete</button></div>
    <p class="muted" id="bused" style="margin:0 0 10px">${usedIn}</p><div id="bpages">${pageEditor(pages[0], 0)}</div>`
  const save = async () => { b.title = pages[0].title || b.title; b.blocks = pages[0].blocks; b.notes = pages[0].note || null; saved('Saving…')
    const { error } = await sb.from('curr_bank').update({ title: b.title, blocks: b.blocks, notes: b.notes }).eq('id', b.id); saved(error ? 'Not saved: ' + error.message : 'Saved ✓') }
  const deb = () => { clearTimeout(saveT); saveT = setTimeout(save, 700) }
  wirePages($('bpages'), pages, deb, drawBank)
  $('bkind').onchange = async e => { b.kind = e.target.value; const { error } = await sb.from('curr_bank').update({ kind: b.kind }).eq('id', b.id); toast(error ? error.message : 'Saved ✓'); drawBank() }
  $('bdel').onclick = async () => { if (!confirm('Delete this bank page? Classes using it will show it as missing.')) return; const { error } = await sb.from('curr_bank').delete().eq('id', b.id); if (error) { toast(error.message); return } BANK = BANK.filter(x => x.id !== b.id); BANKSEL = null; drawBank() }
  sb.from('curr_lessons').select('week_no, pages, curr_classes(name)').then(({ data }) => {
    const used = (data || []).filter(l => (l.pages || []).some(p => p.bank_id === b.id || (p.kind === 'welcome' && /^welcome/.test(b.kind)) || false)).map(l => `${(l.curr_classes || {}).name} ${l.week_no}`)
    const e = $('bused'); if (e) e.textContent = used.length ? `Used in ${used.length} lesson${used.length === 1 ? '' : 's'}: ${used.slice(0, 12).join(', ')}${used.length > 12 ? '…' : ''}` : 'Not used in any lesson yet.'
  })
}

// ---- editors ----
async function drawEditors() {
  const { data, error } = await sb.from('curr_editors').select('*').order('email')
  $('main').innerHTML = `<div class="card" style="grid-column:1/-1;max-width:620px"><h2 style="margin:0 0 6px">Editors</h2>
    <p class="muted">Home office admins with Studio Ops edit access can always edit. Add anyone else who writes curriculum (they sign in with their home office account).</p>
    ${error ? `<p>${esc(error.message)}</p>` : `<ul>${(data || []).map(e => `<li>${esc(e.email)} <button class="btn small" data-rmed="${esc(e.email)}">Remove</button></li>`).join('') || '<li class="muted">Nobody added yet.</li>'}</ul>`}
    <div style="display:flex;gap:6px"><input type="email" id="ed-em" placeholder="kyra@4cats.com"><button class="btn primary" id="ed-add">Add</button></div></div>`
  $('ed-add').onclick = async () => { const em = $('ed-em').value.trim().toLowerCase(); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return; const { error } = await sb.from('curr_editors').insert({ email: em }); toast(error ? error.message : 'Added ✓'); drawEditors() }
  document.querySelectorAll('[data-rmed]').forEach(b => b.onclick = async () => { await sb.from('curr_editors').delete().eq('email', b.dataset.rmed); drawEditors() })
}
</script>
