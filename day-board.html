<style>

const localDate = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

let D = null;     // the loaded day: { team, people, blocks, lo, hi, sessions }
let START = null; // the blocks as loaded (for the Changes list and Undo my changes)

// ---- loading the day (the same data the Hub's Day plan uses) ----
async function load() {
  const st = $('studio').value, date = $('date').value;
  if (!st || !date) return;
  localStorage.setItem('dayboard_studio', st);
  history.replaceState(null, '', `?view=day&studio=${encodeURIComponent(st)}&date=${date}`);
  $('main').innerHTML = '<div class="msg">Loading the day…</div>';
  try {
    const [team, sess, set] = await Promise.all([
      sb.rpc('hub_team_on_date', { p_studio_id: st, p_date: date }),
      sb.from('sessions').select('id, title, session_date, session_time, session_type, duration_minutes, capacity, spaces_left_cache, show').eq('studio_id', st).eq('session_date', date).order('session_time'),
      sb.rpc('get_staffing_settings')
    ]);
    if (team.error) throw team.error;
    if (sess.error) throw sess.error;
    if (set.data && +set.data.class_min) LEN.kids = +set.data.class_min;
    if (set.data && +set.data.get_together_intro_min) LEN.intro = +set.data.get_together_intro_min;
    const sessions = (sess.data || []).filter(x => x.session_type !== 'festival');
    const ids = sessions.map(x => x.id);
    const [ss, bk] = await Promise.all([
      ids.length ? sb.from('session_staff').select('*').in('session_id', ids) : { data: [] },
      ids.length ? sb.from('bookings').select('id, session_id, qty, customer_name, customer_email, customer_phone, shopify_order_name, estimated_attendance').in('session_id', ids).gt('qty', 0).is('returned_at', null)
        .then(r => r.error ? sb.from('bookings').select('id, session_id, qty, customer_name').in('session_id', ids).gt('qty', 0).is('returned_at', null) : r) : { data: [] }
    ]);
    const booked = {}; (bk.data || []).forEach(b => { booked[b.session_id] = (booked[b.session_id] || 0) + (b.qty || 0); });
    // kids class weeks 2+: the week's class list (families booked the series on week 1)
    const week2 = sessions.filter(x => /\bclass\s+([2-9]|\d{2,})\s+of\s+\d+/i.test(x.title || ''));
    const rosters = await Promise.all(week2.map(x => sb.rpc('get_class_week_bookings', { p_session_id: x.id })));
    week2.forEach((x, i) => { if (!rosters[i].error) booked[x.id] = (rosters[i].data || []).reduce((n, b) => n + (b.qty || 0), 0); });
    const partyBk = (bk.data || []).filter(b => (sessions.find(x => x.id === b.session_id) || {}).session_type === 'party');
    const pd = partyBk.length ? await sb.from('party_details').select('*').in('booking_id', partyBk.map(b => b.id)) : { data: [] };
    // (Nov 9 2026) the art time chosen at booking, from the order (when party_details doesn't have it): the party line's "Art time"
    // property, or its extras option (variant names like "12 people / 90 min / …"); a later party change is in party_details
    const art90 = {}, afterMin = {};
    if (partyBk.length) {
      const rw = await sb.from('bookings').select('id, raw_payload, shopify_line_item_id').in('id', partyBk.map(b => b.id));
      (rw.data || []).forEach(r => {
        const raw = typeof r.raw_payload === 'string' ? (() => { try { return JSON.parse(r.raw_payload); } catch (e) { return {}; } })() : (r.raw_payload || {});
        const lines = raw.line_items || [], mine = lines.find(l => String(l.id) === String(r.shopify_line_item_id));
        const has90 = l => (l.properties || []).some(p => /art/i.test(String(p.name || '')) && /\b90\b|1\.5\s*h|90\s*min/i.test(String(p.value || '')))
          || /(^|\D)90\s*min|90-min|1\.5\s*h/i.test(String(l.variant_title || '') + ' ' + String(l.title || '')) && /party/i.test(String(l.title || ''));
        if ((mine && has90(mine)) || lines.some(l => l !== mine && /party/i.test(String(l.title || '')) && has90(l))) art90[r.id] = true;
        // party time after: the "Party time after" setting, else the extras option ("yes - add 30 minutes"); "No" = 0
        const partyLines = lines.filter(l => /party/i.test(String(l.title || '')));
        let after = null;
        for (const l of [mine].concat(partyLines).filter(Boolean)) {
          const pr = (l.properties || []).find(p => /time after|party time/i.test(String(p.name || '')));
          if (pr) { const m = String(pr.value || '').match(/(\d+)/); after = m ? +m[1] : /^\s*no\b/i.test(String(pr.value || '')) ? 0 : after; if (after != null) break; }
          const v = String(l.variant_title || ''); const m2 = v.match(/add\s*(\d+)\s*min/i);
          if (m2) { after = +m2[1]; break; } if (/\/\s*no\b/i.test(v)) { after = 0; }
        }
        if (after != null) afterMin[r.id] = after;
      });
    }
    const staffBy = {}; (ss.data || []).forEach(r => { staffBy[r.session_id] = r; });
    const isKids = x => /class \d+ of \d+|week session|catch up class/i.test(x.title || '');
    const dayRow = sessions.filter(x => !isKids(x)).map(x => staffBy[x.id]).find(r => r && ROLES.some(([f]) => String(r[f] || '').trim())) || {};

    // the people on shift (one row each)
    const people = (team.data || []).map(p => ({ id: p.staff_id, name: p.nickname || p.full_name || p.name || 'Someone', show: p.name || p.nickname || 'Someone',
      start: toMin(p.start_time), end: toMin(p.end_time), roles: [], job: '', hired: null, role: '' }));
    // every shift that day (the Day plan's list is approved shifts only): ids for changing them, and drafts as their own rows
    let dr = await sb.from('staff_shifts').select('id, staff_id, start_time, end_time, status, note, studio_hours').eq('studio_id', st).eq('shift_date', date);
    if (dr.error) dr = await sb.from('staff_shifts').select('id, staff_id, start_time, end_time, status, note').eq('studio_id', st).eq('shift_date', date);
    if (dr.error) dr = await sb.from('staff_shifts').select('id, staff_id, start_time, end_time, status').eq('studio_id', st).eq('shift_date', date);   // (before shift_day_notes.sql)
    (dr.data || []).forEach(x => { const p = people.find(z => z.id === x.staff_id); if (p && x.status !== 'draft') { p.shiftId = String(x.id); p.status = x.status; p.note = x.note || ''; p.studioH = x.studio_hours != null ? +x.studio_hours : null; } });
    const drafts = (dr.data || []).filter(x => x.status === 'draft' && x.start_time && x.end_time && !people.some(p => p.id === x.staff_id));
    if (drafts.length) {
      const dp = await sb.from('staff_profiles').select('id, display_name, preferred_name, nickname').in('id', [...new Set(drafts.map(x => x.staff_id))]);
      const nm = {}; (dp.data || []).forEach(r => { nm[r.id] = r; });
      drafts.forEach(x => { const r = nm[x.staff_id] || {};
        people.push({ id: x.staff_id, name: (r.nickname || '').trim() || (r.preferred_name || '').trim() || r.display_name || 'Someone',
          show: (r.preferred_name || '').trim() || r.display_name || r.nickname || 'Someone', start: toMin(x.start_time), end: toMin(x.end_time), roles: [], job: '', hired: null, role: '', draft: true,
          shiftId: String(x.id), status: 'draft', note: x.note || '', studioH: x.studio_hours != null ? +x.studio_hours : null }); });
      people.sort((a, b) => a.start - b.start || a.show.localeCompare(b.show));
    }
    // their job (manager / coordinator) and hire date (seniority), from their staff profile; and anyone deactivated
    if (people.length) {
      const prof = await sb.from('staff_profiles').select('id, role, hire_date, is_active, termination_date').in('id', people.map(p => p.id));
      (prof.data || []).forEach(r => { const p = people.find(x => x.id === r.id); if (p) { p.job = String(r.role || ''); p.hired = r.hire_date || null;
        p.gone = r.is_active === false ? 'deactivated' : r.termination_date && r.termination_date < date ? 'past their last day' : ''; } });
    }
    const findPerson = n => { const k = key(n); if (!k) return null;
      return people.find(p => key(p.name) === k || key(p.show) === k) || people.find(p => key(p.show).split(' ')[0] === k.split(' ')[0]) || null; };
    ROLES.forEach(([f, label]) => { const p = findPerson(dayRow[f]); if (p && !p.role) p.role = label; });
    const rolesFromPlan = people.some(p => p.role);
    if (!rolesFromPlan) autoRoles(people);   // (nothing set in the Day plan: automatic)
    else people.forEach(p => { if (!p.role) p.role = 'Circler'; });

    // the blocks
    const blocks = [];
    const demoers = people.filter(p => p.role === 'Demoer');
    const director = people.find(p => p.role === 'Director') || null;
    // (busy, or not on shift for the whole of it)
    const busyAt = (pid, a, z) => { const p = people.find(x => x.id === pid);
      return !p || a < p.start || z > p.end || blocks.some(b => b.person === pid && a < b.end && z > b.start); };
    // breaks first (the Day plan's roles: "12:30-1:00"), so nobody is picked to demo or teach on their break
    ROLES.forEach(([f]) => {
      const p = findPerson(dayRow[f]); const m = String(dayRow['break_' + f] || '').match(/(\d{1,2}):(\d{2})\D+(\d{1,2}):(\d{2})/);
      if (!p || !m || blocks.some(b => b.kind === 'brk' && b.person === p.id)) return;
      const h = v => { v = +v; return v < 8 ? v + 12 : v; };
      blocks.push({ id: 'b-' + p.id, kind: 'brk', title: 'Break', sub: '', start: h(m[1]) * 60 + +m[2], end: h(m[3]) * 60 + +m[4], person: p.id });
    });
    const partyTimes = {};   // session id → ['60/45', …] (each party booking's art / party time after)
    sessions.slice().sort((a, b) => toMin(a.session_time) - toMin(b.session_time)).forEach(x => {
      const n = booked[x.id] || 0, t0 = toMin(x.session_time), title = String(x.title || '');
      if (x.show === false && !n) return;
      if (/camp|pa day|pd day|pa\/pd/i.test(title)) return;   // (camps have their own team)
      if (/wheel/i.test(title)) {
        // (Nov 8 2026) the wheel is always ONE person: wheel times that overlap (a Clay Wheel class and a Wheel Workshop at 7:30)
        // share one block and one wheel teacher, with everyone at the wheel added together
        if (!n) return;
        const len = Math.max(LEN.wheel, +x.duration_minutes || 0), short = title.split('|')[0].trim();
        const w = blocks.find(b => b.kind === 'wheel' && t0 < b.end && t0 + len > b.start);
        const set = findPerson((staffBy[x.id] || {}).wheel_teacher) || findPerson((staffBy[x.id] || {}).teacher);
        if (w) {
          w.sessions.push(x.id); w.n += n; w.end = Math.max(w.end, t0 + len); w.start = Math.min(w.start, t0);
          if (!w.title.includes(short)) w.title += ' + ' + short;
          w.sub = `${w.n} at the wheel · one teacher`;
          if (!w.person && set) w.person = set.id;
        } else {
          blocks.push({ id: 'w-' + x.id, kind: 'wheel', session: x.id, sessions: [x.id], n, title: short, sub: `${n} booked · ${len} min`, start: t0, end: t0 + len, person: set ? set.id : null });
        }
        return;
      }
      if (isKids(x)) {
        if (!n) return;   // (nobody enrolled: not running)
        const len = Math.max(LEN.kids, +x.duration_minutes || 0);
        let p = findPerson((staffBy[x.id] || {}).teacher), auto = false;
        if ((staffBy[x.id] || {}).teacher === 'none') { blocks.push({ id: 'k-' + x.id, kind: 'kids', session: x.id, title: title.split('|')[0].trim(), sub: `${n} enrolled`, start: t0, end: t0 + len, person: null, notNeeded: true }); return; }
        if (!p) { p = demoers.find(d => !busyAt(d.id, t0, t0 + len)) || (director && !busyAt(director.id, t0, t0 + len) ? director : null); auto = !!p; }
        blocks.push({ id: 'k-' + x.id, kind: 'kids', session: x.id, title: title.split('|')[0].trim(), sub: `${n} enrolled · ${len} min${auto ? ' · auto' : ''}`, start: t0, end: t0 + len, person: p ? p.id : null, auto });
      } else if (false) {   // (wheel times are handled above: one block, one teacher)
        const p = null;
        blocks.push({ id: 'w-' + x.id, kind: 'wheel', session: x.id, title, sub: `${n} booked · ${LEN.wheel} min`, start: t0, end: t0 + LEN.wheel, person: p ? p.id : null });
      } else if (x.session_type === 'party') {
        partyBk.filter(b => b.session_id === x.id).forEach(b => {
          const d = (pd.data || []).find(z => z.booking_id === b.id) || {};
          // an Adult Get-Together or team building: only the intro (the first 15 minutes), then it runs like a workshop
          const intro = /get.?together|team\s*building/i.test(title);
          // (Nov 8 2026) the staffing rules: a field trip is 1 teacher per 30 children, for its whole time (2 hours unless set)
          const field = /field\s*trip/i.test(title);
          const len = intro ? LEN.intro : field ? Math.max(60, +x.duration_minutes || 120) : d.actual_art_time ? (/90/.test(String(d.actual_art_time)) ? 90 : 60) : art90[b.id] ? 90 : 60;
          // (Nov 9 2026) art / party time after, e.g. 60/45 or 90/0 (party_details first: a later change; else the order)
          if (!intro && !field) { const dk = Object.keys(d).find(k => /after/i.test(k) && d[k] != null && d[k] !== '');
            const dv = dk ? String(d[dk]) : null, dm = dv ? dv.match(/(\d+)/) : null;
            const aft = dm ? +dm[1] : dv && /^\s*(no|none)\b/i.test(dv) ? 0 : afterMin[b.id];
            (partyTimes[x.id] = partyTimes[x.id] || []).push(len + '/' + (aft != null ? aft : '?')); }
          let t1 = findPerson(d.party_teacher1), t2 = findPerson(d.party_teacher2), auto1 = false;
          const off1 = d.party_teacher1 === 'none', off2 = d.party_teacher2 === 'none';
          // (Nov 8 2026) no teacher set: someone free for the whole party (the Demoer, then the Director, then anyone on shift), marked auto
          if (!t1 && !off1) {
            const order = demoers.concat(director ? [director] : []).concat(people.filter(q => q.role !== 'Demoer' && q !== director));
            t1 = order.find(q => !busyAt(q.id, t0, t0 + len)) || null; auto1 = !!t1;
          }
          const guestsSet = +d.expected_guests || +b.estimated_attendance || 0, guests = guestsSet || (field ? '' : 8);
          blocks.push({ id: 'p1-' + b.id, kind: 'party', session: x.id, booking: b.id, slot: 1, title, sub: `${guestsSet ? guests + (field ? ' children · ' : ' guests · ') : field ? 'children not set · ' : '~8 guests (not set) · '}${len} min ${intro ? 'intro' : field ? 'field trip' : 'art time'}${auto1 ? ' · auto' : ''}`, start: t0, end: t0 + len, person: t1 ? t1.id : null, notNeeded: off1 });
          if (t2 || off2 || (field ? +guests > 30 : !intro && +guests > 15) || (intro && +guests > 20)) blocks.push({ id: 'p2-' + b.id, kind: 'party', session: x.id, booking: b.id, slot: 2, title, sub: `second teacher · ${len} min`, start: t0, end: t0 + len, person: t2 ? t2.id : null, notNeeded: off2 });
        });
      } else {
        if (!n) return;   // (nobody booked yet: nothing to demo)
        // the demo: someone set for this time, else the first free demoer, else the Director
        const set = findPerson((staffBy[x.id] || {}).demo_by), offD = (staffBy[x.id] || {}).demo_by === 'none';
        const p = offD ? null : set || demoers.find(d => !busyAt(d.id, t0, t0 + LEN.demo)) || (director && !busyAt(director.id, t0, t0 + LEN.demo) ? director : null);
        blocks.push({ id: 'd-' + x.id, kind: 'demo', session: x.id, n, title, sub: `${n} booked · demo ${LEN.demo} min`, start: t0, end: t0 + LEN.demo, person: p ? p.id : null, notNeeded: offD,
          runEnd: t0 + (+x.duration_minutes || 120) });
      }
    });
    // (Nov 9 2026) from the first shift, block or open/booked time to the last one's end (an empty day: 9am-5pm)
    const sesSpan = sessions.filter(x => x.show !== false && ((booked[x.id] || 0) > 0 || x.spaces_left_cache === null || +x.spaces_left_cache > 0))
      .map(x => { const a = toMin(x.session_time); return [a, a + (+x.duration_minutes || 90)]; });
    const starts = people.map(p => p.start).concat(blocks.map(b => b.start), sesSpan.map(z => z[0])), ends = people.map(p => p.end).concat(blocks.map(b => b.runEnd || b.end), sesSpan.map(z => z[1]));
    let lo = starts.length ? Math.min(...starts) : 9 * 60, hi = ends.length ? Math.max(...ends) : 17 * 60;
    lo = Math.floor(lo / 60) * 60; hi = Math.ceil(hi / 60) * 60;
    const PARTY_DEFAULT = 8;   // (and partyTimes: art / after for each party, set above)   // (a party with no number set counts as 8 guests, shown as an estimate)
    const partyGuests = {}, partyUnknown = {};
    const guestsOf = b => { const d = (pd.data || []).find(z => z.booking_id === b.id) || {}; return +d.expected_guests || +b.estimated_attendance || null; };
    partyBk.forEach(b => { const g = guestsOf(b);
      partyGuests[b.session_id] = (partyGuests[b.session_id] || 0) + (g || PARTY_DEFAULT); if (!g) partyUnknown[b.session_id] = (partyUnknown[b.session_id] || 0) + 1; });
    // time off and unavailability this day: the studio's team and anyone with a shift (staff_time_off, staff_unavailability)
    const off = {}, offNames = {};
    try {
      const tr = await sb.rpc('hub_board_staff', { p_studio: st });
      const team = (tr.data || []).filter(x => x.here); team.forEach(x => { offNames[x.id] = x.name; });
      const ids = [...new Set(team.map(x => x.id).concat(people.map(p => p.id)))];
      people.forEach(p => { offNames[p.id] = p.show; });
      if (ids.length) {
        const dow = new Date(date + 'T12:00:00').getDay();
        const [tor, unr] = await Promise.all([
          sb.from('staff_time_off').select('staff_id, start_time, end_time, status').in('staff_id', ids).in('status', ['approved', 'pending']).lte('start_date', date).gte('end_date', date),
          sb.from('staff_unavailability').select('staff_id, day_of_week, start_time, end_time, effective_from, effective_to').in('staff_id', ids).eq('day_of_week', dow)]);
        (tor.data || []).forEach(o => (off[o.staff_id] = off[o.staff_id] || []).push({ kind: 'toff', pending: o.status === 'pending',
          from: o.start_time ? toMin(o.start_time) : null, to: o.end_time ? toMin(o.end_time) : null }));
        (unr.data || []).filter(u => (!u.effective_from || u.effective_from <= date) && (!u.effective_to || u.effective_to >= date))
          .forEach(u => (off[u.staff_id] = off[u.staff_id] || []).push({ kind: 'unav', from: u.start_time ? toMin(u.start_time) : null, to: u.end_time ? toMin(u.end_time) : null }));
      }
    } catch (e) {}
    let dayNote = '';
    try { const dn = await sb.from('hub_day_notes').select('note').eq('studio_id', st).eq('day', date).maybeSingle(); dayNote = (dn.data && dn.data.note) || ''; } catch (e) {}
    let inbox = [];
    try { const ib = await sb.rpc('hub_inbox_mine'); inbox = (ib.data || []).filter(x => x.studio_id === st && String(x.day || '').slice(0, 10) === date); } catch (e) {}
    D = { st, date, people, blocks, lo, hi, sessions, booked, partyTimes, rolesFromPlan, startRoles: people.map(p => [p.id, p.role]), inbox, partyGuests, partyUnknown, partyBk, pd: pd.data || [], off, offNames, dayNote };
    START = JSON.parse(JSON.stringify(blocks));
    // (Nov 9 2026) 🔒 is the day locked from the nightly run? (day_lock.sql; quietly skipped if not set up)
    D.lock = null; lockBtn();
    sb.rpc('hub_day_locks', { p_studio: st, p_from: date, p_to: date }).then(r => { if (!r.error && D && D.st === st && D.date === date) { D.lock = (r.data || [])[0] || null; lockBtn(); draw(); } }, () => {});
    // breaks suggested straight away for anyone on a long shift without one (saved with Save the day)
    const br = suggestBreaks();
    if (br.added || br.missed.length) D.flash = [br.added ? `${br.added} break${br.added === 1 ? '' : 's'} suggested (dashed): Save the day to keep ${br.added === 1 ? 'it' : 'them'}` : '',
      br.missed.length ? `no time found for a break for ${br.missed.join(', ')}` : ''].filter(Boolean).join(' · ');
    draw();
  } catch (e) {
    $('main').innerHTML = `<div class="msg"><b>Couldn't load that day.</b><br>${esc(e.message || e)}</div>`;
  }
}

// Roles for the day: Director = the manager or coordinator on shift (the most senior if more than one); Demoer = of everyone
// else, the least seniority (most recent hire date), all day; everyone else Circler, by seniority.
function autoRoles(people) {
  const senior = (a, b) => String(a.hired || '9999').localeCompare(String(b.hired || '9999'));   // (earliest hire first)
  people.forEach(p => { p.role = ''; });
  const leads = people.filter(p => /manager|coordinator|director/i.test(p.job)).sort(senior);
  // (no manager or coordinator on shift: the most senior person directs)
  const dir = leads[0] || (people.length > 1 ? people.slice().sort(senior)[0] : null); if (dir) dir.role = 'Director';
  const rest = people.filter(p => p !== dir).sort(senior);
  if (rest.length) rest[rest.length - 1].role = 'Demoer';   // (the least seniority)
  rest.forEach(p => { if (!p.role) p.role = 'Circler'; });
  if (!dir && people.length === 1) people[0].role = 'Demoer';
}
function setRole(pid, role) {
  const p = D.people.find(x => x.id === pid); if (!p) return;
  if (role === 'Director' || role === 'Demoer') D.people.forEach(x => { if (x !== p && x.role === role) x.role = 'Circler'; });   // (one each)
  p.role = role; p.roleSet = true; draw();
}

// ---- problems: two things at once, outside the shift, teaching during a break, two breaks at once ----
function problems() {
  const bad = {}, list = [];
  const per = {}; D.blocks.forEach(b => { if (b.person) (per[b.person] = per[b.person] || []).push(b); });
  Object.entries(per).forEach(([pid, bs]) => {
    const p = D.people.find(x => x.id === pid);
    bs.forEach((b, i) => {
      if (p && (b.start < p.start || b.end > p.end)) { bad[b.id] = 1; list.push(`${p.show}: ${b.title} (${fmt(b.start)}) is outside their shift (${fmt(p.start)}–${fmt(p.end)})`); }
      bs.slice(i + 1).forEach(c => { if (b.start < c.end && c.start < b.end && !shareOk(b, c)) { bad[b.id] = bad[c.id] = 1;
        list.push(`${p ? p.show : 'Someone'}: ${b.kind === 'brk' ? 'break' : b.title} and ${c.kind === 'brk' ? 'break' : c.title} overlap at ${fmt(Math.max(b.start, c.start))}`); } });
    });
  });
  D.blocks.filter(b => !b.person && !b.notNeeded).forEach(b => { bad[b.id] = 1; list.push(`${b.title} at ${fmt(b.start)} has nobody`); });
  D.people.forEach(p => { const c = offClashDay(p.id, p.start, p.end); if (c.length) list.push(`${p.show} has a shift but is ${c.map(offText).join(' and ')}: change or remove the shift`); });
  D.people.filter(p => p.gone).forEach(p => list.push(`${p.show} is ${p.gone} but has a shift this day: remove it (✕) or give their work to someone else`));
  // (Nov 9 2026) the 5-hour rule: a break on every shift over 5 hours, with no more than 5 hours of work before or after it
  D.people.forEach(p => {
    if (p.end - p.start <= BRK_MAX) return;
    const b = D.blocks.find(z => z.kind === 'brk' && z.person === p.id);
    if (!b) { list.push(`${p.show} (${fmt(p.start)}–${fmt(p.end)}) has no break: over 5 hours needs one (Suggest breaks)`); return; }
    if (brkBad(p, b)) { bad[b.id] = 1; const w = brkWindow(p);
      list.push(`${p.show}'s break at ${fmt(b.start)} leaves ${b.start - p.start > BRK_MAX ? Math.round((b.start - p.start) / 6) / 10 + ' hours before it' : Math.round((p.end - b.end) / 6) / 10 + ' hours after it'}: over the 5-hour rule (between ${fmt(w.from)} and ${fmt(w.to)} works)`); }
  });
  // breaks never at the same time: someone is always on
  const brks = D.blocks.filter(b => b.kind === 'brk' && b.person);
  brks.forEach((b, i) => brks.slice(i + 1).forEach(c => { if (b.start < c.end && c.start < b.end) { bad[b.id] = bad[c.id] = 1;
    const n = id => (D.people.find(p => p.id === id) || {}).show || 'Someone';
    list.push(`${n(b.person)} and ${n(c.person)} are on break at the same time (${fmt(Math.max(b.start, c.start))}): someone always needs to be on`); } }));
  return { bad, list };
}

// ---- planning: suggest breaks, assign demos (anything moved by hand stays put) ----
// free on the floor at minute m (on shift, not in any block), and whether anything's running then
function freeAt(m, blocks) {
  const on = D.people.filter(p => p.start <= m && p.end > m);
  const busy = new Set(blocks.filter(b => b.person && b.start <= m && b.end > m).map(b => b.person));
  return on.filter(p => !busy.has(p.id)).length;
}
const runningAt = m => D.blocks.some(b => b.kind !== 'brk' && b.start <= m && (b.runEnd || b.end) > m);
const busyFor = (pid, a, z, blocks, except) => blocks.some(b => b !== except && b.person === pid && a < b.end && z > b.start && !(except && shareOk(b, except)));
// the lowest "free on the floor" over a stretch, while something's running (99 when nothing is)
function minFree(a, z, blocks) { let lo = 99; for (let m = a; m < z; m += STEP) if (runningAt(m)) lo = Math.min(lo, freeAt(m, blocks)); return lo; }

// (Nov 9 2026) The 5-hour rule: nobody works more than 5 hours without a break, before it AND after it. So a 30-minute break
// starts no later than 5 hours in, and ends no earlier than 5 hours before the shift ends (and not in the first 2 hours or
// the last hour, when there's room). E.g. 8:30a-5p: the break starts between 11:30 and 1:30.
const BRK_LEN = 30, BRK_MAX = 300;
function brkWindow(p) {
  const from = Math.max(p.start + 120, p.end - BRK_MAX - BRK_LEN), to = Math.min(p.start + BRK_MAX, p.end - 60);
  return from <= to ? { from, to } : { from: Math.max(p.start, p.end - BRK_MAX - BRK_LEN), to: Math.min(p.start + BRK_MAX, p.end - BRK_LEN) };
}
// a break that breaks the rule: more than 5 hours of work before it, or after it
function brkBad(p, b) { return !!(p && b && (b.start - p.start > BRK_MAX || p.end - b.end > BRK_MAX)); }
// A 30-minute break for each shift over 5 hours without one (or whose suggested break breaks the 5-hour rule), within the
// window above, never during their own teaching or demos, where the most people stay free on the floor; nearest the middle on a tie.
// A break moved by hand is never moved (it's flagged in Problems instead).
function suggestBreaks() {
  let added = 0; const missed = [];
  D.people.forEach(p => { const b = D.blocks.find(z => z.kind === 'brk' && z.person === p.id);
    if (b && !b.locked && (p.end - p.start <= BRK_MAX || brkBad(p, b))) D.blocks = D.blocks.filter(z => z !== b); });   // (redone below)
  D.people.filter(p => p.end - p.start > BRK_MAX && !D.blocks.some(b => b.kind === 'brk' && b.person === p.id))
    .sort((a, b) => a.start - b.start).forEach(p => {
      const mid = p.start + (p.end - p.start) / 2, w = brkWindow(p), from = w.from, to = w.to;
      let best = null;
      for (let t = Math.ceil(from / STEP) * STEP; t <= to; t += STEP) {
        if (busyFor(p.id, t, t + 30, D.blocks)) continue;
        if (D.blocks.some(b => b.kind === 'brk' && b.person && b.person !== p.id && t < b.end && t + 30 > b.start)) continue;   // (never two breaks at once)
        const trial = D.blocks.concat([{ person: p.id, start: t, end: t + 30, kind: 'brk' }]);
        const score = [Math.min(minFree(t, t + 30, trial), 2), -Math.abs(t + 15 - mid)];
        if (!best || score[0] > best.score[0] || (score[0] === best.score[0] && score[1] > best.score[1])) best = { t, score };
      }
      if (!best) { missed.push(p.show); return; }
      D.blocks.push({ id: 'b-' + p.id + '-s', kind: 'brk', title: 'Break', sub: 'suggested', start: best.t, end: best.t + 30, person: p.id });
      added++;

}

// Each demo (and any kids class or party with nobody) to the best person free then: the day's Demoers first, keeping someone
// free on the floor where possible, and sharing the demos out evenly. Wheel stays as set (it needs a wheel-ready teacher).
function assignDemos() {
  let changed = 0, nobody = 0;
  const load = {}; D.blocks.filter(b => b.person && b.kind !== 'brk').forEach(b => { load[b.person] = (load[b.person] || 0) + (b.end - b.start); });
  const todo = D.blocks.filter(b => !b.locked && !b.notNeeded && (b.kind === 'demo' || b.auto || (!b.person && (b.kind === 'kids' || b.kind === 'party')))).sort((a, b) => a.start - b.start);
  todo.forEach(b => { if (b.person) load[b.person] -= (b.end - b.start); b.person = null; });   // (start fresh for these)
  todo.forEach(b => {
    const cands = D.people.filter(p => p.start <= b.start && p.end >= b.end && !busyFor(p.id, b.start, b.end, D.blocks, b));
    let best = null;
    cands.forEach(p => {
      const trial = D.blocks.map(x => x === b ? Object.assign({}, b, { person: p.id }) : x);
      const keepsFloor = minFree(b.start, b.end, trial) >= 1 ? 1 : 0;
      const demoer = p.role === 'Demoer' ? 1 : 0;
      // a demo: the day's Demoer whenever they're free; a class or party with nobody: anyone, keeping the floor covered
      const score = b.kind === 'demo' ? [demoer, keepsFloor, p.role === 'Director' ? 0 : 1, -(load[p.id] || 0)] : [keepsFloor, demoer ? 0 : 1, -(load[p.id] || 0)];
      if (!best || better(score, best.score)) best = { p, score };
    });
    const was = (START.find(s => s.id === b.id) || {}).person || null;
    if (best) { b.person = best.p.id; load[best.p.id] = (load[best.p.id] || 0) + (b.end - b.start); } else nobody++;
    if (b.person !== was) changed++;

  return { changed, nobody };
}
// a beats b: compare score lists in order (the first difference decides)
function better(a, b) { for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return a[i] > b[i]; return false; }
function planDay(which) {
  if (!D) return;
  const parts = [];
  if (which === 'all' && !D.rolesFromPlan && !D.people.some(p => p.roleSet)) { autoRoles(D.people); parts.push('roles set (Director, Demoer, Circlers)'); }
  if (which !== 'demo') { const r = suggestBreaks(); parts.push(r.added ? `${r.added} break${r.added === 1 ? '' : 's'} suggested` : 'No breaks needed (or already set)'); if (r.missed.length) parts.push(`no time found for a break for ${r.missed.join(', ')}`); }
  if (which !== 'brk') {
    let given = 0;
    D.blocks.filter(b => b.kind === 'party' && !b.person && !b.locked && !b.notNeeded).sort((a, b) => a.start - b.start).forEach(b => {
      const order = D.people.filter(p => p.role === 'Demoer').concat(D.people.filter(p => p.role === 'Director')).concat(D.people.filter(p => !['Demoer', 'Director'].includes(p.role)));
      const p = order.find(q => b.start >= q.start && b.end <= q.end && !busyFor(q.id, b.start, b.end, D.blocks, b));
      if (p) { b.person = p.id; given++; }
    });
    if (given) parts.push(`${given} part${given === 1 ? 'y' : 'ies'} given a teacher`);
  }
  if (which !== 'brk') { const r = assignDemos(); parts.push(`${r.changed} demo${r.changed === 1 ? '' : 's'} or class${r.changed === 1 ? '' : 'es'} given out`); if (r.nobody) parts.push(`${r.nobody} still need someone (everyone's busy)`); }
  D.flash = parts.join(' · ') + '. Look it over: drag anything to change it.';

}

function startDrag(e, el) {
  const b = D.blocks.find(z => z.id === el.dataset.id); if (!b) return;
  e.preventDefault();
  const r = el.getBoundingClientRect(), ox = e.clientX - r.left, oy = e.clientY - r.top, x0 = e.clientX, y0 = e.clientY;
  let ghost = null, moved = false, overRow = null;
  const move = ev => {
    if (!moved && Math.abs(ev.clientX - x0) + Math.abs(ev.clientY - y0) < 5) return;
    if (!moved) { moved = true; ghost = el.cloneNode(true); ghost.classList.add('ghost'); ghost.style.width = r.width + 'px'; ghost.style.height = r.height + 'px'; document.body.appendChild(ghost); el.classList.add('dragging'); }
    const gx = b.kind === 'brk' ? ev.clientX - ox : r.left;   // (a break moves along the day; anything else keeps its time)
    ghost.style.left = gx + 'px'; ghost.style.top = (b.kind === 'brk' ? r.top : ev.clientY - oy) + 'px';
    if (b.kind !== 'brk') {
      ghost.style.display = 'none'; const under = document.elementFromPoint(ev.clientX, ev.clientY); ghost.style.display = '';
      const row = under && under.closest('.row[data-person]');
      if (overRow && overRow !== row) overRow.classList.remove('drop-ok');
      if (row) row.classList.add('drop-ok'); overRow = row;
    }
  };
  const up = ev => {
    document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up);
    if (overRow) overRow.classList.remove('drop-ok');
    if (ghost) ghost.remove(); el.classList.remove('dragging');
    if (!moved) { openPop(el); return; }
    if (b.kind === 'brk') {
      const dm = Math.round((ev.clientX - x0) / PX / STEP) * STEP, len = b.end - b.start;
      b.start = Math.max(D.lo, Math.min(D.hi - len, b.start + dm)); b.end = b.start + len;
    } else if (overRow) {
      b.person = overRow.dataset.person || null;
    }
    b.locked = true;
    draw();
  };
  document.addEventListener('pointermove', move); document.addEventListener('pointerup', up);
}

const KIDS = /class \d+ of \d+|week session|catch up class/i, PA = /\bp[ad] day|pa\/pd|no[\s-]school/i;
// An empty kids class is left out only once its class has started (nobody can join partway): Class 2 or later, or a Class 1 /
// sign-up time on or before today. One that hasn't started yet is still open for registration, so it shows (even at 0).
function kidsStarted(x) {
  const m = String(x.title || '').match(/class\s+(\d+)\s+of\s+\d+/i);
  if (m && +m[1] >= 2) return true;
  return String(x.session_date || '').slice(0, 10) <= localDate(new Date());
}

async function loadWeek() {

      sb.rpc('get_staffing_need', { p_studio_id: st, p_from: from, p_to: to }),

      .in('staff_id', staffIds).neq('studio_id', st).gte('shift_date', from).lte('shift_date', to).not('start_time', 'is', null) : { data: [] };
    const [toffR, unavR] = staffIds.length ? await Promise.all([
      sb.from('staff_time_off').select('id, staff_id, start_date, end_date, start_time, end_time, status, type, note').in('staff_id', staffIds).in('status', ['approved', 'pending']).lte('start_date', to).gte('end_date', from),
      sb.from('staff_unavailability').select('staff_id, day_of_week, start_time, end_time, effective_from, effective_to').in('staff_id', staffIds)
    ]) : [{ data: [] }, { data: [] }];
    let prof = staffIds.length ? await sb.from('staff_profiles').select('id, display_name, preferred_name, is_active, termination_date, role, hire_date, home_studio_id, min_weekly_hours, max_weekly_hours, max_studio_days_per_week, on_call, on_call_until, aim_40').in('id', staffIds) : { data: [] };
    if (prof.error) prof = await sb.from('staff_profiles').select('id, display_name, preferred_name, is_active, termination_date').in('id', staffIds);   // (older columns only)
    const profiles = {}; (prof.data || []).forEach(p => { profiles[p.id] = p; });
    const names = {}, gone = {}; (prof.data || []).forEach(p => { names[p.id] = (p.preferred_name || '').trim() || p.display_name || 'Someone';
      if (p.is_active === false) gone[p.id] = 'deactivated'; else if (p.termination_date && p.termination_date < to) gone[p.id] = 'last day ' + dayLabel(p.termination_date); });
    const days = Array.from({ length: 7 }, (_, i) => addDays(from, i));
    const dayNotes = {};
    try { const dn = await sb.from('hub_day_notes').select('day, note').eq('studio_id', st).gte('day', from).lte('day', to); (dn.data || []).forEach(x => { dayNotes[x.day] = x.note; }); } catch (e) {}
    const locks = {};

    W = { locks, dayNotes, st, from, to, days, sessions, booked, need: need.error ? [] : (need.data || []), needErr: need.error ? need.error.message : '',
          shifts: shifts.data || [], names, gone, team, profiles, toff: toffR.data || [], unav: unavR.data || [], elsewhere: elseR.data || [], inbox: (inbox.data || []).filter(x => x.studio_id === st && x.day && String(x.day).slice(0, 10) >= from && String(x.day).slice(0, 10) <= to) };
    drawWeek();

// need vs scheduled for one day, in 30-minute blocks (the same counting as the nightly staffing check)
function weekCoverage(d) {
  const lo = 8 * 60, hi = 22 * 60, n = (hi - lo) / 30, need = Array(n).fill(0), ppl = Array(n).fill(0), on = Array(n).fill(false), have = Array(n).fill(0);
  W.need.filter(r => String(r.session_date).slice(0, 10) === d && r.start_time && r.end_time).forEach(r => {
    const a = Math.max(0, Math.floor((toMin(r.start_time) - lo) / 30)), z = Math.min(n, Math.ceil((toMin(r.end_time) - lo) / 30));
    for (let i = a; i < z; i++) { on[i] = true; if (r.rule_kind === 'pooled') ppl[i] += +r.expected || 0; else need[i] += +r.teachers || 0; }
  });
  for (let i = 0; i < n; i++) { if (ppl[i] > 0) need[i] += Math.ceil(ppl[i] / 25); if (on[i] && need[i] < 1) need[i] = 1; }
  const dayShifts = W.shifts.filter(x => x.shift_date === d && x.start_time && x.end_time);
  const approved = dayShifts.filter(x => x.status !== 'draft'), use = approved.length ? approved : dayShifts;
  use.forEach(x => { const a = Math.max(0, Math.floor((toMin(x.start_time) - lo) / 30)), z = Math.min(n, Math.ceil((toMin(x.end_time) - lo) / 30)); for (let i = a; i < z; i++) have[i]++; });
  const cls = need.map((v, i) => have[i] < v ? 'short' : have[i] > v ? (v > 0 || have[i] > 0 ? 'over' : 'idle') : v > 0 ? 'ok' : 'idle');
  const hrs = arr => Math.round(arr.reduce((t, v) => t + v, 0) * 5) / 10;
  const paidH = Math.round(use.reduce((t, x) => t + (toMin(x.end_time) - toMin(x.start_time) > 300 ? 30 : 0), 0) / 6) / 10;   // (the unpaid breaks)
  return { cls, needH: hrs(need), haveH: Math.max(0, Math.round((hrs(have) - paidH) * 10) / 10), drafts: !approved.length && dayShifts.length > 0, lo };
}

  $('prev').onclick = () => stepTo(-1);
  $('next').onclick = () => stepTo(1);
  $('reset').onclick = () => { if (START) { D.blocks = JSON.parse(JSON.stringify(START)); D.people.forEach(p => { p.role = (D.startRoles.find(r => r[0] === p.id) || [])[1] || p.role; p.roleSet = false; }); draw(); } };
  $('wkstart').value = WEEK_MON ? 'mon' : 'sun';
  $('save').onclick = saveDay; $('sendupd').onclick = sendUpdates; notifyBar(); $('addsh').onclick = () => D && dayShiftAdd(); $('addws').onclick = () => D && dayWorkshopAdd(); $('lockday').onclick = () => D && dayLockToggle(); $('pub').onclick = () => D && dayPublish();
  $('plan').onclick = () => planDay('all'); $('brk').onclick = () => planDay('brk'); $('demo').onclick = () => planDay('demo');
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('main').innerHTML = `<div class="msg"><b>Sign in to the Hub first</b> (with a home office login), then come back to this page. <a href="hub.html">Open the Hub</a></div>`; return; }
  const ok = await sb.rpc('admin_can', { p_section: 'ops', p_level: 'view' });
  if (ok.error || ok.data !== true) { $('main').innerHTML = '<div class="msg">This page is for home office logins with Studio Ops access.</div>'; return; }
  setMode(qs.get('view') === 'week' ? 'week' : 'day');
})();
</script>
</body>
</html>
