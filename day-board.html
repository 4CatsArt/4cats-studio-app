<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Day and week board · 4Cats Hub</title>
<!-- day-board.html (Nov 8 2026): a try-out. One studio's day, by person: who teaches, demos and takes breaks when, and how many
     are free on the floor. Drag a block onto someone to give it to them; drag a break sideways to move it. Nothing is saved yet:
     the Changes list shows what you've moved. Admin logins (signed in to the Hub on this site). -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"></script>
<style>
:root { --ink: #1f2a24; --muted: #6b6b63; --line: #e5e1d6; --bg: #f6f4ee; --panel: #fff;
  --kids: #dcefe0; --kids-b: #3f8a55; --wheel: #f1e1d0; --wheel-b: #a0643a; --party: #fbe0ea; --party-b: #b8436e;
  --demo: #dde9fb; --demo-b: #2f63b8; --bad: #c8232c; --warn: #f0b429; --free: #2f7d4a; }
* { box-sizing: border-box; }
body { margin: 0; font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif; color: var(--ink); background: var(--bg); font-size: 14px; }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
header h1 { font-size: 18px; margin: 0 8px 0 0; }
header select, header input, header button { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }
header button { cursor: pointer; font-weight: 600; }
header button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
header button#save { background: #2f7d4a; border-color: #2f7d4a; }
header button:disabled, header button#save:disabled { background: #f1efe8; border-color: #e2ded3; color: #a7a397; cursor: default; box-shadow: none; }
header button#sendupd { background: #fff7e0; border-color: #f0b429; color: #6b4b00; } header button#save.dirty { box-shadow: 0 0 0 3px #f0b429; }
header button:disabled { opacity: .5; cursor: default; }
.switch { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.switch button { border: 0; border-radius: 0; padding: 7px 14px; background: #fff; }
.switch button.on { background: var(--ink); color: #fff; }
body.week .day-only { display: none; } body:not(.week) .wk-only { display: none; }
/* ---- the week ---- */
.wk { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
.wk table { border-collapse: collapse; width: 100%; min-width: 1180px; table-layout: fixed; }
.wk th, .wk td { border-bottom: 1px solid #efebe1; border-left: 1px solid #f1ede3; vertical-align: top; padding: 6px; font-size: 12.5px; text-align: left; }
.wk th.lbl, .wk td.lbl { width: 150px; position: sticky; left: 0; background: var(--panel); z-index: 2; border-left: 0; }
.wk td.lbl b { display: block; font-size: 13px; } .wk td.lbl small { color: var(--muted); font-size: 11.5px; }
.wk thead th { background: #faf8f3; position: sticky; top: 0; z-index: 3; }
.wk thead th button.day { font: inherit; font-weight: 700; border: 0; background: none; padding: 0; cursor: pointer; text-decoration: underline; color: var(--ink); }
.wk thead th small { display: block; color: var(--muted); font-weight: 400; font-size: 11.5px; }
.cov { display: flex; height: 16px; border-radius: 4px; overflow: hidden; margin: 4px 0 3px; background: #f3f1ea; }
.cov i { flex: 1; } .cov i.short { background: var(--bad); } .cov i.over { background: var(--warn); } .cov i.ok { background: #8cc79d; } .cov i.idle { background: #f3f1ea; }
.wk .sh { display: block; width: 100%; text-align: left; font: inherit; font-size: 12px; font-weight: 600; border-radius: 6px; padding: 4px 6px; margin: 0 0 4px; cursor: pointer; border: 1px solid #2f7d4a; background: #2f7d4a; color: #fff; }
.wk .sh.draft { background: #e7f7ec; color: #1d4d2c; border: 1px dashed #2f9a55; }
.wk .sh small { display: block; font-weight: 400; opacity: .85; }
.wk .sh { position: relative; cursor: grab; } .wk .sh.dragging { opacity: .4; }
.wk .sh .x { position: absolute; top: 3px; right: 4px; font: inherit; font-size: 10.5px; line-height: 1; padding: 2px 4px; border-radius: 4px; border: 0; background: rgba(255,255,255,.25); color: inherit; cursor: pointer; opacity: 0; }
.wk .sh:hover .x, .wk .sh:focus-within .x { opacity: 1; } .wk .sh.draft .x { background: rgba(0,0,0,.06); }
.wk tr.gone .sh { box-shadow: 0 0 0 2px var(--bad); } .gone-tag { display: inline-block; margin: 2px 0; font-size: 10.5px; font-weight: 700; color: #fff; background: var(--bad); border-radius: 999px; padding: 1px 7px; }
.lab { display: inline-block; margin: 4px 4px 0 0; font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 1px 8px; }
.lab.ok { background: #e3f3e8; color: #1f6b3a; } .lab.mid { background: #fdf0d2; color: #8a5a00; } .lab.high { background: #fbe1e1; color: #a12a2a; }
.wk .sh.clash { box-shadow: 0 0 0 2px var(--bad); }
.off { font-size: 11.5px; font-weight: 600; border-radius: 6px; padding: 3px 6px; margin-bottom: 4px; }
.off.toff { background: #f6ead7; color: #7a5520; border: 1px solid #ead2ad; } .off.unav { background: #eeece6; color: #6b6b63; border: 1px solid #dedad0; }
.wk td.drop.over { background: #eef7f0; outline: 2px dashed #2f7d4a; outline-offset: -3px; }
.wk .add { font: inherit; font-size: 13px; color: var(--muted); border: 1px dashed transparent; background: none; border-radius: 6px; width: 100%; padding: 6px 0; cursor: pointer; opacity: .25; }
.wk td:hover .add, .wk .add:focus-visible { opacity: 1; border-color: #cfc9bb; } .wk .add.wide { opacity: .6; font-size: 12px; }
.pubwk { font: inherit; font-size: 13px; font-weight: 600; padding: 6px 14px; border-radius: 999px; border: 0; background: #2f7d4a; color: #fff; cursor: pointer; }
.wk .it { border-radius: 6px; padding: 5px 6px; margin: 0 0 4px; background: #fff7e0; border: 1px solid #f0d89a; font-size: 12px; }
.wk .it.cut { background: #fdecec; border-color: #e7a9ad; } .wk .it.short { background: #fdecec; border-color: #e7a9ad; }
.wk .it .acts { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.wk .it button, .wk .ses button { font: inherit; font-size: 11.5px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; background: #fff; cursor: pointer; }
.wk .it select { font: inherit; font-size: 11.5px; max-width: 100%; margin-top: 4px; }
.wk .ses { display: flex; gap: 4px; align-items: center; justify-content: space-between; padding: 3px 0; border-bottom: 1px dashed #eee; font-size: 12px; }
.wk .ses.closed { color: #aaa; text-decoration: line-through; } .wk .ses.closed button { text-decoration: none; }
.wk .ses.pa { font-weight: 700; }
.wk .muted { color: var(--muted); font-size: 11.5px; }
.flash { background: #fff7e0; border: 1px solid #f0d89a; border-radius: 10px; padding: 8px 12px; font-size: 13px; margin: 0 0 10px; }
header button:focus-visible, header select:focus-visible, header input:focus-visible, .blk:focus-visible { outline: 2px solid var(--demo-b); outline-offset: 2px; }
.spacer { flex: 1; }
.note { color: var(--muted); font-size: 12.5px; }
main { padding: 14px 20px 40px; }
.msg { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; max-width: 640px; line-height: 1.5; }
.key { display: flex; gap: 14px; flex-wrap: wrap; margin: 0 0 10px; font-size: 12.5px; color: var(--muted); align-items: center; }
.key i { display: inline-block; width: 18px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; border: 1px solid; }
.board { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; position: relative; }
.grid { position: relative; min-width: max-content; }
.row { display: flex; border-bottom: 1px solid #efebe1; min-height: 52px; }
.row.drop-ok { background: #f2f8f3; } .row.drop-ok .lane { background: transparent; }
.who { width: 190px; flex: none; padding: 8px 12px; position: sticky; left: 0; background: var(--panel); z-index: 5; border-right: 1px solid var(--line); }
.who b { display: block; font-size: 14px; } .who small { display: block; color: var(--muted); font-size: 11.5px; line-height: 1.4; }
.row.needs .who b { color: var(--bad); }
.who select.role { font: inherit; font-size: 11.5px; padding: 1px 4px; border: 1px solid var(--line); border-radius: 6px; margin-left: 4px; background: #fff; }
.lane { position: relative; flex: none; }
.shift { position: absolute; top: 6px; bottom: 6px; background: #f1efe8; border-radius: 6px; }
.shift.draft { background: repeating-linear-gradient(90deg, #f4f2ec 0 10px, #fbfaf6 10px 20px); border: 1px dashed #b9b2a2; }
.sh-acts { float: right; } .sh-acts button { font: inherit; font-size: 11px; border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 0 5px; margin-left: 2px; cursor: pointer; color: var(--muted); }
.sh-acts button:hover { color: var(--ink); border-color: #bbb; }
.decide { background: var(--panel); border: 1px solid #f0d89a; border-radius: 12px; padding: 10px 14px; margin: 0 0 10px; }
.decide h2 { font-size: 14px; margin: 0 0 6px; } .decide .it { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 6px 0; border-top: 1px solid #f4ecd2; font-size: 13px; }
.decide .it:first-of-type { border-top: 0; } .decide .it .t { flex: 1; min-width: 220px; } .decide .it small { color: var(--muted); display: block; }
.decide button, .decide select { font: inherit; font-size: 12px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; background: #fff; cursor: pointer; }
.pop button { white-space: nowrap; }
.ses-chip { cursor: pointer; } .ses-chip:hover { border-color: #b9b2a2; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.draft-tag { font-size: 10.5px; font-weight: 600; color: #6b6b63; border: 1px dashed #b9b2a2; border-radius: 999px; padding: 0 6px; margin-left: 4px; vertical-align: 1px; }
.hour { position: absolute; top: 0; bottom: 0; border-left: 1px solid #f1ede3; }
.times { display: flex; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 6; }
.times .who { font-size: 12px; color: var(--muted); padding-top: 10px; }
.times .lane { height: 34px; } .times .lane span { position: absolute; top: 9px; font-size: 11.5px; color: var(--muted); transform: translateX(-50%); }
.blk { position: absolute; border-radius: 6px; border: 1.5px solid; padding: 3px 6px; font-size: 11.5px; line-height: 1.25; overflow: hidden; cursor: grab; user-select: none; touch-action: none; white-space: nowrap; }
.blk b { font-weight: 600; } .blk span { display: block; opacity: .8; }
.blk.kids { background: var(--kids); border-color: var(--kids-b); } .blk.wheel { background: var(--wheel); border-color: var(--wheel-b); }
.blk.party { background: var(--party); border-color: var(--party-b); } .blk.demo { background: var(--demo); border-color: var(--demo-b); }
.blk.brk { background: repeating-linear-gradient(135deg, #ececec 0 6px, #f7f7f7 6px 12px); border-color: #9a9a9a; color: #555; }
.blk.bad { box-shadow: 0 0 0 2px var(--bad); }
.times-row { background: #fbfaf6; } .times-row .who { background: #fbfaf6; }
.ses-chip { position: absolute; border-radius: 5px; background: #fff; border: 1px solid #cfc9bb; font-size: 11.5px; padding: 3px 6px; white-space: nowrap; overflow: hidden; line-height: 16px; }
.ses-chip b { font-weight: 700; margin-right: 3px; } .ses-chip.empty { color: var(--muted); border-style: dashed; background: #fbfaf6; }
.ses-chip.closed { text-decoration: line-through; color: #aaa; } .blk.moved { border-style: dashed; }
.blk.dragging { opacity: .35; }
.ghost { position: fixed; pointer-events: none; z-index: 100; opacity: .9; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.cover { display: flex; position: sticky; bottom: 0; background: var(--panel); border-top: 2px solid var(--ink); z-index: 6; }
.cover .who b { font-size: 13px; }
.cell { position: absolute; top: 8px; bottom: 8px; border-radius: 4px; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.cell.ok { background: #e3f1e7; color: var(--free); } .cell.zero { background: var(--bad); color: #fff; } .cell.idle { background: #f3f1ea; color: #aaa; }
.side { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.panel h2 { font-size: 15px; margin: 0 0 8px; }
.panel ul { margin: 0; padding-left: 18px; } .panel li { margin: 0 0 4px; font-size: 13px; }
.pop { position: fixed; z-index: 90; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.18); padding: 10px 12px; width: 260px; }
.pop label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
.pop select { width: 100%; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; }
.pop .row2 { display: flex; gap: 6px; margin-top: 8px; } .pop button { font: inherit; padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; background: #fff; cursor: pointer; }
@media (max-width: 900px) { .side { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <h1 id="ttl">Day board</h1>
  <div class="switch" role="tablist" aria-label="View"><button id="v-day" role="tab">Day</button><button id="v-week" role="tab">Week</button></div>
  <select id="studio" aria-label="Studio"></select>
  <button id="prev" class="wk-only" aria-label="Week before">◀</button>
  <input id="date" type="date" aria-label="Day">
  <button id="next" class="wk-only" aria-label="Week after">▶</button>
  <select id="wkstart" class="wk-only" title="Which day the week starts on (remembered on this computer)" onchange="setWeekStart(this.value === 'mon')">
    <option value="mon">Mon–Sun</option><option value="sun">Sun–Sat</option></select>
  <button id="load">Show</button>
  <span class="spacer"></span>
  <button id="sendupd" style="display:none" title="Changed or published shifts: let the staff know now (their usual notification)">Send updates to staff</button>
  <button id="addsh" class="day-only" title="Add a shift for someone (a draft until you publish the day)">+ Add shift</button>
  <button id="pub" class="day-only" title="Publish the day's draft shifts: they become approved, and staff get their usual notification" style="display:none">Publish</button>
  <button id="plan" class="primary day-only" title="Roles, then breaks, then demos (anything you've moved stays put)">Plan the day</button>
  <button id="brk" class="day-only" title="A 30-minute break for everyone on a shift over 5 hours who doesn't have one">Suggest breaks</button>
  <button id="demo" class="day-only" title="Give each demo (and any class or party with nobody) to the best person free then">Assign demos</button>
  <button id="reset" class="day-only" title="Put everything back the way it was last saved">Undo</button>
  <button id="save" class="primary day-only" title="Save roles, breaks, teachers and demoers to the Day plan (the Hub's Day plan and On stage follow it)">Save the day</button>
  <span class="note wk-only">Changes here are real</span>
</header>
<main id="main"><div class="msg">Loading…</div></main>

<script>
const SUPABASE_URL = 'https://snxibhbhhchjthfmjtaj.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNueGliaGJoaGNoanRoZm1qdGFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTk2ODAsImV4cCI6MjA5MjYzNTY4MH0.K-89Mx4SxU6N1hMmtK6Q79rWAtk6VTN9b5wemQxcZVA';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const STUDIO_NAMES = {
  'BC-RICH-GC':'Richmond - Garden City','BC-RICH-STV':'Richmond - Steveston','BC-SUR-SSR':'Surrey - South','BC-YVR-KIT':'Vancouver - Kitsilano',
  'BC-YVR-MS':'Vancouver - Main Street','BC-YVR-UBC':'Vancouver - UBC','BC-YYJ-CSV':'Victoria - Cook Street Village','BC-YYJ-ESQ':'Victoria - Esquimalt',
  'BC-YYJ-OB':'Victoria - Oak Bay','BC-YYJ-VIC':'Victoria - Uptown','AB-YYC-ING':'Calgary - Inglewood','AB-STA-STA':'St Albert',
  'ON-BRL-BRL':'Burlington - South','ON-CMB-GLT':'Cambridge - Galt','ON-ERN-ERN':'Erin','ON-HAM-OS':'Hamilton - Ottawa Street',
  'ON-HAM-WD':'Hamilton - Waterdown','ON-HAM-WH':'Hamilton - West Harbour','ON-KGN-AP':'Kingston - Arlington Park','ON-LDN-BYR':'London - Byron',
  'ON-LDN-WVG':'London - Wortley Village','ON-MIS-PC':'Mississauga - Port Credit','ON-OAK-OAK':'Oakville - North','ON-OAK-WST':'Oakville - West',
  'ON-YOW-GLB':'Ottawa - The Glebe','ON-STC-STC':'St Catharines','ON-YYZ-AVE':'Toronto - Avenue Road','ON-YYZ-BP':'Toronto - Baby Point',
  'ON-YYZ-LEA':'Toronto - Leaside','ON-YYZ-BEA':'Toronto - The Beaches','ON-WTR-WTR':'Waterloo - Uptown'
};
// How long each kind keeps someone busy (minutes). Kids class: the class length setting (90); a party: its booked art time.
const LEN = { kids: 90, wheel: 90, demo: 15, intro: 15 };
// One person can demo two (or more) workshops at once when, together, they're this many people or fewer
const DEMO_SHARE_MAX = 12;
const shareOk = (a, b) => a.kind === 'demo' && b.kind === 'demo' && ((a.n || 0) + (b.n || 0)) <= DEMO_SHARE_MAX;
const ROLES = [['director', 'Director'], ['teacher', 'Demoer'], ['teacher2', 'Demoer'], ['circler', 'Circler'], ['circler2', 'Circler'], ['circler3', 'Circler']];
const PX = 2;      // pixels per minute (15 minutes = 30px)
const STEP = 15;

const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const key = n => String(n || '').trim().toLowerCase();
const toMin = t => { const [h, m] = String(t || '0:0').split(':').map(Number); return h * 60 + (m || 0); };
const fmt = m => { const h = Math.floor(m / 60), mm = m % 60; return (h % 12 || 12) + (mm ? ':' + String(mm).padStart(2, '0') : '') + (h >= 12 ? 'p' : 'a'); };
const localDate = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

let D = null;     // the loaded day: { team, people, blocks, lo, hi, sessions }
let START = null; // the blocks as loaded (for the Changes list and Undo my changes)

// ---- loading the day (the same data the Hub's Day plan uses) ----
async function load() {
  const st = $('studio').value, date = $('date').value;
  if (!st || !date) return;
  localStorage.setItem('dayboard_studio', st);
  history.replaceState(null, '', `?view=day&studio=${encodeURIComponent(st)}&date=${date}`);
  $('main').innerHTML = '<div class="msg">Loading the day…</div>';
  try {
    const [team, sess, set] = await Promise.all([
      sb.rpc('hub_team_on_date', { p_studio_id: st, p_date: date }),
      sb.from('sessions').select('id, title, session_date, session_time, session_type, duration_minutes, capacity, spaces_left_cache, show').eq('studio_id', st).eq('session_date', date).order('session_time'),
      sb.rpc('get_staffing_settings')
    ]);
    if (team.error) throw team.error;
    if (sess.error) throw sess.error;
    if (set.data && +set.data.class_min) LEN.kids = +set.data.class_min;
    if (set.data && +set.data.get_together_intro_min) LEN.intro = +set.data.get_together_intro_min;
    const sessions = (sess.data || []).filter(x => x.session_type !== 'festival');
    const ids = sessions.map(x => x.id);
    const [ss, bk] = await Promise.all([
      ids.length ? sb.from('session_staff').select('*').in('session_id', ids) : { data: [] },
      ids.length ? sb.from('bookings').select('id, session_id, qty, customer_name').in('session_id', ids).gt('qty', 0).is('returned_at', null) : { data: [] }
    ]);
    const booked = {}; (bk.data || []).forEach(b => { booked[b.session_id] = (booked[b.session_id] || 0) + (b.qty || 0); });
    // kids class weeks 2+: the week's class list (families booked the series on week 1)
    const week2 = sessions.filter(x => /\bclass\s+([2-9]|\d{2,})\s+of\s+\d+/i.test(x.title || ''));
    const rosters = await Promise.all(week2.map(x => sb.rpc('get_class_week_bookings', { p_session_id: x.id })));
    week2.forEach((x, i) => { if (!rosters[i].error) booked[x.id] = (rosters[i].data || []).reduce((n, b) => n + (b.qty || 0), 0); });
    const partyBk = (bk.data || []).filter(b => (sessions.find(x => x.id === b.session_id) || {}).session_type === 'party');
    const pd = partyBk.length ? await sb.from('party_details').select('*').in('booking_id', partyBk.map(b => b.id)) : { data: [] };
    const staffBy = {}; (ss.data || []).forEach(r => { staffBy[r.session_id] = r; });
    const isKids = x => /class \d+ of \d+|week session|catch up class/i.test(x.title || '');
    const dayRow = sessions.filter(x => !isKids(x)).map(x => staffBy[x.id]).find(r => r && ROLES.some(([f]) => String(r[f] || '').trim())) || {};

    // the people on shift (one row each)
    const people = (team.data || []).map(p => ({ id: p.staff_id, name: p.nickname || p.full_name || p.name || 'Someone', show: p.name || p.nickname || 'Someone',
      start: toMin(p.start_time), end: toMin(p.end_time), roles: [], job: '', hired: null, role: '' }));
    // every shift that day (the Day plan's list is approved shifts only): ids for changing them, and drafts as their own rows
    const dr = await sb.from('staff_shifts').select('id, staff_id, start_time, end_time, status').eq('studio_id', st).eq('shift_date', date);
    (dr.data || []).forEach(x => { const p = people.find(z => z.id === x.staff_id); if (p && x.status !== 'draft') { p.shiftId = String(x.id); p.status = x.status; } });
    const drafts = (dr.data || []).filter(x => x.status === 'draft' && x.start_time && x.end_time && !people.some(p => p.id === x.staff_id));
    if (drafts.length) {
      const dp = await sb.from('staff_profiles').select('id, display_name, preferred_name, nickname').in('id', [...new Set(drafts.map(x => x.staff_id))]);
      const nm = {}; (dp.data || []).forEach(r => { nm[r.id] = r; });
      drafts.forEach(x => { const r = nm[x.staff_id] || {};
        people.push({ id: x.staff_id, name: (r.nickname || '').trim() || (r.preferred_name || '').trim() || r.display_name || 'Someone',
          show: (r.preferred_name || '').trim() || r.display_name || r.nickname || 'Someone', start: toMin(x.start_time), end: toMin(x.end_time), roles: [], job: '', hired: null, role: '', draft: true,
          shiftId: String(x.id), status: 'draft' }); });
      people.sort((a, b) => a.start - b.start || a.show.localeCompare(b.show));
    }
    // their job (manager / coordinator) and hire date (seniority), from their staff profile; and anyone deactivated
    if (people.length) {
      const prof = await sb.from('staff_profiles').select('id, role, hire_date, is_active, termination_date').in('id', people.map(p => p.id));
      (prof.data || []).forEach(r => { const p = people.find(x => x.id === r.id); if (p) { p.job = String(r.role || ''); p.hired = r.hire_date || null;
        p.gone = r.is_active === false ? 'deactivated' : r.termination_date && r.termination_date < date ? 'past their last day' : ''; } });
    }
    const findPerson = n => { const k = key(n); if (!k) return null;
      return people.find(p => key(p.name) === k || key(p.show) === k) || people.find(p => key(p.show).split(' ')[0] === k.split(' ')[0]) || null; };
    ROLES.forEach(([f, label]) => { const p = findPerson(dayRow[f]); if (p && !p.role) p.role = label; });
    const rolesFromPlan = people.some(p => p.role);
    if (!rolesFromPlan) autoRoles(people);   // (nothing set in the Day plan: automatic)
    else people.forEach(p => { if (!p.role) p.role = 'Circler'; });

    // the blocks
    const blocks = [];
    const demoers = people.filter(p => p.role === 'Demoer');
    const director = people.find(p => p.role === 'Director') || null;
    // (busy, or not on shift for the whole of it)
    const busyAt = (pid, a, z) => { const p = people.find(x => x.id === pid);
      return !p || a < p.start || z > p.end || blocks.some(b => b.person === pid && a < b.end && z > b.start); };
    // breaks first (the Day plan's roles: "12:30-1:00"), so nobody is picked to demo or teach on their break
    ROLES.forEach(([f]) => {
      const p = findPerson(dayRow[f]); const m = String(dayRow['break_' + f] || '').match(/(\d{1,2}):(\d{2})\D+(\d{1,2}):(\d{2})/);
      if (!p || !m || blocks.some(b => b.kind === 'brk' && b.person === p.id)) return;
      const h = v => { v = +v; return v < 8 ? v + 12 : v; };
      blocks.push({ id: 'b-' + p.id, kind: 'brk', title: 'Break', sub: '', start: h(m[1]) * 60 + +m[2], end: h(m[3]) * 60 + +m[4], person: p.id });
    });
    sessions.slice().sort((a, b) => toMin(a.session_time) - toMin(b.session_time)).forEach(x => {
      const n = booked[x.id] || 0, t0 = toMin(x.session_time), title = String(x.title || '');
      if (x.show === false && !n) return;
      if (/camp|pa day|pd day|pa\/pd/i.test(title)) return;   // (camps have their own team)
      if (isKids(x)) {
        if (!n) return;   // (nobody enrolled: not running)
        const len = Math.max(LEN.kids, +x.duration_minutes || 0);
        let p = findPerson((staffBy[x.id] || {}).teacher), auto = false;
        if (!p) { p = demoers.find(d => !busyAt(d.id, t0, t0 + len)) || (director && !busyAt(director.id, t0, t0 + len) ? director : null); auto = !!p; }
        blocks.push({ id: 'k-' + x.id, kind: 'kids', session: x.id, title: title.split('|')[0].trim(), sub: `${n} enrolled · ${len} min${auto ? ' · auto' : ''}`, start: t0, end: t0 + len, person: p ? p.id : null, auto });
      } else if (/wheel/i.test(title)) {
        if (!n) return;
        const p = findPerson((staffBy[x.id] || {}).wheel_teacher);
        blocks.push({ id: 'w-' + x.id, kind: 'wheel', session: x.id, title, sub: `${n} booked · ${LEN.wheel} min`, start: t0, end: t0 + LEN.wheel, person: p ? p.id : null });
      } else if (x.session_type === 'party') {
        partyBk.filter(b => b.session_id === x.id).forEach(b => {
          const d = (pd.data || []).find(z => z.booking_id === b.id) || {};
          // an Adult Get-Together or team building: only the intro (the first 15 minutes), then it runs like a workshop
          const intro = /get.?together|team\s*building/i.test(title);
          const len = intro ? LEN.intro : /90/.test(String(d.actual_art_time || '')) ? 90 : 60;
          const t1 = findPerson(d.party_teacher1), t2 = findPerson(d.party_teacher2);
          const guests = d.expected_guests || b.qty || '';
          blocks.push({ id: 'p1-' + b.id, kind: 'party', session: x.id, booking: b.id, slot: 1, title, sub: `${guests ? guests + ' guests · ' : ''}${len} min ${intro ? 'intro' : 'art time'}`, start: t0, end: t0 + len, person: t1 ? t1.id : null });
          if (t2 || (!intro && +guests > 15) || (intro && +guests > 20)) blocks.push({ id: 'p2-' + b.id, kind: 'party', session: x.id, booking: b.id, slot: 2, title, sub: `second teacher · ${len} min`, start: t0, end: t0 + len, person: t2 ? t2.id : null });
        });
      } else {
        if (!n) return;   // (nobody booked yet: nothing to demo)
        // the demo: someone set for this time, else the first free demoer, else the Director
        const set = findPerson((staffBy[x.id] || {}).demo_by);
        const p = set || demoers.find(d => !busyAt(d.id, t0, t0 + LEN.demo)) || (director && !busyAt(director.id, t0, t0 + LEN.demo) ? director : null);
        blocks.push({ id: 'd-' + x.id, kind: 'demo', session: x.id, n, title, sub: `${n} booked · demo ${LEN.demo} min`, start: t0, end: t0 + LEN.demo, person: p ? p.id : null,
          runEnd: t0 + (+x.duration_minutes || 120) });
      }
    });
    let lo = Math.min(8 * 60, ...people.map(p => p.start), ...blocks.map(b => b.start)), hi = Math.max(17 * 60, ...people.map(p => p.end), ...blocks.map(b => b.runEnd || b.end));
    lo = Math.floor(lo / 60) * 60; hi = Math.ceil(hi / 60) * 60;
    const partyGuests = {};
    partyBk.forEach(b => { const d = (pd.data || []).find(z => z.booking_id === b.id) || {};
      partyGuests[b.session_id] = (partyGuests[b.session_id] || 0) + (+d.expected_guests || +b.qty || 0); });
    let inbox = [];
    try { const ib = await sb.rpc('hub_inbox_mine'); inbox = (ib.data || []).filter(x => x.studio_id === st && String(x.day || '').slice(0, 10) === date); } catch (e) {}
    D = { st, date, people, blocks, lo, hi, sessions, booked, rolesFromPlan, startRoles: people.map(p => [p.id, p.role]), inbox, partyGuests };
    START = JSON.parse(JSON.stringify(blocks));
    // breaks suggested straight away for anyone on a long shift without one (saved with Save the day)
    const br = suggestBreaks();
    if (br.added || br.missed.length) D.flash = [br.added ? `${br.added} break${br.added === 1 ? '' : 's'} suggested (dashed): Save the day to keep ${br.added === 1 ? 'it' : 'them'}` : '',
      br.missed.length ? `no time found for a break for ${br.missed.join(', ')}` : ''].filter(Boolean).join(' · ');
    draw();
  } catch (e) {
    $('main').innerHTML = `<div class="msg"><b>Couldn't load that day.</b><br>${esc(e.message || e)}</div>`;
  }
}

// Roles for the day: Director = the manager or coordinator on shift (the most senior if more than one); Demoer = of everyone
// else, the least seniority (most recent hire date), all day; everyone else Circler, by seniority.
function autoRoles(people) {
  const senior = (a, b) => String(a.hired || '9999').localeCompare(String(b.hired || '9999'));   // (earliest hire first)
  people.forEach(p => { p.role = ''; });
  const leads = people.filter(p => /manager|coordinator|director/i.test(p.job)).sort(senior);
  // (no manager or coordinator on shift: the most senior person directs)
  const dir = leads[0] || (people.length > 1 ? people.slice().sort(senior)[0] : null); if (dir) dir.role = 'Director';
  const rest = people.filter(p => p !== dir).sort(senior);
  if (rest.length) rest[rest.length - 1].role = 'Demoer';   // (the least seniority)
  rest.forEach(p => { if (!p.role) p.role = 'Circler'; });
  if (!dir && people.length === 1) people[0].role = 'Demoer';
}
function setRole(pid, role) {
  const p = D.people.find(x => x.id === pid); if (!p) return;
  if (role === 'Director' || role === 'Demoer') D.people.forEach(x => { if (x !== p && x.role === role) x.role = 'Circler'; });   // (one each)
  p.role = role; p.roleSet = true; draw();
}

// ---- problems: two things at once, outside the shift, teaching during a break, two breaks at once ----
function problems() {
  const bad = {}, list = [];
  const per = {}; D.blocks.forEach(b => { if (b.person) (per[b.person] = per[b.person] || []).push(b); });
  Object.entries(per).forEach(([pid, bs]) => {
    const p = D.people.find(x => x.id === pid);
    bs.forEach((b, i) => {
      if (p && (b.start < p.start || b.end > p.end)) { bad[b.id] = 1; list.push(`${p.show}: ${b.title} (${fmt(b.start)}) is outside their shift (${fmt(p.start)}–${fmt(p.end)})`); }
      bs.slice(i + 1).forEach(c => { if (b.start < c.end && c.start < b.end && !shareOk(b, c)) { bad[b.id] = bad[c.id] = 1;
        list.push(`${p ? p.show : 'Someone'}: ${b.kind === 'brk' ? 'break' : b.title} and ${c.kind === 'brk' ? 'break' : c.title} overlap at ${fmt(Math.max(b.start, c.start))}`); } });
    });
  });
  D.blocks.filter(b => !b.person).forEach(b => { bad[b.id] = 1; list.push(`${b.title} at ${fmt(b.start)} has nobody`); });
  D.people.filter(p => p.gone).forEach(p => list.push(`${p.show} is ${p.gone} but has a shift this day: remove it (✕) or give their work to someone else`));
  // breaks never at the same time: someone is always on
  const brks = D.blocks.filter(b => b.kind === 'brk' && b.person);
  brks.forEach((b, i) => brks.slice(i + 1).forEach(c => { if (b.start < c.end && c.start < b.end) { bad[b.id] = bad[c.id] = 1;
    const n = id => (D.people.find(p => p.id === id) || {}).show || 'Someone';
    list.push(`${n(b.person)} and ${n(c.person)} are on break at the same time (${fmt(Math.max(b.start, c.start))}): someone always needs to be on`); } }));
  return { bad, list };
}

// ---- drawing ----
function draw() {
  setTimeout(dayLabourCheck, 0);   // (the labour estimate, when the shifts have changed)
  const { lo, hi } = D, W = (hi - lo) * PX, x = m => (m - lo) * PX;
  const { bad, list } = problems();
  const hours = []; for (let m = lo; m <= hi; m += 60) hours.push(m);
  const hourLines = hours.map(m => `<i class="hour" style="left:${x(m)}px"></i>`).join('');
  const blockHtml = (b, lane, lanes) => {
    const h = lanes > 1 ? (40 / lanes) : 40, top = 6 + lane * h;
    const was = START && START.find(s => s.id === b.id), moved = !!was && (was.person !== b.person || was.start !== b.start);
    return `<div class="blk ${b.kind}${bad[b.id] ? ' bad' : ''}${moved ? ' moved' : ''}" tabindex="0" role="button" data-id="${b.id}"
      style="left:${x(b.start)}px;width:${Math.max(18, (b.end - b.start) * PX - 2)}px;top:${top}px;height:${h - 2}px"
      title="${esc(b.title + ' · ' + fmt(b.start) + '–' + fmt(b.end) + (b.sub ? ' · ' + b.sub : ''))}"><b>${esc(b.kind === 'brk' ? 'Break ' + fmt(b.start) : b.title)}</b>${h > 30 && b.sub ? `<span>${esc(b.sub)}</span>` : ''}</div>`;
  };
  const laneOut = bs => {   // overlapping blocks in a row stack in lanes
    const sorted = bs.slice().sort((a, b) => a.start - b.start), ends = [];
    sorted.forEach(b => { let l = ends.findIndex(e => e <= b.start); if (l < 0) { l = ends.length; ends.push(0); } ends[l] = b.end; b._lane = l; });
    return sorted.map(b => blockHtml(b, b._lane, Math.max(1, ends.length))).join('');
  };
  const mins = pid => D.blocks.filter(b => b.person === pid && b.kind !== 'brk').reduce((t, b) => t + (b.end - b.start), 0);
  // every time on the day, with its registrations (open ones with nobody yet too; closed ones struck through)
  const sesList = (D.sessions || []).filter(x => x.session_type !== 'festival').map(x => {
    const n = D.booked[x.id] || 0, title = String(x.title || ''), t0 = toMin(x.session_time);
    if (x.show === false && !n) return null;
    if (/class \d+ of \d+|week session|catch up class/i.test(title) && !n && kidsStarted(x)) return null;
    const len = +x.duration_minutes || (/class \d+ of \d+|week session/i.test(title) ? LEN.kids : /mini\s*make/i.test(title) ? 90 : /party|get.?together|slot/i.test(title) ? 120 : 120);
    const closed = !n && x.spaces_left_cache !== null && +x.spaces_left_cache <= 0;
    const guests = x.session_type === 'party' && n ? (D.partyGuests || {})[x.id] || 0 : 0;
    return { id: 'ses-' + x.id, start: t0, end: t0 + len, title: title.split('|')[0].trim(), full: title, n, cap: x.capacity, closed, party: x.session_type === 'party', guests };
  }).filter(Boolean);
  const closedN = sesList.filter(r => r.closed).length;
  const sesRow = (() => {
    const sorted = sesList.filter(r => !r.closed).sort((a, b) => a.start - b.start), ends = [];   // (closed times aren't shown)
    sorted.forEach(r => { let l = ends.findIndex(e => e <= r.start); if (l < 0) { l = ends.length; ends.push(0); } ends[l] = r.end; r._lane = l; });
    const lanes = Math.max(1, ends.length), h = 24;
    return `<div class="row times-row"><div class="who"><b>Times</b><small>${(() => {
          // people by kind: kids classes (enrolled), parties (guests), glazing, workshops (Mini Make and wheel too), camps
          const kindOf = r => r.party ? 'party' : /class \d+ of \d+|week session|catch up class/i.test(r.full) ? 'kids' : /glaz/i.test(r.full) ? 'glaze'
            : /camp|pa day|pd day|pa\/pd|no[\s-]school/i.test(r.full) ? 'camp' : 'work';
          const by = { kids: 0, party: 0, glaze: 0, work: 0, camp: 0 };
          sesList.forEach(r => { by[kindOf(r)] += r.party ? (r.guests || 0) : r.n; });
          const total = Object.values(by).reduce((t, v) => t + v, 0);
          const lines = [['kids', 'in kids classes'], ['party', 'party goers'], ['glaze', 'glazers'], ['work', 'in workshops'], ['camp', 'campers']]
            .filter(([k]) => by[k] > 0).map(([k, l]) => `${by[k]} ${l}`);
          const dayWord = D.date === localDate(new Date()) ? 'today' : 'this day';
          const L = D.labour, labHtml = !L ? '' : L.pct == null && L.exp_pct == null ? (L.hours > 0 ? '<br><span class="lab high">Labour: no bookings yet</span>' : '')
            : `<br>${L.pct != null ? `<span class="lab ${labClass(L.pct)}" title="Estimated labour: staff cost (shifts, drafts included) ÷ the revenue of this day's bookings so far">Labour ≈ ${L.pct}% now</span>` : ''}${L.exp_pct != null && L.exp_pct !== L.pct ? `<span class="lab ${labClass(L.exp_pct)}" title="${EXP_TIP}">≈ ${L.exp_pct}% expected</span>` : ''}`;
          return `<span style="font-weight:700;color:var(--ink)">${total} ${total === 1 ? 'person' : 'people'} ${dayWord}</span>${lines.length ? '<br>' + lines.join('<br>') : ''}<br>${sesList.filter(r => !r.closed).length} times open${labHtml}`;
        })()}${closedN ? ` · ${closedN} closed not shown` : ''}</small></div>
      <div class="lane" style="width:${W}px;height:${lanes * (h + 3) + 8}px">${hourLines}${sorted.map(r => `<div class="ses-chip${r.n ? '' : ' empty'}${r.closed ? ' closed' : ''}" role="button" tabindex="0" onclick="dayTimeMenu('${r.id.slice(4)}', this)"
        style="left:${x(r.start)}px;width:${Math.max(30, (r.end - r.start) * PX - 2)}px;top:${5 + r._lane * (h + 3)}px;height:${h}px"
        title="${esc(fmt(r.start) + '–' + fmt(r.end) + ' ' + r.title + ': ' + (r.guests ? r.guests + ' guests' : r.n + (r.cap != null ? ' of ' + r.cap : '') + ' registered') + (r.closed ? ' (closed)' : ''))}"><b>${r.guests ? r.guests + ' guests' : r.n + (r.cap != null ? '/' + r.cap : '')}</b> ${esc(fmt(r.start) + ' ' + r.title)}</div>`).join('')}</div></div>`;
  })();
  const nobody = D.blocks.filter(b => !b.person);
  const rows = (nobody.length ? `<div class="row needs" data-person=""><div class="who"><b>Needs someone</b><small>${nobody.length} with nobody: drag onto a person</small></div><div class="lane" style="width:${W}px">${hourLines}${laneOut(nobody)}</div></div>` : '')
    + D.people.map(p => `<div class="row" data-person="${esc(p.id)}"><div class="who"><b>${esc(p.show)}${p.draft ? ' <span class="draft-tag">draft</span>' : ''}${p.gone ? ` <span class="gone-tag">${esc(p.gone)}</span>` : ''}${p.shiftId ? `
        <span class="sh-acts"><button title="Change ${esc(p.show)}'s shift times" onclick="dayShiftEdit('${esc(p.id)}')">✎</button><button title="Remove ${esc(p.show)}'s shift" onclick="dayShiftRemove('${esc(p.id)}')">✕</button></span>` : ''}</b><small>${fmt(p.start)}–${fmt(p.end)}
        <select class="role" aria-label="${esc(p.show)}'s role today" onchange="setRole('${esc(p.id)}', this.value)">${['Director', 'Demoer', 'Circler'].map(r => `<option${r === p.role ? ' selected' : ''}>${r}</option>`).join('')}</select></small>
        <small>${Math.round(mins(p.id) / 6) / 10}h teaching or demoing${D.blocks.some(b => b.person === p.id && b.kind === 'brk') ? '' : (p.end - p.start > 300 ? ' · <b style="color:#9a3412;display:inline">no break set</b>' : '')}</small></div>
      <div class="lane" style="width:${W}px">${hourLines}<i class="shift${p.draft ? ' draft' : ''}" style="left:${x(p.start)}px;width:${(p.end - p.start) * PX}px"></i>${laneOut(D.blocks.filter(b => b.person === p.id))}</div></div>`).join('');
  // coverage: on shift, minus anyone teaching, demoing or on a break; red at 0 while something's running
  const cells = [];
  for (let m = lo; m < hi; m += STEP) {
    const on = D.people.filter(p => p.start <= m && p.end > m);
    const busy = new Set(D.blocks.filter(b => b.person && b.start <= m && b.end > m).map(b => b.person));
    const free = on.filter(p => !busy.has(p.id)).length;
    const running = D.blocks.some(b => b.start <= m && (b.runEnd || b.end) > m);
    const cls = !on.length && !running ? 'idle' : free === 0 && running ? 'zero' : free === 0 ? 'idle' : 'ok';
    cells.push(`<i class="cell ${cls}" style="left:${x(m) + 1}px;width:${STEP * PX - 2}px" title="${fmt(m)}: ${on.length} on shift, ${free} free${running ? ', something running' : ''}">${on.length ? free : ''}</i>`);
  }
  const changes = START.map(s => { const b = D.blocks.find(z => z.id === s.id); if (!b) return null;
    const name = id => (D.people.find(p => p.id === id) || {}).show || 'nobody';
    if (s.person !== b.person) return `${b.kind === 'brk' ? 'Break' : b.title} (${fmt(b.start)}): ${name(s.person)} → ${name(b.person)}`;
    if (s.start !== b.start) return `${name(b.person)}'s break: ${fmt(s.start)} → ${fmt(b.start)}`;
    return null; }).filter(Boolean)
    .concat(D.people.filter(p => (D.startRoles.find(r => r[0] === p.id) || [])[1] !== p.role).map(p => `${p.show}: ${p.role} today`))
    .concat(D.blocks.filter(b => !START.some(s => s.id === b.id)).map(b => `New break for ${(D.people.find(p => p.id === b.person) || {}).show || 'someone'}: ${fmt(b.start)}–${fmt(b.end)}`));
  const decide = (D.inbox || []).map(x => {
    const btn = (a, l, v) => `<button onclick="dayDecide('${x.id}','${a}'${v ? `,'${v}'` : ''})">${l}</button>`;
    let acts = '';
    if (x.kind === 'cut_shift') acts = btn('approve', '✓ Approve') + btn('keep', 'Keep');
    else if (x.kind === 'short_day') acts = btn('done', '✓ Done') + `<button onclick="dayDecide('${x.id}','keep')" title="It's quiet: the staff we have is enough (this day isn't flagged again)">Disregard</button>`;
    else if (x.kind === 'evening_question') { const P = x.payload || {}, n = Math.max(1, +P.usual || 1), pa = P.pad !== 'field';
      const opts = (pa ? [['watch', 'Tell us if it books']] : []).concat([['close', 'Close the evening']]).concat(Array.from({ length: n }, (_, i) => [String(i + 1), `Open with ${i + 1} staff`])).concat([['more', 'One more teacher']]).concat(pa ? [['cancel_pa', 'Close the PA/PD day']] : []);
      acts = `<select onchange="if(this.value) dayDecide('${x.id}','evening',this.value)"><option value="">Choose…</option>${opts.map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join('')}</select>`; }
    else acts = btn('done', '✓ Done');
    const ico = { cut_shift: '✂️', short_day: '👤', evening_question: '🌆', as_note: '📝', class_problem: '📚' }[x.kind] || '•';
    return `<div class="it"><span class="t">${ico} <b>${esc(x.title)}</b><small>${esc(x.detail || '')}</small></span>${acts}</div>`; }).join('');

// ---- planning: suggest breaks, assign demos (anything moved by hand stays put) ----
// free on the floor at minute m (on shift, not in any block), and whether anything's running then
function freeAt(m, blocks) {
  const on = D.people.filter(p => p.start <= m && p.end > m);
  const busy = new Set(blocks.filter(b => b.person && b.start <= m && b.end > m).map(b => b.person));
  return on.filter(p => !busy.has(p.id)).length;
}
const runningAt = m => D.blocks.some(b => b.kind !== 'brk' && b.start <= m && (b.runEnd || b.end) > m);
const busyFor = (pid, a, z, blocks, except) => blocks.some(b => b !== except && b.person === pid && a < b.end && z > b.start && !(except && shareOk(b, except)));

function minFree(a, z, blocks) { let lo = 99; for (let m = a; m < z; m += STEP) if (runningAt(m)) lo = Math.min(lo, freeAt(m, blocks)); return lo; }

// A 30-minute break for each shift over 5 hours without one: 2 to 5 hours in (never during their own teaching or demos),
// where the most people stay free on the floor; nearest the middle of their shift on a tie.
function suggestBreaks() {
  let added = 0; const missed = [];
  D.people.filter(p => p.end - p.start > 300 && !D.blocks.some(b => b.kind === 'brk' && b.person === p.id))
    .sort((a, b) => a.start - b.start).forEach(p => {
      const mid = p.start + (p.end - p.start) / 2, from = p.start + 120, to = Math.min(p.start + 300, p.end - 60);
      let best = null;
      for (let t = Math.ceil(from / STEP) * STEP; t <= to; t += STEP) {
        if (busyFor(p.id, t, t + 30, D.blocks)) continue;
        if (D.blocks.some(b => b.kind === 'brk' && b.person && b.person !== p.id && t < b.end && t + 30 > b.start)) continue;   // (never two breaks at once)
        const trial = D.blocks.concat([{ person: p.id, start: t, end: t + 30, kind: 'brk' }]);
        const score = [Math.min(minFree(t, t + 30, trial), 2), -Math.abs(t + 15 - mid)];
        if (!best || score[0] > best.score[0] || (score[0] === best.score[0] && score[1] > best.score[1])) best = { t, score };
      }
      if (!best) { missed.push(p.show); return; }
      D.blocks.push({ id: 'b-' + p.id + '-s', kind: 'brk', title: 'Break', sub: 'suggested', start: best.t, end: best.t + 30, person: p.id });
      added++;
    });
  return { added, missed };
}

// Each demo (and any kids class or party with nobody) to the best person free then: the day's Demoers first, keeping someone
// free on the floor where possible, and sharing the demos out evenly. Wheel stays as set (it needs a wheel-ready teacher).
function assignDemos() {
  let changed = 0, nobody = 0;
  const load = {}; D.blocks.filter(b => b.person && b.kind !== 'brk').forEach(b => { load[b.person] = (load[b.person] || 0) + (b.end - b.start); });
  const todo = D.blocks.filter(b => !b.locked && (b.kind === 'demo' || b.auto || (!b.person && (b.kind === 'kids' || b.kind === 'party')))).sort((a, b) => a.start - b.start);
  todo.forEach(b => { if (b.person) load[b.person] -= (b.end - b.start); b.person = null; });   // (start fresh for these)
  todo.forEach(b => {
    const cands = D.people.filter(p => p.start <= b.start && p.end >= b.end && !busyFor(p.id, b.start, b.end, D.blocks, b));
    let best = null;
    cands.forEach(p => {
      const trial = D.blocks.map(x => x === b ? Object.assign({}, b, { person: p.id }) : x);
      const keepsFloor = minFree(b.start, b.end, trial) >= 1 ? 1 : 0;
      const demoer = p.role === 'Demoer' ? 1 : 0;
      // a demo: the day's Demoer whenever they're free; a class or party with nobody: anyone, keeping the floor covered
      const score = b.kind === 'demo' ? [demoer, keepsFloor, p.role === 'Director' ? 0 : 1, -(load[p.id] || 0)] : [keepsFloor, demoer ? 0 : 1, -(load[p.id] || 0)];
      if (!best || better(score, best.score)) best = { p, score };
    });
    const was = (START.find(s => s.id === b.id) || {}).person || null;
    if (best) { b.person = best.p.id; load[best.p.id] = (load[best.p.id] || 0) + (b.end - b.start); } else nobody++;

  return { changed, nobody };
}
// a beats b: compare score lists in order (the first difference decides)
function better(a, b) { for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return a[i] > b[i]; return false; }
function planDay(which) {
  if (!D) return;
  const parts = [];
  if (which === 'all' && !D.rolesFromPlan && !D.people.some(p => p.roleSet)) { autoRoles(D.people); parts.push('roles set (Director, Demoer, Circlers)'); }
  if (which !== 'demo') { const r = suggestBreaks(); parts.push(r.added ? `${r.added} break${r.added === 1 ? '' : 's'} suggested` : 'No breaks needed (or already set)'); if (r.missed.length) parts.push(`no time found for a break for ${r.missed.join(', ')}`); }
  if (which !== 'brk') { const r = assignDemos(); parts.push(`${r.changed} demo${r.changed === 1 ? '' : 's'} or class${r.changed === 1 ? '' : 'es'} given out`); if (r.nobody) parts.push(`${r.nobody} still need someone (everyone's busy)`); }
  D.flash = parts.join(' · ') + '. Look it over: drag anything to change it.';
  draw(); D.flash = '';
}

const PEND_KEY = 'dayboard_pending_updates';

// One line per person per day: what it was before → what it is now (changed back = nothing to tell them)
const normT = t => String(t || '').toLowerCase().replace(/:00/g, '').replace(/([ap])m/g, '$1').replace(/\s+/g, '');
function queueNotify(staffId, name, text) {
  const m = String(text || '').match(/^([^:]+?):\s*(.*)$/), day = m ? m[1] : null, what = m ? m[2] : String(text || '');
  let orig, latest, ev;

  else if ((mm = what.match(/^shift removed\s*\((?:was\s*)?(.+)\)$/i))) ev = { kind: 'removed', from: mm[1].trim() };
  else if ((mm = what.match(/^new shift\s*(.+)$/i))) ev = { kind: 'new', to: mm[1].trim() };
  const ex = day && ev ? _pending.find(x => x.staffId === (staffId || '?') && x.day === day && x.ev) : null;
  if (ex) {   // merge with what's already on the list for that day
    if (ev.kind === 'change') ex.latest = ev.to;
    else if (ev.kind === 'removed') ex.latest = null;
    else if (ev.kind === 'new') ex.latest = ev.to;
    if (ex.orig != null && ex.latest != null && normT(ex.orig) === normT(ex.latest)) _pending = _pending.filter(x => x !== ex);   // (back as it was)
    else if (ex.orig == null && ex.latest == null) _pending = _pending.filter(x => x !== ex);   // (added, then removed)

  savePending();
}

// ---- Save the day: to the Day plan (roles, breaks, teachers, party teachers, who demos each time) ----
async function saveDay() {
  if (!D) return;
  const nameOf = id => { const p = D.people.find(x => x.id === id); return p ? p.name : ''; };
  const breakOf = p => { const b = D.blocks.find(z => z.kind === 'brk' && z.person === p.id); return b ? `${fmtHM(b.start)}-${fmtHM(b.end)}` : ''; };
  const roles = {}, senior = (a, b) => String(a.hired || '9999').localeCompare(String(b.hired || '9999'));
  const dir = D.people.find(p => p.role === 'Director'), dem = D.people.find(p => p.role === 'Demoer');
  const circ = D.people.filter(p => p.role === 'Circler').sort(senior);
  const put = (f, p) => { roles[f] = p ? p.name : ''; roles['break_' + f] = p ? breakOf(p) : ''; };
  put('director', dir); put('teacher', dem); put('teacher2', null);
  put('circler', circ[0]); put('circler2', circ[1]); put('circler3', circ[2]);
  const times = [], parties = {};
  D.blocks.forEach(b => {
    if (b.kind === 'kids') times.push({ session_id: b.session, teacher: nameOf(b.person) });
    else if (b.kind === 'wheel') times.push({ session_id: b.session, wheel_teacher: nameOf(b.person) });
    else if (b.kind === 'demo') times.push({ session_id: b.session, demo_by: nameOf(b.person) });
    else if (b.kind === 'party' && b.booking) { const x = parties[b.booking] = parties[b.booking] || { booking_id: b.booking, t1: '', t2: '' }; x[b.slot === 2 ? 't2' : 't1'] = nameOf(b.person); }
  });
  const extra = circ.length > 3 ? `\n\n(${circ.slice(3).map(p => p.show).join(', ')}: more than 3 circlers; the Day plan keeps 3, so ${circ.length - 3 === 1 ? 'this one isn’t' : 'these aren’t'} saved as a circler.)` : '';
  const { list } = problems();
  if (!confirm(`Save this day to the Day plan?${list.length ? `\n\nThere ${list.length === 1 ? 'is 1 problem' : 'are ' + list.length + ' problems'} (see the list).` : ''}${extra}\n\nThe Hub's Day plan and On stage will show the same.`)) return;
  const btn = $('save'); btn.disabled = true; btn.textContent = 'Saving…';

  await load();
  D.flash = 'Saved. The Hub\u2019s Day plan and On stage now show this day.'; draw();
}
const fmtHM = m => { const h = Math.floor(m / 60), mm = m % 60; return (h % 12 || 12) + ':' + String(mm).padStart(2, '0'); };

// ---- dragging (pointer: mouse, pen or touch) and clicking ----
function wire() {
  document.querySelectorAll('.blk').forEach(el => {
    el.addEventListener('pointerdown', e => startDrag(e, el));
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPop(el); } });
  });
}
function startDrag(e, el) {
  const b = D.blocks.find(z => z.id === el.dataset.id); if (!b) return;
  e.preventDefault();
  const r = el.getBoundingClientRect(), ox = e.clientX - r.left, oy = e.clientY - r.top, x0 = e.clientX, y0 = e.clientY;
  let ghost = null, moved = false, overRow = null;
  const move = ev => {
    if (!moved && Math.abs(ev.clientX - x0) + Math.abs(ev.clientY - y0) < 5) return;
    if (!moved) { moved = true; ghost = el.cloneNode(true); ghost.classList.add('ghost'); ghost.style.width = r.width + 'px'; ghost.style.height = r.height + 'px'; document.body.appendChild(ghost); el.classList.add('dragging'); }
    const gx = b.kind === 'brk' ? ev.clientX - ox : r.left;   // (a break moves along the day; anything else keeps its time)
    ghost.style.left = gx + 'px'; ghost.style.top = (b.kind === 'brk' ? r.top : ev.clientY - oy) + 'px';
    if (b.kind !== 'brk') {
      ghost.style.display = 'none'; const under = document.elementFromPoint(ev.clientX, ev.clientY); ghost.style.display = '';
      const row = under && under.closest('.row[data-person]');
      if (overRow && overRow !== row) overRow.classList.remove('drop-ok');
      if (row) row.classList.add('drop-ok'); overRow = row;
    }
  };
  const up = ev => {
    document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up);
    if (overRow) overRow.classList.remove('drop-ok');
    if (ghost) ghost.remove(); el.classList.remove('dragging');
    if (!moved) { openPop(el); return; }
    if (b.kind === 'brk') {
      const dm = Math.round((ev.clientX - x0) / PX / STEP) * STEP, len = b.end - b.start;
      b.start = Math.max(D.lo, Math.min(D.hi - len, b.start + dm)); b.end = b.start + len;
    } else if (overRow) {
      b.person = overRow.dataset.person || null;
    }
    b.locked = true;
    draw();
  };
  document.addEventListener('pointermove', move); document.addEventListener('pointerup', up);
}
// click (or Enter): give it to someone, from a list (people busy then are marked)
function openPop(el) {
  closePop();
  const b = D.blocks.find(z => z.id === el.dataset.id); if (!b) return;
  const pop = document.createElement('div'); pop.className = 'pop'; pop.id = 'pop';
  const busy = p => D.blocks.some(z => z !== b && z.person === p.id && z.start < b.end && b.start < z.end);
  const off = p => b.start < p.start || b.end > p.end;
  pop.innerHTML = b.kind === 'brk'
    ? `<label>Break for ${esc((D.people.find(p => p.id === b.person) || {}).show || '')}: start time</label>
       <select id="pop-sel">${Array.from({ length: Math.floor((D.hi - D.lo) / STEP) }, (_, i) => D.lo + i * STEP).map(m => `<option value="${m}" ${m === b.start ? 'selected' : ''}>${fmt(m)}</option>`).join('')}</select>
       <div class="row2"><button id="pop-ok">Move break</button><button id="pop-del">Remove break</button><button id="pop-x">Cancel</button></div>`
    : `<label>${esc(b.title)} · ${fmt(b.start)}–${fmt(b.end)}: who?</label>
       <select id="pop-sel"><option value="">Nobody</option>${D.people.map(p => `<option value="${esc(p.id)}" ${p.id === b.person ? 'selected' : ''}>${esc(p.show)}${off(p) ? ' (not on shift then)' : busy(p) ? ' (busy then)' : ''}</option>`).join('')}</select>
       <div class="row2"><button id="pop-ok">Give it to them</button><button id="pop-x">Cancel</button></div>`;
  document.body.appendChild(pop);
  const r = el.getBoundingClientRect();
  pop.style.left = Math.min(window.innerWidth - 280, r.left) + 'px'; pop.style.top = Math.min(window.innerHeight - 140, r.bottom + 6) + 'px';
  $('pop-sel').focus();
  $('pop-x').onclick = closePop;
  if ($('pop-del')) $('pop-del').onclick = () => { D.blocks = D.blocks.filter(z => z !== b); closePop(); D.flash = 'Break removed (Save the day to keep it that way).'; draw(); };
  $('pop-ok').onclick = () => { const v = $('pop-sel').value;
    if (b.kind === 'brk') { const len = b.end - b.start; b.start = +v; b.end = b.start + len; } else b.person = v || null;
    b.locked = true;
    closePop(); draw(); };
}

// =========================== THE WEEK ===========================
// One studio's week: coverage per day (short / more than needed), every shift (change or remove it in place), what's in
// 📋 For you for that studio and week (approve or keep a cut, answer an evening, tick a note), and every time (close or reopen,
// including a PA/PD day). Changes here are real. A day's heading opens its day board.
let MODE = 'day', W = null;
let WEEK_MON = (() => { try { return localStorage.getItem('dayboard_week_starts') !== 'sun'; } catch (e) { return true; } })();   // (Monday unless switched)
const sundayOf = ds => { const d = new Date(ds + 'T12:00:00'); d.setDate(d.getDate() - (WEEK_MON ? (d.getDay() + 6) % 7 : d.getDay())); return localDate(d); };   // (the week's first day)
function setWeekStart(mon) { WEEK_MON = mon; try { localStorage.setItem('dayboard_week_starts', mon ? 'mon' : 'sun'); } catch (e) {} loadWeek(); }
const addDays = (ds, n) => { const d = new Date(ds + 'T12:00:00'); d.setDate(d.getDate() + n); return localDate(d); };
const dayLabel = ds => new Date(ds + 'T12:00:00').toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric' });
const parseRange = v => { const m = String(v || '').replace(/\s+/g, '').match(/^(\d{1,2})(?::(\d{2}))?([ap])m?-(\d{1,2})(?::(\d{2}))?([ap])m?$/i);
  if (!m) return null; const hm = (h, mm, ap) => (+h % 12 + (/p/i.test(ap) ? 12 : 0)) * 60 + (+mm || 0); return { start: hm(m[1], m[2], m[3]), end: hm(m[4], m[5], m[6]) }; };
const hhmm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const KIDS = /class \d+ of \d+|week session|catch up class/i, PA = /\bp[ad] day|pa\/pd|no[\s-]school/i;
// An empty kids class is left out only once its class has started (nobody can join partway): Class 2 or later, or a Class 1 /
// sign-up time on or before today. One that hasn't started yet is still open for registration, so it shows (even at 0).
function kidsStarted(x) {
  const m = String(x.title || '').match(/class\s+(\d+)\s+of\s+\d+/i);
  if (m && +m[1] >= 2) return true;
  return String(x.session_date || '').slice(0, 10) <= localDate(new Date());
}

async function loadWeek() {
  const st = $('studio').value; if (!st || !$('date').value) return;
  const from = sundayOf($('date').value), to = addDays(from, 6);
  localStorage.setItem('dayboard_studio', st);
  history.replaceState(null, '', `?view=week&studio=${encodeURIComponent(st)}&date=${from}`);
  $('main').innerHTML = '<div class="msg">Loading the week…</div>';
  try {
    const [sess, need, shifts, inbox] = await Promise.all([
      sb.from('sessions').select('id, title, session_date, session_time, session_type, duration_minutes, capacity, spaces_left_cache, show').eq('studio_id', st).gte('session_date', from).lte('session_date', to).order('session_date').order('session_time'),
      sb.rpc('get_staffing_need', { p_studio_id: st, p_from: from, p_to: to }),
      sb.from('staff_shifts').select('id, staff_id, shift_date, start_time, end_time, status').eq('studio_id', st).gte('shift_date', from).lte('shift_date', to).order('start_time'),
      sb.rpc('hub_inbox_mine')
    ]);
    if (sess.error) throw sess.error; if (shifts.error) throw shifts.error;
    const sessions = (sess.data || []).filter(x => x.session_type !== 'festival');
    const ids = sessions.map(x => x.id);
    const bk = ids.length ? await sb.from('bookings').select('session_id, qty').in('session_id', ids).gt('qty', 0).is('returned_at', null) : { data: [] };
    const booked = {}; (bk.data || []).forEach(b => { booked[b.session_id] = (booked[b.session_id] || 0) + (b.qty || 0); });
    const week2 = sessions.filter(x => /\bclass\s+([2-9]|\d{2,})\s+of\s+\d+/i.test(x.title || ''));
    const rosters = await Promise.all(week2.map(x => sb.rpc('get_class_week_bookings', { p_session_id: x.id })));
    week2.forEach((x, i) => { if (!rosters[i].error) booked[x.id] = (rosters[i].data || []).reduce((n, b) => n + (b.qty || 0), 0); });
    // the studio's team (its own staff), as rows even with no shifts this week
    let team = []; try { const tr = await sb.rpc('hub_board_staff', { p_studio: st }); team = (tr.data || []).filter(x => x.here).map(x => x.id); } catch (e) {}
    const staffIds = [...new Set((shifts.data || []).map(r => r.staff_id).concat(team))];
    const [toffR, unavR] = staffIds.length ? await Promise.all([
      sb.from('staff_time_off').select('staff_id, start_date, end_date, start_time, end_time, status').in('staff_id', staffIds).in('status', ['approved', 'pending']).lte('start_date', to).gte('end_date', from),
      sb.from('staff_unavailability').select('staff_id, day_of_week, start_time, end_time, effective_from, effective_to').in('staff_id', staffIds)
    ]) : [{ data: [] }, { data: [] }];
    const prof = staffIds.length ? await sb.from('staff_profiles').select('id, display_name, preferred_name, is_active, termination_date').in('id', staffIds) : { data: [] };
    const names = {}, gone = {}; (prof.data || []).forEach(p => { names[p.id] = (p.preferred_name || '').trim() || p.display_name || 'Someone';
      if (p.is_active === false) gone[p.id] = 'deactivated'; else if (p.termination_date && p.termination_date < to) gone[p.id] = 'last day ' + dayLabel(p.termination_date); });
    const days = Array.from({ length: 7 }, (_, i) => addDays(from, i));
    W = { st, from, to, days, sessions, booked, need: need.error ? [] : (need.data || []), needErr: need.error ? need.error.message : '',
          shifts: shifts.data || [], names, gone, team, toff: toffR.data || [], unav: unavR.data || [], inbox: (inbox.data || []).filter(x => x.studio_id === st && x.day && String(x.day).slice(0, 10) >= from && String(x.day).slice(0, 10) <= to) };
    drawWeek();
  } catch (e) { $('main').innerHTML = `<div class="msg"><b>Couldn't load that week.</b><br>${esc(e.message || e)}</div>`; }
}

// need vs scheduled for one day, in 30-minute blocks (the same counting as the nightly staffing check)
function weekCoverage(d) {
  const lo = 8 * 60, hi = 22 * 60, n = (hi - lo) / 30, need = Array(n).fill(0), ppl = Array(n).fill(0), on = Array(n).fill(false), have = Array(n).fill(0);
  W.need.filter(r => String(r.session_date).slice(0, 10) === d && r.start_time && r.end_time).forEach(r => {
    const a = Math.max(0, Math.floor((toMin(r.start_time) - lo) / 30)), z = Math.min(n, Math.ceil((toMin(r.end_time) - lo) / 30));
    for (let i = a; i < z; i++) { on[i] = true; if (r.rule_kind === 'pooled') ppl[i] += +r.expected || 0; else need[i] += +r.teachers || 0; }
  });
  for (let i = 0; i < n; i++) { if (ppl[i] > 0) need[i] += Math.ceil(ppl[i] / 25); if (on[i] && need[i] < 1) need[i] = 1; }
  const dayShifts = W.shifts.filter(x => x.shift_date === d && x.start_time && x.end_time);
  const approved = dayShifts.filter(x => x.status !== 'draft'), use = approved.length ? approved : dayShifts;
  use.forEach(x => { const a = Math.max(0, Math.floor((toMin(x.start_time) - lo) / 30)), z = Math.min(n, Math.ceil((toMin(x.end_time) - lo) / 30)); for (let i = a; i < z; i++) have[i]++; });
  const cls = need.map((v, i) => have[i] < v ? 'short' : have[i] > v ? (v > 0 || have[i] > 0 ? 'over' : 'idle') : v > 0 ? 'ok' : 'idle');
  const hrs = arr => Math.round(arr.reduce((t, v) => t + v, 0) * 5) / 10;
  return { cls, needH: hrs(need), haveH: hrs(have), drafts: !approved.length && dayShifts.length > 0, lo };
}

function drawWeek() {

    .concat((W.team || []).filter(id => !withShifts.includes(id) && !(W.gone && W.gone[id])).sort((a, b) => (W.names[a] || '').localeCompare(W.names[b] || '')));
  const items = (d, kinds) => W.inbox.filter(x => String(x.day).slice(0, 10) === d && kinds.includes(x.kind));

      return `<div class="it">🌆 ${esc(x.title)}<div class="muted">${esc(x.detail || '')}</div><select onchange="if(this.value) wkDecide('${x.id}','evening',this.value)"><option value="">Choose…</option>${opts.map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join('')}</select></div>`; }

  };
  const head = days.map(d => { const c = weekCoverage(d), n = W.sessions.filter(x => x.session_date === d && (W.booked[x.id] || 0) > 0).length;
    const todo = W.inbox.filter(x => String(x.day).slice(0, 10) === d).length;

      <div class="cov" title="8am–10pm: red = short, amber = more than needed, green = right">${c.cls.map((k, i) => `<i class="${k}" title="${fmt(c.lo + i * 30)}"></i>`).join('')}</div>
      <small>${n} time${n === 1 ? '' : 's'} booked · need ${c.needH}h, scheduled ${c.haveH}h${c.drafts ? ' (drafts)' : ''}${todo ? ` · <b style="color:var(--bad)">${todo} to decide</b>` : ''}</small>${labCell(d)}</th>`; }).join('');
  const shiftRows = people.map(pid => `<tr${W.gone && W.gone[pid] ? ' class="gone"' : ''}><td class="lbl"><b>${esc(W.names[pid] || 'Someone')}</b>${W.gone && W.gone[pid] ? `<span class="gone-tag">${esc(W.gone[pid])}</span>` : ''}<small>${Math.round(W.shifts.filter(x => x.staff_id === pid).reduce((t, x) => t + (toMin(x.end_time) - toMin(x.start_time)), 0) / 6) / 10}h this week</small></td>${days.map(d => {
      const mine = W.shifts.filter(x => x.staff_id === pid && x.shift_date === d);

  const nDraft = W.shifts.filter(x => x.status === 'draft').length;

let _labT = null;
function wkLabourSoon() {
  clearTimeout(_labT);
  _labT = setTimeout(async () => {
    if (!W || W._labOff) return;
    const st = W.st, from = W.from;
    const { data, error } = await sb.rpc('hub_day_labour', { p_studio_id: st, p_from: W.from, p_to: W.to, p_drafts: true });
    if (!W || W.st !== st || W.from !== from) return;   // (moved on to another week)
    if (error || !data) { W._labOff = true; return; }   // (not a home office login, or not set up yet: nothing shown)
    const byDay = {}; (data.days || []).forEach(x => { byDay[x.date] = x; });
    W.labour = { total: data.total_pct, totalExp: data.total_exp_pct, byDay }; drawWeek();
  }, 600);
}
const labClass = pct => pct == null ? '' : pct <= 30 ? 'ok' : pct <= 40 ? 'mid' : 'high';
const EXP_TIP = 'Expected: adds the late bookings this kind of time usually gets from this many days out (from past weeks), at its price';
function labCell(d) {

  return `<div class="lab ${labClass(x.pct)}" title="Estimated labour: staff cost (scheduled shifts, drafts included) ÷ the revenue of that day's bookings so far">Labour ≈ ${x.pct}% now</div>${exp}`;
}
// ---- time off and unavailability (staff_time_off, staff_unavailability) ----
function offOn(pid, d) {
  const out = [];
  (W.toff || []).filter(o => o.staff_id === pid && o.start_date <= d && o.end_date >= d).forEach(o => out.push({ kind: 'toff', pending: o.status === 'pending',
    times: o.start_time && o.end_time ? `${fmt(toMin(o.start_time))}–${fmt(toMin(o.end_time))}` : '' }));
  const dow = new Date(d + 'T12:00:00').getDay();
  (W.unav || []).filter(u => u.staff_id === pid && u.day_of_week === dow && (!u.effective_from || u.effective_from <= d) && (!u.effective_to || u.effective_to >= d))
    .forEach(u => out.push({ kind: 'unav', times: u.start_time && u.end_time ? `${fmt(toMin(u.start_time))}–${fmt(toMin(u.end_time))}` : '' }));
  return out;
}
function offChips(pid, d) {
  return offOn(pid, d).map(o => o.kind === 'toff'
    ? `<div class="off toff" title="Time off${o.pending ? ' (not approved yet)' : ''}">Time off${o.times ? ' ' + o.times : ''}${o.pending ? ' · pending' : ''}</div>`
    : `<div class="off unav" title="Their regular unavailability">Unavailable${o.times ? ' ' + o.times : ''}</div>`).join('');
}
// a shift that overlaps their time off or unavailability (all day, or the hours given)
function offClash(pid, d, sh) {
  const a = toMin(sh.start_time), z = toMin(sh.end_time);
  return offOn(pid, d).some(o => { if (!o.times) return true; const [x, y] = o.times.split('–').map(t => parseRange(t + '-' + t) ? parseRange(t + '-' + t).start : null); return x != null && y != null ? a < y && z > x : true; });
}
function offWarn(pid, d) {
  const o = offOn(pid, d); if (!o.length) return true;
  const what = o.map(x => (x.kind === 'toff' ? 'time off' + (x.pending ? ' (pending)' : '') : 'unavailable') + (x.times ? ' ' + x.times : ' all day')).join(' and ');
  return confirm(`${W.names[pid] || 'They'}: ${what} on ${dayLabel(d)}. Add the shift anyway?`);
}
// ---- dragging a shift to another day / person (HTML drag and drop: a computer, where the week board is used) ----
function wkWireDrag() {
  document.querySelectorAll('.wk .sh[draggable]').forEach(el => {
    el.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', el.dataset.shift); e.dataTransfer.effectAllowed = 'move'; el.classList.add('dragging'); });
    el.addEventListener('dragend', () => el.classList.remove('dragging'));
  });
  document.querySelectorAll('.wk td.drop').forEach(td => {
    td.addEventListener('dragover', e => { e.preventDefault(); td.classList.add('over'); });
    td.addEventListener('dragleave', () => td.classList.remove('over'));
    td.addEventListener('drop', e => { e.preventDefault(); td.classList.remove('over'); wkMove(e.dataTransfer.getData('text/plain'), td.dataset.staff, td.dataset.day); });
  });
}
async function wkMove(id, staff, day) {
  const sh = W.shifts.find(x => String(x.id) === String(id)); if (!sh || (sh.staff_id === staff && sh.shift_date === day)) return;
  if (!offWarn(staff, day)) return;
  const { data, error } = await sb.rpc('hub_board_shift_move', { p_id: String(id), p_staff: staff, p_date: day });
  if (error) { alert(/hub_board_shift_move/.test(error.message) ? 'Run week_board.sql in Supabase first.' : error.message); return; }
  const was = `${W.names[sh.staff_id] || ''} ${dayLabel(sh.shift_date)}`, oldStaff = sh.staff_id, oldDay = sh.shift_date;
  sh.staff_id = staff; sh.shift_date = day;
  W.inbox = W.inbox.filter(i => !(i.kind === 'cut_shift' && i.payload && String(i.payload.shift_id) === String(id)));
  if (sh.status !== 'draft') {
    const t = `${fmt(toMin(sh.start_time))}–${fmt(toMin(sh.end_time))}`;
    if (oldStaff === staff) queueNotify(staff, W.names[staff], `${dayLabel(oldDay)} → ${dayLabel(day)} (${t})`);
    else { queueNotify(oldStaff, W.names[oldStaff], `${dayLabel(oldDay)}: shift removed (${t})`); queueNotify(staff, W.names[staff], `${dayLabel(day)}: new shift ${t}`); }
  }
  W.flash = `Moved: ${was} → ${W.names[staff] || ''} ${dayLabel(day)}.`; drawWeek();
}
async function wkRemove(id) {
  const sh = W.shifts.find(x => String(x.id) === String(id)); if (!sh) return;
  if (!confirm(`Remove ${W.names[sh.staff_id] || 'this'}'s shift on ${dayLabel(sh.shift_date)} (${fmt(toMin(sh.start_time))}–${fmt(toMin(sh.end_time))})?`)) return;
  const { error } = await sb.rpc('hub_board_shift_set', { p_id: String(id), p_start: null, p_end: null, p_remove: true });
  if (error) { alert(error.message); return; }
  W.shifts = W.shifts.filter(x => x !== sh);
  W.inbox = W.inbox.filter(i => !(i.kind === 'cut_shift' && i.payload && String(i.payload.shift_id) === String(id)));
  if (sh.status !== 'draft') queueNotify(sh.staff_id, W.names[sh.staff_id], `${dayLabel(sh.shift_date)}: shift removed (was ${fmt(toMin(sh.start_time))}–${fmt(toMin(sh.end_time))})`);
  W.flash = 'Shift removed.'; drawWeek();
}
async function wkAddFor(staff, day, nameKnown) {
  if (W.names[staff] && !offWarn(staff, day)) return;
  const v = prompt(`${W.names[staff] || nameKnown || 'Add a shift'}, ${dayLabel(day)}: times (e.g. 9a-5p, at least 3 hours)`, '9a-5p'); if (!v) return;
  const r = parseRange(v); if (!r) { alert('Use a time like 9a-5p, with a or p on both times.'); return; }
  const { data, error } = await sb.rpc('hub_board_shift_add', { p_staff: staff, p_studio: W.st, p_date: day, p_start: hhmm(r.start), p_end: hhmm(r.end) });
  if (error) { alert(/hub_board_shift_add/.test(error.message) ? 'Run week_board.sql in Supabase first.' : error.message); return; }
  if (nameKnown) W.names[staff] = nameKnown;
  W.shifts.push({ id: data && data.id, staff_id: staff, shift_date: day, start_time: hhmm(r.start) + ':00', end_time: hhmm(r.end) + ':00', status: 'draft' });
  W.flash = `Added ${W.names[staff] || ''}: ${dayLabel(day)} ${fmt(r.start)}–${fmt(r.end)} (a draft).`; drawWeek();
}
let _wkStaff = null;

    <div class="row2"><button id="pop-ok">Next: the times</button><button id="pop-x">Cancel</button></div>`;

    const inf = _wkStaff.list.find(x => x.id === who) || {}; closePop(); wkAddFor(who, day, inf.name); };

async function wkPublishWeek() {
  const n = W.shifts.filter(x => x.status === 'draft').length; if (!n) return;
  if (!confirm(`Publish ${n} draft shift${n === 1 ? '' : 's'} for the week of ${dayLabel(W.from)}? They become approved; staff are told when you press Send updates to staff.`)) return;
  const { data, error } = await sb.rpc('hub_board_week_publish', { p_studio: W.st, p_from: W.from, p_to: W.to });
  if (error) { alert(/hub_board_week_publish/.test(error.message) ? 'Run week_board.sql in Supabase first.' : error.message); return; }
  W.shifts.forEach(x => { if (x.status === 'draft') { queueNotify(x.staff_id, W.names[x.staff_id], `${dayLabel(x.shift_date)}: new shift ${fmt(toMin(x.start_time))}–${fmt(toMin(x.end_time))}`); x.status = 'approved'; } });

function openDay(d) { $('date').value = d; setMode('day'); }
async function wkDecide(id, action, value) {
  const { data, error } = await sb.rpc('hub_inbox_decide', { p_id: id, p_action: action, p_start: null, p_end: null, p_value: value || null });
  if (error) { alert(error.message); return; }
  const x = W.inbox.find(i => i.id === id);
  W.inbox = W.inbox.filter(i => i.id !== id);
  if (x && x.kind === 'cut_shift' && action === 'approve') {
    const P = x.payload || {}, sh = W.shifts.find(z => String(z.id) === String(P.shift_id));
    if (sh) { if (P.action === 'remove') W.shifts = W.shifts.filter(z => z !== sh); else if (P.action === 'end' && P.new_end) sh.end_time = P.new_end; else if (P.action === 'start' && P.new_start) sh.start_time = P.new_start; }
  }

async function wkClose(id, close) {

  const { error } = await sb.rpc('hub_board_session_close', { p_id: id, p_close: close });
  if (error) { alert(/hub_board_session_close/.test(error.message) ? 'Run week_board.sql in Supabase first.' : error.message); return; }
  if (s) s.spaces_left_cache = close ? 0 : Math.max(1, (+s.capacity || 1) - (W.booked[id] || 0));

async function wkShift(id) {
  const sh = W.shifts.find(x => String(x.id) === String(id)); if (!sh) return;
  const v = prompt(`${W.names[sh.staff_id] || 'Shift'}, ${dayLabel(sh.shift_date)}: new times (e.g. 8:30a-5p, at least 3 hours), or type "remove"`, fmt(toMin(sh.start_time)) + '-' + fmt(toMin(sh.end_time)));

  else { const r = parseRange(v); if (!r) { alert('Use a time like 8:30a-5p, with a or p on both times.'); return; }
    args = { p_id: String(id), p_start: hhmm(r.start), p_end: hhmm(r.end), p_remove: false }; }
  const { data, error } = await sb.rpc('hub_board_shift_set', args);
  if (error) { alert(/hub_board_shift_set/.test(error.message) ? 'Run week_board.sql in Supabase first.' : error.message); return; }

}
