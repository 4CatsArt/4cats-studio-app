<!DOCTYPE html>
<!-- staff.html — 4Cats staff files (Nov 14 2026, version 1).
     One page per person: staff.html?id=<staff_profiles.id>. Home office logins only for now.
     Everything comes from the staff_file_* functions (staff_file.sql), which check access.html
     permissions on the server: the page only shows what the server sends back.
     Wage uses the existing wage check (wage_access_level / get_staff_wage_for_entry).
     Editing details still happens in admin.html (Edit details opens that person there). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4Cats Staff files</title>
<link rel="icon" type="image/png" href="hub-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"></script>
<style>
:root {
  --accent: #6d4aeb; --accent-deep: #5636c9; --accent-soft: #ece7ff;
  --page-bg: #f5f4fb; --card: #ffffff; --ink: #1f1b3a; --ink-soft: #6b6a80; --border: #eceaf6;
  --green: #16a34a; --green-bg: #e3f9ec; --amber: #b45309; --amber-bg: #fef3d6;
  --pink: #be185d; --pink-bg: #fce7f3; --blue: #1d4ed8; --blue-bg: #dbeafe;
  --red: #dc2626; --red-bg: #fee2e2; --gold: #f5a623;
  --radius: 16px; --shadow: 0 1px 2px rgba(31,27,58,.04), 0 8px 24px -8px rgba(31,27,58,.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif; background: var(--page-bg); color: var(--ink); font-size: 14px; min-height: 100vh; }
button, input, select { font: inherit; }
.fred { font-family: Fredoka, Inter, sans-serif; }

/* sign-in */
#login { display: none; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
.login-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 2rem; width: 100%; max-width: 380px; text-align: center; }
.login-card h1 { font-family: Fredoka, sans-serif; font-size: 26px; margin-bottom: 4px; }
.login-card p { color: var(--ink-soft); margin-bottom: 1.4rem; }
.login-card input { width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; }
.login-card button { width: 100%; padding: 11px; border: none; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
.err { color: var(--red); font-size: 13px; margin-top: 8px; min-height: 1em; }

/* layout */
#app { display: none; }
header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 14px; padding: 12px 20px;
  background: linear-gradient(90deg, #211c49, #3a3080); color: #fff; }
header h1 { font-family: Fredoka, sans-serif; font-size: 20px; font-weight: 600; }
header .sp { flex: 1; }
header a, header button.link { color: #d9d3ff; font-size: 13px; background: none; border: none; cursor: pointer; text-decoration: none; }
header a:hover, header button.link:hover { color: #fff; text-decoration: underline; }
header .who { color: #b9b2e6; font-size: 12px; }
.layout { display: grid; grid-template-columns: 300px 1fr; height: calc(100vh - 52px); }
.side { background: var(--card); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.side .tools { padding: 12px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--border); }
.side input, .side select { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 10px; background: #fff; }
.side .row { display: flex; gap: 8px; }
.side .count { color: var(--ink-soft); font-size: 12px; }
.people { overflow-y: auto; flex: 1; padding: 6px; }
.person { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; cursor: pointer; }
.person:hover { background: #f7f6fd; }
.person.on { background: var(--accent-soft); }
.person .n { font-weight: 600; }
.person .s { color: var(--ink-soft); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.person.off .n { color: #9a99ad; }
.main { overflow-y: auto; padding: 22px 28px 80px; min-height: 0; }
.empty { color: var(--ink-soft); padding: 60px 0; text-align: center; }

.av { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; overflow: hidden; flex-shrink: 0; font-weight: 700; }
.av img { width: 100%; height: 100%; object-fit: cover; }

/* the file */
.hero { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); padding: 22px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; position: relative; overflow: hidden; }
.hero::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, var(--accent), #f472b6, var(--gold)); }
.hero h2 { font-family: Fredoka, sans-serif; font-size: 28px; font-weight: 600; line-height: 1.1; }
.hero .nick { color: var(--accent-deep); font-weight: 600; margin-top: 2px; }
.hero .meta { color: var(--ink-soft); margin-top: 6px; }
.hero .actions { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #f0eff7; color: var(--ink-soft); }
.chip.green { background: var(--green-bg); color: var(--green); }
.chip.amber { background: var(--amber-bg); color: var(--amber); }
.chip.red { background: var(--red-bg); color: var(--red); }
.chip.blue { background: var(--blue-bg); color: var(--blue); }
.chip.purple { background: var(--accent-soft); color: var(--accent-deep); }
.chip.pink { background: var(--pink-bg); color: var(--pink); }
.btn { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--ink); text-decoration: none; display: inline-block; }
.btn:hover { border-color: var(--accent); color: var(--accent-deep); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-deep); color: #fff; }

.tabs { display: flex; gap: 6px; margin: 18px 0 14px; flex-wrap: wrap; }
.tab { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--ink-soft); }
.tab.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.tab .n { opacity: .65; margin-left: 4px; font-weight: 500; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; }
.card h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); margin-bottom: 10px; font-weight: 700; }
.card + .card { margin-top: 14px; }
.grid .card + .card { margin-top: 0; }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 10px; }
.kv .k { color: var(--ink-soft); }
.muted { color: var(--ink-soft); }
.small { font-size: 12px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 14px; }
.tile { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; cursor: pointer; }
.tile .big { font-family: Fredoka, sans-serif; font-size: 28px; font-weight: 600; }
.tile .lbl { color: var(--ink-soft); font-size: 12px; font-weight: 600; }

/* badges */
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.badge { border-radius: 16px; padding: 14px 10px; text-align: center; border: 2px dashed #dcd9ea; background: #fbfaff; position: relative; }
.badge .medal { width: 56px; height: 56px; margin: 0 auto 8px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; background: #eeedf5; filter: grayscale(1); opacity: .5; }
.badge.has { border: 2px solid transparent; background: linear-gradient(#fff, #fff) padding-box, linear-gradient(135deg, var(--accent), #f472b6, var(--gold)) border-box; }
.badge.has .medal { background: radial-gradient(circle at 30% 30%, #fff7d6, var(--gold)); filter: none; opacity: 1; box-shadow: 0 4px 12px -4px rgba(245,166,35,.6); }
.badge .bl { font-weight: 700; font-size: 13px; }
.badge .bd { color: var(--ink-soft); font-size: 11px; margin-top: 3px; }
.badge .bw { color: var(--ink-soft); font-size: 11px; margin-top: 6px; }
.badge button { margin-top: 8px; font-size: 11px; padding: 4px 10px; }

/* training */
.unit { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
.unit .top { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.unit .name { font-weight: 700; flex: 1; }
.bar { height: 8px; border-radius: 99px; background: #eeedf5; overflow: hidden; margin-top: 8px; }
.bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #a78bfa); border-radius: 99px; }
.bar.done > span { background: linear-gradient(90deg, var(--green), #4ade80); }
.items { margin-top: 10px; display: none; }
.unit.open .items { display: block; }
.item { display: flex; gap: 8px; padding: 5px 0; border-top: 1px dashed var(--border); font-size: 13px; }
.item .tick { width: 18px; text-align: center; }

/* moments */
.moment { background: linear-gradient(135deg, #fff, #fff8fc); border-left: 4px solid #f472b6; }
.moment .story { white-space: pre-wrap; line-height: 1.55; }
.moment .by { color: var(--ink-soft); font-size: 12px; margin-top: 8px; }

table.list { width: 100%; border-collapse: collapse; }
table.list td, table.list th { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: top; }
table.list th { color: var(--ink-soft); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
.soon { text-align: center; padding: 40px 20px; }
.soon .big { font-size: 40px; }
.locked { color: var(--ink-soft); font-style: italic; }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 12px; display: none; z-index: 99; font-size: 13px; }
.toast.err { background: var(--red); }

@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; height: auto; }
  .side { max-height: 40vh; }
  .main { padding: 16px; }
}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <h1>👥 Staff files</h1>
    <p>Sign in with your home office login</p>
    <input id="email" type="email" placeholder="Email" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button onclick="signIn()">Sign in</button>
    <div class="err" id="login-err"></div>
  </div>
</div>

<div id="app">
  <header>
    <h1>👥 Staff files</h1>
    <span class="sp"></span>
    <span class="who" id="who"></span>
    <a href="hub.html">Hub</a>
    <a href="admin.html">Home office</a>
    <button class="link" onclick="signOut()">Sign out</button>
  </header>
  <div class="layout">
    <aside class="side">
      <div class="tools">
        <input type="search" id="q" placeholder="Search by name or nickname" oninput="renderList()">
        <div class="row">
          <select id="f-studio" onchange="renderList()"><option value="">All studios</option></select>
          <select id="f-active" onchange="renderList()" style="width:120px">
            <option value="1">Active</option><option value="0">Inactive</option><option value="">Everyone</option>
          </select>
        </div>
        <div class="count" id="count"></div>
      </div>
      <div class="people" id="people"></div>
    </aside>
    <main class="main" id="main"><div class="empty">Pick someone to open their file.</div></main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://snxibhbhhchjthfmjtaj.supabase.co'
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNueGliaGJoaGNoanRoZm1qdGFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTk2ODAsImV4cCI6MjA5MjYzNTY4MH0.K-89Mx4SxU6N1hMmtK6Q79rWAtk6VTN9b5wemQxcZVA'
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

const STUDIO_NAMES = { 'BC-RICH-GC': 'Richmond Garden City', 'BC-RICH-STV': 'Richmond Steveston', 'BC-SUR-SSR': 'Surrey South', 'BC-YVR-KIT': 'Vancouver Kitsilano',
  'BC-YVR-MS': 'Vancouver Main Street', 'BC-YVR-UBC': 'Vancouver UBC', 'BC-YYJ-CSV': 'Victoria Cook Street Village', 'BC-YYJ-ESQ': 'Victoria Esquimalt', 'BC-YYJ-OB': 'Victoria Oak Bay',
  'BC-YYJ-VIC': 'Victoria Uptown', 'AB-YYC-ING': 'Calgary Inglewood', 'AB-STA-STA': 'St Albert', 'ON-BRL-BRL': 'Burlington South', 'ON-CMB-GLT': 'Cambridge Galt', 'ON-ERN-ERN': 'Erin',
  'ON-HAM-OS': 'Hamilton Ottawa Street', 'ON-HAM-WD': 'Hamilton Waterdown', 'ON-HAM-WH': 'Hamilton West Harbour', 'ON-KGN-AP': 'Kingston Arlington Park', 'ON-LDN-BYR': 'London Byron',
  'ON-LDN-WVG': 'London Wortley Village', 'ON-MIS-PC': 'Mississauga Port Credit', 'ON-OAK-OAK': 'Oakville North', 'ON-OAK-WST': 'Oakville West', 'ON-YOW-GLB': 'Ottawa The Glebe',
  'ON-STC-STC': 'St Catharines', 'ON-YYZ-AVE': 'Toronto Avenue Road', 'ON-YYZ-BP': 'Toronto Baby Point', 'ON-YYZ-LEA': 'Toronto Leaside', 'ON-YYZ-BEA': 'Toronto The Beaches', 'ON-WTR-WTR': 'Waterloo Uptown' }
const ROLE_NAMES = { staff: 'Staff', manager: 'Manager', admin: 'Home office' }
const AVATAR_TINTS = ['#ece7ff', '#dbeafe', '#e3f9ec', '#fce7f3', '#fef3d6', '#e0f2fe', '#fde2e2', '#ede9fe']
const AVATAR_INKS = ['#5636c9', '#1d4ed8', '#15803d', '#be185d', '#b45309', '#0369a1', '#b91c1c', '#6d28d9']
const BADGE_ICONS = { wheel: '🏺', solo: '⭐', director: '🎬', demo: '🎨', party: '🎉', circl: '🔄', kids: '🧒', camp: '🏕️', clay: '🏺', glaz: '🖌️', safety: '🛟', first: '🩹' }
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December']

let PEOPLE = [], SEL = null, FILE = null, TAB = 'overview', WAGE = null

const $ = id => document.getElementById(id)
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const studioName = id => STUDIO_NAMES[id] || id || ''
function toast(msg, err) {
  const t = $('toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.style.display = 'block'
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.style.display = 'none' }, err ? 6000 : 2000)
}
function dateOnly(d) { if (!d) return null; const [y, m, dd] = String(d).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, dd) }
function fmtDate(d, withYear = true) {
  const x = String(d || '').length > 10 ? new Date(d) : dateOnly(d)
  if (!x) return ''
  return x.toLocaleDateString('en-CA', withYear ? { month: 'short', day: 'numeric', year: 'numeric' } : { weekday: 'short', month: 'short', day: 'numeric' })
}
function fmtTime(t) {
  if (!t) return ''
  let [h, m] = String(t).split(':').map(Number)
  const ap = h >= 12 ? 'p' : 'a'; h = h % 12 || 12
  return h + (m ? ':' + String(m).padStart(2, '0') : '') + ap
}
function tenure(hire) {
  const h = dateOnly(hire); if (!h) return ''
  const now = new Date(); let months = (now.getFullYear() - h.getFullYear()) * 12 + now.getMonth() - h.getMonth()
  if (now.getDate() < h.getDate()) months--
  if (months < 1) return 'new this month'
  const y = Math.floor(months / 12), m = months % 12
  return [y ? y + ' yr' + (y > 1 ? 's' : '') : '', m ? m + ' mo' : ''].filter(Boolean).join(' ')
}
function tintIndex(seed) { let h = 0; const t = String(seed || ''); for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) >>> 0; return h % AVATAR_TINTS.length }
function avatar(p, size) {
  const i = tintIndex(p.id || p.display_name), name = p.preferred_name || p.display_name || ''
  const inner = p.avatar_key
    ? `<img src="${esc(sb.storage.from('staff-avatars').getPublicUrl(p.avatar_key).data.publicUrl)}" alt="" loading="lazy">`
    : `<span style="color:${AVATAR_INKS[i]};font-size:${Math.round(size * .42)}px">${esc(name.trim().charAt(0).toUpperCase() || '?')}</span>`
  return `<span class="av" style="width:${size}px;height:${size}px;background:${AVATAR_TINTS[i]}">${inner}</span>`
}
function badgeIcon(b) {
  const k = (b.code + ' ' + b.label).toLowerCase()
  for (const key in BADGE_ICONS) if (k.includes(key)) return BADGE_ICONS[key]
  return '🏅'
}
function nameLine(p) { return p.preferred_name && p.preferred_name !== p.display_name ? `${p.preferred_name} (${p.display_name})` : p.display_name }

// ---------- sign-in ----------
async function signIn() {
  $('login-err').textContent = ''
  const r = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value })
  if (r.error) { $('login-err').textContent = "That email and password didn't match."; return }
  start()
}
async function signOut() { await sb.auth.signOut(); location.href = location.pathname }
document.addEventListener('keydown', e => { if (e.key === 'Enter' && $('login').style.display === 'flex') signIn() })

async function start() {
  const { data: { session } } = await sb.auth.getSession()
  if (!session) { $('login').style.display = 'flex'; return }
  const r = await sb.rpc('staff_file_list')
  if (r.error) {
    $('login').style.display = 'flex'
    $('login-err').textContent = /function/i.test(r.error.message) ? 'Staff files aren’t set up yet (run staff_file.sql).' : 'This login can’t open staff files. Ask an owner.'
    return
  }
  PEOPLE = r.data || []
  $('login').style.display = 'none'; $('app').style.display = 'block'
  $('who').textContent = session.user.email
  const studios = [...new Set(PEOPLE.flatMap(p => (p.studio_ids || []).concat(p.home_studio_id || [])))].filter(Boolean)
  $('f-studio').innerHTML = '<option value="">All studios</option>' +
    studios.sort((a, b) => studioName(a).localeCompare(studioName(b))).map(s => `<option value="${esc(s)}">${esc(studioName(s))}</option>`).join('')
  sb.rpc('wage_access_level').then(w => { WAGE = w.error ? 'none' : w.data })
  renderList()
  const id = new URLSearchParams(location.search).get('id')
  if (id) openFile(id, true)
}
window.addEventListener('popstate', () => {
  const id = new URLSearchParams(location.search).get('id')
  if (id) openFile(id, true); else { SEL = null; FILE = null; $('main').innerHTML = '<div class="empty">Pick someone to open their file.</div>'; renderList() }
})

// ---------- the list ----------
function renderList() {
  const q = $('q').value.trim().toLowerCase(), st = $('f-studio').value, act = $('f-active').value
  const rows = PEOPLE.filter(p => {
    if (act === '1' && !p.is_active) return false
    if (act === '0' && p.is_active) return false
    if (st && !(p.studio_ids || []).includes(st) && p.home_studio_id !== st) return false
    if (q && ![p.display_name, p.nickname, p.preferred_name].some(x => String(x || '').toLowerCase().includes(q))) return false
    return true
  })
  $('count').textContent = `${rows.length} ${rows.length === 1 ? 'person' : 'people'}`
  $('people').innerHTML = rows.map(p => {
    const studios = p.home_studio_id ? studioName(p.home_studio_id) : (p.studio_ids || []).map(studioName).join(', ')
    return `<div class="person${p.id === SEL ? ' on' : ''}${p.is_active ? '' : ' off'}" onclick="openFile('${p.id}')">
      ${avatar(p, 38)}
      <div style="min-width:0"><div class="n">${esc(nameLine(p))}</div>
      <div class="s">${esc(p.nickname ? p.nickname + ' · ' : '')}${esc(studios || 'No studio')}</div></div></div>`
  }).join('') || '<div class="empty small">No one matches.</div>'
}

// ---------- one file ----------
async function openFile(id, fromUrl) {
  SEL = id; renderList()
  if (!fromUrl) history.pushState(null, '', '?id=' + encodeURIComponent(id))
  $('main').innerHTML = '<div class="empty">Opening…</div>'
  const r = await sb.rpc('staff_file', { p_staff_id: id })
  if (SEL !== id) return
  if (r.error) { $('main').innerHTML = `<div class="empty">${esc(r.error.message)}</div>`; return }
  FILE = r.data
  FILE.wage = null
  if (WAGE && WAGE !== 'none') {
    const w = await sb.rpc('get_staff_wage_for_entry', { p_staff_id: id })
    FILE.wage = w.error ? { error: true } : (w.data && w.data[0]) || null
  }
  if (TAB === 'wage' && !(WAGE && WAGE !== 'none')) TAB = 'overview'
  document.title = `${FILE.profile.preferred_name || FILE.profile.display_name} · 4Cats Staff files`
  renderFile()
}

function counts() {
  const f = FILE
  const items = f.training.flatMap(u => u.items), done = items.filter(i => i.done).length
  const pol = (f.policies && f.policies.items) || []
  return {
    badges: f.badges.filter(b => b.has).length,
    trainPct: items.length ? Math.round(done / items.length * 100) : null,
    moments: f.moments.length,
    polDue: pol.filter(p => p.status === 'overdue' || p.status === 'due').length,
    polOverdue: pol.filter(p => p.status === 'overdue').length
  }
}

function renderFile() {
  const p = FILE.profile, c = counts()
  const today = new Date(); today.setHours(0, 0, 0, 0)
  const onLeave = p.leave_from && dateOnly(p.leave_from) <= today && (!p.leave_until || dateOnly(p.leave_until) >= today)
  const ended = p.termination_date && dateOnly(p.termination_date) < today
  const studios = [...new Set((p.studio_ids || []).concat(p.home_studio_id || []))].filter(Boolean)
  const chips = [
    `<span class="chip purple">${esc(ROLE_NAMES[p.role] || p.role || 'Staff')}</span>`,
    p.employment_type ? `<span class="chip">${esc(p.employment_type.replace(/_/g, ' '))}</span>` : '',
    !p.is_active || ended ? '<span class="chip red">Inactive</span>' : '<span class="chip green">Active</span>',
    onLeave ? `<span class="chip amber">On leave${p.leave_until ? ' until ' + esc(fmtDate(p.leave_until)) : ''}</span>` : '',
    p.on_call ? `<span class="chip blue">On call${p.on_call_until ? ' until ' + esc(fmtDate(p.on_call_until)) : ''}</span>` : '',
    p.exclude_from_schedule ? '<span class="chip amber">Not scheduled</span>' : '',
    !p.has_login ? '<span class="chip">No personal login</span>' : ''
  ].join('')
  const tabs = [
    ['overview', 'Overview'], ['training', 'Training & badges', c.badges], ['evals', 'Evaluations'],
    ['moments', 'Magical moments', c.moments], ['policies', 'Policies', c.polDue || ''], ['time', 'Time']
  ]
  if (WAGE && WAGE !== 'none') tabs.push(['wage', 'Wage'])
  $('main').innerHTML = `
    <div class="hero">
      ${avatar(p, 92)}
      <div style="min-width:0">
        <h2>${esc(p.preferred_name || p.display_name)}</h2>
        ${p.nickname ? `<div class="nick">“${esc(p.nickname)}”</div>` : ''}
        <div class="meta">${esc(studios.map(studioName).join(' · ') || 'No studio')}${p.hire_date ? ` · with 4Cats ${esc(tenure(p.hire_date))}` : ''}</div>
        <div class="chips">${chips}</div>
      </div>
      <div class="actions">
        <a class="btn" href="admin.html?staff=${encodeURIComponent(p.id)}" target="_blank" rel="noopener">${FILE.can_edit ? '✏️ Edit details' : '👁 Details in admin'}</a>
      </div>
    </div>
    <div class="tabs">${tabs.map(([k, l, n]) => `<button class="tab${TAB === k ? ' on' : ''}" onclick="setTab('${k}')">${l}${n ? `<span class="n">${n}</span>` : ''}</button>`).join('')}</div>
    <div id="pane">${pane()}</div>`
}
function setTab(k) { TAB = k; renderFile() }
function pane() {
  switch (TAB) {
    case 'training': return paneTraining()
    case 'evals': return paneEvals()
    case 'moments': return paneMoments()
    case 'policies': return panePolicies()
    case 'time': return paneTime()
    case 'wage': return paneWage()
    default: return paneOverview()
  }
}

// ---------- Overview ----------
function paneOverview() {
  const p = FILE.profile, c = counts()
  const tile = (big, lbl, tab, tone) => `<div class="tile" onclick="setTab('${tab}')"><div class="big" style="${tone ? 'color:' + tone : ''}">${big}</div><div class="lbl">${lbl}</div></div>`
  const bday = p.birthday_month ? `${MONTHS[p.birthday_month - 1]}${p.birthday_day ? ' ' + p.birthday_day : ''}` : ''
  const row = (k, v) => v ? `<div class="k">${k}</div><div>${v}</div>` : ''
  return `
    <div class="tiles">
      ${tile(c.badges, 'Badges earned', 'training', 'var(--gold)')}
      ${tile(c.trainPct == null ? '—' : c.trainPct + '%', 'Training done', 'training', 'var(--accent)')}
      ${tile(c.moments, 'Magical moments', 'moments', 'var(--pink)')}
      ${tile(c.polDue, c.polOverdue ? `Policies to sign (${c.polOverdue} overdue)` : 'Policies to sign', 'policies', c.polOverdue ? 'var(--red)' : c.polDue ? 'var(--amber)' : 'var(--green)')}
    </div>
    <div class="grid">
      <div class="card"><h3>Contact</h3><div class="kv">
        ${row('Email', p.email ? `<a href="mailto:${esc(p.email)}">${esc(p.email)}</a>` : '')}
        ${row('Phone', p.phone ? `<a href="tel:${esc(p.phone)}">${esc(p.phone)}</a>` : '')}
        ${row('Emergency', p.emergency_contact_name ? esc(p.emergency_contact_name) + (p.emergency_contact_phone ? ` · <a href="tel:${esc(p.emergency_contact_phone)}">${esc(p.emergency_contact_phone)}</a>` : '') : '')}
        ${!p.email && !p.phone && !p.emergency_contact_name ? '<div class="muted" style="grid-column:1/-1">No contact details yet.</div>' : ''}
      </div>${p.contact_updated_at ? `<div class="muted small" style="margin-top:8px">Updated ${esc(fmtDate(p.contact_updated_at))}</div>` : ''}</div>
      <div class="card"><h3>Dates</h3><div class="kv">
        ${row('Hired', p.hire_date ? esc(fmtDate(p.hire_date)) + ` <span class="muted">(${esc(tenure(p.hire_date))})</span>` : '')}
        ${row('Birthday', esc(bday))}
        ${row('Leave', p.leave_from ? esc(fmtDate(p.leave_from)) + (p.leave_until ? ' – ' + esc(fmtDate(p.leave_until)) : ' onward') : '')}
        ${row('Last day', p.termination_date ? esc(fmtDate(p.termination_date)) : '')}
        ${row('File created', p.created_at ? esc(fmtDate(p.created_at)) : '')}
      </div></div>
      <div class="card"><h3>Work</h3><div class="kv">
        ${row('Role', esc(ROLE_NAMES[p.role] || p.role || ''))}
        ${row('Employment', esc((p.employment_type || '').replace(/_/g, ' ')))}
        ${row('Home studio', esc(studioName(p.home_studio_id)))}
        ${row('Studios', esc((p.studio_ids || []).map(studioName).join(', ')))}
        ${row('Province', esc(p.province_code || ''))}
      </div></div>
    </div>`
}

// ---------- Training & badges ----------
function paneTraining() {
  const b = FILE.badges, edit = FILE.can_edit
  const badgeHtml = b.length ? `<div class="badges">${b.map(x => `
      <div class="badge${x.has ? ' has' : ''}" title="${esc(x.description || '')}">
        <div class="medal">${badgeIcon(x)}</div>
        <div class="bl">${esc(x.label)}</div>
        ${x.description ? `<div class="bd">${esc(x.description)}</div>` : ''}
        ${x.has ? `<div class="bw">${x.awarded_at ? 'Earned ' + esc(fmtDate(x.awarded_at)) : 'Earned'}${x.awarded_by ? ' · ' + esc(x.awarded_by) : ''}</div>` : ''}
        ${edit ? `<button class="btn" onclick="setBadge('${esc(x.code)}', ${!x.has})">${x.has ? 'Remove' : 'Award'}</button>` : ''}
      </div>`).join('')}</div>` : '<div class="muted">No badges set up yet.</div>'
  const units = FILE.training
  const unitHtml = units.length ? units.map((u, i) => {
    const done = u.items.filter(x => x.done).length, tot = u.items.length, pct = tot ? Math.round(done / tot * 100) : 0
    const due = u.due_date && done < tot ? dateOnly(u.due_date) : null
    const overdue = due && due < new Date(new Date().toDateString())
    return `<div class="unit" id="unit-${i}">
      <div class="top" onclick="document.getElementById('unit-${i}').classList.toggle('open')">
        <span class="name">${esc(u.name)}</span>
        ${due ? `<span class="chip ${overdue ? 'red' : 'amber'}">Due ${esc(fmtDate(u.due_date))}</span>` : ''}
        ${tot && done === tot ? '<span class="chip green">Complete</span>' : `<span class="muted small">${done} of ${tot}</span>`}
        <span class="muted">▾</span>
      </div>
      <div class="bar${tot && done === tot ? ' done' : ''}"><span style="width:${pct}%"></span></div>
      <div class="items">${u.items.map(it => `<div class="item"><span class="tick">${it.done ? '✅' : '⬜️'}</span>
        <span style="flex:1">${it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>` : esc(it.title)}</span>
        <span class="muted small">${it.done && it.done_at ? esc(fmtDate(it.done_at)) : ''}</span></div>`).join('') || '<div class="muted small">No items in this unit.</div>'}</div>
    </div>`
  }).join('') : '<div class="muted">No training units assigned.</div>'
  return `<div class="card"><h3>Badges</h3>${badgeHtml}</div>
    <div class="card"><h3>Training</h3>${unitHtml}
      <div class="muted small" style="margin-top:6px">This is today’s training checklist. It becomes courses in the new training program.</div></div>`
}
async function setBadge(code, on) {
  const b = FILE.badges.find(x => x.code === code)
  const who = FILE.profile.preferred_name || FILE.profile.display_name
  if (!on && !confirm(`Remove “${b.label}” from ${who}?`)) return
  const r = await sb.rpc('staff_file_set_badge', { p_staff_id: FILE.profile.id, p_code: code, p_on: on })
  if (r.error) { toast(r.error.message, true); return }
  toast(on ? `🏅 ${b.label} awarded` : `${b.label} removed`)
  openFile(FILE.profile.id, true)
}

// ---------- Evaluations (coming) ----------
function paneEvals() {
  return `<div class="card soon"><div class="big">📝</div>
    <div class="fred" style="font-size:20px;margin:6px 0">Evaluations are coming</div>
    <div class="muted">Evaluation forms, self-evaluations and their reports will be filed here.</div></div>`
}

// ---------- Magical moments ----------
function paneMoments() {
  const m = FILE.moments
  if (!m.length) return `<div class="card soon"><div class="big">✨</div><div class="muted">No magical moments filed to ${esc(FILE.profile.preferred_name || FILE.profile.display_name)} yet.</div></div>`
  return `<div class="grid">${m.map(x => `<div class="card moment">
      <div class="story">${esc(x.story)}</div>
      <div class="by">${esc(fmtDate(x.created_at))}${x.studio_id ? ' · ' + esc(studioName(x.studio_id)) : ''}${x.submitted_by_name ? ' · from ' + esc(x.submitted_by_name) : ''}${x.customer_name ? ' · about ' + esc(x.customer_name) : ''}</div>
      ${x.status ? `<div class="chips"><span class="chip ${x.status === 'approved' || x.status === 'published' ? 'green' : ''}">${esc(x.status)}</span>${x.source ? `<span class="chip">${esc(x.source)}</span>` : ''}</div>` : ''}
    </div>`).join('')}</div>`
}

// ---------- Policies ----------
const POL = { signed: ['green', 'Signed'], due_soon: ['amber', 'Renew soon'], due: ['blue', 'To sign'], overdue: ['red', 'Overdue'] }
function panePolicies() {
  const items = (FILE.policies && FILE.policies.items) || [], hist = (FILE.policies && FILE.policies.history) || []
  const order = { overdue: 0, due: 1, due_soon: 2, signed: 3 }
  items.sort((a, b) => (order[a.status] ?? 9) - (order[b.status] ?? 9) || String(a.title).localeCompare(b.title))
  return `<div class="card"><h3>What they need to sign</h3>
      ${items.length ? `<table class="list"><tr><th>Policy</th><th>Status</th><th>Signed</th><th>Due</th><th>Renews</th></tr>
        ${items.map(x => `<tr><td><b>${esc(x.title)}</b> <span class="muted small">v${esc(x.version)}</span></td>
          <td><span class="chip ${(POL[x.status] || [''])[0]}">${esc((POL[x.status] || ['', x.status])[1])}</span></td>
          <td>${x.signed_at ? esc(fmtDate(x.signed_at)) : x.last_signed_any ? `<span class="muted">older version ${esc(fmtDate(x.last_signed_any))}</span>` : '—'}</td>
          <td>${x.due_date ? esc(fmtDate(x.due_date)) : '—'}</td>
          <td>${x.every_days ? `every ${x.every_days % 30 === 0 ? (x.every_days / 30) + ' months' : x.every_days + ' days'}` : 'once'}</td></tr>`).join('')}</table>`
        : '<div class="muted">Nothing to sign right now.</div>'}</div>
    <div class="card"><h3>Signing history</h3>
      ${hist.length ? `<table class="list"><tr><th>Policy</th><th>Version</th><th>Signed</th><th>How</th></tr>
        ${hist.map(h => `<tr><td>${esc(h.title)}</td><td>v${esc(h.version)}</td><td>${esc(fmtDate(h.signed_at))}${h.typed_name ? ` <span class="muted small">as “${esc(h.typed_name)}”</span>` : ''}</td><td>${esc(h.method || '')}</td></tr>`).join('')}</table>`
        : '<div class="muted">Nothing signed yet.</div>'}</div>`
}

// ---------- Time ----------
function paneTime() {
  const f = FILE
  const locked = what => `<div class="locked">You don’t have access to ${what} for this person.</div>`
  const shifts = f.can_schedule ? (f.shifts.length ? `<table class="list">${f.shifts.map(s => `<tr><td>${esc(fmtDate(s.date, false))}</td><td>${esc(fmtTime(s.start))}–${esc(fmtTime(s.end))}</td><td>${esc(studioName(s.studio_id))}</td><td class="muted small">${esc(s.status || '')}</td></tr>`).join('')}</table>`
    : '<div class="muted">No shifts in the next two weeks.</div>') : locked('the schedule')
  const off = f.can_schedule ? (f.time_off.length ? `<table class="list">${f.time_off.map(t => `<tr><td>${esc(fmtDate(t.start_date))}${t.end_date && t.end_date !== t.start_date ? ' – ' + esc(fmtDate(t.end_date)) : ''}${t.start_time ? ` <span class="muted small">${esc(fmtTime(t.start_time))}–${esc(fmtTime(t.end_time))}</span>` : ''}</td><td>${esc(t.type || '')}</td><td><span class="chip ${t.status === 'approved' ? 'green' : t.status === 'denied' ? 'red' : 'amber'}">${esc(t.status || '')}</span></td></tr>`).join('')}</table>`
    : '<div class="muted">No time off in the last 6 months or coming up.</div>') : locked('time off')
  const ts = f.can_timesheets ? (f.timesheets.length ? `<table class="list"><tr><th>Pay period</th><th>Hours</th><th>Status</th></tr>${f.timesheets.map(t => `<tr><td>${esc(fmtDate(t.period_start))} – ${esc(fmtDate(t.period_end))}</td><td>${t.approved_minutes != null ? (t.approved_minutes / 60).toFixed(1) : '—'}</td><td>${esc(t.status || '')}${t.approved_by_name ? ` <span class="muted small">by ${esc(t.approved_by_name)}</span>` : ''}</td></tr>`).join('')}</table>`
    : '<div class="muted">No timesheets yet.</div>') : locked('timesheets')
  const sick = f.can_timesheets ? (f.sick_calls.length ? `<div class="muted small" style="margin-bottom:6px">${f.sick_calls.length} in the last 12 months${f.sick_calls.filter(s => s.late).length ? `, ${f.sick_calls.filter(s => s.late).length} with late notice` : ''}</div>
      <table class="list">${f.sick_calls.map(s => `<tr><td>${esc(fmtDate(s.date))}</td><td>${esc(studioName(s.studio_id))}</td><td>${s.late ? '<span class="chip amber">Late notice</span>' : ''}</td><td class="muted small">${esc(s.pay_status || '')}</td></tr>`).join('')}</table>`
    : '<div class="muted">No sick calls in the last 12 months.</div>') : locked('sick calls')
  return `<div class="grid">
    <div class="card"><h3>Next two weeks</h3>${shifts}</div>
    <div class="card"><h3>Time off</h3>${off}</div>
    <div class="card"><h3>Timesheets</h3>${ts}</div>
    <div class="card"><h3>Sick calls</h3>${sick}</div></div>`
}

// ---------- Wage ----------
function paneWage() {
  const w = FILE.wage
  let body
  if (!w || w.error) body = '<div class="muted">Couldn’t load the wage.</div>'
  else if (w.wage != null) body = `<div class="fred" style="font-size:34px">$${Number(w.wage).toFixed(2)}<span class="muted" style="font-size:16px"> / hr</span></div>`
  else if (w.has_wage) body = '<div class="muted">A wage is on file, but it’s hidden for your login.</div>'
  else body = '<div class="muted">No wage on file yet.</div>'
  return `<div class="card"><h3>Hourly wage</h3>${body}
    <div class="muted small" style="margin-top:10px">Wages are changed in the staff details form (Edit details).</div></div>`
}

start()
</script>
</body>
</html>
