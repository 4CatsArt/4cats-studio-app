function buildShopifyTitle(sessionDate, sessionTime, sessionTitle) {
  const d = new Date(sessionDate + 'T12:00:00')
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
  const day = days[d.getDay()], month = months[d.getMonth()], date = d.getDate()
  const suffix = date===1||date===21||date===31?'st':date===2||date===22?'nd':date===3||date===23?'rd':'th'
  const [h, m] = sessionTime.split(':').map(Number)
  const hour = h===0?12:h>12?h-12:h
  const ampm = h<12?'am':'pm'
  const timeStr = m===0?`${hour}${ampm}`:`${hour}:${String(m).padStart(2,'0')}${ampm}`
  const starPrefix = (h===9&&m===0)?'*':''
  const titleLower = sessionTitle.toLowerCase().trim()
  const TITLE_MAP = {
    // New clean titles (Supabase = Shopify)
    'kids party':'Kids Party','splatter party':'Splatter Party','field trip':'Field Trip',
    'thursday clay night':'Thursday Clay Night',
    // Legacy mappings for backward compatibility
    'party time slot':'Kids Party','splatter party time slot':'Splatter Party','field trip time slot':'Field Trip',
    'adult get-together time slot':'Adult Get Togethers, Parties & Group Booking',
    'wheel workshop (adult & teen)':'Wheel Workshop','wheel workshop':'Wheel Workshop',
    'friday night mixer':'Friday Night Mixer','friday night mixer (ages 16+)':'Friday Night Mixer',
    'sunday morning family time mixer':'Sunday Morning Family Time Mixer',
    'sunday early bird workshop':'Sunday Early Bird Workshop',
    'mixed media class for kids ($10 for members)':'Mixed Media Class',
    'thursdays: clay night':'Thursday Clay Night','natureware mugs':'Natureware Mug',
    'summer camp half day morning':'Summer Camp Half Day','summer camp half day afternoon':'Summer Camp Half Day',
    'no school day camp (ages 6-12)':'PA/PD Day','pd day':'PA/PD Day','pa day':'PA/PD Day','pa/pd day':'PA/PD Day',
    "mother's day celebration":"Mother's Day",'afternoon art meetup':'Afternoon Art Meetup',
    'saturday early bird workshop':'Saturday Early Bird Workshop',
    'dragons session (ages 5-12) class 1 of 5':'Dragons 5 Week Kids Session',
    'early drop off (mixed media class)':null,
  }
  if (/\b(class|week|session|part)\s+([2-9]|\d{2,})\s+of\s+\d+/i.test(sessionTitle)) return null
  if (titleLower in TITLE_MAP && TITLE_MAP[titleLower] === null) return null
  if (titleLower === 'weekend workshop') return null
  if (/^weekend workshop:\s*/i.test(sessionTitle)) return `${starPrefix}${timeStr} ${day} ${month} ${date}${suffix} | ${sessionTitle.replace(/^weekend workshop:\s*/i,'').trim()}`
  if (titleLower.includes('wednesday paint night')) return `${starPrefix}${timeStr} ${day} ${month} ${date}${suffix} | Wednesday Paint Night`
  if (TITLE_MAP[titleLower]) return `${starPrefix}${timeStr} ${day} ${month} ${date}${suffix} | ${TITLE_MAP[titleLower]}`
  let cleanTitle = sessionTitle.replace(/ Workshop$/i, '').replace(/ Session$/i, '').replace(/\s*\|.*$/, '').trim()
  return `${starPrefix}${timeStr} ${day} ${month} ${date}${suffix} | ${cleanTitle}`
}

function buildShopifyHandle(sessionDate, sessionTime, sessionTitle) {
  const shopifyTitle = buildShopifyTitle(sessionDate, sessionTime, sessionTitle)
  if (!shopifyTitle || shopifyTitle === 'OVERRIDE') return null
  let handle = shopifyTitle.toLowerCase().replace(/\*/g,'').replace(/:/g,'').replace(/\s*\|\s*/g,'-').replace(/[^a-z0-9-]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'')
  const paintNightIdx = handle.indexOf('wednesday-paint-night')
  if (paintNightIdx !== -1) handle = handle.substring(0, paintNightIdx + 'wednesday-paint-night'.length)
  return handle
}

async function syncShopifyInventory() {
  const btn = document.getElementById('sync-shopify-btn')
  if (!btn) return
  btn.textContent = '⏳ Syncing...'; btn.disabled = true
  const days = parseInt(document.getElementById('range-select').value) || 7
  const startDate = new Date(currentDate)
  const endDate = addDays(startDate, days - 1)
  const { data: sessions } = await sb.from('sessions').select('id, title, capacity, session_date, session_time').eq('studio_id', currentStudioId).gte('session_date', dateStr(startDate)).lte('session_date', dateStr(endDate))
  if (!sessions?.length) { btn.textContent = '🔄 Sync Shopify'; btn.disabled = false; return }
  const ids = sessions.map(s => s.id)
  const counts = {}
  const { data: bookings } = await sb.from('bookings').select('session_id, qty').in('session_id', ids).gt('qty', 0)
  if (bookings) bookings.forEach(b => { counts[b.session_id] = (counts[b.session_id]||0) + (b.qty||0) })
  const sessionsWithReg = sessions.map(s => ({ ...s, reg: counts[s.id]||0 }))
  const seen = new Set()
  const toSync = []
  sessionsWithReg.forEach(s => {
    const shopifyTitle = buildShopifyTitle(s.session_date, s.session_time||'00:00:00', s.title)
    if (!shopifyTitle || seen.has(shopifyTitle)) return
    seen.add(shopifyTitle)
    toSync.push({ shopifyTitle, session_date: s.session_date, session_time: s.session_time })
  })
  const variantTitle = STUDIO_VARIANT_MAP[currentStudioId]
  if (!variantTitle) { btn.textContent = '🔄 Sync Shopify'; btn.disabled = false; return }
  let updated = 0
  for (const item of toSync) {
    btn.textContent = `⏳ ${updated}/${toSync.length}`
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/shopify-inventory`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_KEY}` }, body: JSON.stringify({ action: 'get_all', product_title: item.shopifyTitle }) })
      const data = await res.json()
      if (data.error) continue
      const variant = data.variants?.find(v => v.variant_title === variantTitle)
      if (!variant) continue
      const matchingSessions = sessionsWithReg.filter(s => s.session_date===item.session_date && s.session_time===item.session_time && buildShopifyTitle(s.session_date, s.session_time||'00:00:00', s.title)===item.shopifyTitle)
      for (const session of matchingSessions) {
        const newCapacity = variant.inventory_quantity + session.reg
        await sb.from('sessions').update({ capacity: newCapacity }).eq('id', session.id)
        const cell = document.getElementById(`spaces-${session.id}`)
        if (cell) { const spacesLeft = variant.inventory_quantity; cell.textContent = spacesLeft; cell.style.color = spacesLeft===0?'#99354e':spacesLeft<=2?'#e65100':'#2e7d32' }
        updated++
      }
    } catch(e) { console.warn('Could not sync:', item.shopifyTitle, e) }
    await new Promise(r => setTimeout(r, 200))
  }
  btn.textContent = `✓ ${updated} synced`
  setTimeout(() => { btn.textContent = '🔄 Sync Shopify'; btn.disabled = false }, 3000)
}

async function saveWalkins() {
  const btn = document.getElementById('walkins-save-btn')
  const walkins = parseInt(document.getElementById('walkins-input').value) || 0
  const today = dateStr(currentDate)
  btn.textContent = 'Saving...'; btn.disabled = true

  const { error } = await sb.from('daily_walkins').upsert(
    { studio_id: currentStudioId, report_date: today, walkins, saved_at: new Date().toISOString() },
    { onConflict: 'studio_id,report_date' }
  )

  if (error) {
    console.error('saveWalkins error:', error)
    btn.textContent = 'Error ✗'; btn.style.background = '#c0392b'
    setTimeout(() => { btn.textContent = 'Save'; btn.style.background = '#1a1a1a'; btn.disabled = false }, 3000)
    return
  }

  btn.textContent = 'Saved ✓'; btn.style.background = '#2e7d32'; btn.disabled = false
  setTimeout(() => { btn.textContent = 'Save'; btn.style.background = '#1a1a1a' }, 2000)
}
</script>
