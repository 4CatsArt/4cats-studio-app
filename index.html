<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="https://cdn.shopify.com/s/files/1/1451/3756/files/favicon.png?v=1613591354"><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4Cats Arts Studio</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f0; color: #1a1a1a; min-height: 100vh; }

/* LOGIN */
#login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
.login-card { background: white; border-radius: 12px; border: 0.5px solid #e0e0d8; padding: 2rem; width: 100%; max-width: 380px; }
.login-card h1 { font-size: 22px; font-weight: 500; margin-bottom: 0.5rem; text-align: center; }
.login-card p { font-size: 14px; color: #888; margin-bottom: 1.5rem; text-align: center; }
.login-card input { width: 100%; padding: 10px 12px; border: 0.5px solid #d0d0c8; border-radius: 8px; font-size: 14px; margin-bottom: 12px; outline: none; display: block; }
.login-card input:focus { border-color: #888; }
.login-card button { width: 100%; padding: 10px; background: #1a1a1a; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
.error-msg { color: #c0392b; font-size: 13px; margin-top: 8px; display: none; }

/* APP */
#app-screen { display: none; padding: 1.5rem 2rem; max-width: 1100px; margin: 0 auto; }

/* HEADER */
.app-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem; }
.app-header h1 { font-size: 20px; font-weight: 500; }
.meta { font-size: 13px; color: #888; }
.signout-btn { font-size: 13px; color: #888; background: none; border: none; cursor: pointer; padding: 6px 12px; border-radius: 6px; }
.signout-btn:hover { background: #eee; }

/* TOOLBAR */
.toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 0; flex-wrap: wrap; position: sticky; top: 0; z-index: 100; background: #fff; padding: 12px 0 8px; border-bottom: 1px solid #f0f0e8; }
.toolbar-left { display: flex; align-items: center; gap: 8px; }
.toolbar-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.nav-btn { background: white; border: 0.5px solid #d0d0c8; border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; color: #1a1a1a; }
.nav-btn:hover { background: #f5f5f0; }
.today-btn { background: #1a1a1a; color: white; border: none; border-radius: 6px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
.date-picker { border: 0.5px solid #d0d0c8; border-radius: 6px; padding: 6px 10px; font-size: 13px; outline: none; background: white; cursor: pointer; }
.date-picker:focus { border-color: #888; }
.view-toggle { display: flex; border: 0.5px solid #d0d0c8; border-radius: 6px; overflow: hidden; }
.view-btn { padding: 6px 14px; font-size: 13px; cursor: pointer; background: white; border: none; color: #888; }
.view-btn.active { background: #1a1a1a; color: white; }
.filter-input { border: 0.5px solid #d0d0c8; border-radius: 6px; padding: 6px 10px; font-size: 13px; outline: none; width: 160px; }
.filter-input:focus { border-color: #888; }
.type-filter { border: 0.5px solid #d0d0c8; border-radius: 6px; padding: 6px 10px; font-size: 13px; outline: none; background: white; cursor: pointer; }

/* DAY VIEW */
.date-bar { font-size: 15px; font-weight: 600; margin-bottom: 0; color: #444; position: sticky; top: 53px; z-index: 99; background: #fff; padding: 8px 0 10px; border-bottom: 1px solid #f0f0e8; }
.session-card { background: white; border-radius: 12px; border: 0.5px solid #e0e0d8; padding: 1.25rem; margin-bottom: 1rem; }
.session-card.party-card { border-color: #f0b8cc; }
.session-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
.session-title { font-size: 16px; font-weight: 500; }
.session-time { font-size: 14px; color: #888; margin-top: 2px; }
.session-badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 500; white-space: nowrap; }
.badge-party { background: #fce8f0; color: #99354e; }
.badge-workshop { background: #e8f0fe; color: #1a4fa0; }
.badge-glazing { background: #e8f5e9; color: #2e7d32; }
.badge-class { background: #fff3e0; color: #e65100; }
.badge-camp { background: #f3e5f5; color: #6a1b9a; }
.session-stats { display: flex; gap: 1.5rem; margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 0.5px solid #f0f0e8; }
.stat { text-align: center; }
.stat-value { font-size: 22px; font-weight: 500; }
.stat-label { font-size: 11px; color: #888; margin-top: 2px; }
.stat-warn { color: #e65100; }
.stat-clickable { cursor: pointer; }
.stat-clickable .stat-value { text-decoration: underline; text-decoration-style: dotted; }
.session-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field-group { display: flex; flex-direction: column; gap: 4px; }
.field-group.full { grid-column: 1 / -1; }
.field-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
.field-group input[type="text"],
.field-group input[type="number"],
.field-group select { padding: 8px 10px; border: 0.5px solid #d0d0c8; border-radius: 6px; font-size: 14px; outline: none; width: 100%; background: white; }
.field-group input[type="text"]:focus,
.field-group input[type="number"]:focus,
.field-group select:focus { border-color: #888; }
.prep-row { display: flex; align-items: center; gap: 10px; }
.prep-select { font-size: 13px; font-weight: 500; cursor: pointer; border: none; border-radius: 6px; padding: 3px 6px; outline: none; }
.prep-select.prep-pending { background: #c0392b; color: white; }
.prep-select.prep-done { background: #fff; color: #2e7d32; border: 0.5px solid #d0d0c8; }
.save-btn { margin-top: 12px; padding: 8px 20px; background: #1a1a1a; color: white; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; float: right; }
.save-btn:hover { background: #333; }
.save-btn.saved { background: #2e7d32; }

/* PARTY BASE INFO PILL */
.party-base-pill { display: inline-flex; align-items: center; gap: 6px; background: #fff0f5; border: 0.5px solid #f0b8cc; border-radius: 20px; padding: 4px 12px; font-size: 12px; color: #99354e; margin-bottom: 12px; }

/* PAID FOR PILL */
.party-paid-pill { display: inline-flex; align-items: center; gap: 6px; background: #fff8e1; border: 0.5px solid #ffd54f; border-radius: 20px; padding: 4px 12px; font-size: 12px; color: #7a5800; margin-bottom: 12px; margin-left: 8px; }

/* PARTY BOOKING FORM — per booking */
.party-booking-block { background: #fff5f8; border-radius: 10px; border: 0.5px solid #f0b8cc; padding: 1rem; margin-bottom: 1rem; }
.party-booking-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
.party-booking-name { font-size: 14px; font-weight: 600; color: #99354e; }
.party-booking-meta { font-size: 12px; color: #c06080; margin-top: 2px; }
.party-addon-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.addon-pill { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: #fce8f0; color: #99354e; border: 0.5px solid #f0b8cc; }
.addon-pill.upgrade { background: #fff3e0; color: #c56000; border-color: #ffd099; }
.party-section-label { font-size: 10px; color: #99354e; text-transform: uppercase; letter-spacing: 0.8px; font-weight: 600; margin: 14px 0 10px; padding-bottom: 4px; border-bottom: 0.5px solid #f0b8cc; }
.party-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.party-fields .full { grid-column: 1 / -1; }
.party-fields .field-label { color: #99354e; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
.party-fields input[type="text"],
.party-fields input[type="number"],
.party-fields select,
.party-fields textarea { padding: 7px 10px; border: 0.5px solid #f0c8d4; border-radius: 6px; font-size: 13px; outline: none; width: 100%; background: white; font-family: inherit; }
.party-fields input:focus,
.party-fields select:focus,
.party-fields textarea:focus { border-color: #99354e; }
.party-fields textarea { resize: vertical; min-height: 60px; }

/* AFTER section */
.party-after-section { background: #f8f8f5; border-radius: 8px; border: 0.5px solid #e0e0d8; padding: 10px; margin-top: 12px; }
.party-after-label { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 0.8px; font-weight: 600; margin-bottom: 10px; }
.outcome-credit-note { font-size: 12px; color: #c56000; background: #fff3e0; border-radius: 6px; padding: 8px 10px; margin-top: 8px; display: none; }

/* OUTCOME CALCULATOR */
.outcome-calculator { background: white; border-radius: 8px; border: 1px solid #e0e0d8; padding: 12px 14px; margin-top: 12px; }
.calc-title { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 0.8px; font-weight: 600; margin-bottom: 10px; }
.calc-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 4px 0; border-bottom: 0.5px solid #f5f5f0; }
.calc-row:last-child { border-bottom: none; }
.calc-row.total { font-weight: 600; font-size: 14px; padding-top: 8px; margin-top: 4px; border-top: 1px solid #e0e0d8; border-bottom: none; }
.calc-label { color: #666; }
.calc-value { font-weight: 500; }
.calc-value.credit { color: #2e7d32; }
.calc-value.charge { color: #99354e; }
.calc-value.neutral { color: #888; }
.calc-minimum-note { font-size: 11px; color: #888; font-style: italic; margin-top: 6px; }
.gift-card-btn { width: 100%; margin-top: 10px; padding: 9px; background: #2e7d32; color: white; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 500; }
.gift-card-btn:hover { background: #246028; }
.gift-card-btn:disabled { background: #aaa; cursor: not-allowed; }
.charge-info { background: #fff3e0; border-radius: 6px; padding: 10px 12px; margin-top: 10px; font-size: 13px; color: #7a4000; }
.charge-info strong { display: block; margin-bottom: 4px; font-size: 14px; }
.pos-order-row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
.pos-order-row input { flex: 1; padding: 7px 10px; border: 0.5px solid #f0c8d4; border-radius: 6px; font-size: 13px; outline: none; font-family: inherit; }
.pos-order-row input:focus { border-color: #99354e; }
.pos-order-row button { padding: 7px 14px; background: #1a1a1a; color: white; border: none; border-radius: 6px; font-size: 12px; cursor: pointer; white-space: nowrap; }
.pos-order-row button.saved { background: #2e7d32; }

.party-save-btn { margin-top: 12px; padding: 7px 18px; background: #99354e; color: white; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; float: right; }
.party-save-btn:hover { background: #7a2940; }
.party-save-btn.saved { background: #2e7d32; }

/* PRINT */
@media print {
  @page { size: landscape; margin: 1cm; }
  body > * { display: none !important; }
  .overlay { display: flex !important; position: static !important; background: none !important; padding: 0 !important; }
  .overlay-card { max-height: none !important; box-shadow: none !important; border: none !important; width: 100% !important; max-width: 100% !important; }
  .no-print { display: none !important; }
  .booking-table { width: 100% !important; font-size: 11px !important; }
  .booking-table th, .booking-table td { padding: 6px 8px !important; }
  .edit-input { border: none !important; border-bottom: 1px solid #999 !important; background: transparent !important; }
  .edit-input::placeholder { color: transparent !important; }
  input[type="checkbox"] { width: 14px !important; height: 14px !important; }
  input[type="text"], input[type="checkbox"] { print-color-adjust: exact; }
}
.print-btn { padding: 6px 16px; background: #f5f5f0; border: 0.5px solid #d0d0c8; border-radius: 6px; font-size: 13px; cursor: pointer; }
.print-btn:hover { background: #e8e8e0; }
.participant-name { font-weight: 500; color: #1a1a1a; }

/* INLINE EDIT INPUTS */
.edit-input { border: none; border-bottom: 1px solid #ccc; width: 100%; font-size: 13px; outline: none; background: transparent; padding: 2px 0; font-family: inherit; }
.edit-input:focus { border-bottom-color: #1a1a1a; }
.edit-input.short { width: 50px; }
.row-save-btn { margin-top: 4px; padding: 3px 10px; font-size: 11px; background: #1a1a1a; color: white; border: none; border-radius: 4px; cursor: pointer; white-space: nowrap; }
.row-save-btn:hover { background: #333; }
.row-save-btn.saved { background: #2e7d32; }

.empty-state { text-align: center; padding: 4rem 2rem; color: #888; }
.empty-state h2 { font-size: 18px; font-weight: 400; margin-bottom: 0.5rem; }
.loading { text-align: center; padding: 4rem; color: #888; }

/* DAY DEFAULTS CARD */
.defaults-card { background: #fafaf8; border-radius: 12px; border: 0.5px solid #e0e0d8; padding: 1.25rem; margin-bottom: 1.5rem; }
.defaults-card .defaults-header { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
.defaults-apply-btn { align-self: flex-end; padding: 8px 20px; background: #1a1a1a; color: white; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.defaults-apply-btn:hover { background: #333; }
.defaults-apply-btn.applied { background: #2e7d32; }

/* TABLE VIEW */
.table-controls { display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; }
.range-label { font-size: 13px; color: #888; }
.range-select { border: 0.5px solid #d0d0c8; border-radius: 6px; padding: 5px 8px; font-size: 13px; outline: none; background: white; }
.week-table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; border: 0.5px solid #e0e0d8; font-size: 13px; }
.week-table th { padding: 10px 12px; text-align: left; font-weight: 500; font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 0.5px solid #e0e0d8; background: #fafaf8; white-space: nowrap; }
.week-table td { padding: 10px 12px; border-bottom: 0.5px solid #f5f5f0; vertical-align: top; }
.week-table tr:last-child td { border-bottom: none; }
.type-pill { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 10px; margin-left: 4px; vertical-align: middle; }

/* OVERLAY */
.overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 2rem; }
.overlay-card { background: white; border-radius: 12px; width: 100%; max-width: 1200px; max-height: 85vh; overflow: auto; padding: 1.5rem; }
.overlay-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
.overlay-title { font-size: 18px; font-weight: 500; }
.overlay-sub { font-size: 13px; color: #888; margin-top: 2px; }
.close-btn { background: none; border: none; font-size: 22px; cursor: pointer; color: #888; padding: 4px 8px; line-height: 1; }
.booking-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.booking-table th { padding: 8px 10px; font-size: 11px; color: #888; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; text-align: left; border-bottom: 0.5px solid #e0e0d8; white-space: nowrap; }
.booking-table td { padding: 8px 10px; border-bottom: 1px solid #e8e8e0; vertical-align: middle; }
.booking-table tr:last-child td { border-bottom: none; }
.attended-check { width: 18px; height: 18px; cursor: pointer; accent-color: #2e7d32; }
.note-cell { color: #666; font-style: italic; font-size: 12px; }
</style>
</head>

// Convert actual guests number to Shopify variant guest string
function guestsToVariantKey(n, subtype) {
  if (subtype === 'adult') {
    if (n <= 10) return 'up to 10 people (base price)'
    return `${n} people`
  } else {
    // kids / splatter
    if (n <= 8) return 'up to 8 people (base price)'
    return `${n} people`
  }
}

// Convert actual party time to Shopify variant key
function partyTimeToVariantKey(partyTimeVal, subtype) {
  if (!partyTimeVal || partyTimeVal === 'none' || partyTimeVal === '') {
    return subtype === 'adult'
      ? 'no - just we will leave after the art portion'
      : 'no - just we will leave after the art portion'
  }
  if (partyTimeVal === '30 min') {
    return subtype === 'adult' ? 'yes - add 30 minutes' : 'yes - add 30 minutes (enough time for cake only)'
  }
  if (partyTimeVal === '45 min') return 'yes - add 45 minutes (enough time for lunch/snacks and cake)'
  if (partyTimeVal === '60 min') return 'yes - add 60 minutes'
  return subtype === 'adult' ? 'no - just we will leave after the art portion' : 'no - just we will leave after the art portion'
}

// Convert actual art time to Shopify variant key (kids only)
function artTimeToVariantKey(artTimeVal) {
  if (artTimeVal === '90 min') return 'yes - 90 minutes of art time'
  return 'no - 60 minutes for the art project is good!'
}

// Look up add-on price from tables
function lookupAddonPrice(subtype, guestKey, partyTimeKey, artTimeKey, canvasKey, isMember) {
  let price = null
  if (subtype === 'kids' || subtype === 'splatter') {
    if (subtype === 'kids') {
      const key = `${artTimeKey}|${partyTimeKey}|${guestKey}`
      price = KIDS_PRICES[key] ?? null
    } else {
      const canvas = canvasKey || 'no - watercolour paper is fine'
      const key = `${partyTimeKey}|${guestKey}|${canvas}`
      price = SPLATTER_PRICES[key] ?? null
    }
    if (price !== null && isMember) price = Math.round(price * 0.65 * 100) / 100
  } else if (subtype === 'adult') {
    const key = `${guestKey}|${partyTimeKey}`
    price = ADULT_PRICES[key] ?? null
    // Member pricing for adult is different rates embedded in table — no blanket discount
    // Members pay $20/pp instead of $25/pp for extra guests, and $12.80/pp/hr instead of $16
    // Since Shopify tables use non-member prices, apply member discount to extra guest portion
    if (price !== null && isMember && price > 0) {
      // Rough member adjustment: ~80% for guest portion, ~80% for party time
      price = Math.round(price * 0.80 * 100) / 100
    }
  }
  return price
}

// ── OUTCOME CALCULATOR ────────────────────────────────────────
function calculatePartyOutcome(addonDetails, subtype, isMember, actualGuests, actualArtTime, actualPartyTime, projectUpgradePaid) {
  if (actualGuests === null || actualGuests === undefined) return null

  const taxRate = getTaxRate(currentStudioId)

  // What they PAID for (from add-on variant)
  const paidGuests = addonDetails.guestCount || (subtype === 'adult' || subtype === 'fieldtrip' ? 10 : 8)
  const paidArtTime = addonDetails.artTime || '60 min'
  const paidPartyTime = addonDetails.partyTime || 'none'
  const paidCanvasUpgrade = addonDetails.canvasUpgrade

  const paidGuestKey = guestsToVariantKey(paidGuests, subtype)
  const paidPartyKey = partyTimeToVariantKey(paidPartyTime, subtype)
  const paidArtKey = artTimeToVariantKey(paidArtTime)
  const paidCanvasKey = paidCanvasUpgrade ? 'yes please! ($6/pp)' : 'no - watercolour paper is fine'

  const paidAddonPrice = lookupAddonPrice(subtype, paidGuestKey, paidPartyKey, paidArtKey, paidCanvasKey, isMember) || 0
  const paidProjectUpgrade = projectUpgradePaid ? 20 : 0
  const totalPaid = paidAddonPrice + paidProjectUpgrade

  // What ACTUALLY happened
  const actualGuestKey = guestsToVariantKey(actualGuests, subtype)
  const actualPartyKey = partyTimeToVariantKey(actualPartyTime, subtype)
  const actualArtKey = artTimeToVariantKey(actualArtTime)

  // No-show minimum rules
  let chargeableGuests = actualGuests
  let minimumApplied = false
  let minimumNote = null

  if (subtype === 'kids' || subtype === 'splatter') {
    if (paidGuests >= 16 && actualGuests < 16) {
      chargeableGuests = 16
      minimumApplied = true
      minimumNote = `Minimum 16 guests applies (booked ${paidGuests}, attended ${actualGuests})`
    }
  } else if (subtype === 'adult') {
    if (paidGuests >= 21 && actualGuests < 21) {
      chargeableGuests = 21
      minimumApplied = true
      minimumNote = `Minimum 21 guests applies (booked ${paidGuests}, attended ${actualGuests})`
    }
  }

  const actualChargeableGuestKey = guestsToVariantKey(chargeableGuests, subtype)
  const actualAddonPrice = lookupAddonPrice(subtype, actualChargeableGuestKey, actualPartyKey, actualArtKey, paidCanvasKey, isMember) || 0
  const totalActual = actualAddonPrice + paidProjectUpgrade // project upgrade always kept

  const diff = totalPaid - totalActual // positive = credit owed, negative = charge owed
  const diffWithTax = Math.round(Math.abs(diff) * (1 + taxRate) * 100) / 100

  return {
    paidGuests, paidArtTime, paidPartyTime,
    actualGuests, actualArtTime: actualArtTime || '—', actualPartyTime: actualPartyTime || '—',
    chargeableGuests, minimumApplied, minimumNote,
    paidAddonPrice, totalPaid,
    actualAddonPrice, totalActual,
    diff, diffWithTax,
    taxRate, taxAmount: Math.round(Math.abs(diff) * taxRate * 100) / 100,
    isCredit: diff > 0,
    isCharge: diff < 0,
    isAllGood: diff === 0,
    isMember
  }
}

function renderOutcomeCalculator(calc, uid, booking, sessionTitle, sessionDate) {
  if (!calc) return ''

  const fmt = n => `$${Math.abs(n).toFixed(2)}`
  const studioName = document.getElementById('studio-name')?.textContent || ''

  let calcRows = `
    <div class="calc-row"><span class="calc-label">Paid add-on (${calc.paidGuests} guests · ${calc.paidArtTime} art · party: ${calc.paidPartyTime})</span><span class="calc-value">${fmt(calc.paidAddonPrice)}</span></div>
    <div class="calc-row"><span class="calc-label">Actual (${calc.chargeableGuests} guests · ${calc.actualArtTime} art · party: ${calc.actualPartyTime})${calc.minimumApplied ? ' ⚠️' : ''}</span><span class="calc-value">${fmt(calc.actualAddonPrice)}</span></div>
    <div class="calc-row"><span class="calc-label">Difference (pre-tax)</span><span class="calc-value ${calc.isCredit ? 'credit' : calc.isCharge ? 'charge' : 'neutral'}">${calc.isCredit ? '−' : calc.isCharge ? '+' : ''}${fmt(calc.diff)}</span></div>
    <div class="calc-row"><span class="calc-label">Tax (${Math.round(calc.taxRate * 100)}%)</span><span class="calc-value">${fmt(calc.taxAmount)}</span></div>
    <div class="calc-row total"><span class="calc-label">${calc.isCredit ? 'Credit to issue' : calc.isCharge ? 'Charge on POS' : 'No adjustment needed'}</span><span class="calc-value ${calc.isCredit ? 'credit' : calc.isCharge ? 'charge' : 'neutral'}">${calc.isAllGood ? '✓ All good' : fmt(calc.diffWithTax)}</span></div>
  `
  if (calc.minimumNote) calcRows += `<div class="calc-minimum-note">⚠️ ${calc.minimumNote}</div>`

  let actionHtml = ''
  if (calc.isCredit && calc.diffWithTax > 0) {
    const encodedEmail = encodeURIComponent(booking.customer_email || '')
    const encodedName = encodeURIComponent(booking.customer_name || '')
    actionHtml = `
      <button class="gift-card-btn" id="gc-btn-${uid}" onclick="issueGiftCard('${uid}','${booking.customer_email}','${booking.customer_name?.replace(/'/g,"\'")}',${calc.diffWithTax},${calc.taxRate},'${booking.shopify_order_name}','${sessionDate}','${sessionTitle.replace(/'/g,"\'")}')">
        🎁 Send $${calc.diffWithTax.toFixed(2)} Gift Card to ${booking.customer_email}
      </button>`
  } else if (calc.isCharge && calc.diffWithTax > 0) {
    actionHtml = `
      <div class="charge-info">
        <strong>💳 Charge on POS: $${calc.diffWithTax.toFixed(2)}</strong>
        ${calc.actualGuests > calc.paidGuests ? `${calc.actualGuests - calc.paidGuests} extra guest(s) × rate + tax` : 'Adjustment for actual usage'}
      </div>
      <div class="pos-order-row">
        <input type="text" id="pos-order-${uid}" placeholder="POS order # after charging..." value="">
        <button onclick="savePosOrder('${uid}')">Save order #</button>
      </div>`
  }

  return `<div class="outcome-calculator"><div class="calc-title">💰 Outcome Calculation${calc.isMember ? ' · Member pricing' : ''}</div>${calcRows}${actionHtml}</div>`
}

  const btn = document.getElementById(`gc-btn-${uid}`)
  if (!btn) return
  btn.textContent = '⏳ Sending gift card...'
  btn.disabled = true

  const studioName = document.getElementById('studio-name')?.textContent || ''

  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/issue-party-gift-card`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_KEY}` },
      body: JSON.stringify({
        customer_email: email,
        customer_name: name,
        amount_pretax: Math.round(amount / (1 + taxRate) * 100) / 100,
        tax_rate: taxRate,
        order_name: orderName,
        session_date: sessionDate,
        party_type: sessionTitle,
        studio_name: studioName,
      })
    })
    const data = await res.json()
    if (data.success) {
      btn.textContent = `✓ Gift card sent! (ends in ...${data.last_characters})`
      btn.style.background = '#2e7d32'
      btn.disabled = true
      // Save to party_details outcome
      const blockEl = btn.closest('[id^="block-"]')
      if (blockEl) {
        const uid2 = blockEl.id.replace('block-', '')
        const outcomeEl = document.getElementById(`${uid2}-outcome`)
        if (outcomeEl) { outcomeEl.value = 'Issue credit'; }
        const amountEl = document.getElementById(`${uid2}-outcome_amount`)
        if (amountEl) amountEl.value = data.amount
        const notesEl = document.getElementById(`${uid2}-outcome_notes`)
        if (notesEl) notesEl.value = `Gift card sent to ${email} (ends ...${data.last_characters}), expires ${data.expires_on}`
      }
    } else {
      btn.textContent = '❌ Error — try again'
      btn.disabled = false
      btn.style.background = '#99354e'
      console.error('Gift card error:', data)
      alert('Could not send gift card: ' + (data.error || 'Unknown error'))
    }
  } catch(e) {
    btn.textContent = '❌ Error — try again'
    btn.disabled = false
    btn.style.background = '#99354e'
    alert('Network error: ' + e.message)
  }
}

function getPartySubtype(sessionTitle) {
  const t = (sessionTitle || '').toLowerCase()
  if (t.includes('splatter')) return 'splatter'
  if (t.includes('adult get-together') || t.includes('adult get together')) return 'adult'
  if (t.includes('field trip')) return 'fieldtrip'
  return 'kids'
}

function getPartyBase(subtype) {
  if (subtype === 'adult' || subtype === 'fieldtrip') return '10 guests · 90 min art · no party time'
  return '8 guests · 60 min art · no party time'
}

// Parse project type from line item properties (e.g. "Project Type: Oven-Bake Clay")
function getProjectTypeFromPayload(rawPayload) {
  try {
    const payload = typeof rawPayload === 'string' ? JSON.parse(rawPayload) : rawPayload
    if (!payload?.line_items) return null
    for (const li of payload.line_items) {
      const props = li.properties || []
      for (const p of props) {
        if ((p.name || '').toLowerCase().includes('project type') || (p.name || '').toLowerCase().includes('project')) {
          return p.value || null
        }
      }
    }
    return null
  } catch(e) { return null }
}

// Check if order has member discount
function isMemberOrder(rawPayload) {
  try {
    const payload = typeof rawPayload === 'string' ? JSON.parse(rawPayload) : rawPayload
    return (payload?.discount_applications || []).length > 0
  } catch { return false }
}

// Parse add-on line items from raw_payload
function parsePartyAddons(rawPayload, subtype) {
  try {
    const payload = typeof rawPayload === 'string' ? JSON.parse(rawPayload) : rawPayload
    if (!payload?.line_items) return []
    const addons = []
    for (const li of payload.line_items) {
      const title = (li.title || li.name || '').trim()
      const variant = (li.variant_title || '').trim()
      // Skip the main party booking line item (has date prefix) and studio variant lines
      if (/^\d+(am|pm|\:\d)/i.test(title)) continue
      if (!title || title === variant) continue
      addons.push({ title, variant, qty: li.quantity || 1 })
    }
    return addons
  } catch(e) { return [] }
}

// Parse structured info from add-on variants
function parseAddonDetails(addons, subtype) {
  const result = {
    artTime: null,
    partyTime: null,
    guestCount: null,
    projectUpgrade: false,
    canvasUpgrade: false,
    raw: []
  }

  for (const addon of addons) {
    const title = addon.title.toLowerCase()
    const variant = addon.variant || ''
    result.raw.push({ title: addon.title, variant })

    if (title.includes('kids party extra guests') || title.includes('splatter party extra guests')) {
      // Format: "art time / party time / guests" (kids/splatter)
      const parts = variant.split(' / ')
      if (parts.length >= 1) {
        const p0 = parts[0].toLowerCase()
        if (p0.includes('yes') && p0.includes('90')) result.artTime = '90 min'
        else if (p0.includes('no') || p0.includes('60')) result.artTime = '60 min'
        // For splatter, segment 0 is party time
        if (subtype === 'splatter') {
          if (p0.includes('45')) result.partyTime = '45 min'
          else if (p0.includes('30')) result.partyTime = '30 min'
          else if (p0.includes('no')) result.partyTime = 'none'
        }
      }
      if (parts.length >= 2) {
        const p1 = parts[1].toLowerCase()
        if (subtype !== 'splatter') {
          if (p1.includes('45')) result.partyTime = '45 min'
          else if (p1.includes('30')) result.partyTime = '30 min'
          else if (p1.includes('no')) result.partyTime = 'none'
        } else {
          // Splatter segment 1 = guests
          const numMatch = p1.match(/(\d+)/)
          if (numMatch) result.guestCount = parseInt(numMatch[1])
          else if (p1.includes('up to 8') || p1.includes('base')) result.guestCount = 8
        }
      }
      if (parts.length >= 3) {
        const p2 = parts[2].toLowerCase()
        if (subtype !== 'splatter') {
          // Kids: segment 2 = guests
          const numMatch = p2.match(/(\d+)/)
          if (numMatch) result.guestCount = parseInt(numMatch[1])
          else if (p2.includes('up to 8') || p2.includes('base')) result.guestCount = 8
        } else {
          // Splatter: segment 2 = canvas upgrade
          if (p2.includes('yes')) result.canvasUpgrade = true
        }
      }
    } else if (title.includes('adult get-togethers extra guests') || title.includes('adult get togethers extra guests')) {
      // Format: "X people / party time"
      const parts = variant.split(' / ')
      if (parts.length >= 1) {
        const numMatch = parts[0].match(/(\d+)/)
        if (numMatch) result.guestCount = parseInt(numMatch[1])
      }
      if (parts.length >= 2) {
        const p1 = parts[1].toLowerCase()
        if (p1.includes('no')) result.partyTime = 'none'
        else result.partyTime = 'yes'
      }
    } else if (title.includes('project upgrade')) {
      result.projectUpgrade = variant.toLowerCase().includes('yes')
    } else if (title.includes('extra guests') || title.includes('party add on')) {
      // Legacy/field trip add-ons — just show raw
    }
  }
  return result
}

function getPhoneFromPayload(rawPayload) {
  try {
    const p = typeof rawPayload === 'string' ? JSON.parse(rawPayload) : rawPayload
    return p?.billing_address?.phone
      || p?.shipping_address?.phone
      || p?.customer?.default_address?.phone
      || p?.customer?.phone
      || p?.phone
      || ''
  } catch { return '' }
}

function getOrderNoteFromPayload(rawPayload) {
  try {
    const p = typeof rawPayload === 'string' ? JSON.parse(rawPayload) : rawPayload
    return p?.note || ''
  } catch { return '' }
}

function getBillingName(rawPayload) {
  try {
    const p = typeof rawPayload === 'string' ? JSON.parse(rawPayload) : rawPayload
    return p?.billing_address?.name || p?.customer?.default_address?.name || ''
  } catch { return '' }
}

function buildAddonPills(addonDetails, subtype) {
  const pills = []
  if (addonDetails.artTime) pills.push(`<span class="addon-pill">🎨 Art: ${addonDetails.artTime}</span>`)
  if (addonDetails.partyTime && addonDetails.partyTime !== 'none') pills.push(`<span class="addon-pill">🎉 Party time: ${addonDetails.partyTime}</span>`)
  if (addonDetails.guestCount) pills.push(`<span class="addon-pill">👥 ${addonDetails.guestCount} guests</span>`)
  if (addonDetails.projectUpgrade) pills.push(`<span class="addon-pill upgrade">⭐ Project upgrade (clay or painting)</span>`)
  else if (subtype === 'kids' && addonDetails.raw.some(a => a.title.toLowerCase().includes('extra guests'))) pills.push(`<span class="addon-pill">🏺 Oven-bake clay only</span>`)
  if (addonDetails.canvasUpgrade) pills.push(`<span class="addon-pill upgrade">🖼 Canvas upgrade (8×8)</span>`)
  // Any other raw add-ons not captured above
  for (const r of addonDetails.raw) {
    const t = r.title.toLowerCase()
    if (!t.includes('extra guests') && !t.includes('project upgrade') && !t.includes('party add on')) {
      pills.push(`<span class="addon-pill">${r.title}${r.variant ? ': ' + r.variant : ''}</span>`)
    }
  }
  return pills.join('')
}

function buildPaidPill(addonDetails, subtype) {
  const hasAddon = addonDetails.raw && addonDetails.raw.length > 0
  const parts = []

  if (!hasAddon) {
    // No add-on purchased — show base only
    if (subtype === 'adult' || subtype === 'fieldtrip') parts.push('10 guests · 90 min art · no party time')
    else parts.push('8 guests · 60 min art · no party time')
    return `<span class="party-paid-pill" style="background:#f5f5f0;border-color:#d0d0c8;color:#888">📋 Paid: base only (${parts[0]})</span>`
  }

  // Has add-on — show what was purchased
  if (addonDetails.guestCount) parts.push(`${addonDetails.guestCount} guests`)
  else parts.push(subtype === 'adult' || subtype === 'fieldtrip' ? '10 guests (base)' : '8 guests (base)')
  if (subtype === 'kids' || subtype === 'splatter') parts.push(addonDetails.artTime || '60 min art')
  if (addonDetails.partyTime && addonDetails.partyTime !== 'none') parts.push(`${addonDetails.partyTime} party time`)
  else parts.push('no party time')
  if (addonDetails.canvasUpgrade) parts.push('canvas upgrade')
  if (addonDetails.projectUpgrade) parts.push('project upgrade')
  return `<span class="party-paid-pill">💳 Paid: ${parts.join(' · ')}</span>`
}

function recalcOutcome(uid, subtype) {
  const actualGuests = parseInt(document.getElementById(`${uid}-actual_guests`)?.value)
  const actualArtTime = document.getElementById(`${uid}-actual_art_time`)?.value || ''
  const actualPartyTime = document.getElementById(`${uid}-actual_party_time`)?.value || ''
  const calcArea = document.getElementById(`${uid}-calc-area`)
  if (!calcArea) return

  if (!actualGuests) {
    calcArea.innerHTML = '<div style="font-size:12px;color:#aaa;padding:8px 0">Enter actual guests and times above to see credit/charge calculation.</div>'
    return
  }

  const storedEl = document.getElementById(`${uid}-stored-addons`)
  if (!storedEl) return
  let addonDetails
  try { addonDetails = JSON.parse(storedEl.getAttribute('data-addons').replace(/&quot;/g,'"')) } catch { return }
  const isMember = storedEl.getAttribute('data-member') === 'true'
  const projectUpgradePaid = storedEl.getAttribute('data-upgrade') === 'true'

  const calc = calculatePartyOutcome(addonDetails, subtype, isMember, actualGuests, actualArtTime, actualPartyTime, projectUpgradePaid)
  const blockEl = document.getElementById(`block-${uid}`)
  // Extract customer info from the block header
  const metaText = blockEl?.querySelector('.party-booking-meta')?.textContent || ''
  const metaParts = metaText.split('·').map(s => s.trim())
  const customerEmail = metaParts[0] || ''
  const orderName = metaParts.find(p => p.startsWith('Order '))?.replace('Order ','') || ''
  const customerName = blockEl?.querySelector('.party-booking-name')?.textContent?.split('(')[0]?.trim() || ''
  // Get session info from nearest session card
  const sessionCard = blockEl?.closest('[id^="card-"]')
  const sessionTitleEl = sessionCard?.querySelector('.session-title')
  const sessionTitle = sessionTitleEl?.textContent || ''
  const sessionDateVal = document.getElementById('date-picker')?.value || ''
  const fakeBooking = { customer_email: customerEmail, customer_name: customerName, shopify_order_name: orderName }
  calcArea.innerHTML = renderOutcomeCalculator(calc, uid, fakeBooking, sessionTitle, sessionDateVal)
}

async function savePartyDetail(bookingId, sessionId, uid, subtype, customerEmail, customerName, orderName, sessionTitle, sessionDate) {
  const btn = document.querySelector(`#block-${uid} .party-save-btn`)
  if (btn) { btn.textContent = 'Saving...'; btn.disabled = true }

  const val = id => document.getElementById(`${uid}-${id}`)?.value || null
  const numVal = id => { const v = document.getElementById(`${uid}-${id}`)?.value; return v ? parseInt(v) : null }

  // Auto-calculate outcome from actual vs paid
  const storedEl = document.getElementById(`${uid}-stored-addons`)
  let autoOutcome = null, autoAmount = null
  if (storedEl) {
    try {
      const addonDetails = JSON.parse(storedEl.getAttribute('data-addons').replace(/&quot;/g,'"'))
      const isMember = storedEl.getAttribute('data-member') === 'true'
      const projectUpgradePaid = storedEl.getAttribute('data-upgrade') === 'true'
      const actualGuests = numVal('actual_guests')
      const actualArtTime = val('actual_art_time')
      const actualPartyTime = val('actual_party_time')
      if (actualGuests) {
        const calc = calculatePartyOutcome(addonDetails, subtype, isMember, actualGuests, actualArtTime, actualPartyTime, projectUpgradePaid)
        if (calc) {
          autoAmount = calc.diffWithTax > 0 ? calc.diffWithTax.toFixed(2) : null
          if (calc.isAllGood) autoOutcome = 'All good'
          else if (calc.isCredit) autoOutcome = 'Issue credit'
          else if (calc.isCharge) autoOutcome = 'Charge extra'
        }
      }
    } catch(e) { console.warn('Could not calculate outcome', e) }
  }

  const payload = {
    booking_id: bookingId,
    session_id: sessionId,
    studio_id: currentStudioId,
    contact_name: val('contact_name'),
    contacted: val('contacted'),
    expected_guests: numVal('expected_guests'),
    additional_charges_planned: val('additional_charges_planned'),
    notes: val('notes'),
    actual_guests: numVal('actual_guests'),
    actual_art_time: val('actual_art_time'),
    actual_party_time: val('actual_party_time'),
    outcome: autoOutcome || val('outcome_notes') || null,
    outcome_amount: autoAmount,
    outcome_notes: val('outcome_notes'),
    updated_at: new Date().toISOString()
  }

  if (subtype === 'kids') {
    payload.party_reason = val('party_reason')
    payload.project = val('project')
  } else if (subtype === 'splatter') {
    payload.party_reason = val('party_reason')
    payload.colour_choice = val('colour_choice')
  } else if (subtype === 'adult') {
    payload.occasion = val('occasion')
    payload.project = val('project')
  } else if (subtype === 'fieldtrip') {
    payload.school_name = val('school_name')
    payload.grade_age_group = val('grade_age_group')
  }

  const { data: existing } = await sb.from('party_details')
    .select('id').eq('booking_id', bookingId).single()

  let error
  if (existing) {
    ;({ error } = await sb.from('party_details').update(payload).eq('booking_id', bookingId))
  } else {
    ;({ error } = await sb.from('party_details').insert(payload))
  }

  if (error) { alert('Error saving: ' + error.message); if (btn) { btn.textContent = 'Save'; btn.disabled = false }; return }
  if (btn) {
    btn.textContent = 'Saved ✓'
    btn.classList.add('saved')
    setTimeout(() => { btn.textContent = 'Save'; btn.classList.remove('saved'); btn.disabled = false }, 2000)
  }

  // Auto-resolve any pending party-form task for this booking
  try {
    const { data: partyTask } = await sb.from('studio_tasks')
      .select('id')
      .eq('booking_id', bookingId)
      .eq('status', 'pending')
      .maybeSingle()
    if (partyTask) {
      await sb.from('studio_tasks').update({
        status: 'complete',
        completed_at: new Date().toISOString()
      }).eq('id', partyTask.id)
      loadPartyFormBanner()
    }
  } catch(e) { /* non-critical */ }
}

function fmtTime(timeStr) {
  if (!timeStr) return ''
  const [h, m] = timeStr.split(':').map(Number)
  const hour = h === 0 ? 12 : h > 12 ? h - 12 : h
  const ampm = h < 12 ? 'am' : 'pm'
  return m === 0 ? `${hour}${ampm}` : `${hour}:${String(m).padStart(2,'0')}${ampm}`
}

async function loadPartyFormBanner() {
  const today = new Date().toISOString().slice(0, 10)
  const { data: tasks } = await sb.from('studio_tasks')
    .select('id, title, booking_id, due_date')
    .eq('studio_id', currentStudioId)
    .eq('status', 'pending')
    .like('title', '⚠️ Party form not filled out%')

  const banner = document.getElementById('party-form-banner')
  if (!banner) return

  if (!tasks?.length) {
    banner.style.display = 'none'
    return
  }

  const names = tasks.map(t => {
    const name = t.title.replace('⚠️ Party form not filled out — ', '')
    const isOverdue = t.due_date < today
    return isOverdue ? `${name} <span style="opacity:0.75;font-size:11px">(${t.due_date})</span>` : name
  }).join(', ')
  banner.innerHTML = `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <span style="font-size:18px">⚠️</span>
    <div>
      <strong>Party form${tasks.length > 1 ? 's' : ''} not filled out</strong>
      <span style="margin-left:8px;opacity:0.9">${names}</span>
    </div>
    <button onclick="scrollToParties()" style="margin-left:auto;background:white;color:#c0392b;border:none;border-radius:6px;padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer">Go to parties ↓</button>
  </div>`
  banner.style.display = 'block'
}

function scrollToParties() {
  // Switch to day view and scroll to first party block
  if (currentView !== 'day') switchView('day')
  setTimeout(() => {
    const partyBlock = document.querySelector('.party-booking-block')
    if (partyBlock) partyBlock.scrollIntoView({ behavior: 'smooth', block: 'center' })
  }, 300)
}

async function loadCurriculumData() {
  const { data, error } = await sb.from('curriculum_weeks').select('*')
  curriculumData = data || []
}

function getCurriculumLinks(sessionTitle, sessionDate) {
  const titleLower = sessionTitle.toLowerCase()
  const fixed = curriculumData.find(r =>
    r.session_type_key && !r.week_start &&
    titleLower.includes(r.session_type_key.toLowerCase())
  )
  if (fixed && (fixed.website_url || fixed.curriculum_url)) return fixed
  const weekly = curriculumData.find(r =>
    r.week_start && r.week_end &&
    sessionDate >= r.week_start && sessionDate <= r.week_end
  )
  return weekly || null
}

async function autoGenerateRepeatingTasks(studioId, date) {
  const dayName = ['sun','mon','tue','wed','thu','fri','sat'][new Date(date + 'T12:00:00').getDay()]
  const repeating = taskTemplates.filter(t =>
    t.repeat === 'daily' || (t.repeat === 'weekly' && (t.repeat_days || []).includes(dayName))
  )
  if (!repeating.length) return

  // Only generate if no row exists for this template + studio + date
  const { data: existing } = await sb.from('studio_tasks')
    .select('template_id')
    .eq('studio_id', studioId)
    .eq('due_date', date)
    .not('template_id', 'is', null)

  const existingIds = new Set((existing || []).map(t => t.template_id))
  const toCreate = repeating.filter(t => !existingIds.has(t.id))
  if (!toCreate.length) return

  await sb.from('studio_tasks').insert(toCreate.map(t => ({
    studio_id: studioId,
    title: t.title,
    notes: t.notes || null,
    url: t.url || null,
    template_id: t.id,
    due_date: date,
    source: 'studio',
    status: 'pending'
  })))
}

function showSaveConfirm(id) {
  const el = document.getElementById(id)
  if (!el) return
  el.style.opacity = '1'

}

async function loadTasks(studioId, date) {
  // Load all tasks for this studio
  const { data } = await sb.from('studio_tasks')
    .select('*')
    .or(`studio_id.eq.${studioId},studio_id.is.null`)
    .order('due_date')
    .order('created_at')

  const all = data || []

  // For repeating tasks (has template_id): only show today's instance
  // For one-off tasks: show all pending + recently completed
  const sevenDaysAgo = new Date(Date.now() - 7*86400000).toISOString().slice(0,10)

  return all.filter(t => {
    if (t.template_id) {
      // Repeating: only show today's occurrence
      return t.due_date === date
    } else {
      // One-off: show if pending or completed in last 7 days
      if (t.status === 'pending') return true
      if (t.status === 'complete' && t.completed_at >= sevenDaysAgo) return true
      return false
    }
  })
}

}

async function addTask(studioId, date) {
  const input = document.getElementById('new-task-input')
  const title = input?.value.trim()
  if (!title) { alert('Please enter or select a task.'); return }

  const assigneeInput = document.getElementById('new-task-assignee')
  const assigneeName = assigneeInput?.value.trim() || null
  // Match assignee name to staff profile
  const assigneeProfile = assigneeName
    ? studioStaffList.find(s => (s.nickname || s.display_name) === assigneeName)
    : null

  const dueDateInput = document.getElementById('new-task-due')
  const dueDate = dueDateInput?.value || date
  const templateId = input.dataset.templateId || null
  const url = input.dataset.templateUrl || null
  const notes = input.dataset.templateNotes || null

  const { data } = await sb.from('studio_tasks').insert({
    studio_id: studioId,
    title,
    notes,
    url,
    template_id: templateId || null,
    assignee_name: assigneeName,
    assignee_id: assigneeProfile?.id || null,
    due_date: dueDate,
    source: 'studio',
    status: 'pending',
    created_by: currentUser?.id
  }).select().single()

  // Reset inputs
  input.value = ''; input.dataset.templateId = ''; input.dataset.templateUrl = ''; input.dataset.templateNotes = ''
  if (assigneeInput) assigneeInput.value = ''
  if (dueDateInput) dueDateInput.value = date
  const sel = document.getElementById('new-task-template')
  if (sel) sel.value = ''
  if (data) appendTaskRow(data)
}

function appendTaskRow(task) {
  const list = document.getElementById('task-list')
  if (!list) return
  const div = document.createElement('div')
  div.id = 'task-row-' + task.id
  div.style.cssText = 'display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:0.5px solid #f5f5f0'
  div.innerHTML = buildTaskRowInner(task)
  list.appendChild(div)
}

function buildTaskRowInner(task) {
  const done = task.status === 'complete'
  const today = new Date().toISOString().slice(0, 10)
  const isOverdue = task.due_date < today && !done
  const isFuture = task.due_date > today
  const sourceTag = task.source === 'home_office'
    ? '<span style="font-size:10px;background:#e8e8f0;color:#5b4fcf;padding:1px 5px;border-radius:4px;flex-shrink:0">HO</span>'
    : ''
  const dueDateTag = isFuture
    ? `<span style="font-size:10px;color:#888;flex-shrink:0">due ${task.due_date}</span>`
    : isOverdue
      ? `<span style="font-size:10px;color:#c0392b;flex-shrink:0">overdue</span>`
      : ''
  const assigneeTag = task.assignee_name
    ? `<span style="font-size:10px;color:#2e7d32;flex-shrink:0">→ ${task.assignee_name}</span>`
    : ''
  return `
    <input type="checkbox" ${done ? 'checked' : ''} onchange="toggleTask('${task.id}', this.checked)"
      style="width:15px;height:15px;cursor:pointer;flex-shrink:0">
    <span class="task-title" style="flex:1;font-size:13px;cursor:pointer;${done ? 'text-decoration:line-through;color:#aaa' : ''}"
      onclick="openTaskPopup('${task.id}')">
      ${task.title}
    </span>
    ${assigneeTag}${dueDateTag}${sourceTag}`
}

async function toggleStudioTrainingItem(userId, itemId, isDone) {
  if (isDone) {
    await sb.from('staff_training_progress').delete().eq('user_id', userId).eq('item_id', itemId)
  } else {
    await sb.from('staff_training_progress').insert({ user_id: userId, item_id: itemId, completed_at: new Date().toISOString() })
  }
  loadStudioTraining()
}

async function loadStudioTraining() {
  const container = document.getElementById('studio-training-container')
  container.innerHTML = '<div class="loading">Loading...</div>'

  const unitFilter = document.getElementById('training-view-unit')?.value
  const typeFilter = document.getElementById('training-view-type')?.value

  // Load units + items
  const { data: units } = await sb.from('training_units').select('*').order('sort_order')
  const { data: items } = await sb.from('training_items').select('*').order('sort_order')

  // Populate unit filter
  const unitSel = document.getElementById('training-view-unit')
  if (unitSel && unitSel.options.length === 1) {
    ;(units || []).forEach(u => {
      const o = document.createElement('option'); o.value = u.id; o.textContent = u.name; unitSel.appendChild(o)
    })
  }

  // Load active staff at this studio
  const { data: allStaff } = await sb.from('staff_profiles')
    .select('*').eq('is_active', true).order('display_name')
  let staff = (allStaff || []).filter(s => s.studio_ids?.includes(currentStudioId))
  if (typeFilter) staff = staff.filter(s => s.employment_type === typeFilter)

  if (!staff.length) {
    container.innerHTML = '<div style="padding:2rem;text-align:center;color:#888;font-size:13px">No active staff found for this studio.</div>'
    return
  }

  // Helper: unit applies to staff member
  function unitAppliesTo(unit, s) {
    if (s.training_unit_ids?.length) return s.training_unit_ids.includes(unit.id)
    if (unit.applies_to === 'all') return true
    if (unit.applies_to === 'manager') return s.role === 'manager' || s.role === 'admin'
    if (unit.applies_to === 'camp') return s.employment_type === 'camp'
    if (unit.applies_to === 'base') return s.employment_type === 'regular' || s.role === 'manager' || s.role === 'admin'
    return true
  }

  // Load progress + due dates
  const staffUserIds = staff.filter(s => s.user_id).map(s => s.user_id)
  let progress = [], dueDates = []
  if (staffUserIds.length) {
    const [progRes, ddRes] = await Promise.all([
      sb.from('staff_training_progress').select('*').in('user_id', staffUserIds),
      sb.from('staff_training_due_dates').select('*').in('user_id', staffUserIds)
    ])
    progress = progRes.data || []
    dueDates = ddRes.data || []
  }
  const progressMap = {}
  progress.forEach(p => { progressMap[p.user_id + '_' + p.item_id] = p })
  const dueDateMap = {}
  dueDates.forEach(d => { dueDateMap[d.user_id + '_' + d.unit_id] = d.due_date })
  const today = new Date().toISOString().slice(0,10)

  let visibleUnits = units || []
  if (unitFilter) visibleUnits = visibleUnits.filter(u => u.id === unitFilter)

  let html = ''
  for (const unit of visibleUnits) {
    const unitItems = (items || []).filter(i => i.unit_id === unit.id)
    if (!unitItems.length) continue

    const staffHeaders = staff.map(s => {
      const dueDate = s.user_id ? dueDateMap[s.user_id + '_' + unit.id] : null
      const unitItems = (items||[]).filter(i => i.unit_id === unit.id)
      const unitDone = s.user_id && unitItems.every(i => progressMap[s.user_id + '_' + i.id])
      const isOverdue = dueDate && dueDate < today && !unitDone
      const dueBadge = dueDate
        ? `<div style="font-size:10px;color:${isOverdue ? '#c0392b' : '#aaa'};margin-top:3px;font-weight:400">${isOverdue ? '⚠ ' : ''}${dueDate}</div>`
        : ''
      return `<th style="padding:8px 6px;font-size:12px;font-weight:600;color:#333;text-align:center;min-width:80px;max-width:100px;word-break:break-word;line-height:1.3;border-left:0.5px solid #f0f0e8;vertical-align:top">
        ${s.nickname || s.display_name}
        ${dueBadge}
      </th>`
    }).join('')

    const itemRows = unitItems.map(item => {
      const cells = staff.map(s => {
        if (!unitAppliesTo(unit, s)) return `<td style="text-align:center;border-left:0.5px solid #f0f0e8;padding:6px 4px;background:#f8f8f8"><span style="color:#ddd;font-size:13px">╌</span></td>`
        if (!s.user_id) return `<td style="text-align:center;border-left:0.5px solid #f0f0e8;padding:6px 4px"><span style="color:#ddd">–</span></td>`
        const done = progressMap[s.user_id + '_' + item.id]
        return `<td style="text-align:center;border-left:0.5px solid #f0f0e8;padding:6px 4px;background:${done ? '#f0faf0' : ''}" onclick="toggleStudioTrainingItem('${s.user_id}','${item.id}',${!!done})" style="cursor:pointer">
          ${done ? '✅' : '⬜'}
        </td>`
      }).join('')
      return `<tr style="border-bottom:0.5px solid #f5f5f0">
        <td style="padding:8px 14px;font-size:12px">${item.title}${item.description ? `<div style="font-size:11px;color:#888;margin-top:1px">${item.description}</div>` : ''}</td>
        ${cells}
      </tr>`
    }).join('')

    // Per-staff completion %
    const completionRow = `<tr style="background:#fafaf8;border-top:0.5px solid #e0e0d8">
      <td style="padding:6px 14px;font-size:11px;color:#888;font-style:italic">Completion</td>
      ${staff.map(s => {
        if (!s.user_id) return '<td style="border-left:0.5px solid #f0f0e8"></td>'
        const done = unitItems.filter(i => progressMap[s.user_id + '_' + i.id]).length
        const pct = Math.round(done / unitItems.length * 100)
        const dueDate = dueDateMap[s.user_id + '_' + unit.id]
        const isOverdue = dueDate && dueDate < today && pct < 100
        const color = pct === 100 ? '#2e7d32' : isOverdue ? '#c0392b' : pct >= 50 ? '#e65100' : '#888'
        const bg = isOverdue ? 'background:#fff8f8;' : ''
        return `<td style="text-align:center;border-left:0.5px solid #f0f0e8;padding:6px 4px;font-size:11px;font-weight:600;color:${color};${bg}">${pct}%</td>`
      }).join('')}
    </tr>`

    html += `
      <div style="background:white;border:0.5px solid #e0e0d8;border-radius:12px;overflow:hidden;margin-bottom:1.25rem">
        <div style="padding:12px 16px;background:#fafaf8;border-bottom:0.5px solid #e0e0d8">
          <strong style="font-size:13px">${unit.name}</strong>
          <span style="font-size:11px;color:#888;margin-left:8px">${unitItems.length} items · ${staff.length} staff</span>
        </div>
        <div style="overflow-x:auto">
          <table style="border-collapse:collapse;font-size:12px;width:100%">

function buildThemeBanner(date) {
  const weekly = curriculumData.filter(r => r.week_start && r.week_end && r.theme)
    .sort((a, b) => a.week_start.localeCompare(b.week_start))
  if (!weekly.length) return ''

  if (!thisWeek) return ''

  const idx = weekly.indexOf(thisWeek)
  const next1 = weekly[idx + 1]
  const next2 = weekly[idx + 2]

  const upcomingParts = [next1, next2].filter(Boolean)
    .map(r => `<span style="opacity:0.75">${r.theme}</span>`)
    .join('<span style="margin:0 6px;opacity:0.4">→</span>')

function isSeriesClass2Plus(title) {
  return /\bclass\s+([2-9]|\d{2,})\s+of\s+\d+/i.test(title)
}

function getSeriesClass1Title(title) {
  return title.replace(/\s*-?\s*class\s+\d+\s+of\s+\d+/i, '').trim()
}

async function findClass1SessionId(studioId, sessionTime, seriesTitle, sessionDate) {
  const { data: exact } = await sb.from('sessions').select('id').eq('studio_id', studioId).eq('session_time', sessionTime).eq('title', seriesTitle).single()
  if (exact) return exact.id
  const { data: sessions } = await sb.from('sessions').select('id, title, session_date').eq('studio_id', studioId).eq('session_time', sessionTime)
  if (!sessions) return null
  const candidates = sessions.filter(s =>
    !isSeriesClass2Plus(s.title) &&
    s.title.toLowerCase().includes(seriesTitle.toLowerCase().split('|')[0].trim().toLowerCase().substring(0, 10))
  )
  if (!candidates.length) return null
  if (candidates.length === 1) return candidates[0].id
  if (sessionDate) {
    const dow = new Date(sessionDate + 'T12:00:00').getDay()
    const sameDow = candidates.filter(s => s.session_date && new Date(s.session_date + 'T12:00:00').getDay() === dow)
    if (sameDow.length === 1) return sameDow[0].id
    if (sameDow.length > 1) {
      const current = new Date(sessionDate + 'T12:00:00')
      const earlier = sameDow
        .filter(s => new Date(s.session_date + 'T12:00:00') <= current)
        .sort((a, b) => new Date(b.session_date) - new Date(a.session_date))
      if (earlier.length) return earlier[0].id
    }
  }
  const { data: bookings } = await sb.from('bookings').select('session_id').in('session_id', candidates.map(s => s.id)).gt('qty', 0).limit(1)
  return bookings?.length ? bookings[0].session_id : candidates[0].id
}

function buildCurriculumLinks(sessionTitle, sessionDate, sessionTime) {

  if (links?.curriculum_url) parts.push(`<a href="${links.curriculum_url}" target="_blank" style="font-size:12px;color:#2e7d32;text-decoration:none;padding:3px 8px;border:0.5px solid #a5d6a7;border-radius:4px;background:#e8f5e9">📋 Curriculum</a>`)

  return `<div style="display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap">${theme}${parts.join('')}</div>`
}

function dateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`
}
function formatDate(d) {
  return d.toLocaleDateString('en-CA', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })
}
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate()+n); return r }
function getBadgeClass(type) {
  return { party:'badge-party', workshop:'badge-workshop', glazing:'badge-glazing', class:'badge-class', camp:'badge-camp' }[type] || 'badge-workshop'
}

function getListType(sessionType, sessionTitle) {
  const t = (sessionTitle || '').toLowerCase()
  if (sessionType === 'glazing') return 'glazing'
  if (sessionType === 'party') return 'party'
  if (t.includes('camp') || t.includes('pa day') || t.includes('pd day') || t.includes('pa/pd') || t.includes('no school')) return 'camp'
  if (isSeriesClass2Plus(sessionTitle)) return 'series'
  return 'workshop'
}

async function loadDayView() {
  loadPartyFormBanner()
  document.getElementById('date-bar').textContent = formatDate(currentDate)
  const container = document.getElementById('sessions-container')
  container.innerHTML = '<div class="loading">Loading...</div>'
  const filters = getFilters()
  const today = dateStr(currentDate)

  const { data: sessions } = await sb.from('sessions')
    .select('*').eq('studio_id', currentStudioId).eq('session_date', today).order('session_time')
  const filtered = (sessions || []).filter(s => matchesFilters(s, filters))

  const staffData = {}, bookingCounts = {}, estimatedAtt = {}

  const { data: walkinData } = await sb.from('daily_walkins')
    .select('walkins').eq('studio_id', currentStudioId).eq('report_date', today).single()
  const currentWalkins = walkinData?.walkins || 0

  // Party bookings: fetch per session
  const partySessionIds = filtered.filter(s => s.session_type === 'party').map(s => s.id)
  let partyBookings = {} // session_id -> [bookings]
  let partyDetails = {}  // booking_id -> party_detail row

  const aftercareCounts = {}, earlyArrivalCounts = {}, signinData = {}
  if (filtered.length) {
    const ids = filtered.map(s => s.id)
    const { data: staff } = await sb.from('session_staff').select('*').in('session_id', ids)
    if (staff) staff.forEach(s => { staffData[s.session_id] = s })

    // Sign-in entries for today
    const { data: signins } = await sb.from('signin_entries').select('session_id, name, mode').in('session_id', ids)
    if (signins) signins.forEach(e => {
      if (!signinData[e.session_id]) signinData[e.session_id] = []
      signinData[e.session_id].push({ name: e.name, mode: e.mode })
    })

    const { data: bookings } = await sb.from('bookings')
      .select('id, session_id, customer_name, customer_email, customer_phone, shopify_order_name, qty, estimated_attendance, raw_payload, booked_at, aftercare, early_arrival')
      .in('session_id', ids).gt('qty', 0)
    if (bookings) {
      bookings.forEach(b => {
        bookingCounts[b.session_id] = (bookingCounts[b.session_id] || 0) + (b.qty || 0)
        if (b.aftercare) aftercareCounts[b.session_id] = (aftercareCounts[b.session_id] || 0) + (b.qty || 0)
        if (b.early_arrival) earlyArrivalCounts[b.session_id] = (earlyArrivalCounts[b.session_id] || 0) + (b.qty || 0)
        if (b.estimated_attendance) estimatedAtt[b.session_id] = (estimatedAtt[b.session_id] || 0) + b.estimated_attendance
        if (partySessionIds.includes(b.session_id)) {
          if (!partyBookings[b.session_id]) partyBookings[b.session_id] = []
          partyBookings[b.session_id].push(b)
        }
      })
    }

    // Fetch party details for all party bookings
    const allPartyBookingIds = Object.values(partyBookings).flat().map(b => b.id)
    if (allPartyBookingIds.length) {
      const { data: pds } = await sb.from('party_details').select('*').in('booking_id', allPartyBookingIds)
      if (pds) pds.forEach(pd => { partyDetails[pd.booking_id] = pd })

      // Auto-create party_details rows for bookings that don't have one yet
      const allPartyBookings = Object.values(partyBookings).flat()
      for (const b of allPartyBookings) {
        if (!partyDetails[b.id]) {
          // Extract guest count from raw_payload add-on line items
          const lineItems = b.raw_payload?.line_items || []
          let guestCount = null
          for (const li of lineItems) {
            const m = String(li.variant_title || '').match(/(\d+)\s*people/i)
            if (m) { guestCount = parseInt(m[1]); break }
          }
          // Fallback: check estimated_attendance or use default
          if (!guestCount && b.estimated_attendance) guestCount = b.estimated_attendance
          if (!guestCount) {
            const s = filtered.find(s => s.id === b.session_id)
            guestCount = (s?.session_type === 'adult' || s?.title?.toLowerCase().includes('adult')) ? 10 : 8
          }
          // Insert party_details row with expected_guests
          const insertSession = filtered.find(s => s.id === b.session_id)
          const { data: inserted, error: insErr } = await sb.from('party_details').insert({
            booking_id: b.id,
            session_id: b.session_id,
            studio_id: insertSession?.studio_id || currentStudioId,
            expected_guests: guestCount
          }).select().single()
          if (inserted) partyDetails[b.id] = inserted
        } else if (!partyDetails[b.id].expected_guests) {
          // Row exists but expected_guests is null — update it
          const lineItems = b.raw_payload?.line_items || []
          let guestCount = null
          for (const li of lineItems) {
            const m = String(li.variant_title || '').match(/(\d+)\s*people/i)
            if (m) { guestCount = parseInt(m[1]); break }
          }
          if (!guestCount && b.estimated_attendance) guestCount = b.estimated_attendance
          if (guestCount) {
            await sb.from('party_details').update({ expected_guests: guestCount }).eq('booking_id', b.id)
            partyDetails[b.id].expected_guests = guestCount
          }
        }
      }
    }

    // Apply show/hide logic: hide if 0 reg AND capacity is explicitly set to 0 (synced & closed out)
    const visibleSessions = filtered.filter(s => (bookingCounts[s.id] || 0) > 0 || s.capacity === null || s.capacity > 0)
    filtered.length = 0; visibleSessions.forEach(s => filtered.push(s))

    // Series class 2+ — copy booking count from class 1
    for (const s of filtered) {
      if (isSeriesClass2Plus(s.title) && !bookingCounts[s.id]) {
        const class1Title = getSeriesClass1Title(s.title)
        const class1Id = await findClass1SessionId(currentStudioId, s.session_time, class1Title, s.session_date)
        if (class1Id) {
          if (bookingCounts[class1Id] !== undefined) {
            bookingCounts[s.id] = bookingCounts[class1Id]
          } else {
            const { data: c1bookings } = await sb.from('bookings').select('qty').eq('session_id', class1Id).gt('qty', 0)
            if (c1bookings) bookingCounts[s.id] = c1bookings.reduce((sum, b) => sum + (b.qty || 0), 0)
          }
        }
      }
    }
  }

  // For non-party sessions, sum booking counts normally
  const totalReg = Object.values(bookingCounts).reduce((sum, sessionId_v, idx, arr) => {
    // handled below for parties
    return sum
  }, 0)

  // Recalculate: non-party sessions use bookingCounts, party sessions use actual_guests or expected_guests
  let totalNonParty = 0
  let totalPartyGuests = 0
  for (const s of filtered) {
    if (s.session_type !== 'party') {
      totalNonParty += (bookingCounts[s.id] || 0)
    } else {
      // Party: find actual_guests or expected_guests from party_details
      const sessionBookings = partyBookings[s.id] || []
      let partyGuestCount = 0
      for (const b of sessionBookings) {
        const pd = partyDetails[b.id]
        if (pd && pd.actual_guests) {
          partyGuestCount += parseInt(pd.actual_guests) || 0
        } else if (pd && pd.expected_guests) {
          partyGuestCount += parseInt(pd.expected_guests) || 0
        } else if (b.estimated_attendance) {
          partyGuestCount += parseInt(b.estimated_attendance) || 0
        } else {
          // fallback to booking qty
          partyGuestCount += (b.qty || 0)
        }
      }
      totalPartyGuests += partyGuestCount
    }
  }

  const totalPrepaid = Object.values(staffData).reduce((sum, s) => sum + (parseInt(s.prepaid_participants) || 0), 0)
  const grandTotal = totalNonParty + totalPartyGuests + totalPrepaid + currentWalkins


  const STUDIO_GROUP = { 'BC-YVR-MS':'A', 'BC-YYJ-VIC':'A' }
  const group = STUDIO_GROUP[currentStudioId] || 'B'
  const isWeekend = [0, 6].includes(currentDate.getDay())
  const thresholds = {
    A: {
      weekday: [{max:9,msg:'Very slow day - consider closing',bg:'#fff3e0',color:'#e65100'},{max:20,msg:'Keep growing!',bg:'#fff0e0',color:'#c96a00'},{max:79,msg:'Have a good day in the studio!',bg:'#fffde7',color:'#9a7c00'},{max:Infinity,msg:'You made your goal, congratulations!',bg:'#e8f5e9',color:'#2e7d32'}],
      weekend: [{max:9,msg:'Uh oh - we need to grow!',bg:'#fff3e0',color:'#e65100'},{max:20,msg:'Keep growing!',bg:'#fff0e0',color:'#c96a00'},{max:159,msg:'Have a good day in the studio!',bg:'#fffde7',color:'#9a7c00'},{max:Infinity,msg:'You made your goal, congratulations!',bg:'#e8f5e9',color:'#2e7d32'}]
    },
    B: {
      weekday: [{max:9,msg:'Very slow day - consider closing',bg:'#fff3e0',color:'#e65100'},{max:20,msg:'Keep growing!',bg:'#fff0e0',color:'#c96a00'},{max:59,msg:'Have a good day in the studio!',bg:'#fffde7',color:'#9a7c00'},{max:Infinity,msg:'You made your goal, congratulations!',bg:'#e8f5e9',color:'#2e7d32'}],
      weekend: [{max:9,msg:'Uh oh - we need to grow!',bg:'#fff3e0',color:'#e65100'},{max:20,msg:'Keep growing!',bg:'#fff0e0',color:'#c96a00'},{max:99,msg:'Have a good day in the studio!',bg:'#fffde7',color:'#9a7c00'},{max:Infinity,msg:'You made your goal, congratulations!',bg:'#e8f5e9',color:'#2e7d32'}]
    }
  }
  const t = thresholds[group][isWeekend ? 'weekend' : 'weekday'].find(t => grandTotal <= t.max)
  const partyNote = totalPartyGuests > 0 ? ` <span style="font-size:12px;opacity:0.8">(incl. ${totalPartyGuests} party guests)</span>` : ''

async function printFullDay() {
  const btn = document.getElementById('print-full-day-btn')

  const today = dateStr(currentDate)
  const { data: sessions } = await sb.from('sessions')
    .select('*').eq('studio_id', currentStudioId).eq('session_date', today).order('session_time')

  const regularSessions = (sessions || []).filter(s => s.session_type !== 'party')

  if (!regularSessions.length) {
    alert('No regular sessions found for today.')
    if (btn) { btn.textContent = '🖨 Print Full Day'; btn.disabled = false }
    return
  }

  const ids = regularSessions.map(s => s.id)
  const { data: bookings } = await sb.from('bookings')
    .select('id, session_id, customer_name, qty, shopify_order_name, raw_payload, order_note, booked_at')
    .in('session_id', ids).gt('qty', 0).order('booked_at')

  const bookingsBySession = {}
  ;(bookings || []).forEach(b => {
    if (!bookingsBySession[b.session_id]) bookingsBySession[b.session_id] = []
    bookingsBySession[b.session_id].push(b)
  })

  // Deduplicate by order name within each session
  Object.keys(bookingsBySession).forEach(sid => {
    const seen = new Set()
    bookingsBySession[sid] = bookingsBySession[sid].filter(b => {
      if (!b.shopify_order_name) return true
      if (seen.has(b.shopify_order_name)) return false
      seen.add(b.shopify_order_name); return true
    })
  })

  const dateLabel = formatDate(currentDate)
  const totalAll = Object.values(bookingsBySession).flat().reduce((sum, b) => sum + (b.qty || 0), 0)

  const sections = regularSessions.map(s => {
    const sb2 = bookingsBySession[s.id] || []
    const total = sb2.reduce((sum, b) => sum + (b.qty || 0), 0)
    if (!total && !sb2.length) return ''
    const rows = sb2.map(b => {
      const note = getOrderNote(b)
      return `<tr>
        <td class="name">${b.customer_name || '—'}</td>
        <td class="center">${b.qty}</td>
        <td class="muted">${b.shopify_order_name || '—'}</td>
        <td class="note">${note || ''}</td>

    return `<div class="section">

        <span class="section-title">${s.title}</span>
        <span class="section-meta">${fmtTime(s.session_time)} &mdash; ${total} registered</span>

async function loadTableView() {
  const container = document.getElementById('table-container')
  container.innerHTML = '<div class="loading">Loading...</div>'
  const days = parseInt(document.getElementById('range-select').value) || 7
  const filters = getFilters()
  const startDate = new Date(currentDate)
  const endDate = addDays(startDate, days - 1)
  const { data: sessions } = await sb.from('sessions').select('*').eq('studio_id', currentStudioId).gte('session_date', dateStr(startDate)).lte('session_date', dateStr(endDate)).order('session_date').order('session_time')
  const allFiltered = (sessions || []).filter(s => matchesFilters(s, filters))
  if (!allFiltered.length) { container.innerHTML = '<div class="empty-state"><h2>No sessions found</h2><p>Try adjusting your filters or date range.</p></div>'; return }
  const bookingCounts = {}
  const sessionIds = allFiltered.map(s => s.id)
  const { data: bookings } = await sb.from('bookings').select('session_id, qty').in('session_id', sessionIds).gt('qty', 0)
  if (bookings) bookings.forEach(b => { bookingCounts[b.session_id] = (bookingCounts[b.session_id] || 0) + (b.qty || 0) })

  // For series class 2+, inherit reg count from class 1
  for (const s of allFiltered) {
    if (isSeriesClass2Plus(s.title) && !bookingCounts[s.id]) {
      const class1Title = getSeriesClass1Title(s.title)
      const class1Id = await findClass1SessionId(currentStudioId, s.session_time, class1Title, s.session_date)
      if (class1Id) {
        if (bookingCounts[class1Id] !== undefined) {
          bookingCounts[s.id] = bookingCounts[class1Id]
        } else {
          const { data: c1bookings } = await sb.from('bookings').select('qty').eq('session_id', class1Id).gt('qty', 0)
          if (c1bookings) bookingCounts[s.id] = c1bookings.reduce((sum, b) => sum + (b.qty || 0), 0)
        }
      }
    }
  }

  // Hide if 0 reg AND capacity is explicitly set to 0 (synced & closed out)
  const filtered = allFiltered.filter(s => (bookingCounts[s.id] || 0) > 0 || s.capacity === null || s.capacity > 0)
  const byDate = {}
  filtered.forEach(s => { if (!byDate[s.session_date]) byDate[s.session_date] = []; byDate[s.session_date].push(s) })
  const todayStr = dateStr(new Date())
  let html = '<table class="week-table"><thead><tr><th>Time</th><th>Session</th><th style="text-align:center">Reg</th><th style="text-align:center">Spaces Left</th></tr></thead><tbody>'
  Object.keys(byDate).sort().forEach(date => {
    const d = new Date(date + 'T12:00:00')
    const isT = date === todayStr
    html += `<tr><td colspan="4" style="background:${isT ? '#e8e8e0' : '#f0f0e8'};font-weight:500;font-size:13px;padding:10px 12px;color:${isT ? '#1a1a1a' : '#444'}">${isT ? '&#9679; ' : ''}${d.toLocaleDateString('en-CA', { weekday: 'long', month: 'long', day: 'numeric' })}</td></tr>`
    byDate[date].forEach(s => {
      const reg = bookingCounts[s.id] || 0
      const isFull = reg >= s.capacity
      const badge = getBadgeClass(s.session_type)
      const time = fmtTime(s.session_time)
      const titleSafe = s.title.replace(/'/g, "\\'")
      const regColor = reg === 0 ? '#bbb' : isFull ? '#99354e' : '#1a4fa0'
      const regBg = reg === 0 ? 'transparent' : isFull ? '#fce8f0' : '#e8f0fe'
      const spacesLeft = Math.max(0, s.capacity - reg)
      const spacesColor = spacesLeft === 0 ? '#99354e' : spacesLeft <= 2 ? '#e65100' : '#2e7d32'
      html += `<tr style="cursor:pointer" onclick="showBookings('${s.id}','${titleSafe}','${date}','${s.session_type}')" onmouseover="this.style.background='#fafaf8'" onmouseout="this.style.background=''">
        <td style="color:#888;white-space:nowrap;width:60px">${time}</td>
        <td>${s.title} <span class="type-pill ${badge}">${s.session_type}</span></td>
        <td style="text-align:center"><span style="display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:500;background:${regBg};color:${regColor}">${reg}</span></td>
        <td style="text-align:center;font-weight:500;color:${spacesColor}" id="spaces-${s.id}">${spacesLeft}</td>
      </tr>
      </tr>`
    })
  })
  html += '</tbody></table>'
  container.innerHTML = html
}

function parseLineItemProperties(rawPayload, sessionDate) {
  try {
    const payload = typeof rawPayload === 'string' ? JSON.parse(rawPayload) : rawPayload
    if (!payload?.line_items) return []
    const items = payload.line_items
    let match = items.find(li => {
      const t = (li.title || li.name || '').toLowerCase()
      if (sessionDate) {
        const d = new Date(sessionDate + 'T12:00:00')
        const monthDay = d.toLocaleDateString('en-CA', { month: 'short', day: 'numeric' }).replace('.', '').toLowerCase()
        if (t.includes(monthDay)) return true
        const day = d.getDate()
        const suffix = day===1||day===21||day===31?'st':day===2||day===22?'nd':day===3||day===23?'rd':'th'
        if (t.includes(`${monthDay}${suffix}`)) return true
      }
      return false
    })
    if (!match) match = items[0]
    return match?.properties || []
  } catch(e) { return [] }
}

function getGlazingPiece(rawPayload, sessionDate) {
  try {
    const payload = typeof rawPayload === 'string' ? JSON.parse(rawPayload) : rawPayload
    if (!payload?.line_items) return null
    const items = payload.line_items
    let match = items.find(li => {
      const t = (li.title || li.name || '').toLowerCase()
      if (sessionDate) {
        const d = new Date(sessionDate + 'T12:00:00')
        const monthDay = d.toLocaleDateString('en-CA', { month: 'short', day: 'numeric' }).replace('.', '').toLowerCase()
        if (t.includes(monthDay)) return true
      }
      return false
    })
    if (!match) match = items[0]
    const props = match?.properties || []
    return props.find(p => p.name?.toLowerCase().includes('glazing'))?.value || null
  } catch(e) { return null }
}

function formatDOB(dobStr, refDateStr) {
  try {
    const dob = new Date(dobStr + 'T12:00:00')
    const ref = refDateStr ? new Date(refDateStr + 'T12:00:00') : new Date()
    let age = ref.getFullYear() - dob.getFullYear()
    const m = ref.getMonth() - dob.getMonth()
    if (m < 0 || (m === 0 && ref.getDate() < dob.getDate())) age--
    const formatted = dob.toLocaleDateString('en-CA', { year: 'numeric', month: 'short', day: 'numeric' })
    return `Age ${age} · b. ${formatted}`
  } catch(e) { return dobStr }
}

function getPayloadPhone(rawPayload) {
  try {
    const p = typeof rawPayload === 'string' ? JSON.parse(rawPayload) : rawPayload
    return p?.billing_address?.phone || p?.shipping_address?.phone || p?.customer?.phone || p?.phone || ''
  } catch { return '' }
}

function getOrderNote(booking) {
  if (booking.order_note) return booking.order_note
  try {
    const p = typeof booking.raw_payload === 'string' ? JSON.parse(booking.raw_payload) : booking.raw_payload
    return p?.note || ''
  } catch { return '' }
}
