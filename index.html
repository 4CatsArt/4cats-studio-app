async function showSignins(sessionId, title) {
  const { data, error } = await sb.from('signin_entries')
    .select('name, email, phone, mode, signed_in_at, clay_ticket_id, clay_tickets(ticket_number)')
    .eq('session_id', sessionId)
    .order('signed_in_at')

  const overlay = document.createElement('div')
  overlay.className = 'overlay'
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove() })

  let bodyHtml = ''
  if (error || !data?.length) {
    bodyHtml = '<div style="color:#aaa;padding:20px;text-align:center">No sign-ins recorded yet.</div>'
  } else {
    const byTicket = {}
    const noTicket = []
    data.forEach(e => {
      const tNum = e.clay_tickets?.ticket_number
      if (tNum) {
        if (!byTicket[tNum]) byTicket[tNum] = []
        byTicket[tNum].push(e)
      } else {
        noTicket.push(e)
      }
    })

    bodyHtml = `<div style="font-size:12px;color:#888;margin-bottom:12px">${data.length} signed in</div>`

    Object.entries(byTicket).forEach(([ticketNum, entries]) => {
      bodyHtml += `<div style="background:#fffbea;border:1px solid #f0e098;border-radius:8px;padding:10px 14px;margin-bottom:8px">
        <div style="font-size:11px;color:#7a6200;font-weight:700;margin-bottom:8px">🏺 Clay Ticket #${ticketNum}</div>
        ${entries.map(e => `<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:0.5px solid #f0e098">
          <span style="font-size:13px;font-weight:600">${e.name}</span>
          <span style="font-size:12px;color:#888">${e.email || e.phone || ''}</span>
        </div>`).join('')}
      </div>`
    })

    if (noTicket.length) {
      bodyHtml += `<div style="background:#f8f8f5;border:1px solid #e0e0d8;border-radius:8px;padding:10px 14px">
        ${noTicket.map(e => `<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:0.5px solid #eee">
          <span style="font-size:13px;font-weight:600">${e.name}</span>
          <span style="font-size:12px;color:#888">${e.email || e.phone || ''}</span>
        </div>`).join('')}
      </div>`
    }
  }

  overlay.innerHTML = `
    <div class="overlay-card" style="max-width:480px">
      <div class="overlay-header">
        <div><div class="overlay-title">Sign-ins</div><div class="overlay-sub">${title}</div></div>
        <button class="close-btn" onclick="this.closest('.overlay').remove()">&#215;</button>
      </div>
      <div style="padding:0.5rem 0">${bodyHtml}</div>
    </div>`
  document.body.appendChild(overlay)
}

async function showBookings(sessionId, title, dateLabel, sessionType, sessionTime) {
  let bookingSessionId = sessionId
  if (isSeriesClass2Plus(title)) {
    const class1Title = getSeriesClass1Title(title)
    const class1Id = await findClass1SessionId(currentStudioId, sessionTime, class1Title, dateLabel)
    if (class1Id) bookingSessionId = class1Id
  }
  const { data: bookings } = await sb.from('bookings')
    .select('id, customer_name, customer_email, customer_phone, qty, estimated_attendance, shopify_order_name, booked_at, raw_payload, event_date, order_note, aftercare, early_arrival')
    .eq('session_id', bookingSessionId).order('booked_at')

  const seenOrders = new Set()
  const bookingsToUse = (bookings || []).filter(b => {
    if (!b.shopify_order_name) return true
    if (seenOrders.has(b.shopify_order_name)) return false
    seenOrders.add(b.shopify_order_name)
    return true
  })

  const orderNames = bookingsToUse.map(b => b.shopify_order_name).filter(Boolean)
  let tallyData = {}
  if (orderNames.length) {
    const { data: tally } = await sb.from('tally_registrations').select('*').in('shopify_order_name', orderNames)
    if (tally) tally.forEach(t => {
      if (!tallyData[t.shopify_order_name]) tallyData[t.shopify_order_name] = []
      tallyData[t.shopify_order_name].push(t)
    })
  }

  const bookingIds = bookingsToUse.map(b => b.id).filter(Boolean)
  let childrenData = {}
  if (bookingIds.length) {
    const { data: children } = await sb.from('booking_children').select('*').in('booking_id', bookingIds).order('child_index')
    if (children) children.forEach(c => {
      if (!childrenData[c.booking_id]) childrenData[c.booking_id] = []
      childrenData[c.booking_id].push(c)
    })
  }

  const listType = getListType(sessionType, title)
  const attendanceSessionId = listType === 'series' ? sessionId : bookingSessionId
  let attendanceData = {}
  if (orderNames.length) {
    const { data: att } = await sb.from('attendance').select('*').eq('session_id', attendanceSessionId).in('shopify_order_name', orderNames)
    if (att) att.forEach(a => {
      const key = `${a.shopify_order_name}|${(a.camper_name || '').toLowerCase().trim()}`
      attendanceData[key] = a
    })
  }

  const overlay = document.createElement('div')
  overlay.className = 'overlay'

  if (!bookingsToUse.length) {
    overlay.innerHTML = `
      <div class="overlay-card">
        <div class="overlay-header">
          <div><div class="overlay-title">${title}</div><div class="overlay-sub">${sessionTime ? fmtTime(sessionTime) + ' — ' : ''}${dateLabel}</div></div>
          <button class="close-btn no-print" onclick="this.closest('.overlay').remove()">&#215;</button>
        </div>
        <p style="color:#888;padding:2rem 0;text-align:center">No bookings yet for this session.</p>
      </div>`
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove() })
    document.body.appendChild(overlay)
    return
  }

  const total = (bookings || []).reduce((sum, b) => sum + (b.qty || 0), 0)
  let tableHtml = ''

  if (listType === 'glazing') tableHtml = buildGlazingTable(bookingsToUse, dateLabel)
  else if (listType === 'workshop') tableHtml = buildWorkshopTable(bookingsToUse, title)
  else if (listType === 'camp') tableHtml = buildCampTable(bookingsToUse, tallyData, attendanceData, sessionId, dateLabel, childrenData)
  else if (listType === 'series') tableHtml = buildSeriesTable(bookingsToUse, tallyData, attendanceData, sessionId, dateLabel, currentStudioId, sessionTime, childrenData)
  else tableHtml = buildWorkshopTable(bookingsToUse, title)

  overlay.innerHTML = `
    <div class="overlay-card" id="print-area">
      <div class="overlay-header">
        <div>
          <div class="overlay-title">${title}</div>
          <div class="overlay-sub">${sessionTime ? fmtTime(sessionTime) + ' — ' : ''}${dateLabel} &mdash; ${total} registered</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <button class="print-btn no-print" onclick="window.print()">🖨 Print</button>
          <button class="close-btn no-print" onclick="this.closest('.overlay').remove()">&#215;</button>
        </div>
      </div>
      ${tableHtml}
    </div>`

  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove() })
  document.body.appendChild(overlay)
}

function buildGlazingTable(bookings, dateLabel) {

function buildWorkshopTable(bookings, title) {

// ── CAMP TABLE ─────────────────────────────────────────────────
let campTableRows = []
let campTableSort = { col: null, dir: 1 }

function sortCampTable(col) {
  if (campTableSort.col === col) campTableSort.dir *= -1
  else { campTableSort.col = col; campTableSort.dir = 1 }
  const sorted = [...campTableRows].sort((a, b) => (a[col]||'').toLowerCase().localeCompare((b[col]||'').toLowerCase()) * campTableSort.dir)
  document.getElementById('camp-table-body').innerHTML = sorted.map(r => r.html).join('')
  document.querySelectorAll('.camp-sort-btn').forEach(btn => {
    const isActive = btn.dataset.col === col
    btn.textContent = isActive ? (campTableSort.dir === 1 ? ' ↑' : ' ↓') : ' ⇅'
    btn.style.opacity = isActive ? '1' : '0.3'
  })
}

function buildCampTable(bookings, tallyData, attendanceData, sessionId, dateLabel, childrenData = {}) {
  campTableRows = []
  campTableSort = { col: null, dir: 1 }
  bookings.forEach(b => {
    const note = getOrderNote(b)
    const orderUid = (b.shopify_order_name || '').replace('#','') || Math.random().toString(36).slice(2)
    const props = parseLineItemProperties(b.raw_payload, b.event_date)
    let participants = props.filter(p => p.name?.toLowerCase().startsWith('participant')).sort((a,z) => a.name.localeCompare(z.name)).map(p => {
      const name = p.value.split('|')[0]?.trim() || p.value
      const dobMatch = p.value.match(/DOB:\s*(\d{4}-\d{2}-\d{2})/)
      const dob = dobMatch ? dobMatch[1] : null
      const tally = (tallyData[b.shopify_order_name]||[]).find(t => t.camper_name?.toLowerCase().trim() === name.toLowerCase().trim())
      return { name, dob, tally, source: 'shopify' }
    })
    if (participants.length === 0) {
      const tallyRows = (tallyData[b.shopify_order_name]||[]).filter((t,idx,arr) => arr.findIndex(x => x.camper_name?.toLowerCase().trim() === t.camper_name?.toLowerCase().trim()) === idx)
      participants = tallyRows.map(t => ({ name: t.camper_name, dob: null, age: t.camper_age, tally: t, source: 'tally' }))
    }
    if (participants.length === 0) {
      const uid = orderUid
      const attKey = `${b.shopify_order_name}|`
      const att = attendanceData[attKey]
      campTableRows.push({ name:'', age:'', registeredBy: b.customer_name||'', html: `<tr>
        <td style="text-align:center"><input type="checkbox" class="attended-check" ${att?.attended?'checked':''} onchange="saveAttendance('${sessionId}','${b.shopify_order_name}','',this.checked)"></td>
        <td>${editInput('cn-'+uid,'','Child name')}</td><td>${editInput('ca-'+uid,'','Age','short')}</td>
        <td>${editCheck('wh-'+uid,false)}</td><td>${editInput('mn-'+uid,'','Medical notes')}</td>
        <td>${editCheck('ac-'+uid,b.aftercare||false)}</td><td>${editInput('pp-'+uid,b.customer_phone||getPayloadPhone(b.raw_payload),'Phone')}</td>
        <td>${editInput('ec-'+uid,'','Emergency contact')}</td>
        <td style="color:#888">${b.customer_name||'&mdash;'}</td><td style="text-align:center">${b.qty}</td>
        <td style="color:#888">${b.shopify_order_name||'&mdash;'}</td><td class="note-cell">${note||''}</td>
        <td class="no-print"><button class="row-save-btn" onclick="saveCampRow(null,'${b.shopify_order_name}','${uid}','${sessionId}')">Save</button></td>
      </tr>` })
      return
    }
    participants.forEach((p, i) => {
      const t = p.tally
      const uid = `${orderUid}-${i}`
      const camperName = p.name || ''
      const attKey = `${b.shopify_order_name}|${camperName.toLowerCase().trim()}`
      const att = attendanceData[attKey]
      const ageDisplay = p.dob ? formatDOB(p.dob, dateLabel) : (p.age ? `Age ${p.age}` : '')
      const ageSortVal = p.dob ? p.dob : (p.age ? String(p.age).padStart(3,'0') : '')
      campTableRows.push({ name: camperName, age: ageSortVal, registeredBy: i===0?(b.customer_name||''):'', html: `<tr>
        <td style="text-align:center"><input type="checkbox" class="attended-check" ${att?.attended?'checked':''} onchange="saveAttendance('${sessionId}','${b.shopify_order_name}','${camperName.replace(/'/g,"\\'")}',this.checked)"></td>
        <td>${editInput('cn-'+uid,camperName,'Child name')}</td><td style="font-size:12px;color:#666">${ageDisplay}</td>
        <td>${editCheck('wh-'+uid,t?.walk_home||false)}</td><td>${editInput('mn-'+uid,t?.medical_notes||'','Medical notes')}</td>
        <td>${editCheck('ac-'+uid,t?.aftercare||b.aftercare||false)}</td><td>${editInput('pp-'+uid,t?.parent_phone||b.customer_phone||getPayloadPhone(b.raw_payload)||'','Phone')}</td>
        <td>${editInput('ec-'+uid,t?(t.emergency_contact_name||'')+(t.emergency_contact_phone?' '+t.emergency_contact_phone:''):'','Emergency contact')}</td>
        <td style="color:#888">${i===0?(b.customer_name||'&mdash;'):''}</td><td style="text-align:center">1</td>
        <td style="color:#888">${b.shopify_order_name||'&mdash;'}</td><td class="note-cell">${i===0?(note||''):''}</td>
        <td class="no-print"><button class="row-save-btn" onclick="saveCampRow('${t?.id||null}','${b.shopify_order_name}','${uid}','${sessionId}')">Save</button></td>
      </tr>` })
    })
    const existingChildren = childrenData[b.id] || []
    const extraCount = Math.max(0, (b.qty||1) - participants.length)
    for (let i = 0; i < extraCount; i++) {
      const childIndex = participants.length + i + 1
      const existing = existingChildren.find(c => c.child_index === childIndex)
      const cid = `${b.id}-child-${childIndex}`
      const attKey = `${b.shopify_order_name}|${(existing?.child_name||'').toLowerCase().trim()}`
      const att = existing?.child_name ? attendanceData[attKey] : null
      campTableRows.push({ name: existing?.child_name||'', age: existing?.child_age||'', registeredBy: b.customer_name||'', html: `<tr style="background:#fafaf8">
        <td style="text-align:center"><input type="checkbox" class="attended-check" ${att?.attended?'checked':''} onchange="saveAttendance('${sessionId}','${b.shopify_order_name}','${(existing?.child_name||'').replace(/'/g,"\\'")}',this.checked)"></td>
        <td>${editInput('cn-'+cid,existing?.child_name||'','Child name')}</td><td>${editInput('ca-'+cid,existing?.child_age||'','Age','short')}</td>
        <td>${editCheck('wh-'+cid,existing?.walk_home||false)}</td><td>${editInput('mn-'+cid,existing?.medical||'','Medical notes')}</td>
        <td>${editCheck('ac-'+cid,false)}</td><td>${editInput('pp-'+cid,existing?.parent_phone||'','Phone')}</td>
        <td>${editInput('ec-'+cid,existing?.emergency_contact||'','Emergency contact')}</td>
        <td style="color:#888">${b.customer_name||'&mdash;'}</td><td style="text-align:center"></td>
        <td style="color:#888">${b.shopify_order_name||'&mdash;'}</td><td></td>
        <td class="no-print"><button class="row-save-btn" onclick="saveChildRow('${existing?.id||null}','${b.id}',${childIndex},'${cid}')">Save</button></td>
      </tr>` })
    }
  })
  const sortBtn = col => `<button class="camp-sort-btn no-print" data-col="${col}" onclick="sortCampTable('${col}')" style="background:none;border:none;cursor:pointer;font-size:10px;color:#888;padding:0;margin-left:2px;opacity:0.3"> ⇅</button>`
  return `<table class="booking-table"><thead><tr><th>✓</th><th>Participant${sortBtn('name')}</th><th>Age / DOB${sortBtn('age')}</th><th>Walk home?</th><th>Medical</th><th>Aftercare</th><th>Parent phone</th><th>Emergency contact</th><th>Registered by${sortBtn('registeredBy')}</th><th style="text-align:center">Qty</th><th>Order</th><th>Notes</th><th class="no-print"></th></tr></thead><tbody id="camp-table-body">${campTableRows.map(r=>r.html).join('')}</tbody></table>`
}

        <td style="text-align:center"><input type="checkbox" class="attended-check" ${att?.attended?'checked':''} onchange="saveAttendance('${sessionId}','${b.shopify_order_name}','${(existing?.child_name||'').replace(/'/g,"\\'")}',this.checked)"></td>

      </tr>` })
    }
  })
  const sortBtn = col => `<button class="series-sort-btn no-print" data-col="${col}" onclick="sortSeriesTable('${col}')" style="background:none;border:none;cursor:pointer;font-size:10px;color:#888;padding:0;margin-left:2px;opacity:0.3"> ⇅</button>`
  return `<table class="booking-table"><thead><tr><th>✓</th><th>Participant${sortBtn('name')}</th><th>Age / DOB${sortBtn('age')}</th><th>Walk home?</th><th>Medical</th><th>Parent phone</th><th>Emergency contact</th><th>Registered by${sortBtn('registeredBy')}</th><th style="text-align:center">Qty</th><th>Order</th><th>Notes</th><th class="no-print"></th></tr></thead><tbody id="series-table-body">${seriesTableRows.map(r=>r.html).join('')}</tbody></table>`
}

function buildShopifyTitle(sessionDate, sessionTime, sessionTitle) {
  const d = new Date(sessionDate + 'T12:00:00')
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
  const day = days[d.getDay()], month = months[d.getMonth()], date = d.getDate()
  const suffix = date===1||date===21||date===31?'st':date===2||date===22?'nd':date===3||date===23?'rd':'th'
  const [h, m] = sessionTime.split(':').map(Number)
  const hour = h===0?12:h>12?h-12:h
  const ampm = h<12?'am':'pm'
  const timeStr = m===0?`${hour}${ampm}`:`${hour}:${String(m).padStart(2,'0')}${ampm}`
  const starPrefix = (h===9&&m===0)?'*':''
  const titleLower = sessionTitle.toLowerCase().trim()
  const TITLE_MAP = {
    // New clean titles (Supabase = Shopify)
    'kids party':'Kids Party','splatter party':'Splatter Party','field trip':'Field Trip',
    'thursday clay night':'Thursday Clay Night',
    // Legacy mappings for backward compatibility
    'party time slot':'Kids Party','splatter party time slot':'Splatter Party','field trip time slot':'Field Trip',
    'adult get-together time slot':'Adult Get Togethers, Parties & Group Booking',
    'wheel workshop (adult & teen)':'Wheel Workshop','wheel workshop':'Wheel Workshop',
    'friday night mixer':'Friday Night Mixer','friday night mixer (ages 16+)':'Friday Night Mixer',
    'sunday morning family time mixer':'Sunday Morning Family Time Mixer',
    'sunday early bird workshop':'Sunday Early Bird Workshop',
    'mixed media class for kids ($10 for members)':'Mixed Media Class',
    'thursdays: clay night':'Thursday Clay Night','natureware mugs':'Natureware Mug',
    'summer camp half day morning':'Summer Camp Half Day','summer camp half day afternoon':'Summer Camp Half Day',
    'no school day camp (ages 6-12)':'PA/PD Day','pd day':'PA/PD Day','pa day':'PA/PD Day','pa/pd day':'PA/PD Day',
    "mother's day celebration":"Mother's Day",'afternoon art meetup':'Afternoon Art Meetup',
    'saturday early bird workshop':'Saturday Early Bird Workshop',
    'dragons session (ages 5-12) class 1 of 5':'Dragons 5 Week Kids Session',
    'early drop off (mixed media class)':null,
  }
  if (/\b(class|week|session|part)\s+([2-9]|\d{2,})\s+of\s+\d+/i.test(sessionTitle)) return null
  if (titleLower in TITLE_MAP && TITLE_MAP[titleLower] === null) return null
  if (titleLower === 'weekend workshop') return null
  if (/^weekend workshop:\s*/i.test(sessionTitle)) return `${starPrefix}${timeStr} ${day} ${month} ${date}${suffix} | ${sessionTitle.replace(/^weekend workshop:\s*/i,'').trim()}`
  if (titleLower.includes('wednesday paint night')) return `${starPrefix}${timeStr} ${day} ${month} ${date}${suffix} | Wednesday Paint Night`
  if (TITLE_MAP[titleLower]) return `${starPrefix}${timeStr} ${day} ${month} ${date}${suffix} | ${TITLE_MAP[titleLower]}`
  let cleanTitle = sessionTitle.replace(/ Workshop$/i, '').replace(/ Session$/i, '').replace(/\s*\|.*$/, '').trim()
  return `${starPrefix}${timeStr} ${day} ${month} ${date}${suffix} | ${cleanTitle}`
}

function buildShopifyHandle(sessionDate, sessionTime, sessionTitle) {
  const shopifyTitle = buildShopifyTitle(sessionDate, sessionTime, sessionTitle)
  if (!shopifyTitle || shopifyTitle === 'OVERRIDE') return null
  let handle = shopifyTitle.toLowerCase().replace(/\*/g,'').replace(/:/g,'').replace(/\s*\|\s*/g,'-').replace(/[^a-z0-9-]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'')
  const paintNightIdx = handle.indexOf('wednesday-paint-night')
  if (paintNightIdx !== -1) handle = handle.substring(0, paintNightIdx + 'wednesday-paint-night'.length)
  return handle
}

async function syncShopifyInventory() {
  const btn = document.getElementById('sync-shopify-btn')
  if (!btn) return
  btn.textContent = '⏳ Syncing...'; btn.disabled = true
  const days = parseInt(document.getElementById('range-select').value) || 7
  const startDate = new Date(currentDate)
  const endDate = addDays(startDate, days - 1)
  const { data: sessions } = await sb.from('sessions').select('id, title, capacity, session_date, session_time').eq('studio_id', currentStudioId).gte('session_date', dateStr(startDate)).lte('session_date', dateStr(endDate))
  if (!sessions?.length) { btn.textContent = '🔄 Sync Shopify'; btn.disabled = false; return }
  const ids = sessions.map(s => s.id)
  const counts = {}
  const { data: bookings } = await sb.from('bookings').select('session_id, qty').in('session_id', ids).gt('qty', 0)
  if (bookings) bookings.forEach(b => { counts[b.session_id] = (counts[b.session_id]||0) + (b.qty||0) })
  const sessionsWithReg = sessions.map(s => ({ ...s, reg: counts[s.id]||0 }))
  const seen = new Set()
  const toSync = []
  sessionsWithReg.forEach(s => {
    const shopifyTitle = buildShopifyTitle(s.session_date, s.session_time||'00:00:00', s.title)
    if (!shopifyTitle || seen.has(shopifyTitle)) return
    seen.add(shopifyTitle)
    toSync.push({ shopifyTitle, session_date: s.session_date, session_time: s.session_time })
  })
  const variantTitle = STUDIO_VARIANT_MAP[currentStudioId]
  if (!variantTitle) { btn.textContent = '🔄 Sync Shopify'; btn.disabled = false; return }
  let updated = 0
  for (const item of toSync) {
    btn.textContent = `⏳ ${updated}/${toSync.length}`
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/shopify-inventory`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_KEY}` }, body: JSON.stringify({ action: 'get_all', product_title: item.shopifyTitle }) })
      const data = await res.json()
      if (data.error) continue
      const variant = data.variants?.find(v => v.variant_title === variantTitle)
      if (!variant) continue
      const matchingSessions = sessionsWithReg.filter(s => s.session_date===item.session_date && s.session_time===item.session_time && buildShopifyTitle(s.session_date, s.session_time||'00:00:00', s.title)===item.shopifyTitle)
      for (const session of matchingSessions) {
        const newCapacity = variant.inventory_quantity + session.reg
        await sb.from('sessions').update({ capacity: newCapacity }).eq('id', session.id)
        const cell = document.getElementById(`spaces-${session.id}`)
        if (cell) { const spacesLeft = variant.inventory_quantity; cell.textContent = spacesLeft; cell.style.color = spacesLeft===0?'#99354e':spacesLeft<=2?'#e65100':'#2e7d32' }
        updated++
      }
    } catch(e) { console.warn('Could not sync:', item.shopifyTitle, e) }
    await new Promise(r => setTimeout(r, 200))
  }
  btn.textContent = `✓ ${updated} synced`
  setTimeout(() => { btn.textContent = '🔄 Sync Shopify'; btn.disabled = false }, 3000)
}

let activeTaskId = null

function openTaskPopup(taskId) {
  activeTaskId = taskId
  const row = document.getElementById('task-row-' + taskId)
  if (!row) return

  // Read data from the DOM row + find in tasks array
  const titleEl = row.querySelector('.task-title')
  const title = titleEl?.textContent?.trim() || ''

  // Rebuild staff datalist for popup
  const dl = document.getElementById('staff-list-popup')
  if (dl) dl.innerHTML = studioStaffList.map(s => `<option value="${s.nickname || s.display_name}">`).join('')

  // We need the full task — fetch it
  sb.from('studio_tasks').select('*').eq('id', taskId).single().then(({ data: task }) => {
    if (!task) return
    document.getElementById('task-popup-title').textContent = task.title
    // Source badge
    const sourceEl = document.getElementById('task-popup-source')
    sourceEl.innerHTML = task.source === 'home_office'
      ? '<span style="font-size:10px;background:#e8e8f0;color:#5b4fcf;padding:2px 6px;border-radius:4px">From Home Office</span>'
      : ''

    // Notes
    const notesEl = document.getElementById('task-popup-notes')
    const notesText = task.notes && !task.notes.startsWith('Assigned to:') ? task.notes : ''
    notesEl.textContent = notesText
    notesEl.style.display = notesText ? 'block' : 'none'

    // URL
    const urlEl = document.getElementById('task-popup-url')
    const linkEl = document.getElementById('task-popup-link')
    if (task.url) { linkEl.href = task.url; urlEl.style.display = 'block' }
    else urlEl.style.display = 'none'

    // Assignee
    document.getElementById('task-popup-assignee').value = task.assignee_name || ''

    // Due date
    const today = new Date().toISOString().slice(0,10)
    const dueEl = document.getElementById('task-popup-due')
    if (task.due_date === today) dueEl.textContent = 'Due today'
    else if (task.due_date < today) dueEl.innerHTML = '<span style="color:#c0392b">Overdue: ' + task.due_date + '</span>'
    else dueEl.textContent = 'Due ' + task.due_date

    // Status
    const statusEl = document.getElementById('task-popup-status')
    statusEl.innerHTML = task.status === 'complete'
      ? '<span style="color:#2e7d32">✓ Complete</span>'
      : '<span style="color:#888">Pending</span>'

    document.getElementById('task-popup').style.display = 'flex'
  })
}

  activeTaskId = null
}

      if (title) title.insertAdjacentElement('afterend', span)
    }
  }
  closeTaskPopup()
}

// Close popup on backdrop click
document.addEventListener('click', e => {
  const popup = document.getElementById('task-popup')
  if (popup && e.target === popup) closeTaskPopup()
})

</script>
