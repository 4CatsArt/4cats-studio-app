<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>4Cats Supply Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --cream: #FDFAF4;
      --green: #1B4332;
      --green-mid: #2D6A4F;
      --gold: #E9A319;
      --text: #1C1C1C;
      --muted: #6B7280;
      --border: #E5DFD3;
      --white: #FFFFFF;
      --shadow: 0 2px 12px rgba(0,0,0,0.07);
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Nunito', sans-serif; background: var(--cream); color: var(--text); min-height: 100vh; overflow-x: hidden; }

    /* ── SCREENS ── */
    .screen { display: none; flex-direction: column; min-height: 100vh; }
    .screen.active { display: flex; }

    /* ── LOGIN ── */
    #login-screen {
      background: var(--green);
      align-items: center; justify-content: center; padding: 2rem;
    }
    .login-box {
      background: var(--white); border-radius: 24px; padding: 2.5rem;
      width: 100%; max-width: 400px; box-shadow: 0 24px 64px rgba(0,0,0,0.35);
    }
    .login-logo { text-align: center; margin-bottom: 2rem; }
    .login-logo .logo-emoji { font-size: 3rem; display: block; margin-bottom: 0.5rem; }
    .login-logo h1 { font-size: 1.75rem; font-weight: 900; color: var(--green); }
    .login-logo p { color: var(--muted); font-size: 0.9rem; margin-top: 0.2rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label {
      display: block; font-weight: 800; font-size: 0.78rem;
      color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 0.4rem;
    }
    .form-group input {
      width: 100%; padding: 0.85rem 1rem; border: 2px solid var(--border);
      border-radius: 12px; font-family: 'Nunito', sans-serif; font-size: 1rem;
      outline: none; transition: border-color 0.2s; background: var(--cream);
    }
    .form-group input:focus { border-color: var(--green); background: var(--white); }
    .btn-login {
      width: 100%; padding: 1rem; background: var(--green); color: white;
      border: none; border-radius: 12px; font-family: 'Nunito', sans-serif;
      font-size: 1.1rem; font-weight: 800; cursor: pointer;
      transition: background 0.2s, transform 0.1s; margin-top: 0.5rem;
    }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:hover { background: var(--green-mid); }
    .error-msg {
      background: #FEE2E2; color: #DC2626; padding: 0.75rem 1rem;
      border-radius: 10px; font-size: 0.88rem; margin-top: 1rem; display: none;
    }

    /* ── STORE HEADER ── */
    .store-header {
      background: var(--green); padding: 0.85rem 1.25rem;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .store-header-info h1 { color: white; font-size: 1.15rem; font-weight: 900; }
    .store-header-info p { color: rgba(255,255,255,0.65); font-size: 0.78rem; }
    .cart-fab {
      display: flex; align-items: center; gap: 0.5rem;
      background: var(--gold); border: none; border-radius: 50px;
      padding: 0.6rem 1.1rem; cursor: pointer; font-family: 'Nunito', sans-serif;
      font-weight: 800; font-size: 0.95rem; color: white;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 12px rgba(233,163,25,0.45);
    }
    .cart-fab:active { transform: scale(0.93); }
    .cart-badge {
      background: white; color: var(--green); border-radius: 50%;
      width: 22px; height: 22px; display: flex; align-items: center;
      justify-content: center; font-size: 0.75rem; font-weight: 900;
    }

    /* ── SEARCH + TABS ── */
    .search-tabs-wrap { background: var(--white); border-bottom: 1px solid var(--border); }
    .search-row { padding: 0.6rem 1rem; }
    .search-input-wrap { position: relative; }
    .search-input-wrap svg { position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); pointer-events: none; }
    .search-input {
      width: 100%; padding: 0.7rem 1rem 0.7rem 2.6rem;
      border: 2px solid var(--border); border-radius: 50px;
      font-family: 'Nunito', sans-serif; font-size: 0.95rem; outline: none;
      background: var(--cream); transition: border-color 0.2s;
    }
    .search-input:focus { border-color: var(--green); }
    .cat-tabs {
      display: flex; gap: 0.4rem; padding: 0 1rem 0.6rem;
      overflow-x: auto; scrollbar-width: none;
    }
    .cat-tabs::-webkit-scrollbar { display: none; }
    .cat-tab {
      flex-shrink: 0; padding: 0.35rem 0.9rem; border-radius: 50px;
      border: 2px solid var(--border); background: var(--white);
      font-family: 'Nunito', sans-serif; font-size: 0.82rem; font-weight: 700;
      cursor: pointer; transition: all 0.15s; white-space: nowrap; color: var(--text);
    }
    .cat-tab.active { background: var(--green); border-color: var(--green); color: white; }

    /* ── ITEM GRID ── */
    .items-scroll { flex: 1; padding: 0.75rem 0.85rem 5rem; overflow-y: auto; }
    .group-label {
      font-size: 0.75rem; font-weight: 900; text-transform: uppercase;
      letter-spacing: 0.09em; color: var(--muted); padding: 0.75rem 0.1rem 0.4rem;
    }
    .items-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 0.65rem; margin-bottom: 0.25rem;
    }
    .item-card {
      background: var(--white); border-radius: 14px; padding: 0.9rem 0.85rem;
      cursor: pointer; box-shadow: var(--shadow); position: relative;
      border: 2.5px solid transparent;
      border-top: 5px solid var(--item-color, #ccc);
      transition: transform 0.13s, box-shadow 0.13s;
      user-select: none;
    }
    .item-card:active { transform: scale(0.94); }
    .item-card.in-cart { border-color: var(--item-color, #ccc); border-top-width: 5px; }
    .item-icon { font-size: 1.6rem; display: block; margin-bottom: 0.4rem; }
    .item-name { font-size: 0.83rem; font-weight: 700; line-height: 1.3; color: var(--text); }
    .item-badge {
      position: absolute; top: -9px; right: -9px; background: var(--green);
      color: white; border-radius: 50%; width: 22px; height: 22px;
      display: none; align-items: center; justify-content: center;
      font-size: 0.7rem; font-weight: 900; border: 2px solid var(--cream);
    }
    .item-card.in-cart .item-badge { display: flex; }
    .return-badge {
      position: absolute; bottom: 6px; right: 8px;
      font-size: 0.65rem; font-weight: 800; color: #92400E;
      background: #FEF3C7; border-radius: 4px; padding: 1px 5px;
    }
    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); }
    .empty-state .empty-icon { font-size: 3rem; margin-bottom: 0.5rem; }

    /* ── BOTTOM SHEET MODAL ── */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 300; display: none; align-items: flex-end;
    }
    .overlay.open { display: flex; }
    .sheet {
      background: var(--white); border-radius: 24px 24px 0 0;
      padding: 0 1.5rem 2rem; width: 100%; max-height: 88vh;
      overflow-y: auto; transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .overlay.open .sheet { transform: translateY(0); }
    .sheet-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 1rem auto 1.25rem; }
    .sheet-icon { font-size: 2.75rem; text-align: center; margin-bottom: 0.35rem; }
    .sheet-name { font-size: 1.25rem; font-weight: 900; text-align: center; line-height: 1.25; }
    .sheet-sku { font-size: 0.78rem; color: var(--muted); text-align: center; margin: 0.2rem 0 1.25rem; }
    .sheet-question { font-size: 0.78rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); text-align: center; margin-bottom: 0.65rem; }
    .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem; margin-bottom: 1.5rem; }
    .action-btn {
      padding: 0.9rem 0.75rem; border-radius: 14px; border: 2.5px solid transparent;
      font-family: 'Nunito', sans-serif; font-size: 0.9rem; font-weight: 800;
      cursor: pointer; text-align: center; line-height: 1.3; transition: all 0.15s;
    }
    .btn-open { background: #ECFDF5; border-color: #10B981; color: #065F46; }
    .btn-open.selected { background: #10B981; color: white; border-color: #10B981; }
    .btn-return { background: #FFFBEB; border-color: #F59E0B; color: #92400E; }
    .btn-return.selected { background: #F59E0B; color: white; border-color: #F59E0B; }

    .qty-label { font-size: 0.78rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); text-align: center; margin-bottom: 0.75rem; }
    .qty-row { display: flex; align-items: center; justify-content: center; gap: 1.25rem; margin-bottom: 1.5rem; }
    .qty-btn {
      width: 50px; height: 50px; border-radius: 50%; border: 2.5px solid var(--border);
      background: var(--white); font-size: 1.6rem; font-weight: 800; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.13s; color: var(--text);
    }
    .qty-btn:active { transform: scale(0.88); border-color: var(--green); }
    .qty-num { font-size: 2.25rem; font-weight: 900; min-width: 64px; text-align: center; }

    .add-btn {
      width: 100%; padding: 1.1rem; background: var(--green); color: white;
      border: none; border-radius: 14px; font-family: 'Nunito', sans-serif;
      font-size: 1.05rem; font-weight: 800; cursor: pointer; transition: all 0.13s;
      margin-bottom: 0.5rem;
    }
    .add-btn:active { transform: scale(0.98); }
    .add-btn:disabled { background: #D1D5DB; cursor: not-allowed; color: #9CA3AF; }
    .remove-btn {
      width: 100%; padding: 0.7rem; background: none; border: none;
      font-family: 'Nunito', sans-serif; font-size: 0.88rem; font-weight: 700;
      color: #DC2626; cursor: pointer;
    }

    /* ── CART SCREEN ── */
    #cart-screen { background: var(--cream); }
    .cart-header {
      background: var(--green); padding: 0.85rem 1.25rem;
      display: flex; align-items: center; gap: 0.85rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .back-btn {
      background: rgba(255,255,255,0.18); border: none; border-radius: 10px;
      padding: 0.45rem 0.7rem; cursor: pointer; color: white;
      font-size: 1.2rem; line-height: 1; font-weight: 800;
      transition: background 0.15s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.28); }
    .cart-header h2 { color: white; font-size: 1.2rem; font-weight: 900; }
    .cart-body { flex: 1; overflow-y: auto; padding: 0.75rem 0.9rem 1.5rem; }
    .section-label {
      font-size: 0.75rem; font-weight: 900; text-transform: uppercase;
      letter-spacing: 0.09em; color: var(--muted); padding: 0.75rem 0.1rem 0.4rem;
    }
    .cart-row {
      background: var(--white); border-radius: 14px; padding: 0.9rem 1rem;
      display: flex; align-items: center; gap: 0.85rem; margin-bottom: 0.5rem;
      box-shadow: var(--shadow);
    }
    .cart-row-icon { font-size: 1.5rem; flex-shrink: 0; }
    .cart-row-info { flex: 1; }
    .cart-row-name { font-weight: 700; font-size: 0.9rem; line-height: 1.25; }
    .cart-row-type { font-size: 0.78rem; font-weight: 700; margin-top: 0.1rem; }
    .type-open { color: #059669; }
    .type-return { color: #D97706; }
    .cart-row-qty { font-size: 1.2rem; font-weight: 900; flex-shrink: 0; }
    .cart-row-del { background: none; border: none; cursor: pointer; color: #9CA3AF; font-size: 1rem; padding: 0.2rem 0.35rem; transition: color 0.15s; }
    .cart-row-del:hover { color: #DC2626; }

    .staff-box {
      background: var(--white); border-radius: var(--radius);
      padding: 1.2rem; margin: 0.75rem 0; box-shadow: var(--shadow);
    }
    .staff-box h3 { font-size: 0.78rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 0.65rem; }
    .staff-select, .staff-input {
      width: 100%; padding: 0.85rem 1rem; border: 2.5px solid var(--border);
      border-radius: 12px; font-family: 'Nunito', sans-serif;
      font-size: 1rem; font-weight: 700; color: var(--text);
      background: var(--cream); outline: none; cursor: pointer;
      appearance: none; transition: border-color 0.2s;
    }
    .staff-select:focus, .staff-input:focus { border-color: var(--green); }

    .submit-btn {
      width: 100%; padding: 1.2rem; background: var(--gold); color: white;
      border: none; border-radius: var(--radius); font-family: 'Nunito', sans-serif;
      font-size: 1.15rem; font-weight: 900; cursor: pointer;
      box-shadow: 0 4px 16px rgba(233,163,25,0.45); transition: all 0.15s;
    }
    .submit-btn:active { transform: scale(0.98); }
    .submit-btn:disabled { background: #D1D5DB; box-shadow: none; cursor: not-allowed; color: #9CA3AF; }

    /* ── SUCCESS ── */
    #success-screen {
      background: var(--green); align-items: center; justify-content: center;
      padding: 2rem; text-align: center;
    }
    .success-icon { font-size: 5rem; margin-bottom: 1rem; animation: pop 0.4s ease; }
    @keyframes pop { 0%,100%{transform:scale(1)} 50%{transform:scale(1.2)} }
    .success-title { font-size: 2rem; font-weight: 900; color: white; margin-bottom: 0.3rem; }
    .success-by { color: rgba(255,255,255,0.7); font-size: 0.95rem; margin-bottom: 1.5rem; }
    .success-list {
      background: rgba(255,255,255,0.14); border-radius: var(--radius);
      padding: 1rem 1.25rem; width: 100%; max-width: 420px;
      text-align: left; margin-bottom: 2rem;
    }
    .success-row {
      color: white; font-size: 0.88rem; font-weight: 600;
      padding: 0.3rem 0; border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .success-row:last-child { border-bottom: none; }
    .done-btn {
      background: var(--gold); color: white; border: none; border-radius: 16px;
      padding: 1rem 2.5rem; font-family: 'Nunito', sans-serif;
      font-size: 1.1rem; font-weight: 800; cursor: pointer;
      box-shadow: 0 4px 14px rgba(233,163,25,0.45); transition: transform 0.13s;
    }
    .done-btn:active { transform: scale(0.96); }
    .loading-msg { text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: 0.95rem; }
  </style>
</head>
<body>

<!-- ═══════ LOGIN ═══════ -->
<div id="login-screen" class="screen active">
  <div class="login-box">
    <div class="login-logo">
      <span class="logo-emoji">🎨</span>
      <h1>Supply Store</h1>
      <p>4Cats Studio Inventory</p>
    </div>
    <div class="form-group">
      <label>Studio Email</label>
      <input type="email" id="login-email" placeholder="studio@4cats.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-login" onclick="login()">Sign In →</button>
    <div id="login-error" class="error-msg"></div>
  </div>
</div>

<!-- ═══════ STORE ═══════ -->
<div id="store-screen" class="screen">
  <div class="store-header">
    <div class="store-header-info">
      <h1>🎨 Supply Store</h1>
      <p id="studio-label">Loading...</p>
    </div>
    <button class="cart-fab" onclick="goToCart()">
      🛒 Cart <span class="cart-badge" id="cart-count">0</span>
    </button>
  </div>
  <div class="search-tabs-wrap">
    <div class="search-row">
      <div class="search-input-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="search" class="search-input" id="search-input" placeholder="Search supplies…" oninput="onSearch(this.value)">
      </div>
    </div>
    <div class="cat-tabs" id="cat-tabs">
      <button class="cat-tab active" onclick="setGroup('all',this)">All Items</button>
    </div>
  </div>
  <div class="items-scroll" id="items-scroll">
    <div class="loading-msg">Loading supplies…</div>
  </div>
</div>

<!-- ═══════ ITEM MODAL ═══════ -->
<div class="overlay" id="modal" onclick="maybeCloseModal(event)">
  <div class="sheet" id="modal-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-icon" id="m-icon"></div>
    <div class="sheet-name" id="m-name"></div>
    <div class="sheet-sku" id="m-sku"></div>
    <div class="sheet-question">What are you doing with this?</div>
    <div class="action-row">
      <button class="action-btn btn-open"   id="btn-open"   onclick="pickAction('open')">✅ Opening<br><small>Taking from stock</small></button>
      <button class="action-btn btn-return" id="btn-return" onclick="pickAction('return')">↩ Returning<br><small>Putting it back</small></button>
    </div>
    <div class="qty-label">Quantity</div>
    <div class="qty-row">
      <button class="qty-btn" onclick="adjQty(-1)">−</button>
      <div class="qty-num" id="m-qty">1</div>
      <button class="qty-btn" onclick="adjQty(1)">+</button>
    </div>
    <button class="add-btn" id="add-btn" onclick="addToCart()" disabled>Add to Cart</button>
    <button class="remove-btn" id="remove-btn" onclick="removeFromCart()" style="display:none">✕ Remove from cart</button>
  </div>
</div>

<!-- ═══════ CART ═══════ -->
<div id="cart-screen" class="screen">
  <div class="cart-header">
    <button class="back-btn" onclick="showScreen('store-screen')">←</button>
    <h2>Your Cart</h2>
  </div>
  <div class="cart-body">
    <div id="cart-rows"></div>
    <div class="staff-box">
      <h3>Sign off your name</h3>
      <select class="staff-select" id="staff-select">
        <option value="">— Who are you? —</option>
      </select>
      <input class="staff-input" id="staff-input" placeholder="Type your name" style="display:none">
    </div>
    <button class="submit-btn" id="submit-btn" onclick="submitOrder()">Submit →</button>
  </div>
</div>

<!-- ═══════ SUCCESS ═══════ -->
<div id="success-screen" class="screen">
  <div class="success-icon">🎉</div>
  <div class="success-title">All logged!</div>
  <div class="success-by" id="success-by"></div>
  <div class="success-list" id="success-list"></div>
  <button class="done-btn" onclick="resetStore()">Back to Store</button>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────
// Copy SUPABASE_ANON_KEY from admin.html or index.html
const SUPABASE_URL      = 'https://snxibhbhhchjthfmjtaj.supabase.co';
const SUPABASE_ANON_KEY = 'PASTE_YOUR_ANON_KEY_HERE';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ── STATE ────────────────────────────────────────────────
let currentUser  = null;
let studioId     = null;
let studioName   = '';
let allItems     = [];  // { ...db row, meta: { color, bg, icon, group } }
let staffList    = [];
let cart         = {}; // { sku: { item, qty, type:'open'|'return', meta } }
let activeGroup  = 'all';
let searchQuery  = '';
let modalItem    = null;
let modalAction  = null;
let modalQty     = 1;

// ── STUDIO NAME MAP ──────────────────────────────────────
const STUDIO_NAMES = {
  'BC-RICH-GC':'Richmond – Garden City','BC-RICH-STV':'Richmond – Steveston',
  'BC-SUR-SSR':'Surrey – South','BC-YVR-KIT':'Vancouver – Kitsilano',
  'BC-YVR-MS':'Vancouver – Main Street','BC-YVR-UBC':'Vancouver – UBC',
  'BC-YYJ-CSV':'Victoria – Cook Street','BC-YYJ-ESQ':'Victoria – Esquimalt',
  'BC-YYJ-OB':'Victoria – Oak Bay','BC-YYJ-VIC':'Victoria – Uptown',
  'AB-YYC-ING':'Calgary – Inglewood','AB-STA-STA':'St Albert',
  'ON-BRL-BRL':'Burlington – South','ON-CMB-GLT':'Cambridge – Galt',
  'ON-ERN-ERN':'Erin','ON-HAM-OS':'Hamilton – Ottawa St',
  'ON-HAM-WD':'Hamilton – Waterdown','ON-HAM-WH':'Hamilton – West Harbour',
  'ON-KGN-AP':'Kingston – Arlington Park','ON-LDN-BYR':'London – Byron',
  'ON-LDN-WVG':'London – Wortley Village','ON-MIS-PC':'Mississauga – Port Credit',
  'ON-OAK-OAK':'Oakville – North','ON-OAK-WST':'Oakville – West',
  'ON-YOW-GLB':'Ottawa – The Glebe','ON-STC-STC':'St Catharines',
  'ON-YYZ-AVE':'Toronto – Avenue Road','ON-YYZ-BP':'Toronto – Baby Point',
  'ON-YYZ-LEA':'Toronto – Leaside','ON-YYZ-BEA':'Toronto – The Beaches',
  'ON-WTR-WTR':'Waterloo – Uptown'
};

// ── ITEM VISUAL METADATA ─────────────────────────────────
function getItemMeta(item) {
  const n = item.name.toLowerCase();
  if (/acrylic|tempera|underglaze|glaze|watercolour|liquid water|paint(?! marker)|gloss|varnish/.test(n))
    return { color:'#E76F51', bg:'#FEF0EC', icon:'🎨', group:'Paints & Glazes' };
  if (/\bclay\b|ditto/.test(n))
    return { color:'#8B5E3C', bg:'#F5EDE5', icon:'🏺', group:'Clay & Ditto' };
  if (/canvas|palette paper|watercolour paper|origami|sketchbook|card stock|paper ream|colou?red paper|tissue paper/.test(n))
    return { color:'#457B9D', bg:'#EAF2F8', icon:'📄', group:'Paper & Canvas' };
  if (/pencil|sharpie|paint marker|charcoal|pastel|chalk|eraser|\bpen\b|wire/.test(n))
    return { color:'#6A4C93', bg:'#F3EEF9', icon:'✏️', group:'Drawing Tools' };
  if (/soap|bleach|sponge|toilet|garbage|vinegar|cleaner|paper towel|mop/.test(n))
    return { color:'#2D6A4F', bg:'#E8F5EE', icon:'🧹', group:'Cleaning' };
  if (/camp badge/.test(n))
    return { color:'#F4A261', bg:'#FEF4EB', icon:'⭐', group:'Camp Badges' };
  if (/glue|mod podge|tape|silicone/.test(n))
    return { color:'#E9C46A', bg:'#FEFAE5', icon:'🫧', group:'Adhesives' };
  if (/wood panel|gold leaf|silver leaf|glass|magnet|tea light|aluminum|band-aid|cotton|salt|salt|scrub|foil|push pin|tattoo|sketchbook|bag|label sticker/.test(n))
    return { color:'#B5838D', bg:'#F8EEF1', icon:'🎭', group:'Craft & Studio' };
  if (/toner|printer|light bulb/.test(n))
    return { color:'#6366F1', bg:'#EEEEFF', icon:'🏢', group:'Office & Facilities' };
  return { color:'#6B7280', bg:'#F3F4F6', icon:'📦', group:'Other' };
}

// ── SCREEN SWITCHER ──────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

// ── LOGIN ────────────────────────────────────────────────
async function login() {
  const email    = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl    = document.getElementById('login-error');
  errEl.style.display = 'none';

  const { data, error } = await db.auth.signInWithPassword({ email, password });
  if (error) { errEl.textContent = error.message; errEl.style.display = 'block'; return; }

  currentUser = data.user;
  const { data: u } = await db.from('studio_users').select('studio_id, role').eq('id', currentUser.id).single();

  if (!u || !['studio','admin'].includes(u.role)) {
    errEl.textContent = 'You do not have access to the Supply Store.';
    errEl.style.display = 'block';
    await db.auth.signOut();
    return;
  }
  if (!u.studio_id) {
    errEl.textContent = 'Admin accounts use inventory-admin.html. Please log in with a studio account.';
    errEl.style.display = 'block';
    await db.auth.signOut();
    return;
  }

  studioId   = u.studio_id;
  studioName = STUDIO_NAMES[studioId] || studioId;
  document.getElementById('studio-label').textContent = studioName;

  await Promise.all([loadItems(), loadStaff()]);
  showScreen('store-screen');
}

document.getElementById('login-password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

// ── ITEMS ────────────────────────────────────────────────
async function loadItems() {
  const { data } = await db.from('inventory_items').select('*').eq('active', true).order('name');
  allItems = (data || []).map(item => ({ ...item, meta: getItemMeta(item) }));
  buildTabs();
  renderItems();
}

function buildTabs() {
  const groups = ['All Items', ...new Set(allItems.map(i => i.meta.group))];
  const tabs   = document.getElementById('cat-tabs');
  tabs.innerHTML = '';
  groups.forEach((g, i) => {
    const b = document.createElement('button');
    b.className = 'cat-tab' + (i === 0 ? ' active' : '');
    b.textContent = g;
    b.onclick = () => setGroup(g === 'All Items' ? 'all' : g, b);
    tabs.appendChild(b);
  });
}

function setGroup(g, btn) {
  activeGroup = g;
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderItems();
}

function onSearch(val) { searchQuery = val.toLowerCase(); renderItems(); }

function renderItems() {
  const scroll = document.getElementById('items-scroll');

  const visible = allItems.filter(item => {
    const matchSearch = !searchQuery || item.name.toLowerCase().includes(searchQuery) || item.sku.toLowerCase().includes(searchQuery);
    const matchGroup  = activeGroup === 'all' || item.meta.group === activeGroup;
    return matchSearch && matchGroup;
  });

  if (!visible.length) {
    scroll.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><p>No items found</p></div>';
    return;
  }

  // Group items
  const grouped = {};
  visible.forEach(item => {
    if (!grouped[item.meta.group]) grouped[item.meta.group] = [];
    grouped[item.meta.group].push(item);
  });

  let html = '';
  for (const [group, items] of Object.entries(grouped)) {
    if (activeGroup === 'all') html += `<div class="group-label">${group}</div>`;
    html += '<div class="items-grid">';
    items.forEach(item => {
      const entry   = cart[item.sku];
      const inCart  = !!entry;
      const qty     = entry ? Math.abs(entry.qty) : 0;
      const isReturn = entry && entry.type === 'return';
      html += `
        <div class="item-card ${inCart ? 'in-cart' : ''}"
             style="--item-color:${item.meta.color}; background:${inCart ? item.meta.bg : '#fff'}"
             onclick="openModal('${item.sku}')">
          <span class="item-icon">${item.meta.icon}</span>
          <div class="item-name">${item.name}</div>
          <div class="item-badge">${qty}</div>
          ${isReturn ? '<div class="return-badge">returning</div>' : ''}
        </div>`;
    });
    html += '</div>';
  }
  scroll.innerHTML = html;
}

// ── STAFF ────────────────────────────────────────────────
async function loadStaff() {
  const { data } = await db
    .from('staff_profiles')
    .select('display_name')
    .contains('studio_ids', [studioId])
    .eq('is_active', true)
    .order('display_name');
  staffList = (data || []).map(r => r.display_name);

  const sel = document.getElementById('staff-select');
  const inp = document.getElementById('staff-input');
  if (staffList.length === 0) {
    sel.style.display = 'none';
    inp.style.display = 'block';
  } else {
    sel.innerHTML = '<option value="">— Who are you? —</option>';
    staffList.forEach(n => { const o = document.createElement('option'); o.value = o.textContent = n; sel.appendChild(o); });
  }
}

// ── MODAL ────────────────────────────────────────────────
function openModal(sku) {
  modalItem   = allItems.find(i => i.sku === sku);
  if (!modalItem) return;
  modalAction = null;
  modalQty    = 1;

  document.getElementById('m-icon').textContent = modalItem.meta.icon;
  document.getElementById('m-name').textContent = modalItem.name;
  document.getElementById('m-sku').textContent  = modalItem.sku;
  document.getElementById('m-qty').textContent  = '1';
  document.getElementById('btn-open').classList.remove('selected');
  document.getElementById('btn-return').classList.remove('selected');
  document.getElementById('add-btn').disabled = true;
  document.getElementById('add-btn').textContent = 'Add to Cart';

  const existing = cart[sku];
  if (existing) {
    pickAction(existing.type, false);
    modalQty = Math.abs(existing.qty);
    document.getElementById('m-qty').textContent = modalQty;
    document.getElementById('remove-btn').style.display = 'block';
  } else {
    document.getElementById('remove-btn').style.display = 'none';
  }

  document.getElementById('modal').classList.add('open');
}

function maybeCloseModal(e) {
  if (e.target === document.getElementById('modal')) closeModal();
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }

function pickAction(action, updateBtn = true) {
  modalAction = action;
  document.getElementById('btn-open').classList.toggle('selected', action === 'open');
  document.getElementById('btn-return').classList.toggle('selected', action === 'return');
  if (updateBtn) {
    const btn = document.getElementById('add-btn');
    btn.disabled = false;
    btn.textContent = action === 'open' ? '✅ Add to Cart — Opening' : '↩ Add to Cart — Returning';
  }
}

function adjQty(delta) {
  modalQty = Math.max(1, modalQty + delta);
  document.getElementById('m-qty').textContent = modalQty;
}

function addToCart() {
  if (!modalItem || !modalAction) return;
  cart[modalItem.sku] = {
    item: modalItem,
    qty:  modalAction === 'open' ? modalQty : -modalQty,
    type: modalAction,
    meta: modalItem.meta
  };
  closeModal();
  updateCartBadge();
  renderItems();
}

function removeFromCart() {
  if (!modalItem) return;
  delete cart[modalItem.sku];
  closeModal();
  updateCartBadge();
  renderItems();
}

function updateCartBadge() {
  document.getElementById('cart-count').textContent = Object.keys(cart).length;
}

// ── CART SCREEN ──────────────────────────────────────────
function goToCart() {
  if (!Object.keys(cart).length) { alert('Your cart is empty — add some items first!'); return; }
  renderCart();
  showScreen('cart-screen');
}

function renderCart() {
  const container = document.getElementById('cart-rows');
  const items     = Object.values(cart);
  const opens     = items.filter(c => c.type === 'open');
  const returns   = items.filter(c => c.type === 'return');

  let html = '';

  if (opens.length) {
    html += `<div class="section-label">✅ Opening — ${opens.length} item${opens.length > 1 ? 's' : ''}</div>`;
    opens.forEach(c => {
      html += `
        <div class="cart-row">
          <span class="cart-row-icon">${c.meta.icon}</span>
          <div class="cart-row-info">
            <div class="cart-row-name">${c.item.name}</div>
            <div class="cart-row-type type-open">Opening new unit from stock</div>
          </div>
          <div class="cart-row-qty">×${c.qty}</div>
          <button class="cart-row-del" onclick="delCartRow('${c.item.sku}')">✕</button>
        </div>`;
    });
  }

  if (returns.length) {
    html += `<div class="section-label">↩ Returning — ${returns.length} item${returns.length > 1 ? 's' : ''}</div>`;
    returns.forEach(c => {
      html += `
        <div class="cart-row">
          <span class="cart-row-icon">${c.meta.icon}</span>
          <div class="cart-row-info">
            <div class="cart-row-name">${c.item.name}</div>
            <div class="cart-row-type type-return">Putting back to stock</div>
          </div>
          <div class="cart-row-qty">×${Math.abs(c.qty)}</div>
          <button class="cart-row-del" onclick="delCartRow('${c.item.sku}')">✕</button>
        </div>`;
    });
  }

  container.innerHTML = html;
}

function delCartRow(sku) {
  delete cart[sku];
  updateCartBadge();
  if (!Object.keys(cart).length) { showScreen('store-screen'); renderItems(); return; }
  renderCart();
}

// ── SUBMIT ───────────────────────────────────────────────
async function submitOrder() {
  const useDropdown = staffList.length > 0;
  const staffName   = useDropdown
    ? document.getElementById('staff-select').value.trim()
    : document.getElementById('staff-input').value.trim();

  if (!staffName) { alert('Please select your name before submitting.'); return; }

  const items = Object.values(cart);
  if (!items.length) { alert('Cart is empty.'); return; }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Submitting…';

  try {
    const now = new Date().toISOString();

    // 1. Log consumption entries
    const { error: logErr } = await db.from('consumption_log').insert(
      items.map(c => ({
        studio_id:  studioId,
        sku:        c.item.sku,
        qty_used:   c.qty,          // positive = open/use, negative = return
        logged_by:  staffName,
        logged_at:  now,
        notes:      c.type === 'return' ? 'Returned to stock' : null
      }))
    );
    if (logErr) throw logErr;

    // 2. Update studio_stock for each item
    for (const c of items) {
      // Fetch current qty
      const { data: row } = await db
        .from('studio_stock')
        .select('qty_on_hand')
        .eq('studio_id', studioId)
        .eq('sku', c.item.sku)
        .single();

      const current = row?.qty_on_hand ?? 0;
      // open = stock goes down (-qty), return = stock goes up (+|qty|)
      const newQty = current - c.qty;

      await db
        .from('studio_stock')
        .update({ qty_on_hand: newQty, last_updated: now })
        .eq('studio_id', studioId)
        .eq('sku', c.item.sku);
    }

    // 3. Build success screen
    document.getElementById('success-by').textContent = `Logged by ${staffName} · ${studioName}`;

    const opens   = items.filter(c => c.type === 'open');
    const returns = items.filter(c => c.type === 'return');
    let listHtml  = '';
    opens.forEach(c   => { listHtml += `<div class="success-row">✅ Opened ×${c.qty} — ${c.item.name}</div>`; });
    returns.forEach(c => { listHtml += `<div class="success-row">↩ Returned ×${Math.abs(c.qty)} — ${c.item.name}</div>`; });
    document.getElementById('success-list').innerHTML = listHtml;

    showScreen('success-screen');

  } catch (err) {
    console.error(err);
    alert('Something went wrong: ' + err.message);
    btn.disabled = false;
    btn.textContent = 'Submit →';
  }
}

// ── RESET ────────────────────────────────────────────────
function resetStore() {
  cart = {};
  updateCartBadge();
  document.getElementById('staff-select').value = '';
  document.getElementById('staff-input').value  = '';
  showScreen('store-screen');
  renderItems();
}

// ── AUTO-LOGIN (existing session) ────────────────────────
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return;

  currentUser = session.user;
  const { data: u } = await db.from('studio_users').select('studio_id, role').eq('id', currentUser.id).single();
  if (!u || !['studio','admin'].includes(u.role) || !u.studio_id) return;

  studioId   = u.studio_id;
  studioName = STUDIO_NAMES[studioId] || studioId;
  document.getElementById('studio-label').textContent = studioName;
  await Promise.all([loadItems(), loadStaff()]);
  showScreen('store-screen');
})();
</script>
