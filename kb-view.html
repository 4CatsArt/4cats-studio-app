<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="https://cdn.shopify.com/s/files/1/1451/3756/files/favicon.png?v=1613591354">
<title>4Cats Knowledge Base</title>
<!--
  kb-view.html — read-only viewer for Knowledge Base docs and slideshows.
  Open as kb-view.html?id=<entry id>   (slideshows also accept #slide-5)
  ES5 ONLY: runs on iOS 12 iPads. No arrow functions, let/const, template
  literals, flex gap, or inset. All rendering is done by the kb-view Edge Function.
-->
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #f5f5f0; color: #1a1a1a; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; -webkit-text-size-adjust: 100%; }
body.slides-mode { background: #1d1d1b; color: #eee; }

.topbar { padding: 14px 20px; display: -webkit-box; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; border-bottom: 0.5px solid #e0e0d8; background: white; }
body.slides-mode .topbar { background: #1d1d1b; border-bottom-color: #333; }
.brand { font-size: 13px; font-weight: 600; color: #888; letter-spacing: 0.3px; }
.topbar-right { margin-left: auto; font-size: 13px; color: #888; }

.wrap { max-width: 820px; margin: 0 auto; padding: 28px 22px 60px; }
.title { font-size: 26px; font-weight: 600; line-height: 1.25; margin-bottom: 10px; }
.meta { font-size: 13px; color: #888; margin-bottom: 26px; }
.meta span { margin-right: 12px; display: inline-block; }
.ok { color: #2e7d32; }
.warn { color: #c0392b; }
body.slides-mode .meta { color: #aaa; margin-bottom: 14px; }
body.slides-mode .ok { color: #81c784; }
body.slides-mode .warn { color: #ef9a9a; }

.msg { text-align: center; padding: 80px 20px; color: #999; font-size: 15px; line-height: 1.6; }

/* Rendered doc */
.md { font-size: 16px; line-height: 1.65; color: #222; }
.md h1 { font-size: 23px; font-weight: 600; margin: 1.5em 0 0.5em; }
.md h2 { font-size: 19px; font-weight: 600; margin: 1.4em 0 0.45em; padding-top: 0.2em; }
.md h3 { font-size: 17px; font-weight: 600; margin: 1.2em 0 0.35em; }
.md h4, .md h5, .md h6 { font-size: 16px; font-weight: 600; margin: 1em 0 0.3em; }
.md > :first-child { margin-top: 0; }
.md p { margin: 0 0 0.9em; }
.md ul, .md ol { margin: 0 0 0.9em 1.5em; }
.md li { margin-bottom: 0.3em; }
.md a { color: #2471a3; }
.md strong { font-weight: 600; }
.md code { background: #ecece6; padding: 1px 5px; border-radius: 4px; font-size: 14px; }
.md pre { background: #ecece6; padding: 12px; border-radius: 8px; overflow-x: auto; margin-bottom: 0.9em; }
.md pre code { background: none; padding: 0; }
.md blockquote { border-left: 3px solid #ccc; padding-left: 14px; color: #555; margin: 0 0 0.9em; }
.md .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 0.9em; }
.md table { border-collapse: collapse; background: white; }
.md th, .md td { border: 0.5px solid #d8d8d0; padding: 8px 12px; text-align: left; font-size: 15px; vertical-align: top; }
.md th { background: #f0f0ea; font-weight: 600; }
.md img { max-width: 100%; height: auto; }
.md hr { border: none; border-top: 0.5px solid #ddd; margin: 1.4em 0; }

/* Slideshow */
.slides-wrap { max-width: 1200px; margin: 0 auto; padding: 18px 16px 30px; }
body.slides-mode .title { font-size: 20px; color: #fff; margin-bottom: 4px; }
.stage { position: relative; background: #000; border-radius: 8px; overflow: hidden; text-align: center; min-height: 200px; -webkit-user-select: none; user-select: none; }
.stage img { display: block; max-width: 100%; max-height: 72vh; height: auto; margin: 0 auto; }
.stage .no-image { padding: 60px 30px; color: #ddd; font-size: 17px; line-height: 1.6; white-space: pre-wrap; text-align: left; min-height: 300px; }
.stage .loading { position: absolute; top: 50%; left: 0; right: 0; margin-top: -10px; color: #777; font-size: 14px; }
.tap-zone { position: absolute; top: 0; bottom: 0; width: 30%; cursor: pointer; }
.tap-left { left: 0; }
.tap-right { right: 0; }

.controls { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; margin-top: 14px; }
.ctrl-btn { background: #333; color: #fff; border: none; border-radius: 10px; font-size: 18px; padding: 14px 28px; cursor: pointer; margin: 0 8px; -webkit-appearance: none; }
.ctrl-btn:disabled { opacity: 0.3; cursor: default; }
.counter { font-size: 15px; color: #bbb; min-width: 90px; text-align: center; margin: 0 8px; }
.sub-controls { text-align: center; margin-top: 12px; }
.link-btn { background: none; border: none; color: #9ab; font-size: 14px; cursor: pointer; padding: 6px 10px; margin: 0 4px; -webkit-appearance: none; }
.stage:-webkit-full-screen { border-radius: 0; width: 100%; height: 100%; }
.stage:-webkit-full-screen img { max-height: 100vh; }
.stage:fullscreen { border-radius: 0; width: 100%; height: 100%; }
.stage:fullscreen img { max-height: 100vh; }
.slide-text { margin: 14px auto 0; max-width: 900px; background: #2a2a28; border-radius: 8px; padding: 14px 18px; font-size: 15px; line-height: 1.6; color: #ddd; white-space: pre-wrap; display: none; }

.thumbs { margin-top: 16px; white-space: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 6px; }
.thumb { display: inline-block; width: 120px; margin-right: 8px; border: 2px solid transparent; border-radius: 5px; overflow: hidden; cursor: pointer; vertical-align: top; background: #000; opacity: 0.6; }
.thumb.active { border-color: #fff; opacity: 1; }
.thumb img { display: block; width: 100%; height: auto; }
.thumb .thumb-n { font-size: 11px; color: #aaa; padding: 2px 0; text-align: center; background: #222; }

@media (max-width: 600px) {
  .ctrl-btn { padding: 12px 18px; }
  .thumb { width: 90px; }
  .title { font-size: 22px; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">4CATS KNOWLEDGE BASE</div>
  <div class="topbar-right" id="topbar-right"></div>
</div>

<div id="root"><div class="msg">Loading…</div></div>

<script>
var SUPABASE_URL = 'https://snxibhbhhchjthfmjtaj.supabase.co';
var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNueGliaGJoaGNoanRoZm1qdGFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTk2ODAsImV4cCI6MjA5MjYzNTY4MH0.K-89Mx4SxU6N1hMmtK6Q79rWAtk6VTN9b5wemQxcZVA';

var entryId = getParam('id');
var entry = null;
var current = 0;
var showText = false;
var reloadedOnce = false;
var touchStartX = null;
var touchStartY = null;

function getParam(name) {
  var q = window.location.search.replace(/^\?/, '').split('&');
  for (var i = 0; i < q.length; i++) {
    var kv = q[i].split('=');
    if (decodeURIComponent(kv[0]) === name) return decodeURIComponent((kv[1] || '').replace(/\+/g, ' '));
  }
  return '';
}

function escHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function fmtDate(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  var m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return m[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
}

function showMessage(text) {
  document.body.className = '';
  document.getElementById('root').innerHTML = '<div class="msg">' + escHtml(text) + '</div>';
}

function metaHtml(e) {
  var h = '<span>Updated ' + fmtDate(e.updated_at) + '</span>';
  if (e.verify_state === 'verified') h += '<span class="ok">&#10003; Reviewed ' + fmtDate(e.verified_at) + '</span>';
  else if (e.verify_state === 'stale') h += '<span class="warn">&#9888; Due for review — check with home office if anything looks out of date</span>';
  return h;
}

// ── LOAD ──────────────────────────────────────────────────────

function load(keepSlide) {
  if (!entryId) { showMessage('This link is missing the page ID.'); return; }
  fetch(SUPABASE_URL + '/functions/v1/kb-view?id=' + encodeURIComponent(entryId), {
    headers: { 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + SUPABASE_ANON }
  })
  .then(function(res) {
    return res.json().then(function(body) { return { ok: res.ok, body: body }; });
  })
  .then(function(r) {
    if (!r.ok || !r.body || r.body.error) {
      showMessage((r.body && r.body.error) || 'Could not load this page.');
      return;
    }
    entry = r.body;
    document.title = entry.title + ' — 4Cats';
    if (entry.kind === 'slides') {
      if (!keepSlide) current = slideFromHash();
      renderSlides();
    } else {
      renderDoc();
    }
  })
  .catch(function() {
    showMessage('Connection problem. Check the Wi-Fi and reload the page.');
  });
}

// ── DOC ───────────────────────────────────────────────────────

function renderDoc() {
  document.body.className = '';
  document.getElementById('root').innerHTML =
    '<div class="wrap">'
    + '<div class="title">' + escHtml(entry.title) + '</div>'
    + '<div class="meta">' + metaHtml(entry) + '</div>'
    + '<div class="md" id="doc-body">' + entry.html + '</div>'
    + '</div>';
  // Wide tables scroll sideways instead of breaking the page
  var tables = document.querySelectorAll('#doc-body table');
  for (var i = 0; i < tables.length; i++) {
    var t = tables[i];
    var w = document.createElement('div');
    w.className = 'table-scroll';
    t.parentNode.insertBefore(w, t);
    w.appendChild(t);
  }
}

// ── SLIDES ────────────────────────────────────────────────────

function slideFromHash() {
  var m = window.location.hash.match(/slide-(\d+)/);
  var n = m ? parseInt(m[1], 10) - 1 : 0;
  if (!entry || !entry.slides || n < 0 || n >= entry.slides.length) return 0;
  return n;
}

function renderSlides() {
  document.body.className = 'slides-mode';
  var slides = entry.slides || [];
  if (!slides.length) { showMessage('This slideshow has no slides yet.'); return; }

  var thumbs = '';
  for (var i = 0; i < slides.length; i++) {
    thumbs += '<div class="thumb" id="thumb-' + i + '" onclick="goTo(' + i + ')">'
      + (slides[i].url ? '<img src="' + escHtml(slides[i].url) + '" alt="">' : '')
      + '<div class="thumb-n">' + (i + 1) + '</div></div>';
  }

  document.getElementById('root').innerHTML =
    '<div class="slides-wrap">'
    + '<div class="title">' + escHtml(entry.title) + '</div>'
    + '<div class="meta">' + metaHtml(entry) + '</div>'
    + '<div class="stage" id="stage">'
    +   '<div class="loading" id="stage-loading">Loading slide…</div>'
    +   '<div id="stage-content"></div>'
    +   '<div class="tap-zone tap-left" onclick="prevSlide()"></div>'
    +   '<div class="tap-zone tap-right" onclick="nextSlide()"></div>'
    + '</div>'
    + '<div class="controls">'
    +   '<button class="ctrl-btn" id="btn-prev" onclick="prevSlide()">&#8592; Back</button>'
    +   '<div class="counter" id="counter"></div>'
    +   '<button class="ctrl-btn" id="btn-next" onclick="nextSlide()">Next &#8594;</button>'
    + '</div>'
    + '<div class="sub-controls">'
    +   '<button class="link-btn" id="btn-text" onclick="toggleText()">Show slide text</button>'
    +   (fullscreenSupported() ? '<button class="link-btn" onclick="goFullscreen()">Full screen</button>' : '')
    + '</div>'
    + '<div class="slide-text" id="slide-text"></div>'
    + '<div class="thumbs" id="thumbs">' + thumbs + '</div>'
    + '</div>';

  var stage = document.getElementById('stage');
  stage.addEventListener('touchstart', function(e) {
    if (e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, false);
  stage.addEventListener('touchend', function(e) {
    if (touchStartX === null) return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    var dy = e.changedTouches[0].clientY - touchStartY;
    touchStartX = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0) nextSlide(); else prevSlide();
    }
  }, false);

  showSlide();
}

function showSlide() {
  var slides = entry.slides;
  var s = slides[current];
  var content = document.getElementById('stage-content');
  var loading = document.getElementById('stage-loading');

  if (s.url) {
    loading.style.display = 'block';
    var img = new Image();
    img.onload = function() {
      loading.style.display = 'none';
      content.innerHTML = '';
      content.appendChild(img);
    };
    img.onerror = function() {
      // Signed links expire after a few hours; fetch fresh ones once
      if (!reloadedOnce) { reloadedOnce = true; load(true); return; }
      loading.style.display = 'none';
      content.innerHTML = '<div class="no-image">' + escHtml(s.text || 'This slide could not be loaded.') + '</div>';
    };
    img.alt = 'Slide ' + (current + 1);
    img.src = s.url;
  } else {
    loading.style.display = 'none';
    content.innerHTML = '<div class="no-image">' + escHtml(s.text || '(No image for this slide)') + '</div>';
  }

  document.getElementById('counter').textContent = (current + 1) + ' / ' + slides.length;
  document.getElementById('btn-prev').disabled = current === 0;
  document.getElementById('btn-next').disabled = current === slides.length - 1;

  var st = document.getElementById('slide-text');
  st.textContent = s.text || '(No text on this slide)';
  st.style.display = showText ? 'block' : 'none';

  for (var i = 0; i < slides.length; i++) {
    var t = document.getElementById('thumb-' + i);
    if (t) t.className = i === current ? 'thumb active' : 'thumb';
  }
  var active = document.getElementById('thumb-' + current);
  var strip = document.getElementById('thumbs');
  if (active && strip) {
    var left = active.offsetLeft - strip.offsetLeft;
    if (left < strip.scrollLeft || left + active.offsetWidth > strip.scrollLeft + strip.clientWidth) {
      strip.scrollLeft = left - 40;
    }
  }

  if (window.history && window.history.replaceState) {
    window.history.replaceState(null, '', '#slide-' + (current + 1));
  }

  // Preload neighbours so Next feels instant
  preload(current + 1);
  preload(current - 1);
}

function preload(i) {
  if (!entry || i < 0 || i >= entry.slides.length || !entry.slides[i].url) return;
  var p = new Image();
  p.src = entry.slides[i].url;
}

function goTo(i) {
  if (!entry || i < 0 || i >= entry.slides.length) return;
  current = i;
  showSlide();
}
function nextSlide() { goTo(current + 1); }
function prevSlide() { goTo(current - 1); }

function toggleText() {
  showText = !showText;
  document.getElementById('btn-text').textContent = showText ? 'Hide slide text' : 'Show slide text';
  document.getElementById('slide-text').style.display = showText ? 'block' : 'none';
}

function fullscreenSupported() {
  var el = document.documentElement;
  return !!(el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen);
}
function goFullscreen() {
  var el = document.getElementById('stage');
  if (el.requestFullscreen) el.requestFullscreen();
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  else if (el.msRequestFullscreen) el.msRequestFullscreen();
}

document.addEventListener('keydown', function(e) {
  if (!entry || entry.kind !== 'slides') return;
  var k = e.keyCode;
  if (k === 39 || k === 34 || k === 32) { e.preventDefault(); nextSlide(); }   // right, page down, space
  else if (k === 37 || k === 33) { e.preventDefault(); prevSlide(); }          // left, page up
  else if (k === 36) { goTo(0); }                                                // home
  else if (k === 35) { goTo(entry.slides.length - 1); }                          // end
}, false);

load(false);
</script>
</body>
</html>
