<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>4CATS Kiln Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f0; min-height: 100vh; }

  /* PIN screen */
  .pin-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
  .pin-logo { font-size: 22px; font-weight: 800; letter-spacing: 1px; color: #1a1a2e; margin-bottom: 6px; }
  .pin-sub { font-size: 14px; color: #888; margin-bottom: 32px; }
  .pin-display { display: flex; gap: 12px; margin-bottom: 24px; }
  .pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #ccc; background: transparent; transition: background 0.15s, border-color 0.15s; }
  .pin-dot.filled { background: #1a1a2e; border-color: #1a1a2e; }
  .pin-keypad { display: grid; grid-template-columns: repeat(3, 72px); gap: 10px; }
  .pin-key { width: 72px; height: 72px; border-radius: 50%; border: 1.5px solid #d0d0c8; background: white; font-size: 22px; font-weight: 600; cursor: pointer; transition: background 0.1s; }
  .pin-key:active { background: #e8e8e0; }
  .pin-key.del { font-size: 16px; color: #888; }
  .pin-error { color: #c0392b; font-size: 13px; margin-top: 12px; height: 18px; }

  /* Main app */
  .app { display: none; }
  .app.visible { display: block; }

  /* Header */
  .header { background: #1a1a2e; color: white; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .header-title { font-size: 16px; font-weight: 700; color: #f0c040; }
  .header-studio { font-size: 12px; color: #aaa; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .lock-btn { padding: 5px 12px; border: 1px solid #444; border-radius: 6px; background: none; color: #aaa; font-size: 12px; cursor: pointer; }
  .lock-btn:hover { border-color: #aaa; color: white; }

  /* Toolbar */
  .toolbar { background: white; border-bottom: 1px solid #e0e0d8; padding: 10px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .toolbar select, .toolbar input { height: 32px; padding: 0 10px; border: 1px solid #d0d0c8; border-radius: 6px; font-size: 12px; outline: none; background: white; }
  .toolbar select:focus, .toolbar input:focus { border-color: #2d6a9f; }
  .sort-btn { height: 32px; padding: 0 12px; border: 1px solid #d0d0c8; border-radius: 6px; font-size: 12px; background: white; cursor: pointer; color: #555; white-space: nowrap; }
  .sort-btn.active { background: #1a1a2e; color: white; border-color: #1a1a2e; }
  .ticket-search { width: 140px; }

  /* Content */
  .content { padding: 16px; max-width: 860px; margin: 0 auto; }

  /* Stage pipeline */
  .pipeline { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
  .pipeline-stage { flex: 1; min-width: 100px; text-align: center; padding: 8px 6px; border-radius: 8px; font-size: 11px; font-weight: 600; cursor: pointer; border: 2px solid transparent; transition: all 0.15s; white-space: nowrap; }
  .pipeline-stage.active { border-color: #1a1a2e; }

  /* Workshop group */
  .workshop-group { margin-bottom: 20px; }
  .workshop-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 2px solid #e0e0d8; }
  .workshop-title { font-size: 15px; font-weight: 700; color: #1a1a2e; }
  .workshop-meta { font-size: 12px; color: #888; }
  .workshop-count { font-size: 12px; color: #888; background: #f0f0e8; border-radius: 12px; padding: 2px 8px; }

  /* Ticket card */
  .ticket-card { background: white; border-radius: 10px; border: 1px solid #e0e0d8; padding: 14px 16px; margin-bottom: 8px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .ticket-num { font-size: 26px; font-weight: 900; color: #7a4f00; letter-spacing: 2px; font-variant-numeric: tabular-nums; min-width: 72px; }
  .ticket-body { flex: 1; min-width: 160px; }
  .ticket-desc { font-size: 13px; color: #333; margin-bottom: 4px; }
  .ticket-contacts { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .contact-pill { font-size: 11px; color: #555; background: #f0f0e8; border-radius: 10px; padding: 2px 8px; }
  .ticket-date { font-size: 11px; color: #aaa; }
  .ticket-actions { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .advance-btn { padding: 7px 14px; background: #1a1a2e; color: white; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .advance-btn:hover { background: #2d3a5e; }
  .advance-btn:disabled { background: #ccc; cursor: not-allowed; }
  .complete-badge { font-size: 12px; color: #2e7d32; font-weight: 600; }
  .stage-chip { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; margin-bottom: 4px; }

  /* Stage colours */
  .stage-submitted    { background: #e0e0d8; color: #555; }
  .stage-bisque_kiln  { background: #fff3e0; color: #e65100; }
  .stage-bisque_done  { background: #e8f5e9; color: #2e7d32; }
  .stage-glaze_kiln   { background: #fff3e0; color: #e65100; }
  .stage-ready_pickup { background: #e3f2fd; color: #1565c0; }

  /* Empty */
  .empty { text-align: center; color: #aaa; font-size: 14px; padding: 60px 20px; }

  /* Toast */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1a1a2e; color: white; padding: 12px 24px; border-radius: 10px; font-size: 14px; z-index: 200; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .toast.show { opacity: 1; }

  /* Confirm overlay */
  .confirm-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; padding: 1rem; }
  .confirm-overlay.show { display: flex; }
  .confirm-card { background: white; border-radius: 14px; padding: 24px; max-width: 360px; width: 100%; text-align: center; }
  .confirm-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
  .confirm-sub { font-size: 14px; color: #666; margin-bottom: 20px; line-height: 1.5; }
  .confirm-ticket { font-size: 32px; font-weight: 900; color: #7a4f00; letter-spacing: 3px; margin: 12px 0; }
  .confirm-new-stage { font-size: 13px; font-weight: 600; margin-bottom: 20px; }
  .confirm-btns { display: flex; gap: 10px; justify-content: center; }
  .confirm-yes { padding: 10px 28px; background: #1a1a2e; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .confirm-no  { padding: 10px 28px; border: 1px solid #d0d0c8; border-radius: 8px; background: none; font-size: 14px; cursor: pointer; }

  /* Email notification banner */
  .email-banner { background: #e8f5e9; border: 1px solid #a5d6a7; border-radius: 10px; padding: 12px 16px; margin-bottom: 12px; font-size: 13px; color: #2e7d32; display: none; }
  .email-banner.show { display: block; }
</style>
</head>
<body>

<!-- ── PIN SCREEN ─────────────────────────────────── -->
<div class="pin-screen" id="pin-screen">
  <div class="pin-logo">🏺 4CATS</div>
  <div class="pin-sub">Kiln Tracker — Enter PIN</div>
  <div class="pin-display">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
  </div>
  <div class="pin-keypad">
    <button class="pin-key" onclick="pinPress('1')">1</button>
    <button class="pin-key" onclick="pinPress('2')">2</button>
    <button class="pin-key" onclick="pinPress('3')">3</button>
    <button class="pin-key" onclick="pinPress('4')">4</button>
    <button class="pin-key" onclick="pinPress('5')">5</button>
    <button class="pin-key" onclick="pinPress('6')">6</button>
    <button class="pin-key" onclick="pinPress('7')">7</button>
    <button class="pin-key" onclick="pinPress('8')">8</button>
    <button class="pin-key" onclick="pinPress('9')">9</button>
    <button class="pin-key" onclick="pinClear()" style="font-size:13px;color:#888">Clear</button>
    <button class="pin-key" onclick="pinPress('0')">0</button>
    <button class="pin-key del" onclick="pinDelete()">⌫</button>
  </div>
  <div class="pin-error" id="pin-error"></div>
</div>

<!-- ── MAIN APP ───────────────────────────────────── -->
<div class="app" id="app">

  <div class="header">
    <div>
      <div class="header-title">🏺 Kiln Tracker</div>
      <div class="header-studio" id="studio-label">Loading...</div>
    </div>
    <div class="header-right">
      <button class="lock-btn" onclick="lockApp()">🔒 Lock</button>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" class="ticket-search" id="search-input" placeholder="🔍 Ticket #" oninput="renderTickets()" maxlength="5">
    <select id="stage-filter" onchange="renderTickets()">
      <option value="">All stages</option>
      <option value="submitted">Submitted</option>
      <option value="bisque_kiln">In Bisque Kiln</option>
      <option value="bisque_done">Bisque Done</option>
      <option value="glaze_kiln">In Glaze Kiln</option>
      <option value="ready_pickup">Ready for Pickup</option>
    </select>
    <button class="sort-btn active" id="sort-new" onclick="setSort('newest')">Newest first</button>
    <button class="sort-btn" id="sort-old" onclick="setSort('oldest')">Oldest first</button>
    <button onclick="loadTickets()" style="height:32px;padding:0 12px;border:1px solid #d0d0c8;border-radius:6px;font-size:12px;background:white;cursor:pointer">↻ Refresh</button>
  </div>

  <div class="content">
    <div class="email-banner" id="email-banner"></div>
    <div id="tickets-container"><div class="empty">Loading...</div></div>
  </div>
</div>

<!-- ── CONFIRM OVERLAY ────────────────────────────── -->
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-card">
    <div class="confirm-title">Advance Stage?</div>
    <div class="confirm-ticket" id="confirm-ticket-num"></div>
    <div class="confirm-sub" id="confirm-sub"></div>
    <div class="confirm-new-stage" id="confirm-new-stage"></div>
    <div class="confirm-btns">
      <button class="confirm-no" onclick="closeConfirm()">Cancel</button>
      <button class="confirm-yes" id="confirm-yes-btn" onclick="confirmAdvance()">Confirm</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── CONFIG ────────────────────────────────────────
const KILN_PIN = '4284'  // ← change this to your preferred PIN

const SUPABASE_URL = 'https://snxibhbhhchjthfmjtaj.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNueGliaGJoaGNoanRoZm1qdGFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTk2ODAsImV4cCI6MjA5MjYzNTY4MH0.K-89Mx4SxU6N1hMmtK6Q79rWAtk6VTN9b5wemQxcZVA'
const { createClient } = supabase
const sb = createClient(SUPABASE_URL, SUPABASE_KEY)

const STUDIO_NAMES = {
  'BC-RICH-GC':'Richmond - Garden City','BC-RICH-STV':'Richmond - Steveston','BC-SUR-SSR':'Surrey - South',
  'BC-YVR-KIT':'Vancouver - Kitsilano','BC-YVR-MS':'Vancouver - Main Street','BC-YVR-UBC':'Vancouver - UBC',
  'BC-YYJ-CSV':'Victoria - Cook Street Village','BC-YYJ-ESQ':'Victoria - Esquimalt','BC-YYJ-OB':'Victoria - Oak Bay',
  'BC-YYJ-VIC':'Victoria - Uptown','AB-YYC-ING':'Calgary - Inglewood','AB-STA-STA':'St Albert',
  'ON-BRL-BRL':'Burlington - South','ON-CMB-GLT':'Cambridge - Galt','ON-ERN-ERN':'Erin',
  'ON-HAM-OS':'Hamilton - Ottawa Street','ON-HAM-WD':'Hamilton - Waterdown','ON-HAM-WH':'Hamilton - West Harbour',
  'ON-KGN-AP':'Kingston - Arlington Park','ON-LDN-BYR':'London - Byron','ON-LDN-WVG':'London - Wortley Village',
  'ON-MIS-PC':'Mississauga - Port Credit','ON-OAK-OAK':'Oakville - North','ON-OAK-WST':'Oakville - West',
  'ON-YOW-GLB':'Ottawa - The Glebe','ON-STC-STC':'St Catharines','ON-YYZ-AVE':'Toronto - Avenue Road',
  'ON-YYZ-BP':'Toronto - Baby Point','ON-YYZ-LEA':'Toronto - Leaside','ON-YYZ-BEA':'Toronto - The Beaches',
  'ON-WTR-WTR':'Waterloo - Uptown'
}

const STAGES = [
  { key: 'submitted',    label: 'Submitted',           next: 'bisque_kiln',  nextLabel: 'Put in Bisque Kiln 🔥' },
  { key: 'bisque_kiln',  label: 'In Bisque Kiln 🔥',   next: 'bisque_done',  nextLabel: 'Mark Bisque Done ✅' },
  { key: 'bisque_done',  label: 'Bisque Done ✅',       next: 'glaze_kiln',   nextLabel: 'Put in Glaze Kiln 🔥', emailTrigger: true },
  { key: 'glaze_kiln',   label: 'In Glaze Kiln 🔥',    next: 'ready_pickup', nextLabel: 'Mark Ready for Pickup 🎉' },
  { key: 'ready_pickup', label: '🎉 Ready for Pickup',  next: null,           emailTrigger: true },
]
function getStage(key) { return STAGES.find(s => s.key === key) || STAGES[0] }

let studioId = null
let allTickets = []
let sortOrder = 'newest'
let pendingAdvance = null  // { ticketId, ticketNumber, newStage }

// ── PIN ───────────────────────────────────────────
let pinEntry = ''

function pinPress(digit) {
  if (pinEntry.length >= 4) return
  pinEntry += digit
  updatePinDots()
  if (pinEntry.length === 4) {
    setTimeout(checkPin, 120)
  }
}

function pinDelete() {
  pinEntry = pinEntry.slice(0, -1)
  updatePinDots()
  document.getElementById('pin-error').textContent = ''
}

function pinClear() {
  pinEntry = ''
  updatePinDots()
  document.getElementById('pin-error').textContent = ''
}

function updatePinDots() {
  for (let i = 0; i < 4; i++) {
    document.getElementById(`d${i}`).classList.toggle('filled', i < pinEntry.length)
  }
}

function checkPin() {
  if (pinEntry === KILN_PIN) {
    document.getElementById('pin-screen').style.display = 'none'
    document.getElementById('app').classList.add('visible')
    initApp()
  } else {
    document.getElementById('pin-error').textContent = 'Incorrect PIN — try again'
    pinEntry = ''
    updatePinDots()
    // Shake dots
    const display = document.querySelector('.pin-display')
    display.style.animation = 'none'
    display.offsetHeight
    display.style.animation = 'shake 0.3s ease'
  }
}

function lockApp() {
  document.getElementById('app').classList.remove('visible')
  document.getElementById('pin-screen').style.display = 'flex'
  pinEntry = ''
  updatePinDots()
  document.getElementById('pin-error').textContent = ''
}

// ── INIT ──────────────────────────────────────────
function initApp() {
  const params = new URLSearchParams(window.location.search)
  studioId = params.get('studio') || null
  const label = studioId ? (STUDIO_NAMES[studioId] || studioId) : 'All Studios'
  document.getElementById('studio-label').textContent = label
  loadTickets()
}

// ── LOAD TICKETS ──────────────────────────────────
async function loadTickets() {
  document.getElementById('tickets-container').innerHTML = '<div class="empty">Loading...</div>'

  let q = sb.from('clay_tickets')
    .select(`id, ticket_number, studio_id, stage, description, notes, created_at, session_id,
             signin_entries(name, email),
             sessions(title, event_date, session_time)`)
    .neq('stage', 'ready_pickup')  // hide completed by default — show with filter
    .order('created_at', { ascending: false })
    .limit(300)

  if (studioId) q = q.eq('studio_id', studioId)

  // If filter is set to ready_pickup, fetch those too
  const stageFilter = document.getElementById('stage-filter')?.value
  if (stageFilter === 'ready_pickup') {
    q = sb.from('clay_tickets')
      .select(`id, ticket_number, studio_id, stage, description, notes, created_at, session_id,
               signin_entries(name, email),
               sessions(title, event_date, session_time)`)
      .eq('stage', 'ready_pickup')
      .order('created_at', { ascending: false })
      .limit(300)
    if (studioId) q = q.eq('studio_id', studioId)
  } else if (!stageFilter) {
    // show everything except completed (already set above)
  } else {
    q = q.eq('stage', stageFilter)
  }

  const { data, error } = await q
  if (error) {
    document.getElementById('tickets-container').innerHTML = `<div class="empty" style="color:#c0392b">Error: ${error.message}</div>`
    return
  }

  allTickets = data || []
  renderTickets()
}

// ── RENDER ────────────────────────────────────────
function setSort(order) {
  sortOrder = order
  document.getElementById('sort-new').classList.toggle('active', order === 'newest')
  document.getElementById('sort-old').classList.toggle('active', order === 'oldest')
  renderTickets()
}

function renderTickets() {
  const search = document.getElementById('search-input')?.value.trim().toLowerCase() || ''
  const stageF = document.getElementById('stage-filter')?.value || ''

  let tickets = [...allTickets]

  // Filter
  if (search) tickets = tickets.filter(t => t.ticket_number.includes(search))
  if (stageF) tickets = tickets.filter(t => t.stage === stageF)

  // Sort
  tickets.sort((a, b) => {
    const da = new Date(a.created_at), db = new Date(b.created_at)
    return sortOrder === 'newest' ? db - da : da - db
  })

  if (!tickets.length) {
    document.getElementById('tickets-container').innerHTML = '<div class="empty">No active clay tickets.</div>'
    return
  }

  // Group by session
  const groups = {}
  tickets.forEach(t => {
    const key = t.session_id || '__none__'
    const session = t.sessions
    const groupLabel = session
      ? `${fmtDate(session.event_date)} · ${fmtTime(session.session_time)} · ${session.title}`
      : 'No session linked'
    if (!groups[key]) groups[key] = { label: groupLabel, date: session?.event_date || '0000', tickets: [] }
    groups[key].tickets.push(t)
  })

  // Sort groups by date (newest first unless oldest selected)
  const sortedGroups = Object.values(groups).sort((a, b) => {
    return sortOrder === 'newest'
      ? b.date.localeCompare(a.date)
      : a.date.localeCompare(b.date)
  })

  const html = sortedGroups.map(g => `
    <div class="workshop-group">
      <div class="workshop-header">
        <div class="workshop-title">${g.label}</div>
        <span class="workshop-count">${g.tickets.length} ticket${g.tickets.length !== 1 ? 's' : ''}</span>
      </div>
      ${g.tickets.map(t => renderTicketCard(t)).join('')}
    </div>
  `).join('')

  document.getElementById('tickets-container').innerHTML = html
}

function renderTicketCard(t) {
  const stage = getStage(t.stage)
  const contacts = (t.signin_entries || [])
  const contactHtml = contacts.length
    ? contacts.map(c => `<span class="contact-pill">${c.name}</span>`).join('')
    : '<span class="contact-pill" style="color:#aaa">No contacts</span>'

  const date = new Date(t.created_at).toLocaleDateString('en-CA', { month: 'short', day: 'numeric', year: 'numeric' })

  const actionHtml = stage.next
    ? `<button class="advance-btn" onclick="promptAdvance('${t.id}','${t.ticket_number}','${stage.next}','${stage.nextLabel.replace(/'/g,"\\'")}')">
        ${stage.nextLabel}
       </button>`
    : `<span class="complete-badge">✓ Ready for Pickup</span>`

  return `
    <div class="ticket-card" id="ticket-card-${t.id}">
      <div class="ticket-num">${t.ticket_number}</div>
      <div class="ticket-body">
        <span class="stage-chip stage-${t.stage}">${stage.label}</span>
        ${t.description ? `<div class="ticket-desc">${t.description}</div>` : ''}
        <div class="ticket-contacts">${contactHtml}</div>
        <div class="ticket-date">Created ${date}</div>
      </div>
      <div class="ticket-actions">
        ${actionHtml}
      </div>
    </div>`
}

// ── ADVANCE STAGE ─────────────────────────────────
function promptAdvance(ticketId, ticketNumber, newStage, newLabel) {
  pendingAdvance = { ticketId, ticketNumber, newStage }
  document.getElementById('confirm-ticket-num').textContent = ticketNumber
  document.getElementById('confirm-sub').textContent = 'Advance this ticket to:'
  document.getElementById('confirm-new-stage').textContent = newLabel
  document.getElementById('confirm-overlay').classList.add('show')
}

function closeConfirm() {
  document.getElementById('confirm-overlay').classList.remove('show')
  pendingAdvance = null
}

async function confirmAdvance() {
  if (!pendingAdvance) return
  const { ticketId, ticketNumber, newStage } = pendingAdvance
  const btn = document.getElementById('confirm-yes-btn')
  btn.disabled = true
  btn.textContent = '...'
  closeConfirm()

  const { error } = await sb.from('clay_tickets')
    .update({ stage: newStage, updated_at: new Date().toISOString() })
    .eq('id', ticketId)

  btn.disabled = false
  btn.textContent = 'Confirm'

  if (error) { showToast('Error updating — try again'); return }

  const stage = getStage(newStage)

  // Email trigger notification
  if (stage.emailTrigger) {
    const ticket = allTickets.find(t => t.id === ticketId)
    const emails = (ticket?.signin_entries || []).filter(c => c.email).map(c => c.email)
    if (emails.length) {
      const banner = document.getElementById('email-banner')
      banner.textContent = `📧 Notification will be sent to: ${emails.join(', ')} (stage: ${stage.label})`
      banner.classList.add('show')
      setTimeout(() => banner.classList.remove('show'), 6000)
    }
  }

  showToast(`Ticket #${ticketNumber} → ${stage.label}`)

  // Update locally to avoid full reload
  const t = allTickets.find(t => t.id === ticketId)
  if (t) t.stage = newStage
  renderTickets()
}

// ── HELPERS ───────────────────────────────────────
function fmtDate(d) {
  if (!d) return ''
  const dt = new Date(d + 'T12:00:00')
  return dt.toLocaleDateString('en-CA', { month: 'short', day: 'numeric' })
}

function fmtTime(t) {
  if (!t) return ''
  const [h, m] = t.split(':').map(Number)
  const ampm = h >= 12 ? 'pm' : 'am'
  const h12 = h % 12 || 12
  return m === 0 ? `${h12}${ampm}` : `${h12}:${m.toString().padStart(2,'0')}${ampm}`
}

function showToast(msg, duration = 2500) {
  const t = document.getElementById('toast')
  t.textContent = msg
  t.classList.add('show')
  clearTimeout(t._timer)
  t._timer = setTimeout(() => t.classList.remove('show'), duration)
}

// Shake animation for wrong PIN
const style = document.createElement('style')
style.textContent = `@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }`
document.head.appendChild(style)
</script>
</body>
</html>
