<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>4CATS Artwork Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f0; min-height: 100vh; }

  .login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
  .login-card { background: white; border-radius: 16px; padding: 32px; width: 100%; max-width: 380px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
  .login-logo { font-size: 22px; font-weight: 800; color: #f0c040; letter-spacing: 1px; margin-bottom: 4px; }
  .login-title { font-size: 16px; font-weight: 600; color: #1a1a2e; margin-bottom: 24px; }
  .login-field { margin-bottom: 14px; }
  .login-field label { display: block; font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
  .login-field input { width: 100%; padding: 11px 14px; border: 1.5px solid #d0d0c8; border-radius: 8px; font-size: 15px; outline: none; font-family: inherit; }
  .login-field input:focus { border-color: #2d6a9f; }
  .login-btn { width: 100%; padding: 13px; background: #1a1a2e; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; }
  .login-btn:hover { background: #2d3a5e; }
  .login-error { color: #c0392b; font-size: 13px; margin-top: 10px; text-align: center; min-height: 18px; }

  .header { background: #1a1a2e; color: white; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .header-title { font-size: 16px; font-weight: 700; color: #f0c040; }
  .header-studio { font-size: 12px; color: #aaa; }
  .header-user { font-size: 12px; color: #aaa; }
  .signout-btn { padding: 5px 12px; border: 1px solid #444; border-radius: 6px; background: none; color: #aaa; font-size: 12px; cursor: pointer; }
  .signout-btn:hover { border-color: #aaa; color: white; }

  .toolbar { background: white; border-bottom: 1px solid #e0e0d8; padding: 10px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .toolbar select, .toolbar input { height: 32px; padding: 0 10px; border: 1px solid #d0d0c8; border-radius: 6px; font-size: 12px; outline: none; background: white; }
  .sort-btn { height: 32px; padding: 0 12px; border: 1px solid #d0d0c8; border-radius: 6px; font-size: 12px; background: white; cursor: pointer; color: #555; }
  .sort-btn.active { background: #1a1a2e; color: white; border-color: #1a1a2e; }

  .bulk-bar { position: sticky; top: 0; z-index: 50; background: #1a1a2e; color: white; padding: 10px 16px; display: none; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid #f0c040; }
  .bulk-bar.show { display: flex; }
  .bulk-info { font-size: 13px; font-weight: 600; }
  .bulk-info span { color: #f0c040; }
  .bulk-error { font-size: 12px; color: #ff8a80; margin-top: 2px; }
  .bulk-advance-btn { padding: 8px 18px; background: #f0c040; color: #1a1a2e; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .bulk-advance-btn:disabled { background: #555; color: #aaa; cursor: not-allowed; }
  .bulk-clear-btn { padding: 8px 14px; border: 1px solid #555; border-radius: 8px; background: none; color: #aaa; font-size: 12px; cursor: pointer; }

  .content { padding: 16px; max-width: 860px; margin: 0 auto; }

  .workshop-group { margin-bottom: 20px; }
  .workshop-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 2px solid #e0e0d8; }
  .workshop-title { font-size: 15px; font-weight: 700; color: #1a1a2e; }
  .workshop-count { font-size: 12px; color: #888; background: #f0f0e8; border-radius: 12px; padding: 2px 8px; }

  .ticket-card { background: white; border-radius: 10px; border: 1px solid #e0e0d8; padding: 14px 16px; margin-bottom: 8px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; transition: border-color 0.15s, background 0.15s; }
  .ticket-card.selected { border-color: #2d6a9f; background: #f0f6ff; }
  .ticket-card.party-card { border-color: #f0b8cc; }
  .ticket-checkbox { width: 22px; height: 22px; accent-color: #2d6a9f; cursor: pointer; flex-shrink: 0; }
  .ticket-num { font-size: 26px; font-weight: 900; color: #7a4f00; letter-spacing: 2px; font-variant-numeric: tabular-nums; min-width: 72px; }
  .ticket-body { flex: 1; min-width: 160px; }
  .ticket-desc { font-size: 13px; color: #333; margin-bottom: 4px; }
  .ticket-contacts { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .contact-pill { font-size: 11px; color: #555; background: #f0f0e8; border-radius: 10px; padding: 2px 8px; }
  .ticket-date { font-size: 11px; color: #aaa; }
  .ticket-actions { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .advance-btn { padding: 7px 14px; background: #1a1a2e; color: white; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .advance-btn:hover { background: #2d3a5e; }
  .complete-badge { font-size: 12px; color: #2e7d32; font-weight: 600; }

  .stage-chip { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; margin-bottom: 4px; }
  .stage-drying       { background: #fff3e0; color: #e65100; }
  .stage-bisque_ready { background: #e8f5e9; color: #2e7d32; }
  .stage-ready_pickup { background: #e3f2fd; color: #1565c0; }

  .medium-chip { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; margin-left: 6px; }
  .medium-clay      { background: #f3e5f5; color: #6a1b9a; }
  .medium-oven_bake { background: #fce4ec; color: #880e4f; }
  .medium-painting  { background: #e8eaf6; color: #283593; }
  .medium-party     { background: #fce4ec; color: #880e4f; }

  .empty { text-align: center; color: #aaa; font-size: 14px; padding: 60px 20px; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1a1a2e; color: white; padding: 12px 24px; border-radius: 10px; font-size: 14px; z-index: 200; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .toast.show { opacity: 1; }

  .confirm-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; padding: 1rem; }
  .confirm-overlay.show { display: flex; }
  .confirm-card { background: white; border-radius: 14px; padding: 24px; max-width: 360px; width: 100%; text-align: center; }
  .confirm-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
  .confirm-ticket { font-size: 32px; font-weight: 900; color: #7a4f00; letter-spacing: 3px; margin: 12px 0; }
  .confirm-sub { font-size: 14px; color: #666; margin-bottom: 8px; }
  .confirm-new-stage { font-size: 13px; font-weight: 600; margin-bottom: 20px; }
  .confirm-btns { display: flex; gap: 10px; justify-content: center; }
  .confirm-yes { padding: 10px 28px; background: #1a1a2e; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .confirm-no  { padding: 10px 28px; border: 1px solid #d0d0c8; border-radius: 8px; background: none; font-size: 14px; cursor: pointer; }

  .email-banner { background: #e8f5e9; border: 1px solid #a5d6a7; border-radius: 10px; padding: 12px 16px; margin-bottom: 12px; font-size: 13px; color: #2e7d32; display: none; }
  .email-banner.show { display: block; }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="login-screen">
  <div class="login-card">
    <div class="login-logo">🏺 4CATS</div>
    <div class="login-title">Artwork Tracker — Staff Login</div>
    <div class="login-field">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="studio@4cats.com" autocomplete="email">
    </div>
    <div class="login-field">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="login-btn" onclick="doLogin()" id="login-btn">Sign In</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div class="header">
    <div>
      <div class="header-title">🏺 Artwork Tracker</div>
      <div class="header-studio" id="header-studio"></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="header-user" id="header-user"></div>
      <button class="signout-btn" onclick="doSignOut()">Sign out</button>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" id="search-input" placeholder="🔍 Ticket #" oninput="renderTickets()" maxlength="5" style="width:120px">
    <select id="stage-filter" onchange="loadTickets()">
      <option value="">All active stages</option>
      <option value="drying">Drying / Processing</option>
      <option value="bisque_ready">Bisque — Ready for Glazing</option>
      <option value="ready_pickup">Ready for Pickup</option>
    </select>
    <select id="medium-filter" onchange="renderTickets()">
      <option value="">All mediums</option>
      <option value="clay">🏺 Clay</option>
      <option value="oven_bake">🔥 Oven-bake</option>
      <option value="painting">🎨 Painting</option>
      <option value="party">🎉 Party</option>
    </select>
    <button class="sort-btn active" id="sort-new" onclick="setSort('newest')">Newest first</button>
    <button class="sort-btn" id="sort-old" onclick="setSort('oldest')">Oldest first</button>
    <button onclick="loadTickets()" style="height:32px;padding:0 12px;border:1px solid #d0d0c8;border-radius:6px;font-size:12px;background:white;cursor:pointer">↻ Refresh</button>
  </div>

  <div class="bulk-bar" id="bulk-bar">
    <div>
      <div class="bulk-info"><span id="bulk-count">0</span> ticket(s) selected</div>
      <div class="bulk-error" id="bulk-error"></div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="bulk-clear-btn" onclick="clearSelection()">✕ Clear</button>
      <button class="bulk-advance-btn" id="bulk-advance-btn" onclick="promptBulkAdvance()">Advance Selected →</button>
    </div>
  </div>

  <div class="content">
    <div class="email-banner" id="email-banner"></div>
    <div id="tickets-container"><div class="empty">Loading...</div></div>
  </div>
</div>

<!-- CONFIRM -->
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-card">
    <div class="confirm-title">Advance Stage?</div>
    <div class="confirm-ticket" id="confirm-ticket-num"></div>
    <div class="confirm-sub" id="confirm-sub"></div>
    <div class="confirm-new-stage" id="confirm-new-stage"></div>
    <div class="confirm-btns">
      <button class="confirm-no" onclick="closeConfirm()">Cancel</button>
      <button class="confirm-yes" id="confirm-yes-btn" onclick="confirmAdvance()">Confirm</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://snxibhbhhchjthfmjtaj.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNueGliaGJoaGNoanRoZm1qdGFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTk2ODAsImV4cCI6MjA5MjYzNTY4MH0.K-89Mx4SxU6N1hMmtK6Q79rWAtk6VTN9b5wemQxcZVA'
const { createClient } = supabase
const sb = createClient(SUPABASE_URL, SUPABASE_KEY)

const STUDIO_NAMES = {
  'BC-RICH-GC':'Richmond - Garden City','BC-RICH-STV':'Richmond - Steveston','BC-SUR-SSR':'Surrey - South',
  'BC-YVR-KIT':'Vancouver - Kitsilano','BC-YVR-MS':'Vancouver - Main Street','BC-YVR-UBC':'Vancouver - UBC',
  'BC-YYJ-CSV':'Victoria - Cook Street Village','BC-YYJ-ESQ':'Victoria - Esquimalt','BC-YYJ-OB':'Victoria - Oak Bay',
  'BC-YYJ-VIC':'Victoria - Uptown','AB-YYC-ING':'Calgary - Inglewood','AB-STA-STA':'St Albert',
  'ON-BRL-BRL':'Burlington - South','ON-CMB-GLT':'Cambridge - Galt','ON-ERN-ERN':'Erin',
  'ON-HAM-OS':'Hamilton - Ottawa Street','ON-HAM-WD':'Hamilton - Waterdown','ON-HAM-WH':'Hamilton - West Harbour',
  'ON-KGN-AP':'Kingston - Arlington Park','ON-LDN-BYR':'London - Byron','ON-LDN-WVG':'London - Wortley Village',
  'ON-MIS-PC':'Mississauga - Port Credit','ON-OAK-OAK':'Oakville - North','ON-OAK-WST':'Oakville - West',
  'ON-YOW-GLB':'Ottawa - The Glebe','ON-STC-STC':'St Catharines','ON-YYZ-AVE':'Toronto - Avenue Road',
  'ON-YYZ-BP':'Toronto - Baby Point','ON-YYZ-LEA':'Toronto - Leaside','ON-YYZ-BEA':'Toronto - The Beaches',
  'ON-WTR-WTR':'Waterloo - Uptown'
}

const STAGES = [
  { key: 'drying',        label: 'Drying / Processing 🪴',             next: 'bisque_ready',  nextLabel: 'Bisque Fired — Ready for Glazing', emailTrigger: true },
  { key: 'bisque_ready',  label: '✅ Bisque Done — Ready for Glazing',  next: 'ready_pickup',  nextLabel: 'Ready for Pickup 🎉',              emailTrigger: false },
  { key: 'ready_pickup',  label: '🎉 Ready for Pickup',                 next: null,            nextLabel: null,                               emailTrigger: true },
]

const MEDIUM_LABELS = {
  clay:      { label: '🏺 Clay',      cls: 'medium-clay' },
  oven_bake: { label: '🔥 Oven-bake', cls: 'medium-oven_bake' },
  painting:  { label: '🎨 Painting',  cls: 'medium-painting' },
  party:     { label: '🎉 Party',     cls: 'medium-party' },
}

function getStage(key) { return STAGES.find(s => s.key === key) || STAGES[0] }

let studioId = null
let currentUser = null
let allTickets = []
let sortOrder = 'newest'
let selectedIds = new Set()
let pendingAdvance = null

// ── AUTH ──────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  const params = new URLSearchParams(window.location.search)
  studioId = params.get('studio') || null

  const { data: { session } } = await sb.auth.getSession()
  if (session) { currentUser = session.user; showApp() }

  document.getElementById('login-password').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin()
  })
})

async function doLogin() {
  const email    = document.getElementById('login-email').value.trim()
  const password = document.getElementById('login-password').value
  const btn      = document.getElementById('login-btn')
  const errEl    = document.getElementById('login-error')
  errEl.textContent = ''
  btn.disabled = true; btn.textContent = 'Signing in...'

  const { data, error } = await sb.auth.signInWithPassword({ email, password })
  btn.disabled = false; btn.textContent = 'Sign In'

  if (error) { errEl.textContent = 'Invalid email or password'; return }
  currentUser = data.user
  showApp()
}

async function doSignOut() {
  await sb.auth.signOut()
  document.getElementById('app').style.display = 'none'
  document.getElementById('login-screen').style.display = 'flex'
  currentUser = null; allTickets = []
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none'
  document.getElementById('app').style.display = 'block'
  document.getElementById('header-user').textContent = currentUser?.email || ''
  document.getElementById('header-studio').textContent = studioId ? (STUDIO_NAMES[studioId] || studioId) : 'All Studios'
  loadTickets()
}

// ── LOAD ──────────────────────────────────────────────
async function loadTickets() {
  document.getElementById('tickets-container').innerHTML = '<div class="empty">Loading...</div>'
  const stageFilter = document.getElementById('stage-filter')?.value || ''

  let q = sb.from('clay_tickets')
    .select(`id, ticket_number, studio_id, stage, medium, is_party, description, notes, created_at, session_id,
             signin_entries(name, email),
             sessions(title, session_date, session_time)`)
    .order('created_at', { ascending: false })
    .limit(300)

  if (!stageFilter)              q = q.neq('stage', 'ready_pickup')
  else                           q = q.eq('stage', stageFilter)
  if (studioId)                  q = q.eq('studio_id', studioId)

  const { data, error } = await q
  if (error) {
    document.getElementById('tickets-container').innerHTML = `<div class="empty" style="color:#c0392b">Error: ${error.message}</div>`
    return
  }
  allTickets = data || []
  renderTickets()
}

// ── RENDER ────────────────────────────────────────────
function setSort(order) {
  sortOrder = order
  document.getElementById('sort-new').classList.toggle('active', order === 'newest')
  document.getElementById('sort-old').classList.toggle('active', order === 'oldest')
  renderTickets()
}

function renderTickets() {
  const search  = document.getElementById('search-input')?.value.trim() || ''
  const mediumF = document.getElementById('medium-filter')?.value || ''

  let tickets = [...allTickets]
  if (search)  tickets = tickets.filter(t => t.ticket_number.includes(search))
  if (mediumF) tickets = tickets.filter(t => t.medium === mediumF)
  tickets.sort((a, b) => {
    const da = new Date(a.created_at), db = new Date(b.created_at)
    return sortOrder === 'newest' ? db - da : da - db
  })

  if (!tickets.length) {
    selectedIds.clear()
    document.getElementById('bulk-bar').classList.remove('show')
    document.getElementById('tickets-container').innerHTML = '<div class="empty">No active artwork tickets.</div>'
    return
  }

  const groups = {}
  tickets.forEach(t => {
    const key = t.session_id || '__none__'
    const s = t.sessions
    const label = s ? `${fmtDate(s.session_date)} · ${fmtTime(s.session_time)} · ${s.title}` : 'No session linked'
    if (!groups[key]) groups[key] = { label, date: s?.session_date || '0000', tickets: [] }
    groups[key].tickets.push(t)
  })

  const sorted = Object.values(groups).sort((a, b) =>
    sortOrder === 'newest' ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date)
  )

  document.getElementById('tickets-container').innerHTML = sorted.map(g => `
    <div class="workshop-group">
      <div class="workshop-header">
        <div class="workshop-title">${g.label}</div>
        <div style="display:flex;align-items:center;gap:8px">
          <button onclick="selectAllInGroup([${g.tickets.map(t=>`'${t.id}'`).join(',')}])" style="padding:4px 10px;border:1px solid #d0d0c8;border-radius:6px;font-size:11px;background:white;cursor:pointer;color:#555">Select all</button>
          <span class="workshop-count">${g.tickets.length} ticket${g.tickets.length !== 1 ? 's' : ''}</span>
        </div>
      </div>
      ${g.tickets.map(renderCard).join('')}
    </div>`).join('')
}

function renderCard(t) {
  const stage  = getStage(t.stage)
  const medium = MEDIUM_LABELS[t.medium] || { label: t.medium, cls: 'medium-clay' }
  const contacts = (t.signin_entries || [])
  const contactHtml = contacts.length
    ? contacts.map(c => `<span class="contact-pill">${c.name}</span>`).join('')
    : '<span class="contact-pill" style="color:#aaa">No contacts</span>'
  const date = new Date(t.created_at).toLocaleDateString('en-CA', { month: 'short', day: 'numeric', year: 'numeric' })
  const action = stage.next
    ? `<button class="advance-btn" onclick="promptAdvance('${t.id}','${t.ticket_number}','${stage.next}','${(stage.nextLabel||'').replace(/'/g,"\\'")}')">→ ${stage.nextLabel}</button>`
    : `<span class="complete-badge">✓ Ready for Pickup</span>`

  return `
    <div class="ticket-card${t.is_party ? ' party-card' : ''}" id="ticket-card-${t.id}">
      <input type="checkbox" class="ticket-checkbox" id="cb-${t.id}" onchange="onTicketCheck('${t.id}')">
      <div class="ticket-num">${t.ticket_number}</div>
      <div class="ticket-body">
        <div style="margin-bottom:4px">
          <span class="stage-chip stage-${t.stage}">${stage.label}</span>
          <span class="medium-chip ${medium.cls}">${medium.label}</span>
        </div>
        ${t.description ? `<div class="ticket-desc">${t.description}</div>` : ''}
        <div class="ticket-contacts">${contactHtml}</div>
        <div class="ticket-date">Created ${date}</div>
      </div>
      <div class="ticket-actions">${action}</div>
    </div>`
}

// ── MULTI-SELECT ──────────────────────────────────────
function onTicketCheck(id) {
  const cb = document.getElementById(`cb-${id}`)
  const card = document.getElementById(`ticket-card-${id}`)
  if (cb.checked) { selectedIds.add(id); card.classList.add('selected') }
  else { selectedIds.delete(id); card.classList.remove('selected') }
  updateBulkBar()
}

function selectAllInGroup(ids) {
  ids.forEach(id => {
    selectedIds.add(id)
    const cb = document.getElementById(`cb-${id}`)
    const card = document.getElementById(`ticket-card-${id}`)
    if (cb) cb.checked = true
    if (card) card.classList.add('selected')
  })
  updateBulkBar()
}

function clearSelection() {
  selectedIds.forEach(id => {
    const cb = document.getElementById(`cb-${id}`)
    const card = document.getElementById(`ticket-card-${id}`)
    if (cb) cb.checked = false
    if (card) card.classList.remove('selected')
  })
  selectedIds.clear()
  updateBulkBar()
}

function updateBulkBar() {
  const bar    = document.getElementById('bulk-bar')
  const errEl  = document.getElementById('bulk-error')
  const advBtn = document.getElementById('bulk-advance-btn')
  if (selectedIds.size === 0) { bar.classList.remove('show'); return }
  bar.classList.add('show')
  document.getElementById('bulk-count').textContent = selectedIds.size

  const stages = [...selectedIds].map(id => allTickets.find(t => t.id === id)?.stage).filter(Boolean)
  const unique = [...new Set(stages)]

  if (unique.length > 1) {
    errEl.textContent = '⚠️ Mixed stages — select tickets at the same stage only'
    advBtn.disabled = true
  } else if (unique.length === 1 && !getStage(unique[0]).next) {
    errEl.textContent = '⚠️ Already at final stage'
    advBtn.disabled = true
  } else {
    errEl.textContent = ''
    advBtn.disabled = false
    advBtn.textContent = `→ ${getStage(unique[0]).nextLabel} (${selectedIds.size})`
  }
}

function promptBulkAdvance() {
  const stages = [...selectedIds].map(id => allTickets.find(t => t.id === id)?.stage).filter(Boolean)
  const unique = [...new Set(stages)]
  if (unique.length !== 1) return
  const nextStage = getStage(unique[0]).next
  if (!nextStage) return
  const nums = [...selectedIds].map(id => allTickets.find(t => t.id === id)?.ticket_number).filter(Boolean).join(', ')
  pendingAdvance = { bulk: true, ids: [...selectedIds], newStage: nextStage }
  document.getElementById('confirm-ticket-num').textContent = `${selectedIds.size} tickets`
  document.getElementById('confirm-sub').textContent = `#${nums}`
  document.getElementById('confirm-new-stage').textContent = `→ ${getStage(unique[0]).nextLabel}`
  document.getElementById('confirm-overlay').classList.add('show')
}

function promptAdvance(ticketId, ticketNumber, newStage, newLabel) {
  pendingAdvance = { ticketId, ticketNumber, newStage }
  document.getElementById('confirm-ticket-num').textContent = ticketNumber
  document.getElementById('confirm-sub').textContent = 'Advance this ticket to:'
  document.getElementById('confirm-new-stage').textContent = `→ ${newLabel}`
  document.getElementById('confirm-overlay').classList.add('show')
}

function closeConfirm() { document.getElementById('confirm-overlay').classList.remove('show'); pendingAdvance = null }

async function confirmAdvance() {
  if (!pendingAdvance) return
  const btn = document.getElementById('confirm-yes-btn')
  btn.disabled = true; btn.textContent = '...'
  closeConfirm()

  const { newStage } = pendingAdvance
  const stage = getStage(newStage)
  const ids = pendingAdvance.bulk ? pendingAdvance.ids : [pendingAdvance.ticketId]

  const { error } = await sb.from('clay_tickets').update({ stage: newStage, updated_at: new Date().toISOString() }).in('id', ids)
  btn.disabled = false; btn.textContent = 'Confirm'
  if (error) { showToast('Error — try again'); return }

  if (stage.emailTrigger) {
    const affected = allTickets.filter(t => ids.includes(t.id))
    const emails = [...new Set(affected.flatMap(t => (t.signin_entries || []).filter(c => c.email).map(c => c.email)))]
    if (emails.length) {
      const banner = document.getElementById('email-banner')
      banner.textContent = `📧 Email queued for: ${emails.join(', ')} — ${stage.label}`
      banner.classList.add('show')
      setTimeout(() => banner.classList.remove('show'), 6000)
    }
  }

  const nums = ids.map(id => allTickets.find(t => t.id === id)?.ticket_number).filter(Boolean).join(', ')
  showToast(`${ids.length > 1 ? ids.length + ' tickets' : '#' + nums} → ${stage.label}`)
  ids.forEach(id => { const t = allTickets.find(t => t.id === id); if (t) t.stage = newStage })
  clearSelection()
  renderTickets()
}

function fmtDate(d) {
  if (!d) return ''
  return new Date(d + 'T12:00:00').toLocaleDateString('en-CA', { month: 'short', day: 'numeric' })
}
function fmtTime(t) {
  if (!t) return ''
  const [h, m] = t.split(':').map(Number)
  const ampm = h >= 12 ? 'pm' : 'am'
  const h12 = h % 12 || 12
  return m === 0 ? `${h12}${ampm}` : `${h12}:${m.toString().padStart(2,'0')}${ampm}`
}
function showToast(msg, duration = 2500) {
  const t = document.getElementById('toast')
  t.textContent = msg; t.classList.add('show')
  clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), duration)
}
</script>
