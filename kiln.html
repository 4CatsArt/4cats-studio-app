<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="https://cdn.shopify.com/s/files/1/1451/3756/files/favicon.png?v=1613591354"><meta charset="UTF-8">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>4CATS Artwork Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f0; min-height: 100vh; }

  .login-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:2rem; }
  .login-card { background:white; border-radius:16px; padding:32px; width:100%; max-width:380px; box-shadow:0 4px 24px rgba(0,0,0,0.08); }
  .login-logo { font-size:22px; font-weight:800; color:#f0c040; letter-spacing:1px; margin-bottom:4px; }
  .login-title { font-size:16px; font-weight:600; color:#1a1a2e; margin-bottom:24px; }
  .login-field { margin-bottom:14px; }
  .login-field label { display:block; font-size:11px; color:#888; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:5px; }
  .login-field input { width:100%; padding:11px 14px; border:1.5px solid #d0d0c8; border-radius:8px; font-size:15px; outline:none; font-family:inherit; }
  .login-field input:focus { border-color:#2d6a9f; }
  .login-btn { width:100%; padding:13px; background:#1a1a2e; color:white; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; margin-top:8px; }
  .login-error { color:#c0392b; font-size:13px; margin-top:10px; text-align:center; min-height:18px; }

  .header { background:#1a1a2e; color:white; padding:12px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .header-title { font-size:16px; font-weight:700; color:#f0c040; }
  .header-sub { font-size:12px; color:#aaa; }
  .signout-btn { padding:5px 12px; border:1px solid #444; border-radius:6px; background:none; color:#aaa; font-size:12px; cursor:pointer; }
  .signout-btn:hover { color:white; border-color:#aaa; }

  .toolbar { background:white; border-bottom:1px solid #e0e0d8; padding:8px 16px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .toolbar select, .toolbar input[type=text] { height:30px; padding:0 8px; border:1px solid #d0d0c8; border-radius:6px; font-size:12px; outline:none; background:white; }
  .tb-btn { height:30px; padding:0 12px; border:1px solid #d0d0c8; border-radius:6px; font-size:12px; background:white; cursor:pointer; color:#555; white-space:nowrap; }
  .tb-btn.active { background:#1a1a2e; color:white; border-color:#1a1a2e; }

  .bulk-bar { position:sticky; top:0; z-index:50; background:#1a1a2e; color:white; padding:8px 16px; display:none; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; border-bottom:2px solid #f0c040; }
  .bulk-bar.show { display:flex; }
  .bulk-count { font-size:13px; font-weight:600; color:#f0c040; }
  .bulk-error { font-size:11px; color:#ff8a80; }
  .bulk-advance-btn { padding:7px 16px; background:#f0c040; color:#1a1a2e; border:none; border-radius:6px; font-size:12px; font-weight:700; cursor:pointer; }
  .bulk-advance-btn:disabled { background:#555; color:#aaa; cursor:not-allowed; }
  .bulk-clear-btn { padding:7px 12px; border:1px solid #555; border-radius:6px; background:none; color:#aaa; font-size:12px; cursor:pointer; }

  .tbl-wrap { padding:12px 16px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; background:white; border-radius:10px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,0.06); font-size:13px; min-width:700px; }
  thead { background:#1a1a2e; color:white; }
  th { padding:10px 12px; text-align:left; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; white-space:nowrap; cursor:pointer; user-select:none; }
  th:hover { background:#2d3a5e; }
  th.sort-asc::after { content:' ↑'; }
  th.sort-desc::after { content:' ↓'; }
  th.no-sort { cursor:default; }
  th.no-sort:hover { background:#1a1a2e; }
  tbody tr { border-bottom:1px solid #f0f0e8; transition:background 0.1s; }
  tbody tr:last-child { border-bottom:none; }
  tbody tr:hover { background:#fafaf8; }
  tbody tr.selected { background:#f0f6ff !important; }
  td { padding:9px 12px; vertical-align:middle; }
  td.ticket-num { font-size:20px; font-weight:900; color:#7a4f00; letter-spacing:1px; font-variant-numeric:tabular-nums; white-space:nowrap; }

  .stage-chip { display:inline-block; padding:3px 10px; border-radius:12px; font-size:11px; font-weight:600; white-space:nowrap; }
  .stage-drying       { background:#fff3e0; color:#e65100; }
  .stage-bisque_ready { background:#e8f5e9; color:#2e7d32; }
  .stage-ready_pickup { background:#e3f2fd; color:#1565c0; }

  .type-chip { display:inline-block; padding:2px 8px; border-radius:8px; font-size:11px; font-weight:600; }
  .type-workshop { background:#e8eaf6; color:#283593; }
  .type-party    { background:#fce4ec; color:#880e4f; }
  .type-class    { background:#e0f2f1; color:#00695c; }
  .type-camp     { background:#fff8e1; color:#f57f17; }

  .advance-btn { padding:5px 10px; background:#1a1a2e; color:white; border:none; border-radius:6px; font-size:11px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .advance-btn:hover { background:#2d3a5e; }
  .done-badge { font-size:11px; color:#2e7d32; font-weight:600; }

  input[type=checkbox] { width:16px; height:16px; accent-color:#2d6a9f; cursor:pointer; }

  .empty-row td { text-align:center; color:#aaa; padding:40px; }

  .email-banner { background:#e8f5e9; border:1px solid #a5d6a7; border-radius:8px; padding:10px 14px; margin:8px 16px; font-size:13px; color:#2e7d32; display:none; }
  .email-banner.show { display:block; }

  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#1a1a2e; color:white; padding:10px 20px; border-radius:8px; font-size:13px; z-index:200; opacity:0; transition:opacity 0.3s; pointer-events:none; }
  .toast.show { opacity:1; }

  .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:100; align-items:center; justify-content:center; padding:1rem; }
  .overlay.show { display:flex; }
  .confirm-card { background:white; border-radius:14px; padding:24px; max-width:360px; width:100%; text-align:center; }
  .confirm-ticket { font-size:28px; font-weight:900; color:#7a4f00; letter-spacing:2px; margin:10px 0; }
  .confirm-btns { display:flex; gap:10px; justify-content:center; margin-top:16px; }
  .confirm-yes { padding:9px 24px; background:#1a1a2e; color:white; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; }
  .confirm-no  { padding:9px 24px; border:1px solid #d0d0c8; border-radius:8px; background:none; font-size:14px; cursor:pointer; }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="login-screen">
  <div class="login-card">
    <div class="login-logo">🏺 4CATS</div>
    <div class="login-title">Artwork Tracker — Staff Login</div>
    <div class="login-field">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="studio@4cats.com" autocomplete="email">
    </div>
    <div class="login-field">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="login-btn" onclick="doLogin()" id="login-btn">Sign In</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div class="header">
    <div>
      <div class="header-title">🏺 Artwork Tracker</div>
      <div class="header-sub" id="header-sub"></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="header-sub" id="header-user"></span>
      <button class="signout-btn" onclick="doSignOut()">Sign out</button>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" id="search-input" placeholder="🔍 Ticket #" oninput="renderTable()" style="width:110px">
    <select id="filter-stage" onchange="loadTickets()">
      <option value="">All active</option>
      <option value="drying">Drying / Processing</option>
      <option value="bisque_ready">Bisque — Ready for Glazing</option>
      <option value="ready_pickup">Ready for Pickup</option>
    </select>
    <select id="filter-type" onchange="renderTable()">
      <option value="">All types</option>
      <option value="workshop">Workshop</option>
      <option value="class">Class</option>
      <option value="party">Party</option>
      <option value="camp">Camp</option>
    </select>
    <button class="tb-btn" onclick="loadTickets()">↻ Refresh</button>
  </div>

  <div class="bulk-bar" id="bulk-bar">
    <div>
      <div class="bulk-count"><span id="bulk-count">0</span> selected</div>
      <div class="bulk-error" id="bulk-error"></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="bulk-clear-btn" onclick="clearSelection()">✕ Clear</button>
      <button class="bulk-advance-btn" id="bulk-advance-btn" onclick="promptBulkAdvance()">Advance →</button>
    </div>
  </div>

  <div class="email-banner" id="email-banner"></div>

  <div class="tbl-wrap">
    <table>
      <thead>
        <tr>
          <th class="no-sort" style="width:36px"><input type="checkbox" id="check-all" onchange="toggleAll(this.checked)"></th>
          <th onclick="sortBy('ticket_number')">Ticket #</th>
          <th onclick="sortBy('created_at')">Date</th>
          <th class="no-sort">Product / Session</th>
          <th onclick="sortBy('session_type')">Type</th>
          <th onclick="sortBy('stage')">Stage</th>
          <th onclick="sortBy('glazed_on')">Glazed On</th>
          <th class="no-sort">Names</th>
          <th class="no-sort">Action</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr class="empty-row"><td colspan="9">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- CONFIRM -->
<div class="overlay" id="confirm-overlay">
  <div class="confirm-card">
    <div style="font-size:15px;font-weight:700;margin-bottom:8px">Advance Stage?</div>
    <div class="confirm-ticket" id="confirm-num"></div>
    <div style="font-size:13px;color:#666;margin-bottom:4px" id="confirm-sub"></div>
    <div style="font-size:13px;font-weight:600;margin-bottom:4px" id="confirm-stage"></div>
    <div class="confirm-btns">
      <button class="confirm-no" onclick="closeConfirm()">Cancel</button>
      <button class="confirm-yes" id="confirm-yes" onclick="confirmAdvance()">Confirm</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://snxibhbhhchjthfmjtaj.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNueGliaGJoaGNoanRoZm1qdGFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTk2ODAsImV4cCI6MjA5MjYzNTY4MH0.K-89Mx4SxU6N1hMmtK6Q79rWAtk6VTN9b5wemQxcZVA'
const { createClient } = supabase
const sb = createClient(SUPABASE_URL, SUPABASE_KEY)

const STUDIO_NAMES = {
  'BC-RICH-GC':'Richmond - Garden City','BC-RICH-STV':'Richmond - Steveston','BC-SUR-SSR':'Surrey - South',
  'BC-YVR-KIT':'Vancouver - Kitsilano','BC-YVR-MS':'Vancouver - Main Street','BC-YVR-UBC':'Vancouver - UBC',
  'BC-YYJ-CSV':'Victoria - Cook Street Village','BC-YYJ-ESQ':'Victoria - Esquimalt','BC-YYJ-OB':'Victoria - Oak Bay',
  'BC-YYJ-VIC':'Victoria - Uptown','AB-YYC-ING':'Calgary - Inglewood','AB-STA-STA':'St Albert',
  'ON-BRL-BRL':'Burlington - South','ON-CMB-GLT':'Cambridge - Galt','ON-ERN-ERN':'Erin',
  'ON-HAM-OS':'Hamilton - Ottawa Street','ON-HAM-WD':'Hamilton - Waterdown','ON-HAM-WH':'Hamilton - West Harbour',
  'ON-KGN-AP':'Kingston - Arlington Park','ON-LDN-BYR':'London - Byron','ON-LDN-WVG':'London - Wortley Village',
  'ON-MIS-PC':'Mississauga - Port Credit','ON-OAK-OAK':'Oakville - North','ON-OAK-WST':'Oakville - West',
  'ON-YOW-GLB':'Ottawa - The Glebe','ON-STC-STC':'St Catharines','ON-YYZ-AVE':'Toronto - Avenue Road',
  'ON-YYZ-BP':'Toronto - Baby Point','ON-YYZ-LEA':'Toronto - Leaside','ON-YYZ-BEA':'Toronto - The Beaches',
  'ON-WTR-WTR':'Waterloo - Uptown'
}

const STAGES = {
  drying:       { label:'Drying / Processing 🪴',          next:'bisque_ready', nextLabel:'→ Bisque Fired — Ready for Glazing', emailTrigger: false },
  bisque_ready: { label:'✅ Bisque — Ready for Glazing',    next:'ready_pickup', nextLabel:'→ Ready for Pickup 🎉',              emailTrigger: true  },
  ready_pickup: { label:'🎉 Ready for Pickup',              next: null,          nextLabel: null,                                emailTrigger: true  },
}

function sessionType(t) {
  // Derive type from session_type or is_party flag
  if (t.is_party) return 'party'
  const st = (t.sessions?.session_type || '').toLowerCase()
  if (st.includes('party'))  return 'party'
  if (st.includes('camp'))   return 'camp'
  if (st.includes('class') || st.includes('series') || st.includes('week')) return 'class'
  return 'workshop'
}

function typeChip(type) {
  const map = {
    workshop: ['Workshop',  'type-workshop'],
    class:    ['Class',     'type-class'],
    party:    ['Party 🎉',  'type-party'],
    camp:     ['Camp',      'type-camp'],
  }
  const [label, cls] = map[type] || ['Workshop','type-workshop']
  return `<span class="type-chip ${cls}">${label}</span>`
}

let studioId = null
let currentUser = null
let allTickets = []
let sortCol = 'created_at'
let sortDir = 'desc'
let selectedIds = new Set()
let pendingAdvance = null

// ── AUTH ──────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  const params = new URLSearchParams(window.location.search)
  studioId = params.get('studio') || null
  const { data: { session } } = await sb.auth.getSession()
  if (session) {
    await sb.auth.setSession({ access_token: session.access_token, refresh_token: session.refresh_token })
    currentUser = session.user; showApp()
  }
  document.getElementById('login-password').addEventListener('keydown', e => { if (e.key==='Enter') doLogin() })
})

async function doLogin() {
  const email    = document.getElementById('login-email').value.trim()
  const password = document.getElementById('login-password').value
  const btn      = document.getElementById('login-btn')
  document.getElementById('login-error').textContent = ''
  btn.disabled = true; btn.textContent = 'Signing in...'
  const { data, error } = await sb.auth.signInWithPassword({ email, password })
  btn.disabled = false; btn.textContent = 'Sign In'
  if (error) { document.getElementById('login-error').textContent = 'Invalid email or password'; return }
  await sb.auth.setSession({ access_token: data.session.access_token, refresh_token: data.session.refresh_token })
  currentUser = data.user; showApp()
}

async function doSignOut() {
  await sb.auth.signOut()
  document.getElementById('app').style.display = 'none'
  document.getElementById('login-screen').style.display = 'flex'
  currentUser = null; allTickets = []
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none'
  document.getElementById('app').style.display = 'block'
  document.getElementById('header-user').textContent = currentUser?.email || ''
  document.getElementById('header-sub').textContent = studioId ? (STUDIO_NAMES[studioId] || studioId) : 'All Studios'
  loadTickets()
}

// ── LOAD ──────────────────────────────────
async function loadTickets() {
  document.getElementById('table-body').innerHTML = '<tr class="empty-row"><td colspan="9">Loading...</td></tr>'
  const stageF = document.getElementById('filter-stage').value

  let q = sb.from('clay_tickets')
    .select(`id, ticket_number, studio_id, stage, is_party, description, created_at, glazed_on, session_id,
             signin_entries(name, email),
             sessions(title, session_date, session_time, session_type)`)
    .order('created_at', { ascending: false })
    .limit(500)

  if (!stageF) q = q.neq('stage', 'ready_pickup')
  else         q = q.eq('stage', stageF)
  if (studioId) q = q.eq('studio_id', studioId)

  const { data, error } = await q
  if (error) {
    document.getElementById('table-body').innerHTML = `<tr class="empty-row"><td colspan="9" style="color:#c0392b">Error: ${error.message}</td></tr>`
    return
  }
  allTickets = data || []
  renderTable()
}

// ── RENDER ────────────────────────────────
function sortBy(col) {
  if (sortCol === col) sortDir = sortDir === 'asc' ? 'desc' : 'asc'
  else { sortCol = col; sortDir = 'asc' }
  document.querySelectorAll('th').forEach(th => th.classList.remove('sort-asc','sort-desc'))
  const colIdx = { ticket_number:1, created_at:2, session_type:4, stage:5 }
  const ths = document.querySelectorAll('th')
  if (colIdx[col] !== undefined) ths[colIdx[col]].classList.add(sortDir==='asc'?'sort-asc':'sort-desc')
  renderTable()
}

function renderTable() {
  const search = document.getElementById('search-input').value.trim()
  const typeF  = document.getElementById('filter-type').value

  let tickets = [...allTickets]
  if (search) tickets = tickets.filter(t => t.ticket_number.includes(search))
  if (typeF)  tickets = tickets.filter(t => sessionType(t) === typeF)

  tickets.sort((a, b) => {
    let va = a[sortCol] ?? '', vb = b[sortCol] ?? ''
    if (sortCol === 'created_at') { va = new Date(va); vb = new Date(vb) }
    if (sortCol === 'session_type') { va = sessionType(a); vb = sessionType(b) }
    return sortDir === 'asc' ? (va > vb ? 1 : -1) : (va < vb ? 1 : -1)
  })

  if (!tickets.length) {
    document.getElementById('table-body').innerHTML = '<tr class="empty-row"><td colspan="9">No active artwork tickets.</td></tr>'
    selectedIds.clear(); updateBulkBar(); return
  }

  const rows = tickets.map(t => {
    const stage   = STAGES[t.stage] || STAGES.drying
    const type    = sessionType(t)
    const session = t.sessions
    const product = session ? `${session.title}${session.session_date ? ' · ' + fmtDate(session.session_date) : ''}` : (t.description || '—')
    const date = fmtDate(t.created_at)
    const glazedOn = t.glazed_on
      ? `<input type="date" value="${t.glazed_on}" onchange="updateGlazedOn('${t.id}',this.value)" style="border:1px solid #d0d0c8;border-radius:6px;font-size:11px;padding:3px 6px;outline:none;background:white;width:120px">`
      : `<input type="date" onchange="updateGlazedOn('${t.id}',this.value)" style="border:1px solid #d0d0c8;border-radius:6px;font-size:11px;padding:3px 6px;outline:none;background:white;width:120px">`
    const action = t.stage === 'drying'
      ? `<div style="display:flex;flex-direction:column;gap:4px">
           <button class="advance-btn" onclick="promptAdvance('${t.id}','${t.ticket_number}','bisque_ready','→ Bisque Fired — Ready for Glazing')">→ Bisque Fired</button>
           <button class="advance-btn" style="background:#2e7d32" onclick="promptAdvance('${t.id}','${t.ticket_number}','ready_pickup','→ Skip to Ready for Pickup 🎉')">→ Skip to Pickup</button>
         </div>`
      : stage.next
        ? `<button class="advance-btn" onclick="promptAdvance('${t.id}','${t.ticket_number}','${stage.next}','${(stage.nextLabel||'').replace(/'/g,"\\'")}')">
             ${stage.nextLabel}
           </button>`
        : `<span class="done-badge">✓ Ready for Pickup</span>`

    const checked  = selectedIds.has(t.id) ? 'checked' : ''
    const selClass = selectedIds.has(t.id) ? ' selected' : ''

    return `<tr id="row-${t.id}" class="${selClass}">
      <td><input type="checkbox" ${checked} onchange="onCheck('${t.id}',this.checked)"></td>
      <td class="ticket-num">${t.ticket_number}</td>
      <td style="white-space:nowrap;color:#888;font-size:12px">${date}</td>
      <td style="max-width:220px;font-size:12px;color:#333">${product}</td>
      <td>${typeChip(type)}</td>
      <td><span class="stage-chip stage-${t.stage}">${stage.label}</span></td>
      <td>${glazedOn}</td>
      <td style="font-size:12px;color:#555">${(t.signin_entries||[]).map(c=>c.name).join(', ') || '<span style="color:#bbb">—</span>'}</td>
      <td>${action}</td>
    </tr>`
  }).join('')

  document.getElementById('table-body').innerHTML = rows
}

// ── SELECTION ─────────────────────────────
function onCheck(id, checked) {
  if (checked) selectedIds.add(id); else selectedIds.delete(id)
  document.getElementById(`row-${id}`)?.classList.toggle('selected', checked)
  updateBulkBar()
}

function toggleAll(checked) {
  document.querySelectorAll('#table-body input[type=checkbox]').forEach(cb => {
    cb.checked = checked
    const id = cb.closest('tr')?.id?.replace('row-','')
    if (id) {
      if (checked) { selectedIds.add(id); cb.closest('tr').classList.add('selected') }
      else         { selectedIds.delete(id); cb.closest('tr').classList.remove('selected') }
    }
  })
  updateBulkBar()
}

function clearSelection() {
  selectedIds.forEach(id => {
    document.getElementById(`row-${id}`)?.classList.remove('selected')
    const row = document.getElementById(`row-${id}`)
    if (row) row.querySelector('input[type=checkbox]').checked = false
  })
  selectedIds.clear()
  document.getElementById('check-all').checked = false
  updateBulkBar()
}

function updateBulkBar() {
  const bar    = document.getElementById('bulk-bar')
  const errEl  = document.getElementById('bulk-error')
  const advBtn = document.getElementById('bulk-advance-btn')
  if (selectedIds.size === 0) { bar.classList.remove('show'); return }
  bar.classList.add('show')
  document.getElementById('bulk-count').textContent = selectedIds.size

  const selected = [...selectedIds].map(id => allTickets.find(t => t.id === id)).filter(Boolean)
  const stages   = [...new Set(selected.map(t => t.stage))]

  if (stages.length > 1) {
    errEl.textContent = '⚠️ Mixed stages — select tickets at the same stage only'
    advBtn.disabled = true; advBtn.textContent = 'Advance →'
  } else if (stages.length === 1 && !STAGES[stages[0]]?.next) {
    errEl.textContent = '⚠️ Already at final stage'
    advBtn.disabled = true; advBtn.textContent = 'Advance →'
  } else if (stages.length === 1) {
    errEl.textContent = ''
    advBtn.disabled = false
    advBtn.textContent = `${STAGES[stages[0]].nextLabel} (${selectedIds.size}) →`
  }
}

function promptBulkAdvance() {
  const selected = [...selectedIds].map(id => allTickets.find(t => t.id === id)).filter(Boolean)
  const stages   = [...new Set(selected.map(t => t.stage))]
  if (stages.length !== 1) return
  const nextStage = STAGES[stages[0]].next
  if (!nextStage) return
  const nums = selected.map(t => t.ticket_number).join(', ')
  pendingAdvance = { bulk: true, ids: [...selectedIds], nextStage }
  document.getElementById('confirm-num').textContent = `${selectedIds.size} tickets`
  document.getElementById('confirm-sub').textContent = `#${nums}`
  document.getElementById('confirm-stage').textContent = STAGES[stages[0]].nextLabel
  document.getElementById('confirm-overlay').classList.add('show')
}

function promptAdvance(id, num, nextStage, nextLabel) {
  pendingAdvance = { id, num, nextStage }
  document.getElementById('confirm-num').textContent = num
  document.getElementById('confirm-sub').textContent = 'Advance to:'
  document.getElementById('confirm-stage').textContent = nextLabel
  document.getElementById('confirm-overlay').classList.add('show')
}

function closeConfirm() { document.getElementById('confirm-overlay').classList.remove('show'); }
 
async function confirmAdvance() {
  if (!pendingAdvance) return
  const btn = document.getElementById('confirm-yes')
  btn.disabled = true; btn.textContent = '...'
  closeConfirm()

  const { nextStage } = pendingAdvance
  const ids = pendingAdvance.bulk ? pendingAdvance.ids : [pendingAdvance.id]

  const { error } = await sb.from('clay_tickets')
    .update({ stage: nextStage })
    .in('id', ids)
  btn.disabled = false; btn.textContent = 'Confirm'
  if (error) { showToast('Error — try again'); return }

  // Email trigger
  if (STAGES[nextStage]?.emailTrigger) {
    const affected = allTickets.filter(t => ids.includes(t.id))
    const emails   = [...new Set(affected.flatMap(t => (t.signin_entries||[]).filter(c=>c.email).map(c=>c.email)))]
    if (emails.length) {
      // Call Edge Function for each ticket
      for (const t of affected) {
        const ticketEmails = (t.signin_entries||[]).filter(c=>c.email).map(c=>c.email)
        if (!ticketEmails.length) continue
        const fnName = nextStage === 'bisque_ready' ? 'send-bisque-email' : 'send-pickup-email'
        fetch(`https://snxibhbhhchjthfmjtaj.supabase.co/functions/v1/${fnName}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json',
            'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNueGliaGJoaGNoanRoZm1qdGFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTk2ODAsImV4cCI6MjA5MjYzNTY4MH0.K-89Mx4SxU6N1hMmtK6Q79rWAtk6VTN9b5wemQxcZVA' },
          body: JSON.stringify({
            emails: ticketEmails,
            ticketNumber: t.ticket_number,
            studioId: studioId,
            description: t.description || ''
          })
        }).catch(err => console.error('Email send error:', err))
      }
      const b = document.getElementById('email-banner')
      b.textContent = `📧 Email sent to: ${emails.join(', ')}`
      b.classList.add('show'); clearTimeout(b._t); b._t = setTimeout(() => b.classList.remove('show'), 6000)
    }
  }

  const nums = ids.map(id => allTickets.find(t => t.id === id)?.ticket_number).filter(Boolean).join(', ')
  showToast(`${ids.length > 1 ? ids.length + ' tickets' : '#' + nums} → ${STAGES[nextStage].label}`)
  ids.forEach(id => { const t = allTickets.find(t => t.id === id); if (t) t.stage = nextStage })
  clearSelection(); renderTable()
  pendingAdvance = null
}

function fmtDate(d) {
  if (!d) return '—'
  const dt = d.includes('T') ? new Date(d) : new Date(d + 'T12:00:00')
  return dt.toLocaleDateString('en-CA', { month:'short', day:'numeric', year:'numeric' })
}

async function updateGlazedOn(id, date) {
  const { error } = await sb.from('clay_tickets').update({ glazed_on: date || null }).eq('id', id)
  if (error) { showToast('Error saving date'); return }
  const t = allTickets.find(t => t.id === id)
  if (t) t.glazed_on = date || null
  showToast('Glazed date saved')
} 
 
function showToast(msg, ms=2500) {
  const t = document.getElementById('toast')
  t.textContent = msg; t.classList.add('show')
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), ms)
}
