<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lockboxes">
<title>Lockboxes</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #eef1f0;
    color: #17201d;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.4;
    -webkit-text-size-adjust: 100%;
  }
  button, input { font-family: inherit; font-size: inherit; }

  /* ---- PIN screen ---- */
  #pin-screen { max-width: 360px; margin: 0 auto; padding: 56px 24px 24px; }
  #pin-screen h1 { font-size: 28px; margin: 0 0 4px; font-weight: 700; }
  #pin-screen p { margin: 0 0 24px; color: #56605c; }
  #pin {
    display: block; width: 100%; height: 64px;
    font-size: 32px; letter-spacing: 10px; text-align: center;
    border: 2px solid #b9c3bf; border-radius: 10px; background: #fff; color: #17201d;
    -webkit-appearance: none; appearance: none;
  }
  #pin:focus { outline: none; border-color: #0f5c56; }
  #unlock {
    display: block; width: 100%; height: 56px; margin-top: 12px;
    background: #0f5c56; color: #fff; border: 0; border-radius: 10px;
    font-size: 18px; font-weight: 600; -webkit-appearance: none;
  }
  #unlock[disabled] { opacity: 0.6; }
  #pin-msg { min-height: 24px; margin-top: 14px; color: #a3261b; font-weight: 600; text-align: center; }

  /* ---- List screen ---- */
  #list-screen { display: none; }
  .bar {
    position: -webkit-sticky; position: sticky; top: 0; z-index: 2;
    background: #eef1f0; padding: 10px 12px; border-bottom: 1px solid #d3dad7;
  }
  .bar-row { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
  #search {
    -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; min-width: 0;
    height: 46px; padding: 0 14px; border: 2px solid #b9c3bf; border-radius: 10px;
    background: #fff; color: #17201d; -webkit-appearance: none;
  }
  #search:focus { outline: none; border-color: #0f5c56; }
  #lock {
    margin-left: 10px; height: 46px; padding: 0 14px;
    background: #fff; color: #17201d; border: 2px solid #b9c3bf; border-radius: 10px;
    font-weight: 600; -webkit-appearance: none;
  }

  .prov { margin: 22px 16px 6px; font-size: 14px; font-weight: 700; color: #56605c; }
  .studio { background: #fff; border-top: 1px solid #dfe5e2; padding: 14px 16px; }
  .studio:last-child { border-bottom: 1px solid #dfe5e2; }
  .top { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-align-items: baseline; align-items: baseline; }
  .name { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; min-width: 0; font-size: 18px; font-weight: 600; padding-right: 12px; }
  .code {
    font-size: 32px; font-weight: 800; letter-spacing: 2px; color: #0f5c56;
    font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right;
  }
  .code.long { font-size: 20px; letter-spacing: 0; white-space: normal; max-width: 55%; }
  .code.none { font-size: 15px; font-weight: 600; letter-spacing: 0; color: #a3261b; }
  .where { margin-top: 4px; color: #17201d; }
  .addr { margin-top: 2px; font-size: 14px; color: #6b7571; }
  #empty { padding: 32px 16px; color: #56605c; text-align: center; display: none; }
  .foot { padding: 24px 16px 40px; font-size: 13px; color: #6b7571; text-align: center; }
</style>
</head>
<body>

<div id="pin-screen">
  <h1>Lockboxes</h1>
  <p>Enter the admin PIN to see studio lockbox codes.</p>
  <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="12" aria-label="Admin PIN">
  <button id="unlock" type="button">Unlock</button>
  <div id="pin-msg" role="alert"></div>
</div>

<div id="list-screen">
  <div class="bar">
    <div class="bar-row">
      <input id="search" type="search" placeholder="Search studio or street" autocomplete="off" aria-label="Search studios">
      <button id="lock" type="button">Lock</button>
    </div>
  </div>
  <div id="list"></div>
  <div id="empty">No studio matches that search.</div>
  <div class="foot">Locks itself after 5 minutes without use.</div>
</div>

<script>
(function () {
  var FN_URL = 'https://snxibhbhhchjthfmjtaj.supabase.co/functions/v1/lockbox-lookup';
  // Public anon key (same one admin.html uses). The codes themselves are only
  // returned by the Edge Function after the PIN is checked on the server.
  var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNueGliaGJoaGNoanRoZm1qdGFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTk2ODAsImV4cCI6MjA5MjYzNTY4MH0.K-89Mx4SxU6N1hMmtK6Q79rWAtk6VTN9b5wemQxcZVA';
  var IDLE_MS = 5 * 60 * 1000;
  var PROVINCES = { BC: 'British Columbia', AB: 'Alberta', ON: 'Ontario' };

  var studios = [];
  var lastActive = 0;

  function $(id) { return document.getElementById(id); }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function unlock() {
    var pin = $('pin').value.replace(/\s/g, '');
    if (!pin) { $('pin-msg').innerHTML = 'Enter the PIN.'; return; }
    $('unlock').disabled = true;
    $('unlock').innerHTML = 'Checking…';
    $('pin-msg').innerHTML = '';

    var xhr = new XMLHttpRequest();
    xhr.open('POST', FN_URL, true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.setRequestHeader('apikey', ANON_KEY);
    xhr.setRequestHeader('Authorization', 'Bearer ' + ANON_KEY);
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      $('unlock').disabled = false;
      $('unlock').innerHTML = 'Unlock';
      var data = null;
      try { data = JSON.parse(xhr.responseText); } catch (e) {}
      if (xhr.status === 200 && data && data.studios) {
        studios = data.studios;
        $('pin').value = '';
        showList();
      } else {
        $('pin-msg').innerHTML = esc((data && data.error) || 'Could not connect. Check your signal and try again.');
        $('pin').value = '';
      }
    };
    xhr.send(JSON.stringify({ pin: pin }));
  }

  function showList() {
    $('pin-screen').style.display = 'none';
    $('list-screen').style.display = 'block';
    $('search').value = '';
    render('');
    touch();
  }

  function lock() {
    studios = [];
    $('list').innerHTML = '';
    $('search').value = '';
    $('list-screen').style.display = 'none';
    $('pin-screen').style.display = 'block';
    $('pin-msg').innerHTML = '';
  }

  function render(q) {
    q = (q || '').toLowerCase();
    var html = '';
    var shown = 0;
    var currentProv = '';
    for (var i = 0; i < studios.length; i++) {
      var s = studios[i];
      if (q && (s.name + ' ' + s.address + ' ' + s.studio_id).toLowerCase().indexOf(q) === -1) continue;
      if (s.province !== currentProv) {
        if (currentProv) html += '</div>';
        currentProv = s.province;
        html += '<div class="prov">' + esc(PROVINCES[s.province] || s.province) + '</div><div>';
      }
      var where = [s.location, s.type ? s.type.toLowerCase() : ''];
      var whereText = '';
      for (var j = 0; j < where.length; j++) {
        if (where[j]) whereText += (whereText ? ', ' : '') + where[j];
      }
      html += '<div class="studio">' +
        '<div class="top"><div class="name">' + esc(s.name) + '</div>' +
        (s.code ? '<div class="code' + (s.code.length > 8 ? ' long' : '') + '">' + esc(s.code) + '</div>' : '<div class="code none">No code on file</div>') +
        '</div>' +
        (whereText ? '<div class="where">' + esc(whereText) + '</div>' : '') +
        (s.address ? '<div class="addr">' + esc(s.address) + '</div>' : '') +
        '</div>';
      shown++;
    }
    if (currentProv) html += '</div>';
    $('list').innerHTML = html;
    $('empty').style.display = shown ? 'none' : 'block';
  }

  function touch() { lastActive = new Date().getTime(); }

  setInterval(function () {
    if (studios.length && new Date().getTime() - lastActive > IDLE_MS) lock();
  }, 15000);

  $('unlock').onclick = unlock;
  $('pin').onkeyup = function (e) { if ((e.keyCode || e.which) === 13) unlock(); };
  $('lock').onclick = lock;
  $('search').oninput = function () { render(this.value); touch(); };
  $('search').onkeyup = function () { render(this.value); touch(); }; // older browsers without oninput
  document.ontouchstart = touch;
  document.onclick = touch;
  window.onscroll = touch;

  // Clear the codes if the phone was put away for a while
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && studios.length && new Date().getTime() - lastActive > IDLE_MS) lock();
  });
})();
</script>
</body>
</html>
