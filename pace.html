<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="https://cdn.shopify.com/s/files/1/1451/3756/files/favicon_black_512x512_9c6dd2c0-fdcd-4575-887e-bf65538803af.png?v=1631720337">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4Cats Studio Pace</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root { --bg: #f5f5f0; --panel: #ffffff; --ink: #1a1a1a; --muted: #888; --line: #e0e0d8; --line-2: #d0d0c8; }
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); font-size: 14px; }
.wrap { padding: 1.25rem; }
.panel { background: var(--panel); border: 0.5px solid var(--line); border-radius: 12px; padding: 16px 18px; }
.btn { padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; border: 0.5px solid var(--line-2); background: #fff; height: 32px; }
.btn:hover { background: var(--bg); }
.btn:disabled { opacity: 0.6; cursor: default; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
h1 { font-size: 20px; margin: 0; }
#login-screen { max-width: 340px; margin: 12vh auto; }
#login-screen input { width: 100%; padding: 9px 10px; margin: 6px 0 10px; border: 0.5px solid var(--line-2); border-radius: 6px; font-size: 14px; }
#login-screen button { width: 100%; height: 38px; }
#error-msg { display: none; color: #c0392b; font-size: 13px; margin-top: 10px; }
.legend { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; margin: 14px 0; }
.legend span { padding: 3px 10px; border-radius: 9px; }
.board { background: var(--panel); border: 0.5px solid var(--line); border-radius: 12px; overflow: hidden; max-width: 900px; }
.row { display: grid; grid-template-columns: 52px 1fr 220px 90px; align-items: center; gap: 12px; padding: 9px 16px; border-bottom: 0.5px solid var(--line); }
.row:last-child { border-bottom: 0; }
.rank { font-size: 18px; font-weight: 800; color: var(--muted); text-align: center; }
.rank.top { color: var(--ink); }
.studio { font-weight: 700; text-transform: uppercase; font-size: 13px; }
.sub { font-size: 11px; color: var(--muted); margin-top: 2px; font-weight: 400; text-transform: none; }
.bar { height: 12px; border-radius: 6px; background: #efefea; overflow: hidden; }
.bar > div { height: 100%; border-radius: 6px; }
.pct { font-size: 18px; font-weight: 800; text-align: right; padding: 3px 8px; border-radius: 8px; }
.seg { display: inline-flex; border: 0.5px solid var(--line-2); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: #fff; padding: 7px 16px; font-size: 13px; cursor: pointer; }
.seg button.on { background: var(--ink); color: #fff; font-weight: 600; }
@media (max-width: 640px) { .row { grid-template-columns: 36px 1fr 74px; } .bar { display: none; } }
.loading { padding: 30px; text-align: center; color: var(--muted); }
</style>
</head>
<body>

<div id="login-screen" class="panel">
  <h1>4Cats Studio Pace</h1>
  <p class="muted small">Home office sign in</p>
  <label class="small">Email</label>
  <input id="email-input" type="email" autocomplete="username">
  <label class="small">Password</label>
  <input id="password-input" type="password" autocomplete="current-password">
  <button class="btn" onclick="signIn()">Sign in</button>
  <div id="error-msg"></div>
</div>

<div id="app-screen" style="display:none" class="wrap">
  <div class="toolbar" style="margin-bottom:6px">
    <h1>Studio Pace</h1>
    <input type="month" id="month-picker" class="btn" onchange="pickMonth(this.value)" aria-label="Pick a month">
    <div id="day-label" style="font-weight:700;min-width:150px"></div>
    <button class="btn" id="refresh-btn" onclick="loadPace()" style="font-weight:600">⟳ Refresh</button>
    <span class="muted small" id="updated-label"></span>
    <span style="margin-left:auto"></span>
    <select id="order-select" class="btn" onchange="orderMode = this.value; render()">
      <option value="best">Best first</option>
      <option value="worst">Needs attention first</option>
    </select>
    <button class="btn" onclick="signOut()">Sign out</button>
  </div>
  <div id="legend" class="legend"></div>
  <div id="pace-body"><div class="loading">Loading…</div></div>
  <p class="muted small" style="margin-top:14px;max-width:900px;line-height:1.5" id="explain"></p>
</div>

<script>
const SUPABASE_URL = 'https://snxibhbhhchjthfmjtaj.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNueGliaGJoaGNoanRoZm1qdGFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTk2ODAsImV4cCI6MjA5MjYzNTY4MH0.K-89Mx4SxU6N1hMmtK6Q79rWAtk6VTN9b5wemQxcZVA'
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

const STUDIO_NAMES = {
  'BC-RICH-GC':'Richmond - Garden City','BC-RICH-STV':'Richmond - Steveston','BC-SUR-SSR':'Surrey - South',
  'BC-YVR-KIT':'Vancouver - Kitsilano','BC-YVR-MS':'Vancouver - Main Street','BC-YVR-UBC':'Vancouver - UBC',
  'BC-YYJ-CSV':'Victoria - Cook Street Village','BC-YYJ-ESQ':'Victoria - Esquimalt','BC-YYJ-OB':'Victoria - Oak Bay',
  'BC-YYJ-VIC':'Victoria - Uptown','AB-YYC-ING':'Calgary - Inglewood','AB-STA-STA':'St Albert',
  'ON-BRL-BRL':'Burlington - South','ON-CMB-GLT':'Cambridge - Galt','ON-ERN-ERN':'Erin',
  'ON-HAM-OS':'Hamilton - Ottawa Street','ON-HAM-WD':'Hamilton - Waterdown','ON-HAM-WH':'Hamilton - West Harbour',
  'ON-KGN-AP':'Kingston - Arlington Park','ON-LDN-BYR':'London - Byron','ON-LDN-WVG':'London - Wortley Village',
  'ON-MIS-PC':'Mississauga - Port Credit','ON-OAK-OAK':'Oakville - North','ON-OAK-WST':'Oakville - West',
  'ON-YOW-GLB':'Ottawa - The Glebe','ON-STC-STC':'St Catharines','ON-YYZ-AVE':'Toronto - Avenue Road',
  'ON-YYZ-BP':'Toronto - Baby Point','ON-YYZ-LEA':'Toronto - Leaside','ON-YYZ-BEA':'Toronto - The Beaches',
  'ON-WTR-WTR':'Waterloo - Uptown'
}
const STUDIO_IDS = Object.keys(STUDIO_NAMES)

const PACE_TIERS = [
  { min: -Infinity, max: 10,  label: 'Closed',          note: 'less than 10%',             bg: '#d32f2f', fg: '#fff' },
  { min: 10,        max: 50,  label: 'SOS',             note: 'needs immediate attention · 10–50%', bg: '#f57c00', fg: '#fff' },
  { min: 50,        max: 80,  label: 'Action plan',     note: '50–80% of goal',            bg: '#75fcfd', fg: '#000' },
  { min: 80,        max: 100, label: 'Planned growth',  note: '80–100% of goal',           bg: '#75fc4c', fg: '#000' },
  { min: 100,       max: Infinity, label: 'All good',   note: 'over goal',                 bg: '#e0218a', fg: '#fff' },
]
function paceTier(pct) {
  if (pct == null || isNaN(Number(pct))) return null
  const v = Number(pct)
  if (v > 100) return PACE_TIERS[4]
  if (v >= 80) return PACE_TIERS[3]
  if (v >= 50) return PACE_TIERS[2]
  if (v >= 10) return PACE_TIERS[1]
  return PACE_TIERS[0]
}


function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])) }

// "Today" in Pacific time (finance days end at midnight Pacific)
function pacificToday() {
  const p = new Date().toLocaleDateString('en-CA', { timeZone: 'Etc/GMT+7' /* BC: UTC−7 year-round from Nov 1, 2026 */ }).split('-').map(Number)
  return new Date(p[0], p[1] - 1, p[2])
}
let viewMode = 'month'          // month view only (Today/Day views removed)
let pickedDay = pacificToday()   // used by Day view
let pickedMonth = new Date(pacificToday().getFullYear(), pacificToday().getMonth(), 1) // used by Month view
let currentDay = pacificToday()  // the "as of" day sent to the database
let orderMode = 'best'   // 'best' | 'worst'
let rows = []            // [{ studio_id, day_pct, month_pace_pct, month_goal_pct }]

function dayToText(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') }
function isToday(d) { return dayToText(d) === dayToText(pacificToday()) }

/* ---------- auth ---------- */
sb.auth.getSession().then(({ data: { session } }) => { if (session) initApp(session.user) })
document.getElementById('password-input').addEventListener('keydown', e => { if (e.key === 'Enter') signIn() })

async function signIn() {
  const email = document.getElementById('email-input').value.trim()
  const password = document.getElementById('password-input').value
  const errEl = document.getElementById('error-msg')
  errEl.style.display = 'none'
  const { data, error } = await sb.auth.signInWithPassword({ email, password })
  if (error) { errEl.textContent = error.message; errEl.style.display = 'block'; return }
  initApp(data.user)
}

async function signOut() { await sb.auth.signOut(); location.reload() }

async function initApp(user) {
  const { data: mapping } = await sb.from('studio_users').select('role').eq('user_id', user.id).maybeSingle()
  if (!mapping || (mapping.role !== 'admin' && mapping.role !== 'pace_viewer')) {
    const errEl = document.getElementById('error-msg')
    errEl.textContent = 'This account does not have access to Studio Pace.'; errEl.style.display = 'block'
    await sb.auth.signOut(); return
  }
  document.getElementById('login-screen').style.display = 'none'
  document.getElementById('app-screen').style.display = 'block'
  document.getElementById('legend').innerHTML = PACE_TIERS.map(t =>
    `<span style="background:${t.bg};color:${t.fg}"><b>${esc(t.label)}</b> · ${esc(t.note)}</span>`).join('')
  setView()
}

/* ---------- navigation ---------- */
// Month pace as of the end of the picked month (or as of today for this month).
function setView() {
  viewMode = 'month'
  const today = pacificToday()
  const mp = document.getElementById('month-picker')
  mp.max = dayToText(today).slice(0, 7)
  mp.value = dayToText(pickedMonth).slice(0, 7)
  const monthEnd = new Date(pickedMonth.getFullYear(), pickedMonth.getMonth() + 1, 0)
  currentDay = monthEnd > today ? today : monthEnd
  loadPace()
}
function pickMonth(value) {
  if (!value) return
  const p = value.split('-').map(Number)
  pickedMonth = new Date(p[0], p[1] - 1, 1)
  setView('month')
}

/* ---------- data ---------- */
async function loadPace() {
  const btn = document.getElementById('refresh-btn')
  btn.disabled = true; btn.textContent = '⟳ Refreshing…'
  document.getElementById('day-label').textContent = viewMode === 'month'
    ? currentDay.toLocaleDateString('en-US', { month: 'long', year: 'numeric' }) + (isToday(currentDay) ? ' (so far)' : '')
    : currentDay.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })
  const dayText = dayToText(currentDay)
  const { data, error } = await sb.rpc('get_pace_leaderboard', { p_day: dayText })
  btn.disabled = false; btn.textContent = '⟳ Refresh'
  if (dayToText(currentDay) !== dayText) return // day changed while loading
  if (error) {
    document.getElementById('pace-body').innerHTML = `<div class="panel" style="color:#c0392b">Couldn't load pace: ${esc(error.message)}</div>`
    return
  }
  rows = (data || []).map(r => ({
    studio_id: r.studio_id,
    day_pct: r.day_pct == null ? null : Number(r.day_pct),
    month_pace_pct: r.month_pace_pct == null ? null : Number(r.month_pace_pct),
    month_goal_pct: r.month_goal_pct == null ? null : Number(r.month_goal_pct),
  }))
  document.getElementById('updated-label').textContent = 'Updated ' + new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })
  render()
}

/* ---------- render ---------- */
function render() {
  const metric = viewMode === 'month' ? 'month_pace_pct' : 'day_pct'
  const byId = {}
  rows.forEach(r => { byId[r.studio_id] = r })
  const list = STUDIO_IDS.map(id => byId[id] || { studio_id: id, day_pct: null, month_pace_pct: null, month_goal_pct: null })
  const dir = orderMode === 'best' ? -1 : 1
  list.sort((a, b) => {
    const va = a[metric], vb = b[metric]
    if (va == null && vb == null) return STUDIO_NAMES[a.studio_id].localeCompare(STUDIO_NAMES[b.studio_id])
    if (va == null) return 1
    if (vb == null) return -1
    return (va - vb) * dir
  })

  // Rank 1 = best, always; ties share a rank
  const ranked = list.filter(r => r[metric] != null).slice().sort((a, b) => b[metric] - a[metric])
  const rankOf = {}
  ranked.forEach((r, i) => { rankOf[r.studio_id] = (i > 0 && ranked[i - 1][metric] === r[metric]) ? rankOf[ranked[i - 1].studio_id] : i + 1 })

  const dayWord = isToday(currentDay) ? 'today' : currentDay.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
  const html = list.map(r => {
    const v = r[metric]
    const t = paceTier(v)
    const rank = rankOf[r.studio_id]
    const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : (rank ? rank : '—')
    const barW = v == null ? 0 : Math.max(2, Math.min(100, v / 1.5))  // bar full at 150%
    const sub = viewMode !== 'month'
      ? (r.month_pace_pct == null ? '' : `Month pace ${r.month_pace_pct}%`)
      : (r.month_goal_pct == null ? '' : `${r.month_goal_pct}% of the full month's goal reached`)
    return `<div class="row">
      <div class="rank ${rank && rank <= 3 ? 'top' : ''}">${medal}</div>
      <div class="studio">${esc(STUDIO_NAMES[r.studio_id])}<div class="sub">${esc(sub)}</div></div>
      <div class="bar"><div style="width:${barW}%;background:${t ? t.bg : 'transparent'}"></div></div>
      <div class="pct" style="${t ? `background:${t.bg};color:${t.fg}` : 'color:var(--muted)'}">${v == null ? '—' : v + '%'}</div>
    </div>`
  }).join('')
  document.getElementById('pace-body').innerHTML = `<div class="board">${html}</div>`

  document.getElementById('explain').innerHTML = viewMode !== 'month'
    ? `<b>${viewMode === 'today' ? 'Today' : 'Day'}</b> = ${esc(dayWord)}'s sales compared with the studio's daily goal (monthly goal ÷ days in the month). 100% = hit the daily goal.${isToday(currentDay) ? ' Today is still in progress, so this climbs through the day.' : ''}`
    : `<b>Month</b> = month-to-date sales compared with where the studio needs to be by ${esc(dayWord)} to hit its monthly goal. 100% = exactly on track. The smaller number shows how much of the full month's goal is already reached.`
}
</script>
</body>
</html>
