<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4Cats Party Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f5f5f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

    /* ── Login ── */
    #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
    .login-card { background: white; border-radius: 12px; border: 1px solid #e0e0d8; padding: 2rem; width: 100%; max-width: 360px; }
    .login-logo { font-size: 22px; font-weight: 800; color: #f0c040; letter-spacing: 1px; text-align: center; margin-bottom: 4px; }
    .login-sub { font-size: 13px; color: #888; text-align: center; margin-bottom: 1.5rem; }
    .login-card input { width: 100%; padding: 10px 12px; border: 1px solid #d0d0c8; border-radius: 8px; font-size: 14px; margin-bottom: 10px; outline: none; font-family: inherit; }
    .login-card input:focus { border-color: #99354e; }
    .login-card button { width: 100%; padding: 10px; background: #1a1a2e; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-family: inherit; }
    .error-msg { color: #c0392b; font-size: 13px; margin-top: 10px; display: none; }

    /* ── App ── */
    #app-screen { display: none; }

    .app-header { background: #1a1a2e; color: white; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
    .app-header-left .logo { font-size: 18px; font-weight: 800; color: #f0c040; letter-spacing: 1px; }
    .app-header-left .studio { font-size: 13px; color: #aaa; margin-top: 2px; }
    .signout-btn { background: none; border: 1px solid #555; color: #aaa; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }

    .session-bar { background: white; border-bottom: 1px solid #e0e0d8; padding: 12px 20px; display: flex; align-items: center; gap: 10px; }
    .session-bar label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
    .select-wrap { position: relative; flex: 1; }
    .select-wrap select { width: 100%; padding: 9px 32px 9px 12px; border: 1.5px solid #d0d0c8; border-radius: 8px; font-size: 14px; outline: none; font-family: inherit; background: white; color: #1a1a2e; -webkit-appearance: none; appearance: none; }
    .select-wrap::after { content: '▾'; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: #888; pointer-events: none; }
    .refresh-btn { padding: 8px 14px; border-radius: 8px; border: 1.5px solid #d0d0c8; background: white; font-size: 13px; color: #555; cursor: pointer; white-space: nowrap; font-family: inherit; }

    .main { padding: 16px; max-width: 700px; margin: 0 auto; }

    .placeholder { text-align: center; padding: 60px 20px; color: #aaa; font-size: 14px; }
    .no-party { text-align: center; padding: 60px 20px; color: #888; font-size: 15px; }

    /* ── Cards ── */
    .card { background: white; border-radius: 12px; border: 1px solid #e0e0d8; padding: 18px; margin-bottom: 14px; }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .card-title { font-size: 14px; font-weight: 700; color: #1a1a2e; }
    .card-badge { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 20px; background: #e8f5e9; color: #2e7d32; }

    /* ── Stats ── */
    .stat-row { display: flex; gap: 12px; margin-bottom: 14px; }
    .stat-box { flex: 1; background: #f9f9f6; border-radius: 10px; padding: 14px; text-align: center; }
    .stat-num { font-size: 36px; font-weight: 900; color: #1a1a2e; line-height: 1; }
    .stat-num.green { color: #2e7d32; }
    .stat-num.amber { color: #e65100; }
    .stat-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }

    /* ── Info grid ── */
    .info-grid { display: flex; flex-wrap: wrap; gap: 12px; }
    .info-item { flex: 1 1 140px; }
    .info-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
    .info-value { font-size: 14px; color: #1a1a2e; font-weight: 500; }
    .info-value a { color: #2d6a9f; text-decoration: none; }

    /* ── Notes ── */
    .notes-box { background: #fffbea; border: 1px solid #ffe082; border-radius: 8px; padding: 12px 14px; font-size: 14px; color: #5d3a00; line-height: 1.6; }

    /* ── Check-in list ── */
    .checkin-list { list-style: none; }
    .checkin-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f0f0e8; }
    .checkin-item:last-child { border-bottom: none; }
    .checkin-avatar { width: 34px; height: 34px; border-radius: 50%; background: #99354e; color: white; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .checkin-name { font-size: 14px; color: #1a1a2e; font-weight: 500; }
    .checkin-email { font-size: 12px; color: #888; margin-top: 1px; }
    .checkin-empty { text-align: center; padding: 20px; color: #aaa; font-size: 14px; }

    .refresh-bar { text-align: center; font-size: 12px; color: #aaa; padding: 8px 0 16px; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">4CATS</div>
    <div class="login-sub">Party Staff Dashboard</div>
    <input type="email" id="email-input" placeholder="Email address">
    <input type="password" id="password-input" placeholder="Password">
    <button id="signin-btn">Sign in</button>
    <div class="error-msg" id="error-msg"></div>
  </div>
</div>

<!-- APP -->
<div id="app-screen">
  <div class="app-header">
    <div class="app-header-left">
      <div class="logo">4CATS</div>
      <div class="studio" id="studio-name">Loading...</div>
    </div>
    <button class="signout-btn" onclick="signOut()">Sign out</button>
  </div>

  <div class="session-bar">
    <label>Party:</label>
    <div class="select-wrap">
      <select id="session-select" onchange="onSessionChange()">
        <option value="">Loading...</option>
      </select>
    </div>
    <button class="refresh-btn" onclick="refreshCheckins()">↻ Refresh</button>
  </div>

  <div class="main">
    <div class="placeholder" id="placeholder">
      <div style="font-size:40px;margin-bottom:12px">☝️</div>
      <div>Select a party above to view details.</div>
    </div>

    <div class="no-party" id="no-party" style="display:none">
      <div style="font-size:40px;margin-bottom:12px">🎨</div>
      <div>No parties found for today at this studio.</div>
    </div>

    <div id="dashboard" style="display:none">

      <div class="stat-row">
        <div class="stat-box">
          <div class="stat-num" id="stat-booked">—</div>
          <div class="stat-label">Spots Booked</div>
        </div>
        <div class="stat-box">
          <div class="stat-num green" id="stat-checkedin">—</div>
          <div class="stat-label">Checked In</div>
        </div>
        <div class="stat-box">
          <div class="stat-num amber" id="stat-remaining">—</div>
          <div class="stat-label">Not Yet In</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><div class="card-title">🎉 Party Details</div></div>
        <div class="info-grid" id="party-info-grid"></div>
      </div>

      <div class="card">
        <div class="card-header"><div class="card-title">📞 Host Contact</div></div>
        <div class="info-grid" id="host-info-grid"></div>
      </div>

      <div class="card" id="notes-card" style="display:none">
        <div class="card-header"><div class="card-title">📝 Notes &amp; Allergies</div></div>
        <div class="notes-box" id="notes-content"></div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">✅ Checked In</div>
          <div class="card-badge" id="checkin-badge">0</div>
        </div>
        <ul class="checkin-list" id="checkin-list">
          <li class="checkin-empty">Loading...</li>
        </ul>
      </div>

      <div class="refresh-bar" id="refresh-bar">Auto-refreshes every 30 seconds</div>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://snxibhbhhchjthfmjtaj.supabase.co'
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNueGliaGJoaGNoanRoZm1qdGFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTk2ODAsImV4cCI6MjA5MjYzNTY4MH0.K-89Mx4SxU6N1hMmtK6Q79rWAtk6VTN9b5wemQxcZVA'
  const { createClient } = supabase
  const sb = createClient(SUPABASE_URL, SUPABASE_KEY)

  let currentUser = null
  let currentStudioId = null
  let currentSessionId = null
  let currentBooking = null
  let refreshTimer = null

  // ── Auth ────────────────────────────────────────────────────
  document.getElementById('signin-btn').addEventListener('click', signIn)
  document.getElementById('password-input').addEventListener('keydown', e => { if (e.key === 'Enter') signIn() })

  sb.auth.getSession().then(({ data: { session } }) => {
    if (session) { currentUser = session.user; loadApp() }
  })

  async function signIn() {
    const email    = document.getElementById('email-input').value.trim()
    const password = document.getElementById('password-input').value
    const errEl    = document.getElementById('error-msg')
    errEl.style.display = 'none'
    if (!email || !password) { errEl.textContent = 'Please enter your email and password.'; errEl.style.display = 'block'; return }
    try {
      const { data, error } = await sb.auth.signInWithPassword({ email, password })
      if (error) { errEl.textContent = error.message; errEl.style.display = 'block'; return }
      currentUser = data.user
      await loadApp()
    } catch (e) {
      errEl.textContent = 'Unexpected error: ' + (e?.message || String(e))
      errEl.style.display = 'block'
    }
  }

  async function signOut() {
    await sb.auth.signOut()
    clearInterval(refreshTimer)
    currentUser = null; currentStudioId = null; currentSessionId = null
    document.getElementById('login-screen').style.display = 'flex'
    document.getElementById('app-screen').style.display = 'none'
  }

  // ── App load ─────────────────────────────────────────────────
  async function loadApp() {
    const { data: mapping } = await sb.from('studio_users').select('studio_id').eq('user_id', currentUser.id).single()
    if (!mapping) { alert('No studio linked to this account.'); return }
    const { data: studio } = await sb.from('studios').select('name').eq('id', mapping.studio_id).single()
    currentStudioId = mapping.studio_id
    document.getElementById('studio-name').textContent = studio?.name || currentStudioId
    document.getElementById('login-screen').style.display = 'none'
    document.getElementById('app-screen').style.display = 'block'
    await loadSessions()
  }

  // ── Helpers ──────────────────────────────────────────────────
  function today() {
    const d = new Date()
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`
  }

  function fmtTime(t) {
    if (!t) return ''
    const [h, m] = t.split(':').map(Number)
    const ampm = h >= 12 ? 'pm' : 'am'
    const h12  = h % 12 || 12
    return m === 0 ? `${h12}${ampm}` : `${h12}:${String(m).padStart(2,'0')}${ampm}`
  }

  function firstLastInitial(name) {
    if (!name) return ''
    const parts = name.trim().split(' ')
    return parts.length === 1 ? parts[0] : `${parts[0]} ${parts[parts.length-1][0]}.`
  }

  function infoItem(label, value, href) {
    if (!value) return ''
    const val = href ? `<a href="${href}${value}">${value}</a>` : value
    return `<div class="info-item"><div class="info-label">${label}</div><div class="info-value">${val}</div></div>`
  }

  // ── Sessions ─────────────────────────────────────────────────
  async function loadSessions() {
    const t = today()

    const { data: sessions } = await sb
      .from('sessions')
      .select('id, title, session_time')
      .eq('studio_id', currentStudioId)
      .eq('session_date', t)
      .ilike('session_type', '%party%')
      .order('session_time')

    if (!sessions?.length) {
      document.getElementById('no-party').style.display = 'block'
      document.getElementById('placeholder').style.display = 'none'
      document.getElementById('session-select').innerHTML = '<option value="">No parties today</option>'
      return
    }

    const ids = sessions.map(s => s.id)
    const { data: bookings } = await sb
      .from('bookings')
      .select('id, session_id, customer_name, customer_email, customer_phone, qty')
      .in('session_id', ids)
      .gt('qty', 0)

    const bookedMap = {}
    ;(bookings || []).forEach(b => { bookedMap[b.session_id] = b })
    const withBookings = sessions.filter(s => bookedMap[s.id])

    if (!withBookings.length) {
      document.getElementById('no-party').style.display = 'block'
      document.getElementById('placeholder').style.display = 'none'
      document.getElementById('session-select').innerHTML = '<option value="">No parties today</option>'
      return
    }

    // Get party_details for friendly names
    const bookingIds = (bookings || []).map(b => b.id)
    const { data: partyDetails } = await sb
      .from('party_details')
      .select('booking_id, party_reason, occasion, notes, allergies, party_child_name, party_child_age')
      .in('booking_id', bookingIds)

    const detailMap = {}
    ;(partyDetails || []).forEach(pd => { detailMap[pd.booking_id] = pd })

    // Store for dashboard use
    window._sessions    = withBookings
    window._bookedMap   = bookedMap
    window._detailMap   = detailMap

    const sel = document.getElementById('session-select')
    sel.innerHTML = '<option value="">— Select a party —</option>'
    withBookings.forEach(s => {
      const booking = bookedMap[s.id]
      const detail  = booking ? detailMap[booking.id] : null
      let label = ''
      if (detail?.party_reason)      label = detail.party_reason
      else if (detail?.occasion)     label = detail.occasion
      else if (booking?.customer_name) label = firstLastInitial(booking.customer_name) + "'s Party"
      else                           label = s.title
      const opt = document.createElement('option')
      opt.value = s.id
      opt.textContent = `${fmtTime(s.session_time)} · ${label}`
      sel.appendChild(opt)
    })

    if (withBookings.length === 1) { sel.value = withBookings[0].id; onSessionChange() }
  }

  // ── Session change ───────────────────────────────────────────
  function onSessionChange() {
    currentSessionId = document.getElementById('session-select').value
    if (!currentSessionId) {
      document.getElementById('dashboard').style.display = 'none'
      document.getElementById('placeholder').style.display = 'block'
      clearInterval(refreshTimer)
      return
    }
    document.getElementById('placeholder').style.display = 'none'
    document.getElementById('dashboard').style.display = 'block'
    loadDashboard()
    clearInterval(refreshTimer)
    refreshTimer = setInterval(refreshCheckins, 30000)
  }

  // ── Dashboard ────────────────────────────────────────────────
  async function loadDashboard() {
    const sessions  = window._sessions  || []
    const bookedMap = window._bookedMap || {}
    const detailMap = window._detailMap || {}

    const session = sessions.find(s => s.id === currentSessionId)
    if (!session) return

    const booking = bookedMap[currentSessionId]
    const detail  = booking ? detailMap[booking.id] : null
    currentBooking = booking

    // Party info
    let partyHtml = ''
    if (detail?.party_reason)      partyHtml += infoItem('Occasion', detail.party_reason)
    else if (detail?.occasion)     partyHtml += infoItem('Occasion', detail.occasion)
    if (detail?.party_child_name)  partyHtml += infoItem('Birthday Child', detail.party_child_name)
    if (detail?.party_child_age)   partyHtml += infoItem('Age', detail.party_child_age)
    partyHtml += infoItem('Session Time', fmtTime(session.session_time))
    document.getElementById('party-info-grid').innerHTML = partyHtml || '<div style="color:#aaa;font-size:13px">No party details on file.</div>'

    // Host contact
    let hostHtml = ''
    if (booking) {
      hostHtml += infoItem('Host Name',  booking.customer_name)
      hostHtml += infoItem('Phone',      booking.customer_phone, 'tel:')
      hostHtml += infoItem('Email',      booking.customer_email, 'mailto:')
    }
    document.getElementById('host-info-grid').innerHTML = hostHtml || '<div style="color:#aaa;font-size:13px">No host info on file.</div>'

    // Notes
    const notes = []
    if (detail?.notes)     notes.push('📝 ' + detail.notes)
    if (detail?.allergies) notes.push('⚠️ Allergies: ' + detail.allergies)
    const notesCard = document.getElementById('notes-card')
    if (notes.length) {
      notesCard.style.display = 'block'
      document.getElementById('notes-content').innerHTML = notes.join('<br><br>')
    } else {
      notesCard.style.display = 'none'
    }

    document.getElementById('stat-booked').textContent = booking?.qty || 0

    await refreshCheckins()
  }

  // ── Check-in refresh ─────────────────────────────────────────
  async function refreshCheckins() {
    if (!currentSessionId) return

    const { data: entries } = await sb
      .from('signin_entries')
      .select('name, email')
      .eq('session_id', currentSessionId)
      .eq('mode', 'party')

    const checkedIn = (entries || []).length
    const booked    = currentBooking?.qty || 0
    const remaining = Math.max(0, booked - checkedIn)

    document.getElementById('stat-checkedin').textContent = checkedIn
    document.getElementById('stat-remaining').textContent = remaining
    document.getElementById('checkin-badge').textContent  = `${checkedIn} checked in`

    const list = document.getElementById('checkin-list')
    if (!entries?.length) {
      list.innerHTML = '<li class="checkin-empty">No one checked in yet.</li>'
    } else {
      list.innerHTML = entries.map(e => {
        const name     = e.name || 'Guest'
        const initial  = name.trim()[0]?.toUpperCase() || '?'
        const emailHtml = e.email ? `<div class="checkin-email">${e.email}</div>` : ''
        return `<li class="checkin-item">
          <div class="checkin-avatar">${initial}</div>
          <div><div class="checkin-name">${name}</div>${emailHtml}</div>
        </li>`
      }).join('')
    }

    const now  = new Date()
    const h    = now.getHours(), m = now.getMinutes()
    const ampm = h >= 12 ? 'pm' : 'am'
    const h12  = h % 12 || 12
    document.getElementById('refresh-bar').textContent =
      `Last updated ${h12}:${String(m).padStart(2,'0')}${ampm} · Auto-refreshes every 30 seconds`
  }
</script>
</body>
</html>
