<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4Cats Party Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f5f5f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

    #login-screen { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center; min-height: 100vh; padding: 2rem; }
    .login-card { background: white; border-radius: 12px; border: 1px solid #e0e0d8; padding: 2rem; width: 100%; max-width: 360px; }
    .login-logo { font-size: 22px; font-weight: 800; color: #f0c040; letter-spacing: 1px; text-align: center; margin-bottom: 4px; }
    .login-sub { font-size: 13px; color: #888; text-align: center; margin-bottom: 1.5rem; }
    .login-card input { width: 100%; padding: 10px 12px; border: 1px solid #d0d0c8; border-radius: 8px; font-size: 16px; margin-bottom: 10px; outline: none; font-family: inherit; -webkit-appearance: none; appearance: none; }
    .login-card input:focus { border-color: #99354e; }
    .login-card button { width: 100%; padding: 10px; background: #1a1a2e; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-family: inherit; }
    .error-msg { color: #c0392b; font-size: 13px; margin-top: 10px; display: none; }

    #app-screen { display: none; }

    .app-header { background: #1a1a2e; color: white; padding: 14px 20px; display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between; }
    .app-header-left .logo { font-size: 18px; font-weight: 800; color: #f0c040; letter-spacing: 1px; }
    .app-header-left .studio { font-size: 13px; color: #aaa; margin-top: 2px; }
    .signout-btn { background: none; border: 1px solid #555; color: #aaa; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }

    .session-bar { background: white; border-bottom: 1px solid #e0e0d8; padding: 12px 20px; display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; gap: 10px; }
    .session-bar label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
    .select-wrap { position: relative; -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; }
    .select-wrap select { width: 100%; padding: 9px 32px 9px 12px; border: 1.5px solid #d0d0c8; border-radius: 8px; font-size: 14px; outline: none; font-family: inherit; background: white; color: #1a1a2e; -webkit-appearance: none; appearance: none; }
    .select-wrap::after { content: '\25BE'; position: absolute; right: 10px; top: 50%; -webkit-transform: translateY(-50%); transform: translateY(-50%); color: #888; pointer-events: none; }
    .refresh-btn { padding: 8px 14px; border-radius: 8px; border: 1.5px solid #d0d0c8; background: white; font-size: 13px; color: #555; cursor: pointer; white-space: nowrap; font-family: inherit; }

    .main { padding: 16px; max-width: 700px; margin: 0 auto; }
    .placeholder { text-align: center; padding: 60px 20px; color: #aaa; font-size: 14px; }
    .no-party { text-align: center; padding: 60px 20px; color: #888; font-size: 15px; }

    .card { background: white; border-radius: 12px; border: 1px solid #e0e0d8; padding: 18px; margin-bottom: 14px; }
    .card-header { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between; margin-bottom: 14px; }
    .card-title { font-size: 14px; font-weight: 700; color: #1a1a2e; }
    .card-badge { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 20px; background: #e8f5e9; color: #2e7d32; }

    .stat-row { display: -webkit-box; display: -webkit-flex; display: flex; gap: 12px; margin-bottom: 14px; }
    .stat-box { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; background: #f9f9f6; border-radius: 10px; padding: 14px; text-align: center; }
    .stat-num { font-size: 36px; font-weight: 900; color: #1a1a2e; line-height: 1; }
    .stat-num.green { color: #2e7d32; }
    .stat-num.amber { color: #e65100; }
    .stat-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }

    /* Party pills — matching index.html */
    .party-base-pill { display: -webkit-inline-box; display: -webkit-inline-flex; display: inline-flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; gap: 6px; background: #fff0f5; border: 0.5px solid #f0b8cc; border-radius: 20px; padding: 4px 12px; font-size: 12px; color: #99354e; margin-bottom: 10px; }
    .party-paid-pill { display: -webkit-inline-box; display: -webkit-inline-flex; display: inline-flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; gap: 6px; background: #fff8e1; border: 0.5px solid #ffd54f; border-radius: 20px; padding: 4px 12px; font-size: 12px; color: #7a5800; margin-bottom: 10px; margin-left: 8px; }
    .party-addon-pills { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .addon-pill { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: #fce8f0; color: #99354e; border: 0.5px solid #f0b8cc; }
    .addon-pill.upgrade { background: #fff3e0; color: #c56000; border-color: #ffd099; }
    .order-note { font-size: 12px; color: #7a4060; background: #fce8f0; border-radius: 6px; padding: 4px 10px; margin-bottom: 10px; display: inline-block; }

    /* Info rows */
    .info-grid { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
    .info-item { -webkit-box-flex: 1; -webkit-flex: 1 1 140px; flex: 1 1 140px; }
    .info-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
    .info-value { font-size: 14px; color: #1a1a2e; font-weight: 500; }
    .info-value a { color: #2d6a9f; text-decoration: none; }

    .section-label { font-size: 11px; font-weight: 700; color: #99354e; text-transform: uppercase; letter-spacing: 0.6px; margin: 14px 0 8px; }

    .notes-box { background: #fffbea; border: 1px solid #ffe082; border-radius: 8px; padding: 12px 14px; font-size: 14px; color: #5d3a00; line-height: 1.6; margin-top: 8px; }

    /* Checkin list */
    .checkin-list { list-style: none; }
    .checkin-item { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f0f0e8; }
    .checkin-item:last-child { border-bottom: none; }
    .checkin-avatar { width: 34px; height: 34px; border-radius: 50%; background: #99354e; color: white; font-size: 14px; font-weight: 700; display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center; -webkit-flex-shrink: 0; flex-shrink: 0; }
    .checkin-name { font-size: 14px; color: #1a1a2e; font-weight: 500; }
    .checkin-email { font-size: 12px; color: #888; margin-top: 1px; }
    .checkin-empty { text-align: center; padding: 20px; color: #aaa; font-size: 14px; }
    .checkin-actions { margin-left: auto; display: -webkit-box; display: -webkit-flex; display: flex; gap: 6px; -webkit-flex-shrink: 0; flex-shrink: 0; }
    .action-btn { padding: 4px 10px; border-radius: 6px; border: 1px solid #d0d0c8; background: white; font-size: 11px; cursor: pointer; color: #555; font-family: inherit; }
    .action-btn.remove { border-color: #f0b8cc; color: #99354e; }
    .action-btn.remove:active { background: #fff0f5; }
    .action-btn.move { border-color: #b8d0f0; color: #2d6a9f; }
    .action-btn.move:active { background: #f0f6ff; }
    .move-dropdown { margin-top: 8px; padding: 8px; background: #f0f6ff; border-radius: 8px; border: 1px solid #b8d0f0; }
    .move-dropdown select { font-size: 13px; padding: 6px 10px; margin-bottom: 6px; }
    .move-dropdown-btns { display: -webkit-box; display: -webkit-flex; display: flex; gap: 6px; }
    .move-confirm-btn { padding: 6px 12px; border-radius: 6px; border: none; background: #2d6a9f; color: white; font-size: 12px; cursor: pointer; font-family: inherit; }
    .move-cancel-btn { padding: 6px 12px; border-radius: 6px; border: 1px solid #ccc; background: white; color: #666; font-size: 12px; cursor: pointer; font-family: inherit; }
    .refresh-bar { text-align: center; font-size: 12px; color: #aaa; padding: 8px 0 16px; }
  </style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">4CATS</div>
    <div class="login-sub">Party Staff Dashboard</div>
    <input type="email" id="email-input" placeholder="Email address" autocomplete="email">
    <input type="password" id="password-input" placeholder="Password" autocomplete="current-password">
    <button id="signin-btn">Sign in</button>
    <div class="error-msg" id="error-msg"></div>
  </div>
</div>

<div id="app-screen">
  <div class="app-header">
    <div class="app-header-left">
      <div class="logo">4CATS</div>
      <div class="studio" id="studio-name">Loading...</div>
    </div>
    <button class="signout-btn" onclick="signOut()">Sign out</button>
  </div>

  <div class="session-bar">
    <label>Party:</label>
    <div class="select-wrap">
      <select id="session-select" onchange="onSessionChange()">
        <option value="">Loading...</option>
      </select>
    </div>
    <button class="refresh-btn" onclick="refreshCheckins()">&#8635; Refresh</button>
  </div>

  <div class="main">
    <div class="placeholder" id="placeholder">
      <div style="font-size:40px;margin-bottom:12px">&#9757;&#65039;</div>
      <div>Select a party above to view details.</div>
    </div>
    <div class="no-party" id="no-party" style="display:none">
      <div style="font-size:40px;margin-bottom:12px">&#127912;</div>
      <div>No parties found for today at this studio.</div>
    </div>

    <div id="dashboard" style="display:none">

      <div class="stat-row">
        <div class="stat-box">
          <div class="stat-num green" id="stat-checkedin">-</div>
          <div class="stat-label">Checked In</div>
        </div>
        <div class="stat-box">
          <div class="stat-num amber" id="stat-expected">-</div>
          <div class="stat-label">Expected Guests</div>
        </div>
      </div>

      <!-- Party details card -->
      <div class="card" id="party-card">
        <div class="card-header"><div class="card-title">&#127881; Party Details</div></div>
        <div id="party-card-body"></div>
      </div>
      <div id="extra-bookings"></div>

      <!-- Checked-in card -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">&#9989; Checked In</div>
          <div class="card-badge" id="checkin-badge">0</div>
        </div>
        <ul class="checkin-list" id="checkin-list">
          <li class="checkin-empty">Loading...</li>
        </ul>
      </div>

      <div class="refresh-bar" id="refresh-bar">Auto-refreshes every 30 seconds</div>
    </div>
  </div>
</div>

<script>
  var SUPABASE_URL = 'https://snxibhbhhchjthfmjtaj.supabase.co';
  var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNueGliaGJoaGNoanRoZm1qdGFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTk2ODAsImV4cCI6MjA5MjYzNTY4MH0.K-89Mx4SxU6N1hMmtK6Q79rWAtk6VTN9b5wemQxcZVA';

  var currentAccessToken = null;
  var currentStudioId    = null;
  var currentSessionId   = null;
  var currentBooking     = null;
  var refreshTimer       = null;

  if (!String.prototype.padStart) {
    String.prototype.padStart = function(len, ch) {
      var s = this; ch = ch || ' ';
      while (s.length < len) s = ch + s;
      return s;
    };
  }

  // ── REST helpers ──────────────────────────────────────────────
  function restFetch(path, options) {
    var headers = {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + (currentAccessToken || SUPABASE_KEY),
      'Content-Type': 'application/json'
    };
    if (options && options.headers) {
      var k;
      for (k in options.headers) { headers[k] = options.headers[k]; }
    }
    return fetch(SUPABASE_URL + '/rest/v1/' + path, {
      method: (options && options.method) || 'GET',
      headers: headers,
      body: (options && options.body) || undefined
    }).then(function(res) {
      if (res.status === 204 || res.headers.get('content-length') === '0') {
        return { data: null, ok: res.ok, status: res.status };
      }
      return res.json().then(function(data) {
        return { data: data, ok: res.ok, status: res.status };
      });
    });
  }

  // ── Auth ─────────────────────────────────────────────────────
  document.getElementById('signin-btn').onclick = signIn;

  function init() {
    var stored = null;
    try { stored = localStorage.getItem('4cats_dashboard_token'); } catch(e) {}
    if (stored) { currentAccessToken = stored; loadApp(); }
  }

  function signIn() {
    var email    = document.getElementById('email-input').value.trim();
    var password = document.getElementById('password-input').value;
    var errEl    = document.getElementById('error-msg');
    errEl.style.display = 'none';
    if (!email || !password) {
      errEl.textContent = 'Please enter your email and password.';
      errEl.style.display = 'block'; return;
    }
    var btn = document.getElementById('signin-btn');
    btn.textContent = 'Signing in...'; btn.disabled = true;

    fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: password })
    }).then(function(res) {
      return res.json().then(function(data) { return { data: data, ok: res.ok }; });
    }).then(function(result) {
      btn.textContent = 'Sign in'; btn.disabled = false;
      if (!result.ok || !result.data.access_token) {
        errEl.textContent = (result.data && result.data.error_description) || 'Incorrect email or password.';
        errEl.style.display = 'block'; return;
      }
      currentAccessToken = result.data.access_token;
      try { localStorage.setItem('4cats_dashboard_token', currentAccessToken); } catch(e) {}
      loadApp();
    }).catch(function() {
      btn.textContent = 'Sign in'; btn.disabled = false;
      errEl.textContent = 'Network error. Please try again.';
      errEl.style.display = 'block';
    });
  }

  function signOut() {
    clearInterval(refreshTimer);
    currentAccessToken = null; currentStudioId = null; currentSessionId = null;
    try { localStorage.removeItem('4cats_dashboard_token'); } catch(e) {}
    document.getElementById('login-screen').style.display = '-webkit-flex';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app-screen').style.display = 'none';
  }

  // ── App load ─────────────────────────────────────────────────
  function loadApp() {
    var userId = null;
    try {
      var parts = currentAccessToken.split('.');
      var payload = JSON.parse(atob(parts[1]));
      userId = payload.sub;
    } catch(e) { signOut(); return; }

    restFetch('studio_users?user_id=eq.' + userId + '&select=studio_id&limit=1')
      .then(function(result) {
        if (!result.ok || !result.data || !result.data.length) { alert('No studio linked to this account.'); signOut(); return null; }
        currentStudioId = result.data[0].studio_id;
        return restFetch('studios?id=eq.' + currentStudioId + '&select=name&limit=1');
      })
      .then(function(result) {
        if (!result) return;
        var name = (result.data && result.data[0] && result.data[0].name) ? result.data[0].name : currentStudioId;
        document.getElementById('studio-name').textContent = name;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
        loadSessions();
      })
      .catch(function() { signOut(); });
  }

  // ── Helpers ──────────────────────────────────────────────────
  function today() {
    var d = new Date();
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  function fmtTime(t) {
    if (!t) return '';
    var parts = t.split(':');
    var h = parseInt(parts[0]), m = parseInt(parts[1]);
    var ampm = h >= 12 ? 'pm' : 'am';
    var h12  = h % 12 || 12;
    return m === 0 ? h12 + ampm : h12 + ':' + String(m).padStart(2, '0') + ampm;
  }

  function getSubtype(title) {
    var t = (title || '').toLowerCase();
    if (t.indexOf('splatter') !== -1) return 'splatter';
    if (t.indexOf('adult get-together') !== -1 || t.indexOf('adult get together') !== -1) return 'adult';
    if (t.indexOf('field trip') !== -1) return 'fieldtrip';
    return 'kids';
  }

  function partyLabel(booking, detail, sessionTitle) {
    var subtype = getSubtype(sessionTitle);
    if (subtype === 'adult' && detail && detail.occasion)  return detail.occasion;
    if (detail && detail.party_reason)                     return detail.party_reason;
    if (detail && detail.occasion)                         return detail.occasion;
    if (booking && booking.customer_name) {
      var parts = booking.customer_name.trim().split(' ');
      var last  = parts.length > 1 ? ' ' + parts[parts.length - 1][0] + '.' : '';
      return parts[0] + last + "'s Party";
    }
    return sessionTitle || 'Party';
  }

  function esc(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function infoItem(label, value, href) {
    if (!value && value !== 0) return '';
    var val = href ? '<a href="' + href + value + '">' + esc(String(value)) + '</a>' : esc(String(value));
    return '<div class="info-item"><div class="info-label">' + label + '</div><div class="info-value">' + val + '</div></div>';
  }

  // ── Payload helpers ───────────────────────────────────────────
  function getPayload(raw) {
    try { return typeof raw === 'string' ? JSON.parse(raw) : (raw || {}); } catch(e) { return {}; }
  }

  function getOrderNoteFromPayload(raw) {
    var p = getPayload(raw);
    return (p && p.note) ? p.note : '';
  }

  function getPhoneFromPayload(raw) {
    var p = getPayload(raw);
    if (!p) return '';
    if (p.billing_address && p.billing_address.phone) return p.billing_address.phone;
    if (p.customer && p.customer.phone) return p.customer.phone;
    return '';
  }

  // ── Addon parsing ─────────────────────────────────────────────
  function parsePartyAddons(rawPayload, subtype) {
    try {
      var payload = getPayload(rawPayload);
      if (!payload || !payload.line_items) return [];
      var addons = [];
      var i;
      for (i = 0; i < payload.line_items.length; i++) {
        var li = payload.line_items[i];
        var title   = (li.title || li.name || '').trim();
        var variant = (li.variant_title || '').trim();
        if (/^\d+(am|pm|:\d)/i.test(title)) continue;
        if (!title || title === variant) continue;
        addons.push({ title: title, variant: variant, qty: li.quantity || 1 });
      }
      return addons;
    } catch(e) { return []; }
  }

  function parseAddonDetails(addons, subtype) {
    var result = { artTime: null, partyTime: null, guestCount: null, projectUpgrade: false, canvasUpgrade: false, parentHelperQty: null, raw: [] };
    var i;
    for (i = 0; i < addons.length; i++) {
      var addon   = addons[i];
      var title   = addon.title.toLowerCase();
      var variant = addon.variant || '';
      result.raw.push({ title: addon.title, variant: variant });

      if (title.indexOf('kids party extra guests') !== -1 || title.indexOf('splatter party extra guests') !== -1) {
        var parts = variant.split(' / ');
        if (parts.length >= 1) {
          var p0 = parts[0].toLowerCase();
          if (p0.indexOf('yes') !== -1 && p0.indexOf('90') !== -1) result.artTime = '90 min';
          else if (p0.indexOf('no') !== -1 || p0.indexOf('60') !== -1) result.artTime = '60 min';
          if (subtype === 'splatter') {
            if (p0.indexOf('45') !== -1) result.partyTime = '45 min';
            else if (p0.indexOf('30') !== -1) result.partyTime = '30 min';
            else if (p0.indexOf('no') !== -1) result.partyTime = 'none';
          }
        }
        if (parts.length >= 2) {
          var p1 = parts[1].toLowerCase();
          if (subtype !== 'splatter') {
            if (p1.indexOf('45') !== -1) result.partyTime = '45 min';
            else if (p1.indexOf('30') !== -1) result.partyTime = '30 min';
            else if (p1.indexOf('no') !== -1) result.partyTime = 'none';
          } else {
            var nm1 = p1.match(/(\d+)/);
            if (nm1) result.guestCount = parseInt(nm1[1]);
            else if (p1.indexOf('up to 8') !== -1) result.guestCount = 8;
          }
        }
        if (parts.length >= 3) {
          var p2 = parts[2].toLowerCase();
          if (subtype !== 'splatter') {
            var nm2 = p2.match(/(\d+)/);
            if (nm2) result.guestCount = parseInt(nm2[1]);
            else if (p2.indexOf('up to 8') !== -1) result.guestCount = 8;
          } else {
            if (p2.indexOf('yes') !== -1) result.canvasUpgrade = true;
          }
        }
      } else if (title.indexOf('adult get-togethers extra guests') !== -1 || title.indexOf('adult get togethers extra guests') !== -1) {
        var aParts = variant.split(' / ');
        if (aParts.length >= 1) {
          var anm = aParts[0].match(/(\d+)/);
          if (anm) result.guestCount = parseInt(anm[1]);
        }
        if (aParts.length >= 2) {
          result.partyTime = aParts[1].toLowerCase().indexOf('no') !== -1 ? 'none' : 'yes';
        }
      } else if (title.indexOf('project upgrade') !== -1) {
        result.projectUpgrade = variant.toLowerCase().indexOf('yes') !== -1;
      } else if (title.indexOf('parent') !== -1) {
        result.parentHelperQty = (result.parentHelperQty || 0) + (addon.qty || 1);
      }
    }
    return result;
  }

  function buildAddonPills(addonDetails, subtype) {
    var pills = [];
    if (addonDetails.artTime) pills.push('<span class="addon-pill">&#127912; Art: ' + addonDetails.artTime + '</span>');
    if (addonDetails.partyTime && addonDetails.partyTime !== 'none') pills.push('<span class="addon-pill">&#127881; Party time: ' + addonDetails.partyTime + '</span>');
    if (addonDetails.guestCount) pills.push('<span class="addon-pill">&#128101; ' + addonDetails.guestCount + ' guests</span>');
    if (addonDetails.projectUpgrade) pills.push('<span class="addon-pill upgrade">&#11088; Project upgrade (clay or painting)</span>');
    else if (subtype === 'kids') {
      var hasExtraGuests = false;
      var j;
      for (j = 0; j < addonDetails.raw.length; j++) {
        if (addonDetails.raw[j].title.toLowerCase().indexOf('extra guests') !== -1) { hasExtraGuests = true; break; }
      }
      if (hasExtraGuests) pills.push('<span class="addon-pill">&#127874; Oven-bake clay only</span>');
    }
    if (addonDetails.canvasUpgrade) pills.push('<span class="addon-pill upgrade">&#128444; Canvas upgrade (8x8)</span>');
    if (addonDetails.parentHelperQty) pills.push('<span class="addon-pill">&#128106; ' + addonDetails.parentHelperQty + ' parent pass' + (addonDetails.parentHelperQty !== 1 ? 'es' : '') + '</span>');
    return pills.join('');
  }

  function buildPaidPill(addonDetails, subtype) {
    var hasAddon = addonDetails.raw && addonDetails.raw.length > 0;
    var parts = [];
    if (!hasAddon) {
      var base = (subtype === 'adult' || subtype === 'fieldtrip') ? '10 guests · 90 min art · no party time' : '8 guests · 60 min art · no party time';
      return '<span class="party-paid-pill" style="background:#f5f5f0;border-color:#d0d0c8;color:#888">&#128203; Paid: base only (' + base + ')</span>';
    }
    if (addonDetails.guestCount) parts.push(addonDetails.guestCount + ' guests');
    else parts.push(subtype === 'adult' || subtype === 'fieldtrip' ? '10 guests (base)' : '8 guests (base)');
    if (subtype === 'kids' || subtype === 'splatter') parts.push(addonDetails.artTime || '60 min art');
    if (addonDetails.partyTime && addonDetails.partyTime !== 'none') parts.push(addonDetails.partyTime + ' party time');
    else parts.push('no party time');
    if (addonDetails.canvasUpgrade) parts.push('canvas upgrade');
    if (addonDetails.projectUpgrade) parts.push('project upgrade');
    return '<span class="party-paid-pill">&#128179; Paid: ' + parts.join(' · ') + '</span>';
  }

  // ── Sessions ─────────────────────────────────────────────────
  function loadSessions() {
    var t = today();
    restFetch('sessions?studio_id=eq.' + currentStudioId +
      '&session_date=eq.' + t +
      '&session_type=ilike.*party*' +
      '&order=session_time' +
      '&select=id,title,session_time')
    .then(function(result) {
      var sessions = (result.ok && result.data) ? result.data : [];
      if (!sessions.length) {
        document.getElementById('no-party').style.display = 'block';
        document.getElementById('placeholder').style.display = 'none';
        document.getElementById('session-select').innerHTML = '<option value="">No parties today</option>';
        return;
      }
      var ids = sessions.map(function(s) { return s.id; }).join(',');
      restFetch('bookings?session_id=in.(' + ids + ')&qty=gt.0&select=id,session_id,customer_name,customer_email,customer_phone,qty,raw_payload')
        .then(function(bResult) {
          var bookings = (bResult.ok && bResult.data) ? bResult.data : [];
          var bookedMap = {};
          bookings.forEach(function(b) {
            if (!bookedMap[b.session_id]) bookedMap[b.session_id] = [];
            bookedMap[b.session_id].push(b);
          });
          var withBookings = sessions.filter(function(s) { return bookedMap[s.id] && bookedMap[s.id].length; });
          if (!withBookings.length) {
            document.getElementById('no-party').style.display = 'block';
            document.getElementById('placeholder').style.display = 'none';
            document.getElementById('session-select').innerHTML = '<option value="">No parties today</option>';
            return;
          }
          var bookingIds = bookings.map(function(b) { return b.id; }).join(',');
          // Store first booking per session for backwards compat, but also store all
          var bookedMapFirst = {};
          withBookings.forEach(function(s) { bookedMapFirst[s.id] = bookedMap[s.id][0]; });
          restFetch('party_details?booking_id=in.(' + bookingIds + ')&select=booking_id,party_reason,occasion,notes,medium,project,colour_choice,school_name,grade_age_group,expected_guests,contact_name,contacted,additional_charges_planned,party_notes')
            .then(function(pdResult) {
              var partyDetails = (pdResult.ok && pdResult.data) ? pdResult.data : [];
              var detailMap = {};
              partyDetails.forEach(function(pd) { detailMap[pd.booking_id] = pd; });
              window._sessions     = withBookings;
              window._bookedMap    = bookedMapFirst;
              window._bookedMapAll = bookedMap;
              window._detailMap    = detailMap;

              var sel = document.getElementById('session-select');
              sel.innerHTML = '<option value="">- Select a party -</option>';
              withBookings.forEach(function(s) {
                var booking = bookedMapFirst[s.id];
                var detail  = booking ? detailMap[booking.id] : null;
                var opt = document.createElement('option');
                opt.value = s.id;
                opt.textContent = fmtTime(s.session_time) + ' · ' + partyLabel(booking, detail, s.title);
                sel.appendChild(opt);
              });
              if (withBookings.length === 1) { sel.value = withBookings[0].id; onSessionChange(); }
            });
        });
    });
  }

  // ── Session change ────────────────────────────────────────────
  function onSessionChange() {
    currentSessionId = document.getElementById('session-select').value;
    if (!currentSessionId) {
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('placeholder').style.display = 'block';
      clearInterval(refreshTimer); return;
    }
    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadDashboard();
    clearInterval(refreshTimer);
    refreshTimer = setInterval(refreshCheckins, 30000);
  }

  // ── Dashboard ─────────────────────────────────────────────────
  function loadDashboard() {
    var sessions  = window._sessions  || [];
    var bookedMap = window._bookedMap || {};
    var detailMap = window._detailMap || {};
    var session = null;
    var i;
    for (i = 0; i < sessions.length; i++) {
      if (sessions[i].id === currentSessionId) { session = sessions[i]; break; }
    }
    if (!session) return;

    var booking = bookedMap[currentSessionId];
    var detail  = booking ? detailMap[booking.id] : null;
    var subtype = getSubtype(session.title);
    var pd      = detail || {};
    currentBooking = booking;

    // Parse addons from raw_payload
    var addons       = booking ? parsePartyAddons(booking.raw_payload, subtype) : [];
    var addonDetails = parseAddonDetails(addons, subtype);
    var addonPills   = buildAddonPills(addonDetails, subtype);
    var paidPill     = buildPaidPill(addonDetails, subtype);
    var orderNote    = booking ? getOrderNoteFromPayload(booking.raw_payload) : '';
    var phone        = booking ? getPhoneFromPayload(booking.raw_payload) : '';

    // Expected guests
    var suggestedGuests = addonDetails.guestCount || ((subtype === 'adult' || subtype === 'fieldtrip') ? 10 : 8);
    var expectedGuests  = pd.expected_guests || suggestedGuests;
    document.getElementById('stat-expected').textContent = expectedGuests;

    // Build party card body
    var html = '';

    // Base pill
    var base = (subtype === 'adult' || subtype === 'fieldtrip') ? '10 guests · 90 min art · no party time' : '8 guests · 60 min art · no party time';
    html += '<span class="party-base-pill">&#128203; Base: ' + base + '</span>';

    // Addon pills
    if (addonPills) html += '<div class="party-addon-pills">' + addonPills + '</div>';

    // Paid pill
    html += paidPill;

    // Order note
    if (orderNote) html += '<div><div class="order-note">&#128203; ' + esc(orderNote) + '</div></div>';

    // Host info
    html += '<div class="section-label">&#128222; Host</div>';
    html += '<div class="info-grid">';
    html += infoItem('Name', booking ? booking.customer_name : null);
    html += infoItem('Phone', (booking && booking.customer_phone) ? booking.customer_phone : (phone || null), 'tel:');
    html += infoItem('Email', booking ? booking.customer_email : null, 'mailto:');
    html += '</div>';

    // Planning
    html += '<div class="section-label">&#128203; Planning</div>';
    html += '<div class="info-grid">';
    html += infoItem('Contact Name', pd.contact_name || (booking ? booking.customer_name : null));
    html += infoItem('Contacted?', pd.contacted || null);
    html += infoItem('Expected Guests', expectedGuests);
    if (pd.additional_charges_planned) html += infoItem('Additional Charges', pd.additional_charges_planned);
    html += '</div>';

    // Type-specific fields
    html += '<div class="section-label">&#127912; Party Info</div>';
    html += '<div class="info-grid">';
    if (subtype === 'kids') {
      html += infoItem('Party Reason', pd.party_reason || null);
      html += infoItem('Medium', pd.medium || null);
      html += infoItem('Project', pd.project || null);
    } else if (subtype === 'splatter') {
      html += infoItem('Party Reason', pd.party_reason || null);
      html += infoItem('Colour Choice', pd.colour_choice || null);
    } else if (subtype === 'adult') {
      html += infoItem('Occasion', pd.occasion || null);
      html += infoItem('Medium', pd.medium || null);
      html += infoItem('Project Choice', pd.project || null);
    } else if (subtype === 'fieldtrip') {
      html += infoItem('School / Organization', pd.school_name || null);
      html += infoItem('Medium', pd.medium || null);
      html += infoItem('Grade / Age Group', pd.grade_age_group || null);
    }
    html += '</div>';

    // Notes
    var notes = [];
    if (pd.notes)       notes.push(pd.notes);
    if (pd.party_notes) notes.push(pd.party_notes);
    if (notes.length) {
      html += '<div class="section-label">&#128221; Notes</div>';
      html += '<div class="notes-box">' + esc(notes.join(' · ')) + '</div>';
    }

    document.getElementById('party-card-body').innerHTML = html;

    // Render additional bookings for the same session
    var allBookings = (window._bookedMapAll || {})[currentSessionId] || [];
    var extraContainer = document.getElementById('extra-bookings');
    if (extraContainer) {
      var extraHtml = '';
      for (var ei = 1; ei < allBookings.length; ei++) {
        var eb = allBookings[ei];
        var ed = detailMap[eb.id] || {};
        var eSubtype = getSubtype(session.title);
        var eAddons = parsePartyAddons(eb.raw_payload, eSubtype);
        var eAddonDetails = parseAddonDetails(eAddons, eSubtype);
        var ePaidPill = buildPaidPill(eAddonDetails, eSubtype);
        var ePhone = getPhoneFromPayload(eb.raw_payload);
        extraHtml += '<div class="card" style="margin-top:16px">';
        extraHtml += '<div style="font-size:11px;font-weight:700;color:#c0392b;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px">Booking ' + (ei+1) + '</div>';
        extraHtml += '<div style="font-weight:600;font-size:15px">' + esc(eb.customer_name||'') + '</div>';
        if (eb.customer_email) extraHtml += '<div style="font-size:13px;color:#555">' + esc(eb.customer_email) + '</div>';
        var ePhone2 = eb.customer_phone || ePhone;
        if (ePhone2) extraHtml += '<div style="font-size:13px;color:#555">' + esc(ePhone2) + '</div>';
        if (ePaidPill) extraHtml += '<div style="margin-top:8px">' + ePaidPill + '</div>';
        if (ed.party_reason) extraHtml += '<div style="font-size:13px;margin-top:6px;color:#444">Reason: ' + esc(ed.party_reason) + '</div>';
        if (ed.expected_guests) extraHtml += '<div style="font-size:13px;color:#444">Expected guests: ' + esc(String(ed.expected_guests)) + '</div>';
        if (ed.medium) extraHtml += '<div style="font-size:13px;color:#444">Medium: ' + esc(ed.medium) + '</div>';
        if (ed.contact_name) extraHtml += '<div style="font-size:13px;color:#444">Contact: ' + esc(ed.contact_name) + '</div>';
        if (ed.notes || ed.party_notes) extraHtml += '<div style="font-size:13px;color:#888;margin-top:4px">' + esc(ed.notes||ed.party_notes||'') + '</div>';
        extraHtml += '</div>';
      }
      extraContainer.innerHTML = extraHtml;
    }

    refreshCheckins();
  }

  // ── Check-in refresh ──────────────────────────────────────────
  function refreshCheckins() {
    if (!currentSessionId) return;
    restFetch('signin_entries?session_id=eq.' + currentSessionId + '&mode=eq.party&select=id,name,email')
      .then(function(result) {
        var entries   = (result.ok && result.data) ? result.data : [];
        var checkedIn = entries.length;
        document.getElementById('stat-checkedin').textContent = checkedIn;
        document.getElementById('checkin-badge').textContent  = checkedIn + ' checked in';

        var list = document.getElementById('checkin-list');
        if (!entries.length) {
          list.innerHTML = '<li class="checkin-empty">No one checked in yet.</li>';
        } else {
          var html = '';
          var i;
          for (i = 0; i < entries.length; i++) {
            var e = entries[i];
            var name    = e.name || 'Guest';
            var initial = name.trim()[0] ? name.trim()[0].toUpperCase() : '?';
            var emailHtml = e.email ? '<div class="checkin-email">' + esc(e.email) + '</div>' : '';
            var safeName  = esc(name).replace(/'/g, "\\'");
            html += '<li class="checkin-item" id="entry-' + e.id + '">' +
              '<div class="checkin-avatar">' + initial + '</div>' +
              '<div style="-webkit-box-flex:1;-webkit-flex:1;flex:1">' +
                '<div class="checkin-name">' + esc(name) + '</div>' + emailHtml +
              '</div>' +
              '<div class="checkin-actions">' +
                '<button class="action-btn move" onclick="showMoveDropdown(\'' + e.id + '\',\'' + safeName + '\')">&#8594; Move</button>' +
                '<button class="action-btn remove" onclick="removeCheckin(\'' + e.id + '\',\'' + safeName + '\')">&#10005; Remove</button>' +
              '</div>' +
            '</li>';
          }
          list.innerHTML = html;
        }

        var now  = new Date();
        var h    = now.getHours(), m = now.getMinutes();
        var ampm = h >= 12 ? 'pm' : 'am';
        var h12  = h % 12 || 12;
        document.getElementById('refresh-bar').textContent =
          'Last updated ' + h12 + ':' + String(m).padStart(2, '0') + ampm + ' · Auto-refreshes every 30 seconds';
      });
  }

  function removeCheckin(id, name) {
    if (!confirm('Remove ' + name + ' from this party?')) return;
    restFetch('signin_entries?id=eq.' + id, { method: 'DELETE' })
      .then(function(result) {
        if (result.ok) {
          var el = document.getElementById('entry-' + id);
          if (el) el.parentNode.removeChild(el);
          var count = document.querySelectorAll('#checkin-list .checkin-item').length;
          document.getElementById('stat-checkedin').textContent = count;
          document.getElementById('checkin-badge').textContent  = count + ' checked in';
          if (count === 0) document.getElementById('checkin-list').innerHTML = '<li class="checkin-empty">No one checked in yet.</li>';
        } else {
          alert('Could not remove — please try again.');
        }
      });
  }

  function showMoveDropdown(id, name) {
    var existing = document.querySelector('.move-dropdown');
    if (existing) existing.parentNode.removeChild(existing);

    var sessions   = window._sessions  || [];
    var bookedMap  = window._bookedMap || {};
    var detailMap  = window._detailMap || {};
    var others = sessions.filter(function(s) { return s.id !== currentSessionId; });
    if (!others.length) { alert('No other party sessions today to move to.'); return; }

    var opts = others.map(function(s) {
      var booking = bookedMap[s.id];
      var detail  = booking ? detailMap[booking.id] : null;
      var label   = partyLabel(booking, detail, s.title);
      return '<option value="' + s.id + '">' + fmtTime(s.session_time) + ' · ' + esc(label) + '</option>';
    }).join('');

    var div = document.createElement('div');
    div.className = 'move-dropdown';
    div.id = 'move-dropdown-' + id;
    div.innerHTML =
      '<div style="font-size:12px;color:#2d6a9f;margin-bottom:6px">Move <strong>' + esc(name) + '</strong> to:</div>' +
      '<select id="move-select-' + id + '">' + opts + '</select>' +
      '<div class="move-dropdown-btns">' +
        '<button class="move-confirm-btn" onclick="confirmMove(\'' + id + '\',\'' + name.replace(/'/g, "\\'") + '\')">Move</button>' +
        '<button class="move-cancel-btn" onclick="cancelMove(\'' + id + '\')">Cancel</button>' +
      '</div>';

    var row = document.getElementById('entry-' + id);
    if (row) row.insertAdjacentElement('afterend', div);
  }

  function confirmMove(id, name) {
    var sel = document.getElementById('move-select-' + id);
    if (!sel || !sel.value) return;
    var newSessionId = sel.value;

    restFetch('signin_entries?id=eq.' + id, {
      method: 'PATCH',
      headers: { 'Prefer': 'return=minimal' },
      body: JSON.stringify({ session_id: newSessionId })
    }).then(function(result) {
      if (result.ok) {
        cancelMove(id);
        var row = document.getElementById('entry-' + id);
        if (row) row.parentNode.removeChild(row);
        var count = document.querySelectorAll('#checkin-list .checkin-item').length;
        document.getElementById('stat-checkedin').textContent = count;
        document.getElementById('checkin-badge').textContent  = count + ' checked in';
        if (count === 0) document.getElementById('checkin-list').innerHTML = '<li class="checkin-empty">No one checked in yet.</li>';
        var sessions = window._sessions || [];
        var target = null;
        var i;
        for (i = 0; i < sessions.length; i++) {
          if (sessions[i].id === newSessionId) { target = sessions[i]; break; }
        }
        showToast(name + ' moved to ' + (target ? fmtTime(target.session_time) + ' session' : 'other session'));
      } else {
        alert('Could not move — please try again.');
      }
    });
  }

  function cancelMove(id) {
    var el = document.getElementById('move-dropdown-' + id);
    if (el) el.parentNode.removeChild(el);
  }

  init();
</script>
</body>
</html>
