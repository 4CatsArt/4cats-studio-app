<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4Cats Party Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f5f5f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

    #login-screen { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center; min-height: 100vh; padding: 2rem; }
    .login-card { background: white; border-radius: 12px; border: 1px solid #e0e0d8; padding: 2rem; width: 100%; max-width: 360px; }
    .login-logo { font-size: 22px; font-weight: 800; color: #f0c040; letter-spacing: 1px; text-align: center; margin-bottom: 4px; }
    .login-sub { font-size: 13px; color: #888; text-align: center; margin-bottom: 1.5rem; }
    .login-card input { width: 100%; padding: 10px 12px; border: 1px solid #d0d0c8; border-radius: 8px; font-size: 16px; margin-bottom: 10px; outline: none; font-family: inherit; -webkit-appearance: none; appearance: none; }
    .login-card input:focus { border-color: #99354e; }
    .login-card button { width: 100%; padding: 10px; background: #1a1a2e; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-family: inherit; }
    .error-msg { color: #c0392b; font-size: 13px; margin-top: 10px; display: none; }

    #app-screen { display: none; }

    .app-header { background: #1a1a2e; color: white; padding: 14px 20px; display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between; }
    .app-header-left .logo { font-size: 18px; font-weight: 800; color: #f0c040; letter-spacing: 1px; }
    .app-header-left .studio { font-size: 13px; color: #aaa; margin-top: 2px; }
    .signout-btn { background: none; border: 1px solid #555; color: #aaa; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }

    .session-bar { background: white; border-bottom: 1px solid #e0e0d8; padding: 12px 20px; display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; gap: 10px; }
    .session-bar label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
    .select-wrap { position: relative; -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; }
    .select-wrap select { width: 100%; padding: 9px 32px 9px 12px; border: 1.5px solid #d0d0c8; border-radius: 8px; font-size: 14px; outline: none; font-family: inherit; background: white; color: #1a1a2e; -webkit-appearance: none; appearance: none; }
    .select-wrap::after { content: '▾'; position: absolute; right: 10px; top: 50%; -webkit-transform: translateY(-50%); transform: translateY(-50%); color: #888; pointer-events: none; }
    .refresh-btn { padding: 8px 14px; border-radius: 8px; border: 1.5px solid #d0d0c8; background: white; font-size: 13px; color: #555; cursor: pointer; white-space: nowrap; font-family: inherit; }

    .main { padding: 16px; max-width: 700px; margin: 0 auto; }
    .placeholder { text-align: center; padding: 60px 20px; color: #aaa; font-size: 14px; }
    .no-party { text-align: center; padding: 60px 20px; color: #888; font-size: 15px; }

    .card { background: white; border-radius: 12px; border: 1px solid #e0e0d8; padding: 18px; margin-bottom: 14px; }
    .card-header { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; -webkit-box-pack: justify; -webkit-justify-content: space-between; justify-content: space-between; margin-bottom: 14px; }
    .card-title { font-size: 14px; font-weight: 700; color: #1a1a2e; }
    .card-badge { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 20px; background: #e8f5e9; color: #2e7d32; }

    .stat-row { display: -webkit-box; display: -webkit-flex; display: flex; gap: 12px; margin-bottom: 14px; }
    .stat-box { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; background: #f9f9f6; border-radius: 10px; padding: 14px; text-align: center; }
    .stat-num { font-size: 36px; font-weight: 900; color: #1a1a2e; line-height: 1; }
    .stat-num.green { color: #2e7d32; }
    .stat-num.amber { color: #e65100; }
    .stat-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }

    .info-grid { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; gap: 12px; }
    .info-item { -webkit-box-flex: 1; -webkit-flex: 1 1 140px; flex: 1 1 140px; }
    .info-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
    .info-value { font-size: 14px; color: #1a1a2e; font-weight: 500; }
    .info-value a { color: #2d6a9f; text-decoration: none; }

    .notes-box { background: #fffbea; border: 1px solid #ffe082; border-radius: 8px; padding: 12px 14px; font-size: 14px; color: #5d3a00; line-height: 1.6; }

    .checkin-list { list-style: none; }
    .checkin-item { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f0f0e8; }
    .checkin-item:last-child { border-bottom: none; }
    .checkin-avatar { width: 34px; height: 34px; border-radius: 50%; background: #99354e; color: white; font-size: 14px; font-weight: 700; display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-align: center; -webkit-align-items: center; align-items: center; -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center; -webkit-flex-shrink: 0; flex-shrink: 0; }
    .checkin-name { font-size: 14px; color: #1a1a2e; font-weight: 500; }
    .checkin-email { font-size: 12px; color: #888; margin-top: 1px; }
    .checkin-empty { text-align: center; padding: 20px; color: #aaa; font-size: 14px; }
    .refresh-bar { text-align: center; font-size: 12px; color: #aaa; padding: 8px 0 16px; }
  </style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">4CATS</div>
    <div class="login-sub">Party Staff Dashboard</div>
    <input type="email" id="email-input" placeholder="Email address" autocomplete="email">
    <input type="password" id="password-input" placeholder="Password" autocomplete="current-password">
    <button id="signin-btn">Sign in</button>
    <div class="error-msg" id="error-msg"></div>
  </div>
</div>

<div id="app-screen">
  <div class="app-header">
    <div class="app-header-left">
      <div class="logo">4CATS</div>
      <div class="studio" id="studio-name">Loading...</div>
    </div>
    <button class="signout-btn" onclick="signOut()">Sign out</button>
  </div>

  <div class="session-bar">
    <label>Party:</label>
    <div class="select-wrap">
      <select id="session-select" onchange="onSessionChange()">
        <option value="">Loading...</option>
      </select>
    </div>
    <button class="refresh-btn" onclick="refreshCheckins()">&#8635; Refresh</button>
  </div>

  <div class="main">
    <div class="placeholder" id="placeholder">
      <div style="font-size:40px;margin-bottom:12px">&#9757;&#65039;</div>
      <div>Select a party above to view details.</div>
    </div>
    <div class="no-party" id="no-party" style="display:none">
      <div style="font-size:40px;margin-bottom:12px">&#127912;</div>
      <div>No parties found for today at this studio.</div>
    </div>

    <div id="dashboard" style="display:none">

      <div class="stat-row">
        <div class="stat-box">
          <div class="stat-num green" id="stat-checkedin">-</div>
          <div class="stat-label">Checked In</div>
        </div>
        <div class="stat-box">
          <div class="stat-num amber" id="stat-expected">-</div>
          <div class="stat-label">Expected Guests</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header"><div class="card-title">&#127881; Party Details</div></div>
        <div class="info-grid" id="party-info-grid"></div>
      </div>

      <div class="card">
        <div class="card-header"><div class="card-title">&#128222; Host Contact</div></div>
        <div class="info-grid" id="host-info-grid"></div>
      </div>

      <div class="card" id="notes-card" style="display:none">
        <div class="card-header"><div class="card-title">&#128221; Notes &amp; Allergies</div></div>
        <div class="notes-box" id="notes-content"></div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">&#9989; Checked In</div>
          <div class="card-badge" id="checkin-badge">0</div>
        </div>
        <ul class="checkin-list" id="checkin-list">
          <li class="checkin-empty">Loading...</li>
        </ul>
      </div>

      <div class="refresh-bar" id="refresh-bar">Auto-refreshes every 30 seconds</div>
    </div>
  </div>
</div>

<script>
  var SUPABASE_URL = 'https://snxibhbhhchjthfmjtaj.supabase.co';
  var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNueGliaGJoaGNoanRoZm1qdGFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTk2ODAsImV4cCI6MjA5MjYzNTY4MH0.K-89Mx4SxU6N1hMmtK6Q79rWAtk6VTN9b5wemQxcZVA';

  var currentAccessToken = null;
  var currentStudioId    = null;
  var currentSessionId   = null;
  var currentBooking     = null;
  var refreshTimer       = null;

  if (!String.prototype.padStart) {
    String.prototype.padStart = function(len, ch) {
      var s = this; ch = ch || ' ';
      while (s.length < len) s = ch + s;
      return s;
    };
  }

  // ── REST helpers ─────────────────────────────────────────────
  function restFetch(path, options) {
    var headers = {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + (currentAccessToken || SUPABASE_KEY),
      'Content-Type': 'application/json'
    };
    if (options && options.headers) {
      var k;
      for (k in options.headers) { headers[k] = options.headers[k]; }
    }
    return fetch(SUPABASE_URL + '/rest/v1/' + path, {
      method: (options && options.method) || 'GET',
      headers: headers,
      body: (options && options.body) || undefined
    }).then(function(res) {
      if (res.status === 204 || res.headers.get('content-length') === '0') {
        return { data: null, ok: res.ok, status: res.status };
      }
      return res.json().then(function(data) {
        return { data: data, ok: res.ok, status: res.status };
      });
    });
  }

  // ── Auth via REST ─────────────────────────────────────────────
  document.getElementById('signin-btn').onclick = signIn;

  // Check for existing session in localStorage
  function init() {
    var stored = null;
    try { stored = localStorage.getItem('4cats_dashboard_token'); } catch(e) {}
    if (stored) {
      currentAccessToken = stored;
      loadApp();
    }
  }

  function signIn() {
    var email    = document.getElementById('email-input').value.trim();
    var password = document.getElementById('password-input').value;
    var errEl    = document.getElementById('error-msg');
    errEl.style.display = 'none';
    if (!email || !password) {
      errEl.textContent = 'Please enter your email and password.';
      errEl.style.display = 'block';
      return;
    }
    var btn = document.getElementById('signin-btn');
    btn.textContent = 'Signing in...';
    btn.disabled = true;

    fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ email: email, password: password })
    }).then(function(res) {
      return res.json().then(function(data) {
        return { data: data, ok: res.ok };
      });
    }).then(function(result) {
      btn.textContent = 'Sign in';
      btn.disabled = false;
      if (!result.ok || !result.data.access_token) {
        errEl.textContent = (result.data && result.data.error_description) || 'Incorrect email or password.';
        errEl.style.display = 'block';
        return;
      }
      currentAccessToken = result.data.access_token;
      try { localStorage.setItem('4cats_dashboard_token', currentAccessToken); } catch(e) {}
      loadApp();
    }).catch(function(e) {
      btn.textContent = 'Sign in';
      btn.disabled = false;
      errEl.textContent = 'Network error. Please try again.';
      errEl.style.display = 'block';
    });
  }

  function signOut() {
    clearInterval(refreshTimer);
    currentAccessToken = null;
    currentStudioId = null;
    currentSessionId = null;
    try { localStorage.removeItem('4cats_dashboard_token'); } catch(e) {}
    document.getElementById('login-screen').style.display = '-webkit-flex';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app-screen').style.display = 'none';
  }

  // ── App load ─────────────────────────────────────────────────
  function loadApp() {
    // Get user id from token (JWT decode)
    var userId = null;
    try {
      var parts = currentAccessToken.split('.');
      var payload = JSON.parse(atob(parts[1]));
      userId = payload.sub;
    } catch(e) {
      signOut(); return;
    }

    restFetch('studio_users?user_id=eq.' + userId + '&select=studio_id&limit=1')
      .then(function(result) {
        if (!result.ok || !result.data || !result.data.length) {
          alert('No studio linked to this account.');
          signOut(); return;
        }
        currentStudioId = result.data[0].studio_id;
        return restFetch('studios?id=eq.' + currentStudioId + '&select=name&limit=1');
      })
      .then(function(result) {
        if (!result) return;
        var name = (result.data && result.data[0] && result.data[0].name) ? result.data[0].name : currentStudioId;
        document.getElementById('studio-name').textContent = name;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
        loadSessions();
      })
      .catch(function() { signOut(); });
  }

  // ── Helpers ──────────────────────────────────────────────────
  function today() {
    var d = new Date();
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  function fmtTime(t) {
    if (!t) return '';
    var parts = t.split(':');
    var h = parseInt(parts[0]);
    var m = parseInt(parts[1]);
    var ampm = h >= 12 ? 'pm' : 'am';
    var h12  = h % 12 || 12;
    return m === 0 ? h12 + ampm : h12 + ':' + String(m).padStart(2, '0') + ampm;
  }

  function getSubtype(title) {
    var t = (title || '').toLowerCase();
    if (t.indexOf('splatter') !== -1) return 'splatter';
    if (t.indexOf('adult get-together') !== -1 || t.indexOf('adult get together') !== -1) return 'adult';
    if (t.indexOf('field trip') !== -1) return 'fieldtrip';
    return 'kids';
  }

  function partyLabel(booking, detail, sessionTitle) {
    var subtype = getSubtype(sessionTitle);
    if (subtype === 'adult' && detail && detail.occasion)  return detail.occasion;
    if (detail && detail.party_reason)                     return detail.party_reason;
    if (detail && detail.occasion)                         return detail.occasion;
    if (booking && booking.customer_name) {
      var parts = booking.customer_name.trim().split(' ');
      var last  = parts.length > 1 ? ' ' + parts[parts.length - 1][0] + '.' : '';
      return parts[0] + last + "'s Party";
    }
    return sessionTitle || 'Party';
  }

  function infoItem(label, value, href) {
    if (!value && value !== 0) return '';
    var val = href ? '<a href="' + href + value + '">' + value + '</a>' : value;
    return '<div class="info-item"><div class="info-label">' + label + '</div><div class="info-value">' + val + '</div></div>';
  }

  // ── Sessions ─────────────────────────────────────────────────
  function loadSessions() {
    var t = today();
    restFetch('sessions?studio_id=eq.' + currentStudioId +
      '&session_date=eq.' + t +
      '&session_type=ilike.*party*' +
      '&order=session_time' +
      '&select=id,title,session_time')
    .then(function(result) {
      var sessions = (result.ok && result.data) ? result.data : [];
      if (!sessions.length) {
        document.getElementById('no-party').style.display = 'block';
        document.getElementById('placeholder').style.display = 'none';
        document.getElementById('session-select').innerHTML = '<option value="">No parties today</option>';
        return;
      }
      var ids = sessions.map(function(s) { return s.id; }).join(',');
      return restFetch('bookings?session_id=in.(' + ids + ')&qty=gt.0&select=id,session_id,customer_name,customer_email,customer_phone,qty')
        .then(function(bResult) {
          var bookings = (bResult.ok && bResult.data) ? bResult.data : [];
          var bookedMap = {};
          bookings.forEach(function(b) { bookedMap[b.session_id] = b; });
          var withBookings = sessions.filter(function(s) { return bookedMap[s.id]; });

          if (!withBookings.length) {
            document.getElementById('no-party').style.display = 'block';
            document.getElementById('placeholder').style.display = 'none';
            document.getElementById('session-select').innerHTML = '<option value="">No parties today</option>';
            return;
          }

          var bookingIds = bookings.map(function(b) { return b.id; }).join(',');
          return restFetch('party_details?booking_id=in.(' + bookingIds + ')&select=booking_id,party_reason,occasion,notes,medium,project,colour_choice,school_name,grade_age_group,expected_guests')
            .then(function(pdResult) {
              var partyDetails = (pdResult.ok && pdResult.data) ? pdResult.data : [];
              var detailMap = {};
              partyDetails.forEach(function(pd) { detailMap[pd.booking_id] = pd; });

              window._sessions  = withBookings;
              window._bookedMap = bookedMap;
              window._detailMap = detailMap;

              var sel = document.getElementById('session-select');
              sel.innerHTML = '<option value="">- Select a party -</option>';
              withBookings.forEach(function(s) {
                var booking = bookedMap[s.id];
                var detail  = booking ? detailMap[booking.id] : null;
                var opt = document.createElement('option');
                opt.value = s.id;
                opt.textContent = fmtTime(s.session_time) + ' · ' + partyLabel(booking, detail, s.title);
                sel.appendChild(opt);
              });

              if (withBookings.length === 1) {
                sel.value = withBookings[0].id;
                onSessionChange();
              }
            });
        });
    });
  }

  // ── Session change ───────────────────────────────────────────
  function onSessionChange() {
    currentSessionId = document.getElementById('session-select').value;
    if (!currentSessionId) {
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('placeholder').style.display = 'block';
      clearInterval(refreshTimer);
      return;
    }
    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadDashboard();
    clearInterval(refreshTimer);
    refreshTimer = setInterval(refreshCheckins, 30000);
  }

  // ── Dashboard ────────────────────────────────────────────────
  function loadDashboard() {
    var sessions  = window._sessions  || [];
    var bookedMap = window._bookedMap || {};
    var detailMap = window._detailMap || {};

    var session = null;
    var i;
    for (i = 0; i < sessions.length; i++) {
      if (sessions[i].id === currentSessionId) { session = sessions[i]; break; }
    }
    if (!session) return;

    var booking = bookedMap[currentSessionId];
    var detail  = booking ? detailMap[booking.id] : null;
    var subtype = getSubtype(session.title);
    currentBooking = booking;

    // Party info
    var partyHtml = '';
    partyHtml += infoItem('Session Time', fmtTime(session.session_time));
    partyHtml += infoItem('Party Type', session.title);

    if (subtype === 'kids') {
      partyHtml += infoItem('Party Reason', detail && detail.party_reason ? detail.party_reason : null);
      partyHtml += infoItem('Medium', detail && detail.medium ? detail.medium : null);
      partyHtml += infoItem('Project', detail && detail.project ? detail.project : null);
    } else if (subtype === 'splatter') {
      partyHtml += infoItem('Party Reason', detail && detail.party_reason ? detail.party_reason : null);
      partyHtml += infoItem('Colour Choice', detail && detail.colour_choice ? detail.colour_choice : null);
    } else if (subtype === 'adult') {
      partyHtml += infoItem('Occasion', detail && detail.occasion ? detail.occasion : null);
      partyHtml += infoItem('Medium', detail && detail.medium ? detail.medium : null);
      partyHtml += infoItem('Project Choice', detail && detail.project ? detail.project : null);
    } else if (subtype === 'fieldtrip') {
      partyHtml += infoItem('School / Organization', detail && detail.school_name ? detail.school_name : null);
      partyHtml += infoItem('Medium', detail && detail.medium ? detail.medium : null);
      partyHtml += infoItem('Grade / Age Group', detail && detail.grade_age_group ? detail.grade_age_group : null);
    }

    if (detail && detail.expected_guests) partyHtml += infoItem('Expected Guests', detail.expected_guests);

    document.getElementById('party-info-grid').innerHTML = partyHtml || '<div style="color:#aaa;font-size:13px">No party details on file yet.</div>';
    document.getElementById('stat-expected').textContent = (detail && detail.expected_guests) ? detail.expected_guests : '-';

    // Host contact
    var hostHtml = '';
    if (booking) {
      hostHtml += infoItem('Host Name', booking.customer_name || null);
      hostHtml += infoItem('Phone', booking.customer_phone || null, 'tel:');
      hostHtml += infoItem('Email', booking.customer_email || null, 'mailto:');
    }
    document.getElementById('host-info-grid').innerHTML = hostHtml || '<div style="color:#aaa;font-size:13px">No host info on file.</div>';

    // Notes
    var notesCard = document.getElementById('notes-card');
    if (detail && detail.notes) {
      notesCard.style.display = 'block';
      document.getElementById('notes-content').textContent = detail.notes;
    } else {
      notesCard.style.display = 'none';
    }

    refreshCheckins();
  }

  // ── Check-in refresh ─────────────────────────────────────────
  function refreshCheckins() {
    if (!currentSessionId) return;
    restFetch('signin_entries?session_id=eq.' + currentSessionId + '&mode=eq.party&select=name,email')
      .then(function(result) {
        var entries = (result.ok && result.data) ? result.data : [];
        var checkedIn = entries.length;
        document.getElementById('stat-checkedin').textContent = checkedIn;
        document.getElementById('checkin-badge').textContent  = checkedIn + ' checked in';

        var list = document.getElementById('checkin-list');
        if (!entries.length) {
          list.innerHTML = '<li class="checkin-empty">No one checked in yet.</li>';
        } else {
          var html = '';
          var i;
          for (i = 0; i < entries.length; i++) {
            var e = entries[i];
            var name    = e.name || 'Guest';
            var initial = name.trim()[0] ? name.trim()[0].toUpperCase() : '?';
            var emailHtml = e.email ? '<div class="checkin-email">' + e.email + '</div>' : '';
            html += '<li class="checkin-item">' +
              '<div class="checkin-avatar">' + initial + '</div>' +
              '<div><div class="checkin-name">' + name + '</div>' + emailHtml + '</div>' +
              '</li>';
          }
          list.innerHTML = html;
        }

        var now   = new Date();
        var h     = now.getHours();
        var m     = now.getMinutes();
        var ampm  = h >= 12 ? 'pm' : 'am';
        var h12   = h % 12 || 12;
        document.getElementById('refresh-bar').textContent =
          'Last updated ' + h12 + ':' + String(m).padStart(2, '0') + ampm + ' · Auto-refreshes every 30 seconds';
      });
  }

  init();
</script>
</body>
</html>
