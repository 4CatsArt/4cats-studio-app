<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>4CATS Party Projects</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f2ee;
    color: #2d2d2d;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: #fff;
    border-bottom: 3px solid #e84c8b;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  header h1 {
    font-size: 22px;
    font-weight: 700;
    color: #e84c8b;
    letter-spacing: -0.5px;
  }
  header span {
    font-size: 13px;
    color: #888;
  }

  /* FILTER BAR */
  .filter-bar {
    background: #fff;
    padding: 12px 16px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    border-bottom: 1px solid #ece8e3;
    position: sticky;
    top: 61px;
    z-index: 99;
  }
  .filter-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-group + .filter-group {
    padding-left: 10px;
    border-left: 1px solid #ddd;
  }
  .filter-btn {
    padding: 7px 14px;
    border-radius: 20px;
    border: 1.5px solid #ddd;
    background: #f8f8f8;
    font-size: 13px;
    font-weight: 500;
    color: #555;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .filter-btn:active { transform: scale(0.96); }
  .filter-btn.active {
    border-color: transparent;
    color: #fff;
    background: #e84c8b;
  }
  .filter-btn.medium-obc.active    { background: #f97316; }
  .filter-btn.medium-clay.active   { background: #8b5cf6; }
  .filter-btn.medium-painting.active { background: #3b82f6; }
  .filter-btn.medium-besties.active  { background: #ec4899; }
  .filter-btn.aud-kids.active    { background: #10b981; }
  .filter-btn.aud-adults.active  { background: #6366f1; }
  .filter-btn.aud-both.active    { background: #f59e0b; }

  /* RESULTS COUNT */
  .results-bar {
    padding: 10px 18px 4px;
    font-size: 13px;
    color: #999;
  }

  /* GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
    padding: 12px 16px 40px;
  }

  /* CARD */
  .card {
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    transition: transform 0.15s, box-shadow 0.15s;
    cursor: pointer;
    display: flex;
    flex-direction: column;
  }
  .card:active { transform: scale(0.97); }

  .card-photo {
    width: 100%;
    position: relative;
    padding-bottom: 100%; /* 1:1 square, works on all iOS */
    background: #f0ece6;
    overflow: hidden;
  }
  .card-photo img {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .card-photo.no-photo {
    display: -webkit-box;
    display: flex;
    -webkit-box-align: center;
    align-items: center;
    -webkit-box-pack: center;
    justify-content: center;
  }
  .card-photo.no-photo span {
    position: absolute;
    top: 50%;
    left: 50%;
    -webkit-transform: translate(-50%, -50%);
    transform: translate(-50%, -50%);
    font-size: 48px;
  }

  .card-body {
    padding: 10px 12px 12px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .card-name {
    font-size: 15px;
    font-weight: 700;
    color: #1a1a1a;
    text-transform: capitalize;
  }

  .card-tags {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .tag {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .tag-obc      { background: #fff0e6; color: #f97316; }
  .tag-clay     { background: #f3f0ff; color: #8b5cf6; }
  .tag-painting { background: #eff6ff; color: #3b82f6; }
  .tag-besties  { background: #fdf2f8; color: #ec4899; }
  .tag-kids     { background: #ecfdf5; color: #059669; }
  .tag-adults   { background: #eef2ff; color: #6366f1; }
  .tag-both     { background: #fffbeb; color: #d97706; }
  .tag-seasonal { background: #f0fdf4; color: #16a34a; }
  .tag-winter   { background: #eff6ff; color: #2563eb; }
  .tag-summer   { background: #fefce8; color: #ca8a04; }
  .tag-spring   { background: #f0fdf4; color: #16a34a; }
  .tag-fall     { background: #fff7ed; color: #c2410c; }

  .card-qty {
    font-size: 12px;
    color: #666;
    line-height: 1.4;
    background: #f8f6f2;
    border-radius: 6px;
    padding: 5px 8px;
    margin-top: 2px;
  }

  .card-actions {
    display: flex;
    gap: 6px;
    padding: 0 12px 12px;
  }
  .btn-howto {
    flex: 1;
    padding: 8px;
    border-radius: 8px;
    border: none;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-howto.available {
    background: #e84c8b;
    color: #fff;
  }
  .btn-howto.available:active { background: #cf3a77; }
  .btn-howto.unavailable {
    background: #f0ece6;
    color: #bbb;
    cursor: default;
  }

  /* PHOTO LIGHTBOX */
  .lightbox {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #000;
    z-index: 200;
  }
  .lightbox.open { display: block; }
  .lightbox img {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .lightbox-close {
    position: absolute;
    top: 16px;
    right: 20px;
    color: #fff;
    font-size: 44px;
    cursor: pointer;
    line-height: 1;
    background: rgba(0,0,0,0.5);
    border: none;
    border-radius: 50%;
    width: 52px;
    height: 52px;
    text-align: center;
    z-index: 201;
  }
  .lightbox-name {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 40px 24px 28px;
    background: -webkit-linear-gradient(top, transparent, rgba(0,0,0,0.75));
    background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.75));
    text-align: center;
    color: #fff;
    font-size: 24px;
    font-weight: 700;
    text-transform: capitalize;
    z-index: 201;
  }

  /* EMPTY STATE */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: #aaa;
    grid-column: 1 / -1;
  }
  .empty div { font-size: 48px; margin-bottom: 12px; }
  .empty p { font-size: 16px; }

  /* LOADING */
  .loading {
    text-align: center;
    padding: 60px;
    color: #bbb;
    font-size: 16px;
    grid-column: 1 / -1;
  }
</style>
</head>
<body>

<header>
  <h1>🎨 Party Projects</h1>
  <span id="project-count"></span>
</header>

<div class="filter-bar">
  <div class="filter-group" id="medium-filters">
    <button class="filter-btn active" data-filter="medium" data-value="all">All</button>
    <button class="filter-btn medium-obc" data-filter="medium" data-value="OBC">Oven-Bake Clay</button>
    <button class="filter-btn medium-clay" data-filter="medium" data-value="CLAY">Clay</button>
    <button class="filter-btn medium-painting" data-filter="medium" data-value="PAINTING">Painting</button>
    <button class="filter-btn medium-besties" data-filter="medium" data-value="BESTIES">Besties</button>
  </div>
  <div class="filter-group" id="audience-filters">
    <button class="filter-btn active" data-filter="audience" data-value="all">All Ages</button>
    <button class="filter-btn aud-kids" data-filter="audience" data-value="kids">Kids</button>
    <button class="filter-btn aud-adults" data-filter="audience" data-value="adults">Adults</button>
  </div>
</div>

<div class="results-bar" id="results-bar"></div>

<div class="grid" id="grid">
  <div class="loading">Loading projects…</div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close">×</button>
  <img id="lightbox-img" src="" alt="">
  <div class="lightbox-name" id="lightbox-name"></div>
</div>

<script>
  // ─── CONFIG ──────────────────────────────────────────────────────────────
  var SUPABASE_URL = 'https://snxibhbhhchjthfmjtaj.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNueGliaGJoaGNoanRoZm1qdGFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MDk3NjM5MDMsImV4cCI6MjAyNTMzOTkwM30.t8exGGkFnb5PnMHK7dFCEJGUcVABHlL8OiOqD3T2-AM';

  var allProjects = [];
  var activeMedium   = 'all';
  var activeAudience = 'all';

  // ─── MEDIUM DISPLAY NAMES ────────────────────────────────────────────────
  var MEDIUM_LABELS = {
    'OBC':      'Oven-Bake Clay',
    'CLAY':     'Clay',
    'PAINTING': 'Painting',
    'BESTIES':  'Besties'
  };

  var MEDIUM_EMOJIS = {
    'OBC':      '🧡',
    'CLAY':     '🪨',
    'PAINTING': '🎨',
    'BESTIES':  '💖'
  };

  var SEASONAL_LABELS = {
    'all-year': null,
    'winter': '❄️ Winter',
    'summer': '☀️ Summer',
    'spring': '🌸 Spring',
    'fall':   '🍂 Fall'
  };

  // ─── FETCH ───────────────────────────────────────────────────────────────
  function fetchProjects() {
    var url = SUPABASE_URL + '/rest/v1/party_projects?active=eq.true&order=medium,name';
    fetch(url, {
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
      }
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      allProjects = data;
      renderGrid();
    })
    .catch(function(err) {
      document.getElementById('grid').innerHTML = '<div class="loading">Could not load projects. Check connection.</div>';
      console.error(err);
    });
  }

  // ─── RENDER ──────────────────────────────────────────────────────────────
  function renderGrid() {
    var filtered = allProjects.filter(function(p) {
      var mediumMatch = activeMedium === 'all' || p.medium === activeMedium;
      var audMatch = activeAudience === 'all' ||
                     p.audience === activeAudience ||
                     p.audience === 'both';
      return mediumMatch && audMatch;
    });

    document.getElementById('project-count').textContent = allProjects.length + ' projects';
    document.getElementById('results-bar').textContent = filtered.length + ' of ' + allProjects.length + ' projects shown';

    if (filtered.length === 0) {
      document.getElementById('grid').innerHTML = '<div class="empty"><div>🔍</div><p>No projects match these filters.</p></div>';
      return;
    }

    var html = '';
    for (var i = 0; i < filtered.length; i++) {
      html += buildCard(filtered[i]);
    }
    document.getElementById('grid').innerHTML = html;
  }

  function buildCard(p) {
    var medKey = (p.medium || '').toLowerCase();
    var medLabel = MEDIUM_LABELS[p.medium] || p.medium;

    // Photo
    var photoHtml;
    if (p.photo_url) {
      photoHtml = '<div class="card-photo"><img src="' + p.photo_url + '" alt="' + p.name + '" onclick="openLightbox(\'' + encodeURIComponent(p.photo_url) + '\',\'' + encodeURIComponent(p.name) + '\')" loading="lazy"></div>';
    } else {
      var emoji = MEDIUM_EMOJIS[p.medium] || '🎨';
      photoHtml = '<div class="card-photo no-photo" onclick="openLightbox(null,\'' + encodeURIComponent(p.name) + '\')"><span>' + emoji + '</span></div>';
    }

    // Audience tag
    var audTag = '';
    if (p.audience === 'kids')   audTag = '<span class="tag tag-kids">Kids</span>';
    if (p.audience === 'adults') audTag = '<span class="tag tag-adults">Adults</span>';
    if (p.audience === 'both')   audTag = '<span class="tag tag-both">All Ages</span>';

    // Seasonal tag
    var seasonTag = '';
    if (p.seasonal && p.seasonal !== 'all-year' && SEASONAL_LABELS[p.seasonal]) {
      var sClass = 'tag-' + p.seasonal;
      seasonTag = '<span class="tag ' + sClass + '">' + SEASONAL_LABELS[p.seasonal] + '</span>';
    }

    // Quantity notes
    var qtyHtml = '';
    if (p.quantity_notes) {
      qtyHtml = '<div class="card-qty">🔢 ' + p.quantity_notes + '</div>';
    }

    // How-To button
    var btnHtml;
    if (p.pdf_url) {
      btnHtml = '<button class="btn-howto available" onclick="openPdf(\'' + encodeURIComponent(p.pdf_url) + '\')">📄 How-To Guide</button>';
    } else {
      btnHtml = '<button class="btn-howto unavailable" disabled>📄 Coming Soon</button>';
    }

    return '<div class="card">' +
      photoHtml +
      '<div class="card-body">' +
        '<div class="card-name">' + p.name + '</div>' +
        '<div class="card-tags">' +
          '<span class="tag tag-' + medKey + '">' + medLabel + '</span>' +
          audTag +
          seasonTag +
        '</div>' +
        qtyHtml +
      '</div>' +
      '<div class="card-actions">' + btnHtml + '</div>' +
    '</div>';
  }

  // ─── FILTERS ─────────────────────────────────────────────────────────────
  document.addEventListener('click', function(e) {
    var btn = e.target.closest('[data-filter]');
    if (!btn) return;

    var filterType = btn.getAttribute('data-filter');
    var value = btn.getAttribute('data-value');

    if (filterType === 'medium') {
      activeMedium = value;
      document.querySelectorAll('[data-filter="medium"]').forEach(function(b) {
        b.classList.toggle('active', b.getAttribute('data-value') === value);
      });
    }
    if (filterType === 'audience') {
      activeAudience = value;
      document.querySelectorAll('[data-filter="audience"]').forEach(function(b) {
        b.classList.toggle('active', b.getAttribute('data-value') === value);
      });
    }

    renderGrid();
  });

  // ─── LIGHTBOX ────────────────────────────────────────────────────────────
  function openLightbox(encodedUrl, encodedName) {
    var name = decodeURIComponent(encodedName);
    if (!encodedUrl) return;
    var url = decodeURIComponent(encodedUrl);
    document.getElementById('lightbox-img').src = url;
    document.getElementById('lightbox-name').textContent = name;
    document.getElementById('lightbox').classList.add('open');
  }

  document.getElementById('lightbox-close').addEventListener('click', function() {
    document.getElementById('lightbox').classList.remove('open');
    document.getElementById('lightbox-img').src = '';
  });

  document.getElementById('lightbox').addEventListener('click', function(e) {
    if (e.target === this) {
      this.classList.remove('open');
      document.getElementById('lightbox-img').src = '';
    }
  });

  // ─── PDF ─────────────────────────────────────────────────────────────────
  function openPdf(encodedUrl) {
    window.open(decodeURIComponent(encodedUrl), '_blank');
  }

  // ─── INIT ────────────────────────────────────────────────────────────────
  window.addEventListener('load', fetchProjects);
</script>
</body>
</html>
