<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Pickup — 4CATS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cats-clay: #C17B4E;
    --cats-clay-light: #F5EDE4;
    --cats-clay-dark: #8A5230;
    --cats-ink: #2A2420;
    --cats-mist: #F8F4F0;
    --cats-white: #FFFFFF;
    --cats-green: #3B6D11;
    --cats-green-light: #EAF3DE;
    --cats-green-mid: #639922;
    --cats-red: #A32D2D;
    --cats-red-light: #FCEBEB;
    --cats-amber: #854F0B;
    --cats-amber-light: #FAEEDA;
    --cats-blue: #185FA5;
    --cats-blue-light: #E6F1FB;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 2px 16px rgba(42,36,32,0.08);
  }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cats-mist);
    min-height: 100vh;
    color: var(--cats-ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1.5rem 4rem;
  }
  header { text-align: center; margin-bottom: 2.5rem; padding-top: 1rem; }
  .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    color: var(--cats-clay);
    letter-spacing: -0.5px;
    margin-bottom: 0.25rem;
  }
  .subtitle { font-size: 1rem; color: #7A6A60; font-weight: 400; }
  .card {
    background: var(--cats-white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 2rem;
    width: 100%;
    max-width: 660px;
  }
  .input-label {
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #7A6A60;
    margin-bottom: 0.5rem;
    display: block;
  }
  .tracking-row { display: flex; gap: 0.75rem; align-items: center; }
  .tracking-input {
    flex: 1;
    font-family: 'DM Sans', sans-serif;
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--cats-ink);
    border: 2px solid #E8DDD6;
    border-radius: var(--radius-sm);
    padding: 0.875rem 1.25rem;
    background: var(--cats-mist);
    outline: none;
    transition: border-color 0.15s, background 0.15s;
    min-width: 0;
  }
  .tracking-input:focus { border-color: var(--cats-clay); background: var(--cats-white); }
  .tracking-input::placeholder {
    color: #C5B8B0;
    letter-spacing: 0.05em;
    font-weight: 400;
    font-size: 1.1rem;
  }
  .btn-lookup {
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    padding: 0.875rem 1.75rem;
    border-radius: var(--radius-sm);
    border: none;
    cursor: pointer;
    background: var(--cats-clay);
    color: white;
    transition: background 0.15s, transform 0.1s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .btn-lookup:hover { background: var(--cats-clay-dark); }
  .btn-lookup:active { transform: scale(0.97); }
  .btn-lookup:disabled { background: #C5B8B0; cursor: default; transform: none; }
  .divider { border: none; border-top: 1.5px solid #F0E8E2; margin: 1.75rem 0; }
  #results { display: flex; flex-direction: column; gap: 1rem; }
  .result-card {
    border-radius: var(--radius-sm);
    border: 1.5px solid #E8DDD6;
    overflow: hidden;
    transition: box-shadow 0.2s;
  }
  .result-card.ready   { border-color: #B6D98A; }
  .result-card.picked-up { border-color: #C5B8B0; opacity: 0.7; }
  .result-card.not-ready { border-color: #F7C1C1; }
  .result-header {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem 1.25rem;
    background: var(--cats-mist);
  }
  .result-card.ready    .result-header { background: var(--cats-green-light); }
  .result-card.picked-up .result-header { background: #F5F2F0; }
  .result-card.not-ready .result-header { background: var(--cats-red-light); }
  .tracking-badge {
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--cats-clay-dark);
    background: var(--cats-clay-light);
    padding: 0.3rem 0.75rem;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .result-card.ready    .tracking-badge { color: var(--cats-green); background: #C0DD97; }
  .result-card.picked-up .tracking-badge { color: #7A6A60; background: #E8DDD6; }
  .result-card.not-ready .tracking-badge { color: var(--cats-red); background: #F7C1C1; }
  .type-chip {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0.2rem 0.5rem;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .type-clay  { background: var(--cats-amber-light); color: var(--cats-amber); }
  .type-party { background: var(--cats-blue-light);  color: var(--cats-blue); }
  .result-names { flex: 1; min-width: 0; }
  .result-project {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--cats-ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .result-customer {
    font-size: 0.875rem;
    color: #7A6A60;
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .status-pill {
    font-size: 0.75rem;
    font-weight: 600;
    padding: 0.25rem 0.625rem;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .s-ready_pickup  { background: var(--cats-green-light); color: var(--cats-green); }
  .s-picked_up     { background: #E8DDD6; color: #7A6A60; }
  .s-bisque_ready  { background: var(--cats-amber-light); color: var(--cats-amber); }
  .s-drying        { background: var(--cats-blue-light); color: var(--cats-blue); }
  .s-other         { background: #F1EFE8; color: #5F5E5A; }
  .result-body {
    padding: 1rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }
  .result-meta {
    font-size: 0.85rem;
    color: #7A6A60;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .btn-pickup {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 0.7rem 1.5rem;
    border-radius: var(--radius-sm);
    border: none;
    cursor: pointer;
    background: var(--cats-green-mid);
    color: white;
    transition: background 0.15s, transform 0.1s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .btn-pickup:hover { background: var(--cats-green); }
  .btn-pickup:active { transform: scale(0.97); }
  .btn-pickup:disabled { background: #C5B8B0; cursor: default; transform: none; }
  .error-msg {
    font-size: 0.9rem;
    color: var(--cats-red);
    background: var(--cats-red-light);
    border: 1px solid #F09595;
    border-radius: var(--radius-sm);
    padding: 0.875rem 1.25rem;
  }
  .empty-state {
    text-align: center;
    padding: 2rem 1rem;
    color: #7A6A60;
    font-size: 0.95rem;
  }
  .empty-state .icon { font-size: 2.5rem; margin-bottom: 0.75rem; display: block; }
  .hint-text { font-size: 0.8rem; color: #A89890; margin-top: 0.5rem; text-align: center; }
  .success-toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(120px);
    background: var(--cats-green);
    color: white;
    font-weight: 600;
    font-size: 0.95rem;
    padding: 0.875rem 1.75rem;
    border-radius: 100px;
    box-shadow: 0 4px 24px rgba(59,109,17,0.3);
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
    opacity: 0;
    pointer-events: none;
    z-index: 999;
    white-space: nowrap;
  }
  .success-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .spinner {
    display: inline-block;
    width: 18px; height: 18px;
    border: 2.5px solid rgba(255,255,255,0.4);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: -3px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 500px) {
    .tracking-input { font-size: 1.2rem; }
    .result-body { flex-direction: column; align-items: stretch; }
    .btn-pickup { width: 100%; text-align: center; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">4CATS</div>
  <div class="subtitle">Project Pickup</div>
</header>
<div class="card">
  <label class="input-label" for="trackingInput">Tracking number</label>
  <div class="tracking-row">
    <input
      type="text"
      id="trackingInput"
      class="tracking-input"
      placeholder="e.g. 10005"
      maxlength="20"
      autocomplete="off"
      autocapitalize="characters"
      spellcheck="false"
    >
    <button class="btn-lookup" id="lookupBtn" onclick="lookupTracking()">Look up</button>
  </div>
  <p class="hint-text">Press Enter or tap Look up. Searches both clay and party tickets.</p>
  <hr class="divider">
  <div id="results">
    <div class="empty-state">
      <span class="icon">😻</span>
      Enter a tracking number above to find a project
    </div>
  </div>
</div>
<div class="success-toast" id="toast"></div>
<script>
const SUPABASE_URL = 'https://snxibhbhhchjthfmjtaj.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNueGliaGJoaGNoanRoZm1qdGFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTk2ODAsImV4cCI6MjA5MjYzNTY4MH0.K-89Mx4SxU6N1hMmtK6Q79rWAtk6VTN9b5wemQxcZVA';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const STUDIO_NAMES = {
  'BC-RICH-GC':'Richmond - Garden City','BC-RICH-STV':'Richmond - Steveston',
  'BC-SUR-SSR':'Surrey - South','BC-YVR-KIT':'Vancouver - Kitsilano',
  'BC-YVR-MS':'Vancouver - Main Street','BC-YVR-UBC':'Vancouver - UBC',
  'BC-YYJ-CSV':'Victoria - Cook Street Village','BC-YYJ-ESQ':'Victoria - Esquimalt',
  'BC-YYJ-OB':'Victoria - Oak Bay','BC-YYJ-VIC':'Victoria - Uptown',
  'AB-YYC-ING':'Calgary - Inglewood','AB-STA-STA':'St Albert',
  'ON-BRL-BRL':'Burlington - South','ON-CMB-GLT':'Cambridge - Galt',
  'ON-ERN-ERN':'Erin','ON-HAM-OS':'Hamilton - Ottawa Street',
  'ON-HAM-WD':'Hamilton - Waterdown','ON-HAM-WH':'Hamilton - West Harbour',
  'ON-KGN-AP':'Kingston - Arlington Park','ON-LDN-BYR':'London - Byron',
  'ON-LDN-WVG':'London - Wortley Village','ON-MIS-PC':'Mississauga - Port Credit',
  'ON-OAK-OAK':'Oakville - North','ON-OAK-WST':'Oakville - West',
  'ON-YOW-GLB':'Ottawa - The Glebe','ON-STC-STC':'St Catharines',
  'ON-YYZ-AVE':'Toronto - Avenue Road','ON-YYZ-BP':'Toronto - Baby Point',
  'ON-YYZ-LEA':'Toronto - Leaside','ON-YYZ-BEA':'Toronto - The Beaches',
  'ON-WTR-WTR':'Waterloo - Uptown'
};
const lookedUp = {};
const input = document.getElementById('trackingInput');
const btn = document.getElementById('lookupBtn');
const resultsEl = document.getElementById('results');
input.addEventListener('keydown', e => { if (e.key === 'Enter') lookupTracking(); });
input.addEventListener('input', e => { e.target.value = e.target.value.toUpperCase(); });
function stageLabel(stage, type) {
  if (type === 'party') {
    return { ready: 'Ready for pickup', picked_up: 'Picked up', processing: 'Processing' }[stage]
      || (stage || 'Unknown').replace(/_/g, ' ');
  }
  return { ready_pickup: 'Ready for pickup', picked_up: 'Picked up', bisque_ready: 'At bisque stage', drying: 'Still drying' }[stage]
    || (stage || 'Unknown').replace(/_/g, ' ');
}
function stageClass(stage, type) {
  if (type === 'party') {
    return { ready: 's-ready_pickup', picked_up: 's-picked_up', processing: 's-drying' }[stage] || 's-other';
  }
  return { ready_pickup: 's-ready_pickup', picked_up: 's-picked_up', bisque_ready: 's-bisque_ready', drying: 's-drying' }[stage] || 's-other';
}
function cardClass(stage, type) {
  const readyVal = type === 'party' ? 'ready' : 'ready_pickup';
  if (stage === readyVal) return 'ready';
  if (stage === 'picked_up') return 'picked-up';
  return 'not-ready';
}
function formatDate(d) {
  if (!d) return null;
  return new Date(d + 'T12:00:00').toLocaleDateString('en-CA', { month: 'short', day: 'numeric', year: 'numeric' });
}
function renderResults() {
  const keys = Object.keys(lookedUp);
  if (keys.length === 0) {
    resultsEl.innerHTML = `<div class="empty-state"><span class="icon">🏺</span>Enter a tracking number above to find a project</div>`;
    return;
  }
  resultsEl.innerHTML = '';
  keys.reverse().forEach(key => {
    const item = lookedUp[key];
    if (item.error) {
      resultsEl.innerHTML += `<div class="error-msg">⚠️ <strong>${item.trackingNum}</strong> — ${item.error}</div>`;
      return;
    }
    const r = item.data;
    const type = item.type;
    const stage = type === 'clay' ? r.stage : r.status;
    const cc = cardClass(stage, type);
    const sc = stageClass(stage, type);
    const isReady = type === 'party' ? stage === 'ready' : stage === 'ready_pickup';
    const isPickedUp = stage === 'picked_up';
    let descLine = '';
    if (type === 'clay') {
      descLine = [r.description, r.artwork_description].filter(Boolean).join(' — ') || '(no description)';
    } else {
      descLine = r.session_title || '(no session title)';
    }
    let customerLine = '';
    if (type === 'party') customerLine = r.customer_name || '';
    const metaParts = [];
    if (r.studio_id) metaParts.push(`📍 ${STUDIO_NAMES[r.studio_id] || r.studio_id}`);
    if (type === 'clay' && r.clay_type) metaParts.push(`🏺 ${r.clay_type}`);
    if (type === 'clay' && r.medium) metaParts.push(`🎨 ${r.medium}`);
    if (type === 'clay' && r.pickup_expiry_date) metaParts.push(`📅 Expires ${formatDate(r.pickup_expiry_date)}`);
    if (type === 'party' && r.session_date) metaParts.push(`📅 ${formatDate(r.session_date)}`);
    if (type === 'party' && r.customer_email) metaParts.push(`✉️ ${r.customer_email}`);
    const pickupBtnHtml = isPickedUp
      ? `<span style="font-size:0.9rem;color:#7A6A60;font-weight:500;">✓ Done</span>`
      : `<button class="btn-pickup" id="pbtn-${r.id}" onclick="markPickedUp('${r.id}','${type}','${r.ticket_number}')">Mark as picked up</button>`;
    resultsEl.innerHTML += `
      <div class="result-card ${cc}" id="card-${type}-${r.id}">
        <div class="result-header">
          <span class="tracking-badge">${r.ticket_number}</span>
          <span class="type-chip type-${type}">${type === 'clay' ? 'Clay' : 'Party'}</span>
          <div class="result-names">
            <div class="result-project">${descLine}</div>
            ${customerLine ? `<div class="result-customer">${customerLine}</div>` : ''}
          </div>
          <span class="status-pill ${sc}">${stageLabel(stage, type)}</span>
        </div>
        ${metaParts.length || isReady || isPickedUp ? `
        <div class="result-body">
          <div class="result-meta">${metaParts.map(p => `<span>${p}</span>`).join('')}</div>
          ${pickupBtnHtml}
        </div>` : ''}
      </div>`;
  });
}
async function lookupTracking() {
  const raw = input.value.trim().toUpperCase();
  if (!raw) return;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';
  const [clayRes, partyRes] = await Promise.all([
    sb.from('clay_tickets')
      .select('id, ticket_number, studio_id, description, artwork_description, stage, clay_type, medium, pickup_expiry_date')
      .ilike('ticket_number', raw)
      .limit(1)
      .maybeSingle(),
    sb.from('party_tickets')
      .select('id, ticket_number, studio_id, customer_name, customer_email, session_title, session_date, status')
      .ilike('ticket_number', raw)
      .limit(1)
      .maybeSingle()
  ]);
  btn.disabled = false;
  btn.textContent = 'Look up';
  const clayData = !clayRes.error ? clayRes.data : null;
  const partyData = !partyRes.error ? partyRes.data : null;
  if (clayData) {
    lookedUp[raw] = { trackingNum: raw, type: 'clay', data: clayData };
  } else if (partyData) {
    lookedUp[raw] = { trackingNum: raw, type: 'party', data: partyData };
  } else {
    lookedUp[raw] = { trackingNum: raw, error: 'No ticket found with that number.' };
  }
  input.value = '';
  input.focus();
  renderResults();
}
async function markPickedUp(id, type, ticketNumber) {
  const pbtn = document.getElementById(`pbtn-${id}`);
  if (pbtn) { pbtn.disabled = true; pbtn.innerHTML = '<span class="spinner"></span>'; }
  const table = type === 'clay' ? 'clay_tickets' : 'party_tickets';
  const field = type === 'clay' ? 'stage' : 'status';
  const today = new Date().toISOString().split('T')[0];
  const updateData = { [field]: 'picked_up' };
  if (type === 'clay') updateData.picked_up_on = today;
  const { error } = await sb.from(table).update(updateData).eq('id', id);
  if (error) {
    if (pbtn) { pbtn.disabled = false; pbtn.textContent = 'Mark as picked up'; }
    alert('Could not update. Please try again.');
    return;
  }
  const item = lookedUp[ticketNumber];
  if (item) {
    if (type === 'clay') item.data.stage = 'picked_up';
    else item.data.status = 'picked_up';
  }
  renderResults();
  showToast('✓ Picked up — ' + ticketNumber);
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
</body>
</html>
