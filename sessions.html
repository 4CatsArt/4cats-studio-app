  @media (prefers-reduced-motion: reduce) { .bar, .drawer { transition: none; } }

const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNueGliaGJoaGNoanRoZm1qdGFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTk2ODAsImV4cCI6MjA5MjYzNTY4MH0.K-89Mx4SxU6N1hMmtK6Q79rWAtk6VTN9b5wemQxcZVA'

const KINDS = { workshop: 'Workshop', wheel: 'Wheel workshop', glazing: 'Glazing', mini: 'Mini Make', class: 'Class', camp: 'Camp or PA/PD day', party: 'Party', trip: 'Field trip', event: 'Event' }
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
const PAGE = 400

const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const ymd = d => d.toLocaleDateString('en-CA')
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return ymd(d) }
const tl = t => { if (!t) return ''; const [h, m] = t.split(':').map(Number); return (h % 12 || 12) + (m ? ':' + String(m).padStart(2, '0') : '') + (h < 12 ? 'am' : 'pm') }
const slug = n => String(n || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/&/g, ' and ').replace(/['\u2019]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '')

function kindOf(r) {
  const t = String(r.title || '')
  if (r.type === 'party' || r.party || /party|get.?together|splatter/i.test(t)) return 'party'
  if (/field trip/i.test(t)) return 'trip'
  if (r.type === 'festival') return 'event'
  if (/camp|\bp[ad]\s*(\/\s*p[ad])?\s*day|no[\s-]school/i.test(t)) return 'camp'
  if (r.slot || /class\s*\d+\s*of|week session/i.test(t)) return 'class'
  if (r.item_kind === 'glazing' || r.type === 'glazing' || /glaz/i.test(t)) return 'glazing'
  if (r.item_kind === 'mini_make' || /mini\s*make/i.test(t)) return 'mini'
  if (/wheel/i.test(t)) return 'wheel'
  return 'workshop'
}
function linkOf(r) {
  if (r.class_slug) return 'https://world.4cats.com/#class/' + encodeURIComponent(r.class_slug)
  if (r.item && r.item_title) return 'https://world.4cats.com/#project/' + slug(r.item_title)
  return null
}
// A number filter: "0", ">0", "<3", ">=5", "2-6"
function numOk(v, f) {
  f = f.replace(/\s/g, ''); if (!f) return true
  let m
  if ((m = f.match(/^(\d+(?:\.\d+)?)-(\d+(?:\.\d+)?)$/))) return v >= +m[1] && v <= +m[2]
  if ((m = f.match(/^(>=|<=|>|<|=)?(\d+(?:\.\d+)?)$/))) { const n = +m[2]; switch (m[1]) { case '>': return v > n; case '<': return v < n; case '>=': return v >= n; case '<=': return v <= n; default: return v === n } }
  return true
}

let rows = [], view = [], shown = PAGE, sel = new Set(), sort = { key: 'when', dir: 1 }, F = {}
const COLS = [
  { key: 'pick', label: '', nosort: true },
  { key: 'when', label: 'Date', get: r => r.d + ' ' + (r.t || ''), cell: r => esc(new Date(r.d + 'T12:00:00').toLocaleDateString('en-CA', { month: 'short', day: 'numeric', year: r.d.slice(0, 4) === String(new Date().getFullYear()) ? undefined : 'numeric' })), filter: 'text', fget: r => r.d },
  { key: 'day', label: 'Day', get: r => new Date(r.d + 'T12:00:00').getDay(), cell: r => DAYS[new Date(r.d + 'T12:00:00').getDay()], filter: 'select', opts: () => DAYS.map((d, i) => [String(i), d]), fget: r => String(new Date(r.d + 'T12:00:00').getDay()) },
  { key: 'time', label: 'Time', get: r => r.t || '', cell: r => tl(r.t), filter: 'text', fget: r => tl(r.t) },
  { key: 'studio', label: 'Studio', get: r => STUDIOS[r.st] || r.st, cell: r => '<button class="studio" data-studio="' + esc(r.st) + '" title="Show only this studio">' + esc(STUDIOS[r.st] || r.st) + '</button>', filter: 'select', opts: () => Object.entries(STUDIOS).sort((a, b) => a[1].localeCompare(b[1])), fget: r => r.st },
  { key: 'title', label: 'Title', get: r => String(r.title || '').toLowerCase(), cell: r => { const u = linkOf(r); return u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener" title="Open on 4Cats World">' + esc(r.title) + '</a>' : esc(r.title) }, filter: 'text', fget: r => r.title, cls: 'title' },
  { key: 'kind', label: 'Kind', get: r => r._k, cell: r => '<span class="kind ' + r._k + '">' + KINDS[r._k] + '</span>', filter: 'select', opts: () => Object.entries(KINDS), fget: r => r._k },
  { key: 'booked', label: 'Booked', get: r => r.booked, cell: r => '<button class="bk' + (r.booked ? '' : ' zero') + '" data-bk="' + r.id + '" title="See who\u2019s booked">' + r.booked + '</button>' + (r.cancelled ? '<span class="why">' + r.cancelled + ' cancelled</span>' : '') + (r.records ? '<span class="why">' + esc(r.records) + '</span>' : ''), filter: 'num', fget: r => r.booked, n: true },
  { key: 'cap', label: 'Spots', get: r => r.cap ?? -1, cell: r => r.cap ?? '<span class="no">\u2013</span>', filter: 'num', fget: r => r.cap ?? 0, n: true },
  { key: 'left', label: 'Left', get: r => r.left ?? -1, cell: r => r.left ?? '<span class="no">\u2013</span>', filter: 'num', fget: r => r.left ?? 0, n: true },
  { key: 'fill', label: 'Fill', get: r => r._fill, cell: r => r.cap ? '<span class="fill"><i style="width:' + Math.min(100, r._fill) + '%"></i></span>' + r._fill + '%' : '<span class="no">\u2013</span>', filter: 'num', fget: r => r._fill, n: true },
  { key: 'show', label: 'Visible', get: r => r.show ? 1 : 0, cell: r => r.show ? '<span title="On sale on World and on the studio\u2019s screens">Yes</span>' : '<span class="no" title="Off sale on World and off the studio\u2019s screens">Hidden</span>', filter: 'select', opts: () => [['1', 'Yes'], ['0', 'Hidden']], fget: r => r.show ? '1' : '0' },
  { key: 'staff', label: 'Staff', get: r => r.staff, cell: r => r.staff || '<span class="no">0</span>', filter: 'num', fget: r => r.staff, n: true },

sb.auth.getSession().then(({ data: { session } }) => session ? start() : ($('signin').style.display = ''))
async function signIn() {
  const { error } = await sb.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value })
  if (error) { $('sm').textContent = error.message; return }
  $('signin').style.display = 'none'; start()
}
function start() {
  $('app').style.display = ''
  buildHead()
  const saved = (() => { try { return JSON.parse(localStorage.getItem('fc_sessions_range') || 'null') } catch { return null } })()
  setRange(saved && saved.r ? saved.r : '30', saved)
  $('from').onchange = $('to').onchange = () => { markChip(null); load() }
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => setRange(c.dataset.r))

  $('clearF').onclick = () => { F = {}; document.querySelectorAll('tr.f input, tr.f select').forEach(x => x.value = ''); apply() }
  $('selClear').onclick = () => { sel.clear(); render() }
  $('delBtn').onclick = askDelete
  $('csv').onclick = csv
  $('scrim').onclick = closeAll
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll() })

    const s = e.target.closest('[data-studio]'); if (s) { F.studio = s.dataset.studio; const el = document.querySelector('tr.f [data-f="studio"]'); if (el) el.value = s.dataset.studio; apply(); return }

  })

}
function setRange(r, saved) {
  const t = ymd(new Date())
  let a = t, b = addDays(t, 30)
  if (r === 'today') b = addDays(t, 365)
  else if (r === 'week') { const d = new Date(); const dow = (d.getDay() + 6) % 7; a = addDays(t, -dow); b = addDays(a, 6) }
  else if (r === '90') b = addDays(t, 90)

  else if (r === 'custom' && saved) { a = saved.a; b = saved.b }
  $('from').value = a; $('to').value = b; markChip(r === 'custom' ? null : r); load()
}
function markChip(r) { document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.r === r)) }
async function load() {
  const a = $('from').value, b = $('to').value
  if (!a || !b) return
  const on = document.querySelector('.chip.on')
  try { localStorage.setItem('fc_sessions_range', JSON.stringify(on ? { r: on.dataset.r } : { r: 'custom', a, b })) } catch { }
  $('summary').textContent = 'Loading\u2026'; $('tbody').innerHTML = ''; $('more').innerHTML = ''

  $('summary').textContent = rows.length.toLocaleString() + ' class times ' + (rows.length >= 12000 ? '(the first 12,000: choose fewer dates to see the rest)' : 'in these dates')
  apply()
}
function buildHead() {
  $('thead').innerHTML = '<tr>' + COLS.map(c => c.key === 'pick' ? '<th class="nosort"><input type="checkbox" id="headBox" aria-label="Select all shown"></th>'
      : '<th data-sort="' + c.key + '"' + (c.n ? ' class="n"' : '') + '>' + c.label + '<span class="arr" id="arr-' + c.key + '"></span></th>').join('') + '</tr>' +
    '<tr class="f">' + COLS.map(c => '<th>' + (c.filter === 'text' ? '<input data-f="' + c.key + '" placeholder="Filter">'
      : c.filter === 'num' ? '<input data-f="' + c.key + '" placeholder="0, >2" title="A number, or >2, <3, 2-6">'
      : c.filter === 'select' ? '<select data-f="' + c.key + '"><option value="">All</option>' + c.opts().map(([v, l]) => '<option value="' + esc(v) + '">' + esc(l) + '</option>').join('') + '</select>' : '') + '</th>').join('') + '</tr>'
  document.querySelectorAll('[data-sort]').forEach(th => th.onclick = () => { const k = th.dataset.sort; sort = sort.key === k ? { key: k, dir: -sort.dir } : { key: k, dir: 1 }; apply() })
  let tmr; document.querySelectorAll('tr.f [data-f]').forEach(el => el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => { clearTimeout(tmr); tmr = setTimeout(() => { F[el.dataset.f] = el.value; apply() }, el.tagName === 'SELECT' ? 0 : 180) }))
  $('headBox').onchange = e => { if (e.target.checked) view.forEach(r => { if (!r._lock) sel.add(r.id) }); else view.forEach(r => sel.delete(r.id)); render() }
}
function apply() {
  view = rows.filter(r => COLS.every(c => {
    const f = (F[c.key] || '').trim(); if (!f || !c.filter) return true
    const v = c.fget(r)
    if (c.filter === 'num') return numOk(Number(v) || 0, f)
    if (c.filter === 'select') return String(v) === f
    return String(v).toLowerCase().includes(f.toLowerCase())
  }))
  const c = COLS.find(x => x.key === sort.key) || COLS[1]
  view.sort((a, b) => { const x = c.get(a), y = c.get(b); return (x < y ? -1 : x > y ? 1 : 0) * sort.dir || (a.d + a.t < b.d + b.t ? -1 : 1) })
  COLS.forEach(x => { const el = $('arr-' + x.key); if (el) el.textContent = x.key === sort.key ? (sort.dir > 0 ? '\u2191' : '\u2193') : '' })
  shown = PAGE; render()
}
function render() {
  const part = view.slice(0, shown)
  $('tbody').innerHTML = part.length ? part.map(r => '<tr' + (sel.has(r.id) ? ' class="sel"' : '') + '>' + COLS.map(c => c.key === 'pick'
      ? '<td>' + (r._lock ? '<span class="lock" title="' + esc(r._lock) + ': can\u2019t be deleted">\ud83d\udd12</span>' : '<input type="checkbox" data-pick="' + r.id + '"' + (sel.has(r.id) ? ' checked' : '') + ' aria-label="Select">') + '</td>'
      : '<td' + (c.n ? ' class="n"' : c.cls ? ' class="' + c.cls + '"' : '') + '>' + c.cell(r) + '</td>').join('') + '</tr>').join('')
    : '<tr><td colspan="' + COLS.length + '" class="empty">' + (rows.length ? 'Nothing matches these filters. Clear a filter to see more.' : 'No class times in these dates.') + '</td></tr>'
  $('more').innerHTML = view.length > shown ? '<div class="more"><button class="linkbtn" id="moreBtn">Show ' + Math.min(PAGE, view.length - shown) + ' more (of ' + (view.length - shown).toLocaleString() + ')</button></div>' : ''
  if ($('moreBtn')) $('moreBtn').onclick = () => { shown += PAGE; render() }
  const locked = view.filter(r => r._lock).length
  $('count').textContent = view.length.toLocaleString() + ' shown' + (view.length !== rows.length ? ' of ' + rows.length.toLocaleString() : '') + (locked ? ' \u00b7 ' + locked + ' with bookings or records (\ud83d\udd12)' : '')
  bar(); headBox()
}
function headBox() { const hb = $('headBox'); if (!hb) return; const can = view.filter(r => !r._lock); const n = can.filter(r => sel.has(r.id)).length; hb.checked = !!can.length && n === can.length; hb.indeterminate = n > 0 && n < can.length }
function bar() {
  const n = sel.size; $('bar').classList.toggle('on', n > 0)
  if (!n) return
  const picked = rows.filter(r => sel.has(r.id)), hidden = picked.filter(r => !view.includes(r)).length
  $('selN').textContent = n.toLocaleString() + ' selected'
  $('selInfo').textContent = hidden ? '(' + hidden + ' not in the current filters)' : ''
  $('delBtn').textContent = 'Delete ' + n.toLocaleString()
}
function askDelete() {
  const picked = rows.filter(r => sel.has(r.id) && !r._lock); if (!picked.length) return
  const past = picked.filter(r => r.d < ymd(new Date())).length, staff = picked.reduce((t, r) => t + (r.staff || 0), 0)
  const studios = new Set(picked.map(r => r.st)).size
  $('modal').innerHTML = '<h2>Delete ' + picked.length.toLocaleString() + ' class time' + (picked.length === 1 ? '' : 's') + '?</h2>' +
    '<p>At ' + studios + ' studio' + (studios === 1 ? '' : 's') + ', ' + esc(fmtD(picked.reduce((a, r) => r.d < a ? r.d : a, '9999'))) + ' to ' + esc(fmtD(picked.reduce((a, r) => r.d > a ? r.d : a, ''))) + '. This can\u2019t be undone.</p><ul>' +
    (staff ? '<li>' + staff + ' staff assignment' + (staff === 1 ? '' : 's') + ' on these times come off too.</li>' : '') +
    (past ? '<li>' + past + ' ' + (past === 1 ? 'is' : 'are') + ' in the past.</li>' : '') +
    '<li>Any that turn out to have a booking or customer record are kept (and listed after).</li></ul>' +
    '<div class="row"><button class="linkbtn" id="mCancel">Cancel</button><button class="go" id="mGo">Delete ' + picked.length.toLocaleString() + '</button></div>'
  $('scrim').classList.add('on'); $('modal').classList.add('on'); $('mGo').focus()
  $('mCancel').onclick = closeAll
  $('mGo').onclick = async () => {
    $('mGo').disabled = true; $('mGo').textContent = 'Deleting\u2026'
    const ids = picked.map(r => r.id), done = { deleted: 0, skipped: [] }
    for (let i = 0; i < ids.length; i += 1000) {
      const { data, error } = await sb.rpc('hub_sessions_delete', { p_ids: ids.slice(i, i + 1000) })
      if (error) { closeAll(); toast('Not deleted: ' + (/hub_sessions_delete/.test(error.message) ? 'run sessions_table.sql in Supabase first.' : error.message) + (done.deleted ? ' (' + done.deleted + ' were deleted before this.)' : '')); await load(); return }
      done.deleted += data.deleted || 0; done.skipped = done.skipped.concat(data.skipped || [])
    }
    closeAll(); sel.clear()
    toast('Deleted ' + done.deleted.toLocaleString() + '.' + (done.skipped.length ? ' Kept ' + done.skipped.length + ': ' + done.skipped.slice(0, 5).map(k => esc(k.title) + ' (' + fmtD(k.d) + ', ' + esc(k.why) + ')').join('; ') + (done.skipped.length > 5 ? '\u2026' : '') : ''), done.skipped.length ? 12000 : 5000)
    await load()
  }
}
const fmtD = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric' }) : ''
async function openBookings(id) {
  const r = rows.find(x => x.id === id); if (!r) return
  $('drawer').innerHTML = '<button class="linkbtn x" id="dClose">Close</button><h2>' + esc(r.title) + '</h2><p style="color:var(--soft);margin:0 0 12px">' + esc(STUDIOS[r.st] || r.st) + ', ' + esc(fmtD(r.d)) + ' at ' + tl(r.t) + '</p><p>Loading\u2026</p>'
  $('scrim').classList.add('on'); $('drawer').classList.add('on'); $('dClose').onclick = closeAll
  const { data, error } = await sb.rpc('hub_sessions_bookings', { p_session: id })
  const list = data || []
  $('drawer').innerHTML = '<button class="linkbtn x" id="dClose">Close</button><h2>' + esc(r.title) + '</h2><p style="color:var(--soft);margin:0 0 12px">' + esc(STUDIOS[r.st] || r.st) + ', ' + esc(fmtD(r.d)) + ' at ' + tl(r.t) + ' \u00b7 ' + r.booked + ' booked of ' + (r.cap ?? '?') + '</p>' +
    (error ? '<p class="err">' + esc(error.message) + '</p>' : !list.length ? '<p>Nobody has booked this time.</p>'
      : '<table><thead><tr><th>Who</th><th class="n">Spots</th><th>Order</th></tr></thead><tbody>' + list.map(b => '<tr' + (b.returned_at ? ' style="opacity:.55"' : '') + '><td>' + esc(b.name || '') + (b.email ? '<br><span style="color:var(--soft);font-size:12.5px">' + esc(b.email) + '</span>' : '') + (b.returned_at ? '<br><span style="font-size:12px">Cancelled</span>' : '') + '</td><td class="n">' + esc(b.qty) + '</td><td>' + esc(b.order || '') + '</td></tr>').join('') + '</tbody></table>')
  $('dClose').onclick = closeAll
}
function closeAll() { $('scrim').classList.remove('on'); $('modal').classList.remove('on'); $('drawer').classList.remove('on') }
let tt; function toast(html, ms = 5000) { const t = $('toast'); t.innerHTML = html; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), ms) }
function csv() {
  const head = ['Date', 'Day', 'Time', 'Studio', 'Title', 'Kind', 'Booked', 'Spots', 'Left', 'Fill %', 'Visible', 'Staff', 'Status', 'Link']
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"'
  const lines = [head.map(q).join(',')].concat(view.map(r => [r.d, DAYS[new Date(r.d + 'T12:00:00').getDay()], tl(r.t), STUDIOS[r.st] || r.st, r.title, KINDS[r._k], r.booked, r.cap ?? '', r.left ?? '', r.cap ? r._fill : '', r.show ? 'Yes' : 'Hidden', r.staff, r.status || '', linkOf(r) || ''].map(q).join(',')))
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([lines.join('\n')], { type: 'text/csv' })); a.download = 'class-times-' + $('from').value + '-to-' + $('to').value + '.csv'; a.click()
}
