<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="https://cdn.shopify.com/s/files/1/1451/3756/files/favicon.png?v=1613591354"><meta charset="UTF-8">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>4CATS Sign In</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f0; min-height: 100vh; }

  /* Header */
  .header { background: #1a1a2e; color: white; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
  .header-logo { font-size: 18px; font-weight: 700; letter-spacing: 1px; color: #f0c040; }
  .header-studio { font-size: 13px; color: #aaa; margin-top: 2px; }
  .mode-toggle { display: flex; gap: 6px; }
  .mode-btn { padding: 6px 14px; border-radius: 20px; border: 1.5px solid #444; background: none; color: #aaa; font-size: 12px; cursor: pointer; transition: all 0.15s; }
  .mode-btn.active-workshop { background: #2d6a9f; border-color: #2d6a9f; color: white; font-weight: 600; }
  .mode-btn.active-party { background: #99354e; border-color: #99354e; color: white; font-weight: 600; }

  /* Session selector */
  .session-bar { background: white; border-bottom: 1px solid #e0e0d8; padding: 12px 20px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .session-bar label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
  .session-select { flex: 1; min-width: 200px; padding: 8px 12px; border: 1.5px solid #d0d0c8; border-radius: 8px; font-size: 14px; outline: none; background: white; }
  .session-select:focus { border-color: #2d6a9f; }
  .lock-btn { padding: 7px 14px; border-radius: 8px; border: 1.5px solid #ccc; background: none; font-size: 12px; color: #666; cursor: pointer; white-space: nowrap; }
  .lock-btn.locked { background: #e8f5e9; border-color: #4caf50; color: #2e7d32; }
  .session-locked-label { font-size: 13px; color: #333; font-weight: 600; flex: 1; }

  /* Ticket section */
  .ticket-bar { background: #fffbea; border-bottom: 1px solid #f0e098; padding: 12px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .ticket-info { display: flex; align-items: center; gap: 10px; flex: 1; }
  .ticket-label { font-size: 11px; color: #7a6200; text-transform: uppercase; letter-spacing: 0.5px; }
  .ticket-number { font-size: 28px; font-weight: 800; color: #7a4f00; letter-spacing: 3px; font-variant-numeric: tabular-nums; }
  .ticket-hint { font-size: 11px; color: #a08020; margin-top: 2px; }
  .new-ticket-btn { padding: 8px 16px; background: #f0c040; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; color: #3a2a00; cursor: pointer; }
  .new-ticket-btn:hover { background: #e0b030; }
  .same-ticket-btn { padding: 8px 16px; background: white; border: 1.5px solid #d4a820; border-radius: 8px; font-size: 13px; color: #7a4f00; cursor: pointer; }

  /* Main form area */
  .main { padding: 20px; max-width: 640px; margin: 0 auto; }

  /* People list */
  .people-list { margin-bottom: 16px; }
  .person-row { background: white; border-radius: 10px; border: 1px solid #e0e0d8; padding: 14px 16px; margin-bottom: 10px; }
  .person-row.party-row { border-color: #f0b8cc; background: #fff8fb; }
  .person-row-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .person-num { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
  .remove-person { background: none; border: none; color: #ccc; font-size: 18px; cursor: pointer; padding: 0 4px; line-height: 1; }
  .remove-person:hover { color: #e53935; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field-row.single { grid-template-columns: 1fr; }
  .field-group label { display: block; font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
  .field-group input { width: 100%; padding: 10px 12px; border: 1.5px solid #d0d0c8; border-radius: 8px; font-size: 16px; outline: none; font-family: inherit; }
  .field-group input:focus { border-color: #2d6a9f; }
  .party-row .field-group input:focus { border-color: #99354e; }

  /* Buttons */
  .add-person-btn { width: 100%; padding: 12px; border: 1.5px dashed #c0c0b8; border-radius: 10px; background: none; color: #888; font-size: 14px; cursor: pointer; margin-bottom: 20px; }
  .add-person-btn:hover { border-color: #2d6a9f; color: #2d6a9f; }

  .submit-btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 18px; font-weight: 700; cursor: pointer; transition: background 0.15s; }
  .submit-btn.workshop-submit { background: #2d6a9f; color: white; }
  .submit-btn.workshop-submit:hover { background: #1e5080; }
  .submit-btn.party-submit { background: #99354e; color: white; }
  .submit-btn.party-submit:hover { background: #7a2940; }
  .submit-btn:disabled { background: #ccc; cursor: not-allowed; }

  /* Empty state */
  .empty-msg { text-align: center; color: #aaa; font-size: 14px; padding: 40px 20px; }

  /* Success screen */
  .success-screen { display: none; position: fixed; inset: 0; background: white; flex-direction: column; align-items: center; justify-content: center; padding: 40px; text-align: center; z-index: 100; }
  .success-screen.show { display: flex; }
  .success-icon { font-size: 72px; margin-bottom: 20px; }
  .success-title { font-size: 28px; font-weight: 800; color: #222; margin-bottom: 8px; }
  .success-ticket { font-size: 52px; font-weight: 900; color: #7a4f00; letter-spacing: 5px; margin: 16px 0; font-variant-numeric: tabular-nums; }
  .success-ticket-label { font-size: 13px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
  .success-sub { font-size: 16px; color: #666; margin-bottom: 32px; }
  .success-next-btn { padding: 14px 40px; background: #1a1a2e; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; }
  .success-names { font-size: 14px; color: #444; margin: 8px 0 20px; }

  /* Toast */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 24px; border-radius: 10px; font-size: 14px; z-index: 200; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .toast.show { opacity: 1; }

  /* No session warning */
  .no-session-warning { background: #fff3cd; border: 1px solid #ffc107; border-radius: 10px; padding: 14px 16px; color: #664d03; font-size: 14px; margin-bottom: 16px; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-logo">4CATS</div>
    <div class="header-studio" id="studio-name-display">Loading studio...</div>
  </div>
  <div class="mode-toggle">
    <button class="mode-btn active-workshop" id="btn-workshop" onclick="setMode('workshop')">🎨 Workshop</button>
    <button class="mode-btn" id="btn-party" onclick="setMode('party')">🎉 Party</button>
  </div>
</div>

<div class="session-bar" id="session-bar">
  <label>Session:</label>
  <select class="session-select" id="session-select" onchange="onSessionChange()">
    <option value="">— Loading sessions —</option>
  </select>
  <button class="lock-btn" id="lock-btn" onclick="toggleLock()">🔒 Lock</button>
</div>

<div class="ticket-bar" id="ticket-bar">
  <div class="ticket-info">
    <div>
      <div class="ticket-label">Clay Ticket #</div>
      <div class="ticket-number" id="ticket-display">—</div>
      <div class="ticket-hint" id="ticket-hint">Tap "New Ticket" to assign one, or skip if no clay work today.</div>
    </div>
  </div>
  <button class="same-ticket-btn" id="same-ticket-btn" onclick="useSameTicket()" style="display:none">Same ticket</button>
  <button class="new-ticket-btn" onclick="createNewTicket()">+ New Ticket</button>
</div>

<div class="main">
  <div id="no-session-warning" class="no-session-warning" style="display:none">
    ⚠️ Please select a session above before signing in.
  </div>
  <div class="people-list" id="people-list"></div>
  <button class="add-person-btn" onclick="addPerson()" id="add-person-btn">+ Add another person</button>
  <button class="submit-btn workshop-submit" id="submit-btn" onclick="submitSignIn()">Sign In</button>
</div>

<div class="success-screen" id="success-screen">
  <div class="success-icon">✅</div>
  <div class="success-title">Signed in!</div>
  <div class="success-names" id="success-names"></div>
  <div id="success-ticket-area" style="display:none">
    <div class="success-ticket-label">Write this number on your piece(s):</div>
    <div class="success-ticket" id="success-ticket-num"></div>
  </div>
  <div class="success-sub" id="success-sub">Thanks for coming!</div>
  <button class="success-next-btn" onclick="resetForNext()">Next person / group →</button>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://snxibhbhhchjthfmjtaj.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNueGliaGJoaGNoanRoZm1qdGFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTk2ODAsImV4cCI6MjA5MjYzNTY4MH0.K-89Mx4SxU6N1hMmtK6Q79rWAtk6VTN9b5wemQxcZVA'
const { createClient } = supabase
const sb = createClient(SUPABASE_URL, SUPABASE_KEY)

// Studio ID map (abbreviated)
const STUDIO_NAMES = {
  'BC-RICH-GC':'Richmond - Garden City','BC-RICH-STV':'Richmond - Steveston','BC-SUR-SSR':'Surrey - South',
  'BC-YVR-KIT':'Vancouver - Kitsilano','BC-YVR-MS':'Vancouver - Main Street','BC-YVR-UBC':'Vancouver - UBC',
  'BC-YYJ-CSV':'Victoria - Cook Street Village','BC-YYJ-ESQ':'Victoria - Esquimalt','BC-YYJ-OB':'Victoria - Oak Bay',
  'BC-YYJ-VIC':'Victoria - Uptown','AB-YYC-ING':'Calgary - Inglewood','AB-STA-STA':'St Albert',
  'ON-BRL-BRL':'Burlington - South','ON-CMB-GLT':'Cambridge - Galt','ON-ERN-ERN':'Erin',
  'ON-HAM-OS':'Hamilton - Ottawa Street','ON-HAM-WD':'Hamilton - Waterdown','ON-HAM-WH':'Hamilton - West Harbour',
  'ON-KGN-AP':'Kingston - Arlington Park','ON-LDN-BYR':'London - Byron','ON-LDN-WVG':'London - Wortley Village',
  'ON-MIS-PC':'Mississauga - Port Credit','ON-OAK-OAK':'Oakville - North','ON-OAK-WST':'Oakville - West',
  'ON-YOW-GLB':'Ottawa - The Glebe','ON-STC-STC':'St Catharines','ON-YYZ-AVE':'Toronto - Avenue Road',
  'ON-YYZ-BP':'Toronto - Baby Point','ON-YYZ-LEA':'Toronto - Leaside','ON-YYZ-BEA':'Toronto - The Beaches',
  'ON-WTR-WTR':'Waterloo - Uptown'
}

let currentMode = 'workshop'
let studioId = null
let sessionLocked = false
let currentTicketId = null
let currentTicketNumber = null
let lastTicketId = null
let lastTicketNumber = null
let personCount = 0

// ── Init ──────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  const params = new URLSearchParams(window.location.search)
  studioId = params.get('studio') || null

  if (!studioId) {
    document.getElementById('studio-name-display').textContent = '⚠️ No studio set in URL (?studio=BC-YVR-MS)'
  } else {
    document.getElementById('studio-name-display').textContent = STUDIO_NAMES[studioId] || studioId
  }

  await loadSessions()
  addPerson()
})

// ── Session loading ───────────────────────────────────────────
async function loadSessions() {
  const sel = document.getElementById('session-select')
  if (!studioId) { sel.innerHTML = '<option value="">— Set ?studio= in URL —</option>'; return }

  const today = new Date().toISOString().split('T')[0]
  const { data, error } = await sb.from('sessions')
    .select('id, title, session_time, session_type')
    .eq('studio_id', studioId)
    .eq('session_date', today)
    .order('session_time')

  if (error || !data?.length) {
    sel.innerHTML = '<option value="">— No sessions today —</option>'
    return
  }

  sel.innerHTML = '<option value="">— Select a session —</option>'
  data.forEach(s => {
    const time = s.session_time ? s.session_time.slice(0,5) : ''
    const opt = document.createElement('option')
    opt.value = s.id
    opt.textContent = `${time} · ${s.title}`
    opt.dataset.type = s.session_type || ''
    sel.appendChild(opt)
  })

  // Auto-select if party mode is set via URL
  const modeParam = params().get('mode')
  if (modeParam === 'party') setMode('party')
}

function params() { return new URLSearchParams(window.location.search) }

function onSessionChange() {
  // Auto-switch mode based on session type
  const sel = document.getElementById('session-select')
  const opt = sel.options[sel.selectedIndex]
  if (!opt) return
  const t = (opt.dataset.type || '').toLowerCase()
  if (t.includes('party')) setMode('party')
}

// ── Mode ──────────────────────────────────────────────────────
function setMode(mode) {
  currentMode = mode
  document.getElementById('btn-workshop').className = 'mode-btn' + (mode === 'workshop' ? ' active-workshop' : '')
  document.getElementById('btn-party').className = 'mode-btn' + (mode === 'party' ? ' active-party' : '')
  document.getElementById('submit-btn').className = `submit-btn ${mode}-submit`
  document.getElementById('submit-btn').textContent = mode === 'party' ? 'Sign In Child' : 'Sign In'
  // Hide ticket bar for parties (parties don't need clay tickets)
  document.getElementById('ticket-bar').style.display = mode === 'party' ? 'none' : ''
  rebuildPeople()
}

// ── Session lock ──────────────────────────────────────────────
function toggleLock() {
  const sel = document.getElementById('session-select')
  if (!sel.value) { showToast('Please select a session first'); return }
  sessionLocked = !sessionLocked
  const btn = document.getElementById('lock-btn')
  if (sessionLocked) {
    btn.textContent = '🔓 Unlock'
    btn.classList.add('locked')
    const text = sel.options[sel.selectedIndex]?.text || ''
    sel.style.display = 'none'
    const lbl = document.createElement('div')
    lbl.id = 'session-locked-label'
    lbl.className = 'session-locked-label'
    lbl.textContent = text
    sel.parentNode.insertBefore(lbl, sel)
  } else {
    btn.textContent = '🔒 Lock'
    btn.classList.remove('locked')
    sel.style.display = ''
    document.getElementById('session-locked-label')?.remove()
  }
}

// ── Clay Tickets ──────────────────────────────────────────────
async function createNewTicket() {
  if (!studioId) { showToast('No studio set'); return }
  const sessionId = document.getElementById('session-select').value || null

  // Get next number from Supabase function
  const { data, error } = await sb.rpc('next_clay_ticket_number')
  if (error) { showToast('Error generating ticket number'); return }

  const ticketNum = data

  const { data: ticket, error: err2 } = await sb.from('clay_tickets').insert({
    ticket_number: ticketNum,
    studio_id: studioId,
    session_id: sessionId,
    stage: 'submitted'
  }).select().single()

  if (err2) { showToast('Error creating ticket'); console.error(err2); return }

  lastTicketId = currentTicketId
  lastTicketNumber = currentTicketNumber
  currentTicketId = ticket.id
  currentTicketNumber = ticketNum

  document.getElementById('ticket-display').textContent = ticketNum
  document.getElementById('ticket-hint').textContent = 'This number will be shown after sign-in — write it on each piece!'
  if (lastTicketId) document.getElementById('same-ticket-btn').style.display = ''
  showToast(`Ticket #${ticketNum} created`)
}

function useSameTicket() {
  currentTicketId = lastTicketId
  currentTicketNumber = lastTicketNumber
  document.getElementById('ticket-display').textContent = lastTicketNumber
  document.getElementById('ticket-hint').textContent = 'Using previous ticket for this group.'
  document.getElementById('same-ticket-btn').style.display = 'none'
  showToast(`Using ticket #${lastTicketNumber}`)
}

// ── People ────────────────────────────────────────────────────
function addPerson() {
  personCount++
  const id = personCount
  const isParty = currentMode === 'party'
  const div = document.createElement('div')
  div.className = `person-row${isParty ? ' party-row' : ''}`
  div.id = `person-${id}`
  div.innerHTML = `
    <div class="person-row-header">
      <span class="person-num">${isParty ? '👧 Child' : '👤 Person'} ${id}</span>
      ${id > 1 ? `<button class="remove-person" onclick="removePerson(${id})">✕</button>` : ''}
    </div>
    ${isParty ? `
      <div class="field-row">
        <div class="field-group">
          <label>Child's Name *</label>
          <input type="text" id="p${id}-name" placeholder="First Last" autocomplete="off" inputmode="text">
        </div>
        <div class="field-group">
          <label>Parent Phone *</label>
          <input type="tel" id="p${id}-phone" placeholder="604-555-1234" inputmode="tel">
        </div>
      </div>
    ` : `
      <div class="field-row">
        <div class="field-group">
          <label>Name *</label>
          <input type="text" id="p${id}-name" placeholder="First Last" autocomplete="off" inputmode="text">
        </div>
        <div class="field-group">
          <label>Email</label>
          <input type="email" id="p${id}-email" placeholder="you@example.com" inputmode="email">
        </div>
      </div>
    `}
  `
  document.getElementById('people-list').appendChild(div)
  document.getElementById(`p${id}-name`).focus()
}

function removePerson(id) {
  document.getElementById(`person-${id}`)?.remove()
}

function rebuildPeople() {
  document.getElementById('people-list').innerHTML = ''
  personCount = 0
  addPerson()
}

// ── Submit ────────────────────────────────────────────────────
async function submitSignIn() {
  const sessionId = document.getElementById('session-select').value
  if (!sessionId) {
    document.getElementById('no-session-warning').style.display = ''
    showToast('Please select a session')
    return
  }
  document.getElementById('no-session-warning').style.display = 'none'

  // Collect people
  const rows = document.querySelectorAll('[id^="person-"]')
  const entries = []
  const names = []
  for (const row of rows) {
    const id = row.id.replace('person-', '')
    const name = document.getElementById(`p${id}-name`)?.value.trim()
    if (!name) continue
    const entry = {
      session_id: sessionId,
      studio_id: studioId,
      mode: currentMode,
      name,
      clay_ticket_id: currentMode === 'workshop' ? (currentTicketId || null) : null
    }
    if (currentMode === 'party') {
      entry.phone = document.getElementById(`p${id}-phone`)?.value.trim() || null
    } else {
      entry.email = document.getElementById(`p${id}-email`)?.value.trim() || null
    }
    entries.push(entry)
    names.push(name)
  }

  if (!entries.length) { showToast('Please enter at least one name'); return }

  const btn = document.getElementById('submit-btn')
  btn.disabled = true
  btn.textContent = 'Saving...'

  const { error } = await sb.from('signin_entries').insert(entries)
  if (error) {
    showToast('Error saving — please try again')
    console.error(error)
    btn.disabled = false
    btn.textContent = currentMode === 'party' ? 'Sign In Child' : 'Sign In'
    return
  }

  // Show success
  const ss = document.getElementById('success-screen')
  document.getElementById('success-names').textContent = names.join(', ')
  const ticketArea = document.getElementById('success-ticket-area')
  if (currentMode === 'workshop' && currentTicketNumber) {
    ticketArea.style.display = ''
    document.getElementById('success-ticket-num').textContent = currentTicketNumber
  } else {
    ticketArea.style.display = 'none'
  }
  document.getElementById('success-sub').textContent = currentMode === 'party'
    ? 'Have a wonderful party! 🎉' : 'Enjoy your session! 🎨'
  ss.classList.add('show')
}

function resetForNext() {
  document.getElementById('success-screen').classList.remove('show')
  // Reset people but keep session + ticket
  document.getElementById('people-list').innerHTML = ''
  personCount = 0
  addPerson()
  const btn = document.getElementById('submit-btn')
  btn.disabled = false
  btn.textContent = currentMode === 'party' ? 'Sign In Child' : 'Sign In'
  // After reset, show "same ticket" option for the next group
  if (currentMode === 'workshop' && currentTicketId) {
    lastTicketId = currentTicketId
    lastTicketNumber = currentTicketNumber
    currentTicketId = null
    currentTicketNumber = null
    document.getElementById('ticket-display').textContent = '—'
    document.getElementById('ticket-hint').textContent = 'Tap "+ New Ticket" or "Same ticket" if this group shares with the previous one.'
    document.getElementById('same-ticket-btn').style.display = ''
  }
}

// ── Toast ─────────────────────────────────────────────────────
function showToast(msg, duration = 2500) {
  const t = document.getElementById('toast')
  t.textContent = msg
  t.classList.add('show')
  setTimeout(() => t.classList.remove('show'), duration)
}
</script>
</body>
</html>
