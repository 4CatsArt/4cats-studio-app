<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="https://cdn.shopify.com/s/files/1/1451/3756/files/favicon_black_512x512_9c6dd2c0-fdcd-4575-887e-bf65538803af.png?v=1631720337">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 Studio Setup Rollout — 4Cats</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f0; color: #1a1a1a; min-height: 100vh; font-size: 13px; }
#login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
.login-card { background: white; border-radius: 12px; border: 0.5px solid #e0e0d8; padding: 2rem; width: 100%; max-width: 380px; }
.login-card h1 { font-size: 20px; font-weight: 600; margin-bottom: 0.25rem; text-align: center; }
.login-card p { font-size: 13px; color: #888; margin-bottom: 1.5rem; text-align: center; }
.login-card input { width: 100%; padding: 10px 12px; border: 0.5px solid #d0d0c8; border-radius: 8px; font-size: 14px; margin-bottom: 10px; outline: none; display: block; }
.login-card input:focus { border-color: #888; }
.login-card button { width: 100%; padding: 10px; background: #1a1a1a; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
.error-msg { color: #c0392b; font-size: 12px; margin-top: 8px; display: none; }
#app-screen { display: none; }
.top-bar { background: #1a1a1a; color: white; padding: 0 1.5rem; display: flex; align-items: center; gap: 1.25rem; height: 48px; position: sticky; top: 0; z-index: 100; }
.top-bar-title { font-size: 14px; font-weight: 600; }
.top-bar-title span { color: #888; font-weight: 400; }
.top-bar a.link-btn { color: #ccc; text-decoration: none; font-size: 12px; }
.top-bar a.link-btn:hover { color: white; }
.top-bar-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.signout-btn, .manage-btn { background: none; border: 0.5px solid #444; color: #ccc; font-size: 12px; cursor: pointer; padding: 5px 12px; border-radius: 6px; }
.signout-btn:hover, .manage-btn:hover { color: white; border-color: #666; }
.manage-btn.active { background: #fff3e0; color: #e65100; border-color: #ffcc80; }
.view { display: none; padding: 1.5rem; max-width: 1000px; margin: 0 auto; }
.view.active { display: block; }
.btn { padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; border: 0.5px solid #d0d0c8; background: white; color: #1a1a1a; height: 32px; white-space: nowrap; }
.btn:hover { background: #f5f5f0; }
.btn-primary { background: #1a1a1a; color: white; border-color: #1a1a1a; }
.btn-primary:hover { background: #333; }
.btn-danger { background: #fff0f0; color: #c0392b; border-color: #f0c0c0; }
.btn-danger:hover { background: #ffe0e0; }
.btn-sm { padding: 3px 9px; font-size: 11px; height: 24px; border-radius: 5px; }
.overview-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 10px; }
.overview-header h1 { font-size: 18px; font-weight: 600; }
.overview-stats { font-size: 12px; color: #888; }
.search-input { border: 0.5px solid #d0d0c8; border-radius: 6px; padding: 6px 10px; font-size: 12px; outline: none; height: 32px; width: 220px; }
.studio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.studio-card { background: white; border: 0.5px solid #e0e0d8; border-radius: 10px; padding: 14px 16px; cursor: pointer; transition: border-color 0.15s; }
.studio-card:hover { border-color: #aaa; }
.studio-card .name { font-weight: 600; font-size: 13px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.studio-card .check { color: #2e7d32; font-size: 15px; }
.progress-bar-track { background: #f0f0e8; border-radius: 6px; height: 8px; overflow: hidden; margin-bottom: 6px; }
.progress-bar-fill { background: #2e7d32; height: 100%; border-radius: 6px; transition: width 0.2s; }
.progress-bar-fill.partial { background: #f9a825; }
.progress-bar-fill.zero { background: #e0e0d8; }
.progress-label { font-size: 11px; color: #888; }
.studio-detail-header { display: flex; align-items: center; gap: 12px; margin-bottom: 1.5rem; flex-wrap: wrap; }
.back-link { color: #888; cursor: pointer; font-size: 13px; }
.back-link:hover { color: #333; }
.studio-detail-header h1 { font-size: 18px; font-weight: 600; }
.section-card { background: white; border: 0.5px solid #e0e0d8; border-radius: 12px; padding: 1.1rem 1.25rem; margin-bottom: 14px; }
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 10px; }
.section-title { font-size: 13px; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase; color: #333; }
.item-row { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 0.5px solid #f5f5f0; }
.item-row:last-child { border-bottom: none; }
.item-row input[type=checkbox] { width: 16px; height: 16px; margin-top: 1px; cursor: pointer; accent-color: #1a1a1a; flex-shrink: 0; }
.item-title { font-size: 13px; font-weight: 500; }
.item-title a { color: #1a4fa0; text-decoration: none; font-size: 11px; margin-left: 6px; }
.item-title a:hover { text-decoration: underline; }
.item-desc { font-size: 11px; color: #888; margin-top: 2px; }
.item-actions { margin-left: auto; display: flex; gap: 4px; flex-shrink: 0; }
.shelf-calc-box { background: #fafaf8; border-radius: 8px; padding: 10px 12px; }
.shelf-inputs { display: flex; gap: 14px; flex-wrap: wrap; margin: 8px 0; }
.shelf-field label { display: block; font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 3px; }
.shelf-field input { width: 90px; padding: 6px 8px; border: 0.5px solid #d0d0c8; border-radius: 6px; font-size: 13px; outline: none; }
.shelf-result { font-size: 12px; margin-top: 4px; }
.shelf-result b { font-size: 14px; }
.photo-area { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 0.5px dashed #e0e0d8; }
.photo-thumb { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; border: 0.5px solid #e0e0d8; }
.photo-placeholder { width: 56px; height: 56px; border-radius: 6px; border: 1px dashed #d0d0c8; display: flex; align-items: center; justify-content: center; color: #bbb; font-size: 10px; text-align: center; }
.photo-status { font-size: 11px; color: #888; }
.empty { text-align: center; padding: 3rem; color: #888; font-size: 13px; }
.loading { text-align: center; padding: 3rem; color: #888; }
.modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.45); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 2rem; }
.modal-box { background: white; border-radius: 12px; width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; padding: 1.5rem; }
.modal-title { font-size: 15px; font-weight: 600; margin-bottom: 1rem; }
.modal-field { margin-bottom: 1rem; }
.modal-field label { display: block; font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 5px; font-weight: 500; }
.modal-field input, .modal-field select, .modal-field textarea { width: 100%; padding: 8px 10px; border: 0.5px solid #d0d0c8; border-radius: 7px; font-size: 13px; outline: none; font-family: inherit; }
.modal-field textarea { resize: vertical; min-height: 60px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1.25rem; padding-top: 1.25rem; border-top: 0.5px solid #f0f0e8; }
.add-section-bar { text-align: center; padding: 6px 0 20px; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h1>2026 Studio Setup Rollout</h1>
    <p>Sign in with your home office admin account</p>
    <input type="email" id="email-input" placeholder="Email address">
    <input type="password" id="password-input" placeholder="Password">
    <button onclick="signIn()">Sign in</button>
    <div class="error-msg" id="error-msg">Incorrect email or password, or insufficient permissions.</div>
  </div>
</div>

<div id="app-screen">
  <div class="top-bar">
    <div class="top-bar-title">4CATS <span>2026 Studio Setup Rollout</span></div>
    <a class="link-btn" href="admin.html">← Back to Admin</a>
    <div class="top-bar-right">
      <button class="manage-btn" id="manage-toggle" onclick="toggleManageMode()">Manage Checklist</button>
      <button class="signout-btn" onclick="signOut()">Sign out</button>
    </div>
  </div>

  <!-- OVERVIEW -->
  <div class="view active" id="view-overview">
    <div class="overview-header">
      <h1>All Studios</h1>
      <div style="display:flex;gap:10px;align-items:center">
        <input class="search-input" id="studio-search" placeholder="Search studios…" oninput="renderOverview()">
        <span class="overview-stats" id="overview-stats"></span>
      </div>
    </div>
    <div id="overview-body"><div class="loading">Loading…</div></div>
    <div id="template-manager" style="display:none">
      <div style="margin:1.5rem 0 0.75rem;font-size:13px;font-weight:600;color:#333;border-top:0.5px solid #e0e0d8;padding-top:1.25rem">Checklist Template <span style="font-weight:400;color:#888;font-size:11px">(applies to all studios)</span></div>
      <div id="template-manager-body"></div>
      <div class="add-section-bar"><button class="btn" onclick="showSectionModal()">+ Add Section</button></div>
    </div>
  </div>

  <!-- STUDIO DETAIL -->
  <div class="view" id="view-studio">
    <div class="studio-detail-header">
      <span class="back-link" onclick="showOverview()">← All Studios</span>
      <h1 id="studio-detail-name"></h1>
    </div>
    <div id="studio-detail-body"><div class="loading">Loading…</div></div>
    <div class="add-section-bar" id="add-section-bar" style="display:none">
      <button class="btn" onclick="showSectionModal()">+ Add Section</button>
    </div>
  </div>
</div>

<div id="modal-root"></div>

<script>
const SUPABASE_URL = 'https://snxibhbhhchjthfmjtaj.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNueGliaGJoaGNoanRoZm1qdGFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwNTk2ODAsImV4cCI6MjA5MjYzNTY4MH0.K-89Mx4SxU6N1hMmtK6Q79rWAtk6VTN9b5wemQxcZVA'
const { createClient } = supabase
const sb = createClient(SUPABASE_URL, SUPABASE_KEY)
const REST = SUPABASE_URL + '/rest/v1/'
const HEADERS = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' }

let currentUser = null
let allStudios = []          // [{id, name}]
let sections = []            // [{id, title, sort_order}]
let items = []                // [{id, section_id, title, description, link_url, item_type, sort_order}]
let statusRows = []           // setup2026_studio_items rows for the currently open studio
let photoRows = []            // setup2026_section_photos rows for the currently open studio
let allStatusRows = []        // ALL studio_items rows (for overview progress calc)
let allPhotoRows = []         // ALL section_photos rows (for overview progress calc)
let manageMode = false
let currentStudioId = null

// ---------- SHELVING CALCULATOR CONFIG ----------
// Fixed carts: always exactly 1 per studio. Bisque/pickup carts are variable and
// entered per studio. Every shelf needs 1 set of wheels, so wheels target == shelves target.
const FIXED_CARTS = [
  { name: 'Kiln', shelves: 7 },
  { name: 'Glazing', shelves: 6 },
  { name: 'Circler', shelves: 5 },
  { name: 'Demoer', shelves: 7 },
  { name: 'Slabs', shelves: 6 },
  { name: 'Speedy Ditto System', shelves: 12 },
  { name: 'Ditto Computer', shelves: 6 },
  { name: 'Wheel', shelves: 4 },
  { name: 'Stock', shelves: 9 },
]
const FIXED_CARTS_TOTAL_SHELVES = FIXED_CARTS.reduce((sum, c) => sum + c.shelves, 0)
const SHELVES_PER_BISQUE_PICKUP_CART = 7

function calcShelvingTargets(bisqueCarts, pickupCarts) {
  const targetShelves = FIXED_CARTS_TOTAL_SHELVES + (bisqueCarts + pickupCarts) * SHELVES_PER_BISQUE_PICKUP_CART
  return { targetShelves, targetWheels: targetShelves }
}

// ---------- AUTH ----------
sb.auth.getSession().then(({ data: { session } }) => { if (session) { currentUser = session.user; initApp() } })

async function signIn() {
  const email = document.getElementById('email-input').value
  const password = document.getElementById('password-input').value
  const errEl = document.getElementById('error-msg')
  errEl.style.display = 'none'
  const { data, error } = await sb.auth.signInWithPassword({ email, password })
  if (error) { errEl.style.display = 'block'; return }
  currentUser = data.user
  await initApp()
}

async function signOut() {
  await sb.auth.signOut()
  document.getElementById('login-screen').style.display = 'flex'
  document.getElementById('app-screen').style.display = 'none'
}

async function initApp() {
  const { data: mapping } = await sb.from('studio_users').select('role, studio_id').eq('user_id', currentUser.id).single()
  if (!mapping || mapping.role !== 'admin') {
    document.getElementById('error-msg').textContent = 'This account does not have home office access.'
    document.getElementById('error-msg').style.display = 'block'
    await sb.auth.signOut(); return
  }
  document.getElementById('login-screen').style.display = 'none'
  document.getElementById('app-screen').style.display = 'block'
  await loadAllData()
}

// ---------- DATA LOADING ----------
async function loadAllData() {
  const [studiosRes, sectionsRes, itemsRes, statusRes, photosRes] = await Promise.all([
    fetch(REST + 'studios?select=id,name&order=name.asc', { headers: HEADERS }),
    fetch(REST + 'setup2026_sections?select=*&order=sort_order.asc', { headers: HEADERS }),
    fetch(REST + 'setup2026_items?select=*&order=sort_order.asc', { headers: HEADERS }),
    fetch(REST + 'setup2026_studio_items?select=*&limit=5000', { headers: HEADERS }),
    fetch(REST + 'setup2026_section_photos?select=*&limit=5000', { headers: HEADERS }),
  ])
  allStudios = await studiosRes.json()
  sections = await sectionsRes.json()
  items = await itemsRes.json()
  allStatusRows = await statusRes.json()
  allPhotoRows = await photosRes.json()
  renderOverview()
}

function totalUnitsCount() {
  // one unit per item, plus one unit per section (the section photo)
  return items.length + sections.length
}

function studioProgress(studioId) {
  const checked = allStatusRows.filter(r => r.studio_id === studioId && r.checked).length
  const photos = allPhotoRows.filter(r => r.studio_id === studioId).length
  const total = totalUnitsCount()
  const done = checked + photos
  return { done, total }
}

// ---------- OVERVIEW ----------
function showOverview() {
  document.getElementById('view-overview').classList.add('active')
  document.getElementById('view-studio').classList.remove('active')
  loadAllData()
}

function renderOverview() {
  const body = document.getElementById('overview-body')
  const search = (document.getElementById('studio-search').value || '').toLowerCase()
  const list = allStudios.filter(s => s.name.toLowerCase().includes(search))

  if (!allStudios.length) {
    body.innerHTML = '<div class="empty">No studios found.</div>'
    return
  }
  if (totalUnitsCount() === 0) {
    body.innerHTML = '<div class="empty">No checklist sections yet. Click "Manage Checklist" above to add your first section.</div>'
  } else {
    body.innerHTML = '<div class="studio-grid">' + list.map(s => {
      const { done, total } = studioProgress(s.id)
      const pct = total ? Math.round((done / total) * 100) : 0
      const fillClass = pct === 100 ? '' : (pct === 0 ? 'zero' : 'partial')
      return `<div class="studio-card" onclick="openStudio('${s.id}')">
        <div class="name">${s.name} ${pct === 100 ? '<span class="check">✓</span>' : ''}</div>
        <div class="progress-bar-track"><div class="progress-bar-fill ${fillClass}" style="width:${pct}%"></div></div>
        <div class="progress-label">${done} / ${total} complete</div>
      </div>`
    }).join('') + '</div>'
  }

  const doneStudios = allStudios.filter(s => { const p = studioProgress(s.id); return p.total > 0 && p.done === p.total }).length
  document.getElementById('overview-stats').textContent = allStudios.length
    ? `${doneStudios} / ${allStudios.length} studios complete`
    : ''

  document.getElementById('manage-toggle').classList.toggle('active', manageMode)
  document.getElementById('template-manager').style.display = manageMode ? '' : 'none'
  if (manageMode) renderTemplateManager()
}

function renderTemplateManager() {
  const el = document.getElementById('template-manager-body')
  if (!sections.length) {
    el.innerHTML = '<div class="empty">No sections yet. Click "+ Add Section" below to create your first one.</div>'
    return
  }
  el.innerHTML = sections.map((section, idx) => {
    const sectionItems = items.filter(i => i.section_id === section.id)
    const itemsHtml = sectionItems.length ? sectionItems.map(i => `
      <div class="item-row">
        <div style="flex:1">
          <span class="item-title">${i.title}</span>
          <span style="font-size:10px;color:#aaa;margin-left:6px">${i.item_type === 'shelving_calc' ? '(shelving calculator)' : '(checklist item)'}</span>
        </div>
        <div class="item-actions">
          <button class="btn btn-sm" onclick="showItemModal('${section.id}', '${i.id}')">Edit</button>
          <button class="btn btn-sm btn-danger" onclick="deleteItem('${i.id}')">Delete</button>
        </div>
      </div>`).join('') : '<div style="color:#bbb;font-size:12px;padding:6px 0">No items in this section yet.</div>'
    return `<div class="section-card">
      <div class="section-header">
        <div class="section-title">${section.title}</div>
        <div class="item-actions">
          <button class="btn btn-sm" onclick="moveSection('${section.id}', -1)" ${idx === 0 ? 'disabled style="opacity:0.3"' : ''} title="Move up">▲</button>
          <button class="btn btn-sm" onclick="moveSection('${section.id}', 1)" ${idx === sections.length - 1 ? 'disabled style="opacity:0.3"' : ''} title="Move down">▼</button>
          <button class="btn btn-sm" onclick="showItemModal('${section.id}')">+ Item</button>
          <button class="btn btn-sm" onclick="showSectionModal('${section.id}')">Edit</button>
          <button class="btn btn-sm btn-danger" onclick="deleteSection('${section.id}')">Delete</button>
        </div>
      </div>
      ${itemsHtml}
    </div>`
  }).join('')
}

// ---------- STUDIO DETAIL ----------
async function openStudio(studioId) {
  currentStudioId = studioId
  document.getElementById('view-overview').classList.remove('active')
  document.getElementById('view-studio').classList.add('active')
  const studio = allStudios.find(s => s.id === studioId)
  document.getElementById('studio-detail-name').textContent = studio ? studio.name : studioId
  document.getElementById('studio-detail-body').innerHTML = '<div class="loading">Loading…</div>'
  document.getElementById('add-section-bar').style.display = manageMode ? '' : 'none'

  const [statusRes, photosRes] = await Promise.all([
    fetch(REST + 'setup2026_studio_items?select=*&studio_id=eq.' + studioId, { headers: HEADERS }),
    fetch(REST + 'setup2026_section_photos?select=*&studio_id=eq.' + studioId, { headers: HEADERS }),
  ])
  statusRows = await statusRes.json()
  photoRows = await photosRes.json()
  renderStudioDetail()
}

function getStatus(itemId) { return statusRows.find(r => r.item_id === itemId) }
function getPhoto(sectionId) { return photoRows.find(r => r.section_id === sectionId) }

function renderStudioDetail() {
  const body = document.getElementById('studio-detail-body')
  if (!sections.length) {
    body.innerHTML = '<div class="empty">No checklist sections yet. Click "Manage Checklist" above to add your first section.</div>'
    return
  }
  body.innerHTML = sections.map((s, idx) => renderSection(s, idx)).join('')
}

function renderSection(section, idx) {
  const sectionItems = items.filter(i => i.section_id === section.id)
  const photo = getPhoto(section.id)

  const mgmtSectionBtns = manageMode
    ? `<div class="item-actions">
         <button class="btn btn-sm" onclick="moveSection('${section.id}', -1)" ${idx === 0 ? 'disabled style="opacity:0.3"' : ''} title="Move up">▲</button>
         <button class="btn btn-sm" onclick="moveSection('${section.id}', 1)" ${idx === sections.length - 1 ? 'disabled style="opacity:0.3"' : ''} title="Move down">▼</button>
         <button class="btn btn-sm" onclick="showItemModal('${section.id}')">+ Item</button>
         <button class="btn btn-sm" onclick="showSectionModal('${section.id}')">Edit</button>
         <button class="btn btn-sm btn-danger" onclick="deleteSection('${section.id}')">Delete</button>
       </div>` : ''

  const itemsHtml = sectionItems.length
    ? sectionItems.map(i => renderItem(i)).join('')
    : '<div style="color:#bbb;font-size:12px;padding:6px 0">No items in this section yet.</div>'

  const photoThumb = photo
    ? `<img class="photo-thumb" src="${photo.photo_url}" alt="Section photo">`
    : `<div class="photo-placeholder">No photo</div>`

  return `<div class="section-card">
    <div class="section-header">
      <div class="section-title">${section.title}</div>
      ${mgmtSectionBtns}
    </div>
    ${itemsHtml}
    <div class="photo-area">
      ${photoThumb}
      <div style="flex:1">
        <input type="file" accept="image/*" id="photo-input-${section.id}" style="display:none" onchange="uploadSectionPhoto('${section.id}', this)">
        <button class="btn btn-sm" onclick="document.getElementById('photo-input-${section.id}').click()">${photo ? 'Replace photo' : 'Upload photo'}</button>
        <span class="photo-status" id="photo-status-${section.id}"></span>
      </div>
    </div>
  </div>`
}

function renderItem(item) {
  const mgmtItemBtns = manageMode
    ? `<div class="item-actions">
         <button class="btn btn-sm" onclick="showItemModal('${item.section_id}', '${item.id}')">Edit</button>
         <button class="btn btn-sm btn-danger" onclick="deleteItem('${item.id}')">Delete</button>
       </div>` : ''

  if (item.item_type === 'shelving_calc') {
    const status = getStatus(item.id)
    const v = (status && status.value) || {}
    const bisqueCarts = v.bisque_carts ?? ''
    const pickupCarts = v.pickup_carts ?? ''
    const currentShelves = v.current_shelves ?? ''
    const currentWheels = v.current_wheels ?? ''
    const hasAll = v.bisque_carts !== undefined && v.pickup_carts !== undefined && v.current_shelves !== undefined && v.current_wheels !== undefined
    const { targetShelves, targetWheels } = calcShelvingTargets(Number(v.bisque_carts) || 0, Number(v.pickup_carts) || 0)
    const bringShelves = Math.max(0, targetShelves - (Number(v.current_shelves) || 0))
    const bringWheels = Math.max(0, targetWheels - (Number(v.current_wheels) || 0))
    return `<div class="item-row" style="display:block">
      <div style="display:flex;align-items:center;gap:8px">
        <div class="item-title" style="flex:1">${item.title}${item.link_url ? `<a href="${item.link_url}" target="_blank">How-to →</a>` : ''}</div>
        ${mgmtItemBtns}
      </div>
      ${item.description ? `<div class="item-desc">${item.description}</div>` : ''}
      <div class="shelf-calc-box">
        <div style="font-size:11px;color:#aaa;margin-bottom:10px">Includes ${FIXED_CARTS_TOTAL_SHELVES} shelves for fixed carts (${FIXED_CARTS.map(c => c.name).join(', ')}) + ${SHELVES_PER_BISQUE_PICKUP_CART} shelves per Bisque/Pickup cart. 1 set of wheels needed per shelf.</div>

        <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px;color:#666;margin-bottom:6px">What the studio has now</div>
        <div class="shelf-inputs" style="margin-top:0">
          <div class="shelf-field"><label>Current Shelves</label>
            <input type="number" min="0" id="cshelves-${item.id}" value="${currentShelves}" onblur="saveShelvingCalc('${item.id}')">
          </div>
          <div class="shelf-field"><label>Current Wheel Sets</label>
            <input type="number" min="0" id="cwheels-${item.id}" value="${currentWheels}" onblur="saveShelvingCalc('${item.id}')">
          </div>
        </div>

        <div style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px;color:#666;margin:12px 0 6px">Carts this studio will have (home office decides)</div>
        <div class="shelf-inputs" style="margin-top:0">
          <div class="shelf-field"><label>Bisque Carts</label>
            <input type="number" min="0" id="bisque-${item.id}" value="${bisqueCarts}" onblur="saveShelvingCalc('${item.id}')">
          </div>
          <div class="shelf-field"><label>Pickup Carts</label>
            <input type="number" min="0" id="pickup-${item.id}" value="${pickupCarts}" onblur="saveShelvingCalc('${item.id}')">
          </div>
        </div>

        <div class="shelf-result" id="shelf-result-${item.id}" style="margin-top:10px">
          ${hasAll
            ? `Target: <b>${targetShelves}</b> shelves / <b>${targetWheels}</b> wheel sets &nbsp;·&nbsp; Bring: <b>${bringShelves}</b> shelves, <b>${bringWheels}</b> wheel sets`
            : 'Enter cart counts and current totals to calculate.'}
        </div>
      </div>
    </div>`
  }

  const status = getStatus(item.id)
  const checked = status && status.checked
  return `<div class="item-row">
    <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleChecklistItem('${item.id}', this.checked)">
    <div style="flex:1">
      <div class="item-title">${item.title}${item.link_url ? `<a href="${item.link_url}" target="_blank">How-to →</a>` : ''}</div>
      ${item.description ? `<div class="item-desc">${item.description}</div>` : ''}
    </div>
    ${mgmtItemBtns}
  </div>`
}

// ---------- CHECKLIST ITEM SAVE ----------
async function upsertStudioItem(studioId, itemId, fields) {
  const body = Object.assign({ studio_id: studioId, item_id: itemId, updated_at: new Date().toISOString() }, fields)
  await fetch(REST + 'setup2026_studio_items', {
    method: 'POST',
    headers: Object.assign({}, HEADERS, { 'Prefer': 'resolution=merge-duplicates,return=representation' }),
    body: JSON.stringify(body)
  })
}

async function toggleChecklistItem(itemId, checked) {
  await upsertStudioItem(currentStudioId, itemId, { checked })
  // reflect locally without a full reload
  const existing = statusRows.find(r => r.item_id === itemId)
  if (existing) existing.checked = checked
  else statusRows.push({ studio_id: currentStudioId, item_id: itemId, checked, value: null })
  const allExisting = allStatusRows.find(r => r.studio_id === currentStudioId && r.item_id === itemId)
  if (allExisting) allExisting.checked = checked
  else allStatusRows.push({ studio_id: currentStudioId, item_id: itemId, checked, value: null })
}

async function saveShelvingCalc(itemId) {
  const bisque = document.getElementById('bisque-' + itemId).value
  const pickup = document.getElementById('pickup-' + itemId).value
  const cshelves = document.getElementById('cshelves-' + itemId).value
  const cwheels = document.getElementById('cwheels-' + itemId).value
  const value = {
    bisque_carts: bisque === '' ? undefined : Number(bisque),
    pickup_carts: pickup === '' ? undefined : Number(pickup),
    current_shelves: cshelves === '' ? undefined : Number(cshelves),
    current_wheels: cwheels === '' ? undefined : Number(cwheels),
  }
  const hasAll = value.bisque_carts !== undefined && value.pickup_carts !== undefined && value.current_shelves !== undefined && value.current_wheels !== undefined
  await upsertStudioItem(currentStudioId, itemId, { value, checked: hasAll })

  const existing = statusRows.find(r => r.item_id === itemId)
  if (existing) { existing.value = value; existing.checked = hasAll }
  else statusRows.push({ studio_id: currentStudioId, item_id: itemId, value, checked: hasAll })
  const allExisting = allStatusRows.find(r => r.studio_id === currentStudioId && r.item_id === itemId)
  if (allExisting) { allExisting.value = value; allExisting.checked = hasAll }
  else allStatusRows.push({ studio_id: currentStudioId, item_id: itemId, value, checked: hasAll })

  const { targetShelves, targetWheels } = calcShelvingTargets(value.bisque_carts || 0, value.pickup_carts || 0)
  const bringShelves = Math.max(0, targetShelves - (value.current_shelves || 0))
  const bringWheels = Math.max(0, targetWheels - (value.current_wheels || 0))
  document.getElementById('shelf-result-' + itemId).innerHTML = hasAll
    ? `Target: <b>${targetShelves}</b> shelves / <b>${targetWheels}</b> wheel sets &nbsp;·&nbsp; Bring: <b>${bringShelves}</b> shelves, <b>${bringWheels}</b> wheel sets`
    : 'Enter cart counts and current totals to calculate.'
}

// ---------- PHOTO UPLOAD ----------
async function uploadSectionPhoto(sectionId, inputEl) {
  const file = inputEl.files[0]
  if (!file) return
  const statusEl = document.getElementById('photo-status-' + sectionId)
  statusEl.textContent = 'Uploading…'
  try {
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase()
    const path = `${currentStudioId}/${sectionId}-${Date.now()}.${ext}`
    const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/setup2026-photos/${path}`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': file.type },
      body: file
    })
    if (!uploadRes.ok) throw new Error('Upload failed (' + uploadRes.status + '). Check the setup2026-photos storage bucket exists and is public.')
    const photoUrl = `${SUPABASE_URL}/storage/v1/object/public/setup2026-photos/${path}`
    await fetch(REST + 'setup2026_section_photos', {
      method: 'POST',
      headers: Object.assign({}, HEADERS, { 'Prefer': 'resolution=merge-duplicates,return=representation' }),
      body: JSON.stringify({ studio_id: currentStudioId, section_id: sectionId, photo_url: photoUrl, uploaded_at: new Date().toISOString() })
    })
    const existing = photoRows.find(r => r.section_id === sectionId)
    if (existing) existing.photo_url = photoUrl
    else photoRows.push({ studio_id: currentStudioId, section_id: sectionId, photo_url: photoUrl })
    const allExisting = allPhotoRows.find(r => r.studio_id === currentStudioId && r.section_id === sectionId)
    if (allExisting) allExisting.photo_url = photoUrl
    else allPhotoRows.push({ studio_id: currentStudioId, section_id: sectionId, photo_url: photoUrl })
    statusEl.textContent = ''
    renderStudioDetail()
  } catch (e) {
    statusEl.textContent = e.message
  }
}

// ---------- MANAGE MODE ----------
function toggleManageMode() {
  manageMode = !manageMode
  document.getElementById('manage-toggle').classList.toggle('active', manageMode)
  document.getElementById('add-section-bar').style.display = manageMode ? '' : 'none'
  document.getElementById('template-manager').style.display = manageMode ? '' : 'none'
  if (manageMode) renderTemplateManager()
  if (document.getElementById('view-studio').classList.contains('active')) renderStudioDetail()
}

function closeModal() { document.getElementById('modal-root').innerHTML = '' }

function showSectionModal(sectionId) {
  const editing = sections.find(s => s.id === sectionId)
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal-box">
        <div class="modal-title">${editing ? 'Edit Section' : 'Add Section'}</div>
        <div class="modal-field">
          <label>Section Title</label>
          <input type="text" id="sec-title" value="${editing ? editing.title.replace(/"/g,'&quot;') : ''}" placeholder="e.g. SPEEDY DITTO SYSTEM">
        </div>
        <div class="modal-actions">
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="saveSection('${sectionId || ''}')">Save</button>
        </div>
      </div>
    </div>`
}

async function saveSection(sectionId) {
  const title = document.getElementById('sec-title').value.trim()
  if (!title) return
  if (sectionId) {
    await fetch(REST + 'setup2026_sections?id=eq.' + sectionId, {
      method: 'PATCH', headers: HEADERS, body: JSON.stringify({ title })
    })
  } else {
    const sortOrder = sections.length ? Math.max(...sections.map(s => s.sort_order || 0)) + 1 : 0
    await fetch(REST + 'setup2026_sections', {
      method: 'POST', headers: Object.assign({}, HEADERS, { 'Prefer': 'return=representation' }),
      body: JSON.stringify({ title, sort_order: sortOrder })
    })
  }
  closeModal()
  await reloadSectionsAndItems()
}

async function deleteSection(sectionId) {
  if (!confirm('Delete this section and all its items? This cannot be undone.')) return
  await fetch(REST + 'setup2026_sections?id=eq.' + sectionId, { method: 'DELETE', headers: HEADERS })
  await reloadSectionsAndItems()
}

async function moveSection(sectionId, direction) {
  const idx = sections.findIndex(s => s.id === sectionId)
  const swapIdx = idx + direction
  if (idx === -1 || swapIdx < 0 || swapIdx >= sections.length) return
  const a = sections[idx], b = sections[swapIdx]
  await Promise.all([
    fetch(REST + 'setup2026_sections?id=eq.' + a.id, { method: 'PATCH', headers: HEADERS, body: JSON.stringify({ sort_order: b.sort_order }) }),
    fetch(REST + 'setup2026_sections?id=eq.' + b.id, { method: 'PATCH', headers: HEADERS, body: JSON.stringify({ sort_order: a.sort_order }) }),
  ])
  await reloadSectionsAndItems()
}

function showItemModal(sectionId, itemId) {
  const editing = itemId ? items.find(i => i.id === itemId) : null
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal-box">
        <div class="modal-title">${editing ? 'Edit Item' : 'Add Item'}</div>
        <div class="modal-field">
          <label>Item Title</label>
          <input type="text" id="item-title" value="${editing ? editing.title.replace(/"/g,'&quot;') : ''}" placeholder="e.g. Cart put together">
        </div>
        <div class="modal-field">
          <label>Item Type</label>
          <select id="item-type" onchange="document.getElementById('shelf-note').style.display = this.value==='shelving_calc' ? '' : 'none'">
            <option value="checkbox" ${editing && editing.item_type==='checkbox' ? 'selected' : ''}>Checklist item</option>
            <option value="shelving_calc" ${editing && editing.item_type==='shelving_calc' ? 'selected' : ''}>Shelving calculator (carts → shelves & wheels)</option>
          </select>
          <div id="shelf-note" style="font-size:11px;color:#aaa;margin-top:4px;display:${editing && editing.item_type==='shelving_calc' ? '' : 'none'}">Shelves needed = ${FIXED_CARTS_TOTAL_SHELVES} (fixed carts) + (bisque carts + pickup carts) × ${SHELVES_PER_BISQUE_PICKUP_CART}. Wheel sets needed = same as shelves.</div>
        </div>
        <div class="modal-field">
          <label>Description (optional)</label>
          <textarea id="item-desc" placeholder="e.g. Not a tripping hazard">${editing && editing.description ? editing.description : ''}</textarea>
        </div>
        <div class="modal-field">
          <label>Link URL (optional — "how to" instructions)</label>
          <input type="text" id="item-link" value="${editing && editing.link_url ? editing.link_url : ''}" placeholder="https://...">
        </div>
        <div class="modal-actions">
          <button class="btn" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="saveItem('${sectionId}', '${itemId || ''}')">Save</button>
        </div>
      </div>
    </div>`
}

async function saveItem(sectionId, itemId) {
  const title = document.getElementById('item-title').value.trim()
  if (!title) return
  const item_type = document.getElementById('item-type').value
  const description = document.getElementById('item-desc').value.trim() || null
  const link_url = document.getElementById('item-link').value.trim() || null
  if (itemId) {
    await fetch(REST + 'setup2026_items?id=eq.' + itemId, {
      method: 'PATCH', headers: HEADERS, body: JSON.stringify({ title, item_type, description, link_url })
    })
  } else {
    const sectionItems = items.filter(i => i.section_id === sectionId)
    const sortOrder = sectionItems.length ? Math.max(...sectionItems.map(i => i.sort_order || 0)) + 1 : 0
    await fetch(REST + 'setup2026_items', {
      method: 'POST', headers: Object.assign({}, HEADERS, { 'Prefer': 'return=representation' }),
      body: JSON.stringify({ section_id: sectionId, title, item_type, description, link_url, sort_order: sortOrder })
    })
  }
  closeModal()
  await reloadSectionsAndItems()
}

async function deleteItem(itemId) {
  if (!confirm('Delete this item?')) return
  await fetch(REST + 'setup2026_items?id=eq.' + itemId, { method: 'DELETE', headers: HEADERS })
  await reloadSectionsAndItems()
}

async function reloadSectionsAndItems() {
  const [sectionsRes, itemsRes] = await Promise.all([
    fetch(REST + 'setup2026_sections?select=*&order=sort_order.asc', { headers: HEADERS }),
    fetch(REST + 'setup2026_items?select=*&order=sort_order.asc', { headers: HEADERS }),
  ])
  sections = await sectionsRes.json()
  items = await itemsRes.json()
  if (currentStudioId && document.getElementById('view-studio').classList.contains('active')) {
    renderStudioDetail()
  } else {
    renderOverview()
    if (manageMode) renderTemplateManager()
  }
}
</script>
