<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workshop Booking</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  #ww-root {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
    font-size: 15px !important;
    color: #1a1a1a !important;
    background: transparent !important;
    line-height: 1.5 !important;
    max-width: 680px !important;
    margin: 0 auto !important;
    padding: 8px 0 32px !important;
  }

  #ww-root * { box-sizing: border-box !important; }

  .ww-section-label {
    font-size: 11px !important;
    font-weight: 700 !important;
    letter-spacing: 0.08em !important;
    text-transform: uppercase !important;
    color: #888 !important;
    margin-bottom: 10px !important;
  }

  /* ── Lineup strip ── */
  .ww-lineup {
    display: flex !important;
    gap: 12px !important;
    margin-bottom: 28px !important;
    flex-wrap: wrap !important;
  }

  .ww-lineup-card {
    flex: 1 1 140px !important;
    border-radius: 10px !important;
    overflow: hidden !important;
    border: 1.5px solid #e8e8e8 !important;
    background: #fff !important;
    cursor: pointer !important;
    transition: border-color 0.15s, box-shadow 0.15s !important;
    position: relative !important;
  }

  .ww-lineup-card:hover {
    border-color: #c3090c !important;
    box-shadow: 0 2px 8px rgba(195,9,12,0.10) !important;
  }

  .ww-lineup-card.selected {
    border-color: #c3090c !important;
    box-shadow: 0 2px 12px rgba(195,9,12,0.18) !important;
  }

  .ww-lineup-card.undecided {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    min-height: 120px !important;
    background: #fafafa !important;
    flex-direction: column !important;
    gap: 8px !important;
    color: #555 !important;
    font-size: 14px !important;
  }

  .ww-lineup-card img {
    width: 100% !important;
    height: 130px !important;
    object-fit: cover !important;
    display: block !important;
  }

  .ww-lineup-name {
    padding: 8px 10px !important;
    font-size: 13px !important;
    font-weight: 600 !important;
    color: #1a1a1a !important;
    text-align: center !important;
  }

  .ww-lineup-check {
    position: absolute !important;
    top: 7px !important;
    right: 7px !important;
    width: 22px !important;
    height: 22px !important;
    background: #c3090c !important;
    border-radius: 50% !important;
    display: none !important;
    align-items: center !important;
    justify-content: center !important;
    color: #fff !important;
    font-size: 13px !important;
  }

  .ww-lineup-card.selected .ww-lineup-check {
    display: flex !important;
  }

  /* ── Selects ── */
  .ww-selects {
    display: flex !important;
    gap: 10px !important;
    margin-bottom: 20px !important;
    flex-wrap: wrap !important;
  }

  .ww-select-wrap {
    flex: 1 1 140px !important;
    display: flex !important;
    flex-direction: column !important;
    gap: 5px !important;
  }

  .ww-select-wrap label {
    font-size: 11px !important;
    font-weight: 700 !important;
    letter-spacing: 0.07em !important;
    text-transform: uppercase !important;
    color: #888 !important;
  }

  .ww-select-wrap select {
    width: 100% !important;
    padding: 9px 12px !important;
    border: 1.5px solid #ddd !important;
    border-radius: 7px !important;
    font-size: 14px !important;
    color: #1a1a1a !important;
    background: #fff !important;
    appearance: auto !important;
    cursor: pointer !important;
    outline: none !important;
    transition: border-color 0.15s !important;
  }

  .ww-select-wrap select:focus { border-color: #c3090c !important; }

  /* ── Date tabs ── */
  .ww-dates {
    display: flex !important;
    gap: 6px !important;
    margin-bottom: 20px !important;
    flex-wrap: wrap !important;
  }

  .ww-date-tab {
    padding: 7px 14px !important;
    border-radius: 20px !important;
    border: 1.5px solid #ddd !important;
    background: #fff !important;
    font-size: 13px !important;
    font-weight: 500 !important;
    color: #444 !important;
    cursor: pointer !important;
    transition: all 0.15s !important;
    white-space: nowrap !important;
  }

  .ww-date-tab:hover { border-color: #c3090c !important; color: #c3090c !important; }

  .ww-date-tab.active {
    background: #c3090c !important;
    border-color: #c3090c !important;
    color: #fff !important;
    font-weight: 600 !important;
  }

  /* ── Slots ── */
  .ww-slots {
    display: flex !important;
    flex-direction: column !important;
    gap: 8px !important;
    margin-bottom: 24px !important;
  }

  .ww-slot {
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
    padding: 12px 16px !important;
    border: 1.5px solid #e8e8e8 !important;
    border-radius: 9px !important;
    background: #fff !important;
    gap: 12px !important;
  }

  .ww-slot-time {
    font-size: 15px !important;
    font-weight: 600 !important;
    color: #1a1a1a !important;
    min-width: 70px !important;
  }

  .ww-slot-spaces {
    font-size: 13px !important;
    color: #888 !important;
    flex: 1 !important;
  }

  .ww-slot-spaces.low { color: #c3090c !important; font-weight: 600 !important; }

  .ww-qty-wrap {
    display: flex !important;
    align-items: center !important;
    gap: 6px !important;
  }

  .ww-qty-btn {
    width: 28px !important;
    height: 28px !important;
    border-radius: 50% !important;
    border: 1.5px solid #ddd !important;
    background: #fff !important;
    font-size: 16px !important;
    line-height: 1 !important;
    cursor: pointer !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    color: #444 !important;
    transition: border-color 0.15s !important;
    -webkit-appearance: none !important;
  }

  .ww-qty-btn:hover { border-color: #c3090c !important; color: #c3090c !important; }

  .ww-qty-val {
    font-size: 15px !important;
    font-weight: 600 !important;
    min-width: 18px !important;
    text-align: center !important;
    color: #1a1a1a !important;
  }

  .ww-register-btn {
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    padding: 8px 18px !important;
    background: #1a1a1a !important;
    color: #fff !important;
    border-radius: 6px !important;
    font-size: 13px !important;
    font-weight: 600 !important;
    text-decoration: none !important;
    white-space: nowrap !important;
    transition: background 0.15s !important;
    border: none !important;
    cursor: pointer !important;
  }

  .ww-register-btn:hover { background: #c3090c !important; color: #fff !important; }

  .ww-sold-out {
    display: inline-flex !important;
    align-items: center !important;
    padding: 7px 16px !important;
    background: #f2f2f2 !important;
    color: #aaa !important;
    border-radius: 6px !important;
    font-size: 13px !important;
    font-weight: 600 !important;
    white-space: nowrap !important;
  }

  .ww-project-note {
    font-size: 13px !important;
    color: #555 !important;
    background: #fff8f8 !important;
    border: 1px solid #fde8e8 !important;
    border-radius: 8px !important;
    padding: 10px 14px !important;
    margin-bottom: 20px !important;
  }

  .ww-project-note strong { color: #c3090c !important; }

  .ww-loading {
    text-align: center !important;
    padding: 32px 0 !important;
    color: #aaa !important;
    font-size: 14px !important;
  }

  .ww-empty {
    text-align: center !important;
    padding: 24px 0 !important;
    color: #aaa !important;
    font-size: 14px !important;
  }

  .ww-error {
    color: #c3090c !important;
    font-size: 13px !important;
    padding: 12px 0 !important;
  }

  .ww-divider {
    border: none !important;
    border-top: 1px solid #ebebeb !important;
    margin: 24px 0 !important;
  }
</style>
</head>
<body>
<div id="ww-root">
  <div class="ww-loading">Loading workshop...</div>
</div>

<script>
(function () {
  'use strict'

  var SUPABASE_URL = 'https://snxibhbhhchjthfmjtaj.supabase.co'
  var EDGE_FN = SUPABASE_URL + '/functions/v1/public-workshop'
  var SHOPIFY_STORE = 'https://4cats-arts-studio-main-street.myshopify.com'

  var STUDIOS = {
    'BC-RICH-GC':  { name: 'Richmond \u2013 Garden City',    province: 'BC' },
    'BC-RICH-STV': { name: 'Richmond \u2013 Steveston',       province: 'BC' },
    'BC-SUR-SSR':  { name: 'Surrey \u2013 South',             province: 'BC' },
    'BC-YVR-KIT':  { name: 'Vancouver \u2013 Kitsilano',      province: 'BC' },
    'BC-YVR-MS':   { name: 'Vancouver \u2013 Main Street',    province: 'BC' },
    'BC-YVR-UBC':  { name: 'Vancouver \u2013 UBC',            province: 'BC' },
    'BC-YYJ-CSV':  { name: 'Victoria \u2013 Cook Street',     province: 'BC' },
    'BC-YYJ-ESQ':  { name: 'Victoria \u2013 Esquimalt',       province: 'BC' },
    'BC-YYJ-OB':   { name: 'Victoria \u2013 Oak Bay',         province: 'BC' },
    'BC-YYJ-VIC':  { name: 'Victoria \u2013 Uptown',          province: 'BC' },
    'AB-YYC-ING':  { name: 'Calgary \u2013 Inglewood',        province: 'AB' },
    'AB-STA-STA':  { name: 'St Albert',                       province: 'AB' },
    'ON-BRL-BRL':  { name: 'Burlington \u2013 South',         province: 'ON' },
    'ON-CMB-GLT':  { name: 'Cambridge \u2013 Galt',           province: 'ON' },
    'ON-ERN-ERN':  { name: 'Erin',                            province: 'ON' },
    'ON-HAM-OS':   { name: 'Hamilton \u2013 Ottawa Street',   province: 'ON' },
    'ON-HAM-WD':   { name: 'Hamilton \u2013 Waterdown',       province: 'ON' },
    'ON-HAM-WH':   { name: 'Hamilton \u2013 West Harbour',    province: 'ON' },
    'ON-KGN-AP':   { name: 'Kingston \u2013 Arlington Park',  province: 'ON' },
    'ON-LDN-BYR':  { name: 'London \u2013 Byron',             province: 'ON' },
    'ON-LDN-WVG':  { name: 'London \u2013 Wortley Village',   province: 'ON' },
    'ON-MIS-PC':   { name: 'Mississauga \u2013 Port Credit',  province: 'ON' },
    'ON-OAK-OAK':  { name: 'Oakville \u2013 North',           province: 'ON' },
    'ON-OAK-WST':  { name: 'Oakville \u2013 West',            province: 'ON' },
    'ON-YOW-GLB':  { name: 'Ottawa \u2013 The Glebe',         province: 'ON' },
    'ON-STC-STC':  { name: 'St Catharines',                   province: 'ON' },
    'ON-YYZ-AVE':  { name: 'Toronto \u2013 Avenue Road',      province: 'ON' },
    'ON-YYZ-BP':   { name: 'Toronto \u2013 Baby Point',       province: 'ON' },
    'ON-YYZ-LEA':  { name: 'Toronto \u2013 Leaside',          province: 'ON' },
    'ON-YYZ-BEA':  { name: 'Toronto \u2013 The Beaches',      province: 'ON' },
    'ON-WTR-WTR':  { name: 'Waterloo \u2013 Uptown',          province: 'ON' },
  }

  var state = {
    theme: '',
    lineup: [],
    sessions: {},
    availableStudios: [],
    province: '',
    studioId: '',
    selectedDate: '',
    selectedProject: '',
    qty: {},
  }

  var root = document.getElementById('ww-root')

  function formatTime(t) {
    if (!t) return ''
    var parts = t.split(':')
    var h = parseInt(parts[0], 10)
    var m = parseInt(parts[1], 10)
    var ampm = h >= 12 ? 'pm' : 'am'
    var h12 = h % 12 || 12
    return h12 + (m > 0 ? ':' + (m < 10 ? '0' + m : m) : '') + ampm
  }

  function formatDate(d) {
    var parts = d.split('-')
    var dt = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]))
    var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
    var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
    return days[dt.getDay()] + ' ' + months[dt.getMonth()] + ' ' + dt.getDate()
  }

  function getStudiosForProvince(province) {
    return state.availableStudios.filter(function (sid) {
      return STUDIOS[sid] && STUDIOS[sid].province === province
    }).sort(function (a, b) {
      return STUDIOS[a].name.localeCompare(STUDIOS[b].name)
    })
  }

  function getDatesForStudio(studioId) {
    var dates = []
    Object.keys(state.sessions).forEach(function (date) {
      if (state.sessions[date][studioId]) dates.push(date)
    })
    return dates.sort()
  }

  function getSlotsForStudioDate(studioId, date) {
    if (!state.sessions[date] || !state.sessions[date][studioId]) return []
    return state.sessions[date][studioId].slots
  }

  function slotKey(slot) { return slot.session_id }

  function getQty(slot) { return state.qty[slotKey(slot)] || 1 }

  function buildRegisterUrl(slot) {
    if (!slot.register_url) return null
    var url = slot.register_url.replace('QTY', getQty(slot))
    if (state.selectedProject) {
      var proj = state.selectedProject === 'undecided' ? 'Undecided' : state.selectedProject
      url += '&attributes[Project+Preference]=' + encodeURIComponent(proj)
    }
    return url
  }

  // ── Read theme from storefront product JSON ───────────────

  function getProductHandle() {
    try {
      var canonical = window.parent.document.querySelector('link[rel="canonical"]')
      if (canonical) {
        var m = canonical.href.match(/\/products\/([^?#/]+)/)
        if (m) return m[1]
      }
      var loc = window.parent.location.pathname
      var m2 = loc.match(/\/products\/([^?#/]+)/)
      if (m2) return m2[1]
    } catch (e) {}
    return null
  }

  function fetchTheme(handle, callback) {
    // product.json doesn't return metafields, so we use the tags fallback:
    // home office adds tag "theme:Cats Week" to the storefront product.
    // This is the ONE tag still needed — just on the storefront product, not the lineup.
    fetch(SHOPIFY_STORE + '/products/' + handle + '.json')
      .then(function (r) { return r.json() })
      .then(function (data) {
        var product = data.product || {}
        var theme = ''
        // Check tags for "theme:Cats Week"
        var tags = product.tags || ''
        var tagList = typeof tags === 'string' ? tags.split(',') : tags
        tagList.forEach(function (tag) {
          var t = tag.trim()
          if (t.toLowerCase().indexOf('theme:') === 0) {
            theme = t.substring(6).trim()
          }
        })
        callback(null, theme)
      })
      .catch(function (e) { callback(e) })
  }

  // ── Fetch sessions + lineup from edge function ────────────

  function fetchData(theme, callback) {
    fetch(EDGE_FN + '?theme=' + encodeURIComponent(theme))
      .then(function (r) { return r.json() })
      .then(function (data) { callback(null, data) })
      .catch(function (e) { callback(e) })
  }

  // ── Render ────────────────────────────────────────────────

  function render() {
    root.innerHTML = ''

    // ── Lineup ──
    if (state.lineup && state.lineup.length > 0) {
      var lineupLabel = document.createElement('div')
      lineupLabel.className = 'ww-section-label'
      lineupLabel.textContent = "This week\u2019s lineup \u2014 choose your project"
      root.appendChild(lineupLabel)

      var lineupRow = document.createElement('div')
      lineupRow.className = 'ww-lineup'

      state.lineup.forEach(function (proj) {
        var card = document.createElement('div')
        card.className = 'ww-lineup-card' + (state.selectedProject === proj.name ? ' selected' : '')

        var check = document.createElement('div')
        check.className = 'ww-lineup-check'
        check.textContent = '\u2713'
        card.appendChild(check)

        if (proj.image) {
          var img = document.createElement('img')
          img.src = proj.image
          img.alt = proj.name
          card.appendChild(img)
        }

        var nameEl = document.createElement('div')
        nameEl.className = 'ww-lineup-name'
        nameEl.textContent = proj.name
        card.appendChild(nameEl)

        card.addEventListener('click', function () {
          state.selectedProject = proj.name
          render()
        })
        lineupRow.appendChild(card)
      })

      // Undecided
      var undecidedCard = document.createElement('div')
      undecidedCard.className = 'ww-lineup-card undecided' + (state.selectedProject === 'undecided' ? ' selected' : '')

      var undecidedCheck = document.createElement('div')
      undecidedCheck.className = 'ww-lineup-check'
      undecidedCheck.textContent = '\u2713'
      undecidedCard.appendChild(undecidedCheck)

      var icon = document.createElement('div')
      icon.style.cssText = "font-size: 28px !important; line-height: 1 !important;"
      icon.textContent = '\uD83E\uDD14'
      undecidedCard.appendChild(icon)

      var undecidedLabel = document.createElement('div')
      undecidedLabel.className = 'ww-lineup-name'
      undecidedLabel.textContent = "I\u2019ll decide at the studio"
      undecidedCard.appendChild(undecidedLabel)

      undecidedCard.addEventListener('click', function () {
        state.selectedProject = 'undecided'
        render()
      })
      lineupRow.appendChild(undecidedCard)
      root.appendChild(lineupRow)

      if (!state.selectedProject) {
        var note = document.createElement('div')
        note.className = 'ww-project-note'
        note.innerHTML = '<strong>Pick your project above</strong> \u2014 or choose \u201cI\u2019ll decide at the studio\u201d to book first.'
        root.appendChild(note)
        return
      }

      var hr = document.createElement('hr')
      hr.className = 'ww-divider'
      root.appendChild(hr)
    }

    // ── Province + Studio ──
    var availableProvinces = []
    var seen = {}
    state.availableStudios.forEach(function (sid) {
      if (STUDIOS[sid] && !seen[STUDIOS[sid].province]) {
        seen[STUDIOS[sid].province] = true
        availableProvinces.push(STUDIOS[sid].province)
      }
    })
    availableProvinces.sort()

    if (availableProvinces.length === 0) {
      var noStudios = document.createElement('div')
      noStudios.className = 'ww-empty'
      noStudios.textContent = 'No sessions available yet. Check back soon!'
      root.appendChild(noStudios)
      return
    }

    var selectsRow = document.createElement('div')
    selectsRow.className = 'ww-selects'

    var provWrap = document.createElement('div')
    provWrap.className = 'ww-select-wrap'
    var provLabel = document.createElement('label')
    provLabel.textContent = 'Province'
    var provSelect = document.createElement('select')
    var provDefault = document.createElement('option')
    provDefault.value = ''
    provDefault.textContent = 'Select province'
    provSelect.appendChild(provDefault)
    availableProvinces.forEach(function (p) {
      var opt = document.createElement('option')
      opt.value = p
      opt.textContent = p === 'BC' ? 'British Columbia' : p === 'AB' ? 'Alberta' : 'Ontario'
      if (state.province === p) opt.selected = true
      provSelect.appendChild(opt)
    })
    provSelect.addEventListener('change', function () {
      state.province = this.value
      state.studioId = ''
      state.selectedDate = ''
      render()
    })
    provWrap.appendChild(provLabel)
    provWrap.appendChild(provSelect)
    selectsRow.appendChild(provWrap)

    var studioWrap = document.createElement('div')
    studioWrap.className = 'ww-select-wrap'
    var studioLabel = document.createElement('label')
    studioLabel.textContent = 'Studio'
    var studioSelect = document.createElement('select')
    var studioDefault = document.createElement('option')
    studioDefault.value = ''
    studioDefault.textContent = state.province ? 'Select studio' : '\u2014 choose province first \u2014'
    studioDefault.disabled = !state.province
    studioSelect.appendChild(studioDefault)

    if (state.province) {
      getStudiosForProvince(state.province).forEach(function (sid) {
        var opt = document.createElement('option')
        opt.value = sid
        opt.textContent = STUDIOS[sid].name
        if (state.studioId === sid) opt.selected = true
        studioSelect.appendChild(opt)
      })
    }

    studioSelect.addEventListener('change', function () {
      state.studioId = this.value
      state.selectedDate = ''
      state.qty = {}
      render()
    })
    studioWrap.appendChild(studioLabel)
    studioWrap.appendChild(studioSelect)
    selectsRow.appendChild(studioWrap)
    root.appendChild(selectsRow)

    if (!state.studioId) return

    // ── Date tabs ──
    var dates = getDatesForStudio(state.studioId)
    if (dates.length === 0) {
      var noSessions = document.createElement('div')
      noSessions.className = 'ww-empty'
      noSessions.textContent = 'No sessions available for this studio.'
      root.appendChild(noSessions)
      return
    }

    if (!state.selectedDate || dates.indexOf(state.selectedDate) === -1) {
      state.selectedDate = dates[0]
    }

    var datesRow = document.createElement('div')
    datesRow.className = 'ww-dates'
    dates.forEach(function (d) {
      var tab = document.createElement('button')
      tab.className = 'ww-date-tab' + (state.selectedDate === d ? ' active' : '')
      tab.textContent = formatDate(d)
      tab.addEventListener('click', function () {
        state.selectedDate = d
        state.qty = {}
        render()
      })
      datesRow.appendChild(tab)
    })
    root.appendChild(datesRow)

    // ── Slots ──
    var slots = getSlotsForStudioDate(state.studioId, state.selectedDate)
    if (slots.length === 0) {
      var noSlots = document.createElement('div')
      noSlots.className = 'ww-empty'
      noSlots.textContent = 'No time slots for this day.'
      root.appendChild(noSlots)
      return
    }

    var slotsContainer = document.createElement('div')
    slotsContainer.className = 'ww-slots'

    slots.forEach(function (slot) {
      var row = document.createElement('div')
      row.className = 'ww-slot'

      var timeEl = document.createElement('div')
      timeEl.className = 'ww-slot-time'
      timeEl.textContent = formatTime(slot.time)
      row.appendChild(timeEl)

      var spacesEl = document.createElement('div')
      var isLow = slot.spaces_left > 0 && slot.spaces_left <= 3
      spacesEl.className = 'ww-slot-spaces' + (isLow ? ' low' : '')
      if (slot.spaces_left <= 0) {
        spacesEl.textContent = ''
      } else if (isLow) {
        spacesEl.textContent = slot.spaces_left + ' spot' + (slot.spaces_left === 1 ? '' : 's') + ' left'
      } else {
        spacesEl.textContent = slot.spaces_left + ' spots available'
      }
      row.appendChild(spacesEl)

      if (!slot.register_url || slot.spaces_left <= 0) {
        var soldOut = document.createElement('div')
        soldOut.className = 'ww-sold-out'
        soldOut.textContent = 'Sold out'
        row.appendChild(soldOut)
      } else {
        var qty = getQty(slot)
        var maxQty = Math.min(slot.spaces_left, 6)

        var qtyWrap = document.createElement('div')
        qtyWrap.className = 'ww-qty-wrap'

        var minusBtn = document.createElement('button')
        minusBtn.className = 'ww-qty-btn'
        minusBtn.textContent = '\u2212'
        minusBtn.disabled = qty <= 1
        minusBtn.addEventListener('click', function () {
          var k = slotKey(slot)
          state.qty[k] = Math.max(1, (state.qty[k] || 1) - 1)
          render()
        })

        var qtyVal = document.createElement('div')
        qtyVal.className = 'ww-qty-val'
        qtyVal.textContent = qty

        var plusBtn = document.createElement('button')
        plusBtn.className = 'ww-qty-btn'
        plusBtn.textContent = '+'
        plusBtn.disabled = qty >= maxQty
        plusBtn.addEventListener('click', function () {
          var k = slotKey(slot)
          state.qty[k] = Math.min(maxQty, (state.qty[k] || 1) + 1)
          render()
        })

        qtyWrap.appendChild(minusBtn)
        qtyWrap.appendChild(qtyVal)
        qtyWrap.appendChild(plusBtn)
        row.appendChild(qtyWrap)

        var regBtn = document.createElement('a')
        regBtn.className = 'ww-register-btn'
        regBtn.textContent = 'Register'
        regBtn.href = buildRegisterUrl(slot)
        row.appendChild(regBtn)
      }

      slotsContainer.appendChild(row)
    })

    root.appendChild(slotsContainer)
  }

  // ── Init ──────────────────────────────────────────────────

  function bootWithTheme(theme, lineup, sessions) {
    state.theme = theme
    state.lineup = lineup || []
    state.sessions = sessions || {}

    var studioSet = {}
    Object.keys(state.sessions).forEach(function (date) {
      Object.keys(state.sessions[date]).forEach(function (sid) {
        studioSet[sid] = true
      })
    })
    state.availableStudios = Object.keys(studioSet)
    render()
  }

  function init() {
    root.innerHTML = ''
    root.appendChild(renderLoading('Loading workshop...'))

    var handle = getProductHandle()
    if (!handle) {
      root.innerHTML = '<div class="ww-error">Could not detect product page. Make sure this embed is on a Shopify product page.</div>'
      return
    }

    fetchTheme(handle, function (err, theme) {
      if (err || !theme) {
        root.innerHTML = '<div class="ww-error">No theme found. Add a tag like <code>theme:Cats Week</code> to this product in Shopify.</div>'
        return
      }

      fetchData(theme, function (dataErr, data) {
        if (dataErr || !data) {
          root.innerHTML = '<div class="ww-error">Could not load sessions. Please try again.</div>'
          return
        }
        bootWithTheme(theme, data.lineup, data.sessions)
      })
    })
  }

  function renderLoading(msg) {
    var el = document.createElement('div')
    el.className = 'ww-loading'
    el.textContent = msg || 'Loading...'
    return el
  }

  window.addEventListener('load', init)
})()
</script>
</body>
</html>
